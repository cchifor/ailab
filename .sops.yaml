creation_rules:
  # Dev-worker secrets. MUST precede the generic ansible/secrets rule below: SOPS applies the FIRST
  # path-matching rule, and that rule's encrypted_regex (github_app_private_key only) would otherwise
  # leave these keys unencrypted. This specific path matches only dev-worker.sops.yaml.
  - path_regex: ansible[/\\]secrets[/\\]dev-worker\.sops\.ya?ml$ # [/\\] = WSL (/) + Windows (\) paths
    # role_id|secret_id: belt-and-braces for the nested AppRole map (dev_worker_openbao_credentials).
    # A matching ancestor key already encrypts its whole subtree, but on 2026-08-31 the nested
    # secret-ids were encrypted from a checkout whose .sops.yaml predated the dev_worker_openbao_.*
    # entry (sops silently resolved THAT config) and every leaf landed in PLAINTEXT. Matching the
    # leaf key names too means a stale rule that has this line still encrypts the credential values
    # — and always pass `sops --config` from the intended checkout when scripting.
    encrypted_regex: ^(dev_worker_restic_password|dev_worker_cf_tunnel_token|dev_worker_admin_password|dev_worker_gitea_token|dev_worker_agentforge_.*|dev_worker_openbao_.*|role_id|secret_id)$
    age: age1nfa6hhdz9egnje3nwa2k0gpk5nr29nyvu74eprk20m7ql4fhw4esrlmt5g
  # Reviewbot secrets (PR review bots — ansible/roles/pr_reviewer). Same reason as dev-worker
  # above — MUST precede the generic ansible/secrets rule.
  - path_regex: ansible[/\\]secrets[/\\]reviewbot\.sops\.ya?ml$
    encrypted_regex: ^(reviewbot_claude_pat|reviewbot_codex_pat|reviewbot_webhook_secret)$
    age: age1nfa6hhdz9egnje3nwa2k0gpk5nr29nyvu74eprk20m7ql4fhw4esrlmt5g
  # Registry secrets. Same reason as dev-worker above — MUST precede the generic ansible/secrets rule
  # (which would otherwise encrypt only github_app_private_key and leave these two keys plaintext).
  - path_regex: ansible[/\\]secrets[/\\]registry\.sops\.ya?ml$
    encrypted_regex: ^(registry_ci_password|cloudflare_dns_api_token|registry_oidc_client_secret|registry_sync_dockerhub_token)$
    age: age1nfa6hhdz9egnje3nwa2k0gpk5nr29nyvu74eprk20m7ql4fhw4esrlmt5g
  # Gitea act_runner registration token. Same reason as dev-worker/registry above — MUST precede the
  # generic ansible/secrets rule (which encrypts only github_app_private_key and would leave this
  # token plaintext).
  - path_regex: ansible[/\\]secrets[/\\]gitea-runner\.sops\.ya?ml$
    encrypted_regex: ^(gitea_runner_registration_token)$
    age: age1nfa6hhdz9egnje3nwa2k0gpk5nr29nyvu74eprk20m7ql4fhw4esrlmt5g
  # tep worker tokens (testpool SA tokens, generated by scripts/tep-render-kubeconfigs.py). Same
  # reason as dev-worker/registry/gitea-runner above — MUST precede the generic ansible/secrets rule
  # (github_app_private_key-only) or every token lands PLAINTEXT. Ancestor key `tep_tokens` encrypts
  # the whole map; the per-worker leaf names are matched too (the 2026-08-31 stale-config lesson).
  - path_regex: ansible[/\\]secrets[/\\]tep-tokens\.sops\.ya?ml$
    encrypted_regex: ^(tep_tokens|tep_cluster_ca_b64|dev-worker-[0-9]+)$
    age: age1nfa6hhdz9egnje3nwa2k0gpk5nr29nyvu74eprk20m7ql4fhw4esrlmt5g
  # Ansible secrets (host-side vars, not k8s Secrets): encrypt only the private-key value. The App
  # ID + installation ID are non-secret and live in group_vars. First match wins, so this is listed
  # before the generic rule below.
  - path_regex: ansible[/\\]secrets[/\\].*\.sops\.ya?ml$ # [/\\] = match on both WSL (/) and Windows (\) paths
    encrypted_regex: ^(github_app_private_key)$
    age: age1nfa6hhdz9egnje3nwa2k0gpk5nr29nyvu74eprk20m7ql4fhw4esrlmt5g
  # Kubernetes Secrets (Flux/SOPS): encrypt the data/stringData payload.
  - path_regex: .*\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    age: age1nfa6hhdz9egnje3nwa2k0gpk5nr29nyvu74eprk20m7ql4fhw4esrlmt5g
