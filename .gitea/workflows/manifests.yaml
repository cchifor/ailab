# Manifest validation gate — the FIRST thing in ailab that actually BUILDS every Flux
# Kustomization path and validates the result, rather than trusting `kubectl apply --dry-run` (a
# client dry-run parses YAML and never runs kustomize's own overlay/patch/generator machinery) or
# nothing at all.
#
# FAIL CLOSED, following broker-inventory.yaml and tenant-guard-cel.yaml: ONE job, no `needs:`,
# no matrix, no aggregator (the estate has already shipped a gate that could not fail —
# `join(needs.*.result, ' ')` evaluates to an EMPTY STRING on this forge's act_runner, so its loop
# body ran zero times and the gate passed unconditionally for its entire life; there is no
# cross-job result aggregation here for that bug to hide inside). No `continue-on-error`, no
# `if:` conditions, no `|| true`, no soft skips — every step is `set -euo pipefail` internally
# (scripts/manifest-lint.sh) or a bare non-zero-exits-the-job command.
#
# WHY .gitea/ AND NOT .github/: Gitea reads .gitea/workflows and, once that directory exists,
# ignores .github/workflows entirely. This repo already has five workflows here.
name: manifests

on:
  push:
  # pull_request on a self-hosted runner executes the PR head's own code (scripts/manifest-lint.sh,
  # `docker run` over its manifests) on the runner host. That is acceptable HERE because this forge
  # is closed: git.chifor.me runs with DISABLE_REGISTRATION=true, ENABLE_OPENID_SIGNUP=false and
  # REQUIRE_SIGNIN_VIEW=true (kubernetes/apps/apps/gitea/gitea.yaml), so the only accounts that can
  # open a PR are the operator-provisioned Authelia OIDC ones — there is no anonymous or external
  # contributor path. Verified LIVE, not just from the desired-state manifest (2026-09-02): an
  # anonymous GET of /api/v1/repos/cchifor/ailab is 403, /explore redirects to the login page, and
  # /user/sign_up renders "Registration is disabled". broker-inventory.yaml already runs
  # pull_request on the same pool under the same assumption. NOT gated by author on purpose: every
  # account that exists is already a trusted one, an author allowlist would be a second list to
  # keep in sync with Authelia, and this file's fail-closed idiom forbids `if:` conditions on the
  # gate (a mistyped allowlist would silently skip it). If the forge is ever opened to external
  # accounts, that is the moment to gate this trigger to trusted authors first.
  pull_request:

permissions:
  contents: read

# Supersede our own queued runs, same rationale as broker-inventory.yaml: this does not fix pool
# contention, it stops this workflow adding to it.
concurrency:
  group: manifests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: kustomize build + kubeconform
    # GITEA, NOT GITHUB: no hosted runners on this forge; every registered runner carries only
    # `self-hosted-hv`, and nothing answers `ubuntu-latest` (a job asking for it queues forever
    # rather than failing). Fall back to the real pool label if RUNNER_LABEL is ever unset.
    runs-on: ${{ vars.RUNNER_LABEL || 'self-hosted-hv' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: kustomize build + kubeconform over every Flux Kustomization path
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/manifest-lint.sh

      - name: Inline content-hash drift (checksum/capability-kids, NFS provisioner Job suffix)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-inline-hashes.py

      - name: Local embedding serving and route contracts
        run: python3 -m unittest scripts.tests.test_local_embeddings scripts.tests.test_litellm_platform_routes scripts.tests.test_ready_watchdog scripts.tests.test_env_pool_soak

      # The env-reaper's shell helpers under the DaemonSet's OWN image (busybox ash, digest-pinned in
      # the manifest) against a synthetic /proc: identity chain, PID reuse, evidence timeout,
      # thread truncation. Same fail-closed shape as manifest-lint (docker required, no soft skip).
      - name: env-reaper helpers under busybox ash
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/tests/test-env-reaper.sh

      # The warm-spread-repair script under the CronJob's OWN image with kubectl stubbed: balanced =
      # no-op, a doubled-up node loses its YOUNGEST warm member (never the oldest), NotReady/cordoned
      # nodes and a 1-replica pool are no-ops, a failed listing fails the run, dry-run deletes nothing.
      - name: warm-spread-repair under busybox ash
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/tests/test-warm-spread-repair.sh

      # The openbao-devworker-provision script under the Job's OWN image (openbao 2.6.2's busybox sh,
      # `bao` shadowed by a stub): a retired slot's revocation is complete (secret-id accessors,
      # tokens by role, role/policy, the KV subtree recursively), converges on the second run,
      # resumes after a partial failure, aborts on a failed enumeration before anything irreversible,
      # skips the retired seed, and never prints a credential value. Docker required, no soft skip.
      - name: devworker-provision RETIRED_SLOTS under the Job image
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/tests/test-devworker-provision.sh

      # The openbao-platform-pg-sync script (ADR 0028) under the CronJob's OWN image (the CNPG operand,
      # python3 + psycopg2) against a throwaway Postgres + a stub OpenBao: create / keep / rotate /
      # force / recreate / retire / keycloak-abort, RLS via the tenant GUC, read-only BY PRIVILEGE,
      # and no password in any log line. Docker required, no soft skip.
      - name: platform-pg-sync under the CronJob image
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/tests/test-platform-pg-sync.sh

      # Every dev-worker slot enumeration in the repo (AppRoles, both credential syncs, the per-slot
      # ServiceAccounts in three trees, tofu, inventory) must name the same live and retired slots —
      # a slot retirement that misses one file fails here, not as a red sync a day later.
      - name: dev-worker slot enumerations agree
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-slot-enumerations.py

      # ...and the checker itself must be able to FAIL: a consistency gate that silently stops
      # matching is worse than none. Fixtures mutate a COPY of the tree (mismatch, deletion,
      # reformat, live/retired overlap) and assert a non-zero exit each time.
      - name: the slot-enumeration gate fails closed
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/tests/test-check-slot-enumerations.sh

      # The pg-sync's OpenBao CA ConfigMap is generated from a copy of the public ailab root CA; the
      # workers pin the same PEM from the ansible role. Two copies, one truth.
      - name: ailab root CA copies are identical
        shell: bash
        run: |
          set -euo pipefail
          cmp ansible/roles/openbao_agent/files/ailab-root-ca.crt kubernetes/apps/infrastructure/platform-access/ailab-root-ca.crt

      # The three spans derived from litellm.yaml's model_list — Open WebUI's Local-group model_ids,
      # the dsh seed's provider models rows, and litellm.yaml's own checksum/config — must match what
      # the generator renders. Same fail-closed shape as the step above: a drifted span, a missing
      # interpreter or an unparseable source is a non-zero exit, never a skip. PyYAML is the runner's
      # system package (the same assumption broker-inventory.yaml's unit-test step already makes).
      - name: LiteLLM consumer drift (Open WebUI model_ids, dsh seed models, checksum/config)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gen-litellm-consumers.py --check

      # The FOURTH cross-reference out of litellm's model lists, and the only one the generator above
      # cannot see: per-tenant virtual keys whitelist model_names from litellm-LOCAL, which that
      # generator never reads (it derives its three spans from the MAIN proxy). litellm-vkeys.yaml is
      # also deliberately not Flux-applied, so no reconcile revisits it after a model is renamed, and a
      # dangling entry does not fail at seed time -- the key is created fine and then fails every
      # request. Removing qwen3.6-35b-a3b on 2026-09-16 left exactly that dangling entry and nothing
      # here noticed. Same fail-closed shape as the two steps above.
      - name: LiteLLM tenant vkey whitelists resolve against litellm-local's model_list
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-vkey-models.py

      # The FIFTH: litellm-local carries qwen3.8-27b-vllm-cloud as a DIAGNOSTIC mirror of the main
      # gateway's route (2026-09-22, ailab #822) so a dev worker holding the fleet's virtual key can
      # replay a production LLM failure through a gateway. That is evidence only while the two pairs
      # stay identical modulo litellm-local's synthetic cost fields -- and the lockstep was a comment
      # until reviewer-claude pointed out that nothing here compared them. The test proves the
      # checker bites (drift, missing cost, missing route); the checker then runs on the tree.
      - name: LiteLLM diagnostic routes on litellm-local mirror the main gateway
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/tests/test-check-litellm-mirrored-routes.sh
          python3 scripts/check-litellm-mirrored-routes.py
