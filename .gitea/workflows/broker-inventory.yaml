# Broker inventory drift check — the FIRST CI in this repo.
#
# ailab had zero status checks on every PR until now. This deliberately stays a single check and
# nothing else: it verifies that every value derived from the broker seat inventory still agrees
# with the broker manifests that declare it. It is not the seed of a general CI suite.
#
# WHY .gitea/ AND NOT .github/: Gitea reads .gitea/workflows and, once that directory exists,
# ignores .github/workflows entirely. ailab has no .github/workflows, so nothing is masked here.
#
# FAIL CLOSED — the point of this file.
#   * ONE job, no `needs:`, no matrix, no aggregator. The estate has already shipped a
#     gate that could not fail: `ci-gate` in the sibling repos looped over
#     `join(needs.*.result, ' ')`, which evaluates to an EMPTY STRING on Gitea's act_runner, so the
#     loop body ran zero times and the gate passed unconditionally for its entire life. There is no
#     result aggregation here at all, so that failure mode has nowhere to live: the check's exit
#     status IS the script's exit status. The steps below are sequential within that one job, so
#     each still fails the job directly — the invariant is "no cross-job result aggregation", not a
#     step count. (This said "ONE step" until the generator grew unit tests; a second step in the
#     same job cannot reintroduce the aggregation bug, while tests that CI never runs guard nothing.)
#   * No `continue-on-error`, no `if:` conditions, no `|| true`, no soft skips. A missing
#     interpreter, an unreadable manifest, a source that does not parse — every one of those is a
#     non-zero exit from the script, which fails the job.
#   * `set -euo pipefail` so a failure inside a multi-command step cannot be swallowed.
#
# Proven red before it was trusted green: hand-editing one derived value (a broker URL in the
# control plane's AFP_BROKER_READYZ_URLS) makes this exit 1 with a diff; reverting makes it pass.
name: broker-inventory

on:
  # PUSH ON EVERY BRANCH, not just main. The pull_request run is the gate we
  # want, but on this forge it is the run least likely to be served (see the
  # concurrency note below), and a drift caught only after merge is a drift
  # caught too late. A feature-branch push uses the SAME event type that is
  # demonstrably served here, so it gives a pre-merge signal even when the
  # pull_request run never starts.
  push:
  pull_request:

permissions:
  contents: read

# Supersede our own queued runs. This does NOT fix pool contention — it stops
# this workflow ADDING to it: without a group, every push to a branch leaves
# its predecessor queued behind the newer one, and on a saturated pool those
# stale runs sit until a sweep cancels them (21 of 28 pull_request runs were
# swept that way, `started_at` still at the epoch — they never ran at all).
concurrency:
  group: broker-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: broker inventory drift
    # GITEA, NOT GITHUB: there are no hosted runners on this forge. Every
    # registered runner (ci-runner-1..5, org-scoped) carries exactly one
    # label, `self-hosted-hv`, and NOTHING answers `ubuntu-latest` — a job
    # asking for it queues forever rather than failing (the platform #722
    # orphaned-push-guard sat unserved for its entire life that way).
    # So the fallback must be a label that exists: if `vars.RUNNER_LABEL`
    # is ever unset or renamed, this degrades to the real pool instead of
    # to a label no runner offers.
    runs-on: ${{ vars.RUNNER_LABEL || 'self-hosted-hv' }}
    # Starvation must be LOUD. Without this a job that is never assigned a
    # runner lingers until a bulk sweep marks it `cancelled`, which reads as
    # benign in the run list; the check's own header promises it fails
    # closed, and a silent cancel is the one outcome that breaks that promise.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check derived broker values against the broker manifests
        shell: bash
        run: |
          set -euo pipefail
          # Resolve an interpreter explicitly and FAIL if there is none — never skip.
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          elif command -v python >/dev/null 2>&1; then
            PY=python
          else
            echo "no python3/python on the runner — failing closed rather than skipping the gate"
            exit 1
          fi
          "$PY" --version
          "$PY" scripts/gen-broker-inventory.py --check

      # The generator's own unit tests. These existed before this step did and ran NOWHERE, which
      # made them documentation rather than a guard — the seed-coverage record's parsing in
      # particular has already regressed once (a file-wide regex swept missingOauthPaths back in as
      # declared, and the record oscillated between two states on successive runs). Stdlib
      # unittest only; no dependency to install.
      - name: Script unit tests
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          elif command -v python >/dev/null 2>&1; then
            PY=python
          else
            echo "no python3/python on the runner — failing closed rather than skipping the tests"
            exit 1
          fi
          "$PY" -m unittest discover -s scripts/tests -p "test_*.py" -v
