# SOPS-encrypted dev-worker secrets. Loaded by ansible/dev-workers.yml pre_task whenever this file
# exists → roles/dev_worker/tasks/git_forge.yml writes each user's ~/.git-credentials for git.chifor.me.
# dev_worker_gitea_token: a `dev-worker-bot` Gitea PAT (NON-admin user, org team `automation`) —
# write:repository,write:issue,read:organization,read:user. NEVER a `chifor` token: chifor is the owner
# and a Gitea site admin, and owner-gated merges must not be reachable by unattended automation
# (ailab plan 2026-10-06-s2s-identity-openbao, D1). Rotate in-pod with the EXPLICIT username, e.g.
# `gitea admin user generate-access-token --username dev-worker-bot --token-name dev-workers-<date> #  --scopes write:repository,write:issue,read:organization,read:user --raw`, then re-seed (this file AND
# devworker-seeds.sops.yaml) and revoke the old token. Template: *.example.
