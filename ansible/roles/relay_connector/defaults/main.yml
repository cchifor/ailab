---
relay_connector_enabled: false
# false stages files only when the selected connector service is stopped.
relay_connector_manage_service: false
relay_connector_user: ""
relay_connector_group: "{{ relay_connector_primary_group }}"
relay_connector_home: "{{ ansible_facts['getent_passwd'][relay_connector_user][4] }}"
relay_connector_unit_dir: "{{ relay_connector_home }}/.config/systemd/user"
relay_connector_artifact_dir: /opt/relay/connector
relay_connector_artifact_owner: root
relay_connector_artifact_group: root
# Controller-local release binary. Never build or resolve 'latest' on the worker.
relay_connector_source: ""
relay_connector_arch: ""
relay_connector_origin: https://relay.chifor.me
relay_connector_host_id: ""
relay_connector_state_file: ""
# Exact existing service settings, reviewed per worker; never written to identity.
relay_connector_name: ""
relay_connector_sockets: []
# v0.7.2 release manifest observed 2026-10-15; change through release review.
relay_connector_release:
  version: 0.7.2
  sourceCommit: af901bb8621970b20cb77b83365241ea1b22b17c
  sha256:
    amd64: d75e9439cec0a31bb6c84c9cca204a7121b93131c0e22d685c6b4c7c41677dcc
    arm64: 3472334e1d141b7afb442f3061db0f5a70a289f1ce1f2b796b3740b6279d2ea2
