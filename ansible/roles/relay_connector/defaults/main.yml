---
relay_connector_enabled: false
# false stages files only when the selected connector service is stopped.
relay_connector_manage_service: false
relay_connector_user: ""
relay_connector_group: "{{ relay_connector_primary_group }}"
relay_connector_home: "{{ ansible_facts['getent_passwd'][relay_connector_user][4] }}"
relay_connector_unit_dir: "{{ relay_connector_home }}/.config/systemd/user"
relay_connector_artifact_dir: /opt/relay/connector
relay_connector_artifact_owner: root
relay_connector_artifact_group: root
# Controller-local release binary. Never build or resolve 'latest' on the worker.
relay_connector_source: ""
relay_connector_arch: ""
relay_connector_origin: https://relay.chifor.me
relay_connector_host_id: ""
relay_connector_state_file: ""
# Exact existing service settings, reviewed per worker; never written to identity.
relay_connector_name: ""
relay_connector_sockets: []
# Relay messaging for the execution user's Claude Code sessions (tasks/claude.yml): the connector's
# `mcp` stdio server registered at user scope as `relay`, plus a UserPromptSubmit hook running
# `inbox-hint`. `unmanaged` leaves both alone; `present` needs a 0.8.x release pin (0.9.0 removed
# both); `absent` removes both and keeps everything else the user configured. Whatever the state, a
# 0.9.0 or later pin is refused while the user's settings.json still holds the inbox-hint hook
# (tasks/legacy_hook_preflight.yml).
relay_connector_claude_messaging: unmanaged
# The user's Claude Code CLI. Only it writes ~/.claude.json; running sessions rewrite that file too.
relay_connector_claude_bin: "{{ relay_connector_home }}/.npm-global/bin/claude"
# Seconds Claude Code waits for `inbox-hint` before continuing the prompt without it (it answers in
# under 300 ms and never fails the prompt).
relay_connector_claude_hook_timeout: 2
# v0.9.0 release manifest (run 120163) observed 2026-11-04; change through release review.
relay_connector_release:
  version: 0.9.0
  sourceCommit: e71399f29c68d1a19cb6594dad4c1d125624b14e
  sha256:
    amd64: 402f8d36bfa24469c92617937b009ddbfa656aeba62bf7bfd202a31f8b0e97d1
    arm64: d675fc3ccf1a94ee1324affefc77c5e9568ade78d193d9a160d9bd61489f532a
