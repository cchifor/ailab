---
# Relay messaging for the execution user's Claude Code sessions (docs/runbooks/relay-connectors.md,
# "Claude Code messaging"). Imported at the end of configure.yml, so the pinned binary is installed
# and its --version verified before anything here points at it. claude_preflight.yml (the end of
# validate.yml) already planned the MCP change, checked the CLI and dry-ran the settings.json merge
# before any write.
#
# Two files the USER owns, each changed only through a writer that preserves the rest:
#   * ~/.claude.json holds the user-scope MCP servers. Running Claude sessions rewrite it, so the
#     role only reads it and changes it through the user's own `claude mcp` CLI. Never
#     /etc/claude-code/managed-mcp.json: that file is exclusive and would disable every MCP server
#     the user added (and managedMcpServers takes https servers only).
#   * ~/.claude/settings.json holds hooks among the user's own settings. files/claude_relay_hook.py
#     replaces only Relay's inbox-hint entry.
# Order: the MCP change, then the hook, in one block. If any step fails, the rescue puts the MCP
# server back as it was before this run and stops, so a failed run leaves neither half changed.
# These tasks restart nothing (not the connector, tmux or an agent): a Claude session reads both
# files when it starts.

- name: Report the relay MCP change a real run would make
  ansible.builtin.debug:
    msg: Would {{ mcp_change }} the user-scope relay MCP server for {{ relay_connector_user }}.
  changed_when: true
  when: ansible_check_mode and (relay_connector_claude_mcp_remove or relay_connector_claude_mcp_add)
  vars:
    mcp_change: >-
      {{ 'remove' if not relay_connector_claude_mcp_add
         else ('replace' if relay_connector_claude_mcp_remove else 'register') }}

- name: Report the Relay inbox hook change a real run would make
  ansible.builtin.command:
    argv: "{{ relay_connector_claude_hook_argv + ['--check'] }}"
    stdin: "{{ lookup('ansible.builtin.file', 'claude_relay_hook.py') }}"
  become: true
  become_user: "{{ relay_connector_user }}"
  environment:
    HOME: "{{ relay_connector_home }}"
  check_mode: false
  register: relay_connector_claude_hook_check
  changed_when: relay_connector_claude_hook_check.stdout | trim == 'changed'
  when: ansible_check_mode

- name: Change the relay MCP server and then the hook, undoing the MCP change if either fails
  when: not ansible_check_mode
  become: true
  become_user: "{{ relay_connector_user }}"
  environment:
    HOME: "{{ relay_connector_home }}"
  block:
    # `add-json` refuses a name that already exists, so a stale entry goes first.
    - name: Remove the user-scope relay MCP server
      ansible.builtin.command:
        argv: ["{{ relay_connector_claude_bin }}", mcp, remove, --scope, user, relay]
        chdir: "{{ relay_connector_home }}"
      register: relay_connector_claude_mcp_removed
      when: relay_connector_claude_mcp_remove

    - name: Register the pinned connector as the user-scope relay MCP server
      ansible.builtin.command:
        argv:
          - "{{ relay_connector_claude_bin }}"
          - mcp
          - add-json
          - --scope
          - user
          - relay
          - "{{ relay_connector_claude_mcp | to_json }}"
        chdir: "{{ relay_connector_home }}"
      register: relay_connector_claude_mcp_added
      when: relay_connector_claude_mcp_add

    # Commits the merge the preflight dry-ran; writes only on change.
    - name: Converge the Relay inbox hook in the user's Claude Code settings
      ansible.builtin.command:
        argv: "{{ relay_connector_claude_hook_argv }}"
        stdin: "{{ lookup('ansible.builtin.file', 'claude_relay_hook.py') }}"
      register: relay_connector_claude_hook
      changed_when: relay_connector_claude_hook.stdout | trim == 'changed'

  rescue:
    - name: Remove the relay MCP server this run registered
      ansible.builtin.command:
        argv: ["{{ relay_connector_claude_bin }}", mcp, remove, --scope, user, relay]
        chdir: "{{ relay_connector_home }}"
      register: relay_connector_claude_mcp_unadded
      failed_when: false
      when:
        - relay_connector_claude_mcp_added is defined
        - relay_connector_claude_mcp_added is succeeded
        - relay_connector_claude_mcp_added is changed

    - name: Restore the relay MCP server this run removed
      ansible.builtin.command:
        argv:
          - "{{ relay_connector_claude_bin }}"
          - mcp
          - add-json
          - --scope
          - user
          - relay
          - "{{ relay_connector_claude_mcp_previous | to_json }}"
        chdir: "{{ relay_connector_home }}"
      register: relay_connector_claude_mcp_restored
      failed_when: false
      no_log: true  # The user's definition may carry env secrets.
      when:
        - relay_connector_claude_mcp_removed is defined
        - relay_connector_claude_mcp_removed is succeeded
        - relay_connector_claude_mcp_removed is changed
        - relay_connector_claude_mcp_previous is mapping
        - relay_connector_claude_mcp_previous | length > 0
        - relay_connector_claude_mcp_unadded is skipped or relay_connector_claude_mcp_unadded.rc == 0

    - name: Stop after the failed Claude Code messaging change
      ansible.builtin.fail:
        msg: >-
          Changing Claude Code messaging for {{ relay_connector_user }} failed at
          '{{ ansible_failed_task.name }}': {{ (ansible_failed_result.stderr | default('', true)
          or ansible_failed_result.msg | default('')) | trim }}. {{ undo_note }}
          settings.json was not changed. Fix the cause and converge again.
      vars:
        undo_added: >-
          {{ relay_connector_claude_mcp_added is defined and relay_connector_claude_mcp_added is succeeded
             and relay_connector_claude_mcp_added is changed }}
        undo_removed: >-
          {{ relay_connector_claude_mcp_removed is defined and relay_connector_claude_mcp_removed is succeeded
             and relay_connector_claude_mcp_removed is changed }}
        undone: >-
          {{ (not undo_added or relay_connector_claude_mcp_unadded.rc | default(1) == 0)
             and (not undo_removed or relay_connector_claude_mcp_restored.rc | default(1) == 0) }}
        undo_failed: >-
          Putting the relay MCP server back failed too: check it with claude mcp get relay and
          re-add the previous definition with claude mcp add-json --scope user relay.
        undo_note: >-
          {{ 'No MCP change had been made, so nothing needed undoing.'
             if not (undo_added or undo_removed)
             else ('The relay MCP server was put back as it was before this run.'
                   if undone else undo_failed) }}
