---
# Read-only half of Relay messaging for Claude Code (docs/runbooks/relay-connectors.md, "Claude
# Code messaging"). Imported at the END of validate.yml, so it runs before anything on the worker
# changes: the binary, the unit, the service and both Claude Code files. It plans the MCP change,
# proves the CLI that would make it is usable, and dry-runs the settings.json merge. tasks/claude.yml
# then applies the plan after the binary is installed and its version verified.

- name: Reject an unsafe Claude Code path or hook timeout
  ansible.builtin.assert:
    that:
      - relay_connector_claude_bin is match('^/[A-Za-z0-9_-]+(/[A-Za-z0-9_.-]+)*$')
      - "'/../' not in relay_connector_claude_bin + '/' and '/./' not in relay_connector_claude_bin + '/'"
      - (relay_connector_claude_hook_timeout | string) is match('^[1-9][0-9]?$')
    quiet: true
    fail_msg: relay_connector_claude_bin must be a plain absolute path and relay_connector_claude_hook_timeout 1-99 seconds.

- name: Derive the pinned connector's Claude Code entry points
  ansible.builtin.set_fact:
    relay_connector_claude_mcp:
      type: stdio
      command: "{{ relay_connector_artifact_dir }}/{{ relay_connector_sha }}/relay-connector"
      args: [--state, "{{ relay_connector_state_file }}", mcp]
    # files/claude_relay_hook.py, piped to the user's python3: argv, no shell, nothing left behind.
    relay_connector_claude_hook_argv:
      - /usr/bin/python3
      - "-"
      - --settings
      - "{{ relay_connector_home }}/.claude/settings.json"
      - --state
      - "{{ relay_connector_claude_messaging }}"
      - --command
      - "{{ relay_connector_artifact_dir }}/{{ relay_connector_sha }}/relay-connector --state {{ relay_connector_state_file }} inbox-hint"
      - --timeout
      - "{{ relay_connector_claude_hook_timeout | int | string }}"

- name: Inspect the user's Claude Code configuration
  ansible.builtin.stat:
    path: "{{ relay_connector_home }}/.claude.json"
  become: true
  become_user: "{{ relay_connector_user }}"
  register: relay_connector_claude_config_stat

# ~/.claude.json carries account details, and an API key on a key login: never display it.
- name: Read the user's Claude Code configuration
  ansible.builtin.slurp:
    src: "{{ relay_connector_home }}/.claude.json"
  become: true
  become_user: "{{ relay_connector_user }}"
  register: relay_connector_claude_config
  no_log: true
  when: relay_connector_claude_config_stat.stat.exists

# A missing file means no user-scope servers yet. One that does not parse fails here, with the JSON
# error and not its content. The CLI stores exactly type/command/args, so those are compared.
- name: Plan the user-scope relay MCP change
  ansible.builtin.set_fact:
    relay_connector_claude_mcp_remove: "{{ ('relay' in servers) and not (wanted and matches) }}"
    relay_connector_claude_mcp_add: "{{ wanted and not matches }}"
  vars:
    wanted: "{{ relay_connector_claude_messaging == 'present' }}"
    config: >-
      {{ (relay_connector_claude_config.content | b64decode | from_json)
         if relay_connector_claude_config.content is defined else {} }}
    servers: >-
      {{ config.mcpServers
         if config is mapping and config.mcpServers is defined and config.mcpServers is mapping
         else {} }}
    matches: >-
      {{ servers.relay is defined and servers.relay is mapping
         and (servers.relay.type | default('stdio')) == relay_connector_claude_mcp.type
         and (servers.relay.command | default('')) == relay_connector_claude_mcp.command
         and (servers.relay.args | default([])) == relay_connector_claude_mcp.args }}

# Whatever this run removes (a replacement removes before it adds, since add-json refuses an
# existing name; `absent` only removes). If a later step fails, claude.yml puts this definition
# back. It is the user's, so it may carry env secrets.
- name: Keep the definition this run would remove
  ansible.builtin.set_fact:
    relay_connector_claude_mcp_previous: >-
      {{ (relay_connector_claude_config.content | b64decode | from_json).mcpServers.relay
         if relay_connector_claude_mcp_remove else {} }}
  no_log: true

- name: Release the Claude Code configuration bytes
  ansible.builtin.set_fact:
    relay_connector_claude_config: {}
  no_log: true

# As the user, not as root: root may execute a file its owner cannot. Only needed when the plan
# changes the MCP entry; `absent` with nothing registered works without Claude Code installed.
- name: Inspect the Claude Code CLI as the user who runs it
  ansible.builtin.stat:
    path: "{{ relay_connector_claude_bin }}"
    follow: true  # The npm prefix's bin/claude is a symlink into lib/node_modules.
  become: true
  become_user: "{{ relay_connector_user }}"
  register: relay_connector_claude_bin_stat
  when: relay_connector_claude_mcp_remove or relay_connector_claude_mcp_add

- name: Require a Claude Code CLI the user can run before changing the relay MCP server
  ansible.builtin.assert:
    that:
      - relay_connector_claude_bin_stat.stat.isreg | default(false)
      - relay_connector_claude_bin_stat.stat.executable | default(false)
    quiet: true
    fail_msg: >-
      {{ relay_connector_user }} cannot run a Claude Code CLI at {{ relay_connector_claude_bin }},
      which is needed to {{ 'register' if relay_connector_claude_mcp_add else 'remove' }} the relay
      MCP server. Install Claude Code for the user (the dev_worker role does) or set
      relay_connector_claude_bin.
  when: relay_connector_claude_mcp_remove or relay_connector_claude_mcp_add

# Dry run of the settings.json merge, as the user: an unparsable or misshapen file, one a rewrite
# could not keep (another owner, a group the user is not in, a POSIX ACL, a directory default ACL),
# or a change the user could not write (directory or file not writable) fails here.
- name: Dry-run the Relay inbox hook merge in the user's Claude Code settings
  ansible.builtin.command:
    argv: "{{ relay_connector_claude_hook_argv + ['--check'] }}"
    stdin: "{{ lookup('ansible.builtin.file', 'claude_relay_hook.py') }}"
  become: true
  become_user: "{{ relay_connector_user }}"
  environment:
    HOME: "{{ relay_connector_home }}"
  check_mode: false
  changed_when: false
