---
# Starts onboot guests whose NFS storage was late at boot: containers with a /mnt/pve bind mount,
# and VMs with a disk on an NFS storage (the Talos control planes, ADR 0043).
# files/pve-nfs-guest-autostart.sh has the why.
- name: Install the late-NFS guest starter
  ansible.builtin.copy:
    src: pve-nfs-guest-autostart.sh
    dest: /usr/local/sbin/pve-nfs-guest-autostart
    owner: root
    group: root
    mode: "0755"

- name: Install its unit
  ansible.builtin.copy:
    src: pve-nfs-guest-autostart.service
    dest: /etc/systemd/system/pve-nfs-guest-autostart.service
    owner: root
    group: root
    mode: "0644"

# Enabled, not started: it is a once-per-boot pass, and on a running host every onboot
# guest it could act on is already up.
- name: Enable it for the next boot
  ansible.builtin.systemd:
    name: pve-nfs-guest-autostart.service
    enabled: true
    daemon_reload: true
