---
# Most pve_base settings live in group_vars/all.yml; defaults here are fallbacks.
pve_use_no_subscription_repo: true
pve_disable_enterprise_repo: true
pve_pin_kernel: false
pve_pinned_kernel: ""
pve_base_packages: [bolt, iperf3, ethtool, fio, nfs-common, chrony, curl, jq, irqbalance]

# Kernel cmdline (legacy GRUB — all ai nodes boot via update-grub; proxmox-boot-tool manages no ESPs
# here). Default matches node1/2 stock. node3 overrides in host_vars to add the Thunderbolt/USB4
# PCIe-tunnel boot params its TB->10G storage NIC needs to enumerate (see host_vars/ai-node3.yml).
pve_grub_cmdline_linux_default: "quiet"

# The LVM thin pool's fill as node_exporter textfile metrics (tag thin_textfile; files/pve-thin-textfile.sh):
# the pool's data and metadata use, and each thin volume's size and allocation, every 2 min, read-only (`lvs`).
# On 2026-11-20 about 1.1 TiB of the three pools was freed-but-untrimmed space and nothing showed it; a full
# pool fails every guest's writes on the host. The alerts: kubernetes/apps/infrastructure/monitoring/
# thin-pool-rules.yaml. Off = the timer, the script and the metrics file are removed.
pve_thin_textfile_enabled: true
pve_thin_textfile_pools: ["{{ pve_thin_pool }}"]
pve_thin_textfile_dir: /var/lib/prometheus/node-exporter

# LVM thin-pool zeroing: the `zero` flag on the pool that holds the guests' disks (local-lvm).
# With it ON, the first write to a newly provisioned 64 KiB chunk zero-fills the rest of the chunk.
# These drives have no Write Zeroes (write_zeroes_max_bytes = 0), so the zeros are real NAND writes.
# The runner VMs mount / with online `discard` (the Ubuntu cloud-image default), so freed chunks go
# back to the pool all day and get zeroed again on reuse. Measured 2026-11-17: ~0.7 TB/day of the
# ~9.4 TB/day across all three drives (~0.5-0.6 of it on node1/2), with node1/2's drives at 89%/85%
# of rated life.
# OFF trades isolation for wear. When a guest partially writes a newly provisioned chunk, the rest of
# that chunk is NOT zeroed, so a guest with raw-disk access can read whatever another guest (or a
# deleted volume) left in those sectors. Reading a wholly unprovisioned chunk still returns zeros.
# Guest discard does not substitute for zeroing. Turning zeroing back ON does not scrub chunks that
# were provisioned while it was off. So ON is the default, and only hosts that run our own workloads
# opt out in host_vars (ai-node1/2). node3 keeps it: the gVisor relay-worker pool runs there, and gVisor
# does not replace storage isolation.
# The flag lives in the VG metadata and survives reboots. lvchange applies it ONLINE by reloading the
# pool's table: LVM suspends the pool (and its active thin volumes), commits, and resumes, so guest I/O
# pauses briefly. Roll out one host at a time: docs/runbooks/node-maintenance.md "Thin-pool zeroing".
pve_thin_pool: pve/data
pve_thin_pool_zero: true

# Nightly trim of the containers' volumes (tag lxc_fstrim; files/pve-lxc-fstrim.sh has the how).
# The host's fstrim.timer never reaches an LXC's volumes, so what a container frees stays allocated in
# pve/data: on 2026-11-20 the LLM containers held 62 GiB (5002, ai-node2) and 134 GiB (5003, ai-node3) of
# freed-but-untrimmed blocks, mostly from model swaps on /models-local. Every night, from the host only,
# the sweep trims the rootfs and mpN volumes of every RUNNING container on these storages, one volume at
# a time, through scripts/lxc-fstrim-chunked.sh (installed as /usr/local/sbin/lxc-fstrim-chunked.sh, the
# same path ai-node1's weekly registry trim runs): chunked, waiting out host IO pressure, with a
# deadline. ext4 skips block groups it has trimmed since the mount, so a night that runs out of time is
# continued by the next one, and a quiet night costs a few seconds per volume.
# OFF by default; host_vars turns it on per host with its own slot. Off again = the kill switch: the timer
# and the sweep are removed (the inner script stays: the registry unit uses it). `touch
# /run/lxc-fstrim-chunked.stop` stops a running sweep and the registry trim.
# docs/runbooks/node-maintenance.md "LXC volume trim (nightly)".
pve_lxc_fstrim_enabled: false
pve_lxc_fstrim_storages: [local-lvm]
# Container ids the sweep never touches (a container with its own trim unit; none today: CT 5004's weekly unit
# went with 5004 on 2026-11-22, and the registry CT 5005 is in ai-node3's sweep).
pve_lxc_fstrim_exclude: []
# The slot, HH:MM UTC (quoted: YAML 1.1 reads an unquoted 04:30 as a number). The timer starts the sweep
# there, every day; no chunk starts after start + run_max_min (less one chunk's worst case). The hosts'
# slots must not overlap, nor run past 05:30, counting the unit's whole stop allowance:
# scripts/tests/test_pve_lxc_fstrim_schedule.py checks every host's slot.
pve_lxc_fstrim_start: "04:30"
pve_lxc_fstrim_run_max_min: 13
# lxc-fstrim-chunked.sh's settings for the sweep. A 4 GiB chunk is ~1.5 min of TRIM at the measured worst
# (23 s per GiB); SEC_PER_GB (30) costs it for the deadline. A chunk that trimmed nothing is followed by
# the 1 s idle pause, not the 15 s one, so a volume with nothing new to trim is walked quickly.
pve_lxc_fstrim_chunk_gb: 4
pve_lxc_fstrim_pause_s: 15
pve_lxc_fstrim_pause_idle_s: 1
pve_lxc_fstrim_sec_per_gb: 30
pve_lxc_fstrim_psi_max: 45
# The longest wait for host IO pressure before one chunk; the deadline ends a wait earlier.
pve_lxc_fstrim_psi_wait_max_s: 600
# node_exporter's textfile directory (the Debian package reads it by default; see pve_ec_fan).
pve_lxc_fstrim_textfile_dir: /var/lib/prometheus/node-exporter

# Host writeback bounds (ADR 0042, 2026-11-19). The CI runner and reviewer disks run cache=unsafe, so their
# writes land in this host's page cache and the kernel writes them back later. With the stock ratios
# (dirty 20% / background 10% of available memory, ~20-25 GiB free here) a runner could build a multi-GiB
# dirty backlog and flush it in one burst onto the NVMe that the node's etcd member shares. Absolute byte
# limits keep writeback early and small. Setting *_bytes zeroes the matching *_ratio (the kernel keeps one
# of each pair).
pve_base_writeback_sysctl:
  vm.dirty_background_bytes: 268435456 # 256 MiB: background writeback starts here
  vm.dirty_bytes: 2147483648 # 2 GiB: writers are throttled above this

# Boot-order guard for onboot VMs whose disks live on NFS (tag nfs_disk_gate; files/pve-nfs-disk-gate.sh).
# Since 2026-11-20 the three Talos control-plane disks are on qnap-nfs (ADR 0043). pve-guests starts the onboot
# guests once per boot and never retries, and PVE refuses a VM whose storage is offline. The storage link comes
# up during boot, and after a power cut the NAS served NFS ~6 min after the hosts (2026-10-30). So a CP could
# stay down until someone started it by hand. The gate is an ExecStartPre of pve-guests. It waits until each
# listed storage that holds an onboot VM's disk on this host is mounted, writable and serving that disk, for at
# most pve_nfs_disk_gate_timeout_s, and then pve-guests starts every guest as before. It never fails pve-guests.
# - The wait holds back every guest on the host, but only while the share is not ready: a reboot with the NAS up
#   passes in seconds. A host with no onboot VM on these storages passes at once. 600 s covers the ~6 min the NAS
#   took after the 2026-10-30 power cut; it is also (to the second) the longest a local-only guest waits.
# - After a timeout the CPs are STARTED ANYWAY (left to pve-guests), not skipped:
#   * PVE's own `qm start` checks the storage first (rpcinfo, 10 s, then a TCP ping to 2049) and fails the start
#     with "storage 'qnap-nfs' is not online". So it never boots a CP against a missing disk, and with the NAS down
#     "start anyway" IS a skip, done by PVE (Storage.pm activate_storage, read on PVE 9.2.2).
#   * If the share came back after the deadline, the CP starts with no operator. A skip would leave it down.
#   * It holds no local-only guest: PVE 9.2's startall starts guests in parallel worker slots (up to 8 here), and
#     no guest on these hosts has a startup order, so a CP start stuck on a hung share takes one slot.
#   * A skip has no clean mechanism: it needs an override of the stock ExecStart (startall --vms) or a boot
#     script writing onboot or a lock into /etc/pve, which is cluster-wide and owned by tofu.
#   A CP that PVE refused stays stopped: `qm start <vmid>` once the share is back (the WARNING says so).
# Off = the script and the drop-in are removed. Either way it takes effect at the next boot.
pve_nfs_disk_gate_enabled: true
pve_nfs_disk_gate_storages: [qnap-nfs]
pve_nfs_disk_gate_timeout_s: 600
