---
- name: Show host context
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} — Debian {{ ansible_distribution_release }}, kernel {{ ansible_kernel }}"

# ---- APT repositories (homelab: no enterprise subscription) ----
- name: Find the PVE enterprise repo list (PVE 8 bookworm)
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/pve-enterprise.list
  register: pve_base_enterprise_list
  when:
    - pve_disable_enterprise_repo | bool
    - ansible_distribution_release == 'bookworm'
  tags: [repos]

- name: Disable PVE enterprise repo (list format / PVE 8 bookworm)
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/pve-enterprise.list
    regexp: '^(deb\s+.*enterprise.*)$'
    replace: '# \1'
  when:
    - pve_disable_enterprise_repo | bool
    - ansible_distribution_release == 'bookworm'
    - pve_base_enterprise_list.stat.exists | default(false)
  tags: [repos]

# PVE 9 ships these deb822 files with NO `Enabled:` line. The earlier task replaced an existing line, matched
# nothing and, hidden by failed_when: false, left both enterprise repos on: every `apt update` failed with 401
# (found 2026-11-19 when pve_ec_fan's apt task failed on ai-node1). lineinfile replaces an existing `Enabled:`
# line, or inserts one right after the first `Types:` line, so it lands INSIDE the stanza (appended at EOF after
# a trailing blank line it would start a stanza of its own and disable nothing). These files hold one stanza;
# lineinfile edits one line, so a multi-stanza file would only have its first stanza disabled.
# A PVE or Ceph upgrade may rewrite these files (node1's ceph.sources became ceph-tentacle): re-run
# `ansible-playbook site.yml --tags repos` after one.
- name: Find the PVE/Ceph enterprise repo files (deb822 / PVE 9 trixie)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/apt/sources.list.d/pve-enterprise.sources
    - /etc/apt/sources.list.d/ceph.sources
  register: pve_base_enterprise_sources
  when: pve_disable_enterprise_repo | bool
  tags: [repos]

- name: Disable the PVE/Ceph enterprise repos (deb822 / PVE 9 trixie)
  ansible.builtin.lineinfile:
    path: "{{ item.item }}"
    regexp: '^Enabled:'
    line: 'Enabled: false'
    insertafter: '^Types:'
    firstmatch: true
    create: false
  loop: "{{ pve_base_enterprise_sources.results | default([]) | selectattr('stat', 'defined') | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"
  when: pve_disable_enterprise_repo | bool
  tags: [repos]

- name: Add PVE no-subscription repo (bookworm / PVE 8)
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/pve {{ ansible_distribution_release }} pve-no-subscription"
    filename: pve-no-subscription
    state: present
  when:
    - pve_use_no_subscription_repo | bool
    - ansible_distribution_release == 'bookworm'
  tags: [repos]

- name: Add PVE no-subscription repo (trixie / PVE 9, deb822)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-no-subscription.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ ansible_distribution_release }}
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
  when:
    - pve_use_no_subscription_repo | bool
    - ansible_distribution_release == 'trixie'
  tags: [repos]

- name: APT update
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: [repos]

# ---- base packages + time sync ----
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ pve_base_packages }}"
    state: present

- name: Ensure chrony is running
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

# Spread NIC RX interrupts across cores. Without it the AQC113/atlantic 10G NIC on node3 (PCIe-tunnelled
# over USB4) lands all RX softirq on a single core, which saturates and caps NFS reads ~300 MB/s. Helps
# multi-flow reads; the per-flow / per-packet ceiling is addressed by jumbo frames (storage_mtu).
- name: Ensure irqbalance is running
  ansible.builtin.service:
    name: irqbalance
    state: started
    enabled: true

# ---- kernel cmdline (legacy GRUB) ----
# All ai nodes boot via GRUB (proxmox-boot-tool manages no ESPs here), so the kernel cmdline lives in
# /etc/default/grub + `update-grub`. Declarative + idempotent: node1/2 keep stock "quiet"; node3 adds
# the Thunderbolt/USB4 PCIe-tunnel params (thunderbolt.host_reset=false pcie_aspm=off thunderbolt.clx=0)
# — without them its TB->10G storage NIC won't enumerate (retimer-disconnect loop). See ai-node3 host_vars.
- name: Set GRUB kernel cmdline (GRUB_CMDLINE_LINUX_DEFAULT)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="{{ pve_grub_cmdline_linux_default }}"'
    state: present
  notify: pve_base update-grub

# ---- kernel pin (after discovery; guards against silent upgrades) ----
- name: Pin Proxmox kernel
  ansible.builtin.command: "proxmox-boot-tool kernel pin {{ pve_pinned_kernel }}"
  register: kpin
  changed_when: kpin.rc == 0
  failed_when: kpin.rc != 0 and 'already' not in (kpin.stderr | default(''))
  when:
    - pve_pin_kernel | bool
    - pve_pinned_kernel | length > 0

# ---- LVM thin-pool zeroing (pve_thin_pool_zero; see defaults/main.yml for the trade-off) ----
# `just thinpool --limit <host>` (tags: thinpool) converges only this, one host at a time. The full
# `base` tag (and `just net`) also runs it. `lvs --binary` prints 1/0, not "zero"/"".
- name: Read the thin pool's zeroing flag
  ansible.builtin.command: "lvs --noheadings --binary -o zero {{ pve_thin_pool }}"
  register: pve_thin_pool_zero_state
  changed_when: false
  check_mode: false
  tags: [thinpool]

- name: Set the thin pool's zeroing flag (online; persists in the VG metadata)
  ansible.builtin.command: "lvchange --zero {{ 'y' if (pve_thin_pool_zero | bool) else 'n' }} {{ pve_thin_pool }}"
  when: (pve_thin_pool_zero_state.stdout | trim == '1') != (pve_thin_pool_zero | bool)
  tags: [thinpool]

# ---- Host writeback bounds (pve_base_writeback_sysctl; ADR 0042, see defaults/main.yml) ----
# `ansible-playbook site.yml --limit <host> --tags writeback` converges only this. Live; no reboot.
- name: Bound host writeback (dirty page cache)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-ailab-writeback.conf
    reload: true
  loop: "{{ pve_base_writeback_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  tags: [writeback]

# ---- iocost: the node's etcd VM gets the shared NVMe first (see defaults/main.yml) ----
# `ansible-playbook site.yml --limit <host> --tags iocost` converges only this. Live, no restart: it enables the
# controller and sets the weights on the running VM scopes; the drop-ins carry the weights across VM restarts.
- name: Find the io.weight drop-ins this role manages
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: 50-ailab-ioweight.conf
    recurse: true
    depth: 2
  register: pve_base_iocost_dropins
  tags: [iocost]

- name: Remove io.weight drop-ins of VMs that are no longer protected (only this role's file)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ pve_base_iocost_dropins.files }}"
  loop_control:
    label: "{{ item.path | dirname | basename }}"
  when: >-
    not (pve_base_iocost_enabled | bool)
    or (item.path | dirname | basename).split('.')[0] not in (pve_base_iocost_vm_weights.keys() | map('string') | list)
  register: pve_base_iocost_removed
  tags: [iocost]

- name: Install the iocost helper
  ansible.builtin.copy:
    src: ailab-iocost.sh
    dest: /usr/local/sbin/ailab-iocost
    mode: "0755"
  when: pve_base_iocost_enabled | bool
  tags: [iocost]

- name: Install the iocost unit
  ansible.builtin.template:
    src: ailab-iocost.service.j2
    dest: /etc/systemd/system/ailab-iocost.service
    mode: "0644"
  register: pve_base_iocost_unit
  when: pve_base_iocost_enabled | bool
  tags: [iocost]

- name: Create the protected VMs' scope drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.key }}.scope.d"
    state: directory
    mode: "0755"
  loop: "{{ (pve_base_iocost_vm_weights | dict2items) if (pve_base_iocost_enabled | bool) else [] }}"
  loop_control:
    label: "{{ item.key }}"
  tags: [iocost]

- name: Give the protected VMs' scopes their io.weight (applied at every VM start)
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.key }}.scope.d/50-ailab-ioweight.conf"
    mode: "0644"
    content: |
      # Managed by Ansible (pve_base, tag iocost): VM {{ item.key }} gets the shared NVMe first under blk-iocost.
      [Scope]
      IOWeight={{ item.value }}
  loop: "{{ (pve_base_iocost_vm_weights | dict2items) if (pve_base_iocost_enabled | bool) else [] }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  register: pve_base_iocost_weight_files
  tags: [iocost]

- name: Turn the iocost controller on (restarted when its unit changed)
  ansible.builtin.systemd_service:
    name: ailab-iocost.service
    enabled: true
    state: "{{ 'restarted' if (pve_base_iocost_unit is changed) else 'started' }}"
    daemon_reload: true
  when: pve_base_iocost_enabled | bool
  tags: [iocost]

- name: Look for the iocost unit
  ansible.builtin.stat:
    path: /etc/systemd/system/ailab-iocost.service
  register: pve_base_iocost_unit_file
  when: not (pve_base_iocost_enabled | bool)
  tags: [iocost]

- name: Turn the iocost controller off (stopping the unit disables iocost on the device)
  ansible.builtin.systemd_service:
    name: ailab-iocost.service
    enabled: false
    state: stopped
  when:
    - not (pve_base_iocost_enabled | bool)
    - pve_base_iocost_unit_file.stat.exists | default(false)
  tags: [iocost]

- name: Remove the iocost unit and helper
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/ailab-iocost.service
    - /usr/local/sbin/ailab-iocost
  when: not (pve_base_iocost_enabled | bool)
  register: pve_base_iocost_unit_removed
  tags: [iocost]

- name: Reload systemd after drop-in or unit changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: (pve_base_iocost_removed is changed) or (pve_base_iocost_weight_files is changed) or (pve_base_iocost_unit_removed is changed)
  tags: [iocost]

# A running VM's scope keeps the weight it started with; set it now so no VM restart is needed. --runtime: the
# drop-in above is what persists. A VM that is not running gets its weight from the drop-in when it starts.
- name: Apply the weight to the protected VMs that are running now
  ansible.builtin.shell: |
    set -eu
    s=/sys/fs/cgroup/qemu.slice/{{ item.key }}.scope
    [ -d "$s" ] || { echo "not running"; exit 0; }
    cur=$(awk '$1 == "default" {print $2}' "$s/io.weight" 2>/dev/null || true)
    [ "$cur" = "{{ item.value }}" ] && { echo "already {{ item.value }}"; exit 0; }
    systemctl set-property --runtime {{ item.key }}.scope IOWeight={{ item.value }}
    echo "changed from ${cur:-unset} to {{ item.value }}"
  args:
    executable: /bin/bash
  loop: "{{ (pve_base_iocost_vm_weights | dict2items) if (pve_base_iocost_enabled | bool) else [] }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  register: pve_base_iocost_live
  changed_when: "'changed from' in pve_base_iocost_live.stdout"
  tags: [iocost]

- name: Put removed VMs' running scopes back to the default weight
  ansible.builtin.shell: |
    set -eu
    s=/sys/fs/cgroup/qemu.slice/{{ item }}.scope
    [ -d "$s" ] || { echo "not running"; exit 0; }
    cur=$(awk '$1 == "default" {print $2}' "$s/io.weight" 2>/dev/null || true)
    [ -z "$cur" ] || [ "$cur" = 100 ] && { echo "already default"; exit 0; }
    systemctl set-property --runtime {{ item }}.scope IOWeight=100
    echo "changed from $cur to 100"
  args:
    executable: /bin/bash
  loop: >-
    {{ pve_base_iocost_removed.results | default([]) | selectattr('changed')
       | map(attribute='item.path') | map('dirname') | map('basename')
       | map('regex_replace', '[.]scope[.]d$', '') | list }}
  register: pve_base_iocost_reset
  changed_when: "'changed from' in pve_base_iocost_reset.stdout"
  tags: [iocost]
