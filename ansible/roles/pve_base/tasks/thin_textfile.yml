---
# The thin pool's fill as node_exporter textfile metrics (pve_thin_textfile_*; defaults/main.yml has the why).
# Read-only: the unit runs `lvs`. Not gated in main.yml: switched off, it removes what an earlier converge
# installed, the metrics file included, so no alert keeps judging a stale file.
- name: Check the thin pool metrics settings
  ansible.builtin.assert:
    that:
      - pve_thin_textfile_pools | length > 0
      - pve_thin_textfile_pools | select('match', '^[A-Za-z0-9+_.-]+/[A-Za-z0-9+_.-]+$') | list | length == pve_thin_textfile_pools | length
    fail_msg: "pve_thin_textfile_pools={{ pve_thin_textfile_pools | to_json }}: need VG/LV names"
    quiet: true
  when: pve_thin_textfile_enabled | bool
  tags: [thin_textfile]

- name: Enabled -- the textfile script, its unit and timer
  when: pve_thin_textfile_enabled | bool
  tags: [thin_textfile]
  block:
    - name: Install the thin pool textfile script
      ansible.builtin.copy:
        src: pve-thin-textfile.sh
        dest: /usr/local/sbin/pve-thin-textfile
        owner: root
        group: root
        mode: "0755"

    - name: Ensure node_exporter's textfile directory exists
      ansible.builtin.file:
        path: "{{ pve_thin_textfile_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Written by the role, not the script: a host whose file never appears, or whose file node_exporter cannot
    # parse, still says the metrics should be there (ProxmoxThinTextfileMissing keys on it). Removed when off.
    - name: Mark the thin pool metrics as enabled for the alerts
      ansible.builtin.copy:
        dest: "{{ pve_thin_textfile_dir }}/pve_thin_textfile_enabled.prom"
        owner: root
        group: root
        mode: "0644"
        content: |
          # HELP pve_thin_textfile_enabled 1 while the pve_base role has the thin pool metrics on for this host.
          # TYPE pve_thin_textfile_enabled gauge
          pve_thin_textfile_enabled 1

    - name: Install the thin pool textfile unit and timer
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - pve-thin-textfile.service
        - pve-thin-textfile.timer
      register: pve_thin_textfile_units

    # A unit file that --check did not write cannot be enabled in check mode either.
    - name: Enable and start the thin pool textfile timer
      ansible.builtin.systemd:
        name: pve-thin-textfile.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not (ansible_check_mode and pve_thin_textfile_units is changed)

- name: Disabled -- remove the textfile script, units and metrics
  when: not (pve_thin_textfile_enabled | bool)
  tags: [thin_textfile]
  block:
    - name: Look for an installed thin pool textfile timer
      ansible.builtin.stat:
        path: /etc/systemd/system/pve-thin-textfile.timer
      register: pve_thin_textfile_timer_unit

    - name: Stop the timer and a running write
      ansible.builtin.systemd:
        name: "{{ item.name }}"
        state: stopped
        enabled: "{{ item.enabled | default(omit) }}"
      loop:
        - { name: pve-thin-textfile.timer, enabled: false }
        - { name: pve-thin-textfile.service }
      loop_control:
        label: "{{ item.name }}"
      register: pve_thin_textfile_stop
      failed_when:
        - pve_thin_textfile_stop is failed
        - "'Could not find the requested service' not in (pve_thin_textfile_stop.msg | default(''))"
      when: pve_thin_textfile_timer_unit.stat.exists

    - name: Remove the metrics file, the script and the units
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ pve_thin_textfile_dir }}/pve_thin.prom"
        - "{{ pve_thin_textfile_dir }}/pve_thin_textfile_enabled.prom"
        - /usr/local/sbin/pve-thin-textfile
        - /etc/systemd/system/pve-thin-textfile.timer
        - /etc/systemd/system/pve-thin-textfile.service
      register: pve_thin_textfile_removed

    - name: Reload systemd after removing the units
      ansible.builtin.systemd:
        daemon_reload: true
      when: pve_thin_textfile_removed is changed
