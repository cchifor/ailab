# Only the role's lxc_fstrim tasks (tasks_from), with the role's defaults, against the container.
- name: Converge the nightly LXC volume trim
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  tasks:
    - name: The lxc_fstrim tasks of pve_base
      ansible.builtin.import_role:
        name: pve_base
        tasks_from: lxc_fstrim
