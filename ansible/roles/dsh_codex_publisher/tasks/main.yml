---
- name: Resolve the TLS-verified OpenBao LAN endpoint
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} DSH CODEX OPENBAO"
    block: |
      192.168.0.41 openbao.lan.chifor.me
      192.168.0.42 openbao.lan.chifor.me
      192.168.0.43 openbao.lan.chifor.me

- name: Create publisher directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /usr/local/lib/dsh-codex-publisher, mode: "0755" }
    - { path: /etc/dsh-codex-publisher, mode: "0700" }

- name: Install the access-only publisher
  ansible.builtin.copy:
    src: publish.py
    dest: /usr/local/lib/dsh-codex-publisher/publish.py
    owner: root
    group: root
    mode: "0644"

- name: Install OpenBao's trusted CA
  ansible.builtin.copy:
    src: "{{ role_path }}/../openbao_agent/files/ailab-root-ca.crt"
    dest: /etc/dsh-codex-publisher/ca.crt
    owner: root
    group: root
    mode: "0644"

# One entry per reviewer seat that feeds a consumer: {auth_path, email, kv_path, prefix, optional}.
# The projection list, the vault address and the textfile path are the whole configuration; the
# AppRole credential is the operator-provisioned file checked below. `optional: true` marks a
# STAGED seat (provisioned, not logged in): its absent auth file is a logged skip, never a failure.
# Flip it off when the seat is activated -- from then on absence is the failure it looks like.
- name: Pin the reviewer accounts, their target documents and the metrics path
  ansible.builtin.copy:
    content: "{{ dsh_codex_publisher | to_nice_json }}\n"
    dest: /etc/dsh-codex-publisher/config.json
    owner: root
    group: root
    mode: "0600"

- name: Check the operator-provisioned AppRole credential exists
  ansible.builtin.stat:
    path: /etc/dsh-codex-publisher/approle.json
  register: dsh_codex_publisher_approle

- name: Require the AppRole bootstrap ceremony
  ansible.builtin.assert:
    that:
      - dsh_codex_publisher_approle.stat.exists
      - dsh_codex_publisher_approle.stat.pw_name | default('') == 'root'
      - dsh_codex_publisher_approle.stat.mode | default('') == '0600'
    fail_msg: Bootstrap dsh-codex-publisher AppRole per docs/runbooks/dsh.md before enabling publication.

# The service is a TEMPLATE: its start budget is derived from the projection count, so adding
# a projection in host_vars re-sizes it on the same converge. The timer is static.
- name: Install publisher service (start budget sized from the projection count)
  ansible.builtin.template:
    src: dsh-codex-publisher.service.j2
    dest: /etc/systemd/system/dsh-codex-publisher.service
    owner: root
    group: root
    mode: "0644"
  register: dsh_codex_publisher_service_unit

- name: Install publisher timer
  ansible.builtin.copy:
    src: dsh-codex-publisher.timer
    dest: /etc/systemd/system/dsh-codex-publisher.timer
    owner: root
    group: root
    mode: "0644"
  register: dsh_codex_publisher_timer_unit

# A CHANGED UNIT FILE IS NOT A CHANGED UNIT until systemd re-reads it. `daemon_reload: true` on
# the enable task below only runs when THAT task changes something, and the timer has been
# enabled+started since 2026-09-17 -- so a re-rendered TimeoutStartSec (or any unit edit) would
# sit on disk while systemd enforced the old one, which is exactly the SIGKILL-at-150s the
# template exists to prevent (reviewer-claude, #793). Measured the same day: the first run of
# the new publish.py under the OLD unit (no ReadWritePaths yet) failed on a read-only collector
# dir until a hand daemon-reload. Reload unconditionally whenever either unit file changed; the
# next timer tick starts the service under the new definition, so nothing else needs restarting.
- name: Reload systemd when a publisher unit changed
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: dsh_codex_publisher_service_unit.changed or dsh_codex_publisher_timer_unit.changed

- name: Enable token projection
  ansible.builtin.systemd_service:
    name: dsh-codex-publisher.timer
    enabled: true
    state: started
