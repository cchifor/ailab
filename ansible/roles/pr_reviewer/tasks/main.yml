# reviewbot — receiver + worker + reconciler in one systemd service. Secrets come from
# ansible/secrets/reviewbot.sops.yaml (dedicated .sops.yaml rule — the generic
# ansible/secrets rule encrypts only github_app_private_key, a recorded trap). STRICTLY
# per-persona — every reviewer identity has its own Gitea bot user, own PAT, and own
# webhook secret, so revocation/rotation and attribution stay independent:
#   reviewbot_<persona>_pat: <gitea PAT for reviewer-<persona>, scope write:repository>
#   reviewbot_<persona>_webhook_secret: <hex — HMAC for THAT persona's org webhook>
# The whole role skips gracefully while that file is absent.
- name: Check for the reviewbot secrets file (control node)
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/secrets/reviewbot.sops.yaml"
  delegate_to: localhost
  become: false
  run_once: true
  register: reviewbot_secrets_stat

- name: Load reviewbot secrets (SOPS)
  community.sops.load_vars:
    file: "{{ playbook_dir }}/secrets/reviewbot.sops.yaml"
  delegate_to: localhost
  become: false
  run_once: true
  when: reviewbot_secrets_stat.stat.exists

- name: Resolve this persona's secrets
  ansible.builtin.set_fact:
    _reviewbot_pat: "{{ lookup('vars', 'reviewbot_' ~ pr_reviewer_persona ~ '_pat', default='') }}"
    _reviewbot_webhook_secret: "{{ lookup('vars', 'reviewbot_' ~ pr_reviewer_persona ~ '_webhook_secret', default='') }}"
  no_log: true

- name: Reviewbot directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/reviewbot, owner: "{{ pr_reviewer_user }}", mode: "0750" }
    - { path: /usr/local/lib/reviewbot, owner: root, mode: "0755" }
    - { path: /var/lib/reviewbot, owner: "{{ pr_reviewer_user }}", mode: "0750" }

# The packaged node-exporter textfile dir is root-owned; the service (runs as the agent
# user) writes its heartbeat metrics there atomically. Group-writable via the agent group.
- name: Make the textfile collector dir writable for the reviewbot user
  ansible.builtin.file:
    path: "{{ pr_reviewer_textfile | dirname }}"
    state: directory
    owner: root
    group: "{{ pr_reviewer_user }}"
    mode: "0775"

- name: Create the isolated LLM run user
  ansible.builtin.user:
    name: "{{ pr_reviewer_llm_sudo_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: true
  when: pr_reviewer_llm_sudo_user | length > 0

# LLM auth for the isolated user (e.g. /home/codexrun/.codex/auth.json) is seeded
# MANUALLY, like the agent user's — see the runbook. The MODEL pin in that user's
# config.toml is managed here as a top-level key, section-aware (ini_file with no
# `section` edits only the region before the first `[table]`, so the `[projects.*]`
# tables codex appends and any `[profiles.*]` are never touched) so no host carries
# a stale pin; reviewbot still passes `-m` explicitly on every exec, so this is
# consistency, not the authority.
- name: Ensure the isolated codex user's ~/.codex exists
  ansible.builtin.file:
    path: "/home/{{ pr_reviewer_llm_sudo_user }}/.codex"
    state: directory
    owner: "{{ pr_reviewer_llm_sudo_user }}"
    group: "{{ pr_reviewer_llm_sudo_user }}"
    mode: "0700" # holds the seeded auth.json — non-traversable, like the dev_worker one
  when:
    - pr_reviewer_llm_kind == "codex"
    - pr_reviewer_llm_sudo_user | length > 0

- name: Pin the codex model in the isolated user's config (top-level key, table-aware)
  community.general.ini_file:
    path: "/home/{{ pr_reviewer_llm_sudo_user }}/.codex/config.toml"
    option: model
    value: '"{{ pr_reviewer_llm_model }}"'
    no_extra_spaces: false
    create: true
    owner: "{{ pr_reviewer_llm_sudo_user }}"
    group: "{{ pr_reviewer_llm_sudo_user }}"
    mode: "0600"
  when:
    - pr_reviewer_llm_kind == "codex"
    - pr_reviewer_llm_sudo_user | length > 0
    - pr_reviewer_llm_model | length > 0

- name: Allow the service user to run the LLM as the isolated user
  ansible.builtin.copy:
    content: "{{ pr_reviewer_user }} ALL=({{ pr_reviewer_llm_sudo_user }}) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/reviewbot-llm
    mode: "0440"
    validate: visudo -cf %s
  when: pr_reviewer_llm_sudo_user | length > 0

- name: Install reviewbot.py
  ansible.builtin.copy:
    src: reviewbot.py
    dest: /usr/local/lib/reviewbot/reviewbot.py
    owner: root
    group: root
    mode: "0755"
  notify: Restart reviewbot

- name: Render reviewbot config
  ansible.builtin.template:
    src: config.json.j2
    dest: /etc/reviewbot/config.json
    owner: "{{ pr_reviewer_user }}"
    group: "{{ pr_reviewer_user }}"
    mode: "0640"
  notify: Restart reviewbot

- name: Install the bot PAT
  ansible.builtin.copy:
    content: "{{ _reviewbot_pat }}\n"
    dest: /etc/reviewbot/pat
    owner: "{{ pr_reviewer_user }}"
    group: "{{ pr_reviewer_user }}"
    mode: "0600"
  no_log: true
  when: _reviewbot_pat | length > 0
  notify: Restart reviewbot

- name: Install the webhook secret
  ansible.builtin.copy:
    content: "{{ _reviewbot_webhook_secret }}\n"
    dest: /etc/reviewbot/webhook-secret
    owner: "{{ pr_reviewer_user }}"
    group: "{{ pr_reviewer_user }}"
    mode: "0600"
  no_log: true
  when: _reviewbot_webhook_secret | length > 0
  notify: Restart reviewbot

# ufw default-denies inbound on the workers (dev_worker firewall.yml); the Gitea webhook
# delivery is LAN-sourced (cluster egress masquerades to node IPs), same as the agentforge
# receiver rule.
- name: Allow LAN inbound on the reviewbot webhook port
  community.general.ufw:
    rule: allow
    from_ip: "{{ pr_reviewer_allow_cidr }}"
    to_port: "{{ pr_reviewer_port }}"
    proto: tcp
    comment: reviewbot webhook receiver from LAN

- name: Install the reviewbot unit
  ansible.builtin.template:
    src: reviewbot.service.j2
    dest: /etc/systemd/system/reviewbot.service
    mode: "0644"
  notify: Restart reviewbot

# Skipped in check mode like the herdr unit: systemd state on a never-written unit file
# breaks a fresh-host --check preview.
- name: Enable + start reviewbot
  ansible.builtin.systemd:
    name: reviewbot.service
    enabled: true
    state: started
    daemon_reload: true
  when:
    - not ansible_check_mode
    - _reviewbot_pat | length > 0
    - _reviewbot_webhook_secret | length > 0

# ---------------------------------------------------------------------------------------------
# ASSERT the org webhook actually subscribes to pull-request events.
#
# WHY THIS EXISTS. On 2026-09-08 both org hooks (38 -> reviewer-1, 39 -> reviewer-2) were found
# subscribed to `push` ONLY, while reviewbot.py's EVENTS set is
# {pull_request, pull_request_sync, pull_request_label, pull_request_review_request} and its
# handler requires a `pull_request` key that a push payload never carries. Result: ZERO webhook
# deliveries in 7 days. Reviews still happened — the 5-minute reconcile poll masked it entirely —
# so every PR silently waited up to 5 minutes, and nothing anywhere said why.
#
# The hooks were created by hand and were codified NOWHERE: this role installs the webhook SECRET
# and opens the firewall port, but nothing asserted the hook's events, which is exactly how it
# drifted unnoticed. This task closes that gap.
#
# DETECTION, not enforcement, and deliberately so: creating or editing an org hook needs
# `write:organization`, which the reviewer PATs do not carry (they are scoped to
# write:repository). Minting a privileged org-admin token and parking it on two VMs to fix a
# one-line config is a worse trade than failing loudly. The remediation is in the message.
#
# READING the hooks needs `read:organization` plus org-owner rights, which the reviewer PATs
# ALSO do not carry -- measured 2026-09-09: this endpoint returns 403
# `required=[read:organization]`. So the read below is EXPECTED to fail here today.
#
# That is exactly why the assertion must not be gated on the read succeeding. It was, and the
# result was a check that could never once run while reading as coverage -- the same silent
# blind spot the check exists to prevent, one level up. `failed_when: false` makes MISSING and
# UNREADABLE indistinguishable, so the two conditions are asserted SEPARATELY below.
- name: Read the Gitea org webhooks
  ansible.builtin.uri:
    url: "{{ pr_reviewer_gitea_url }}/api/v1/orgs/{{ pr_reviewer_org }}/hooks"
    method: GET
    headers:
      Authorization: "token {{ pr_reviewer_hook_check_token | default(_reviewbot_pat, true) }}"
      # Default python/curl UAs get a Cloudflare 403 (code 1010) on this forge.
      User-Agent: "git/2.47.0"
    status_code: [200]
  register: _reviewbot_org_hooks
  changed_when: false
  failed_when: false
  when:
    - _reviewbot_pat | length > 0
    - not ansible_check_mode

- name: Assert the org-webhook check could actually run
  ansible.builtin.assert:
    that:
      - _reviewbot_org_hooks.status | default(0) == 200
    fail_msg: >-
      Could not READ the Gitea org webhooks (HTTP {{ _reviewbot_org_hooks.status | default('no response') }}),
      so this host's webhook delivery is UNVERIFIED -- not verified-good. Reviews would still
      appear to work via the 5-minute reconcile poll while push-time delivery is dead, which is
      the 7-day outage this whole check exists to catch.
      GET /api/v1/orgs/{{ pr_reviewer_org }}/hooks needs `read:organization` AND org-owner rights;
      the reviewer PATs are scoped write:issue,write:repository. Supply an owner credential in
      `pr_reviewer_hook_check_token`, or set `pr_reviewer_assert_hook_config: false` to accept the
      blind spot deliberately and on the record.
    success_msg: "org webhooks are readable, config assertion below is meaningful"
  when:
    - pr_reviewer_assert_hook_config | bool
    - _reviewbot_pat | length > 0
    - not ansible_check_mode

- name: Assert this persona's webhook subscribes to pull-request events
  vars:
    _my_hook: >-
      {{ (_reviewbot_org_hooks.json | default([]))
         | selectattr('config.url', 'search', ansible_default_ipv4.address ~ ':' ~ pr_reviewer_port)
         | list | first | default({}) }}
    _missing: "{{ pr_reviewer_required_hook_events | difference(_my_hook.events | default([])) }}"
  ansible.builtin.assert:
    that:
      - _my_hook | length > 0
      - _missing | length == 0
      - _my_hook.active | default(false)
    fail_msg: >-
      The Gitea org webhook for {{ ansible_default_ipv4.address }}:{{ pr_reviewer_port }} is wrong.
      events={{ _my_hook.events | default('<no hook found>') }},
      missing={{ _missing }}, active={{ _my_hook.active | default('n/a') }}.
      Reviews will still happen via the 5-minute reconcile poll, so this fails SILENTLY in
      production — that is why it is asserted here. Fix with an org-admin credential:
      PATCH {{ pr_reviewer_gitea_url }}/api/v1/orgs/{{ pr_reviewer_org }}/hooks/<id>
      with {"active": true, "events": {{ pr_reviewer_required_hook_events | to_json }}}
    success_msg: "org webhook subscribes to pull-request events"
  when:
    - _reviewbot_pat | length > 0
    - not ansible_check_mode
    # Safe to gate on now: an unreadable API is caught by the assertion above rather than
    # skipping this one in silence. This gate only suppresses a cascade, never the finding.
    - _reviewbot_org_hooks.status | default(0) == 200
