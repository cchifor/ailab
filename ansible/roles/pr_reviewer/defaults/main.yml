# pr_reviewer — event-driven LLM PR review bot (plan: agentforge
# plans/2026-09-02-ai-pr-review-plan.md). Phase-1 posture: shadow mode, COMMENT-only,
# central allowlist (no per-repo policy files yet), single persona per host.
# Enabled per-host via host_vars (dev-worker-2 = claude persona), never in group_vars.
pr_reviewer_enabled: false
pr_reviewer_persona: claude
pr_reviewer_user: c4
pr_reviewer_listen: "0.0.0.0"
pr_reviewer_port: 8477
pr_reviewer_gitea_url: "https://git.chifor.me"
pr_reviewer_org: cchifor
# Must match EVENTS in files/reviewbot.py — the handler drops anything without a pull_request key,
# so a hook subscribed to `push` delivers nothing and the reconcile poll silently covers for it.
pr_reviewer_required_hook_events:
  - pull_request
  - pull_request_sync
  - pull_request_label
  - pull_request_review_request
# Central allowlist — the ONLY thing that admits a repo. Joined 2026-09-02 (operator-directed
# rollout); posting stays COMMENT-only, statuses off until the soak. TWO consumers, not one:
# reconciler() sweeps these, and enqueue() (the webhook path) drops anything not listed — so
# removing an entry rejects its deliveries as well as stopping its sweep.
# cchifor/review-bot-fixture was removed 2026-09-10 when that repo was retired
# (plans/2026-09-10-retire-review-bot-fixture-plan.md). Removing it from here BEFORE the repo
# stops answering is no longer load-bearing for availability — the sweep is fault-isolated per
# repo since the same change — but it still stops admission and keeps
# ReviewbotReconcileRepoFailing from firing on a repo we deleted on purpose.
pr_reviewer_repos:
  - cchifor/ailab
  - cchifor/agentforge
  - cchifor/platform
  - cchifor/agentforge-platform
# PRs authored by the reviewer identities are never reviewed (no bot->bot trigger loops).
# The agentforge pin bot is deliberately NOT ignored (operator-directed CD, 2026-09-02):
# its PRs get the pin rubric below and automerge when digest-only + clean + CI green.
# Reviewing it cannot loop - the pin bot never reacts to reviews.
pr_reviewer_ignore_authors:
  - reviewer-claude
  - reviewer-codex
# PRs from these authors get the stricter pin-lane rubric prepended to the review prompt.
pr_reviewer_pin_authors:
  - agentforge-ci-bot
# The headless LLM command (argv list; -p/--output-format/tool restrictions are appended
# by the service). The claude binary lives in the agent user's ~/.local/bin.
pr_reviewer_llm_cmd:
  - "/home/c4/.local/bin/claude"
# claude: headless -p with tool restrictions; pr_reviewer_llm_model pins the review model
# when set (unset = the account default) and llm_fallback_model retries once on errors.
# codex: exec with read-only sandbox; requires pr_reviewer_llm_model.
pr_reviewer_llm_kind: claude
pr_reviewer_llm_model: ""
# claude-only: retry once on this model when the primary run errors (limits etc.);
# "opus" is the CLI alias for the latest opus, so it needs no version maintenance.
pr_reviewer_llm_fallback_model: ""
# When set, the LLM subprocess runs as this dedicated OS user via sudo (created by the
# role): its home holds ONLY that persona's LLM auth, so a prompt-injected diff has no
# credentials to read. Required for codex (no tool-denial flags); claude gets the same
# effect from --disallowedTools.
pr_reviewer_llm_sudo_user: ""
# WALL-CLOCK BUDGET FOR ONE ATTEMPT — primary AND fallback share it (they used to get one
# each, so the real worst case was 2x this). 300 was too small and is what broke the claude
# persona: measured 2026-09-04, a 341,672-byte diff needs 515 s (40,948 output tokens — run
# length tracks REASONING, not diff size, which is why a 2 KB diff timed out too), while
# healthy runs land at 19-220 s. 12 timeouts in 3 days, and platform#1067 never got a verdict
# in 9 attempts. 900 is an initial operational value, not a measured SLO — reviewbot_llm_seconds_max
# and ReviewbotReviewTimeouts are what revise it. reviewer-2/codex keeps its explicit 600.
pr_reviewer_llm_timeout_s: 900
# Skip the fallback model when less than this is left of the attempt's budget: a 30-second
# fallback run only produces a second failure, and the retry is the better use of the time.
pr_reviewer_llm_fallback_min_s: 60
# The LLM-input cap. Whole files are excluded by class BEFORE this is measured (generated,
# vendored, binary, non-UTF-8), and prose is shed largest-first if the remainder still does not
# fit — so this now bounds what the model READS rather than deciding whether it reads anything.
# Measured over the 7 PRs that hit the cap: 5 become reviewable, 2 are genuinely oversized code
# and are still skipped, with a composition table telling the author which files to split out.
pr_reviewer_max_diff_bytes: 400000
# Intake bound, checked before any parsing. platform#1084 arrived at 3.4 MB (a PDF corpus);
# there is no reason to partition a payload that large to discover it is unreviewable.
pr_reviewer_max_raw_bytes: 10485760
# Whole-file exclusions. These live HERE and in the module defaults — never in the repo under
# review, or a PR could exclude its own payload. Empty means "use the module defaults"
# (GENERATED_GLOBS / DOC_GLOBS in reviewbot.py), which is the normal case.
#   exclude_globs — never reviewed, and NOT a reason to downgrade the verdict
#   doc_globs     — reviewed when it fits, shed first under pressure, downgrades to `partial`
# Deliberately NOT directory heuristics like fixtures/ golden/ testdata/: measured across 56
# merged PRs those matched only tests/golden/… and tests/unit/fixtures/*.json, which is exactly
# where a regression hides.
pr_reviewer_exclude_globs: []
pr_reviewer_doc_globs: []
pr_reviewer_max_comments: 15
pr_reviewer_max_attempts: 5
# Deadline failures are counted SEPARATELY (jobs.timeout_attempts) and capped lower: a timeout
# burns the entire budget and yields nothing, while an API error or bad JSON fails in seconds.
# Retrying a deadline once is worth it (agentforge-platform#177 timed out, then succeeded on
# the retry); five times is 75 minutes of a single-threaded worker. Separate counters, not a
# lower cap on the shared one — otherwise one fast transient error plus one real timeout
# quarantines a job that deserved another try.
pr_reviewer_max_timeout_attempts: 2
pr_reviewer_reconcile_s: 300
# codex-only: reasoning effort for reviews (the seeded account default is xhigh - 5-10min
# per review; medium is the right latency/quality point for a review bot).
pr_reviewer_llm_effort: medium
pr_reviewer_textfile: /var/lib/prometheus/node-exporter/reviewbot.prom
# Merge authority (operator-directed 2026-09-02): the reviewer system merges a PR only when
# EVERY persona below has a verdict=clean review at the current head, CI is green, the
# author is in the allowlist, and no `no-automerge` label is present. Applies to all
# personas' configs identically - whichever persona completes the picture merges (races
# are benign: the second merge attempt gets a 405).
pr_reviewer_automerge: true
pr_reviewer_merge_personas: [claude, codex]
# renovate-bot added 2026-09-09 (operator-directed): its PRs automerge on the SAME gate as
# everyone else's — every persona clean at the current head, CI green, no `no-automerge`
# label. Deliberately NOT added to pr_reviewer_pin_authors: the pin-lane rubric is written
# for digest-only bumps of images this estate builds, and renovate also moves base-image
# tags and major versions, which that rubric does not describe. It reviews under the
# general rubric instead. `no-automerge` remains the per-PR brake for a bump that wants a
# human — a major runtime bump touching something load-bearing, say.
pr_reviewer_merge_authors: [cchifor, chifor, agentforge-ci-bot, renovate-bot]
pr_reviewer_allow_cidr: "{{ lan_cidr | default('192.168.0.0/24') }}"

# Fail the play when the Gitea org-webhook configuration cannot be READ or is wrong.
# On by default: an unverifiable delivery path is the precise condition that let reviews die
# unnoticed for 7 days (2026-09-01..08). Set false only to accept that blind spot knowingly.
# Governs BOTH assertions -- the readable-check and the config-check. It has to: an opt-out
# that silenced only the first would still fail the play on a wrong hook, which is not what
# "accept the blind spot" means to anyone reading this line.
pr_reviewer_assert_hook_config: true

# Org-OWNER credential used SOLELY for the webhook read. The reviewer PATs cannot do it
# (write:issue,write:repository); GET /orgs/<org>/hooks needs read:organization AND org-owner.
# Minted 2026-09-09 for `chifor` (the org owner) scoped to read:organization ONLY -- it can
# enumerate org metadata and nothing else; it cannot create, edit or delete a hook, push, or
# read repository contents. Lives in ansible/secrets/reviewbot.sops.yaml, named to match that
# file's encrypted_regex ^(reviewbot_[a-z0-9]+_pat|...)$ so SOPS actually encrypts it.
# Falls back to '' (not the reviewer PAT) so a missing credential fails the readable-check
# loudly instead of silently 403ing under a token that was never going to work.
pr_reviewer_hook_check_token: "{{ lookup('vars', 'reviewbot_hookcheck_pat', default='') }}"
