---
# Applies on EVERY maintenance run for an exclusive host, including a later config update.
# A new shutdown_timeout cannot protect the old daemon before it has read that configuration.
- name: Require explicit exclusive-host configuration
  ansible.builtin.assert:
    that:
      - not (github_runner_agent_enabled | default(true) | bool)
      - gitea_runner_label != 'self-hosted-hv'
      - gitea_runner_capacity | int == 1
    fail_msg: >-
      An exclusive host must disable GitHub agent installation, use a dedicated label and capacity1.
      Follow docs/runbooks/forge-complete-gate.md; other hosts must remain in the ordinary pool.

- name: Observe both runner service states without stopping a task
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --property=ActiveState
      - --property=SubState
      - --
      - "{{ item }}"
  loop:
    - "{{ gitea_runner_service }}"
    - "{{ github_runner_service | default('actions.runner.cchifor-platform.service') }}"
  register: _exclusive_runner_services
  changed_when: false
  check_mode: false
  failed_when: _exclusive_runner_services.rc not in [0, 4]

- name: Require both existing services stopped before exclusive-host maintenance
  ansible.builtin.assert:
    that:
      - item.rc == 0 or (item.rc == 4 and 'LoadState=not-found' in item.stdout_lines)
      - item.stdout_lines | length == 3
      - "'LoadState=loaded' in item.stdout_lines or 'LoadState=not-found' in item.stdout_lines"
      - "'ActiveState=inactive' in item.stdout_lines"
      - "'SubState=dead' in item.stdout_lines"
    fail_msg: >-
      {{ item.item }} is not fully inactive/dead (or absent). The owner must pause scheduling,
      observe no active tasks on BOTH Gitea and GitHub, and stop both services before applying
      this role. Transitional, failed and unknown states require owner investigation. Missing
      Runner.Worker alone is not evidence that a Gitea task is idle. No runner has been stopped
      by this guard.
  loop: "{{ _exclusive_runner_services.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Reject a surviving runner daemon, GitHub listener or worker outside stopped services
  ansible.builtin.command:
    argv: [pgrep, -x, 'act_runner|Runner[.]Listener|Runner[.]Worker']
  register: _exclusive_runner_processes
  changed_when: false
  check_mode: false
  failed_when: _exclusive_runner_processes.rc != 1

- name: Disable the installed legacy GitHub service on this exclusive host
  ansible.builtin.systemd_service:
    name: "{{ github_runner_service | default('actions.runner.cchifor-platform.service') }}"
    state: stopped
    enabled: false
  when: "'LoadState=loaded' in _exclusive_runner_services.results[1].stdout_lines"
