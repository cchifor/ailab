---
# Provision a self-hosted GitHub Actions runner VM (Ubuntu 24.04). Idempotent; safe to re-run.
# The role is gated as a whole by the playbook (when: github_runner_enabled). Inside it, ONLY the
# GitHub agent itself (tasks/agent.yml: download, App key, ephemeral wrapper, hooks, unit) is gated
# again, by github_runner_agent_enabled: the cloud_gitea_runners group runs this role for the base
# toolchain that gitea_runner depends on (Docker, compose, Node, uv, k6, the `runner` user) and
# has no GitHub agent at all. Node/uv/k6 keep their own opt-out flags.
# Day-2 note: a re-run may restart the runner service (handler) and interrupt at most one in-flight
# job — GitHub re-queues it. Run when the pool is mostly idle for a clean apply.

# ── 0. preflight: App credentials must be present (agent hosts only) ─────────
- name: Assert GitHub App credentials are configured
  when: github_runner_agent_enabled | bool
  ansible.builtin.assert:
    that:
      - github_runner_app_id | string | length > 0
      - github_runner_app_installation_id | string | length > 0
      - github_app_private_key is defined
      - github_app_private_key | length > 0
    fail_msg: >-
      Set github_runner_app_id + github_runner_app_installation_id in
      group_vars/github_runners.yml and provide github_app_private_key via
      ansible/secrets/github-runner.sops.yaml (loaded by site.yml's pre_task). See
      docs/runbooks/ci-runners.md.
  no_log: true

# ── 1. base packages ─────────────────────────────────────────────────────────
- name: Install base packages (runner deps + JWT/curl toolchain)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - jq
      - git
      - openssl
      - tar
      - unzip
      - acl # lets ansible become an unprivileged user (config dirs owned by runner)
      - qemu-guest-agent # not in the minimal cloud image; gives PVE graceful shutdown + guest info
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable + start qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started

- name: Ensure apt keyrings dir
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# ── 1b. guest swap (cchifor/platform#620) ────────────────────────────────────
# OOM reclaim valve so a heavy compose/Playwright peak spills to the VM disk instead of exit-137.
# Pairs with the 12 GiB balloon floor in tofu (kubernetes/infra/runners). See swap.yml + the runbook.
- name: Configure guest swap
  ansible.builtin.import_tasks: swap.yml

# ── 2. Docker engine + Buildx (official Docker apt repo) ─────────────────────
- name: Add Docker apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/docker.asc
    enabled: true

- name: Install Docker engine + CLI + Buildx
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
    state: present
    update_cache: true

- name: Ensure Docker CLI-plugins dir (for the pinned compose binary)
  ansible.builtin.file:
    path: /usr/local/lib/docker/cli-plugins
    state: directory
    mode: "0755"

# Pin Compose to the exact version platform's CI pins (e2e-preflight). A plugin binary is
# deterministic and independent of the Docker apt repo's compose-plugin version churn.
- name: Install pinned Docker Compose v{{ docker_compose_version }}
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-x86_64"
    dest: /usr/local/lib/docker/cli-plugins/docker-compose
    mode: "0755"

- name: Lay down /etc/docker/daemon.json (log rotation + build-cache GC)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart docker

- name: Enable + start docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

# ── 3. workload toolchain: Node, uv, k6 (Playwright runs in-container, not on the host) ──
- name: Add NodeSource apt signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"
  when: github_runner_install_node | bool

- name: Add NodeSource apt repository (Node {{ node_major }}.x)
  ansible.builtin.deb822_repository:
    name: nodesource
    types: [deb]
    uris: "https://deb.nodesource.com/node_{{ node_major }}.x"
    suites: [nodistro]
    components: [main]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/nodesource.asc
    enabled: true
  when: github_runner_install_node | bool

- name: Install Node.js {{ node_major }}.x
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true
  when: github_runner_install_node | bool

- name: Install uv {{ uv_version }} (Python tool runner)
  ansible.builtin.unarchive:
    src: "https://github.com/astral-sh/uv/releases/download/{{ uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: ["--strip-components=1"] # binaries keep their +x bits from the archive
    creates: /usr/local/bin/uv
  when: github_runner_install_uv | bool

- name: Install k6 {{ k6_version }} (load testing)
  ansible.builtin.unarchive:
    src: "https://github.com/grafana/k6/releases/download/v{{ k6_version }}/k6-v{{ k6_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: ["--strip-components=1", "--wildcards", "*/k6"]
    creates: /usr/local/bin/k6
  when: github_runner_install_k6 | bool

# ── 4. runner user (in the docker group, so jobs can use the Docker socket) ──
- name: Create runner group
  ansible.builtin.group:
    name: "{{ github_runner_group }}"
    system: true

- name: Create runner user
  ansible.builtin.user:
    name: "{{ github_runner_user }}"
    group: "{{ github_runner_group }}"
    groups: [docker]
    append: true
    home: "{{ github_runner_home }}"
    shell: /bin/bash
    system: true

# Passwordless sudo — the platform CI workflows use `sudo` (install the pinned compose binary,
# start the docker daemon, free stuck ports, reclaim root-owned _work leftovers). The old
# Multipass/Hyper-V pool granted this; without it every Docker-heavy job fails at its first sudo
# with "sudo: a password is required" (the pure-Python jobs, which use no sudo, still pass).
- name: Grant the runner user passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-github-runner
    content: "{{ github_runner_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s

# Heal-at-source: keep the runner's docker config dir runner-owned. A root-run docker/buildx command
# can leave it root-owned → "open ~/.docker/config.json: permission denied" or, for buildx,
# "stat ~/.docker/buildx/instances: permission denied" / "EACCES … mkdir ~/.docker/buildx/certs" on
# every subsequent job. This is the earliest valid spot (needs the runner user, created just above);
# the *durable, every-ephemeral-cycle* guarantee is the identical chown in runner-reclaim.sh, which
# runs as root before each job and re-heals ownership a job may have re-rooted mid-run.
- name: Ensure ~/.docker is owned by the runner
  ansible.builtin.file:
    path: "{{ github_runner_home }}/.docker"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_group }}"
    recurse: true

# ── 5. runner agent (pinned bootstrap; auto-updates on connect) ──────────────
- name: Ensure runner dir
  ansible.builtin.file:
    path: "{{ github_runner_dir }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_group }}"
    mode: "0755"

# ── 5-7. the GitHub agent itself: download, App key, ephemeral wrapper, hooks, unit, enable ──
# Skipped where github_runner_agent_enabled is false (the cloud Gitea-only runners). Everything
# above is the shared base toolchain; nothing in agent.yml is needed by the gitea_runner role.
- name: Install the GitHub Actions agent (tasks/agent.yml)
  ansible.builtin.include_tasks: agent.yml
  when: github_runner_agent_enabled | bool
