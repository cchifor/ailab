---
# dev_worker role — interactive Claude Code + Codex agent workstation (Ubuntu 24.04). Idempotent;
# safe to re-run. The role is gated as a whole by dev-workers.yml (when: dev_worker_enabled), so
# there are no per-task enable guards beyond the feature toggles below. Ported from the homelab
# claude-worker bootstrap (platform/files/cloud-init/claude-worker-bootstrap.sh.tftpl) into ailab's
# idempotent-Ansible idiom. See docs/runbooks/dev-workers.md.
dev_worker_enabled: false # opt-in, like github_runner_enabled (flip in group_vars/dev_workers.yml)

# ---- identity ----
# By DEFAULT the role uses ONE user (c4) for everything — the SSH console, the ttyd web UI, the
# dashboard, the claude-job@ runner, and the Claude/Codex credentials. So the web UI and SSH console
# are literally the same tmux session + the same auth: seamless, and tokens refresh cleanly with no
# cross-user ACLs. c4 is created by cloud-init as a passwordless sudoer.
dev_worker_admin_user: c4
# Headless/agent account. DEFAULT = same as admin (unified, seamless). Set this to a SEPARATE account
# (e.g. "claude-agent") ONLY to sandbox the headless agent from the human's sudo — that restores the
# homelab two-user split, where the agent owns the credentials and c4 gets read-only shared access via
# ACL. NOTE: read-only sharing breaks token refresh for c4 — see docs/runbooks/dev-workers.md.
dev_worker_agent_user: "{{ dev_worker_admin_user }}"

# ---- Gitea (git.chifor.me) forge access (ADR 0017 — Gitea is the master forge) ----
# Configures per-user git credentials so agents/devs can clone/push private cchifor/* repos over HTTPS
# without prompting. Token = a `dev-worker-bot` Gitea token (write:repository, write:issue,
# read:organization, read:user); provide it via SOPS (ansible/secrets/dev-worker.sops.yaml ->
# dev_worker_gitea_token). Empty = skip (no-op).
# IDENTITY (2026-10-06, plan 2026-10-06-s2s-identity-openbao D1): workers authenticate as the
# NON-ADMIN `dev-worker-bot` (member of org team `automation`: write on every cchifor repo, never
# admin), NOT as the owner `chifor`. Owner-gated merges (protected files) therefore need the owner.
# Never put a `chifor` token back here or in devworker-seeds.sops.yaml.
dev_worker_gitea_user: dev-worker-bot
dev_worker_gitea_token: ""

# ---- /workspace data disk (the blank scsi1 disk the tofu module attaches) ----
dev_worker_workspace_device: /dev/sdb
dev_worker_workspace_label: workspace
dev_worker_workspace_mount: /workspace

# ---- per-user npm global prefix (so `npm install -g` needs no sudo) ----
dev_worker_npm_dir: .npm-global

# ---- pinned tool versions (bump deliberately) ----
dev_worker_node_major: "20"
dev_worker_yq_version: "4.44.5"
dev_worker_gh_dash_version: "4.24.1"
dev_worker_oxker_version: "0.13.2"
dev_worker_helm_version: "v3.16.3"
dev_worker_k9s_version: "v0.32.5"
dev_worker_kubectl_minor: "1.30"
dev_worker_ttyd_version: "1.7.7"
dev_worker_tpm_version: "v3.1.0"

# ---- npm package ids ----
# Claude Code self-updates at runtime, so presence is enough. Codex does NOT (it only nags), and a
# model can require a newer CLI than the one on disk, so codex carries a version pin (below).
dev_worker_claude_code_pkg: "@anthropic-ai/claude-code"
dev_worker_codex_pkg: "@openai/codex"

# ---- Codex CLI version + model (bump deliberately; tasks/codex.yml) ----
# Any user whose installed codex is OLDER than this is upgraded to exactly it (never downgraded).
# gpt-6-astra needs >= 0.153.0 (measured 2026-09-05: 0.152.1 rejected, 0.153.0 accepted): an
# older CLI is rejected upstream with `400 The 'gpt-6-astra' model requires a newer version of Codex`.
# 0.160.0: the floor for the router provider's `auth` command (measured on 0.160.0, 2026-10-09).
# 0.162.0: the version the managed app-server daemon auto-updated itself to. A TUI whose CLI differs from
# the running daemon refuses to attach when their feature defaults disagree ("Background server has
# incompatible feature settings", 2026-10-09: 0.160 vs 0.162 on api_key_model_discovery). The daemon's
# updater keeps moving, so the [features] pin in tasks/codex.yml is what actually prevents that; this
# floor only keeps the gap small.
dev_worker_codex_version: "0.162.0"
# Written as TOP-LEVEL keys into each user's ~/.codex/config.toml (edit-in-place, see codex.yml).
# Empty string = leave that key unmanaged.
dev_worker_codex_model: "gpt-6-astra"
dev_worker_codex_reasoning_effort: "xhigh"
# `[sandbox_workspace_write] network_access` in each user's ~/.codex/config.toml. Codex's workspace-write
# sandbox (the default once a session leaves --yolo) runs every command in a fresh network namespace
# with NO network unless this is on, so `git push`, `npm install` and even DNS fail inside it
# ("Could not resolve host: git.chifor.me", dev-worker-4, 2026-09-26). These are agent workstations
# whose job includes pushing to the forge; the sandbox still confines writes to the workspace.
# false = write `network_access = false` (explicitly offline); "" = leave the key unmanaged. Anything
# else, including null / a blank value, fails the play (tasks/codex.yml validates it once).
dev_worker_codex_sandbox_network: true

# ---- Codex login ownership (tasks/openbao.yml, templates/openbao-agent.hcl.j2) ----
# true (since 2026-09-29): each worker OWNS its codex login. The bao agent renders NO
# ~/.codex/auth.json; the operator runs `codex login --device-auth` on the host, with the ChatGPT
# account that host should use, and the CLI refreshes that login itself. Why: the estate's shared
# login (seat a, published to af/dev-workers/codex-auth by the af-codex-refresh CronJob) was revoked
# server-side on 2026-09-21 and again on 2026-09-29, taking every worker down at once, and a login
# made on a worker was overwritten by the agent within minutes. Operator decision, "for now" --
# docs/runbooks/openbao-dev-workers.md § "Host-owned codex logins".
# false = the previous design: every user's auth.json is rendered from the shared projection.
dev_worker_codex_host_owned_login: true

# ---- Codex through the estate's LLM router (tasks/codex.yml; docs/runbooks/dev-workers.md § "Codex through the router") ----
# true = each user's codex talks to router.chifor.me instead of ChatGPT with the host's own login:
# `model_provider` (top level) names the [model_providers.<provider>] table this role writes, whose
# `auth` command is /usr/local/bin/codex-router-key. That helper reads this host's router key from
# OpenBao (`cred get <hostname> <field>`, af/dev-workers/<hostname>) on every call and keeps the last
# good value in ~/.config/llm-router/codex.key, so a vault outage does not stop codex. The router
# serves these requests on its Codex-native routes (llm-router `codexNative`), which pin one ChatGPT
# subscription (codex-5); the key is limited to those routes. The host login stays on disk:
# `codex -p chatgpt` uses it. false = the provider table and the top-level key are removed.
dev_worker_codex_router_enabled: false
dev_worker_codex_router_provider: "llm-router"
dev_worker_codex_router_base_url: "https://router.chifor.me/v1"
dev_worker_codex_router_key_field: "llm_router_codex_key"

# ---- feature toggles ----
dev_worker_install_docker: true
dev_worker_install_toolchains: true
dev_worker_install_k8s_tools: true
dev_worker_enable_ttyd: true
dev_worker_enable_dashboard: true
dev_worker_enable_jobs: true
dev_worker_enable_cloudflared: false
dev_worker_enable_restic: false
dev_worker_enable_password_auth: false
dev_worker_enable_statusline: true
dev_worker_tmux_persistence: true
dev_worker_tmp_hygiene_full: false # simple tmpfiles.d aging is always on; the homelab loopback+evictor is not

# ---- Claude Code status line ----
# Re-run the status line command every N seconds on top of Claude Code's own event-driven updates, so
# the 5h/7d rate-limit reset countdowns keep ticking while a session sits idle between turns.
dev_worker_statusline_refresh_interval: 10

# ---- resource caps (homelab values) ----
dev_worker_dockerd_memory_max: "2000M"
dev_worker_dockerd_memory_high: "1700M"
dev_worker_swapfile_path: /swapfile
dev_worker_swapfile_size: "4G"
dev_worker_swappiness: 10
# Seconds the kernel waits after a panic before rebooting itself; 0 = wait forever. The stock default
# is 0, and on 2026-08-11 22:32 that meant dev-worker-1's kernel panicked ("Attempted to kill the idle
# task!") and the VM then sat dead for ~12h — PVE still reported it `running`, so it looked like a
# network fault rather than a dead guest, and nothing rebooted it. A panicked kernel cannot be
# recovered in place, so waiting buys nothing; the only actions are reboot or a human noticing. 10s is
# long enough for the panic to reach the serial console (which is where the ONLY record of that one
# survives — journald had flushed nothing) and short enough that the box comes back on its own.
dev_worker_kernel_panic_timeout: 10
# OFF by default, deliberately. panic_on_oops promotes a kernel OOPS — which is often survivable — into
# a hard panic, and therefore (with the timeout above) into an unattended reboot. These are interactive
# boxes with live tmux sessions, so that trades a possibly-recoverable fault for guaranteed lost work,
# and an oops that recurs on boot or on workload start becomes a reboot loop.
# An earlier revision of this file defaulted it to 1 and justified it by claiming an oops "has meant a
# wedged VM rather than a clean failure" on these workers. There is NO evidence for that: the observed
# failure was a PANIC, not an oops, and no oops has been recorded on any dev worker. Flip this to 1 only
# once DevWorkerNodeDown has actually caught a worker wedged after an oops (`journalctl -k -b -1 |
# grep -i oops`) — i.e. once the trade is paid for by evidence rather than symmetry.
dev_worker_kernel_panic_on_oops: 0
dev_worker_job_memory_high: "2G"
dev_worker_job_memory_max: "2560M"
dev_worker_job_memory_swap_max: "2G"

# ---- interactive tmux OOM containment (dev-worker-1 incident, 2026-09-07) ----
# tmux 3.4 is linked against libsystemd, so every pane runs in its own transient
# `tmux-spawn-<uuid>.scope` under app-tmux.slice. systemd's stock DefaultOOMPolicy is `stop`, which
# means ONE OOM-killed child terminates the WHOLE pane — shell, `claude`, and any work in progress.
# That is what destroyed a live Claude Code session on dev-worker-1: the kernel killed only the
# runaway pytest, systemd killed everything else in the pane. `continue` keeps the pane alive and
# lets the dead child be dead. Applies to per-user managers ONLY; system units keep the stock `stop`,
# so the memory-capped claude-job@/agentforge units still fail as a unit the way they are meant to.
dev_worker_user_oom_policy: continue
# Ceiling for ALL tmux panes combined, so a runaway is killed inside the tmux slice before global
# memory pressure lets the kernel pick an arbitrary victim elsewhere on the box (in the incident it
# was dockerd's hatchet-engine that tripped the OOM killer, not the pane that caused it). Measured on
# dev-worker-1 on 2026-09-07: the slice's steady state was ~200 MB across 8 panes, and its peak that
# boot -- 8.05 GiB -- WAS the incident. (memory.peak is per-boot and resets, so re-measure rather
# than trusting that figure later.) 6G is 30x the steady state and still leaves ~6 GiB for dockerd
# (capped 2000M) and the system on a 12 GiB worker.
dev_worker_tmux_memory_max: "6G"
# Swap is denied to the tmux slice DELIBERATELY, and this is the one place the role departs from the
# MemoryHigh+MemoryMax+MemorySwapMax house pattern used by dev_worker_job_memory_* above.
#   - MemorySwapMax=0: with a 2G swap allowance a runaway reaches MemoryMax in RAM *plus* 2 GiB of
#     swap before it dies -- an 8 GiB footprint, larger than the 7.5 GiB that took the box down in
#     the first place, and thrashing a shared 4 GiB swapfile the whole way. The slice's own swap peak
#     is 276 MB, so denying it costs interactive work nothing.
#   - No MemoryHigh: MemoryHigh throttles by driving reclaim, and with swap denied there is nothing
#     to reclaim from an anon-heavy runaway (a bytearray loop) — it would burn CPU in a futile
#     reclaim loop on every pane in the slice on its way to MemoryMax anyway. A single hard ceiling
#     kills the offender immediately instead of degrading every other pane first.
dev_worker_tmux_memory_swap_max: "0"
# oom_score_adj for every command Claude Code runs. The cap above decides WHERE a kill happens; this
# decides WHO dies. A cgroup OOM kills the task with the highest badness, which is roughly its RSS. On
# dev-worker-1 (2026-10-03/04) one orchestrating session's builders ran vitest and pytest in
# parallel: up to 32 node workers of ~250 MB each inside the slice. Each worker was smaller than
# `claude` (~700 MB), so the kernel killed the agent itself, at both 6G and 9G. Raising the cap
# does not fix this, because the fan-out just grows to fill it.
# The role sets BASH_ENV (agent-shell-env.sh.j2) for Claude Code through managed settings, so every
# non-interactive bash it starts raises its own oom_score_adj, and every descendant inherits the
# value. At 500, a child's badness gains half the cgroup's limit (~4.5 GiB at 9G), so any agent
# command outranks `claude`, which stays at 0. Raising needs no privilege. The script never lowers
# a value, because that needs CAP_SYS_RESOURCE.
dev_worker_agent_oom_score_adj: 500
dev_worker_agent_shell_env_path: /usr/local/lib/dev-worker/agent-shell-env.sh

# ---- tmux persistence (NEW vs homelab) ----
dev_worker_tmux_continuum_save_interval: "15"

# ---- gh-actions-fleet (repos shown in the dashboard 'github' window) ----
dev_worker_gh_fleet_repos:
  - cchifor/platform

# ---- web terminal authentication gate (tasks/web_gate.yml, tag web-gate) ----
# Every path to ttyd is authenticated. Tunnel path: Cloudflare Access's JWT, validated on the worker
# by dw-access-verify against the team's signing keys and THIS worker's Access app AUD. LAN/Tailscale
# path: Basic auth, bridged to a cookie (Safari sends no Basic credentials on the WebSocket).
dev_worker_web_public_host: "{{ inventory_hostname | regex_replace('^dev-worker-', 'dw') }}.chifor.me"
# The only origins a WebSocket upgrade may come from (the cross-site WebSocket hijacking guard).
dev_worker_web_origins:
  - "https://{{ dev_worker_web_public_host }}"
  - "https://{{ ansible_default_ipv4.address }}"
  - "https://{{ ansible_hostname }}"
dev_worker_web_access_team_domain: chifor.cloudflareaccess.com
# { <inventory_hostname>: <64-hex AUD of that worker's Access app> } — set in group_vars from
# `tofu -chdir=kubernetes/infra/cloudflare output dev_worker_access_aud`. Not a secret (every JWT
# carries it). A worker without an entry fails the play before its Caddyfile is touched.
dev_worker_web_access_aud: {}
dev_worker_web_verify_port: 7682
# File paste (dw_paste.js on the terminal page -> dw-upload on this port -> the pastes directory).
dev_worker_web_upload_port: 7683
dev_worker_web_root: /usr/local/share/dw-web # the served terminal page + /_dw/static/*
dev_worker_web_pastes_dir: "{{ dev_worker_workspace_mount }}/{{ dev_worker_admin_user }}/pastes"
dev_worker_web_lan_user: "{{ dev_worker_admin_user }}"
# From ansible/secrets/dev-worker.sops.yaml (one fleet credential). The plaintext is only used by the
# converge self-check; Caddy gets the bcrypt. The cookie secret is 64 hex chars.
dev_worker_web_lan_password: ""
dev_worker_web_lan_password_bcrypt: ""
dev_worker_web_lan_cookie_secret: ""

# ---- firewall (LAN allowed to reach SSH / Caddy HTTPS / node_exporter) ----
dev_worker_lan_cidr: "192.168.0.0/24"

# ---- restic (QNAP backend; off by default — see docs/runbooks/dev-workers.md) ----
dev_worker_restic_backend: rest # rest | nfs | none
dev_worker_restic_repo_url: "rest:http://192.168.1.225:8000/dev-worker-{{ inventory_hostname }}"
dev_worker_restic_paths:
  - /workspace
  - /home
  - /etc/dev-worker
dev_worker_restic_keep_daily: 7
dev_worker_restic_keep_weekly: 4
dev_worker_restic_keep_monthly: 6
dev_worker_restic_nfs_export: "" # e.g. 192.168.1.225:/share/restic (backend=nfs only)
dev_worker_restic_nfs_mount: /mnt/qnap-restic

# ---- data-driven agent jobs (homelab hardcoded two; ship none by default) ----
# Each item: { name, description, calendar | (boot_sec + active_sec), enabled (timer), autostart }
dev_worker_jobs: []

# ---- agentforge — autonomous dev-agent orchestrator (ADR 0018; opt-in via group_vars at go-live) ----
# The role installs only the runtime shell (env, dirs, units, atomic self-updater); the code arrives
# as pinned releases from the Gitea generic package registry, selected by the `release` pin in the
# config repo's agentforge.json. See docs/runbooks/agentforge.md.
dev_worker_enable_agentforge: false
dev_worker_agentforge_port: 8700 # webhook receiver + /healthz + /readyz (LAN-only via ufw)
dev_worker_agentforge_metrics_port: 9464 # prometheus exporter (scraped via monitoring/agentforge.yaml)
dev_worker_agentforge_config_repo: "cchifor/agentforge-config" # owner/name; agentforge.json = control plane
dev_worker_agentforge_litellm_base: "http://192.168.0.41:30400" # litellm-local LAN NodePort (local models ONLY)
# Memory caps for the orchestrator + its agent subprocesses (claude/codex CLIs) — one cgroup, so a
# runaway run is OOM-killed in isolation (same idea as dev_worker_job_memory_* above).
dev_worker_agentforge_memory_high: "6G"
dev_worker_agentforge_memory_max: "8G"
dev_worker_agentforge_memory_swap_max: "2G"

# ---- herdr pilot (enabled ONLY on dev-worker-4 via host_vars, NOT in group_vars) ----
# Agent-native terminal multiplexer (herdr.dev) trialled BESIDE tmux — tmux keeps the 'main'
# session, ttyd parity, the dashboard, and reboot persistence; herdr adds the agent attention queue
# and native `claude --resume` after a server restart. Evaluation criteria + rollback:
# docs/runbooks/dev-workers.md § "herdr pilot".
dev_worker_enable_herdr: false
# Config converges apply via live reload (no pane kills). Flip this true for ONE run when a
# changed key genuinely needs a server restart, then revert — see handlers/main.yml.
dev_worker_herdr_force_restart: false
dev_worker_herdr_version: "0.8.2"
# Upstream releases ship no checksum file; this is the sha256 of herdr-linux-x86_64 as hashed at
# pin time (2026-08-31). Recompute whenever the version bumps.
dev_worker_herdr_sha256: "976150a14d490c94b243ea2e1a7eb2dfb67f12e36b182db90936f6728e6aecf4"
# Same idea as dev_worker_agentforge_memory_* above: one cgroup for the server + the pane processes
# it spawns, so a leak is contained inside the unit instead of starving the VM.
dev_worker_herdr_memory_high: "6G"
dev_worker_herdr_memory_max: "8G"
dev_worker_herdr_memory_swap_max: "2G"

# ---- OpenBao credential plumbing (ADR 0020; opt-in until the cluster side is active) ----
# Per-worker AppRole identity: a root-owned bao agent keeps a PERIODIC token renewed (the 768h
# max-TTL expiry that locked the estate out on 2026-08-25 cannot hit a periodic token) and renders
# credential files; interactive agents fetch ad-hoc secrets via /usr/local/bin/cred, which reads
# the group-readable sink token. Activation ceremony: docs/runbooks/openbao-dev-workers.md.
dev_worker_enable_openbao: false
dev_worker_openbao_addr: "https://openbao.lan.chifor.me:30820" # openbao-lan NodePort (SAN on openbao-tls)
# Registry every user's Docker is logged into as the read-only `pull` user (tasks/registry_login.yml).
dev_worker_registry_host: registry.chifor.me
# /etc/hosts rows for the LAN name — the workers resolve via the LAN resolver cloud-init gave them
# and the name has no public record, so it is pinned host-side. All three node IPs: the Go dialer
# walks the resolved addresses in turn, so a drained node is a retry, not an outage.
dev_worker_openbao_hosts_entries:
  - "192.168.0.41 openbao.lan.chifor.me"
  - "192.168.0.42 openbao.lan.chifor.me"
  - "192.168.0.43 openbao.lan.chifor.me"
# Pinned like herdr, but upstream DOES publish per-release checksums: this is the sha256 of
# bao_<version>_Linux_x86_64.tar.gz from the release's checksums-linux.txt. Re-read it on a bump.
dev_worker_openbao_version: "2.5.5"
dev_worker_openbao_sha256: "2c5577707e97fc95c2086950f39880ead5e45b356c94388e5cb606f5a5c2b697"

# ---- secrets (provided by SOPS via the playbook pre_task; "" so asserts can detect "unset") ----
dev_worker_restic_password: ""
dev_worker_cf_tunnel_token: ""
dev_worker_admin_password: ""
# agentforge secrets (asserted non-empty in tasks/agentforge.yml when the feature is enabled).
# Bot PATs + the webhook HMAC are minted print-once by cchifor/agentforge's bootstrap_gitea.py;
# the litellm key is litellm-local-secret's master-key (kubernetes/apps/apps/ai).
dev_worker_agentforge_webhook_secret: ""
dev_worker_agentforge_litellm_key: ""
dev_worker_agentforge_planner_token: ""
dev_worker_agentforge_tester_token: ""
dev_worker_agentforge_impl_token: ""
dev_worker_agentforge_reviewer_token: ""
# openbao AppRole login (per-host map keyed by inventory_hostname; minted by the ceremony in
# docs/runbooks/openbao-dev-workers.md and stored ONLY in the local SOPS file + the worker).
# Shape: { dev-worker-1: { role_id: "...", secret_id: "..." }, ... }
dev_worker_openbao_credentials: {}

# tep — the test-environment pool CLI (tasks/tep.yml). The kubeconfig renders only when
# ansible/secrets/tep-tokens.sops.yaml exists (generated by scripts/tep-render-kubeconfigs.py
# after the testpool tree is live); until then only the CLI binary is installed.
dev_worker_tep_enabled: true
dev_worker_tep_server: "https://192.168.0.40:6443"
dev_worker_tep_namespace: testpool

# ---- kubeconfig cutover (ADR 0021) ---------------------------------------------------------------
# Flip to true FOR ONE HOST AT A TIME to move that worker's ~/.tep/kubeconfig — and add
# ~/.helmtest/kubeconfig — from the ansible+SOPS writer to openbao-agent rendering from
# af/dev-workers/<host>. It is not a fleet switch:
#
#   ansible-playbook dev-workers.yml -l dev-worker-1 -t openbao \
#     -e dev_worker_openbao_kubeconfig_cutover=true
#
# The role refuses to cut over until it has read BOTH KV fields on that host, under that host's own
# AppRole identity, and confirmed each parses as a kubeconfig pointing at dev_worker_tep_server with
# >72h of token life. It then writes the durable marker /etc/openbao-agent/renders-kubeconfigs, which
# is what makes the agent emit the stanzas AND what makes tep.yml stand its writer down. Deleting
# that marker (and restarting the agent) is the rollback; the role does it automatically if the
# post-restart health check fails.
#
# Once a host has the marker this flag is a no-op there, so it is safe to leave set — but leave it
# false by default so a routine full run can never cut a host over as a side effect.
dev_worker_openbao_kubeconfig_cutover: false

# The per-worker Helm deploy namespace (kubernetes/apps/infrastructure/helmtest). Documentation for
# the CLAUDE.md block below; the authoritative value is inside the kubeconfig the sync mints.
dev_worker_helmtest_namespace: "helmtest-{{ inventory_hostname | regex_replace('^dev-worker-', 'dw') }}"

# Daily buildx prune (tasks/docker.yml): keep at most this much build cache, evicting least
# recently used records. A size cap, because the age filter is a no-op on buildx 0.37.
dev_worker_buildx_cache_max: "20GB"

# The same daily unit also removes anonymous docker volumes that no container (running or stopped)
# references — label com.docker.volume.anonymous only, never named volumes. Throwaway test containers
# removed without -v leave one each (dev-worker-3: 240, 12 GB, on 2026-10-06).
dev_worker_anon_volume_prune: true

# Daily `cleanup --deps` (tasks/cleanup.yml): remove node_modules / .venv / Rust target from git
# worktrees under /workspace and /home that nothing has touched for this many days and no process
# or running container is using. Source, git state and untracked files are never touched.
dev_worker_deps_prune_enabled: true
dev_worker_deps_prune_days: 14

# The same timer's first step, `cleanup --worktrees`: whole LINKED git worktrees (never a main
# clone) that are clean (no changes, no untracked files), not in use, and either already merged into
# the remote default branch and idle merged_days, or idle prune_days with HEAD on a remote branch.
# Removed with `git worktree remove` (no --force) as the owner; branch refs are kept.
# report = log what it would remove (--dry-run) · remove = remove it · off = skip the step
# (an unquoted `off` is YAML false, which also means off). `remove` since 2026-10-06, after 4-5
# days of clean reports on all four workers (no errors; dw3 40 / 9.8 GB, dw4 51 / 6.2 GB waiting)
# and the dev-worker-3 disk-full repeat. `remove` also lets disk-guard use the step under pressure.
dev_worker_worktree_prune_mode: remove
dev_worker_worktree_prune_days: 30
dev_worker_worktree_prune_merged_days: 3

# disk-guard (tasks/disk_guard.yml): every interval, if / or /workspace is under `low` percent
# free, reclaim regenerable things (build cache, anonymous volumes, stopped non-compose containers
# and unused images, merged worktrees, idle deps) until `target` percent. Docker steps wait while a
# docker client is pulling/building unless the disk is under `critical`. The image/deps thresholds
# are tighter than the daily timers' because they only apply under pressure (merged worktrees go
# after 1 idle day there; the stale-worktree threshold is dev_worker_worktree_prune_days for both).
dev_worker_disk_guard_enabled: true
dev_worker_disk_guard_interval: 5min
dev_worker_disk_guard_low: 15
dev_worker_disk_guard_target: 25
dev_worker_disk_guard_critical: 5
dev_worker_disk_guard_image_days: 3
dev_worker_disk_guard_deps_days: 3

# The agents' archive dir (tasks/disk_guard.yml): where the agent guide tells them to keep evidence
# they want after a task, instead of tarballs in $HOME on the 40 GB root disk (dev-worker-3,
# 2026-10-09: ~50 GB of "qualification archives" across / and /workspace filled both). disk-guard
# caps it on every run, low disk or not: oldest-changed top-level entry first, never one changed
# within the hour. GB = 10^9 bytes.
dev_worker_archive_dir: "{{ dev_worker_workspace_mount }}/archive"
dev_worker_archive_max_gb: 20
