---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted

- name: Restart ttyd
  ansible.builtin.systemd:
    name: ttyd
    state: restarted

- name: Reload caddy
  ansible.builtin.systemd:
    name: caddy
    state: reloaded

- name: Reload sshd
  ansible.builtin.systemd:
    name: ssh
    state: reloaded

- name: Restart cloudflared
  ansible.builtin.systemd:
    name: cloudflared
    state: restarted

# try-restart = restart only if running. On the FIRST provisioning run the service cannot start
# until agentforge-update.sh installs a release (timer-first bootstrap), so a plain
# `state: restarted` would fail the play; try-restart is a no-op then, and day-2 env/unit changes
# restart the running service as expected.
- name: Restart agentforge
  ansible.builtin.command: systemctl try-restart agentforge.service
  changed_when: true
  when: dev_worker_enable_agentforge | default(false) | bool

# Same shape as Restart agentforge above, for the same class of reason: the command module is
# skipped in check mode, so a first-run `--check` preview (where the unit file was never really
# written) doesn't die in the handler flush the way a systemd-module restart of a not-found unit
# does. try-restart is also a no-op on a stopped unit.
- name: Restart herdr
  ansible.builtin.command: systemctl try-restart herdr.service
  changed_when: true
  when: dev_worker_enable_herdr | default(false) | bool

# Live config apply — no pane kills (see the note at the config template task). Runs as the
# agent user against their HOME-based server socket (verified working under env -i with just
# HOME on dw5). FAIL-CLOSED: only a dead server is tolerated (the unit start reads fresh
# config anyway); any other failure (invalid config, socket errors, missing subcommand)
# fails the converge — failed_when: false here converged green while the server kept stale
# settings (both reviewers' catch on the PR).
# Deterministic, no substring guessing (reviewer-codex round 2): a failed reload is
# tolerated ONLY when systemctl says the unit is not active (dead server; the unit start
# reads fresh config) — any failure while the server runs fails the converge. And herdr's
# own reload response is the authority on restart-required keys: a reload that "applies"
# with non-empty diagnostics fails the converge too, telling the operator to use the
# force-restart flag — a restart-only key can no longer converge green while unapplied.
- name: Reload herdr config
  ansible.builtin.shell: |
    out=$(/usr/local/bin/herdr server reload-config 2>&1); rc=$?
    if [ $rc -eq 0 ]; then
      case "$out" in *'"diagnostics":[]'*) exit 0 ;; esac
      echo "reload applied WITH diagnostics - key(s) likely need a restart; rerun with -e dev_worker_herdr_force_restart=true: $out" >&2
      exit 1
    fi
    if systemctl is-active --quiet herdr.service; then
      echo "reload FAILED (rc=$rc) while the server is ACTIVE - stale config: $out" >&2
      exit 1
    fi
    echo "server not active; unit start will read fresh config"
    exit 0
  become: true
  become_user: "{{ dev_worker_admin_user }}"
  environment:
    HOME: "/home/{{ dev_worker_admin_user }}"
  changed_when: true
  when:
    - dev_worker_enable_herdr | default(false) | bool
    - not (dev_worker_herdr_force_restart | default(false) | bool)
  listen: Reload herdr config

# Escape hatch for config keys that genuinely need a restart (reviewer-claude's catch: a
# reload-only path would apply them silently never). Opt in per run/host with
# dev_worker_herdr_force_restart=true, then revert — pane-killing, so deliberate only.
- name: Reload herdr config (forced restart)
  ansible.builtin.command: systemctl try-restart herdr.service
  changed_when: true
  when:
    - dev_worker_enable_herdr | default(false) | bool
    - dev_worker_herdr_force_restart | default(false) | bool
  listen: Reload herdr config

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

# Dropping a certificate into /usr/local/share/ca-certificates does nothing until the bundle is
# rebuilt; there is no module for it (openbao.yml installs the ailab root CA).
- name: Update CA trust
  ansible.builtin.command: update-ca-certificates
  changed_when: true

# The check-mode guard is the same concern the agentforge/herdr handlers above solve implicitly (the
# command module is skipped in check mode): a first-run --check preview never really writes the unit
# file, and the systemd module fails on a unit it cannot find. Spelled out here because this handler
# uses the module.
- name: Restart openbao-agent
  ansible.builtin.systemd:
    name: openbao-agent.service
    state: restarted
  when: not ansible_check_mode
