---
# NEW vs homelab: Codex, installed per-user into ~/.npm-global exactly like Claude Code (reuses the
# npm prefix + PATH set up in claude_code.yml). The npm package keeps Claude Code + Codex symmetric;
# same presence-probe idempotency, PLUS a version floor: codex does NOT self-update (it only nags),
# and a model can require a newer CLI than the one on disk — gpt-6-astra needs >= 0.153.0
# (measured 2026-09-05: 0.152.1 rejected, 0.153.0 accepted), and an older CLI is rejected upstream
# with `400 The 'gpt-6-astra' model requires a newer version of Codex` (the fleet sat on
# 0.142.5–0.153.0 that day). So any user whose CLI is below
# dev_worker_codex_version is upgraded to exactly it; a newer one is left alone.
#
# The model pin lives in each user's ~/.codex/config.toml as TOP-LEVEL keys (`model`,
# `model_reasoning_effort`). codex appends `[projects.*]` trust tables to that same file at runtime
# (and users may add `[profiles.*]`), and TOML top-level keys must precede the first table header.
# The edit is therefore SECTION-AWARE: community.general.ini_file with no `section` targets only the
# region before the first `[table]` — a same-named key inside a table is neither matched nor touched,
# and a missing key is inserted at the top (proven 2026-09-05 against a `[profiles.review]` fixture;
# lineinfile would have rewritten the profile's line instead). Never template the whole file: that
# would wipe the trust tables and any user-added settings. Own tag: --tags codex (users.yml's
# dev_worker_users fact is `always`).

- name: Probe installed Codex per user
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.command: "{{ item.home }}/{{ dev_worker_npm_dir }}/bin/codex --version"
  register: dev_worker_codex_probe
  changed_when: false
  failed_when: false
  check_mode: false # probe only — must run under --check so the version test below has data
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

# `codex --version` prints `codex-cli X.Y.Z`; absent (rc != 0) or older than the pin → (re)install.
# The version is taken from the `codex-cli ` prefix specifically, so an upgrade-nag line carrying
# another x.y.z can never be mistaken for the installed version.
- name: Install or upgrade Codex per user (absent, or below the pinned version)
  become: true
  become_user: "{{ item.0.name }}"
  ansible.builtin.command: "npm install -g {{ dev_worker_codex_pkg }}@{{ dev_worker_codex_version }}"
  environment:
    npm_config_prefix: "{{ item.0.home }}/{{ dev_worker_npm_dir }}"
  when: >-
    item.1.rc != 0
    or (item.1.stdout | regex_search('(?<=codex-cli )[0-9]+[.][0-9]+[.][0-9]+') | default('0', true))
       is version(dev_worker_codex_version, '<')
  changed_when: true
  loop: "{{ dev_worker_users | zip(dev_worker_codex_probe.results) | list }}"
  loop_control:
    label: "{{ item.0.name }}"

# credentials.yml (later in the role) also ensures this dir; it is repeated here so a tag-limited
# `--tags codex` run works on a host where the users exist but credentials.yml has not run under
# the tag. (User creation itself is untagged, so a genuinely fresh host needs a full role run.)
- name: Ensure each user's ~/.codex exists
  ansible.builtin.file:
    path: "{{ item.home }}/.codex"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Pin the Codex model + reasoning effort per user (top-level keys, table-aware, in place)
  community.general.ini_file:
    path: "{{ item.0.home }}/.codex/config.toml"
    # No `section`: only the top-level region (before the first table header) is edited.
    option: "{{ item.1.key }}"
    value: '"{{ item.1.value }}"'
    no_extra_spaces: false # `key = "value"`, the form codex itself writes
    create: true
    owner: "{{ item.0.name }}"
    group: "{{ item.0.name }}"
    mode: "0600"
  when: item.1.value | length > 0
  loop: >-
    {{ dev_worker_users | product([
         {'key': 'model', 'value': dev_worker_codex_model},
         {'key': 'model_reasoning_effort', 'value': dev_worker_codex_reasoning_effort}
       ]) | list }}
  loop_control:
    label: "{{ item.0.name }} {{ item.1.key }}"

# Network inside the workspace-write sandbox (defaults/main.yml: dev_worker_codex_sandbox_network). A
# TOML table, so ini_file WITH a section: it edits only the `[sandbox_workspace_write]` table, creates
# the table at the end of the file when it is missing, and never touches top-level keys or other
# tables. Unquoted value: TOML boolean, not a string.
# Checked once, up front: `null` (a blank YAML value) would otherwise read as "managed" and `| bool`
# would write `false` (flipping the sandbox offline), and a typo would fail per user deep in the loop.
# Strings "true"/"false" are accepted because that is what `-e dev_worker_codex_sandbox_network=false` passes.
- name: Validate dev_worker_codex_sandbox_network
  ansible.builtin.assert:
    that:
      - >-
        dev_worker_codex_sandbox_network is boolean
        or dev_worker_codex_sandbox_network in ['', 'true', 'false']
    fail_msg: >-
      dev_worker_codex_sandbox_network must be true, false, or "" (unmanaged); got
      {{ dev_worker_codex_sandbox_network | string }}.
    quiet: true

- name: Codex workspace-write sandbox network access per user
  community.general.ini_file:
    path: "{{ item.home }}/.codex/config.toml"
    section: sandbox_workspace_write
    option: network_access
    value: "{{ dev_worker_codex_sandbox_network | string | lower }}"
    no_extra_spaces: false
    create: true
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0600"
  when: dev_worker_codex_sandbox_network | string | length > 0
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

# ---- Codex through the estate's LLM router (defaults/main.yml: dev_worker_codex_router_*) ----
# The CLI's own Responses protocol, served by the router's Codex-native routes (llm-router
# `codexNative`), which pin the subscription the dev workers share (codex-5). Three edits per user, all
# table-aware like the ones above, so codex's [projects.*] trust tables and anything a user added stay:
#   1. top-level `model_provider = "<provider>"` (absent = codex's built-in `openai`, the host login);
#   2. the [model_providers.<provider>] table: base_url, wire_api and the `auth` command, which codex
#      runs to get the bearer (no key in the file, and none in any environment the CLI or its tools see);
#   3. a `chatgpt` profile, ~/.codex/chatgpt.config.toml (codex 0.162 refuses the legacy
#      [profiles.chatgpt] table), as the escape hatch back to the host's own login: `codex -p chatgpt`.
# Turning it off removes 1 and 2 (the profile is harmless and stays). A running TUI or app-server daemon
# keeps the provider it started with: `codex app-server daemon restart` after a change.
- name: Install the router-key helper codex's provider auth runs
  ansible.builtin.template:
    src: codex-router-key.j2
    dest: /usr/local/bin/codex-router-key
    owner: root
    group: root
    mode: "0755"
  when: dev_worker_codex_router_enabled | bool

- name: Remove the router-key helper (router provider off)
  ansible.builtin.file:
    path: /usr/local/bin/codex-router-key
    state: absent
  when: not dev_worker_codex_router_enabled | bool

- name: Point each user's codex at the router provider (top-level key, table-aware, in place)
  community.general.ini_file:
    path: "{{ item.home }}/.codex/config.toml"
    # No `section`: the top-level region only, as for the model pin above.
    option: model_provider
    value: '"{{ dev_worker_codex_router_provider }}"'
    state: "{{ 'present' if dev_worker_codex_router_enabled | bool else 'absent' }}"
    no_extra_spaces: false
    create: true
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0600"
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: The router provider table per user
  community.general.ini_file:
    path: "{{ item.0.home }}/.codex/config.toml"
    section: "model_providers.{{ dev_worker_codex_router_provider }}"
    option: "{{ item.1.key }}"
    value: "{{ item.1.value }}"
    no_extra_spaces: false
    create: true
    owner: "{{ item.0.name }}"
    group: "{{ item.0.name }}"
    mode: "0600"
  when: dev_worker_codex_router_enabled | bool
  loop: >-
    {{ dev_worker_users | product([
         {'key': 'name', 'value': '"' ~ dev_worker_codex_router_provider ~ '"'},
         {'key': 'base_url', 'value': '"' ~ dev_worker_codex_router_base_url ~ '"'},
         {'key': 'wire_api', 'value': '"responses"'},
         {'key': 'auth', 'value': '{ command = "/usr/local/bin/codex-router-key" }'}
       ]) | list }}
  loop_control:
    label: "{{ item.0.name }} {{ item.1.key }}"

- name: Remove each user's cached router key (router provider off)
  ansible.builtin.file:
    path: "{{ item.home }}/.config/llm-router/codex.key"
    state: absent
  when: not dev_worker_codex_router_enabled | bool
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove the router provider table (router provider off)
  community.general.ini_file:
    path: "{{ item.home }}/.codex/config.toml"
    section: "model_providers.{{ dev_worker_codex_router_provider }}"
    state: absent
  when: not dev_worker_codex_router_enabled | bool
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

# `[features] api_key_model_discovery = false`, pinned so the CLI and the app-server daemon agree whatever
# their versions. The feature asks a custom provider's GET /models for the model list; the router answers
# OpenAI's list (of route names, for a route-scoped key), which codex cannot decode ("failed to refresh
# available models: failed to decode models response", every 4.5 min in the 0.162 daemon's log). Its
# default also differs by version (off in 0.160, on in 0.162), and a TUI refuses a daemon whose feature
# set differs: "Background server has incompatible feature settings" (dev-worker-2, 2026-10-09). The
# model metadata codex needs is its own catalog's for gpt-6-astra, which discovery would not improve.
# Pinned whatever the provider: discovery is irrelevant to the built-in ChatGPT provider, and a pin that
# came and went with the router would bring the version-dependent default (and the prompt) back.
# A RUNNING daemon keeps the features it started with, so a change here is announced below.
- name: Pin codex model discovery off per user (CLI and daemon must agree)
  community.general.ini_file:
    path: "{{ item.home }}/.codex/config.toml"
    section: features
    option: api_key_model_discovery
    value: "false"
    no_extra_spaces: false
    create: true
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0600"
  register: dev_worker_codex_feature_pin
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Announce the app-server daemon restart the pin needs (never done here; it interrupts attached TUIs)
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: codex features changed for
      {{ dev_worker_codex_feature_pin.results | selectattr('changed') | map(attribute='item.name') | join(', ') }}.
      Their running app-server daemon still has its old feature set, and new TUIs will hit "Background
      server has incompatible feature settings" until it restarts. As each user, when no TUI is attached:
      `codex app-server daemon restart` (runbook dev-workers.md, "Codex through the router").
  when: dev_worker_codex_feature_pin.results | selectattr('changed') | list | length > 0

# The `chatgpt` profile is its own file. Codex 0.162 refuses `-p chatgpt` while config.toml still holds
# the legacy table: "--profile `chatgpt` cannot be used while config.toml contains legacy ...
# [profiles.chatgpt] config; move those settings into ~/.codex/chatgpt.config.toml" (dev-worker-1,
# 2026-10-09). Plain `codex` was unaffected, so only the escape hatch broke. The legacy table goes
# whatever the provider, because the file replaces it.
- name: Remove a legacy top-level `profile = "chatgpt"` selector (the same refusal names it)
  community.general.ini_file:
    path: "{{ item.home }}/.codex/config.toml"
    # No `section`: the top-level region only. `exclusive: false` with the value removes exactly that line, so a
    # selector of another profile (the user's own) stays.
    option: profile
    value: '"chatgpt"'
    exclusive: false
    state: absent
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove the legacy [profiles.chatgpt] table (codex 0.162 refuses -p chatgpt while it exists)
  community.general.ini_file:
    path: "{{ item.home }}/.codex/config.toml"
    section: profiles.chatgpt
    state: absent
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: A `chatgpt` profile file per user (the host's own login, for when the router cannot serve)
  ansible.builtin.copy:
    dest: "{{ item.home }}/.codex/chatgpt.config.toml"
    content: |
      # Managed by ansible (dev_worker role). `codex -p chatgpt`: the host's own ChatGPT login instead of the router.
      model_provider = "openai"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0600"
  when: dev_worker_codex_router_enabled | bool
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"
