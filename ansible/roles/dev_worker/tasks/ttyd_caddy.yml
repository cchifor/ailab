---
# Section 6 (homelab): web terminal (ttyd, 127.0.0.1:7681) behind Caddy (LAN HTTPS via its local CA).
# The Caddyfile itself — the authentication gate — is web_gate.yml (tag web-gate).
- name: Install ttyd {{ dev_worker_ttyd_version }}
  ansible.builtin.get_url:
    url: "https://github.com/tsl0922/ttyd/releases/download/{{ dev_worker_ttyd_version }}/ttyd.x86_64"
    dest: "/usr/local/bin/ttyd-{{ dev_worker_ttyd_version }}"
    mode: "0755"

- name: Link /usr/local/bin/ttyd -> ttyd-{{ dev_worker_ttyd_version }}
  ansible.builtin.file:
    src: "/usr/local/bin/ttyd-{{ dev_worker_ttyd_version }}"
    dest: /usr/local/bin/ttyd
    state: link

- name: Install the ttyd systemd unit
  ansible.builtin.template:
    src: ttyd.service.j2
    dest: /etc/systemd/system/ttyd.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart ttyd

# Caddy comes from its pinned GitHub release .deb (sha512 from the release's checksums file), not the
# Cloudsmith apt repo. Since 2026-10-09 that repo answers 402 Payment Required (bandwidth quota,
# caddyserver/caddy#8184). A dead source in sources.list.d fails EVERY `update_cache: true` in this
# role, which broke the whole role, not just Caddy. The repo and its key are removed so they cannot
# poison apt again. Pinned to the version every worker already runs, so this changes no installed
# package; bump dev_worker_caddy_version deliberately.
- name: Remove the Cloudsmith Caddy apt repository (402 since 2026-10-09)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/caddy-stable.sources
    - /etc/apt/keyrings/caddy-stable.asc

- name: Read the installed Caddy version
  ansible.builtin.package_facts:
    manager: apt

# Download + install only when the installed version differs, so a routine converge never fetches
# the 18 MB .deb (and check mode does not trip over a download it skipped).
- name: Download Caddy {{ dev_worker_caddy_version }} (.deb, checksum-verified)
  when: >-
    (ansible_facts.packages.caddy | default([{"version": ""}]))[0].version != dev_worker_caddy_version
  ansible.builtin.get_url:
    url: "https://github.com/caddyserver/caddy/releases/download/v{{ dev_worker_caddy_version }}/caddy_{{ dev_worker_caddy_version }}_linux_amd64.deb"
    dest: "/var/cache/apt/archives/caddy_{{ dev_worker_caddy_version }}_linux_amd64.deb"
    checksum: "sha512:https://github.com/caddyserver/caddy/releases/download/v{{ dev_worker_caddy_version }}/caddy_{{ dev_worker_caddy_version }}_checksums.txt"
    mode: "0644"

- name: Install Caddy {{ dev_worker_caddy_version }}
  when: >-
    (ansible_facts.packages.caddy | default([{"version": ""}]))[0].version != dev_worker_caddy_version
  ansible.builtin.apt:
    deb: "/var/cache/apt/archives/caddy_{{ dev_worker_caddy_version }}_linux_amd64.deb"

- name: Enable + start ttyd + caddy
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - ttyd.service
    - caddy.service
