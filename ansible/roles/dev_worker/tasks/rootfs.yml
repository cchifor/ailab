---
# Grow the root partition + ext4 filesystem online to fill the scsi0 disk after it is enlarged in tofu
# (kubernetes/infra/dev-workers: dev_worker_rootfs_gb). cloud-init's growpart only runs at boot; this
# applies a resize without a reboot. Idempotent: growpart says NOCHANGE when the partition already
# fills the disk, and resize2fs says "Nothing to do" when the filesystem fills the partition. Own
# tag: --tags rootfs.
# W6 of plans/2026-10-09-dev-worker-disk-hardening-plan.md (40 -> 60 GB, 2026-10-09).
- name: Find the root filesystem's device and type
  ansible.builtin.command: findmnt -n -o SOURCE,FSTYPE /
  register: dev_worker_rootfs_src
  changed_when: false
  check_mode: false

- name: Ensure growpart is installed (cloud-guest-utils)
  ansible.builtin.package:
    name: cloud-guest-utils
    state: present

# The rescan makes the guest see a disk enlarged while it runs even if QEMU's capacity-change event
# was missed (it would otherwise report NOCHANGE and pass green at the old size).
- name: Grow the root partition to fill its disk
  ansible.builtin.shell: |
    set -euo pipefail
    part={{ dev_worker_rootfs_src.stdout.split()[0] }}
    disk=/dev/$(lsblk -no PKNAME "$part")
    num=$(cat "/sys/class/block/$(basename "$part")/partition")
    echo 1 > "/sys/class/block/$(basename "$disk")/device/rescan" 2>/dev/null || true
    growpart "$disk" "$num"
  args:
    executable: /bin/bash
  register: dev_worker_growpart
  changed_when: "'CHANGED' in dev_worker_growpart.stdout"
  failed_when: dev_worker_growpart.rc != 0 and 'NOCHANGE' not in dev_worker_growpart.stdout
  when: dev_worker_rootfs_src.stdout.split()[1] == 'ext4'

# Every run, not only when growpart changed something this run: a resize2fs that failed (or a play
# interrupted) after growpart, or a partition grown elsewhere, still converges on the next run.
- name: Grow the root ext4 filesystem online
  ansible.builtin.command: resize2fs {{ dev_worker_rootfs_src.stdout.split()[0] }}
  register: dev_worker_resize2fs
  changed_when: "'Nothing to do' not in (dev_worker_resize2fs.stdout + dev_worker_resize2fs.stderr)"
  when: dev_worker_rootfs_src.stdout.split()[1] == 'ext4'
