---
# The Gitea pre-flight for the per-slot cut-over, imported TWICE by openbao_switch.yml.
#
# With dev_worker_gitea_identity_cutover the agent renders ~/.git-credentials from THIS slot's flat
# document instead of common. The `<no value>` guard (error_on_missing_key) would then stop the whole
# agent on a missing field: failure detection, not a gate. This is the gate: the short hostname must
# be the inventory name (`cred` finds the slot by hostname, the template by inventory name), and all
# three Gitea fields must be readable under this host's own AppRole, non-empty, and not a copy of the
# shared token. Values stay in shell variables, never on stdout. Whether the token really is
# `<slot>-bot` (GET /user) is the runbook's pre-flight: it needs the forge, which a converge does not.
#
# `cred` reads through the bao agent's sink token, which exists only once the agent has run on this
# host. On a fresh or rebuilt slot whose host_vars already set the gate, there is none yet: the first
# import (dev_worker_gitea_preflight_may_defer) then checks the hostname, prints "deferred" and
# passes, and the second — inside the guarded switch, after the agent has started and the render is
# verified, before the username pin — runs the field checks, where a failure rolls back to the shared
# login like any other. Not deferred, a missing token is a failure. Only a first switch defers: on a
# slot already switched to its own bot (last verified template), no sink token means a dead agent.
- name: Pre-flight this slot's own Gitea tokens (values never printed)
  ansible.builtin.shell: |
    set -o pipefail
    slot={{ inventory_hostname | quote }}
    [ "$(hostname -s)" = "$slot" ] || { echo "hostname -s is '$(hostname -s)', not $slot" >&2; exit 90; }
    if [ ! -r {{ dev_worker_openbao_sink_token | quote }} ]; then
    {% if dev_worker_gitea_preflight_may_defer | bool %}
      # Defer only a FIRST switch. A slot whose last verified credential template already names its
      # own bot has been cut over before, so a missing sink token there means its agent is down (/run
      # is tmpfs: a slot field gone from KV kills it at boot). Deferring would start that dying agent
      # and roll back onto the same slot template; failing here says what is wrong and changes nothing.
      good=/etc/openbao-agent/git-credentials.ctmpl.last-good
      prev=""
      [ -f "$good" ] && prev="$(sed -n 's#^.*https://\([^:/@]*\):.*$#\1#p' "$good" | head -n 1)"
      if [ -n "$prev" ] && [ "$prev" != dev-worker-bot ]; then
        echo "no agent sink token, but this slot was already switched to $prev: openbao-agent is not running (check its journal and af/dev-workers/$slot)" >&2
        exit 95
      fi
      echo "deferred: the agent has not run on this host yet, so there is no sink token to read with"
      exit 0
    {% else %}
      echo "no agent sink token even with the agent started" >&2
      exit 94
    {% endif %}
    fi
    for field in gitea_pat gitea_repo_pat gitea_package_pat; do
      mine="$(/usr/local/bin/cred get "$slot" "$field")" || { echo "cannot read $field for $slot" >&2; exit 91; }
      [ -n "$mine" ] || { echo "$field is empty in af/dev-workers/$slot" >&2; exit 92; }
      shared="$(/usr/local/bin/cred get common "$field" 2>/dev/null)" || shared=""
      [ "$mine" != "$shared" ] || { echo "$field in af/dev-workers/$slot is the shared dev-worker-bot token" >&2; exit 93; }
    done
    echo preflight-ok
  args:
    executable: /bin/bash
  register: dev_worker_gitea_preflight
  changed_when: false
  check_mode: false # read-only, so a check run reports the failure the real run would hit
