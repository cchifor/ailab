---
# Sections 2 / 2.5 / 2.6 / 15 (homelab): Docker Engine + Compose + oxker. ailab change: instead of
# bind-mounting /var/lib/docker onto /workspace (homelab's tiny-root-disk workaround), set docker's
# data-root to /workspace/docker directly in daemon.json — same outcome (build/image churn off the
# OS disk), fewer moving parts. /workspace is mounted first (see tasks/main.yml ordering).

- name: Add Docker apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/docker.asc
    enabled: true

- name: Install Docker engine + CLI + Buildx + Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Add the dev-worker users to the docker group
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: docker
    append: true
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure docker data-root dir on /workspace
  ansible.builtin.file:
    path: /workspace/docker
    state: directory
    mode: "0710"

# Own tag so a daemon.json change (e.g. the BuildKit GC policy) can be rolled out alone, worker by
# worker: --tags docker_daemon. The restart keeps containers (live-restore) but fails any in-flight
# build or pull, so roll out when the worker's docker is idle.
- name: Lay down /etc/docker/daemon.json (data-root, log rotation, live-restore, BuildKit GC)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart docker
  tags: [docker_daemon]

- name: Enable + start docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

# oxker — lightweight Rust/ratatui Docker TUI for the dashboard 'docker' window.
- name: Install oxker {{ dev_worker_oxker_version }}
  ansible.builtin.unarchive:
    src: "https://github.com/mrjackwills/oxker/releases/download/v{{ dev_worker_oxker_version }}/oxker_linux_x86_64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    creates: "/usr/local/bin/.oxker-{{ dev_worker_oxker_version }}"

- name: Mark installed oxker version
  ansible.builtin.copy:
    content: "{{ dev_worker_oxker_version }}\n"
    dest: "/usr/local/bin/.oxker-{{ dev_worker_oxker_version }}"
    mode: "0644"
    force: false

# Section 2.6: cap dockerd RSS so a leaked daemon is OOM-killed + restarted in isolation instead of
# dragging the whole VM into swap-thrash. Weekly preventive restart keeps the leak from accumulating.
- name: Ensure docker.service drop-in dir
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: Install dockerd memory-cap drop-in
  ansible.builtin.template:
    src: docker-memory-cap.conf.j2
    dest: /etc/systemd/system/docker.service.d/memory-cap.conf
    mode: "0644"
  notify:
    - Reload systemd
    - Restart docker

- name: Install docker weekly-restart unit + timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.dest }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - dest: docker-weekly-restart.service
      content: |
        [Unit]
        Description=Weekly preventive restart of dockerd (mitigate slow memory growth)
        # No Requires=/After=docker.service on purpose: try-restart bounces docker only if running,
        # never starts it from stopped, and reset-failed clears any accumulated start-limit state.

        [Service]
        Type=oneshot
        ExecStartPre=/bin/systemctl reset-failed docker.service docker.socket
        ExecStart=/bin/systemctl try-restart docker.service
    - dest: docker-weekly-restart.timer
      content: |
        [Unit]
        Description=Trigger weekly preventive docker restart

        [Timer]
        OnCalendar=Sun 04:00:00
        Persistent=true
        Unit=docker-weekly-restart.service

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.dest }}"
  notify: Reload systemd

# Section 15: daily buildx cache prune so containerd's overlayfs snapshotter doesn't grow unbounded.
# Since 2026-10-09 a BACKSTOP: BuildKit's own GC (daemon.json `builder.gc`, dev_worker_buildkit_gc_*)
# enforces the same cap continuously; this keeps the daily sweep in case the GC policy is lost.
# Size-capped, NOT age-filtered: `buildx prune --filter=until=168h` removes nothing on buildx 0.37 /
# BuildKit 0.33 — this timer logged "Total: 0B" every week while 20+ GB of cache sat unused on every
# worker (found 2026-09-23). --max-used-space evicts least-recently-used records above the cap.
# Daily, not weekly (2026-10-02): agents rebuild enough between Sundays to double the cap — dev-worker-1
# sat at 38 GB five days after a run, and one run of this unit took it to 25.8 GB.
#
# Same unit, FIRST step: anonymous volumes no container references. Nothing else reaped them, and
# throwaway `docker run postgres` test loops (removed without -v) left one PGDATA volume per run:
# dev-worker-3's /workspace hit 100% on 2026-10-06 with 240 of them (12.1 GB, 180 created in one
# day), dev-worker-4 had 85 (9 GB). The label filter, not docker's default, keeps it to anonymous
# volumes: named ones (compose pgdata, signing keys) are never touched even if unreferenced, and a
# stopped container still references its anonymous volumes. First and `-`-prefixed: in a oneshot a
# failing ExecStart skips the ones after it, so the buildx prune (whose failure should stay visible)
# runs last and a failed volume prune never blocks it.
# Own tag so it can be rolled out alone: --tags buildx_prune.
- name: Install docker buildx-prune unit + timer
  tags: [buildx_prune]
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.dest }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - dest: docker-buildx-prune.service
      content: |
        [Unit]
        Description=Cap docker buildkit cache at {{ dev_worker_buildx_cache_max }} (LRU eviction){{ ', prune unused anonymous volumes' if dev_worker_anon_volume_prune | bool else '' }}
        Requires=docker.service
        After=docker.service

        [Service]
        Type=oneshot
        {% if dev_worker_anon_volume_prune | bool %}
        ExecStart=-/usr/bin/docker volume prune -f --filter label=com.docker.volume.anonymous
        {% endif %}
        ExecStart=/usr/bin/docker buildx prune -f --max-used-space {{ dev_worker_buildx_cache_max }}
    - dest: docker-buildx-prune.timer
      content: |
        [Unit]
        Description=Daily docker buildx prune

        [Timer]
        OnCalendar=*-*-* 03:00
        RandomizedDelaySec=30m
        Persistent=true
        Unit=docker-buildx-prune.service

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.dest }}"
  notify: Reload systemd

- name: Enable docker maintenance timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - docker-weekly-restart.timer
    - docker-buildx-prune.timer
