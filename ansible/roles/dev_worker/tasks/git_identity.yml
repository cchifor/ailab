---
# Per-slot git commit identity for the dev-worker users (plan 2026-10-11 worker identities, Phase 1).
# Nothing set user.name/user.email here before, so agent commits went out as the owner, as
# `Codex <codex@chifor.me>`, or as git's hostname fallback `Ubuntu <c4@dev-worker-N.lan>`: worker
# work read as the owner's own in history. Every user now commits as this slot's bot
# (dev_worker_git_user_name / _email). NOT gated on dev_worker_gitea_identity_cutover: who made a
# commit does not depend on which token pushes it.
#
# Writes ~/.gitconfig BY NAME, like git_credential_helper.yml: `git config --global` reads
# ~/.config/git/config too but writes only one of the two. The module's default add_mode,
# replace-all, collapses duplicate values, so a second hand-added user.name cannot outrank this one.
#
# Tagged so it can be rolled out alone: ansible-playbook dev-workers.yml -t git-identity
- name: Set each user's git commit identity to this slot's bot
  become: true
  become_user: "{{ item.0.name }}"
  community.general.git_config:
    name: "user.{{ item.1.key }}"
    scope: file
    file: "{{ item.0.home }}/.gitconfig"
    value: "{{ item.1.value }}"
  loop: "{{ dev_worker_users | product({'name': dev_worker_git_user_name, 'email': dev_worker_git_user_email} | dict2items) | list }}"
  loop_control:
    label: "{{ item.0.name }}: user.{{ item.1.key }}"
  tags: [git-identity]

# ~/.gitconfig is only one layer. What still outranks it: a repository's (or linked worktree's)
# config, author.*/committer.* keys anywhere (they beat user.*), an include, and GIT_AUTHOR_* /
# GIT_COMMITTER_* in an agent's environment. REPORTED, not changed: none of those is this role's —
# the role owns exactly user.name/user.email in ~/.gitconfig, set above, and tests/
# test-gitea-identity.sh keeps the role itself from ever exporting an identity variable. A finding is
# for the operator to remove (or bring into the role); a converge does not fail on it.
#
# Read-only and bounded:
#   - `git var` outside any repository with a cleared environment: the config layers as git resolves
#     them, which catches an XDG author.* and an unconditional include;
#   - checkouts by their config FILES, not `git var` in each: main clones under the users' homes and
#     the workspace mount (depth 4, the tool caches and docker's data-root skipped, as cleanup does),
#     with their linked worktrees' config.worktree;
#   - environment exports by variable NAME and line number only — env files and profiles hold
#     secrets, so a matching line is never printed;
#   - the live environment of the users' running processes, by name only: a job keeps what it
#     inherited until it restarts, so the acceptance is a real agent commit after the next start.
- name: Audit what can still override the commit identity (read-only, reported only)
  ansible.builtin.shell: |
    set -u
    # From /, like the git_config module: every path below is absolute, and a repository around the
    # working directory (or a broken one) must not be discovered — git fails even `--file` reads then.
    cd /
    want="{{ dev_worker_git_user_name }} <{{ dev_worker_git_user_email }}>"
    keys='^((user|author|committer)\.(name|email)|include(if)?\..*)$'
    envpat='(GIT_(AUTHOR|COMMITTER)_(NAME|EMAIL)|(^|[^A-Za-z0-9_])EMAIL)"?[[:space:]]*[:=]'
    scan_cfg() { # <config file> <1 = ~/.gitconfig, whose user.* this role owns>
      [ -f "$1" ] || return 0
      out="$(git config --file "$1" --get-regexp "$keys" 2>/dev/null)"; rc=$?
      [ "$rc" -le 1 ] || { echo "$1: unreadable (git config exit $rc), cannot tell what it sets"; return 0; }
      printf '%s\n' "$out" | while read -r k v; do
        case "$2:$k" in '0:' | '1:' | 1:user.name | 1:user.email) continue ;; esac
        echo "$1: $k = $v"
      done
    }
    scan_env() { # <file...>: the variable name and line, never the value
      for f in "$@"; do
        [ -f "$f" ] && [ -r "$f" ] || continue
        grep -noE "$envpat" "$f" 2>/dev/null | while IFS=: read -r n m; do
          echo "$f:$n: $(printf '%s' "$m" | grep -oE 'GIT_[A-Z_]+|EMAIL' | head -n1) is set"
        done
      done
    }
    {% for user in dev_worker_users %}
    h="{{ user.home }}"
    for v in GIT_AUTHOR_IDENT GIT_COMMITTER_IDENT; do
      got="$(env -i HOME="$h" PATH=/usr/bin:/bin git var "$v" 2>/dev/null | sed 's/ [0-9]* [-+][0-9]*$//')"
      [ "$got" = "$want" ] || echo "{{ user.name }}: git var $v outside a repository is '${got:-unresolvable}'"
    done
    scan_cfg "$h/.config/git/config" 0
    scan_cfg "$h/.gitconfig" 1
    scan_env "$h/.profile" "$h/.bashrc" "$h/.bash_profile" "$h/.bash_login" "$h/.zshrc" "$h/.zshenv" \
      "$h/.pam_environment" "$h"/.config/environment.d/*.conf "$h"/.config/systemd/user/*.service \
      "$h"/.config/systemd/user/*.d/*.conf "$h/.claude/settings.json" "$h/.claude/settings.local.json" \
      "$h/.codex/config.toml"
    {% endfor %}
    scan_env /etc/environment /etc/profile /etc/bash.bashrc /etc/profile.d/*.sh \
      /etc/systemd/system/{claude-job@,agentforge,herdr,claude-dashboard,ttyd}.service \
      /etc/systemd/system/{claude-job@,agentforge,herdr,claude-dashboard,ttyd}.service.d/*.conf \
      /etc/agentforge/agentforge.env {{ dev_worker_workspace_mount }}/agent-jobs/*/job.env \
      /etc/claude-code/managed-settings.json
    find {% for user in dev_worker_users %}"{{ user.home }}" {% endfor %}"{{ dev_worker_workspace_mount }}" -maxdepth 4 \
      \( -path "{{ dev_worker_workspace_mount }}/docker" -o -path "{{ dev_worker_archive_dir }}" \
         -o -name node_modules -o -name .cache -o -name .local -o -name .npm -o -name .npm-global \
         -o -name .cargo -o -name .rustup -o -name .pnpm-store -o -name .codex -o -name .tmp \
         -o -name lost+found \) -prune -o -type d -name .git -print -prune 2>/dev/null | sort -u |
      while read -r g; do
        for f in "$g/config" "$g"/worktrees/*/config.worktree; do scan_cfg "$f" 0; done
      done
    for p in /proc/[0-9]*; do
      case " {{ dev_worker_users | map(attribute='name') | join(' ') }} " in *" $(stat -c %U "$p" 2>/dev/null) "*) ;; *) continue ;; esac
      names="$(tr '\0' '\n' <"$p/environ" 2>/dev/null | grep -oE '^(GIT_(AUTHOR|COMMITTER)_(NAME|EMAIL)|EMAIL)=' | tr -d = | tr '\n' ' ')"
      [ -z "$names" ] || echo "pid ${p#/proc/} ($(cat "$p/comm" 2>/dev/null)) has ${names% } in its environment"
    done
    exit 0
  args:
    executable: /bin/bash
  register: dev_worker_git_identity_audit
  changed_when: false
  check_mode: false # read-only; a check run should show the same report
  tags: [git-identity]

- name: Report what can still override the commit identity
  ansible.builtin.debug:
    msg: >-
      {{ ['Commit identity overrides on ' ~ inventory_hostname ~ ' (wanted: ' ~ dev_worker_git_user_name ~ ' <'
          ~ dev_worker_git_user_email ~ '>). Reported, not changed; remove each or bring it into the role:']
         + dev_worker_git_identity_audit.stdout_lines[:60]
         + ([] if dev_worker_git_identity_audit.stdout_lines | length <= 60
            else ['... and ' ~ (dev_worker_git_identity_audit.stdout_lines | length - 60) ~ ' more'])) }}
  when: dev_worker_git_identity_audit.stdout_lines | default([]) | length > 0
  tags: [git-identity]
