---
# Gitea (git.chifor.me) forge access for the dev-worker users. Gitea is the master forge (ADR 0017),
# so agents/devs on the worker clone/push private cchifor/* repos over HTTPS; Gitea SSH is in-cluster
# only (not tunnelled), so HTTPS+token is the access path. The credential comes from OpenBao alone:
# the bao agent renders ~/.git-credentials, and openbao.yml imports the read-only helper
# (git_credential_helper.yml) and the username pin (pin_gitea_username.yml).
#
# The SOPS path that lived here is GONE (plan 2026-10-11 worker identities, Phase 3). With
# dev_worker_enable_openbao off it wrote dev_worker_gitea_token from ansible/secrets/dev-worker.sops.yaml
# into ~/.git-credentials. No slot has run it since 2026-08-31 (group_vars/dev_workers.yml), it is a
# second copy of the shared dev-worker-bot token that would outlive that token's revocation, and it
# cannot follow the per-slot cut-over (dev_worker_gitea_identity_cutover). A worker without OpenBao
# now stops here instead of silently getting the shared token, or no forge access at all.
# TODO(operator): nothing reads the key any more; remove it with
#   sops unset ansible/secrets/dev-worker.sops.yaml '["dev_worker_gitea_token"]'
- name: Require OpenBao, the only source of the forge credential
  ansible.builtin.assert:
    that: dev_worker_enable_openbao | bool
    fail_msg: >-
      dev_worker_enable_openbao is false on {{ inventory_hostname }}, and git credentials for
      git.chifor.me now come only from OpenBao (the SOPS dev_worker_gitea_token path was removed).
      Enable it and mint this host's AppRole first: docs/runbooks/openbao-dev-workers.md
      § "Adding a worker".
    quiet: true
