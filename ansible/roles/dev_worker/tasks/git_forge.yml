---
# Gitea (git.chifor.me) forge access for the dev-worker users. Gitea is the master forge now
# (ADR 0017), so agents/devs on the worker clone/push private cchifor/* repos over HTTPS. This writes a
# per-user credential.helper=store + a ~/.git-credentials line using a `dev-worker-bot` read/write-repository
# Gitea token (dev_worker_gitea_token, SOPS). No-op when the token isn't provided. Gitea SSH is
# in-cluster only (not tunnelled), so HTTPS+token is the access path.
#
# YIELDS TO OPENBAO: when dev_worker_enable_openbao is on, the bao agent renders ~/.git-credentials
# from af/dev-workers/common instead (ADR 0020), so this whole block stands down rather than fight
# it — two writers of one file would flip it back and forth on every run, and a PAT rotated in
# OpenBao would be silently reverted here to whatever the SOPS file still holds. openbao.yml carries
# its own copy of the credential.helper git-config task, since both paths need it.
- name: Configure Gitea git credentials (per dev-worker user)
  when:
    - dev_worker_gitea_token | default('') | length > 0
    - not (dev_worker_enable_openbao | bool)
  block:
    - name: Enable the per-user git credential store
      become: true
      become_user: "{{ item.name }}"
      ansible.builtin.command:
        cmd: git config --global credential.helper store
      changed_when: false
      loop: "{{ dev_worker_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Pin the git.chifor.me credential username to the forge identity
      # The credential store matches on username: an out-of-band
      # credential.https://git.chifor.me.username=chifor (found on every worker on 2026-10-06, after the
      # identity split moved ~/.git-credentials to dev-worker-bot) made git skip the stored line and
      # prompt for the owner's password. Owning the key here keeps it equal to the user in the file.
      become: true
      become_user: "{{ item.name }}"
      ansible.builtin.shell: |
        set -eu
        k='credential.https://git.chifor.me.username'
        [ "$(git config --global --get "$k" || true)" = "$WANT" ] && exit 0
        git config --global --replace-all "$k" "$WANT"
        echo changed
      environment:
        WANT: "{{ dev_worker_gitea_user }}"
      register: _gitea_username
      changed_when: "'changed' in _gitea_username.stdout"
      loop: "{{ dev_worker_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Write the git.chifor.me credential (per user, 0600)
      # copy(content) owns the whole file — dev-workers use Gitea as the forge, so a single line is the
      # intended state. Add other hosts' creds out-of-band if ever needed.
      ansible.builtin.copy:
        dest: "{{ item.home }}/.git-credentials"
        content: "https://{{ dev_worker_gitea_user }}:{{ dev_worker_gitea_token }}@git.chifor.me\n"
        owner: "{{ item.name }}"
        group: "{{ item.name }}"
        mode: "0600"
      loop: "{{ dev_worker_users }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true
