---
# Sections 5 + 9 (homelab): kubectl / helm / k9s + the claude-grant-write helper + ~/.kube dirs.
# Distributing scoped kubeconfigs into ~/.kube/config is operator/tofu work and OUT OF SCOPE for
# this role (the dashboard's k9s window degrades gracefully when no kubeconfig is present).

- name: Add Kubernetes apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ dev_worker_kubectl_minor }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: "0644"

- name: Add Kubernetes apt repository (flat repo)
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: [deb]
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ dev_worker_kubectl_minor }}/deb/"
    suites: ["/"]
    signed_by: /etc/apt/keyrings/kubernetes.asc
    enabled: true

- name: Install kubectl
  ansible.builtin.apt:
    name: kubectl
    state: present
    update_cache: true

- name: Install helm {{ dev_worker_helm_version }}
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ dev_worker_helm_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: ["--strip-components=1", "--wildcards", "*/helm"]
    creates: "/usr/local/bin/.helm-{{ dev_worker_helm_version }}"

- name: Mark installed helm version
  ansible.builtin.copy:
    content: "{{ dev_worker_helm_version }}\n"
    dest: "/usr/local/bin/.helm-{{ dev_worker_helm_version }}"
    mode: "0644"
    force: false

- name: Install k9s {{ dev_worker_k9s_version }}
  ansible.builtin.unarchive:
    src: "https://github.com/derailed/k9s/releases/download/{{ dev_worker_k9s_version }}/k9s_Linux_amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: ["k9s"]
    creates: "/usr/local/bin/.k9s-{{ dev_worker_k9s_version }}"

- name: Mark installed k9s version
  ansible.builtin.copy:
    content: "{{ dev_worker_k9s_version }}\n"
    dest: "/usr/local/bin/.k9s-{{ dev_worker_k9s_version }}"
    mode: "0644"
    force: false

# REMOVED, not merely un-installed (ADR 0021). claude-grant-write promised an opt-in escalation to
# `edit` on the WHOLE CLUSTER behind a sudo prompt — a prompt an interactive agent can talk its
# operator into. It was also a dead end here: nothing in this repo ever provisioned
# /etc/claude-agent/kube-rw-config (that came from the homelab repo's platform/main.tf, for
# claude-worker VMs), so on an ailab dev-worker it only ever printed "not provisioned" and exited 1.
#
# The replacement is a namespace-scoped credential with no escalation hatch at all:
# ~/.helmtest/kubeconfig, rendered by openbao-agent (tasks/openbao.yml).
#
# `state: absent` rather than deleting the install task, because deleting the task would leave the
# helper sitting on every worker that already has it. The staged copies are cleaned up too — they are
# under /run so they die on reboot anyway, but a long-uptime worker can be holding one right now.
- name: Remove the claude-grant-write cluster-wide escalation helper
  ansible.builtin.file:
    path: /usr/local/bin/claude-grant-write
    state: absent

- name: Remove any staged RW kubeconfig left by claude-grant-write
  ansible.builtin.shell: |
    set -eu
    rm -f /run/user/*/kube-rw-config 2>/dev/null || true
    ls /run/user/*/kube-rw-config >/dev/null 2>&1 && exit 1 || exit 0
  changed_when: false

- name: Ensure /etc/skel/.kube placeholder
  ansible.builtin.file:
    path: /etc/skel/.kube
    state: directory
    mode: "0755"

- name: Ensure per-user ~/.kube dirs
  ansible.builtin.file:
    path: "{{ item.home }}/.kube"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"
