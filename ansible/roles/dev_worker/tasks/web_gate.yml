---
# The web terminal's authentication gate (Caddy + dw-access-verify). Until 2026-09-28 the terminal —
# a passwordless-sudo shell — answered anyone on the LAN with no credentials at all, and had no
# Origin check against cross-site WebSocket hijacking. This file makes every path authenticated:
# Cloudflare Access JWT (validated here, at the origin) on the tunnel path, Basic auth + a bridge
# cookie on the LAN/Tailscale path. Behind the gate: file paste into the agents (dw-upload +
# dw_paste.js on the terminal page). Own tag: `-t web-gate` (the playbook's SOPS pre_task carries it).
# docs/runbooks/dev-workers.md § "Remote access (web terminals)";
# plans/2026-09-28-dw-web-terminal-auth-and-file-paste-plan.md.

- name: Assert the web gate's inputs
  ansible.builtin.assert:
    that:
      - dev_worker_web_access_aud[inventory_hostname] | default('') is match('^[0-9a-f]{64}$')
      - dev_worker_web_lan_password | length >= 16
      - dev_worker_web_lan_password_bcrypt is match('^\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$')
      - dev_worker_web_lan_cookie_secret is match('^[0-9a-f]{64}$')
    fail_msg: >-
      The web terminal gate needs dev_worker_web_access_aud[{{ inventory_hostname }}] (the dw Access
      app's AUD tag: `tofu -chdir=kubernetes/infra/cloudflare output dev_worker_access_aud`) in
      group_vars/dev_workers.yml, and dev_worker_web_lan_password / _password_bcrypt / _cookie_secret
      in ansible/secrets/dev-worker.sops.yaml. Refusing to touch Caddy without them: the old
      Caddyfile is an unauthenticated shell, but a half-rendered one could lock out every path.
    quiet: true
  no_log: true

- name: Install the validator's Python dependencies
  ansible.builtin.apt:
    name: [python3-jwt, python3-cryptography]
    state: present

- name: Ensure /usr/local/lib/dw-web exists
  ansible.builtin.file:
    path: /usr/local/lib/dw-web
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install dw-access-verify
  ansible.builtin.copy:
    src: dw_access_verify.py
    dest: /usr/local/lib/dw-web/dw_access_verify.py
    owner: root
    group: root
    mode: "0644"
  register: web_gate_verify_code

- name: Install the dw-access-verify unit
  ansible.builtin.template:
    src: dw-access-verify.service.j2
    dest: /etc/systemd/system/dw-access-verify.service
    owner: root
    group: root
    mode: "0644"
  register: web_gate_verify_unit

# Restarted in-line rather than by handler: the Caddyfile below must not go live until the
# validator it depends on is running the new code.
- name: Enable and (re)start dw-access-verify
  ansible.builtin.systemd:
    name: dw-access-verify.service
    enabled: true
    state: "{{ 'restarted' if (web_gate_verify_code.changed or web_gate_verify_unit.changed) else 'started' }}"
    daemon_reload: "{{ web_gate_verify_unit.changed }}"
  # A first-run --check preview never really wrote the unit, so there is nothing to start.
  when: not (ansible_check_mode and web_gate_verify_unit.changed)

# 200 = the Cloudflare signing keys are cached. Without them the tunnel path answers 503 (LAN is
# unaffected), so a converge that cannot reach chifor.cloudflareaccess.com stops here, loudly.
- name: Wait for dw-access-verify to hold the Access signing keys
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dev_worker_web_verify_port }}/_dw/healthz"
    status_code: 200
  register: web_gate_health
  until: web_gate_health.status == 200
  retries: 10
  delay: 3
  changed_when: false
  when: not ansible_check_mode

# ---- file paste: dw-upload + the terminal page that carries dw_paste.js ---------------------------
# All of it lands BEFORE the Caddyfile, which routes / to the page and /_dw/upload to the service.
- name: Install dw-upload
  ansible.builtin.copy:
    src: dw_upload.py
    dest: /usr/local/lib/dw-web/dw_upload.py
    owner: root
    group: root
    mode: "0644"
  register: web_gate_upload_code

- name: Install the dw-upload unit
  ansible.builtin.template:
    src: dw-upload.service.j2
    dest: /etc/systemd/system/dw-upload.service
    owner: root
    group: root
    mode: "0644"
  register: web_gate_upload_unit

- name: Enable and (re)start dw-upload
  ansible.builtin.systemd:
    name: dw-upload.service
    enabled: true
    state: "{{ 'restarted' if (web_gate_upload_code.changed or web_gate_upload_unit.changed) else 'started' }}"
    daemon_reload: "{{ web_gate_upload_unit.changed }}"
  when: not (ansible_check_mode and web_gate_upload_unit.changed)

- name: Ensure the web root exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ dev_worker_web_root }}"
    - "{{ dev_worker_web_root }}/static"

- name: Install the paste script
  ansible.builtin.copy:
    src: dw_paste.js
    dest: "{{ dev_worker_web_root }}/static/paste.js"
    owner: root
    group: root
    mode: "0644"

# ttyd's own page, fetched straight from ttyd (never through Caddy) so it is always the pinned ttyd's
# page — a GET of / serves static HTML; only the WebSocket spawns a shell — with the paste script
# appended before </body>. Spliced on the host: the page is 730 KB of minified JS that has no business
# passing through Ansible's templating. dw_paste.js drives xterm through window.term (ttyd 1.7.x sets
# it): a ttyd bump that drops it fails here instead of leaving a page that silently cannot paste.
- name: Serve ttyd's page with the paste script appended
  ansible.builtin.shell: |
    set -euo pipefail
    tmp=$(mktemp "{{ dev_worker_web_root }}/.index.XXXXXX")
    trap 'rm -f "$tmp"' EXIT
    curl -fsS --max-time 20 http://127.0.0.1:7681/ | python3 -c '
    import sys
    page = sys.stdin.read()
    if "window.term=" not in page or "</body>" not in page:
        sys.exit("ttyd {{ dev_worker_ttyd_version }} page lacks window.term or </body>; check the new frontend")
    head, tail = page.rsplit("</body>", 1)
    sys.stdout.write(head + "<script src=\"/_dw/static/paste.js\" defer></script></body>" + tail)
    ' > "$tmp"
    if cmp -s "$tmp" "{{ dev_worker_web_root }}/index.html"; then
      echo unchanged
    else
      chmod 0644 "$tmp"
      mv -f "$tmp" "{{ dev_worker_web_root }}/index.html"
      echo changed
    fi
  args:
    executable: /bin/bash
  register: web_gate_page_splice
  changed_when: web_gate_page_splice.stdout == 'changed'

# 0640 root:caddy — it now holds the Basic-auth hash and the bridge cookie secret. `caddy validate`
# gets throwaway storage: it provisions the tls app, and against the real storage (or root's HOME)
# it would mint a stray local CA.
- name: Lay down the Caddyfile (the authenticated web terminal)
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
    validate: >-
      sh -c 'd=$(mktemp -d) && XDG_DATA_HOME="$d" XDG_CONFIG_HOME="$d" caddy validate --adapter caddyfile --config "$1";
      rc=$?; rm -rf "$d"; exit $rc' _ %s
  register: web_gate_caddyfile
  no_log: true

# A reload drops open terminal WebSockets; the browser reconnects to the same tmux session.
- name: Reload Caddy onto the new Caddyfile
  ansible.builtin.systemd:
    name: caddy
    state: reloaded
  when: web_gate_caddyfile.changed

# ---- self-check: the play fails if any path is open --------------------------------------------
# Sent to the worker's own LAN address: the same URL, Host and (absent) SNI a LAN browser uses.
# Expected: no credentials 401; a forged Access JWT 403 (a good cookie must not rescue it); a
# WebSocket upgrade from a foreign Origin 403; the LAN credential 200 + the bridge cookie.
- name: Self-check — no credentials is refused (401)
  ansible.builtin.uri:
    url: "https://{{ ansible_default_ipv4.address }}/"
    validate_certs: false
    status_code: 401
  changed_when: false

- name: Self-check — a forged Access JWT is refused (403), even with a valid LAN cookie
  ansible.builtin.uri:
    url: "https://{{ ansible_default_ipv4.address }}/"
    headers:
      Cf-Access-Jwt-Assertion: forged.not.valid
      Cookie: "dw_lan={{ dev_worker_web_lan_cookie_secret }}"
    validate_certs: false
    status_code: 403
  changed_when: false
  no_log: true

- name: Self-check — a cross-site WebSocket upgrade is refused (403), even with a valid LAN cookie
  ansible.builtin.uri:
    url: "https://{{ ansible_default_ipv4.address }}/ws"
    headers:
      Connection: Upgrade
      Upgrade: websocket
      Sec-WebSocket-Version: "13"
      Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==
      Origin: https://attacker.example
      Cookie: "dw_lan={{ dev_worker_web_lan_cookie_secret }}"
    validate_certs: false
    status_code: 403
  changed_when: false
  no_log: true

- name: Self-check — the LAN credential opens the terminal (200) and issues the bridge cookie
  ansible.builtin.uri:
    url: "https://{{ ansible_default_ipv4.address }}/"
    url_username: "{{ dev_worker_web_lan_user }}"
    url_password: "{{ dev_worker_web_lan_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: web_gate_lan_ok
  failed_when: >-
    web_gate_lan_ok.status != 200 or
    (web_gate_lan_ok.cookies | default({})).get('dw_lan') != dev_worker_web_lan_cookie_secret
  changed_when: false
  no_log: true

- name: Self-check — the terminal page carries the paste script
  ansible.builtin.uri:
    url: "https://{{ ansible_default_ipv4.address }}/"
    headers:
      Cookie: "dw_lan={{ dev_worker_web_lan_cookie_secret }}"
    validate_certs: false
    return_content: true
    status_code: 200
  register: web_gate_page
  failed_when: >-
    web_gate_page.status != 200 or
    '<script src="/_dw/static/paste.js" defer></script>' not in web_gate_page.content or
    'window.term=' not in web_gate_page.content
  changed_when: false
  no_log: true

- name: Self-check — an upload from a foreign Origin is refused (403), even with a valid LAN cookie
  ansible.builtin.uri:
    url: "https://{{ ansible_default_ipv4.address }}/_dw/upload?name=selfcheck.txt"
    method: PUT
    body: forged
    headers:
      Origin: https://attacker.example
      X-DW-Upload: "1"
      Cookie: "dw_lan={{ dev_worker_web_lan_cookie_secret }}"
    validate_certs: false
    status_code: 403
  changed_when: false
  no_log: true

# End to end through Caddy: the same request the page makes. The file is removed right after.
- name: Self-check — an upload from the worker's own page is stored
  ansible.builtin.uri:
    url: "https://{{ ansible_default_ipv4.address }}/_dw/upload?name=web-gate-selfcheck.txt"
    method: PUT
    body: "web gate self-check"
    headers:
      Origin: "https://{{ ansible_default_ipv4.address }}"
      X-DW-Upload: "1"
      Content-Type: text/plain
      Cookie: "dw_lan={{ dev_worker_web_lan_cookie_secret }}"
    validate_certs: false
    status_code: 201
    return_content: true
  register: web_gate_upload
  failed_when: >-
    web_gate_upload.status != 201 or
    not (web_gate_upload.json.path | default('')).startswith(dev_worker_web_pastes_dir ~ '/')
  changed_when: false
  when: not ansible_check_mode
  no_log: true

- name: Remove the self-check upload
  ansible.builtin.file:
    path: "{{ web_gate_upload.json.path }}"
    state: absent
  changed_when: false
  when: not ansible_check_mode
