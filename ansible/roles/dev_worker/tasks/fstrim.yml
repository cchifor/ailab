---
# Daily trim of /workspace and / (dev_worker_fstrim_*; defaults/main.yml has the why). Own tag: --tags fstrim,
# one worker at a time, --check --diff first (docs/runbooks/dev-workers.md "Daily trim"). Not gated in main.yml:
# switched off, it removes what an earlier converge installed and hands the disks back to the stock weekly timer
# (and does nothing on a worker that never had it).
- name: Check the daily trim settings
  ansible.builtin.assert:
    that:
      - dev_worker_fstrim_start is string
      - dev_worker_fstrim_start is match('^([01][0-9]|2[0-3]):[0-5][0-9]$')
      - dev_worker_fstrim_run_max_min | int >= 2
      - dev_worker_fstrim_mounts | length > 0
      - dev_worker_fstrim_mounts | select('match', '^/[A-Za-z0-9/_.-]*$') | list | length == dev_worker_fstrim_mounts | length
      - dev_worker_fstrim_chunk_gb | int >= 1
      - dev_worker_fstrim_sec_per_gb | int >= 1
      - dev_worker_fstrim_psi_wait_max_s | int >= 1
    fail_msg: >-
      dev_worker_fstrim_*: need a quoted HH:MM start, run_max_min >= 2, absolute mount paths and positive integers
      (start={{ dev_worker_fstrim_start | to_json }}, mounts={{ dev_worker_fstrim_mounts | to_json }})
    quiet: true
  when: dev_worker_fstrim_enabled | bool

# ---- / without online discard (dev_worker_root_nodiscard) ----
# The same three regexes as gitea_runner's (tasks/main.yml there; its tests/test-fstrim-chunked.sh applies them):
# each needs a whole `discard` token, so `nodiscard` never matches and a second run changes nothing.
- name: Drop the online `discard` option from the root fstab entry (every other option is kept)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
    backup: true
  loop:
    - regexp: '^(LABEL=cloudimg-rootfs[ \t]+/[ \t]+ext4[ \t]+(?:[^\s,]+,)*)discard,(?=[^\s,])'
      replace: '\g<1>'
    - regexp: '^(LABEL=cloudimg-rootfs[ \t]+/[ \t]+ext4[ \t]+[^\s,]+(?:,[^\s,]+)*),discard(?=[ \t]|$)'
      replace: '\g<1>'
    - regexp: '^(LABEL=cloudimg-rootfs[ \t]+/[ \t]+ext4[ \t]+)discard(?=[ \t]|$)'
      replace: '\g<1>defaults'
  when: dev_worker_root_nodiscard | bool
  tags: [fstrim]

# The live mount, read every run, so a play that stopped between the edit and the remount is finished next time.
- name: Read the live options of the root mount
  ansible.builtin.command: findmnt -no OPTIONS --mountpoint /
  register: dev_worker_root_opts
  changed_when: false
  check_mode: false
  when: dev_worker_root_nodiscard | bool
  tags: [fstrim]

- name: Remount / nodiscard (live-safe on ext4; groups already flagged as trimmed need one reboot)
  ansible.builtin.command: mount -o remount,nodiscard /
  changed_when: true # only runs when / is mounted with discard (the when below)
  when:
    - dev_worker_root_nodiscard | bool
    - "'discard' in dev_worker_root_opts.stdout.strip().split(',')"
  tags: [fstrim]

# ---- the daily trim ----
- name: Enabled -- the trim script, its unit and timer
  when: dev_worker_fstrim_enabled | bool
  tags: [fstrim]
  block:
    # One script for the Talos node trim and this one: the CronJob's ConfigMap is generated from the same file.
    - name: Install the chunked trim (node-fstrim.sh)
      ansible.builtin.copy:
        src: "{{ role_path }}/../../../kubernetes/apps/node-fstrim/node-fstrim.sh"
        dest: /usr/local/sbin/node-fstrim
        owner: root
        group: root
        mode: "0755"

    - name: Render the trim's settings
      ansible.builtin.template:
        src: dev-worker-fstrim.env.j2
        dest: /etc/default/dev-worker-fstrim
        owner: root
        group: root
        mode: "0644"

    - name: Install the trim's unit and timer
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - dev-worker-fstrim.service
        - dev-worker-fstrim.timer
      register: dev_worker_fstrim_units

    - name: Ensure node_exporter's textfile directory exists
      ansible.builtin.file:
        path: "{{ dev_worker_fstrim_textfile_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Written by the role, not the script: a worker whose timer never fires still says the trim should run.
    - name: Mark the trim as enabled for the alerts
      ansible.builtin.copy:
        dest: "{{ dev_worker_fstrim_textfile_dir }}/dev_worker_fstrim_enabled.prom"
        owner: root
        group: root
        mode: "0644"
        content: |
          # HELP dev_worker_fstrim_enabled 1 while the dev_worker role has the daily chunked trim on for this worker.
          # TYPE dev_worker_fstrim_enabled gauge
          dev_worker_fstrim_enabled 1

    # The stock weekly timer would trim every mount at once (one burst on the etcd drive), on top of this one.
    - name: Stop and mask the stock weekly fstrim.timer
      ansible.builtin.systemd:
        name: fstrim.timer
        state: stopped
        enabled: false
        masked: true

    - name: Enable and start the daily trim timer
      ansible.builtin.systemd:
        name: dev-worker-fstrim.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not (ansible_check_mode and dev_worker_fstrim_units is changed)

- name: Disabled -- remove the daily trim and give the disks back to the stock weekly timer
  when: not (dev_worker_fstrim_enabled | bool)
  tags: [fstrim]
  block:
    - name: Look for an installed daily trim timer
      ansible.builtin.stat:
        path: /etc/systemd/system/dev-worker-fstrim.timer
      register: dev_worker_fstrim_timer_unit

    - name: Take down the daily trim
      when: dev_worker_fstrim_timer_unit.stat.exists
      block:
        # Stopping a run is clean: the chunk in flight finishes first.
        - name: Stop the timer and a running trim
          ansible.builtin.systemd:
            name: "{{ item.name }}"
            state: stopped
            enabled: "{{ item.enabled | default(omit) }}"
          loop:
            - { name: dev-worker-fstrim.timer, enabled: false }
            - { name: dev-worker-fstrim.service }
          loop_control:
            label: "{{ item.name }}"
          register: dev_worker_fstrim_stop
          failed_when:
            - dev_worker_fstrim_stop is failed
            - "'Could not find the requested service' not in (dev_worker_fstrim_stop.msg | default(''))"

        - name: Remove the trim, its settings, units and metrics
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ dev_worker_fstrim_textfile_dir }}/dev_worker_fstrim_enabled.prom"
            - "{{ dev_worker_fstrim_textfile_dir }}/node_fstrim.prom"
            - /etc/systemd/system/dev-worker-fstrim.timer
            - /etc/systemd/system/dev-worker-fstrim.service
            - /etc/default/dev-worker-fstrim
            - /usr/local/sbin/node-fstrim

        - name: Unmask and start the stock weekly fstrim.timer again
          ansible.builtin.systemd:
            name: fstrim.timer
            masked: false
            enabled: true
            state: started
            daemon_reload: true
