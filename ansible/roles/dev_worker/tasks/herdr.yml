---
# herdr pilot — agent-native terminal multiplexer (herdr.dev) running BESIDE tmux, not replacing it:
# tmux keeps the shared 'main' session, ttyd parity, the dashboard, and resurrect/continuum reboot
# persistence. Herdr adds what tmux cannot express — an attention queue over agent panes
# (working/blocked/done/idle) and native conversation resume (`claude --resume <id>`) after a server
# restart. Enabled per-host (host_vars/dev-worker-5.yml); evaluation criteria + rollback in
# docs/runbooks/dev-workers.md § "herdr pilot". Own tag (--tags herdr) like statusline, so the pilot
# deploys without a full role run — which is why linger/getent are repeated here instead of leaning
# on dashboard.yml's copies.
# notify: unlike the role's checksum-less binaries, this task can CHANGE an existing file (a sha
# re-pin at the same version, or checksum-triggered repair of a corrupted file) — without a restart
# the server would keep running the deleted old inode while the play reports the new binary live.
- name: Install herdr {{ dev_worker_herdr_version }}
  ansible.builtin.get_url:
    url: "https://github.com/herdrdev/herdr/releases/download/v{{ dev_worker_herdr_version }}/herdr-linux-x86_64"
    dest: "/usr/local/bin/herdr-{{ dev_worker_herdr_version }}"
    checksum: "sha256:{{ dev_worker_herdr_sha256 }}"
    mode: "0755"
  notify: Restart herdr

# force so a check-mode run works (get_url downloads nothing there, so the link src doesn't exist
# yet) and so a hand-installed /usr/local/bin/herdr file gets converged to the pinned link.
- name: Link /usr/local/bin/herdr -> herdr-{{ dev_worker_herdr_version }}
  ansible.builtin.file:
    src: "/usr/local/bin/herdr-{{ dev_worker_herdr_version }}"
    dest: /usr/local/bin/herdr
    state: link
    force: true
  notify: Restart herdr

# Pre-created so ~/.config can't end up root-owned as an implicitly-created parent of the herdr dir.
- name: Ensure ~/.config exists for {{ dev_worker_admin_user }}
  ansible.builtin.file:
    path: "/home/{{ dev_worker_admin_user }}/.config"
    state: directory
    owner: "{{ dev_worker_admin_user }}"
    group: "{{ dev_worker_admin_user }}"
    mode: "0755"

# 0700: this directory holds herdr's control socket, whose only auth IS the filesystem permission.
- name: Ensure ~/.config/herdr exists for {{ dev_worker_admin_user }}
  ansible.builtin.file:
    path: "/home/{{ dev_worker_admin_user }}/.config/herdr"
    state: directory
    owner: "{{ dev_worker_admin_user }}"
    group: "{{ dev_worker_admin_user }}"
    mode: "0700"

# notify: RELOAD, not restart. A config revert used to trigger the pane-killing restart —
# and combined with a scheduled morning converge it killed the operator's live pilot
# workspace mid-work (dw5, 2026-09-03 06:05: TUI-written settings drifted config.toml, the
# converge reverted it, both restarts nuked every pane — experienced as "the worker
# restarted"). `herdr server reload-config` applies config live; keys that genuinely need
# a restart wait for the next binary/unit change, which still notifies Restart herdr.
# backup+register feed the reload handler's restore-on-failure path: without it, a failed
# reload leaves the NEW config on disk, the next converge sees no diff, and the drift goes
# green forever (reviewer-claude catch on the reload PR).
- name: Lay down the ansible-managed herdr config
  ansible.builtin.template:
    src: herdr-config.toml.j2
    dest: "/home/{{ dev_worker_admin_user }}/.config/herdr/config.toml"
    owner: "{{ dev_worker_admin_user }}"
    group: "{{ dev_worker_admin_user }}"
    mode: "0644"
    backup: true
  register: herdr_config_result
  notify: Reload herdr config

# Root-only by design (it drives systemctl and rm -rf's user state), so owned and executable by
# root alone rather than relying on the script's own EUID check.
- name: Install the herdr-pilot-reset recovery hatch
  ansible.builtin.template:
    src: herdr-pilot-reset.sh.j2
    dest: /usr/local/bin/herdr-pilot-reset
    owner: root
    group: root
    mode: "0750"

# Linger keeps /run/user/<uid> present with no login session, so the unit's XDG_RUNTIME_DIR points
# at a directory that exists at boot. Same creates= guard as dashboard.yml; duplicated for --tags.
- name: Enable lingering for {{ dev_worker_admin_user }}
  ansible.builtin.command: "loginctl enable-linger {{ dev_worker_admin_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ dev_worker_admin_user }}"

- name: Look up the admin user's uid (for XDG_RUNTIME_DIR)
  ansible.builtin.getent:
    database: passwd
    key: "{{ dev_worker_admin_user }}"

# The unit's WorkingDirectory comes from workspace.yml, which a `-t herdr` run skips — probe it
# rather than create it here, so a fresh host fails with instructions instead of masking a missing
# /workspace mount with a root-fs directory. Check mode passes the guard — a fresh-host full-role
# preview predicts the dir's creation without performing it; real runs enforce.
- name: Probe the unit's working directory
  ansible.builtin.stat:
    path: "{{ dev_worker_workspace_mount }}/{{ dev_worker_admin_user }}"
  register: herdr_workdir

- name: Assert the working directory exists
  ansible.builtin.assert:
    that: (herdr_workdir.stat.isdir | default(false)) or ansible_check_mode
    fail_msg: >-
      {{ dev_worker_workspace_mount }}/{{ dev_worker_admin_user }} is missing — herdr.service uses
      it as WorkingDirectory. Run the full role once (just dev-workers) before a `-t herdr` run.

- name: Install the herdr systemd unit
  ansible.builtin.template:
    src: herdr.service.j2
    dest: /etc/systemd/system/herdr.service
    mode: "0644"
  vars:
    dev_worker_admin_uid: "{{ getent_passwd[dev_worker_admin_user][1] }}"
  notify:
    - Reload systemd
    - Restart herdr

# Skipped in check mode: with state set, the systemd module fails on a unit whose file was never
# really written (template tasks write nothing in a check run), which would break the first-run
# `--check` preview this file is otherwise built to survive.
- name: Enable + start herdr
  ansible.builtin.systemd:
    name: herdr.service
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

# ---- conductor prerequisites (multi-agent orchestration on the pilot) ----
# Per-agent integrations: session-identity hooks so herdr can natively resume claude/codex
# agents. NOTE (0.8.2): lifecycle state (working/blocked/idle/done) stays screen-manifest
# HEURISTIC even with these installed — a conductor must corroborate state with report files
# and commits, never trust it as success (runbook § "Conductor pattern"). creates= makes each
# a one-shot; after a herdr version bump delete the hook files so the next run refreshes them.
- name: Install the herdr claude integration
  ansible.builtin.command: herdr integration install claude
  args:
    creates: "/home/{{ dev_worker_admin_user }}/.claude/hooks/herdr-agent-state.sh"
  become: true
  become_user: "{{ dev_worker_admin_user }}"

- name: Install the herdr codex integration
  ansible.builtin.command: herdr integration install codex
  args:
    creates: "/home/{{ dev_worker_admin_user }}/.codex/herdr-agent-state.sh"
  become: true
  become_user: "{{ dev_worker_admin_user }}"

# Conductor skill: the pinned binary emits its own version-matched agent skill; staged as a
# Claude Code skill it makes a conductor session herdr-fluent. The skill self-gates on
# HERDR_ENV=1, so it is inert for sessions outside herdr panes. Read step is read-only and
# runs in check mode too, so a --check run can predict content drift after a version bump.
- name: Read the agent skill from the pinned herdr binary
  ansible.builtin.command: herdr --skill
  register: dev_worker_herdr_skill
  changed_when: false
  check_mode: false
  become: true
  become_user: "{{ dev_worker_admin_user }}"

- name: Ensure the conductor skill directory
  ansible.builtin.file:
    path: "/home/{{ dev_worker_admin_user }}/.claude/skills/herdr"
    state: directory
    owner: "{{ dev_worker_admin_user }}"
    group: "{{ dev_worker_admin_user }}"
    mode: "0755"

- name: Stage the herdr conductor skill
  ansible.builtin.copy:
    content: "{{ dev_worker_herdr_skill.stdout }}\n"
    dest: "/home/{{ dev_worker_admin_user }}/.claude/skills/herdr/SKILL.md"
    owner: "{{ dev_worker_admin_user }}"
    group: "{{ dev_worker_admin_user }}"
    mode: "0644"
