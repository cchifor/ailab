---
# Codex's managed sandbox (workspace-write / read-only) runs every command under bubblewrap. On Ubuntu
# 24.04 that fails before the command starts -- even `true` -- with
#   bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted
# because kernel.apparmor_restrict_unprivileged_userns=1 moves the unprivileged user namespace into
# the `unprivileged_userns` AppArmor profile, which denies CAP_NET_ADMIN (dmesg: apparmor="DENIED"
# profile="unprivileged_userns" capname="net_admin"). Found on dev-worker-4, 2026-09-26: a Codex
# session that switched from --yolo to the managed sandbox could not run a single command. `--yolo`
# never calls bwrap, so the fleet ran for weeks without hitting it.
#
# Fix: install the distro bubblewrap and give /usr/bin/bwrap an AppArmor profile that allows userns.
# Codex prefers a `bwrap` on PATH over the copy bundled in the npm package (its error text: "no system
# bwrap was found on PATH and no bundled codex-resources/bwrap binary"), so this covers every user
# without chasing per-user, per-version paths under ~/.npm-global and ~/.codex/packages. Profiling a
# root-owned binary also matters: a profile on those user-writable paths would let any user
# drop a binary there and get unconfined userns. The system-wide sysctl stays on for everything else.
- name: Install bubblewrap (Codex uses the system bwrap when one is on PATH)
  ansible.builtin.apt:
    name: bubblewrap
    state: present

- name: AppArmor profile letting /usr/bin/bwrap create user namespaces
  ansible.builtin.copy:
    src: apparmor-bwrap-userns
    dest: /etc/apparmor.d/bwrap-userns
    owner: root
    group: root
    mode: "0644"
  register: dev_worker_bwrap_apparmor

# Loaded here, not from a handler: a later task in the same run (or the agent that runs right after)
# must see the profile, and a handler would not fire if the play fails further down.
- name: Load the bwrap AppArmor profile
  ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/bwrap-userns
  when: dev_worker_bwrap_apparmor is changed
  changed_when: true

# The same check as the reported failure: a new user + net namespace with loopback brought up. Run as
# the first dev-worker user, since root does not go through the unprivileged-userns restriction.
# Skipped under --check: on a host being converged, bwrap is not installed yet.
- name: Verify bubblewrap can build its sandbox as an unprivileged user
  become: true
  become_user: "{{ dev_worker_users[0].name }}"
  ansible.builtin.command: bwrap --unshare-user --unshare-net --ro-bind / / /bin/true
  changed_when: false
  when: not ansible_check_mode
