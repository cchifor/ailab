---
# Codex's managed sandbox (workspace-write / read-only) runs every command under bubblewrap. On Ubuntu
# 24.04 that fails before the command starts -- even `true` -- with
#   bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted
# because kernel.apparmor_restrict_unprivileged_userns=1 moves the unprivileged user namespace into
# the `unprivileged_userns` AppArmor profile, which denies CAP_NET_ADMIN (dmesg: apparmor="DENIED"
# profile="unprivileged_userns" capname="net_admin"). Found on dev-worker-4, 2026-09-26: a Codex
# session that switched from --yolo to the managed sandbox could not run a single command. `--yolo`
# never calls bwrap, so the fleet ran for weeks without hitting it.
#
# Fix: install the distro bubblewrap and give /usr/bin/bwrap an AppArmor profile that allows userns.
# Codex prefers a `bwrap` on PATH over the copy bundled in the npm package (its error text: "no system
# bwrap was found on PATH and no bundled codex-resources/bwrap binary"), so this covers every user
# without chasing per-user, per-version paths under ~/.npm-global and ~/.codex/packages. Profiling a
# root-owned binary also matters: a profile on those user-writable paths would let any user
# drop a binary there and get unconfined userns. The system-wide sysctl stays on for everything else.
# The profile is Ubuntu's restricted one (see the file's header): bwrap gets userns + capabilities,
# everything it runs gets none -- not `unconfined`, which gave any local user a full-capability
# namespace through bwrap (ailab#867 review).
- name: Install bubblewrap (Codex uses the system bwrap when one is on PATH)
  ansible.builtin.apt:
    name: bubblewrap
    state: present

# Two profiles attaching to /usr/bin/bwrap make the winner load-order dependent, so refuse to run if
# Ubuntu's own copy (profile `bwrap`, from apparmor-profiles' extra-profiles/) has been enabled.
# Reads the kernel's loaded-profile list, which covers `aa-enforce` on the extra-profiles path too.
- name: Read the loaded AppArmor profiles
  ansible.builtin.command: cat /sys/kernel/security/apparmor/profiles
  register: dev_worker_apparmor_loaded
  changed_when: false

- name: Refuse to run next to the stock bwrap-userns-restrict profile
  ansible.builtin.assert:
    that:
      - dev_worker_apparmor_loaded.stdout_lines | select('match', '^bwrap [(]') | list | length == 0
    fail_msg: >-
      Ubuntu's stock `bwrap` profile (bwrap-userns-restrict) is loaded and would compete with
      /etc/apparmor.d/bwrap-userns for /usr/bin/bwrap. Unload one of them (`apparmor_parser -R`).

# validate: a bad edit to the source is rejected before it replaces the live profile (which would
# then also fail to load at boot). --skip-kernel-load parses without touching the kernel.
- name: AppArmor profile letting /usr/bin/bwrap create user namespaces
  ansible.builtin.copy:
    src: apparmor-bwrap-userns
    dest: /etc/apparmor.d/bwrap-userns
    owner: root
    group: root
    mode: "0644"
    validate: apparmor_parser --skip-kernel-load -Q %s
  register: dev_worker_bwrap_apparmor

# Loaded here, not from a handler: a later task in the same run (or the agent that runs right after)
# must see the profile, and a handler would not fire if the play fails further down.
- name: Load the bwrap AppArmor profile
  ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/bwrap-userns
  when: dev_worker_bwrap_apparmor is changed
  changed_when: true

# The same check as the reported failure: a new user + net namespace with loopback brought up. Run as
# the admin user (always defined, unlike an index into a list), since root does not go through the
# unprivileged-userns restriction. Skipped under --check: on a host being converged, bwrap is not
# installed yet.
- name: Verify bubblewrap can build its sandbox as an unprivileged user
  become: true
  become_user: "{{ dev_worker_admin_user }}"
  ansible.builtin.command: bwrap --unshare-user --unshare-net --ro-bind / / /bin/true
  changed_when: false
  when: not ansible_check_mode

# And the other half: what bwrap runs must NOT be able to use the capabilities bwrap hands it. Under
# the old `unconfined` profile this succeeded (a nested mount namespace from inside
# `--cap-add ALL`); under unpriv_bwrap it is denied. A success here means the restriction is gone.
- name: Verify bubblewrap's children get no usable capabilities
  become: true
  become_user: "{{ dev_worker_admin_user }}"
  ansible.builtin.command: bwrap --unshare-user --uid 0 --cap-add ALL --ro-bind / / unshare -m /bin/true
  register: dev_worker_bwrap_child_caps
  changed_when: false
  failed_when: dev_worker_bwrap_child_caps.rc == 0
  when: not ansible_check_mode
