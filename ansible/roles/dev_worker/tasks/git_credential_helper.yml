---
# Point git at a READ-ONLY credential helper for the dev-worker users. Imported (static) by BOTH
# credential paths, git_forge.yml (SOPS) and openbao.yml (bao agent), like pin_gitea_username.yml,
# so the two cannot drift apart. Why read-only: files/git-credential-store-readonly.
#
# Global, not scoped to git.chifor.me: an unscoped `store` would still be a writer of the same file
# for every other host. gh's own github.com helpers are URL-scoped and are left alone.
#
# Tagged so the helper alone can be rolled out: ansible-playbook dev-workers.yml -t git-credential-helper
- name: Install the read-only git credential helper
  ansible.builtin.copy:
    src: git-credential-store-readonly
    dest: /usr/local/bin/git-credential-store-readonly
    owner: root
    group: root
    mode: "0755"
  tags: [git-credential-helper]

# The global credential.helper is this role's: it used to set exactly `store`. That value (or none)
# becomes the read-only helper. Anything else was added by hand, so the task stops and names it
# rather than delete a helper somebody relies on, or leave a second writer of the file in place.
# An absolute path, so git finds the helper without a PATH lookup.
#
# Reads and writes ~/.gitconfig by name: `git config --global` READS ~/.config/git/config too but
# WRITES only one of the two, so a helper set there would survive a --global replace. A helper in
# that file stops the task instead. Exit codes (git 2.43): 1 = no such key or no such file, anything
# else = unreadable config, which must not pass for "no helper". The entry count catches an empty
# value, which resets git's helper list and would otherwise compare equal to a lone wanted path.
# Not run under --check (like the role's other shell tasks).
- name: Make the read-only helper each user's global credential.helper
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.shell: |
    want=/usr/local/bin/git-credential-store-readonly
    cfg="$HOME/.gitconfig"
    xdg="${XDG_CONFIG_HOME:-$HOME/.config}/git/config"
    fail() { printf '%s\n' "$*" >&2; exit 1; }
    # ~/.gitconfig first: git parses it on every start, even with --file, so a broken one fails the
    # XDG read below too, and would be misreported there.
    have="$(git config --file "$cfg" --get-all credential.helper)"; rc=$?
    [ "$rc" -le 1 ] || fail "cannot read $cfg (git config exit $rc)"
    git config --file "$xdg" --get-all credential.helper >/dev/null 2>&1; rc=$?
    [ "$rc" -eq 1 ] || fail "credential.helper is set in $xdg (or it is unreadable, git exit $rc); this role manages it in $cfg only"
    n="$(git config --file "$cfg" --get-all credential.helper | wc -l)"
    if [ "$n" -eq 1 ] && [ "$have" = "$want" ]; then exit 0; fi
    if [ "$n" -eq 0 ] || { [ "$n" -eq 1 ] && [ "$have" = store ]; }; then
      git config --file "$cfg" --replace-all credential.helper "$want" || fail "could not write credential.helper to $cfg"
      echo changed
      exit 0
    fi
    fail "unexpected credential.helper in $cfg ($n entries): $(printf '%s' "$have" | tr '\n' '|')"
  args:
    executable: /bin/sh
  register: dev_worker_git_cred_helper
  changed_when: "'changed' in dev_worker_git_cred_helper.stdout"
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [git-credential-helper]
