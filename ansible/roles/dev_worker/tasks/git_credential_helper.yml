---
# Point git at a READ-ONLY credential helper for the dev-worker users. Imported (static) by BOTH
# credential paths, git_forge.yml (SOPS) and openbao.yml (bao agent), like pin_gitea_username.yml,
# so the two cannot drift apart. Why read-only: files/git-credential-store-readonly.
#
# Global, not scoped to git.chifor.me: an unscoped `store` would still be a writer of the same file
# for every other host. gh's own github.com helpers are URL-scoped and are left alone.
#
# Tagged so the helper alone can be rolled out: ansible-playbook dev-workers.yml -t git-credential-helper
- name: Install the read-only git credential helper
  ansible.builtin.copy:
    src: git-credential-store-readonly
    dest: /usr/local/bin/git-credential-store-readonly
    owner: root
    group: root
    mode: "0755"
  tags: [git-credential-helper]

# The global credential.helper is this role's: it used to set exactly `store`. That value (or none)
# becomes the read-only helper. Anything else was added by hand, so the task stops and names it
# rather than delete a helper somebody relies on, or leave a second writer of the file in place.
# An absolute path, so git finds the helper without a PATH lookup.
- name: Make the read-only helper each user's global credential.helper
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.shell: |
    want=/usr/local/bin/git-credential-store-readonly
    have="$(git config --global --get-all credential.helper || true)"
    case "$have" in
      "$want") exit 0 ;;
      ""|store) git config --global --replace-all credential.helper "$want"; echo changed ;;
      *) printf 'unexpected global credential.helper in %s/.gitconfig: %s\n' "$HOME" "$have" >&2; exit 1 ;;
    esac
  args:
    executable: /bin/sh
  register: dev_worker_git_cred_helper
  changed_when: "'changed' in dev_worker_git_cred_helper.stdout"
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [git-credential-helper]
