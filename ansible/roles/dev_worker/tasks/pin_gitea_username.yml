---
# Pin the git.chifor.me credential username to the forge identity in ~/.gitconfig. Imported (static)
# by openbao_switch.yml inside its guarded block, after the render is verified (the SOPS path that
# also imported it is gone, see git_forge.yml), so it inherits that file's tags and `when`, and a
# failure here is rolled back with the rest of the switch.
#
# The credential store matches on username: an out-of-band
# credential.https://git.chifor.me.username=chifor (found on every worker on 2026-10-06, after the
# identity split moved ~/.git-credentials to dev-worker-bot) made git skip the stored line and
# prompt for the owner's password. Owning the key here keeps it equal to the user in the file, and
# the module (unlike a shell task) reports that drift under --check.
#
# Written to ~/.gitconfig BY NAME (scope file), like git_identity.yml and git_credential_helper.yml:
# `--global` writes whichever of ~/.gitconfig and ~/.config/git/config exists, and the rescue in
# openbao_switch.yml re-pins this same file when it rolls a switch back.
#
# dev_worker_gitea_user follows dev_worker_gitea_identity_cutover (defaults/main.yml), so this pin
# moves with a cut-over or its rollback. The agent renders the new credential line BEFORE this runs,
# and git finds no credential in between: the slot is drained for that converge (runbook).
- name: Pin the git.chifor.me credential username to the forge identity
  become: true
  become_user: "{{ item.name }}"
  community.general.git_config:
    name: credential.https://git.chifor.me.username
    scope: file
    file: "{{ item.home }}/.gitconfig"
    value: "{{ dev_worker_gitea_user }}"
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"
