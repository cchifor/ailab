---
# Section 1 (homelab) + IMPROVEMENT: tmux config seeded to /etc/skel and both users, plus the
# tmux-session-menu click handler and the auto-attach profile.d hook. Unlike homelab, we add
# tmux-resurrect + tmux-continuum (via TPM) so long-running agent sessions survive a reboot.

- name: Template .tmux.conf into /etc/skel + each user's home
  ansible.builtin.template:
    src: tmux.conf.j2
    dest: "{{ item }}/.tmux.conf"
    mode: "0644"
  loop: "{{ ['/etc/skel'] + (dev_worker_users | map(attribute='home') | list) }}"
  register: tmux_conf

# The terminal title carries the [user@ip] marker the workstation paste helpers read
# (scripts/dw-paste/). A running tmux server only reads .tmux.conf at start, so push just these two
# options into it — re-sourcing the whole file would re-run TPM/resurrect under live sessions. No
# server running is fine: the next one reads the file.
- name: Apply the terminal-title settings to running tmux servers
  ansible.builtin.command:
    argv:
      - tmux
      - set-option
      - -g
      - set-titles-string
      - "#h [#{client_user}@{{ ansible_default_ipv4.address }}] #S:#W"
      - ;
      - set-option
      - -g
      - set-titles
      - "on"
  become: true
  become_user: "{{ item.name }}"
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: tmux_titles
  changed_when: tmux_titles.rc == 0
  failed_when: tmux_titles.rc != 0 and not (tmux_titles.stderr is search('no server running|error connecting'))
  when: tmux_conf.changed

# Same reason as the titles above: push only the window-size block into running servers. These are
# idempotent `set-hook -g` / `set -g` lines (no TPM), so re-reading them is safe. Without this,
# servers already running keep the frozen-size bug until their next restart.
- name: Apply the window-size-follows-terminal hooks to running tmux servers
  ansible.builtin.shell:
    cmd: >-
      sed -n '/^# BEGIN window-size-follows-terminal$/,/^# END window-size-follows-terminal$/p'
      "{{ item.home }}/.tmux.conf" | grep -v '^#' > "$tmpf" && tmux source-file "$tmpf"
    executable: /bin/bash
  environment:
    tmpf: "/tmp/.dw-tmux-wsz-{{ item.name }}"
  become: true
  become_user: "{{ item.name }}"
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: tmux_window_size
  changed_when: tmux_window_size.rc == 0
  failed_when: tmux_window_size.rc != 0 and not (tmux_window_size.stderr is search('no server running|error connecting'))
  when: tmux_conf.changed

- name: Fix per-user .tmux.conf ownership
  ansible.builtin.file:
    path: "{{ item.home }}/.tmux.conf"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0644"
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install tmux auto-attach profile.d hook
  ansible.builtin.copy:
    dest: /etc/profile.d/00-tmux-attach.sh
    mode: "0755"
    content: |
      # Managed by ansible (role: dev_worker). Auto-attach interactive shells to the shared 'main'
      # tmux session (SSH + ttyd both land here; cron/non-tty shells are skipped).
      if command -v tmux >/dev/null 2>&1 && [ -n "$SSH_TTY" ] && [ -z "$TMUX" ] && [ "$TERM" != "dumb" ]; then
        tmux new-session -A -s main
      fi

# Static file (NOT copy-content): the script contains bash array syntax ${#ARGS[@]}, whose `{#`
# would be parsed as a Jinja comment-open if `content` were templated.
- name: Install tmux-session-menu (status-left click handler)
  ansible.builtin.copy:
    src: tmux-session-menu.sh
    dest: /usr/local/bin/tmux-session-menu
    mode: "0755"

# ---- tmux persistence (resurrect + continuum via TPM) ----
# The snapshot filter must exist before the plugins do: @resurrect-hook-post-save-layout is invoked on
# every save, and a hook pointing at a missing file silently saves the dashboard it is there to exclude.
- name: Install the tmux-resurrect snapshot filter (keeps the code-generated dashboard out of snapshots)
  ansible.builtin.copy:
    src: tmux-resurrect-filter.sh
    dest: /usr/local/bin/tmux-resurrect-filter
    mode: "0755"
  when: dev_worker_tmux_persistence | bool

- name: Clone TPM {{ dev_worker_tpm_version }} per user
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.git:
    repo: https://github.com/tmux-plugins/tpm
    dest: "{{ item.home }}/.tmux/plugins/tpm"
    version: "{{ dev_worker_tpm_version }}"
    depth: 1
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: dev_worker_tmux_persistence | bool

- name: Install TPM plugins headless per user (resurrect + continuum)
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.command: "{{ item.home }}/.tmux/plugins/tpm/bin/install_plugins"
  args:
    creates: "{{ item.home }}/.tmux/plugins/tmux-continuum"
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: dev_worker_tmux_persistence | bool
