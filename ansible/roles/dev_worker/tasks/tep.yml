# tep — the test-environment pool CLI (kubernetes/apps/infrastructure/testpool; design in the
# agentforge repo's plans/2026-09-01-test-env-pool-k8s-plan.md, spike-proven CLI mechanics in
# ailab kubernetes/infra/env-pool/SPIKE-REPORT.md).
#
# Installs /usr/local/bin/tep and renders the per-worker, NAMESPACE-SCOPED kubeconfig
# (~<agent_user>/.tep/kubeconfig) from SOPS-held tokens. This is deliberately the FIRST kubeconfig
# ever distributed to dev-workers, and it can only touch the `testpool` namespace — the k8s_tools.yml
# "no kubeconfig fan-out" stance stays true for cluster-admin access.
#
# Token source: ansible/secrets/tep-tokens.sops.yaml, GENERATED by scripts/tep-render-kubeconfigs.py
# (run by the operator with admin kubectl AFTER the testpool tree is merged & Flux-applied — the
# tep-dwN token Secrets must exist in-cluster first). Shape:
#   tep_cluster_ca_b64: <base64 CA>
#   tep_tokens: { dev-worker-1: <token>, ... dev-worker-6: <token> }
# Whole flow skips gracefully while that file is absent.

- name: Check for the tep tokens secrets file (control node)
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/secrets/tep-tokens.sops.yaml"
  delegate_to: localhost
  become: false
  run_once: true
  register: tep_tokens_stat

- name: Load tep tokens (SOPS)
  community.sops.load_vars:
    file: "{{ playbook_dir }}/secrets/tep-tokens.sops.yaml"
  delegate_to: localhost
  become: false
  run_once: true
  when: tep_tokens_stat.stat.exists

- name: Install the tep CLI
  ansible.builtin.copy:
    src: tep
    dest: /usr/local/bin/tep
    owner: root
    group: root
    mode: "0755"

- name: Ensure ~{{ dev_worker_agent_user }}/.tep exists
  ansible.builtin.file:
    path: "/home/{{ dev_worker_agent_user }}/.tep"
    state: directory
    owner: "{{ dev_worker_agent_user }}"
    group: "{{ dev_worker_agent_user }}"
    mode: "0700"

# ---- who owns ~/.tep/kubeconfig (ADR 0021) -------------------------------------------------------
# The SOPS writer below and openbao-agent's template stanza write the SAME path, and two writers of
# one credential file is a silent flapping bug: whichever ran last wins, and they can hold different
# token generations. The durable marker /etc/openbao-agent/renders-kubeconfigs is the single answer,
# written by tasks/openbao.yml only after that host's KV pre-flight passed.
#
# Stat'ed here rather than reusing openbao.yml's fact on purpose: this file has its own tag, so a
# `-t tep` run would not have that fact and would silently fall through to writing the file.
- name: Check whether openbao-agent owns this host's kubeconfigs
  ansible.builtin.stat:
    path: /etc/openbao-agent/renders-kubeconfigs
  register: tep_kubeconfig_marker

- name: Render the namespace-scoped tep kubeconfig
  ansible.builtin.template:
    src: tep-kubeconfig.j2
    dest: "/home/{{ dev_worker_agent_user }}/.tep/kubeconfig"
    owner: "{{ dev_worker_agent_user }}"
    group: "{{ dev_worker_agent_user }}"
    mode: "0600"
  when:
    - not tep_kubeconfig_marker.stat.exists # openbao-agent owns it once this host has cut over
    - tep_tokens_stat.stat.exists
    - tep_tokens is defined
    - inventory_hostname in tep_tokens
  no_log: true
