# tep — RETIRED (ADR 0037, 2026-10-10). The leasable test-env pool is gone; this file only removes
# what the role used to install: the `tep` CLI, ~/.tep (the kubeconfig the bao agent rendered, plus
# the CLI's lease state) and the agent's tep template.
#
# ORDER IS THE SAFETY PROPERTY. A bao-agent template whose destination directory is missing is a
# render failure, and exit_on_retry_failure turns that into a dead agent — taking ~/.git-credentials
# down with it. So ~/.tep goes only when the RUNNING agent no longer renders into it:
#   - main.yml imports this file AFTER openbao.yml, whose flush_handlers restarted the agent onto
#     the new agent.hcl (no tep stanza) and verified it;
#   - and this file re-checks that on its own, because a tag-limited run (`-t tep`) or a rescued
#     openbao.yml (which restores the PREVIOUS agent.hcl, tep stanza included) would otherwise
#     delete the directory out from under a live stanza. In that case ~/.tep stays until a run whose
#     openbao.yml succeeded.
# Delete this file once every dev-worker has converged past it.

- name: Resolve the dev-worker user(s) when running tag-limited (users.yml was skipped)
  ansible.builtin.set_fact:
    dev_worker_users: >-
      {{ [{'name': dev_worker_admin_user, 'home': '/home/' + dev_worker_admin_user}] +
         ([{'name': dev_worker_agent_user, 'home': '/home/' + dev_worker_agent_user}]
          if dev_worker_agent_user != dev_worker_admin_user else []) }}
  when: dev_worker_users is not defined

- name: Remove the tep CLI
  ansible.builtin.file:
    path: /usr/local/bin/tep
    state: absent

# files/tep-retire-gate.sh decides (unit-tested: tests/test-tep-retire-gate.sh). "safe" only when
# agent.hcl has no tep stanza AND the running agent, if any, started after that file was written,
# compared at nanosecond precision: whole seconds called a restart from just BEFORE the write in the
# same second "safe" (reviewer-codex, ailab#1217). Anything unreadable fails closed.
- name: Check that the running bao agent no longer renders ~/.tep/kubeconfig
  ansible.builtin.script: tep-retire-gate.sh /etc/openbao-agent/agent.hcl
  register: tep_retire_gate_run
  changed_when: false
  check_mode: false

- name: Read the gate's verdict
  ansible.builtin.set_fact:
    tep_retire_gate: { stdout: "{{ tep_retire_gate_run.stdout | trim }}" }

- name: Remove ~/.tep and the agent's tep template
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ (dev_worker_users | map(attribute='home') | map('regex_replace', '$', '/.tep') | list) + ['/etc/openbao-agent/tep-kubeconfig.ctmpl'] }}"
  when: tep_retire_gate.stdout == 'safe'

- name: Say why ~/.tep was kept
  ansible.builtin.debug:
    msg: >-
      ~/.tep kept on {{ inventory_hostname }} ({{ tep_retire_gate.stdout }}): the bao agent may still
      render into it. A full run whose openbao.yml succeeds removes it.
  when: tep_retire_gate.stdout != 'safe'
