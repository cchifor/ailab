---
# Section 3 (homelab): Claude Code, installed per-user into ~/.npm-global (no sudo npm). This file
# also sets up the SHARED per-user npm prefix + PATH that codex.yml reuses. The presence-probe guard
# keeps re-runs idempotent (Claude Code self-updates at runtime; we only install when absent).

- name: Set the per-user npm global prefix
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.command: "npm config set prefix {{ item.home }}/{{ dev_worker_npm_dir }}"
  args:
    creates: "{{ item.home }}/.npmrc"
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

# System-wide PATH for the per-user npm bin (replaces homelab's per-user ~/.bashrc append — one
# managed file, idempotent by nature). $HOME expands per login user, so one file serves both users.
- name: Install npm-global PATH profile.d hook
  ansible.builtin.copy:
    dest: /etc/profile.d/03-npm-global-path.sh
    mode: "0755"
    content: |
      # Managed by ansible (role: dev_worker). Put each user's per-user npm global bin on PATH.
      export PATH="$HOME/{{ dev_worker_npm_dir }}/bin:$PATH"

# /etc/profile.d only covers LOGIN shells; tmux panes and the ttyd web terminal are interactive
# NON-login shells. Also add the npm bin to each user's ~/.bashrc so `claude`/`codex` resolve there
# (this is what makes the web UI a true peer of the SSH console).
- name: Ensure the npm global bin is on PATH for interactive non-login shells (tmux/ttyd)
  ansible.builtin.lineinfile:
    path: "{{ item.home }}/.bashrc"
    line: 'export PATH="$HOME/{{ dev_worker_npm_dir }}/bin:$PATH"'
    create: true
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0644"
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

# Claude Code self-updates with the FIRST `npm` on the user's PATH, and the two tasks above put the
# per-user prefix's bin/ first, so an npm installed INTO that prefix replaces the system npm for every
# self-update. The role never installs one there. 2026-11-01, dev-worker-3: an out-of-band npm 12.2.0
# (there since 10-03, and unsupported on this Node 20) blocked the update's `postinstall: node
# install.cjs` (npm >= 12 runs no install script outside allowScripts), so the 500-byte placeholder
# stayed as bin/claude.exe, npm still exited 0, and claude failed with "native binary not installed".
# One role run heals that state (the placeholder exits 1, so the probe fails and the install below
# re-runs); removing the shadow is what keeps the NEXT self-update from breaking claude again. It runs
# first so the role's own install cannot pick up the shadow either: ansible's PATH lacks the per-user
# bin/ today, but this must not hinge on that. Runs AS the user, not as the play's root: the prefix
# lives in a home that user (an agent) can write, and root following a planted symlink (say
# lib -> /usr/lib) would delete the system npm; as the user that attempt fails loudly instead.
# tests/test-npm-prefix-guard.sh.
- name: Remove a per-user npm that would shadow the system npm (Claude Code self-updates use it)
  become: true
  become_user: "{{ item.0.name }}"
  ansible.builtin.file:
    path: "{{ item.0.home }}/{{ dev_worker_npm_dir }}/{{ item.1 }}"
    state: absent
  loop: "{{ dev_worker_users | product(['bin/npm', 'bin/npx', 'lib/node_modules/npm']) | list }}"
  loop_control:
    label: "{{ item.0.name }}: {{ item.1 }}"

- name: Probe installed Claude Code per user
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.command: "{{ item.home }}/{{ dev_worker_npm_dir }}/bin/claude --version"
  register: dev_worker_claude_probe
  changed_when: false
  failed_when: false
  check_mode: false # probe only — must run under --check so the version test below has data
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

# `claude --version` prints `X.Y.Z (Claude Code)`; absent, broken (the placeholder exits 1) or older than
# the floor → (re)install. Always `@latest`, never bare: unversioned, npm picks the newest release whose
# `engines` accepts this Node, every release since 2.1.198 declares node >=22, and the fleet runs Node 20,
# so a bare install lands on 2.1.197 (2026-11-05: dev-worker-3 went from 2.1.318 back to 2.1.197 this way,
# and dev-worker-2's npm copy, which its claude-job@ units run, is the same). A named tag is taken as is,
# with an EBADENGINE warning only (2.1.3xx runs on Node 20). Measured with `npm install --dry-run` on
# dev-worker-3, 2026-11-12: bare → 2.1.197, @latest → 2.1.322.
- name: Install or upgrade Claude Code per user (absent, or below the version floor)
  become: true
  become_user: "{{ item.0.name }}"
  ansible.builtin.command: "npm install -g {{ dev_worker_claude_code_pkg }}@latest"
  environment:
    npm_config_prefix: "{{ item.0.home }}/{{ dev_worker_npm_dir }}"
  when: >-
    item.1.rc != 0
    or (item.1.stdout | regex_search('^[0-9]+[.][0-9]+[.][0-9]+') | default('0', true))
       is version(dev_worker_claude_code_min_version, '<')
  changed_when: true
  loop: "{{ dev_worker_users | zip(dev_worker_claude_probe.results) | list }}"
  loop_control:
    label: "{{ item.0.name }}"

# Skills the owner's claude.ai account syncs to every worker that no agent here can use (the browser and
# desktop ones need an app this headless VM lacks) or has ever used (2026-11-12 /doctor and /skill-doctor:
# 0 lifetime uses on every worker). Each costs its listing line in every session, ~2.1k tokens est. in all.
# Turned off per user with settings.json `skillOverrides` (verified: an `anthropic-skills:<name>` key
# hides the synced skill). Added only where the user has no choice of their own for that key: a later
# "on" set with /skills wins. settings.json belongs to the user, so read-merge-write, like the status line.
# tests/test-npm-prefix-guard.sh runs these three tasks too (fresh home, a user's own choice, idempotence,
# and a settings.json that cannot be read, which must stop the run and leave it untouched).
- name: Ensure the per-user Claude config directory (synced-skill overrides)
  ansible.builtin.file:
    path: "{{ item.home }}/.claude"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Read each user's Claude settings.json (synced-skill overrides)
  ansible.builtin.slurp:
    src: "{{ item.home }}/.claude/settings.json"
  register: dev_worker_claude_settings_skills
  # Only a MISSING file means "no settings yet" (slurp: `File not found: <path>`; the case differs between
  # ansible-core releases, hence `lower`). Any other read failure (a directory, a symlink loop, unreadable,
  # I/O) stops here, before the copy below replaces a config it never read.
  failed_when: >-
    dev_worker_claude_settings_skills is failed
    and 'file not found' not in (dev_worker_claude_settings_skills.msg | default('') | lower)
  changed_when: false
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Turn off the unused claude.ai-synced skills per user
  vars:
    dev_worker_current_settings: "{{ (item.1.content | b64decode | from_json) if item.1.content is defined else {} }}"
  ansible.builtin.copy:
    content: >-
      {{ dev_worker_current_settings
         | combine({'skillOverrides': dict(dev_worker_claude_synced_skills_off | product(['off']))
                                      | combine(dev_worker_current_settings.skillOverrides | default({}))})
         | to_nice_json }}
    dest: "{{ item.0.home }}/.claude/settings.json"
    owner: "{{ item.0.name }}"
    group: "{{ item.0.name }}"
    mode: "0644"
  when: dev_worker_claude_synced_skills_off | length > 0
  loop: "{{ dev_worker_users | zip(dev_worker_claude_settings_skills.results) | list }}"
  loop_control:
    label: "{{ item.0.name }}"


# Estate skills for the agent user — versioned here so every worker (and the operator via
# the same file) runs the SAME playbook for feature delivery instead of a drifting pasted
# prompt. Own tag: deploy with -t skills.
- name: Ensure the estate skill directories
  ansible.builtin.file:
    path: "/home/{{ dev_worker_admin_user }}/.claude/skills/{{ item }}"
    state: directory
    owner: "{{ dev_worker_admin_user }}"
    group: "{{ dev_worker_admin_user }}"
    mode: "0755"
  loop: [feature-implementation, review-pr]
  tags: [skills]

- name: Install the estate skills
  ansible.builtin.copy:
    src: "{{ item }}-skill.md"
    dest: "/home/{{ dev_worker_admin_user }}/.claude/skills/{{ item }}/SKILL.md"
    owner: "{{ dev_worker_admin_user }}"
    group: "{{ dev_worker_admin_user }}"
    mode: "0644"
  loop: [feature-implementation, review-pr]
  tags: [skills]
