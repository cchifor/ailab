---
# Section 3 (homelab): Claude Code, installed per-user into ~/.npm-global (no sudo npm). This file
# also sets up the SHARED per-user npm prefix + PATH that codex.yml reuses. The presence-probe guard
# keeps re-runs idempotent (Claude Code self-updates at runtime; we only install when absent).

- name: Set the per-user npm global prefix
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.command: "npm config set prefix {{ item.home }}/{{ dev_worker_npm_dir }}"
  args:
    creates: "{{ item.home }}/.npmrc"
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

# System-wide PATH for the per-user npm bin (replaces homelab's per-user ~/.bashrc append — one
# managed file, idempotent by nature). $HOME expands per login user, so one file serves both users.
- name: Install npm-global PATH profile.d hook
  ansible.builtin.copy:
    dest: /etc/profile.d/03-npm-global-path.sh
    mode: "0755"
    content: |
      # Managed by ansible (role: dev_worker). Put each user's per-user npm global bin on PATH.
      export PATH="$HOME/{{ dev_worker_npm_dir }}/bin:$PATH"

# /etc/profile.d only covers LOGIN shells; tmux panes and the ttyd web terminal are interactive
# NON-login shells. Also add the npm bin to each user's ~/.bashrc so `claude`/`codex` resolve there
# (this is what makes the web UI a true peer of the SSH console).
- name: Ensure the npm global bin is on PATH for interactive non-login shells (tmux/ttyd)
  ansible.builtin.lineinfile:
    path: "{{ item.home }}/.bashrc"
    line: 'export PATH="$HOME/{{ dev_worker_npm_dir }}/bin:$PATH"'
    create: true
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0644"
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

# Claude Code self-updates with the FIRST `npm` on the user's PATH, and the two tasks above put the
# per-user prefix's bin/ first, so an npm installed INTO that prefix replaces the system npm for every
# self-update. The role never installs one there. 2026-11-01, dev-worker-3: an out-of-band npm 12.2.0
# (there since 10-03, and unsupported on this Node 20) blocked the update's `postinstall: node
# install.cjs` (npm >= 12 runs no install script outside allowScripts), so the 500-byte placeholder
# stayed as bin/claude.exe, npm still exited 0, and claude failed with "native binary not installed".
# One role run heals that state (the placeholder exits 1, so the probe fails and the install below
# re-runs); removing the shadow is what keeps the NEXT self-update from breaking claude again. It runs
# first so the role's own install cannot pick up the shadow either: ansible's PATH lacks the per-user
# bin/ today, but this must not hinge on that. Runs AS the user, not as the play's root: the prefix
# lives in a home that user (an agent) can write, and root following a planted symlink (say
# lib -> /usr/lib) would delete the system npm; as the user that attempt fails loudly instead.
# tests/test-npm-prefix-guard.sh.
- name: Remove a per-user npm that would shadow the system npm (Claude Code self-updates use it)
  become: true
  become_user: "{{ item.0.name }}"
  ansible.builtin.file:
    path: "{{ item.0.home }}/{{ dev_worker_npm_dir }}/{{ item.1 }}"
    state: absent
  loop: "{{ dev_worker_users | product(['bin/npm', 'bin/npx', 'lib/node_modules/npm']) | list }}"
  loop_control:
    label: "{{ item.0.name }}: {{ item.1 }}"

- name: Probe installed Claude Code per user
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.command: "{{ item.home }}/{{ dev_worker_npm_dir }}/bin/claude --version"
  register: dev_worker_claude_probe
  changed_when: false
  failed_when: false
  loop: "{{ dev_worker_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install Claude Code per user (only if absent)
  become: true
  become_user: "{{ item.0.name }}"
  ansible.builtin.command: "npm install -g {{ dev_worker_claude_code_pkg }}"
  environment:
    npm_config_prefix: "{{ item.0.home }}/{{ dev_worker_npm_dir }}"
  when: item.1.rc != 0
  changed_when: true
  loop: "{{ dev_worker_users | zip(dev_worker_claude_probe.results) | list }}"
  loop_control:
    label: "{{ item.0.name }}"


# Estate skills for the agent user — versioned here so every worker (and the operator via
# the same file) runs the SAME playbook for feature delivery instead of a drifting pasted
# prompt. Own tag: deploy with -t skills.
- name: Ensure the estate skill directories
  ansible.builtin.file:
    path: "/home/{{ dev_worker_admin_user }}/.claude/skills/{{ item }}"
    state: directory
    owner: "{{ dev_worker_admin_user }}"
    group: "{{ dev_worker_admin_user }}"
    mode: "0755"
  loop: [feature-implementation, review-pr]
  tags: [skills]

- name: Install the estate skills
  ansible.builtin.copy:
    src: "{{ item }}-skill.md"
    dest: "/home/{{ dev_worker_admin_user }}/.claude/skills/{{ item }}/SKILL.md"
    owner: "{{ dev_worker_admin_user }}"
    group: "{{ dev_worker_admin_user }}"
    mode: "0644"
  loop: [feature-implementation, review-pr]
  tags: [skills]
