---
# Stop (fans to auto) then start (curves, then mode=curve): picks up a new curve, a new script, or a
# module that was just reloaded and so came back with the driver's default curves in auto. The governor is
# PartOf the profile, so this restarts it as well (and with it the new config).
- name: Restart ec-fan-profile
  ansible.builtin.systemd:
    name: ec-fan-profile.service
    state: restarted
    daemon_reload: true
  # --check did not write the unit it would restart
  when: not (ansible_check_mode and (pve_ec_fan_profile_unit | default({}) is changed))

# A new governor script or unit. Restarting it leaves the fans where they are; it re-reads the config and
# starts its average from the current temperature.
- name: Restart ec-fan-governor
  ansible.builtin.systemd:
    name: ec-fan-governor.service
    state: restarted
    daemon_reload: true
  # --check did not write the unit it would restart
  when: not (ansible_check_mode and (pve_ec_fan_governor_unit | default({}) is changed))
