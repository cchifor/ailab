---
# EC fan control on the Bosgame M5 Proxmox hosts (Sixunited AXB35-02 board, ITE IT5570E embedded
# controller): the out-of-tree ec_su_axb35 driver, built by DKMS for every installed kernel that has its
# headers and for every later one, a temperature curve for the two CPU fans (ec-fan-profile.service, applied at boot), a
# governor that decides their upper levels on the smoothed temperature (ec-fan-governor.service), and the
# fan and temperature readings as node_exporter textfile metrics (ec-fan-textfile.timer, every 30 s).
# Without the driver the EC runs the fans on its own firmware curve (AUTO).
#
# OFF by default; host_vars turns it on per host (ai-node1 and ai-node2, 2026-11-19). The module is NOT signed,
# so a kernel in Secure Boot lockdown refuses it: the role checks that first and fails before it changes
# anything on such a host. Turned back off, it stops the profile (the CPU fans go back to AUTO), unloads
# the module and removes its units and metrics file; the DKMS build stays installed.
# docs/runbooks/node-maintenance.md "EC fan curve".
pve_ec_fan_enabled: false

# ---- driver source (pinned to a reviewed commit) ----
# Reviewed at this commit (2026-11-19): loading the module only reads the EC; its 1 s worker writes a fan's
# level only while that fan is in curve mode; unloading it resets all three fans to AUTO. A new pin is a new
# review: read every ec_write() in src/ec_su_axb35.c. The checkout is verified against the full SHA.
pve_ec_fan_repo_url: https://github.com/cmetz/ec-su_axb35-linux.git
pve_ec_fan_commit: f62c2c228959a08683273a26ef3afd8991e69f6d
# DKMS version, and so the source dir /usr/src/ec_su_axb35-<version>. Upstream has no releases (its own
# DKMS script uses 1.0); the short commit makes each pin its own DKMS version, and the role removes the
# versions of earlier pins.
pve_ec_fan_dkms_version: "1.0+{{ pve_ec_fan_commit[:7] }}"
pve_ec_fan_src_dir: "/usr/src/ec_su_axb35-{{ pve_ec_fan_dkms_version }}"
# The kernel the role builds for. The module is loaded only when this is the running kernel.
pve_ec_fan_kernel: "{{ ansible_kernel }}"
# Build dependencies. proxmox-default-headers follows proxmox-default-kernel, so the next kernel of the
# default series comes with its headers and DKMS builds the module for it on install (AUTOINSTALL). A host
# that boots an opt-in kernel series needs that series' headers meta package (e.g. proxmox-headers-7.0)
# here as well, or its next kernel boots without the module (the fans stay on AUTO and
# ProxmoxEcFanDriverNotLoaded fires).
pve_ec_fan_packages:
  - dkms
  - build-essential
  - git
  - proxmox-default-headers
  - "proxmox-headers-{{ pve_ec_fan_kernel }}"

# ---- the CPU-fan curve ----
# fan1 and fan2 are the CPU fans, and the only fans this role manages. fan3, the small system fan, IS
# controllable through the driver too (ai-node2, 2026-11-19: fixed 100 % = 2557 rpm, 20 % = 625, auto =
# 970; its stock curve is rampup 20,60,83,95,97, rampdown 0,50,80,94,96), but it is not managed by this role
# yet: it stays on the EC's own curve (owner decision pending). So the role never writes it (the assert below
# and ec-fan-profile both refuse it in the list) and only reports it. ai-node1's fan3 reads 0 rpm even at a
# fixed 100 %: that fan is unplugged or failed, a hardware fault unrelated to the driver.
pve_ec_fan_fans: [1, 2]
# Five EC temperatures (deg C, integers 0-100, strictly rising) for fan levels 1-5 (20/40/60/80/100 %; level
# 0 is off). The driver moves one level per second on the INSTANTANEOUS EC temperature: up from level N while
# temp >= rampup[N+1], down from level N while temp <= rampdown[N]. Each rampdown value must sit below the
# rampup value of the same level, or the fan oscillates between two levels. Measured on node1: 20 % ~1540
# rpm, 40 % ~2650, 60 % ~3490, 80 % ~4200, 100 % ~4790.
#
# The curve and ec-fan-governor (below) split the work. The curve keeps levels 1-2 (40 % from 55 C, the
# floor whenever the hosts are loaded; they never cooled below 55 C in a day) and is the kernel's safety
# net above that: an instant step to 60 / 80 / 100 % at 95 / 96 / 98 C, a short spike the governor's
# average has not caught up with yet (Tctl is ~1 C above the EC reading; the APU throttles itself at
# Tctl 100). The first step was 94 C until 2026-11-23 (the governor's history below). Its rampdown values
# for levels 3-5 (60-62 C) are deliberately low, so the driver does not step down from 60 %+ on its own
# while the governor is holding the level; the governor brings it down.
#
# History. 2026-11-19 (owner: "reduce the fans rpm, they are too loud"): 40,55,80,90,95 / 35,50,75,85,90
# with the APU in quiet mode took node1/node2 from EC 85-92 C at 80-100 % to EC 67-69 C at 40 %. But under
# CI it made the fans cycle between 40 and 60 % about every 35 s (owner, 2026-11-22: "the fans are speeding
# up and down too often"; ~800 level changes a day on node1/node2). Two causes, both measured that day:
#   1. The band was narrower than one level step. 40 -> 60 % lowers the EC temperature by ~6.3 C at the
#      quiet 55 W cap (node1, fixed levels in alternating 3.5 min blocks at the same package power: 60 %
#      72.0 / 72.8 C, 40 % 78.7 C; the step shrinks with the power). The band was 5 C (up 80, down 75), so a
#      load that settles between 80 and ~81 C at 40 % HAS to cycle: too hot at 40 %, below the down threshold
#      at 60 %. Held at a fixed 40 % for 10 min at the cap, node1 settled at EC 78-82 C (max 85), NVMe
#      composite 57 C, controller 80 C: 40 % was enough, and the old curve left it every ~35 s for a 1-3 C
#      wiggle over 80.
#   2. Bursts. The EC temperature follows Tctl within seconds: a 30 s CI burst takes it from 80 to 92 C and
#      back to 75 C (node2: 90 -> 92 -> 82 -> 75 C in 16 s). A curve with a wide band (tried live for 20 min:
#      60 % from 88 C, back down at 76 C) still changed level 21-36 times an hour on node2/node3, each time
#      for heat that was gone before the airflow changed. Only a time filter separates sustained heat
#      from a burst, and the driver has none: ec-fan-governor.
pve_ec_fan_rampup_curve: [40, 55, 95, 96, 98]
pve_ec_fan_rampdown_curve: [35, 50, 60, 61, 62]

# ---- ec-fan-governor: levels 3-5 on the smoothed EC temperature ----
# A daemon next to the curve (ec-fan-governor.service, files/ec-fan-governor.sh has the full rules). It
# averages the EC temperature (exponential moving average, time constant pve_ec_fan_governor_tau_s) and
#   - steps up to level 3 / 4 / 5 when the AVERAGE reaches pve_ec_fan_governor_up (sustained heat);
#   - steps down from level 3 / 4 / 5 when the average is at or below pve_ec_fan_governor_down, the last
#     step up (its own or the curve's) was at least pve_ec_fan_governor_hold_s ago, and the instantaneous
#     temperature is below the curve's rampup for that level. Once the hold is over it comes down level
#     after level, without a hold at each.
#   - does not step up for its first pve_ec_fan_governor_tau_s of readings after a start (every converge
#     restarts it): the average starts at the first reading, and one on a burst must not seed a 60 % hold.
# It only writes `level`, only on a fan in curve mode. The role (and the script) refuse a config where an up
# value is not below the curve's rampup for its level (the curve is the instant step above it), or a down
# value is not above the curve's rampdown for its level (the driver would step down before the hold).
# If the daemon dies at 60 %+, the fans stay there (louder, never hotter) until systemd restarts it;
# ProxmoxEcFanGovernorStale fires after 5 min, ProxmoxEcFanGovernorMissing if it never started.
# First chosen 2026-11-22 (up 86 / 90 / 94, down 78 / 84 / 88, 60 s average, curve safety step 94 / 96 / 98)
# by replaying 1 Hz traces of all three nodes through the curve + governor, then a 28 min closed-loop trial
# under live CI: no level change on any node (docs/runbooks/node-maintenance.md "EC fan curve").
# 2026-11-23, after the first 12.6 h night (owner: running ~2 C hotter is fine): CPU-fan level changes went
# from 466 / 468 / 136 (the 12.6 h before) to 4 / 39 / 89 on node1 / node2 / node3 (node3 was much busier
# that night: package power avg 40 -> 49 W). What was left:
#   - node2: most of its 60 % episodes were the curve's instant step on a momentary 94 C spike, while the
#     average was only 78-85 C; each held 60 % for 3+ min.
#   - node3: real heat, minutes long (average 86-90 C), up at each CI job and down in the dips between
#     jobs. On package power alone node3 looked ~9 C hotter than node1 (median Tctl at 52-56 W:
#     75 / 80 / 84 C on node1 / node2 / node3). That is partly its lighter load: matched on CPU busy too,
#     +5-6 C remains at 10-30 % busy, with the same fan rpm; cause not confirmed (runbook, "EC fan curve").
# The retune: the governor's up and down 2 C higher (up 88 / 92 / 96, down 80 / 86 / 90), its average
# doubled to 120 s (it rides through the dips between jobs), and the curve's first instant step 1 C higher
# (95 / 96 / 98; 96 would have gained little more: node2 18 instead of 20 changes, node3 56-46 instead of
# 62-56). A closed-loop replay of that night (30 s samples; the recorded average turned back into the EC
# signal; a fan level held lower than recorded warms the EC by 6.3 / 3.2 / 2.5 C for 60 / 80 / 100 %
# through a 30-60 s lag; it reproduces the recorded 4 / 39 / 89 changes as 6 / 41-36 / 86-81 under the old
# values) gives 2 / 20 / 62-56 changes, 60 %+ time 1 / 10 / 29 % -> 0.4 / 5 / 22 %, EC mean +0.0 / +0.3 /
# +0.5 C, p95 +0.3 / +0.6 / +1.3 C. The cost is a slower answer to sustained heat: on a steady 94 C (1 C
# under the instant step) the fans now wait ~100 s for 60 % where they stepped at once, on a steady 90 C
# ~190 s instead of ~55 s, and a 0.1 C/s ramp reaches 95 C instead of 91 C before 60 % (`simulate`).
# 88 C up: a busy node at the cap stays at 40 % (node1 settles at 78-82 C there); a burst has to hold ~92 C
# for about two minutes to reach it. 80 C down: the 8 C band is wider than the ~6.3 C one step takes off at
# the cap (cause 1 above), so no steady load can cycle between 40 and 60 %: one that needs 60 % at 88 C
# still reads ~82 C there, above the 80 C it would take to come down. Keep up[0] - down[0] above that step.
# 180 s hold: a second burst within 3 min does not get its own spin-down/spin-up. Longer holds trade fewer
# changes for more time at 60 %+: 600 s replayed node3 at 48-50 changes but 30 % of the time at 60 %+
# (against 22 %); 300 s replayed about the same as 180.
pve_ec_fan_governor_up: [88, 92, 96]
pve_ec_fan_governor_down: [80, 86, 90]
pve_ec_fan_governor_tau_s: 120
pve_ec_fan_governor_hold_s: 180

# ---- the APU power mode ----
# The EC's APU power profile (apu/power_mode): quiet, balanced (the AXB35's factory EC default) or
# performance. quiet is the lowest, so the APU makes less heat and the curve stays on its low levels; it is
# half of the 2026-11-19 quiet setup above. Measured on ai-node1 under real CI load that evening, with the
# quiet curve, 2-minute windows:
#   quiet        54 W (capped)        3850 MHz avg at 43 % busy   EC 73 C   level 2 / 2650 rpm   NVMe 55 C
#   balanced     82 W                 4570 MHz avg at 32 % busy   EC 86 C   level 3 / 3490 rpm   NVMe 55 C
#   performance  74 W (cap not hit)   4550 MHz avg at 27 % busy   EC 82 C   level 3 / 3490 rpm   NVMe 52 C
# So quiet costs ~16 % clock under load; performance gains nothing at this load (CI stays under balanced's
# limit); quiet is ~6 dB quieter than balanced and ~10 dB quieter than the old 35/50/60/68/95 curve; the
# drives are unaffected in every mode. Caveat: the load fell during the run (43 % to 27 % busy), which
# flatters the later modes.
# ec-fan-profile writes it on start and sets balanced, the factory EC default, on stop. Stopping does not
# restore a mode that was set before the role (on these hosts that was balanced too).
pve_ec_fan_power_mode: quiet

# ---- paths ----
pve_ec_fan_sysfs: /sys/class/ec_su_axb35
pve_ec_fan_config: /etc/default/ec-fan-profile
# node_exporter's textfile directory. The Debian package reads this directory by default, so the Proxmox
# hosts need no collector flag (the nvme_* metrics there come the same way). Literal, like the runners'
# group_vars, rather than a reference to the node_exporter role's default.
pve_ec_fan_textfile_dir: /var/lib/prometheus/node-exporter
