---
# Zot OCI registry on the registry LXC: native binary + systemd, Let's Encrypt cert via certbot
# DNS-01 (Cloudflare), bcrypt htpasswd push auth + anonymous pull. Config policy mirrors
# kubernetes/infra/registry/config.json, templated to listen on :443.

# ailab#420: the docker.io sync allowlist must never match a namespace we push (a match makes
# every tag read of our own images attempt an upstream sync, and a stuck one hangs all later reads).
- name: Refuse an empty docker.io sync allowlist
  # An empty list renders `"content": []` and would pass the per-item assert below vacuously.
  ansible.builtin.assert:
    that: registry_zot_sync_dockerhub_prefixes | length > 0
    fail_msg: registry_zot_sync_dockerhub_prefixes is empty -- see defaults/main.yml, ailab#420.
    quiet: true

- name: Refuse a docker.io sync prefix that is a catch-all or matches a local namespace
  ansible.builtin.assert:
    # The namespace must be LITERAL: a glob like `str*/**` would pass a plain membership check and
    # still match strive/*.
    that:
      - item.split('/')[0] is match('^[a-z0-9][a-z0-9._-]*$')
      - item.split('/')[0] not in registry_zot_local_namespaces
    fail_msg: >-
      registry_zot_sync_dockerhub_prefixes entry {{ item | to_json }} would sync a namespace
      registry.chifor.me publishes itself (or everything) -- see defaults/main.yml, ailab#420.
    quiet: true
  loop: "{{ registry_zot_sync_dockerhub_prefixes }}"

- name: Install packages (certbot DNS-01, htpasswd, ufw)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - certbot
      - python3-certbot-dns-cloudflare
      - apache2-utils       # htpasswd CLI
      - python3-passlib     # community.general.htpasswd idempotency
      - python3-bcrypt      # bcrypt backend for passlib
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create zot system group
  ansible.builtin.group:
    name: "{{ registry_zot_group }}"
    system: true

- name: Create zot system user
  ansible.builtin.user:
    name: "{{ registry_zot_user }}"
    group: "{{ registry_zot_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ registry_zot_config_dir }}"
    create_home: false

- name: Create zot config + cert dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ registry_zot_group }}"
    mode: "0750"
  loop:
    - "{{ registry_zot_config_dir }}"
    - "{{ registry_zot_config_dir }}/certs"

- name: Ensure data dir exists, owned by zot
  ansible.builtin.file:
    path: "{{ registry_zot_data_dir }}"
    state: directory
    owner: "{{ registry_zot_user }}"
    group: "{{ registry_zot_group }}"
    mode: "0750"

# A binary change restarts zot, and every start re-parses the whole store (7-19 min outage): never by accident.
# stat runs in check mode too, so `--check` reports exactly what a real run would refuse or replace.
- name: Read the installed zot binary's checksum
  ansible.builtin.stat:
    path: /usr/local/bin/zot
    get_checksum: true
    checksum_algorithm: sha256
  register: registry_zot_installed

- name: Refuse an unpinned version, or a binary change without registry_zot_allow_binary_change
  ansible.builtin.assert:
    that:
      - registry_zot_version in registry_zot_sha256
      - registry_zot_arch in registry_zot_sha256[registry_zot_version]
      - >-
        (not registry_zot_installed.stat.exists)
        or registry_zot_installed.stat.checksum == registry_zot_sha256[registry_zot_version][registry_zot_arch]
        or (registry_zot_allow_binary_change | bool)
    fail_msg: >-
      zot {{ registry_zot_version }} ({{ registry_zot_arch }}): either no sha256 in registry_zot_sha256 for that
      version and arch (add it), or the installed binary
      differs from it and registry_zot_allow_binary_change is false. Replacing the binary restarts zot (a full
      store parse, 7-19 min): opt in explicitly, in a quiet window. docs/runbooks/registry-cache.md.
    quiet: true

- name: Install the zot binary
  ansible.builtin.get_url:
    url: "https://github.com/project-zot/zot/releases/download/{{ registry_zot_version }}/zot-linux-{{ registry_zot_arch }}"
    dest: /usr/local/bin/zot
    checksum: "sha256:{{ registry_zot_sha256[registry_zot_version][registry_zot_arch] }}"
    mode: "0755"
    owner: root
    group: root
  notify: restart zot

# ---- TLS: Let's Encrypt DNS-01 via Cloudflare ----
- name: Create certbot secrets dir
  ansible.builtin.file:
    path: /root/.secrets
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write certbot Cloudflare credentials
  ansible.builtin.template:
    src: cloudflare.ini.j2
    dest: /root/.secrets/cloudflare.ini
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Ensure certbot deploy-hook dir exists
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    mode: "0755"

- name: Install the zot cert deploy hook
  ansible.builtin.template:
    src: zot-cert-deploy.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/zot-cert.sh
    mode: "0755"

- name: Obtain the Let's Encrypt cert (DNS-01) — first issue only; renewals via certbot.timer
  ansible.builtin.command:
    argv: "{{ certbot_argv }}"
    creates: "/etc/letsencrypt/live/{{ registry_zot_hostname }}/fullchain.pem"
  vars:
    certbot_argv: >-
      {{ ['certbot', 'certonly', '--non-interactive', '--agree-tos', '-m', registry_zot_acme_email,
          '--dns-cloudflare', '--dns-cloudflare-credentials', '/root/.secrets/cloudflare.ini',
          '--dns-cloudflare-propagation-seconds', '30', '-d', registry_zot_hostname,
          '--keep-until-expiring']
          + (['--staging'] if registry_zot_acme_staging | bool else []) }}

- name: Ensure certbot auto-renewal timer is enabled
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: true
    state: started

- name: Install the issued cert into zot's cert dir (initial run of the deploy hook)
  ansible.builtin.command: /etc/letsencrypt/renewal-hooks/deploy/zot-cert.sh
  args:
    creates: "{{ registry_zot_config_dir }}/certs/tls.crt"
  notify: restart zot

# ---- Registry config + auth ----
# config.json is applied by files/zot-config-apply.py, NOT by a template + `restart zot`: a restart re-parses the
# whole store before :443 binds again (2026-11-17: 19 min outage, ~265 GB written to ai-node1). When only
# reload-safe keys change (the helper's RELOADABLE: retention, gcDelay/gcInterval, accessControl rules) it writes
# the SAME inode zot watches and proves zot reloaded it (journal line, same PID, /v2/ answers); any other change, a
# first deploy or a detached watch falls back to an atomic replace + `restart zot`. docs/runbooks/registry-cache.md.
- name: Install the zot config apply helper
  ansible.builtin.copy:
    src: zot-config-apply.py
    dest: /usr/local/lib/zot-config-apply.py
    owner: root
    group: root
    mode: "0755"
  check_mode: false # the apply step runs it with --dry-run in check mode, so it must exist

- name: Name this play's zot config candidate (unique, so overlapping plays never share one)
  ansible.builtin.set_fact:
    registry_zot_candidate: >-
      {{ registry_zot_config_dir }}/config.json.candidate.{{ now(utc=true).strftime('%Y%m%d%H%M%S') }}.{{ 999999999 | random }}

- name: Apply the zot config (render, verify, reload in place or restart)
  block:
    - name: Render the zot config candidate
      ansible.builtin.template:
        src: config.json.j2
        dest: "{{ registry_zot_candidate }}"
        owner: root
        group: "{{ registry_zot_group }}"
        mode: "0640"
      no_log: true # config.json embeds the OIDC client secret — keep it out of --diff / -v output
      check_mode: false # a candidate beside the live file is harmless; check mode needs it to classify the change
      changed_when: false # the apply step below reports the real change

    - name: Check whether the zot binary is installed
      ansible.builtin.stat:
        path: /usr/local/bin/zot
      register: registry_zot_binary

    - name: Validate the zot config candidate (same loader as `zot serve`)
      ansible.builtin.command:
        argv: [/usr/local/bin/zot, verify, "{{ registry_zot_candidate }}"]
      check_mode: false
      changed_when: false
      no_log: true # its errors can quote config fragments (secrets); on failure run `zot verify` by hand on the host
      when: registry_zot_binary.stat.exists

    - name: Apply the zot config (reload in place when only reload-safe keys changed)
      ansible.builtin.command:
        argv: >-
          {{ ['python3', '/usr/local/lib/zot-config-apply.py',
              '--current', registry_zot_config_dir ~ '/config.json',
              '--candidate', registry_zot_candidate,
              '--unit', 'zot.service', '--port', registry_zot_port | string]
             + (['--dry-run'] if ansible_check_mode else [])
             + (['--allow-restart'] if registry_zot_config_allow_restart | bool else []) }}
      check_mode: false # in check mode the helper only classifies (--dry-run) and writes nothing
      register: registry_zot_config_apply
      # rc first: a crashed helper prints nothing, and from_json on '' would mask the real failure
      changed_when: registry_zot_config_apply.rc == 0 and (registry_zot_config_apply.stdout | from_json).mode != 'none'
      failed_when: registry_zot_config_apply.rc != 0

    - name: Report how the zot config was applied
      ansible.builtin.debug:
        msg: "zot config: {{ (registry_zot_config_apply.stdout | from_json) }}"
      when: registry_zot_config_apply.rc == 0 and (registry_zot_config_apply.stdout | from_json).mode != 'none'

    - name: Remember this apply's marker token for the restart handlers
      ansible.builtin.set_fact:
        registry_zot_apply_token: "{{ (registry_zot_config_apply.stdout | from_json).token | default('') }}"
      when: registry_zot_config_apply.rc == 0

    - name: Restart zot when the config change is not reload-safe
      ansible.builtin.debug:
        msg: "zot config needs a restart: {{ (registry_zot_config_apply.stdout | from_json).reason }}"
      when: registry_zot_config_apply.rc == 0 and (registry_zot_config_apply.stdout | from_json).mode == 'restart'
      changed_when: true
      notify: restart zot
  always:
    - name: Remove this play's zot config candidate
      ansible.builtin.file:
        path: "{{ registry_zot_candidate }}"
        state: absent
      check_mode: false # it was written in check mode too

# ---- htpasswd: zot reloads it in place, never by a restart ----
# zot v2.1.23 runs an HTPasswdWatcher whenever htpasswd auth is enabled (pkg/api/htpasswd.go: fsnotify on the file and
# its directory, plus a 1 s stat poll) and swaps the credentials on change, logging "loaded htpasswd file" with the user
# count. So adding a scoped push user or rotating a password does NOT restart zot (a restart re-parses the whole store:
# 2026-11-17, a 19 min outage). files/zot-htpasswd-proof.py proves the RUNNING zot reloaded the file (its journal line
# after the last write, the file's user count, the same MainPID), then every user logs in. When zot is not running yet,
# "Enable + start zot" below starts it and it reads the file at start. An unproven reload FAILS the play (zot keeps its
# old credentials); `-e registry_zot_config_allow_restart=true` accepts a restart instead, in a quiet window.
- name: Install the zot htpasswd reload proof helper
  ansible.builtin.copy:
    src: zot-htpasswd-proof.py
    dest: /usr/local/lib/zot-htpasswd-proof.py
    owner: root
    group: root
    mode: "0755"
  check_mode: false # the snapshot below runs in check mode too

- name: Snapshot zot before the htpasswd changes (MainPID and journal cursor)
  ansible.builtin.command:
    argv: [python3, /usr/local/lib/zot-htpasswd-proof.py, snapshot, --unit, zot.service,
           --file, "{{ registry_zot_config_dir }}/htpasswd"]
  register: registry_zot_htpasswd_snapshot
  check_mode: false
  changed_when: false

- name: Generate bcrypt htpasswd for the push user
  community.general.htpasswd:
    path: "{{ registry_zot_config_dir }}/htpasswd"
    name: "{{ registry_zot_ci_user }}"
    password: "{{ registry_ci_password }}"
    crypt_scheme: bcrypt
    owner: root
    group: "{{ registry_zot_group }}"
    mode: "0640"
  no_log: true

- name: Generate bcrypt htpasswd for the read-only pull user
  community.general.htpasswd:
    path: "{{ registry_zot_config_dir }}/htpasswd"
    name: "{{ registry_zot_pull_user }}"
    password: "{{ registry_pull_password }}"
    crypt_scheme: bcrypt
    owner: root
    group: "{{ registry_zot_group }}"
    mode: "0640"
  no_log: true

# Fail with a readable message BEFORE the no_log task below, which would censor a missing-key error.
# An entry with `password_optional: true` (merged before its SOPS key exists) is skipped instead,
# and its htpasswd line removed.
- name: Every scoped push user has a password in SOPS (registry_scoped_push_passwords)
  ansible.builtin.assert:
    that: >-
      item.user in (registry_scoped_push_passwords | default({}))
      or (item.password_optional | default(false) | bool)
    fail_msg: "registry_scoped_push_passwords has no key '{{ item.user }}' (add it to ansible/secrets/registry.sops.yaml)"
    quiet: true
  loop: "{{ registry_zot_scoped_push_users }}"
  loop_control:
    label: "{{ item.user }}"

- name: Report scoped push users skipped for want of a SOPS password
  ansible.builtin.debug:
    msg: >-
      SKIPPED {{ item.user }}: registry_scoped_push_passwords has no key '{{ item.user }}' in
      ansible/secrets/registry.sops.yaml yet, so its htpasswd line is removed (if present) and the
      user cannot log in. Its {{ item.repositories }} grant in config.json stays inert until the
      operator adds the key and re-runs the play.
  loop: "{{ registry_zot_scoped_push_users }}"
  loop_control:
    label: "{{ item.user }}"
  when:
    - item.password_optional | default(false) | bool
    - item.user not in (registry_scoped_push_passwords | default({}))

- name: Report a stale password_optional flag (the SOPS key now exists)
  ansible.builtin.debug:
    msg: >-
      STALE FLAG {{ item.user }}: registry_scoped_push_passwords now has its key, so drop
      `password_optional` from its registry_zot_scoped_push_users entry (defaults/main.yml); with
      the flag, a later loss of the key would silently remove the user instead of failing the play.
  loop: "{{ registry_zot_scoped_push_users }}"
  loop_control:
    label: "{{ item.user }}"
  when:
    - item.password_optional | default(false) | bool
    - item.user in (registry_scoped_push_passwords | default({}))

# "Skipped" must mean "cannot log in": an optional user whose key was removed (or never added) must
# not keep a line from an earlier run.
- name: Remove the htpasswd line of an optional scoped push user with no SOPS password
  community.general.htpasswd:
    path: "{{ registry_zot_config_dir }}/htpasswd"
    name: "{{ item.user }}"
    state: absent
  loop: "{{ registry_zot_scoped_push_users }}"
  loop_control:
    label: "{{ item.user }}"
  when:
    - item.password_optional | default(false) | bool
    - item.user not in (registry_scoped_push_passwords | default({}))
  no_log: true

- name: Generate bcrypt htpasswd for the scoped per-project push users
  community.general.htpasswd:
    path: "{{ registry_zot_config_dir }}/htpasswd"
    name: "{{ item.user }}"
    password: "{{ registry_scoped_push_passwords[item.user] }}"
    crypt_scheme: bcrypt
    owner: root
    group: "{{ registry_zot_group }}"
    mode: "0640"
  loop: "{{ registry_zot_scoped_push_users }}"
  loop_control:
    label: "{{ item.user }}"
  when: item.user in (registry_scoped_push_passwords | default({}))
  no_log: true

# Optional Docker Hub credentials for the pull-through cache's UPSTREAM (sync.credentialsFile).
# Only rendered when registry_zot_sync_dockerhub_user is set; config.json references it only then.
# Lifts the cache's own Docker Hub egress off the anonymous 100-pulls/6h limit (see defaults).
- name: Deploy zot sync upstream credentials (Docker Hub)
  ansible.builtin.template:
    src: sync-credentials.json.j2
    dest: "{{ registry_zot_sync_credentials_file }}"
    owner: root
    group: "{{ registry_zot_group }}"
    mode: "0640"
  no_log: true
  when: registry_zot_sync_dockerhub_user | length > 0
  notify: restart zot

# ---- Service ----
- name: Install the zot systemd unit
  ansible.builtin.template:
    src: zot.service.j2
    dest: /etc/systemd/system/zot.service
    mode: "0644"
  notify:
    - reload systemd
    - restart zot

- name: Flush handlers so the unit is registered before enable/start
  ansible.builtin.meta: flush_handlers

- name: Enable + start zot
  ansible.builtin.systemd:
    name: zot.service
    enabled: true
    state: started

# ---- Prove the running zot serves the current htpasswd (after the handlers: no restart is still pending) ----
# On EVERY apply, not only when this run wrote the file: an earlier run whose reload went unproven (an added, rotated
# or REMOVED user) leaves the file unchanged now. files/zot-htpasswd-proof.py judges the zot running at this point:
# - a zot restarted (or first started) by this play (binary, certs, unit, sync credentials, a restart-only config
#   change) loads the file only when its start-up store parse ends (up to ~19 min) and watches it from then on, so
#   it cannot hold stale credentials: "restarted", and no login checks (it is not serving yet);
# - the same process as the snapshot: a changed file must show its reload ("reloaded"); an unchanged one is rewritten
#   with its own bytes (same inode, length and content) so that zot reloads it, and that reload is proven
#   ("reloaded-forced"), so a pending removal from an earlier run is applied and proven now.
# The logins are the ground truth for added and rotated users: a reload line shows zot read the file after its last
# write, not which bytes it read. Anything unproven fails the play and restarts nothing unless
# registry_zot_config_allow_restart is set.
- name: Verify the running zot serves the current htpasswd (reloaded in place, never restarted for it)
  when: not ansible_check_mode
  block:
    - name: Prove the running zot loaded the current htpasswd file
      ansible.builtin.command:
        argv:
          - python3
          - /usr/local/lib/zot-htpasswd-proof.py
          - prove
          - --unit
          - zot.service
          - --file
          - "{{ registry_zot_config_dir }}/htpasswd"
          - --pid
          - "{{ (registry_zot_htpasswd_snapshot.stdout | from_json).pid | string }}"
          - --cursor
          - "{{ (registry_zot_htpasswd_snapshot.stdout | from_json).cursor | default('', true) }}"
          - --since-ns
          - "{{ (registry_zot_htpasswd_snapshot.stdout | from_json).timeNs | string }}"
          - --before-sha256
          - "{{ (registry_zot_htpasswd_snapshot.stdout | from_json).sha256 | default('', true) }}"
          - --timeout
          - "{{ registry_zot_htpasswd_proof_timeout | string }}"
      register: registry_zot_htpasswd_proof
      changed_when: (registry_zot_htpasswd_proof.stdout | from_json).mode == 'reloaded-forced'

    - name: The ci and pull users log in on the running zot
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ registry_zot_port }}/v2/"
        url_username: "{{ item.user }}"
        url_password: "{{ item.password }}"
        force_basic_auth: true
        validate_certs: false # 127.0.0.1 is not on the certificate; this checks the credentials, not TLS
        status_code: 200
        timeout: "{{ registry_zot_htpasswd_login_timeout }}"
      loop:
        - { user: "{{ registry_zot_ci_user }}", password: "{{ registry_ci_password }}" }
        - { user: "{{ registry_zot_pull_user }}", password: "{{ registry_pull_password }}" }
      loop_control:
        label: "{{ item.user }}"
      no_log: true
      register: registry_zot_htpasswd_login
      until: (registry_zot_htpasswd_login.status | default(0)) == 200
      retries: "{{ registry_zot_htpasswd_login_retries }}"
      delay: 2
      when: (registry_zot_htpasswd_proof.stdout | from_json).mode != 'restarted'

    - name: Every scoped push user with a SOPS password logs in on the running zot
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ registry_zot_port }}/v2/"
        url_username: "{{ item.user }}"
        url_password: "{{ registry_scoped_push_passwords[item.user] }}"
        force_basic_auth: true
        validate_certs: false # 127.0.0.1 is not on the certificate; this checks the credentials, not TLS
        status_code: 200
        timeout: "{{ registry_zot_htpasswd_login_timeout }}"
      loop: "{{ registry_zot_scoped_push_users }}"
      loop_control:
        label: "{{ item.user }}"
      no_log: true
      register: registry_zot_htpasswd_login
      until: (registry_zot_htpasswd_login.status | default(0)) == 200
      retries: "{{ registry_zot_htpasswd_login_retries }}"
      delay: 2
      when:
        - (registry_zot_htpasswd_proof.stdout | from_json).mode != 'restarted'
        - item.user in (registry_scoped_push_passwords | default({}))
  rescue:
    - name: Restart zot because its htpasswd state was not proven and a restart is allowed
      ansible.builtin.debug:
        msg: >-
          {{ ansible_failed_task.name }} failed ({{ ansible_failed_result.stdout | default('details hidden') }});
          restarting zot, as registry_zot_config_allow_restart allows.
      when: registry_zot_config_allow_restart | bool
      changed_when: true
      notify: restart zot

    - name: Stop because the htpasswd state was not proven (no restart without registry_zot_config_allow_restart)
      ansible.builtin.fail:
        msg: >-
          {{ ansible_failed_task.name }} failed ({{ ansible_failed_result.stdout | default('details hidden') }}).
          zot was not restarted and keeps the credentials it had loaded. Check `journalctl -u zot | grep htpasswd`,
          or accept a restart (a ~19 min registry outage) in a quiet window: -e registry_zot_config_allow_restart=true.
      when: not (registry_zot_config_allow_restart | bool)

# ---- Firewall ----
- name: Allow SSH + HTTPS through ufw
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["22", "443"]
  when: registry_zot_manage_ufw | bool

- name: Enable ufw (default deny incoming)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  when: registry_zot_manage_ufw | bool
