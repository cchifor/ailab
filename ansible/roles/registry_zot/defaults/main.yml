---
# Zot OCI registry (native binary + systemd) on the registry LXC. registry.chifor.me:443.
# renovate: datasource=github-releases depName=project-zot/zot
registry_zot_version: "v2.1.23"         # pin to a project-zot release; matches docker-compose.yml (renovate-tracked above)
registry_zot_arch: "amd64"
# The release binary's sha256 per version (`zot-linux-amd64`, from the release's checksums.sha256.txt AND the GitHub
# asset digest). get_url verifies it, and the binary-change guard below compares the installed file with it. A
# version without an entry FAILS the play (fail closed): add the hash in the same PR as a renovate bump.
# Keyed by version, then registry_zot_arch (the release asset is zot-linux-<arch>): a version or an arch without an
# entry fails closed.
registry_zot_sha256:
  v2.1.18:
    amd64: "a359a0af159db6758b24f8e26d6a244aae95caf3ff382c462875f42d9e082898"
  v2.1.23:
    amd64: "1f6bab0b9eee426d0785de701ff510df5c02bdb8d7287494a582634abfc5d638"
# Replacing the binary restarts zot, and every start re-parses the whole store (7-19 min registry outage). Like
# registry_zot_config_allow_restart, it is an explicit opt-in: the play FAILS when the installed binary is not the
# pinned version's, unless this is true (`-e registry_zot_allow_binary_change=true`, in a quiet window).
registry_zot_allow_binary_change: false
registry_zot_hostname: "registry.chifor.me"
registry_zot_port: 443                  # bind 443 directly (systemd grants CAP_NET_BIND_SERVICE)

registry_zot_user: "zot"
registry_zot_group: "zot"
registry_zot_config_dir: "/etc/zot"
# The tofu mp0 data disk mounts at registry_zot_mount_dir; zot's rootDirectory is a SUBDIR of it
# (registry_zot_data_dir). zot scans its rootDirectory for repos, and the ext4 `lost+found` at the
# mount root is root:0700 -> the scan fails "permission denied". Using a subdir avoids it entirely.
registry_zot_mount_dir: "/var/lib/registry"
registry_zot_data_dir: "/var/lib/registry/store"

# Push identity (authenticated). The password comes from SOPS (registry_ci_password); anonymous
# clients get read-only (pull) per config.json.
registry_zot_ci_user: "ci"

# Read-only pull identity (password: SOPS registry_pull_password; projected to dev-workers as
# af/dev-workers/common registry_pull_{user,password}). Anonymous pull already has `read`, but zot
# answers the /v2/ ping with a basic challenge for docker/* User-Agents, and a dockerd on the classic
# overlay2 image store then fails client-side with "no basic auth credentials" before ever sending the
# manifest GET. `docker login` with this user fixes that WITHOUT handing out the rw `ci` identity.
registry_zot_pull_user: "pull"

# Per-project push identities, each confined to ONE repository prefix (read/create/update; no delete).
# For an application repo's own publish CI, so it never needs the global rw `ci` user. Each password
# is SOPS `registry_scoped_push_passwords[<user>]` (registry.sops.yaml), escrowed at af/estate/registry
# `<user, - as _>_password` (trueswarm_ci_password), and handed to the app repo as Gitea Actions secrets REGISTRY_USERNAME /
# REGISTRY_PASSWORD. Never projected to dev-workers (docs/runbooks/registry-cache.md).
#
# A scoped user has NO rights outside its prefix, not even read: zot's anonymousPolicy applies only
# to UNAUTHENTICATED requests, so a client logged in as one of these users cannot pull other repos
# (base images through the mirror, strive/* pins). Keep its credential confined to the push step.
#
# `password_optional: true` lets an entry merge before its SOPS key exists: the role then REMOVES the
# user's htpasswd line (if any) with a message instead of failing the play. Its accessControl grant
# still renders, but stays inert, because a user with no htpasswd line cannot log in. Remove the flag
# in the change that adds the key, so the assert guards it like the others.
registry_zot_scoped_push_users:
  - user: "trueswarm-ci"
    repositories: "trueswarm/**"   # cchifor/trueswarm .gitea/workflows/publish.yml
  - user: "workbricks-ci"
    repositories: "workbricks/**"  # cchifor/workbricks image-publish CI (Workbricks OR-12)
  # cchifor/platform e2e build-once (platform#2823): stack-smoke pushes each commit's test images to
  # strive/ci-build/<image>:ci-<40-hex commit> and the journey shards pull them by digest instead of
  # rebuilding (NVMe write budget). A NEW namespace on purpose: strive/ci/* already holds 12 platform
  # repos with latest/ailab/sha- tags under strive/** retention. Retention:
  # registry_zot_strive_ci_build_keep_recent below.
  - user: "strive-ci-push"
    repositories: "strive/ci-build/**"
  # cchifor/specpulse .gitea/workflows/publish.yml: the deployed app's image, pinned by digest in
  # kubernetes/apps/apps/specpulse (owner decision 2026-11-26: deploy specpulse on ailab by GitOps).
  - user: "specpulse-ci"
    repositories: "specpulse/**"

# Web-UI SSO via Authelia (zot-native OIDC). Docker push (ci/htpasswd) + anonymous pull are
# UNAFFECTED — only the browser UI gains a "Login with Authelia" button. The plaintext client
# secret (registry_oidc_client_secret) comes from SOPS (registry.sops.yaml); the Authelia client +
# secret HASH live in kubernetes/apps/apps/auth/authelia-config.yaml. The provider key MUST equal
# the Authelia redirect_uri path segment: https://<host>/zot/auth/callback/<key>.
registry_zot_oidc_enabled: true
registry_zot_oidc_issuer: "https://sso.chifor.me"
registry_zot_oidc_client_id: "registry"
registry_zot_oidc_provider_key: "oidc"
# Authelia group whose SSO-logged-in UI users get full push/admin (zot matches the OIDC `groups`
# claim against accessControl + adminPolicy). `admins` is the lab's existing admin group (user
# chifor is a member). Empty string disables the group policy. ci/htpasswd push + anon pull unaffected.
registry_zot_admin_group: "admins"

# Let's Encrypt (DNS-01 via Cloudflare). The token (cloudflare_dns_api_token) comes from SOPS and
# needs Zone:DNS:Edit on chifor.me — the SAME scoped token the cloudflare tofu module uses.
registry_zot_acme_email: "chifor@gmail.com"
registry_zot_acme_staging: false        # set true to test against LE staging (untrusted cert)

# ufw (the LXC is on the mgmt LAN; only 22 + 443 need to be open)
registry_zot_manage_ufw: true

# ---- Pull-through cache (sync extension) ----
# Zot's `sync` runs registry.chifor.me as an on-demand pull-through MIRROR of upstream base images
# (docker.io/quay.io/mcr) so the cchifor/platform CI runners stop hitting Docker Hub's anonymous 429.
# Images are served at the TRANSPARENT upstream path (registry.chifor.me/v2/library/python/... etc),
# which is what a Docker daemon `registry-mirrors` and a BuildKit `[registry."docker.io"] mirrors`
# require — proven end-to-end by cchifor/platform's scripts/ci/verify-registry-mirror.sh.
# Prefix layering (config.json.j2): quay.io (keycloak/**) and mcr (playwright*) keep SPECIFIC
# prefixes and are listed FIRST; docker.io is listed LAST with the explicit allowlist below.
# See docs/decisions/0014-registry-pull-through-cache.md.
#
# docker.io is an ALLOWLIST, NEVER "**" (ailab#420; recurred 2026-09-26). A "**" catch-all also
# matches the namespaces we PUSH (strive/**, agentforge/**, …): every TAG lookup of our own images
# then starts an on-demand upstream sync for something that cannot exist upstream (9,036
# `failed to sync image` in one day), and one that never settles wedges every later read of that
# reference ("image already demanded, waiting on channel") — tag-manifest reads hang while `/v2/`
# stays green (cchifor/platform#788). Zot content filters have no negation, so an explicit list is
# the only way to say "never proxy our own namespaces". The fix was first applied by hand on
# 2026-08-26 and silently lost when this role re-rendered the config on 2026-09-25 — hence here,
# pinned by scripts/tests/test_registry_zot_sync_allowlist.py and asserted at apply time.
#
# THE TRADE-OFF: a docker.io namespace NOT listed here 404s on the mirror, and a daemon with
# `registry-mirrors` then falls back to anonymous Docker Hub (the 429 this cache exists to avoid).
# A new upstream dependency = add its namespace here + `just registry`. The earlier disjoint design
# (library/** + nginxinc/** only) failed exactly that way, so the list is generous: every namespace
# in the live store (2026-09-26) plus every docker.io reference in the platform and ailab repos.
registry_zot_sync_dockerhub_prefixes:
  # official images (`python`, `node`, … resolve to library/*) + root repos pulled by short path
  - "library/**"
  - "debian"
  - "postgres"
  # namespaced docker.io images
  - "alpine/**"
  - "binwiederhier/**"
  - "brave/**"
  - "cloudflare/**"
  - "curlimages/**"
  - "docker/**"
  - "dpage/**"
  - "edoburu/**"
  - "gitea/**"
  - "grafana/**"
  - "hashicorp/**"
  - "headlamp-k8s/**"
  - "jaegertracing/**"
  - "koalaman/**"
  - "mcp/**"
  - "minio/**"
  - "modelcontextprotocol/**"
  - "moby/**"
  - "nginxinc/**"
  - "openbao/**"
  - "otel/**"
  - "pgvector/**"
  - "prom/**"
  - "qdrant/**"
  - "rancher/**"
  - "rclone/**"
  - "renovate/**"
  - "rustfs/**"
  - "searxng/**"
  - "tecnativa/**"
  - "testcontainers/**"
  - "valkey/**"
  - "vaultwarden/**"
  - "velero/**"
  - "verdaccio/**"

# Namespaces CI/agents PUSH to this registry. None may appear in the sync allowlist above — the
# role fails the play if one does (tasks/main.yml).
registry_zot_local_namespaces:
  - strive
  - agentforge
  - testpool
  - trueswarm
  - trueswarm-admin
  - muse-stream
  - test
#
# Docker Hub anonymous 429: solved by pointing the docker.io sync UPSTREAM at Google's anonymous
# Docker Hub pull-through `mirror.gcr.io` (primary), with `registry-1.docker.io` kept as failover
# (config.json.j2). mirror.gcr.io serves the SAME image digests as Docker Hub (digest-pinned pulls
# match) and is not subject to the 100-pulls/6h anonymous cap. So `registry_zot_sync_dockerhub_user`
# below is now OPTIONAL — it only authenticates the registry-1.docker.io FAILBACK path; leave empty
# unless mirror.gcr.io ever lacks an image. quay.io/mcr are not rate-limited.
registry_zot_sync_dockerhub_user: ""
registry_zot_sync_credentials_file: "{{ registry_zot_config_dir }}/sync-credentials.json"

# ---- Config apply (files/zot-config-apply.py) ----
# When a change is reload-safe but zot cannot be reloaded (its watch on config.json is gone, e.g. the file was
# replaced since zot started, or the live config.json is not valid JSON), the helper FAILS the play instead of
# restarting: a restart is a 19 min registry outage (2026-11-17). Set true for ONE apply, in a quiet window, to
# accept that restart: `-e registry_zot_config_allow_restart=true`. Restart-only changes (sync, auth, ports, ...)
# and a first deploy restart regardless, as before. docs/runbooks/registry-cache.md "Reload or restart".
registry_zot_config_allow_restart: false

# Seconds the htpasswd proof (files/zot-htpasswd-proof.py) waits for the running zot's "loaded htpasswd file" line
# after an htpasswd change. zot reloads within ~1 s (fsnotify, 150 ms debounce; a 1 s stat poll as backstop).
registry_zot_htpasswd_proof_timeout: 30
# The login checks after the proof (ci, pull, each scoped user): a bounded request timeout (seconds) and retries, 2 s
# apart. Worst case per user: (retries + 1) x (timeout + 2) s = 42 s, which only a stalled zot would ever spend.
registry_zot_htpasswd_login_timeout: 5
registry_zot_htpasswd_login_retries: 5

# The registry-side WRITER FENCE. When true, config.json renders every accessControl action list (anonymous, ci, pull,
# the scoped push users, the admin group and adminPolicy) as read-only: pushes and deletes are denied, pulls work.
# http.accessControl is reload-safe (files/zot-config-apply.py RELOADABLE), so turning it on or off is a reload, not a
# restart. Used during the zot move (2026-11-21): on before the cutover stop, off after the post-start acceptance.
# On cutover night the fence-off play runs against the NEW CT while group_vars still pins v2.1.18, so it is exactly:
#   ansible-playbook registry.yml -e registry_zot_version=v2.1.23 -e registry_zot_read_only=false
# The binary guard stays honest: the installed bytes match the v2.1.23 entry, so nothing is downloaded and no
# restart happens. Any other registry play waits for the move's follow-up PR (which drops the v2.1.18 pin).
registry_zot_read_only: false

# ---- Retention (storage.retention in config.json.j2) ----
# Without retention the store grows unbounded (~one sha-<commit> tag per repo per platform main
# build) and eventually fills the data disk → 100%-full blob-write failures. The mirror
# repos (everything else) are a CACHE: they are explicitly PROTECTED (deleteUntagged:false, keep
# all tags) so digest-pinned base-image pulls are never GC'd (Zot can't re-sync a bare digest).
#
# strive/** keeps `latest`, `ailab` and `ailab-prev*`, and two bounded families: the `sha-<commit>`
# builds and the `ailab-<digest>` protect tags (platform protect-ailab-images.yml writes one per
# pinned digest). Each family keeps its N most recently pushed tags (registry_zot_strive_keep_recent)
# OR any pushed within registry_zot_strive_keep_within; GC reclaims the rest. The two rules sit in
# ONE keepTags entry, and zot v2.1.18 ORs the rules of one entry: pkg/retention/retention.go
# GetRetainedTagsFromMetaDB runs every rule over all of the entry's tags and keeps the union ("we
# retain candidates if any of the below rules are met (OR logic between rules)"). So the N newest
# are always kept and the window can only keep MORE.
# A time window as the SOLE criterion stays wrong: age pruning alone is non-deterministic (it drops
# the deployed pin in a quiet period and balloons under heavy CI). Count-only history: 25 pruned
# sha-b80a376c out from under the LIVE ailab pins in ~4 days (registry-404 ImagePullBackOff on every
# reschedule, 2026-06-28), then 100 with every ailab-<digest> tag kept forever. A count plus 14 days
# since 2026-11-20 (owner): a GC'd digest can't be re-pulled, only rebuilt, so what is deployed must stay
# tagged. "Pushed" is zot's per-DIGEST metaDB PushTimestamp: re-tagging an existing digest (the
# protect job's `imagetools create`) does NOT refresh it, so an ailab-<digest> tag ages from its
# build, not from its tagging. BEFORE lowering either knob (or editing the macro), run
# scripts/zot-retention-pin-scan.py: it fails if an image in use would be deleted.
# ailab-<digest> tags ALSO stay while their digest was PULLED within the window (pulledWithin: zot's
# DaysPull keeps a tag pulled OR pushed in it). The count alone failed that gate on 2026-11-20: the
# platform pins historical digests (app-runner templates, airlock, workflow runtimes) far below the 10
# newest protect tags (app-runner's oldest pinned one ranked 54th), and no count follows a pinned SET.
# platform protect-ailab-images.yml GETs every pinned digest daily (06:17Z), and a manifest GET updates
# the metaDB LastPullTimestamp (v2.1.18 routes.go GetManifest -> meta.OnGetManifest ->
# UpdateStatsOnDownload; a HEAD does not). So "pulled within 14 days" tracks "still pinned", with 13
# days of slack if that job stops. A digest the job does not fetch is NOT covered: the gate shows it.
# 30, not the 10 the owner asked for, until that gap closes. On 2026-11-20 the gate failed at 10 and
# 15: airlock's processingRuntimeAdmissions name 8 workflow runtimes that platform list-ailab-pins.py
# does not list, so they are never re-fetched. They rank 11th-20th among workflow's protect tags by
# push time. 20 passes with no spare rank; 30 leaves 10 (workflow gained 24 protect tags in the 30
# days before, 3 in the last 14). Lower it to 10 once the platform protects those admissions and the
# gate passes at 10. The FIRST REAL (non-dry-run) apply of this policy waits for that platform change.
# Once live, GC re-evaluates every hour, and each new workflow pin moves those 8 one rank down, with or
# without another apply: the 10 spare ranks are a buffer of about two weeks at October's pin rate, not
# protection.
registry_zot_strive_keep_recent: 30
# ...OR pushed within this window (and, for ailab-<digest>, pulled within it). A Go duration string
# (zot parses it like gcDelay): 336h = 14 days.
registry_zot_strive_keep_within: "336h"

# storage.retention.dryRun. While true, zot's GC logs every retention decision ("applied policy",
# "decision":"delete", "dry-run":true) and deletes NO tag or manifest. It is GLOBAL: deleteReferrers,
# deleteUntagged and the strive/ci-build/** and agentforge/** pruning all pause with it. Turn it on
# for one GC cycle when retention changes (`-e registry_zot_retention_dry_run=true`, a reload), read the
# log, then apply again without it. docs/runbooks/registry-cache.md "Changing tag retention".
registry_zot_retention_dry_run: false

# Repos (zot globs) whose retention also drops ORPHANED REFERRERS: buildx attestation manifests whose subject
# image retention already deleted (deleteReferrers; zot GC removes a referrer whose subject is no longer in the
# repo's index.json, pkg/storage/gc/gc.go removeReferrer). On 2026-11-18 they were 55-77% of every strive repo's
# manifests (strive/web 1246 of 2300) and dominate zot's metaDB, which every restart rebuilds (19 min). Each listed
# glob gets its own policy, rendered BEFORE strive/** with the SAME keepTags (one macro) plus deleteReferrers, so
# only referrers change. Canary first (one repo; measure one GC cycle: zot writes, cp1 fsync), then widen to
# ["strive/**"]. The change is reload-safe (files/zot-config-apply.py): no restart.
# BEFORE adding a repo here, run scripts/zot-referrer-orphan-check.py on it: zot's GC checks a referrer's subject
# against TOP-LEVEL index.json entries only and ignores keepTags, so the check must report nested_not_top == 0 and
# tagged_orphans == 0 (2026-11-18: strive/web, strive/sentinel, strive/knowledge all safe; 2026-11-19 09:0xZ, B1:
# strive/e2e-runner 1843 orphans, strive/keycloak-realm-sync 1836, strive/notification 1774, all safe, check-rc=0).
# Widened on 2026-11-20 (owner go: "cleanup the registry"; strive/web canary clean, B1 applied 10:17Z). Pre-check of
# EVERY strive/** repo, 2026-11-20 10:14Z, 64 repos: 63 safe (nested_not_top 0, tagged_orphans 0, unreadable 0).
# Orphans per repo: airlock 1696, app-runner 1263, deepagent 1172, digest 1269, doc-search 997, e2e-runner 1864,
# gatekeeper 983, harness 654, integration 1286, keycloak 802, keycloak-realm-sync 1857, knowledge 1780, mcp 1773,
# notification 1795, profile 1790, sentinel 1271, tms 1776, web 0, workflow 1755; strive/ci/* 1 each (12, their only
# manifest); pin-manifest and strive/cache/* 0. New beyond the canary and B1: 20,279 deletions, ~4 MB of metaDB
# writes each on node1 (~80 GB). check-rc=1 for ONE repo, strive/keycloak-sync: its index is EMPTY ("manifests":
# null, no blobs), which the check fails closed on. zot globs have no negation, so instead of "strive/**" the list
# names every safe repo and keycloak-sync stays on plain strive/**. strive/ci-build/* (12, all safe) is not listed:
# the strive/ci-build/** policy above claims those repos first. A new strive repo gets deleteReferrers only when it
# is added here after its own pre-check. ["strive/**"] (the template supports it) once keycloak-sync is gone or passes.
registry_zot_strive_delete_referrers_repos:
  # the 19 service repos (strive/web = the 2026-11-18 canary; e2e-runner, keycloak-realm-sync, notification = B1)
  # and strive/pin-manifest
  - "strive/airlock"
  - "strive/app-runner"
  - "strive/deepagent"
  - "strive/digest"
  - "strive/doc-search"
  - "strive/e2e-runner"
  - "strive/gatekeeper"
  - "strive/harness"
  - "strive/integration"
  - "strive/keycloak"
  - "strive/keycloak-realm-sync"
  - "strive/knowledge"
  - "strive/mcp"
  - "strive/notification"
  - "strive/profile"
  - "strive/sentinel"
  - "strive/tms"
  - "strive/web"
  - "strive/workflow"
  - "strive/pin-manifest"
  # buildx cache repos (one manifest each, no referrers today)
  - "strive/cache/airlock"
  - "strive/cache/app-runner"
  - "strive/cache/deepagent"
  - "strive/cache/digest"
  - "strive/cache/doc-search"
  - "strive/cache/e2e"
  - "strive/cache/gatekeeper"
  - "strive/cache/harness"
  - "strive/cache/integration"
  - "strive/cache/keycloak"
  - "strive/cache/keycloak-realm-sync"
  - "strive/cache/knowledge"
  - "strive/cache/mcp"
  - "strive/cache/notification"
  - "strive/cache/profile"
  - "strive/cache/sentinel"
  - "strive/cache/tms"
  - "strive/cache/web"
  - "strive/cache/workflow"
  # strive/ci/*: each holds one orphaned referrer and nothing else (no tag). GC then empties and removes
  # them; once /v2/_catalog no longer lists them, drop these 12 entries (and the tests' fixture for them).
  - "strive/ci/platform-app-runner-latest"
  - "strive/ci/platform-digest-test"
  - "strive/ci/platform-doc-search-latest"
  - "strive/ci/platform-e2e-local"
  - "strive/ci/platform-echo-http"
  - "strive/ci/platform-hatchet-init"
  - "strive/ci/platform-integration"
  - "strive/ci/platform-mock-mcp"
  - "strive/ci/platform-mock-mcp-oauth"
  - "strive/ci/platform-mock-model"
  - "strive/ci/platform-sentinel-latest"
  - "strive/ci/platform-stub-oauth"

# strive/ci-build/** holds cchifor/platform's per-commit e2e images (`ci-<40-hex commit>`, pushed by
# strive-ci-push above). Its policy is listed BEFORE strive/** in config.json.j2: zot applies only
# the FIRST policy whose repositories glob matches a repo, and under strive/** a ci- tag matches no
# keepTags entry, so the hourly GC would delete it while the pipeline's shards still need it. Keeps
# the N most-recently-pushed ci- tags per repository; any other tag under strive/ci-build/** is
# pruned. That is why it is a NEW namespace and not strive/ci/**: the existing strive/ci/* repos
# keep latest/ailab/sha- tags under strive/**, and a first-match strive/ci/** policy would strip
# them. These are throwaway build outputs, never deployed or pinned: the window only has to outlive
# one pipeline (smoke pushes, the shards pull), so it is small on purpose.
registry_zot_strive_ci_build_keep_recent: 10
# ...OR pushed within this window (zot ORs the rules of one keepTags entry). A count alone can evict
# a running pipeline's image when a busy repo takes 10 more pushes mid-run; the time floor keeps
# every ci- tag at least this long. Go duration string, parsed like gcDelay.
registry_zot_strive_ci_build_keep_within: "24h"

# agentforge/** does NOT all push the same tag shape (verified against the live tag lists AND
# both engine repos' workflows on 2026-09-02, see docs/decisions/0014-registry-pull-through-cache.md
# "Update (2026-09-02)"):
#   - orchestrator, sandbox, p1-worker (agentforge/.gitea/workflows/images.yml:
#     `VER=$(git rev-parse --short HEAD)`, `docker push ${repo}:${VER}` + `${repo}:latest`) push
#     ONE bare `<short-sha>` tag (7-12 hex, NO `sha-` prefix — different shape from strive's
#     `sha-<commit>`) plus `latest`, per engine merge.
#   - agentforge-platform (agentforge-platform/.gitea/workflows/images.yml: `docker push
#     "$IMAGE:${{ github.sha }}"` + `"$IMAGE:${{ steps.sha.outputs.short }}"`) pushes BOTH the
#     full 40-hex `github.sha` tag AND the 7-hex short-sha tag per build, and never pushes
#     `latest` at all.
# None of this was covered by any dedicated policy before this PR — it fell through to the `**`
# catch-all above, which deliberately keeps EVERY tag (that catch-all exists to protect the
# mirror/cache repos' digest-pinned base images, not to bound our own build repos) — so these four
# repos grew unbounded and eventually filled the store (blob-write failures while reads still 200;
# incident 2026-09-02). The agentforge/** policy below therefore carries TWO
# mostRecentlyPushedCount rules under one shared knob: one for the bare short-sha shape
# (`^[0-9a-f]{7,12}$`, covers all four repos) and one for the full 40-hex shape
# (`^[0-9a-f]{40}$`, matches only agentforge-platform's `github.sha` tag; harmless no-op pattern
# for the other three repos, which never push a 40-hex tag). Both tags of the same
# agentforge-platform build are pushed together in the same workflow run, so the two windows
# track the same set of builds — a single merged `{7,40}` pattern was considered and rejected: it
# would let BOTH tags of one build count as one push against a shared count, halving the
# platform's effective retention window to N/2 builds instead of N.
#
# Same reasoning as registry_zot_strive_keep_recent above (strive adds a time floor; this is
# count only): exactly like ailab pins, the deployed agentforge/agentforge-platform manifests pin these images by DIGEST, and
# Zot's GC removes untagged manifests — a GC'd build (short-sha OR full-sha tag) is
# un-rollback-able (only rebuildable from git, and re-pinning off a rebuild can surface
# newly-required config), so the window must comfortably outlive how far the deployed pin can lag
# main. 40 covers the current + previous pin per repo plus deep rollback headroom (agentforge
# merges far less often than strive's ~5-6 builds/day, so 40 is proportionally more headroom, not
# less). COUNT-based (mostRecentlyPushedCount), NOT a time window alone, for the non-determinism
# reason in registry_zot_strive_keep_recent's comment (a window as the sole rule drops the deployed
# pin in quiet periods and balloons under heavy CI).
registry_zot_agentforge_keep_recent: 40
# Keeps actively-PULLED tags alive past the pushed-count window: digest-pinned LIVE images
# whose tags age out of the count would otherwise be GC'd and break the next reschedule
# (the 2026-06-28 strive ImagePullBackOff shape). Residual: a live pin never re-pulled for
# 30+ builds can still age out - the durable fix is a protect-tag job like strive's,
# tracked as follow-up. The live config also carried a hand-applied ailab-<digest> protect
# keepTag missing from this template; reconciled in the same change.
registry_zot_agentforge_keep_pulled: 10
