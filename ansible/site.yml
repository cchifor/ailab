---
# Host-level configuration for the Proxmox nodes.
# Run order matters: base -> thunderbolt -> storage_net -> (QNAP runbook) -> mounts -> validate.
#
#   just net           # base + net  (tags: base,net)
#   just node-exporter # host node_exporter for the AI Lab Fleet dashboard (tags: monitoring)
#   just perf          # pin CPU governor to performance (tags: performance)
#   just ec-fan        # EC fan driver + CPU-fan curve, ai-node1/2 (tags: ec_fan)
#   just thinpool      # LVM thin-pool zeroing, OFF on node1/2 only (tags: thinpool)
#   just autostart     # start onboot LXCs whose NFS bind source was late at boot (tags: autostart)
#   just mounts        # NFS test mount (tags: mounts)  -- after QNAP export exists
#   just validate      # link/throughput checks (tags: validate)

- name: Configure Proxmox nodes — base, Thunderbolt/USB4, storage network
  hosts: pve_nodes
  become: true
  gather_facts: true
  roles:
    - role: pve_base
      tags: [base]

    # Host metrics for the "AI Lab Fleet" Grafana dashboard (scraped by monitoring/proxmox-node).
    - role: node_exporter
      tags: [monitoring]
      when: node_exporter_enabled | default(true)

    # Pin the CPU scaling governor to 'performance' (AI hosts; amd-pstate-epp) — persists on boot.
    - role: cpu_performance
      tags: [performance]
      when: cpu_performance_enabled | default(true)

    # Bosgame M5 EC fan control: the ec_su_axb35 driver (DKMS), a CPU-fan curve, fan/temperature metrics.
    # ON per host via pve_ec_fan_enabled (ai-node1/2; Secure Boot must be off). Deliberately not gated here:
    # switched off, the role still runs to hand the fans back to the firmware and remove its units.
    # `just ec-fan --limit ai-node1 --check --diff` (docs/runbooks/node-maintenance.md "EC fan curve").
    - role: pve_ec_fan
      tags: [ec_fan]

    - role: thunderbolt_net
      tags: [net, tb]
      when: storage_role == 'tb'

    - role: storage_net
      tags: [net]

    # WS2 (Thunderbolt CSI): host router+SNAT so Talos VMs reach the QNAP over the TB fabric.
    # OFF until storage_router_enabled=true (the deferred CSI cutover). `just router`.
    - role: storage_router
      tags: [net, router]
      when: storage_router_enabled | default(false)

    - role: qnap_mounts
      tags: [mounts]

    # Start onboot containers whose /mnt/pve NFS bind-mount source was not there yet when
    # pve-guests ran (the hosts and the QNAP share a power feed; 2026-10-30). `just autostart`.
    - role: pve_nfs_guest_autostart
      tags: [autostart]

    - role: validate_links
      tags: [validate]

# NOTE: the self-hosted GitHub Actions runner VMs are a SEPARATE host class (Ubuntu cloud VMs, not
# the Proxmox hosts) and are provisioned by their own playbook, ansible/runners.yml (`just runners`).
# Keeping them out of this site.yml means a full `just net` never tries to connect to runner VMs
# that may not exist yet.
