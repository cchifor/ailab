---
# Interactive dev-worker VMs (Ubuntu 24.04): Claude Code + Codex inside tmux, with the homelab
# claude-worker feature set. A dedicated playbook (NOT part of site.yml) so a full `just net` never
# touches these hosts — they're a different host class and must be created first
# (tofu -chdir=kubernetes/infra/dev-workers apply).
#   just dev-workers       # provision/refresh the dev workers
#   just ping-dev-workers  # connectivity check
# See docs/runbooks/dev-workers.md.
- name: Configure dev-worker VMs
  hosts: dev_workers
  become: true
  gather_facts: true
  pre_tasks:
    # Load the SOPS secrets whenever the (optional, gitignored-until-created) secrets file EXISTS —
    # not only when a toggled feature needs it: the OpenBao AppRole logins and the web gate's LAN
    # credential have no feature toggle of their own (and gating the load on the restic/cloudflared/
    # password/agentforge toggles once left the workers without forge credentials, when those still
    # came from here). File presence is the operator's signal; the two tasks stay safe on a fresh
    # clone where only the .example exists.
    - name: Check for the dev-worker secrets file (control node)
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/secrets/dev-worker.sops.yaml"
      delegate_to: localhost
      become: false
      run_once: true
      register: dev_worker_secrets_stat
      tags: [dev_workers, openbao, web-gate] # `openbao`/`web-gate`: same reason as the load task below

    - name: Load dev-worker secrets (SOPS)
      community.sops.load_vars:
        file: "{{ playbook_dir }}/secrets/dev-worker.sops.yaml"
      no_log: true
      # `openbao` too: the runbook's targeted rollout (`-t openbao`) needs the SOPS-held AppRole
      # credentials, and a tag-limited run skips any pre_task whose tags don't match — which would
      # leave dev_worker_openbao_credentials at {} and fail the role's assert instead of deploying.
      # `web-gate` likewise: the gate's LAN credential and cookie secret live in the SOPS file.
      tags: [dev_workers, openbao, web-gate]
      when:
        - dev_worker_enabled | default(false)
        - dev_worker_secrets_stat.stat.exists
  roles:
    # Local wall-clock time + NTP. Carries its own `time` tag so the clock can be set without a full
    # role re-run, which on a live box would touch docker, toolchains and the firewall and restart
    # agentforge under running tmux sessions.
    - role: host_time
      tags: [dev_workers, time]
      when: dev_worker_enabled | default(false)

    # chifor.me and .lan through the home gateway's resolver, so router.chifor.me and the other
    # lan_dns hosts reach the edge proxy's VIP, not Cloudflare (ADR 0040). Own tag: --tags edge_dns.
    - role: edge_lan_resolver
      tags: [dev_workers, edge_dns]
      when: dev_worker_enabled | default(false)

    # Fleet observability — the same node_exporter the hypervisors + runners emit (scraped at :9100).
    - role: node_exporter
      tags: [dev_workers, monitoring]
      when: dev_worker_enabled | default(false)

    - role: dev_worker
      tags: [dev_workers]
      when: dev_worker_enabled | default(false)

    # Event-driven LLM PR reviewer (plan: agentforge plans/2026-09-02-ai-pr-review-plan.md).
    # Enabled per-host in host_vars (dev-worker-2 = claude persona); own tag so the bot can be
    # (re)deployed without a full role run: --tags reviewbot.
    - role: pr_reviewer
      tags: [dev_workers, reviewbot]
      when: pr_reviewer_enabled | default(false)
