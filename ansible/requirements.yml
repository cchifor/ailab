# Install with: ansible-galaxy collection install -r requirements.yml -p collections
#
# Keep each comment on its OWN line, never after `name:`. Renovate's ansible-galaxy manager reads
# the rest of the `name:` line as the collection name, so a trailing comment became part of it
# ("community.general    # proxmox_* helpers ...") and every lookup failed with no-result.
collections:
  # proxmox_* helpers, modprobe, etc.
  - name: community.general
    version: ">=10.0.0"
  # mount, sysctl, firewalld
  - name: ansible.posix
    version: ">=1.5.0"
  # load_vars for the SOPS-encrypted GitHub App key (github_runner role)
  - name: community.sops
    version: ">=1.6.0"
