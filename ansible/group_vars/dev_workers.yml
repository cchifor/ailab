---
# Interactive dev-worker VMs (Claude Code + Codex). The dev_worker role is opt-in; this enables it
# for the dev_workers group. Feature toggles default OFF in the role — flip them here as needed.
# Secrets for the optional features live in ansible/secrets/dev-worker.sops.yaml (SOPS).
# Setup: see docs/runbooks/dev-workers.md.
dev_worker_enabled: true

# ---- optional features (each needs a secret in dev-worker.sops.yaml when enabled) ----
# dev_worker_enable_restic: true          # needs dev_worker_restic_password
# dev_worker_enable_cloudflared: true     # needs dev_worker_cf_tunnel_token
# dev_worker_enable_password_auth: true   # needs dev_worker_admin_password
# dev_worker_enable_agentforge: true      # needs ALL dev_worker_agentforge_* secrets (ADR 0018 go-live)
# ACTIVATED 2026-08-31 on all six workers (ADR 0020). Requires dev_worker_openbao_credentials in
# the local SOPS file — minted per the ceremony in docs/runbooks/openbao-dev-workers.md; a host
# missing its entry fails the role's assert rather than deploying a broken agent.
dev_worker_enable_openbao: true
# Codex through the estate's LLM router (router.chifor.me pointers dw-* -> smart pool pool-codex over the
# router's ChatGPT subscriptions), on all four workers since 2026-10-09. Needs this host's router key at
# af/dev-workers/<hostname> field llm_router_codex_key (seeded: devworker-seeds.sops.yaml). The host's
# own ChatGPT login stays as `codex -p chatgpt`. Runbook: dev-workers.md § "Codex through the router".
dev_worker_codex_router_enabled: true
# dev_worker_enable_herdr — PILOT, deliberately NOT flipped here: it is per-host in
# host_vars/dev-worker-4.yml so only that worker runs it (runbook § "herdr pilot").

# One Gitea identity per slot (plans/2026-10-11-worker-identities-plan.md): dev-worker-N-bot, created
# 2026-10-11, non-admin, in team `automation` only. A committed ENUMERATION, held to the live slot
# list by scripts/check-slot-enumerations.py: a retired slot's login leaves this list (the account is
# disabled, never deleted). No task reads it yet: the workers still authenticate as the shared
# dev-worker-bot until each slot's cut-over (plan Phase 4). pr_reviewer_merge_authors names the same
# logins (scripts/tests/test_reviewbot.py holds that). Whether the accounts and tokens exist LIVE is
# the enrolment readback (docs/runbooks/s2s-identity.md § Enrol a worker identity), not this list.
dev_worker_gitea_users:
  - dev-worker-1-bot
  - dev-worker-2-bot
  - dev-worker-3-bot
  - dev-worker-4-bot

# Web terminal gate (roles/dev_worker/tasks/web_gate.yml): each worker's Cloudflare Access app AUD tag,
# which dw-access-verify requires in the tunnel JWT. Not secret (every JWT carries it). Source of
# truth: `tofu -chdir=kubernetes/infra/cloudflare output dev_worker_access_aud`; the tag changes only
# if the Access app is recreated, and a stale value fails CLOSED (the tunnel path answers 403).
dev_worker_web_access_aud:
  dev-worker-1: "53a76def944b41c2004845841112bd1d8aee23f5a18374d129ab6146ef85cc11"
  dev-worker-2: "20e908a082e933407d729650cf7ff7f84b30b2a3f465deb4ba86fc71a05aef64"
  dev-worker-3: "3ae2c98475b46531413a6566f1810f82064dae062a8a56fa1b94630b429c4a36"
  dev-worker-4: "b20e820377d80090923ee32b3dfa4cbb051a5c852da3460840c7d9fc2bc4057a"
