---
# reviewer-2: the codex PR-review persona (moved off dev-worker-3 for isolation, 2026-09-02).
pr_reviewer_enabled: true
pr_reviewer_persona: codex
pr_reviewer_llm_kind: codex
pr_reviewer_llm_model: gpt-6-astra
pr_reviewer_llm_cmd:
  - "/usr/bin/codex"
pr_reviewer_llm_timeout_s: 600
pr_reviewer_llm_sudo_user: codexrun
# Ship journald to Loki (roles/journal_ship) — the reviewer failure REASON was
# previously visible only by SSHing to this host.
journal_ship_enabled: true
# ---- seat rotation (ADR 0024, plans/2026-09-16-codex-seat-rotation-plan.md) ----
# FOUR seats, one per distinct ChatGPT account, each verified by tokens.account_id at the time
# it was added — cfdea639… (seat a, shared with the six dev agents), 9c8a8cfb… (seat b),
# 11c52fea… (seat c) and 841dae14… (seat d, 2026-09-19). All four were provisioned with
# `codex login --device-auth`, which is the headless flow and is absent from `codex login --help`
# at 0.153.4.
# Distinctness is not a convention here, it is enforced: resolve_seats() reads each seat's
# account_id at startup and COLLAPSES duplicates, because rotating inside one account is the
# doomed-retry loop the park exists to prevent. A fourth seat sharing an existing account would
# reduce reviewbot_llm_seats_distinct and fire ReviewbotSeatsDegraded rather than pretend the
# capacity exists.
#
# Sticky, in this order: seat `a` carries the load until it refuses, then `b`. That is deliberate
# and not round-robin — spreading evenly drives both accounts to their walls at the same time and
# turns two staggered recoveries into one synchronised outage.
#
# pr_reviewer_llm_sudo_user stays set below: it is what the dormant OpenBao import still gates on,
# and the systemd NoNewPrivileges condition covers both variables.
pr_reviewer_llm_seats:
  - { name: a, sudo_user: codexrun }
  - { name: b, sudo_user: codexrun2 }
  - { name: c, sudo_user: codexrun3 }
  # Seat d (realjaynesage@gmail.com, ADR 0026): staged on 2026-09-19, activated once its device-auth
  # login was installed as codexrun4 -- the hourly usage probe now renews its token, which is what
  # keeps the LiteLLM chatgpt/ projection fresh. Last in the sticky order, so reviews reach it only
  # when a, b and c are all spent.
  - { name: d, sudo_user: codexrun4 }
pr_reviewer_llm_seats_staged: []
# The usage watchdog, hourly, as on reviewer-1: reviewbot runs codex-usage.py AS each seat, which
# asks the CLI's own app server (`codex app-server`, account/rateLimits/read - no model call, no
# quota) for the account's windows, parks and unparks seats from the API's percent/resets_at,
# and exports per-account usage with the email from the seat's token claims. 2026-09-19: the
# three seats read 97 %, 72 % and 100 % (rate_limit_reached) of their weekly windows, invisible
# until now.
pr_reviewer_usage_poll_s: 3600

# The reviewer remains the sole OAuth refresher; its consumers receive access tokens only. One
# projection per seat that feeds something (ansible/roles/dsh_codex_publisher/files/publish.py):
#   seat b -> af/dsh/credentials DSH_CODEX_*   dsh's native openai-codex provider
#   seat d -> af/litellm/chatgpt CHATGPT_*     LiteLLM's chatgpt/ provider, via ESO (ADR 0026)
# Both projections are REQUIRED: an absent auth file on either is a failure the alerts see.
dsh_codex_publisher:
  address: https://openbao.lan.chifor.me:30820
  textfile: /var/lib/prometheus/node-exporter/dsh-codex-publisher.prom
  projections:
    - auth_path: /home/codexrun2/.codex/auth.json
      email: realjaysage@gmail.com
      kv_path: dsh/credentials
      prefix: DSH_CODEX
    - auth_path: /home/codexrun4/.codex/auth.json
      email: realjaynesage@gmail.com
      kv_path: litellm/chatgpt
      prefix: CHATGPT
