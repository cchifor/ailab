---
# reviewer-2: the codex PR-review persona (moved off dev-worker-3 for isolation, 2026-09-02).
pr_reviewer_enabled: true
pr_reviewer_persona: codex
pr_reviewer_llm_kind: codex
pr_reviewer_llm_model: gpt-6-astra
pr_reviewer_llm_cmd:
  - "/usr/bin/codex"
pr_reviewer_llm_timeout_s: 600
pr_reviewer_llm_sudo_user: ""
# Ship journald to Loki (roles/journal_ship) — the reviewer failure REASON was
# previously visible only by SSHing to this host.
journal_ship_enabled: true
# ---- ROUTER ONLY since 2026-10-26 (owner request; dev-workers.md § "Router seats") ----
# The persona reviews through llm-router alone: seat `r`, key key_4fdbe2b833fe (routes
# [codex-reviewer], default route codex-reviewer, a pointer to the Codex smart pool `pool-codex`).
# The seat sends the tier name (`gpt-6-astra`, no `models` map), which the key routes in model mode
# through its default route; naming the route itself would get 400 MODEL_REQUIRED (the pool's
# targets are any-model). Runbook llm-router.md § "Reviewer routes (2026-10-13)".
#
# RETIRED: the subscription-seat rotation (ADR 0024, seats a-d = codexrun..codexrun4, sticky, with
# an hourly usage watchdog). The router balances the same accounts and more, and a router outage
# now pauses the persona losslessly (queue intact, ReviewbotStalled after 1 h) instead of falling
# back. With no seat run as another user, sudoers is removed and reviewbot.service runs with
# NoNewPrivileges. Seat d's user (codexrun4) is NOT retired: it is the LiteLLM chatgpt/ login, now
# owned and renewed by the dsh_codex_publisher role below. Rollback: restore the seat list from git
# (the a-c logins are gone with their users, so each would need a new `codex login --device-auth`).
pr_reviewer_llm_seats:
  - { name: r, sudo_user: "", router_url: "https://router.chifor.me",
      key_file: "{{ pr_reviewer_router_key_file }}" }
pr_reviewer_retired_seat_users: [codexrun, codexrun2, codexrun3]
# No subscription seat left to read, so no usage watchdog.
pr_reviewer_usage_poll_s: 0

# The seat login is the sole OAuth refresher; its consumers receive access tokens only. One
# projection per seat that feeds something (ansible/roles/dsh_codex_publisher/files/publish.py):
#   seat d (codexrun4) -> af/litellm/chatgpt CHATGPT_*   LiteLLM's chatgpt/ provider, via ESO (ADR 0026)
# It is REQUIRED: an absent auth file is a failure the alerts see. `seat_user` makes the role own the
# user and run codex-seat-renew@codexrun4.timer, which renews the token once it expires (the
# reviewer used to, by running as the seat; it no longer does).
# RETIRED 2026-10-26: seat b -> af/dsh/credentials DSH_CODEX_*. Its reader, dsh's native
# openai-codex provider, went with ADR 0039 (2026-10-19); the `retired` entry removes the four
# fields from the document once, so no live token sits where dsh's agent can read it.
dsh_codex_publisher:
  address: https://openbao.lan.chifor.me:30820
  textfile: /var/lib/prometheus/node-exporter/dsh-codex-publisher.prom
  projections:
    - auth_path: /home/codexrun4/.codex/auth.json
      email: realjaynesage@gmail.com
      kv_path: litellm/chatgpt
      prefix: CHATGPT
      seat_user: codexrun4
  retired:
    - kv_path: dsh/credentials
      prefix: DSH_CODEX
