---
# reviewer-1: the claude PR-review persona (moved off dev-worker-2 for isolation, 2026-09-02).
pr_reviewer_enabled: true
pr_reviewer_persona: claude
pr_reviewer_llm_cmd:
  - "/usr/bin/claude"
# Opus primary, sonnet fallback on primary errors — makes claude reviews model-pinned like
# the codex persona (operator-directed 2026-09-02). Both pins are MEASURED, not chosen: see
# the probe paragraph at the bottom of this comment.
#
# THE SUBSCRIPTION BEHIND THESE PINS IS NOT IN GIT, AND CANNOT BE. The claude CLI authenticates
# from `~/.claude/.credentials.json`, written by an interactive browser OAuth flow that no Ansible
# task can perform. Ansible therefore configures WHICH models to ask for and never WHICH ACCOUNT
# is asking — so a green `ansible-playbook reviewers.yml` proves nothing about whether this host
# can actually talk to Anthropic.
#
#   which account?   `ssh c4@192.168.0.24 /usr/bin/claude auth status` (prints email + plan).
#                    The ADDRESS is deliberately not recorded here, and the distinction is worth
#                    stating because this line commits a host and a username to the same place:
#                    this repo mirrors to a PUBLIC GitHub repo (also Flux's source), and the
#                    RFC1918 address plus the `c4` login are already published throughout it —
#                    `inventory/hosts.yml`, `docs/network-plan.md` (the IPAM registry), CLAUDE.md,
#                    `kubernetes/infra/reviewers/variables.tf` — and neither is a credential; the
#                    LAN is not reachable from the mirror. A personal account address is different
#                    in kind: it is an identity that appears nowhere else in the tree, and writing
#                    it here would be the act that publishes it. Ask the host, not the file.
#   re-login         `claude auth login --claudeai` ON THIS HOST. It prompts for a pasted code, so
#                    stdin must stay open — `mkfifo`, hold the write end from a detached process,
#                    run the login reading from the fifo, then write the code into it. Redirecting
#                    from /dev/null EOFs the prompt instantly and the login fails.
#   NEVER            copy `.credentials.json` from another host. Copies share one refresh-token
#                    family and OAuth rotation invalidates every copy except whichever host
#                    refreshed last — that is the 2026-09-10 outage that took BOTH personas down,
#                    and it does not self-heal or surface until the access token expires days later.
#
# After any account change, probe THE TWO PINS BELOW explicitly — `claude --model <primary> -p ...`
# and `--model <fallback>` — never a bare `claude -p`. Per-account model availability is not
# uniform: on 2026-09-12 a bare probe answered fine while the pinned Fable-5 had no credits on that
# account, and every review silently burned a doomed primary call before the fallback rescued it
# (308 of 308). The account was swapped 2026-09-13 for exactly that reason, and its Fable-5 quota
# went the same way on 2026-09-14 20:49 — 353 of 353 reviews ran on the fallback, with
# ReviewbotPrimaryModelDown firing throughout. Fable's limit is its own credit pool, separate from
# the Max plan's usage windows, and on the evidence here it does not come back on its own: two
# different accounts have now exhausted it (the second within ~36 h of the swap) and neither
# recovered. Treat a Fable primary as a doomed call per review until someone buys credits and
# re-probes, not as a transient to wait out. Repointed 2026-09-15 to the two
# models measured answering on this host that morning (`-p 'reply with exactly: OK'`):
#     claude-fable-5  →  "You've reached your Fable 5 limit"   (refused)
#     opus            →  OK
#     sonnet          →  OK
#
# WHAT THE FALLBACK IS AND IS NOT (reviewer-claude, round 1 of ailab#728). It is NOT quota
# insurance. opus and sonnet both draw on the Max plan's shared usage windows, so an
# account-scoped limit takes the two of them together — and _run_llm() would not reach the
# fallback in that case anyway: RATE_LIMIT_RE parks the whole persona before it, deliberately
# (see the MODEL_LIMIT_RE comment in reviewbot.py). What the fallback covers is the
# MODEL-scoped class, which is the one that just cost 353 doomed calls: a pin whose own credit
# pool is spent, like Fable, or a model this account cannot serve at all. That class is real
# and recurring here, so the two pins must stay DIFFERENT models — a fallback equal to the
# primary makes the rescue path a second identical refusal.
#
# Both are the FLOATING aliases on purpose, not version IDs (reviewer-claude, same round): this
# host wants always-latest, the previous configuration made the same choice for its `opus`
# fallback, and an alias cannot go stale the way a version ID left in a file for months does.
# "Model-pinned" at the top of this comment means the request NAMES a model instead of taking
# the account default — it does not claim a frozen version, and the effective model behind
# each alias may move without a change here.
pr_reviewer_llm_model: opus
pr_reviewer_llm_fallback_model: sonnet
# Ship journald to Loki (roles/journal_ship) — the reviewer failure REASON was
# previously visible only by SSHing to this host.
journal_ship_enabled: true
