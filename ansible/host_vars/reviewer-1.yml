---
# reviewer-1: the claude PR-review persona (moved off dev-worker-2 for isolation, 2026-09-02).
pr_reviewer_enabled: true
pr_reviewer_persona: claude
# The CLI command is used only by a subscription seat; this host has none (below), so it is inert.
pr_reviewer_llm_cmd:
  - "/usr/local/lib/reviewbot/claude-seat.sh"
# ---- ROUTER ONLY since 2026-10-26 (owner request; dev-workers.md § "Router seats") ----
# The persona reviews through llm-router alone: seat `r`, API key key_f856495c9b0c on
# router.chifor.me (it may use every route; expires 2027-01-05 - renew it before then, or the
# persona stops). The seat asks the Claude smart pool for the TIER'S model: `route: pool-claude`
# goes out as the X-Router-Route header and `models` puts fable / opus in the body - the router's
# model mode, in which the pool's `*` targets serve the model a request names and the pool picks
# the account with the most headroom. Reviews run on Fable or Opus only, never `sonnet` or lower
# (owner, 2026-10-26). A 429 on one tier parks that tier and the same review asks opus next; with
# both parked the job waits, lossless (queue intact, ReviewbotStalled after 1 h).
# RETIRED 2026-10-26: subscription seats a-c (clauderun..clauderun3, ADR 0025: one Claude Max
# browser login per OS user, sticky rotation, hourly usage watchdog). All three had been logged
# out by the CLI since 2026-10-04/16, so the router had been the only path in practice; the users
# and their homes are removed and, with no seat run as another user, sudoers goes and
# reviewbot.service runs with NoNewPrivileges. Rollback: restore the seat list from git and log
# each seat in again (runbook § "Seats on reviewer-1", kept as history).
# REPLACED 2026-10-13..26: every tier asked the route `claude-reviewer` (claude-5 on `opus`,
# falling back to `pool-claude`). That fallback died silently once pool-claude's targets became
# `*`: a request naming a route carries no model for a `*` target (`model_unspecified`), and the
# day claude-5 hit its weekly wall (2026-10-26 04:56Z) every review was refused with attempts 0.
# Runbook llm-router.md § "Reviewer routes".
pr_reviewer_llm_seats:
  - { name: r, sudo_user: "", router_url: "https://router.chifor.me",
      key_file: "{{ pr_reviewer_router_key_file }}", route: pool-claude,
      models: { fable: fable, opus: opus } }
pr_reviewer_retired_seat_users: [clauderun, clauderun2, clauderun3]
# ---- model ladder ----
# fable first, then opus - tier-major. NO SONNET RUNG (owner, 2026-10-26). Floating aliases on
# purpose: the router maps them to the latest Fable / Opus, and an alias cannot go stale the way a
# version ID left in a file does. `fable` is asked again the moment its park lapses (active_choice
# is tier-major), so no watchdog is needed to climb back - and with no subscription seat there is
# nothing for one to read.
pr_reviewer_llm_models: [fable, opus]
pr_reviewer_usage_poll_s: 0
# The pin pair is what reviewbot_llm_primary_model_info reports; the ladder above is authoritative
# and these are its two rungs.
pr_reviewer_llm_model: fable
pr_reviewer_llm_fallback_model: opus
# Ship journald to Loki (roles/journal_ship) — the reviewer failure REASON was
# previously visible only by SSHing to this host.
journal_ship_enabled: true
