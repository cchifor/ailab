---
# dev-worker-3 hosts the codex PR-review persona (plan Phase 3 rollout, 2026-09-02):
# COMMENT-only like the claude persona on dev-worker-2. The codex CLI is already installed
# and ChatGPT-authed for the agent user; reviews run through its own subscription, so they
# never touch the Claude concurrency budget. Longer timeout: codex reviews at this model
# routinely take several minutes.
pr_reviewer_enabled: true
pr_reviewer_persona: codex
pr_reviewer_llm_kind: codex
pr_reviewer_llm_model: gpt-5.6-sol
pr_reviewer_llm_cmd:
  - "/home/c4/.npm-global/bin/codex"
pr_reviewer_llm_timeout_s: 600
