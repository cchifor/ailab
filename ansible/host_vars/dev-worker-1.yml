---
# dev-worker-1 — vmid 4201 on ai-node1, ballooned between a 12 GiB floor and a 16 GiB ceiling
# (kubernetes/infra/dev-workers/variables.tf).
#
# Raises the tmux slice cap from the role's 6G (sized for a 12 GiB worker whose tmux steady state was
# ~200 MB). On 2026-10-03 one orchestrating Claude Code session drove several builders in parallel
# from a single pane. Their pytest integration runs, vitest workers and headless Chrome all count
# against this slice, which hit 6G 30 times that day (memory.events oom_kill). A memcg OOM kills the
# largest SINGLE task. Once the ~200 MB node workers were each smaller, that task was `claude` itself
# (~700 MB), so the orchestrator died at 22:32. OOMPolicy=continue kept the pane alive, but not the
# agent.
#
# 9G still leaves ~3 GiB for the containers, dockerd and the system at the 12 GiB balloon floor, and
# ~7 GiB at the ceiling. The cap stays a real ceiling: a single runaway still dies inside the slice
# before global pressure picks a victim elsewhere. Raising it buys headroom. It does not stop the
# agent from being the largest task when the slice does fill.
dev_worker_tmux_memory_max: "9G"

# A second 8 GiB swapfile (2026-10-26). DevWorkerThrashing pended here with the 4 GiB base file full
# (3.9 of 4.0 GiB) and ~389 swap-ins/s, from processes OUTSIDE the tmux slice: an acceptance stack's
# redis (2.6 GiB, no maxmemory, default snapshots - each BGSAVE fork briefly doubles it) plus vitest
# runs. More RAM is not on offer: ai-node1 hosts cp1, three runners, two dev-workers and an agent node
# (~152 GB committed on 124 GB). Root has 32 GB free. Disk-backed, swappiness 10: a cushion for those
# bursts, not a fix for the redis - capping that is the acceptance stack owner's call.
dev_worker_extra_swapfiles:
  - { path: /swapfile2, size: "8G" }

# Per-slot Gitea identity (plan 2026-10-11 worker identities, Phase 4 canary, 2026-10-11): this slot
# authenticates as its own `dev-worker-1-bot` with the tokens in af/dev-workers/dev-worker-1, not the
# shared dev-worker-bot. Rollback = set false and converge (docs/runbooks/openbao-dev-workers.md,
# "Gitea identity cut-over (per slot)").
dev_worker_gitea_identity_cutover: true

# Relay connector (ansible/relay-connectors.yml; docs/runbooks/relay-connectors.md). Adopts this
# slot's existing approved account-scope identity; never enrolls. The values below are the identity's
# nonsecret settings and must match it exactly.
# Migrated 2026-10-14 from the v0.1.0 pane-scoped `relay-connector.service` (unit file removed) with
# `service install --state` on its existing identity, so the state keeps its original path.
relay_connector_enabled: true
relay_connector_manage_service: true
relay_connector_user: c4
relay_connector_arch: amd64
relay_connector_host_id: b3b1be1a-275c-4a2e-b515-428b39c43171
relay_connector_state_file: /home/c4/.config/relay-connector/connector.json
relay_connector_name: dev-worker-1
relay_connector_sockets: ['']
