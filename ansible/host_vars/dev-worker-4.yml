# dev-worker-4 — vmid 4205, the VM that was dev-worker-5 until the 2026-09-23 re-slot — is the herdr
# pilot host, the only one. The toggle defaults off in the role, so enabling it here leaves the
# other three workers untouched. What/why/rollback:
# docs/runbooks/dev-workers.md § "herdr pilot".
dev_worker_enable_herdr: true

# Per-slot Gitea identity (plan 2026-10-11 worker identities, Phase 4, 2026-10-11): this slot
# authenticates as its own `dev-worker-4-bot` with the tokens in af/dev-workers/dev-worker-4, not the shared
# dev-worker-bot. Rollback = set false and converge (docs/runbooks/openbao-dev-workers.md,
# "Gitea identity cut-over (per slot)").
dev_worker_gitea_identity_cutover: true
