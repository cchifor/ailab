---
# Thin-pool zeroing OFF (owner-approved 2026-11-17, NVMe wear): this host's drive was at
# 85% of its rated write life. The zero-fill of reused 64 KiB chunks was ~0.7 TB/day across
# all three drives, ~0.5-0.6 of it on node1/2. Only our own workloads run here (no relay-worker
# pool), so the isolation trade-off in roles/pve_base/defaults/main.yml is accepted. node3 keeps
# zeroing ON. Rollout and verification: docs/runbooks/node-maintenance.md "Thin-pool zeroing".
pve_thin_pool_zero: false

# Nightly trim of the running containers' local-lvm volumes (role pve_base, tag lxc_fstrim;
# docs/runbooks/node-maintenance.md "LXC volume trim (nightly)"): the LLM container 5002's rootfs and
# /models-local (62 GiB freed but untrimmed on 2026-11-20). The hosts take turns, 20 min each: this host
# 04:30, ai-node3 04:50, ai-node1 05:10.
pve_lxc_fstrim_enabled: true
pve_lxc_fstrim_start: "04:30"

# EC fan driver + CPU-fan curve (role pve_ec_fan; docs/runbooks/node-maintenance.md "EC fan curve"), the
# same curve as ai-node1 (the role defaults). Secure Boot disabled here 2026-11-19 (mokutil: disabled,
# lockdown [none]), which the unsigned ec_su_axb35 module needs.
pve_ec_fan_enabled: true
