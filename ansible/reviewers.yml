# Dedicated PR-reviewer VMs (reviewer-1 = claude persona, reviewer-2 = codex persona).
# Deliberately minimal compared to dev-workers: no docker, no tmux dashboard, no toolchains -
# just node (for the LLM CLIs), node_exporter, ufw, and the pr_reviewer role. LLM CLI auth
# (~/.claude, ~/.codex) is seeded ONCE from the previous reviewer hosts (subscription OAuth;
# see docs/runbooks/dev-workers.md § reviewers) and is NOT ansible-managed.
#   ansible-playbook reviewers.yml           # provision/refresh both
- name: Configure PR-reviewer VMs
  hosts: reviewers
  become: true
  gather_facts: true
  vars:
    reviewer_lan_cidr: "{{ lan_cidr | default('192.168.0.0/24') }}"
    reviewer_node_major: 20
    # Codex CLI floor (bump deliberately). gpt-6-astra needs >= 0.153.0 (measured 2026-09-05:
    # 0.152.1 rejected, 0.153.0 accepted) — an older CLI is rejected upstream with
    # `400 ... requires a newer version of Codex`. Older installs are upgraded to exactly this;
    # newer ones are left alone. reviewbot spawns /usr/bin/codex per job, so no restart.
    reviewer_codex_version: "0.153.4"
  pre_tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Base packages
      ansible.builtin.apt:
        name: [git, curl, ca-certificates, python3, rsync, ufw]
        state: present
        update_cache: true

    - name: Add NodeSource apt signing key
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /etc/apt/keyrings/nodesource.asc
        mode: "0644"

    - name: Add NodeSource apt repository
      ansible.builtin.deb822_repository:
        name: nodesource
        types: [deb]
        uris: "https://deb.nodesource.com/node_{{ reviewer_node_major }}.x"
        suites: [nodistro]
        components: [main]
        architectures: [amd64]
        signed_by: /etc/apt/keyrings/nodesource.asc
        enabled: true

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

    # Global install rather than the agent user's npm prefix: the isolated codexrun user
    # cannot traverse c4's 0750 home, and binaries carry no secrets - auth stays per-user
    # in each HOME. NodeSource npm's global prefix is /usr, so the bins land in /usr/bin.
    - name: Install the LLM CLIs (global, per-binary guards)
      ansible.builtin.command: "npm install -g {{ item.pkg }}"
      args:
        creates: "/usr/bin/{{ item.bin }}"
      loop:
        - { pkg: "@anthropic-ai/claude-code", bin: claude }
        - { pkg: "@openai/codex", bin: codex }

    # The `creates` guard above installs once and never upgrades; codex does not self-update.
    # Tagged `reviewbot` so the documented rollout (`ansible-playbook reviewers.yml -t reviewbot`)
    # carries the floor too — an untagged pre_task is skipped by a tag-limited run.
    - name: Probe the installed Codex CLI
      ansible.builtin.command: /usr/bin/codex --version
      register: reviewer_codex_probe
      changed_when: false
      failed_when: false
      check_mode: false # probe only — must run under --check so the version test has data
      tags: [reviewbot, codex]

    - name: Upgrade the Codex CLI (below the pinned version)
      ansible.builtin.command: "npm install -g @openai/codex@{{ reviewer_codex_version }}"
      when: >-
        reviewer_codex_probe.rc != 0
        or (reviewer_codex_probe.stdout | regex_search('(?<=codex-cli )[0-9]+[.][0-9]+[.][0-9]+') | default('0', true))
           is version(reviewer_codex_version, '<')
      changed_when: true
      tags: [reviewbot, codex]

    # Allow rules BEFORE enable, so the ansible SSH connection can never be locked out.
    - name: Allow LAN inbound on reviewer service ports
      community.general.ufw:
        rule: allow
        from_ip: "{{ reviewer_lan_cidr }}"
        to_port: "{{ item.port }}"
        proto: tcp
        comment: "{{ item.comment }}"
      loop:
        - { port: "22", comment: "SSH from LAN" }
        - { port: "9100", comment: "node_exporter scrape from LAN" }
        - { port: "8477", comment: "reviewbot webhook from LAN" }

    - name: Default deny incoming
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Default allow outgoing
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Enable ufw
      community.general.ufw:
        state: enabled

  roles:
    - role: node_exporter
    - role: pr_reviewer
      tags: [reviewbot]
