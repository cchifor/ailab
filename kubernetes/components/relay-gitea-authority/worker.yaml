apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-gitea-reconciler
  namespace: relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: relay-gitea-reconciler
  template:
    metadata:
      labels:
        app: relay-gitea-reconciler
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - key: dedicated
        operator: Equal
        value: agent
        effect: NoSchedule
      initContainers:
      - name: gitea-files
        image: docker.io/library/node:22.23.4-bookworm-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da
        command:
        - node
        - /setup/materialize.mjs
        securityContext: &id001
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: '1'
            memory: 128Mi
        volumeMounts:
        - name: gitea-setup
          mountPath: /setup
          readOnly: true
        - name: gitea-input
          mountPath: /input
          readOnly: true
        - name: gitea-files
          mountPath: /output
      containers:
      - name: reconciler
        image: registry.invalid/relay-gitea-reconciler:release-required
        workingDir: /app
        command:
        - node
        - dist/scripts/reconcile-environment-gitea.js
        securityContext: *id001
        env:
        - name: RELAY_GITEA_ISSUERS_FILE
          value: /run/relay-gitea/private/deployments.json
        - name: NODE_ENV
          value: production
        - name: RELAY_AGENT_CONTROL_PLANE
          value: '1'
        - name: RELAY_ENVIRONMENTS
          value: '1'
        - name: RELAY_RECOVERY_GENERATION_FILE
          value: /run/relay-restore/generation.json
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: relay-secrets
              key: DATABASE_URL
        - name: APP_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: relay-secrets
              key: APP_DATABASE_URL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: gitea-files
          mountPath: /run/relay-gitea
          readOnly: true
        - name: restore-generation
          mountPath: /run/relay-restore/generation.json
          subPath: generation.json
          readOnly: true
      volumes:
      - name: gitea-setup
        configMap:
          name: relay-gitea-setup
      - name: gitea-input
        secret:
          secretName: relay-gitea-issuers
          defaultMode: 288
      - name: gitea-files
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: restore-generation
        configMap:
          name: relay-recovery-generation
          defaultMode: 292
          items:
          - key: generation.json
            path: generation.json
