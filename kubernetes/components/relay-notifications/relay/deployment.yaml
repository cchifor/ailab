apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: relay
spec:
  template:
    spec:
      initContainers:
      - name: notification-files
        image: docker.io/library/node:22.23.3-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
        command: [node, /setup/materialize.mjs]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: '1', memory: 128Mi}
        volumeMounts:
        - {name: notification-setup, mountPath: /setup, readOnly: true}
        - {name: notification-input, mountPath: /input, readOnly: true}
        - {name: notification-files, mountPath: /output}
      containers:
      - name: relay
        env:
        - name: RELAY_NOTIFICATION_DESTINATIONS_FILE
          value: /run/relay-notifications/private/destinations.json
        volumeMounts:
        - name: notification-files
          mountPath: /run/relay-notifications
          readOnly: true
      volumes:
      - name: notification-setup
        configMap:
          name: relay-notification-setup
      - name: notification-input
        secret:
          secretName: relay-notifications
          defaultMode: 0440
          items:
          - {key: tenant-id, path: tenant-id}
          - {key: publisher-token, path: publisher-token}
      - name: notification-files
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
