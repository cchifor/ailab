rule_files:
  - relay-recovery-rules.yaml
evaluation_interval: 1m
tests:
- name: omitting verification_available fails the schema gate
  interval: 1m
  input_series:
  - series: up{job="relay-control-plane",instance="relay:80"}
    values: 1+0x8
  - series: relay_control_restore_verified_timestamp_seconds{job="relay-control-plane",instance="relay:80"}
    values: 1+0x8
  - series: relay_control_restore_backup_timestamp_seconds{job="relay-control-plane",instance="relay:80"}
    values: 1+0x8
  - series: relay_control_restore_schema_version{job="relay-control-plane",instance="relay:80"}
    values: 1+0x8
  alert_rule_test:
  - eval_time: 6m
    alertname: RelayRestoreMetricSchemaIncomplete
    exp_alerts:
    - exp_labels:
        job: relay-control-plane
        instance: relay:80
        severity: critical
        service: relay
      exp_annotations:
        summary: Relay restore verification metrics are incomplete
        description: A successful scrape lacks required restore evidence metrics. Check the matching Relay release
          and collector configuration; backup job success cannot replace these observations.
- name: omitting verified_timestamp_seconds fails the schema gate
  interval: 1m
  input_series:
  - series: up{job="relay-control-plane",instance="relay:80"}
    values: 1+0x8
  - series: relay_control_restore_verification_available{job="relay-control-plane",instance="relay:80"}
    values: 1+0x8
  - series: relay_control_restore_backup_timestamp_seconds{job="relay-control-plane",instance="relay:80"}
    values: 1+0x8
  - series: relay_control_restore_schema_version{job="relay-control-plane",instance="relay:80"}
