- name: unavailable evidence does not fabricate age observations
  interval: 1m
  input_series:
  - series: relay_control_restore_verification_available{job="relay-control-plane",instance="relay:80"}
    values: 0+0x10100
  - series: relay_control_restore_verified_timestamp_seconds{job="relay-control-plane",instance="relay:80"}
    values: 0+0x10100
  - series: relay_control_restore_backup_timestamp_seconds{job="relay-control-plane",instance="relay:80"}
    values: 0+0x10100
  alert_rule_test:
  - eval_time: 168h6m
    alertname: RelayRestoreVerificationStale
    exp_alerts: []
- name: duplicate metric series cannot mask a missing name
  interval: 1m
  input_series:
  - series: up{job="relay-control-plane",instance="relay:80"}
    values: 1+0x8
  - series: relay_control_restore_verification_available{job="relay-control-plane",instance="relay:80"}
    values: 1+0x8
  - series: relay_control_restore_verified_timestamp_seconds{job="relay-control-plane",instance="relay:80"}
    values: 1+0x8
  - series: relay_control_restore_backup_timestamp_seconds{job="relay-control-plane",instance="relay:80"}
    values: 1+0x8
  - series: relay_control_restore_verification_available{job="relay-control-plane",instance="relay:80",extra="duplicate"}
    values: 1+0x8
  alert_rule_test:
  - eval_time: 6m
    alertname: RelayRestoreMetricSchemaIncomplete
    exp_alerts:
    - exp_labels:
        job: relay-control-plane
        instance: relay:80
