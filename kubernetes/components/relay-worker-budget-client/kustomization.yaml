apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Relay's client files for the independent worker budget ledger
# (docs/runbooks/relay-worker-budget-authority.md, "Consumer wiring"). Mounts the three keys of the
# ESO-rendered Secret relay/relay-worker-budget (kubernetes/apps/relay-budget-authority/credentials/)
# as read-only subPath files and names them in RELAY_WORKER_BUDGET_{DSN,CA,WITNESS}_FILE. Nothing else.
#
# INCLUDED by kubernetes/apps/apps/relay since hub upgrade step H4a
# (docs/runbooks/relay-researcher-hub-upgrade.md), alone. Including it enables nothing by itself:
#   * the hub (Relay v0.10.4) reads these variables, but starts the budget authority only with
#     RELAY_INFRASTRUCTURE_INSTALLATIONS, a router connection (RELAY_ROUTER_CONNECTIONS_FILE, step H6)
#     and a profile source: the candidate or ordinary-canary file, or the pinned worker-profile
#     registry, which needs the genuine release approval and so comes last, each its own reviewed
#     change. Budget startup stays start_failed until step H7's candidate file;
#   * and even then every allocation is refused until the operator sets
#     worker_budget.authority.ready=true in the ledger (runbook step 8).
# Including or removing it is a Recreate rollout of Relay (with its pre-migration backup).
patches:
- path: deployment.yaml
