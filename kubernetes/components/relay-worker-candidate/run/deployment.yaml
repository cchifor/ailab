# PLACEHOLDER: no candidate run yet. scripts/relay-candidate-run.py generate replaces the three files of
# this directory for each signed run (docs/runbooks/relay-candidate-run-generator.md);
# scripts/tests/test_relay_candidate_run.py refuses including the component while they are.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: relay
spec:
  template:
    spec:
      containers:
      - name: relay
        env:
        - name: RELAY_WORKER_CANDIDATE_SHA256
          value: OPERATOR-FILLS-sha256-of-run-document-json
      volumes:
      - name: worker-candidate-document
        configMap:
          name: relay-worker-candidate-unsigned
      - name: worker-candidate-key-source
        secret:
          secretName: relay-worker-candidate-key-unsigned
