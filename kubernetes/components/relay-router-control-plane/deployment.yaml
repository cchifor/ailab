apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: relay
spec:
  template:
    spec:
      initContainers:
      - name: router-files
        image: docker.io/library/node:22.23.3-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
        command: [node, /setup/materialize.mjs]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: '1', memory: 128Mi}
        volumeMounts:
        - {name: router-setup, mountPath: /setup, readOnly: true}
        - {name: router-input, mountPath: /input, readOnly: true}
        - {name: router-files, mountPath: /output}
      containers:
      - name: relay
        env:
        - name: RELAY_AGENT_CONTROL_PLANE
          value: '1'
        - name: RELAY_ROUTER_CONNECTIONS_FILE
          value: /run/relay-router/private/connections.json
        volumeMounts:
        - {name: router-files, mountPath: /run/relay-router, readOnly: true}
      volumes:
      - name: router-setup
        configMap:
          name: relay-router-setup
      - name: router-input
        secret:
          secretName: relay-router-connection
          defaultMode: 0440
          items:
          - {key: metadata.json, path: metadata.json}
          - {key: admin-key.pem, path: admin-key.pem}
          - {key: reconciler-key.pem, path: reconciler-key.pem}
          - {key: bao-token, path: bao-token}
      - name: router-files
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
