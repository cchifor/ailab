apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-control-metrics
  namespace: relay
spec:
  podSelector:
    matchLabels:
      app: relay
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          app.kubernetes.io/instance: kube-prometheus-stack-prometheus
    ports:
    - {protocol: TCP, port: 8788}
