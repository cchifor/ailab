apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: relay
spec:
  template:
    spec:
      initContainers:
      - name: metrics-files
        image: docker.io/library/node:22.23.3-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
        command: [node, /setup/materialize.mjs]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: '1', memory: 128Mi}
        volumeMounts:
        - {name: metrics-setup, mountPath: /setup, readOnly: true}
        - {name: metrics-input, mountPath: /input, readOnly: true}
        - {name: metrics-files, mountPath: /output}
      containers:
      - name: relay
        env:
        - name: RELAY_CONTROL_METRICS_FILE
          value: /run/relay-metrics/private/config.json
        volumeMounts:
        - name: metrics-files
          mountPath: /run/relay-metrics
          readOnly: true
      volumes:
      - name: metrics-setup
        configMap:
          name: relay-metrics-setup
      - name: metrics-input
        secret:
          secretName: relay-control-metrics
          defaultMode: 0440
          items:
          - {key: tenant-id, path: tenant-id}
          - {key: token-sha256, path: token-sha256}
          - {key: expires-at, path: expires-at}
      - name: metrics-files
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
