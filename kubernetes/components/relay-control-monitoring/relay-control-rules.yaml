# Opt-in with the collector; never load absent-target alerts before activation.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: relay-control-plane
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: relay-control-plane
    interval: 30s
    rules:
    - alert: RelayControlCollectorUnavailable
      expr: up{job="relay-control-plane"} == 0 or absent(up{job="relay-control-plane"})
      for: 2m
      labels:
        severity: warning
        service: relay
      annotations:
        summary: Relay control-plane collection is unavailable
        description: Check the dedicated credential, configured tenant, reviewed release and private network path.
          Failed or absent scrapes do not mean a healthy zero backlog.
    - alert: RelayControlObservationStale
      expr: (time() - relay_control_observed_timestamp_seconds{job="relay-control-plane"} > 90) or (up{job="relay-control-plane"}
        == 1 unless on(job, instance) relay_control_observed_timestamp_seconds{job="relay-control-plane"})
      for: 2m
      labels:
        severity: warning
        service: relay
      annotations:
        summary: Relay control-plane observation is stale or missing
        description: Inspect collection and database availability. Do not infer holder liveness or replay uncertain
          work from missing observations.
    - alert: RelayHolderObservationMissing
      expr: (relay_control_holder_reports_stale{job="relay-control-plane"} > 0) or (relay_control_holders_unreported{job="relay-control-plane"}
        > 0) or (relay_control_holder_journal_reports_missing{job="relay-control-plane"} > 0)
      for: 5m
      labels:
        severity: warning
        service: relay
      annotations:
        summary: Relay holder observations need attention
        description: A holder report is stale, missing for the active incarnation, or lacks journal measurements.
          Inspect supported holder versions and connectivity before interpreting journal totals.
    - alert: RelayHolderJournalGap
      expr: relay_control_holder_journal_history_gaps{job="relay-control-plane"} > 0
      for: 1m
      labels:
        severity: critical
        service: relay
      annotations:
        summary: Relay holder journal history is missing before ingestion
        description: Preserve journal and hub evidence and reconcile the retained boundary. A gap never authorizes
          replay or proves an unknown action completed.
    - alert: RelayHolderJournalNearQuota
      expr: relay_control_holder_journals_near_quota{job="relay-control-plane"} > 0
      for: 5m
      labels:
        severity: warning
        service: relay
      annotations:
        summary: Relay holder journals are near their byte ceiling
        description: Inspect journal ingestion and the sealed retention procedure. This measures journal bytes,
          not whole-filesystem or native-home capacity.
    - alert: RelayControlUnknownOutcome
      expr: (relay_control_control_commands_unknown{job="relay-control-plane"} > 0) or (relay_control_permission_decisions_unknown{job="relay-control-plane"}
        > 0) or (relay_control_question_answers_unknown{job="relay-control-plane"} > 0) or (relay_control_router_credentials_unknown{job="relay-control-plane"}
        > 0) or (relay_control_router_installations_unknown{job="relay-control-plane"} > 0)
      for: 5m
      labels:
        severity: warning
        service: relay
      annotations:
        summary: Relay control or credential delivery has an unknown outcome
        description: Inspect exact operation receipts and holder/router observations. Do not repeat a command or
          credential mutation merely because its outcome is unknown.
    - alert: RelayRouterCleanupPending
      expr: (relay_control_router_revocations_pending{job="relay-control-plane"} > 0) or (relay_control_router_escrow_cleanup_pending{job="relay-control-plane"}
        > 0)
      for: 10m
      labels:
        severity: warning
        service: relay
      annotations:
        summary: Relay router revocation or escrow cleanup is pending
        description: Inspect the scoped router bridge and OpenBao reconciliation. These are retained operation states,
          not proof of remote key authority.
    - alert: RelayControlQueueDelayed
      expr: relay_control_control_commands_oldest_queued_seconds{job="relay-control-plane"} > 120
      for: 5m
      labels:
        severity: warning
        service: relay
      annotations:
        summary: Relay control command delivery is delayed
        description: Inspect holder connectivity, command ownership and expiry. Preserve operation identity; do
          not create a duplicate retry.
    - alert: RelayMessageAcknowledgementDelayed
      expr: relay_control_message_oldest_unacknowledged_seconds{job="relay-control-plane"} > 900
      for: 10m
      labels:
        severity: warning
        service: relay
      annotations:
        summary: Relay agent messages remain unacknowledged
        description: Inspect recipient availability, inbox preferences and wake budget. This counts retained unexpired
          messages and does not authorize automatic wake or access grants.
    - alert: RelayCollectorCredentialExpiring
      expr: relay_control_collector_credential_expires_timestamp_seconds{job="relay-control-plane"} - time() < 86400
      for: 15m
      labels:
        severity: warning
        service: relay
      annotations:
        summary: Relay collector credential expires within one day
        description: Rotate through the approved secret-management path, restart Relay with the new verifier, and
          confirm the old credential is rejected and fresh scrapes recover.
    - alert: RelayBackupScheduleStale
      expr: time() - kube_cronjob_status_last_successful_time{namespace="relay",cronjob="relay-postgres-dump"} >
        93600 or absent(kube_cronjob_status_last_successful_time{namespace="relay",cronjob="relay-postgres-dump"})
      for: 30m
      labels:
        severity: warning
        service: relay
      annotations:
        summary: Relay scheduled backup has no recent successful run
        description: Inspect the daily coordinated database/artifact backup and its storage. Job success is not
          restore verification; the named artifact/database restore gate remains required.
    - alert: RelayControlMetricSchemaIncomplete
      expr: up{job="relay-control-plane"} == 1 unless on(job, instance) (count by(job, instance) (count by(__name__,
        job, instance) ({__name__=~"relay_control_(holder_reports_stale|holders_unreported|holder_journal_reports_missing|control_commands_unknown|permission_decisions_unknown|question_answers_unknown|router_credentials_unknown|router_installations_unknown|router_revocations_pending|router_escrow_cleanup_pending|holder_filesystem_reports_missing|holder_filesystems_near_capacity|holder_native_home_reports_missing|holder_native_home_reports_incomplete)",job="relay-control-plane"}))
        == 14)
      for: 5m
      labels:
        severity: warning
        service: relay
      annotations:
        summary: Relay critical metric schema is incomplete
        description: A successful scrape omitted a required holder, delivery or cleanup observation. Check release
          compatibility; missing series must not look like a healthy zero.
    - alert: RelayHolderStorageObservationMissing
      expr: (relay_control_holder_filesystem_reports_missing{job="relay-control-plane"} > 0) or (relay_control_holder_native_home_reports_missing{job="relay-control-plane"} > 0) or (relay_control_holder_native_home_reports_incomplete{job="relay-control-plane"} > 0)
      for: 5m
      labels:
        severity: warning
        service: relay
      annotations:
        summary: Relay holder storage observations are unavailable
        description: Inspect approved bounded-volume placement and native-home sampling. Missing, incomplete or expired samples are excluded from capacity totals and never establish zero usage.
    - alert: RelayHolderFilesystemNearCapacity
      expr: relay_control_holder_filesystems_near_capacity{job="relay-control-plane"} > 0
      for: 2m
      labels:
        severity: warning
        service: relay
      annotations:
        summary: Relay holder filesystem has less than ten percent capacity available
        description: Inspect block and inode capacity on the approved volume and use sealed maintenance before changing storage. The hard limit remains enforced; do not discard journals or replay uncertain work to free space.
