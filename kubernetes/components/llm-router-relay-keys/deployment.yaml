apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-router
  namespace: llm-router
spec:
  template:
    spec:
      # The base router Deployment already uses uid/gid/fsGroup 1000 for the
      # SQLite data PVC. Keep those exact identities while adding the bridge.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: relay-keys-trust
        image: docker.io/library/node:22.23.3-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
        command: [node, /setup/materialize.mjs]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: '1', memory: 128Mi}
        volumeMounts:
        - {name: relay-keys-trust-setup, mountPath: /setup, readOnly: true}
        - {name: relay-keys-trust-input, mountPath: /input, readOnly: true}
        - {name: relay-keys-trust-file, mountPath: /output}
      containers:
      - name: router
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        env:
        - name: RELAY_KEYS_TRUST_FILE
          value: /run/relay-keys/private/trust.json
        volumeMounts:
        - {name: relay-keys-trust-file, mountPath: /run/relay-keys, readOnly: true}
      volumes:
      - name: relay-keys-trust-setup
        configMap:
          name: relay-keys-trust-setup
      - name: relay-keys-trust-input
        secret:
          secretName: llm-router-relay-keys-trust
          defaultMode: 0440
          items:
          - {key: trust.json, path: trust.json}
      - name: relay-keys-trust-file
        emptyDir:
          medium: Memory
          sizeLimit: 128Ki
