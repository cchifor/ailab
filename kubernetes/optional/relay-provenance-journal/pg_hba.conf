# Local administration only. Network logins must belong to a reviewed purpose group.
local all postgres peer
local all all reject
hostssl relay_provenance +relay_provenance_operator all scram-sha-256
hostssl relay_provenance +relay_provenance_reader all scram-sha-256
hostssl relay_provenance +relay_provenance_infrastructure all scram-sha-256
hostssl relay_provenance +relay_provenance_credential all scram-sha-256
hostssl relay_provenance +relay_provenance_admission all scram-sha-256
hostssl relay_provenance +relay_provenance_holder all scram-sha-256
hostssl relay_provenance +relay_provenance_backing all scram-sha-256
hostssl relay_provenance +relay_provenance_observer all scram-sha-256
host all all all reject
host replication all all reject
