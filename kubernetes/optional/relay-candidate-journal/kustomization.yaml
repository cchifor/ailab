# Reviewed base. Live Flux references it ONLY through the activation overlay
# kubernetes/apps/relay-candidate-journal (clusters/ai/relay-candidate-journal.yaml), which adds the
# database replica count and the protocol Service on 10.96.0.42 (render.py's own object). initialize/
# and every render.py output stay outside every Flux inventory. See the runbook.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- storage.yaml
- certificate.yaml
- journal-certificate.yaml
- postgres.yaml
- network-policy.yaml
configMapGenerator:
- name: relay-candidate-journal-postgres
  namespace: relay-candidate-journal-db
  files: [start.sh, pg_hba.conf]
labels:
- pairs:
    app.kubernetes.io/part-of: relay-candidate-journal
    velero.io/exclude-from-backup: 'true'
  includeSelectors: false
  includeTemplates: true
