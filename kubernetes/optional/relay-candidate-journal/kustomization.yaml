# Reviewed base, STAGED and not live. Its activation overlay kubernetes/apps/relay-candidate-journal and
# the Flux Kustomization clusters/ai/relay-candidate-journal.yaml were retired on 2026-11-22 (owner
# decision, ailab #1753 comment 136889: the qualification campaign is obsolete); the code is kept.
# No Flux path and no other kustomization reaches this directory. initialize/ and every render.py
# output stay outside every Flux inventory. See the runbook.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- storage.yaml
- certificate.yaml
- journal-certificate.yaml
- postgres.yaml
- network-policy.yaml
configMapGenerator:
- name: relay-candidate-journal-postgres
  namespace: relay-candidate-journal-db
  files: [start.sh, pg_hba.conf]
labels:
- pairs:
    app.kubernetes.io/part-of: relay-candidate-journal
    velero.io/exclude-from-backup: 'true'
  includeSelectors: false
  includeTemplates: true
