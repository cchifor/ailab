apiVersion: v1
kind: Service
metadata:
  name: relay-candidate-journal-postgres
  namespace: relay-candidate-journal-db
spec:
  selector:
    app: relay-candidate-journal-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: relay-candidate-journal-postgres
  namespace: relay-candidate-journal-db
spec:
  serviceName: relay-candidate-journal-postgres
  replicas: 0
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: relay-candidate-journal-postgres
  template:
    metadata:
      labels:
        app: relay-candidate-journal-postgres
      annotations:
        backup.velero.io/backup-volumes-excludes: database
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      tolerations:
      - key: dedicated
        operator: Equal
        value: agent
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: docker.io/library/postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        command:
        - /bin/sh
        - /etc/relay-candidate-journal/start.sh
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgres
          containerPort: 5432
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
            ephemeral-storage: 64Mi
          limits:
            cpu: '1'
            memory: 1Gi
            ephemeral-storage: 128Mi
        startupProbe:
          exec:
            command:
            - pg_isready
            - -h
            - /var/run/postgresql
            - -U
            - postgres
            - -d
            - relay_candidate
          periodSeconds: 3
          failureThreshold: 80
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - /var/run/postgresql
            - -U
            - postgres
            - -d
            - relay_candidate
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - /var/run/postgresql
            - -U
            - postgres
            - -d
            - relay_candidate
          periodSeconds: 10
          failureThreshold: 6
        lifecycle:
          preStop:
            exec:
              command:
              - pg_ctl
              - -D
              - /var/lib/postgresql/data/pgdata
              - -m
              - fast
              - -w
              - -t
              - '90'
              - stop
        volumeMounts:
        - name: database
          mountPath: /var/lib/postgresql/data
        - name: config
          mountPath: /etc/relay-candidate-journal
          readOnly: true
        - name: tls
          mountPath: /run/tls
          readOnly: true
        - name: run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: database
        persistentVolumeClaim:
          claimName: relay-candidate-journal-postgres-data
      - name: config
        configMap:
          name: relay-candidate-journal-postgres
          defaultMode: 292
      - name: tls
        secret:
          secretName: relay-candidate-journal-postgres-tls
          defaultMode: 288
      - name: run
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: ailab.io/relay-worker-pool
                operator: DoesNotExist
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
