# Local administrator only; network peers get two narrowly scoped service logins.
local all postgres peer
local all all reject
hostssl relay_candidate relay_candidate_agent_service all scram-sha-256
hostssl relay_candidate relay_candidate_holder_service all scram-sha-256
hostssl relay_candidate relay_candidate_operator_login all scram-sha-256
host all all all reject
host replication all all reject
