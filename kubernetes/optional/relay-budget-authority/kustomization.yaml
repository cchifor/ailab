# Reviewed base. Live Flux references it ONLY through the activation overlay
# kubernetes/apps/relay-budget-authority/ledger (clusters/ai/relay-budget-authority.yaml), which adds
# nothing but the replica count. initialize/ stays outside every Flux inventory. See the runbook.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- storage.yaml
- certificate.yaml
- postgres.yaml
- network-policy.yaml
configMapGenerator:
- name: relay-budget-postgres
  namespace: relay-budget-authority
  files:
  - start.sh
  - pg_hba.conf
labels:
- pairs:
    app.kubernetes.io/part-of: relay-budget-authority
    velero.io/exclude-from-backup: "true"
  includeSelectors: false
  includeTemplates: true
