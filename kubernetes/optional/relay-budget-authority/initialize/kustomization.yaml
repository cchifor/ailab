# Script ConfigMap only. The operator creates the standalone Job explicitly once;
# it must never enter a Kustomization inventory or be recreated by Flux.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
- name: relay-budget-initialize
  namespace: relay-budget-authority
  # relay-source.env is the single reviewed Relay source pin both Jobs verify the bundle against.
  files: [initialize.sh, verify-schema.sh, upgrade.sh, relay-source.env]
labels:
- pairs:
    app.kubernetes.io/part-of: relay-budget-authority
    velero.io/exclude-from-backup: "true"
  includeSelectors: false
  includeTemplates: true
