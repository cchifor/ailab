# Database administrator exists only through the local Unix socket as OS postgres.
local   all             postgres                         peer
local   all             all                              reject
hostssl relay_budget    relay_budget_allocator  all      scram-sha-256
hostssl relay_budget    relay_budget_router     all      scram-sha-256
# Never permit plaintext TCP, remote postgres/owner, replication or other databases.
host    all             all                    all       reject
host    replication     all                    all       reject
