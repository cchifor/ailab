# 20-containment.json of Relay's scripts/prepare-pod-installation.ts for this installation: per
# namespace one ResourceQuota, one LimitRange and one empty default-deny NetworkPolicy. The numbers
# are DERIVED, not chosen here; the inputs are the reviewed definition template
# docs/relay-workers/researcher-installation-definition.json:
#
#   control   = agentResources {milliCpu 200, memoryMiB 256, ephemeralMiB 64}; pods 1; secrets
#               5 = 2 credential objects (relay-infrastructure-agent-key, -enrollment) + 2 retained and
#               1 in-flight Helm release record (Relay's fixed budget, even though ailab applies the
#               chart render through Flux); 2 Leases.
#   execution = installationPolicy.resourceCeiling {milliCpu 2000, memoryMiB 4096, scratchMiB 10240}
#               plus the relay-gvisor RuntimeClass overhead {80m, 24Mi}: 2080m / 4120Mi / 10240Mi.
#               pods 0, secrets 0, no PVC, Service or Lease.
#
# pods "0" in relay-researcher-1 is the enrollment state. It is raised only by the reviewed
# activation bundle (Relay scripts/activate-ordinary-pod-policy.ts emits the one-Pod quota proposal
# after the canary), committed here in its own PR, never by kubectl: Flux would revert a live edit.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: relay-enrollment-quota
  namespace: relay-infra-control
spec:
  hard:
    pods: "1"
    requests.cpu: 200m
    limits.cpu: 200m
    requests.memory: 256Mi
    limits.memory: 256Mi
    requests.ephemeral-storage: 64Mi
    limits.ephemeral-storage: 64Mi
    persistentvolumeclaims: "0"
    requests.storage: "0"
    services: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
    secrets: "5"
    configmaps: "8"
    count/leases.coordination.k8s.io: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: relay-enrollment-limits
  namespace: relay-infra-control
spec:
  limits:
  - type: Container
    max:
      cpu: 200m
      memory: 256Mi
      ephemeral-storage: 64Mi
  - type: Pod
    max:
      cpu: 200m
      memory: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-default-deny
  namespace: relay-infra-control
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: relay-enrollment-quota
  namespace: relay-researcher-1
spec:
  hard:
    pods: "0"
    requests.cpu: 2080m
    limits.cpu: 2080m
    requests.memory: 4120Mi
    limits.memory: 4120Mi
    requests.ephemeral-storage: 10240Mi
    limits.ephemeral-storage: 10240Mi
    persistentvolumeclaims: "0"
    requests.storage: "0"
    services: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
    secrets: "0"
    configmaps: "8"
    count/leases.coordination.k8s.io: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: relay-enrollment-limits
  namespace: relay-researcher-1
spec:
  limits:
  - type: Container
    max:
      cpu: 2080m
      memory: 4120Mi
      ephemeral-storage: 10240Mi
  - type: Pod
    max:
      cpu: 2080m
      memory: 4120Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-default-deny
  namespace: relay-researcher-1
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
