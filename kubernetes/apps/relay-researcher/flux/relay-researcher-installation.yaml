# STAGED, NOT APPLIED. This file sits outside kubernetes/apps/clusters/ai, so Flux never reads it.
# Runbook step I5 (docs/runbooks/relay-researcher-installation.md) moves it, unchanged, to
# kubernetes/apps/clusters/ai/relay-researcher-installation.yaml in the PR that also fills
# ../pins/pins.yaml with the approved installation ID. scripts/tests/test_relay_researcher_installation.py
# refuses that move while any pin is still a placeholder.
#
# What applying it creates: the two dedicated namespaces (restricted PSA), their quotas (ZERO Pods in
# relay-researcher-1), limits, default-deny, the slot's DNS + Relay/Router egress allow-list and the
# deny-all Pod gate, in one Flux apply, so the slot never exists without its policies. No agent, RBAC,
# credential or workload.
#
# prune: false. These objects are the slot's containment. Removing a file from git must never delete
# the live gate, quota or default-deny; retiring them is a separately reviewed operator step after the
# installation is drained and reconciled (the Namespaces carry prune: disabled as well).
#
# Drift: Flux re-applies this tree every interval. The qualification drivers and the activation
# ceremony edit the gate, the quota and the egress policy in place under resourceVersion CAS, so the
# operator SUSPENDS this Kustomization for each such window and lands the ceremony's final objects in
# git before resuming (runbook, "Flux and the in-place ceremonies").
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: relay-researcher-installation
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/relay-researcher/installation
  prune: false
  wait: true
