# THE ONLY PLACE the operator writes the three scalar pins of the first researcher installation
# (docs/runbooks/relay-researcher-installation.md, "Operator-filled values"). Kustomize copies each
# value into every object that carries it (kustomization.yaml in this directory); no other file in
# kubernetes/apps/relay-researcher holds a literal copy. local-config: kustomize never emits this
# ConfigMap, so nothing named relay-researcher-pins ever reaches the cluster.
#
# While any value below is a placeholder the tree is inert by construction: no Flux Kustomization in
# kubernetes/apps/clusters/ai points at it, and scripts/tests/test_relay_researcher_installation.py
# refuses one that does until all three are real.
#
#   installationId  Relay assigns it when an administrator approves the installation
#                   (POST /api/infrastructure/installations, runbook step I3). Lowercase UUID.
#                   It names the enrollment gate (relay-enrollment-<id>) and labels both namespaces,
#                   exactly as Relay's scripts/prepare-pod-installation.ts renders them.
#   agentImage      registry.chifor.me/relay/infrastructure-agent@sha256:<64 hex>, copied from the
#                   `publication.image` of the agent's deploy/worker-images/publish.py receipt: the
#                   receipt of docs/relay-workers/researcher-binding-inputs.json `release`, or, for an
#                   agent-only update (runbook "Agent-only update"), of its `agentRelease`, a LATER
#                   release that published only the agent image. Digest only; never a tag.
#   sourceCommit    The reviewer-merged 40-hex Relay commit of the RUNTIME (`release.sourceCommit`):
#                   the worker runtime image, the definition and binding, and the chart mirrored in
#                   ../agent were built from it, and Relay's preparation requires the definition's to
#                   equal the runtime manifest's. Without an agent-only update the agent image comes
#                   from it too. An agent-only update never changes it: the agent's own source commit
#                   is `agentRelease.sourceCommit` (inputs) and docs/relay-workers/researcher-i4/
#                   summary.json `agentRelease`, and the agent Pod's chifor.me/source-commit
#                   annotation keeps recording this, the installation's commit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: relay-researcher-pins
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  installationId: "b380ff7f-0716-478d-8b01-3d39f30e750b"
  agentImage: "registry.chifor.me/relay/infrastructure-agent@sha256:5b0a85a37a281ccabdb93e4d35f7efe49c552ce24a043e4f021679ed1b63ae3c"
  sourceCommit: "c0fe50f030eac65d78a113e42797c5fe8c395233"
