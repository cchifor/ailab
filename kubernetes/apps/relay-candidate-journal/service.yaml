# relay-candidate-journal.relay-candidate-journal.svc resolves to this address in a DNS-less candidate
# worker Pod (Relay PodRuntimeBinding.hostAliases.candidateJournal, owner decision G3). Pinned and
# reserved in docs/network-plan.md: changing it is a new Relay binding and a re-qualification, not an
# edit. clusterIP is immutable, so a Service already on another address is deleted (journal Deployment
# at zero, no run in flight) and Flux creates it again from this file.
#
# This is exactly the Service kubernetes/optional/relay-candidate-journal/render.py emits (CLUSTER_IP,
# its labels and spec); scripts/tests/test_relay_candidate_journal.py keeps the two equal. It selects
# the journal Pods of the per-run render; until the operator scales that Deployment it has no endpoint.
apiVersion: v1
kind: Service
metadata:
  name: relay-candidate-journal
  namespace: relay-candidate-journal
  labels:
    app.kubernetes.io/part-of: relay-candidate-journal
    velero.io/exclude-from-backup: 'true'
spec:
  type: ClusterIP
  clusterIP: 10.96.0.42
  clusterIPs:
  - 10.96.0.42
  ipFamilyPolicy: SingleStack
  ipFamilies:
  - IPv4
  selector:
    app: relay-candidate-journal
  ports:
  - name: https
    port: 8443
    targetPort: https
