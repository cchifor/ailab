# Minimal-RBAC identity Flux impersonates when reconciling the CP-written cchifor/agentforge-tenants
# repo (spec.serviceAccountName on the agentforge-tenants Kustomization). This is the FIRST of the two
# layers that box in the tenant path (the ValidatingAdmissionPolicy in
# kubernetes/apps/apps/agentforge/admission/ is the second, field/shape gate). It grants ONLY the
# namespaced GVKs a per-workspace tenant manifest needs — deliberately NO clusterroles/-bindings, NO
# wildcard verbs, NO Flux source/Kustomization objects. So a malicious manifest in the tenant repo
# can at most create objects of these kinds, and admission rejects the dangerous shapes among them.
#
# NOTE: these grants are CLUSTER-WIDE (ClusterRole+ClusterRoleBinding) by necessity — the per-workspace
# af-tenant-* namespaces are created dynamically, so the Roles cannot be pre-bound per-namespace. The
# namespace CONFINEMENT is enforced at admission (agentforge-tenant-guard validation 5 pins every tenant
# object to an af-tenant-* namespace, and validation 6 bars RoleBinding->ClusterRole), so this SA cannot
# actually write a Secret/Deployment/RoleBinding into flux-system/kube-system/databases.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentforge-tenants-reconciler
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentforge-tenants-reconciler
rules:
  # Namespaces are cluster-scoped: the reconciler creates the per-workspace af-* namespaces.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Namespaced workspace objects (hand-authored tenant manifests: ns/SA/Deployment/RBAC/NetworkPolicy
  # + the per-workspace SOPS token Secret). NO secrets-elsewhere risk — the SA has no cluster RBAC.
  - apiGroups: [""]
    resources: ["serviceaccounts", "services", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Namespaced RBAC ONLY (Role/RoleBinding) — NEVER ClusterRole/ClusterRoleBinding (admission also
  # rejects those, and wildcard-verb Roles).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # escalate+bind: the rendered tenant Roles legitimately grant verbs the reconciler does not
  # hold for itself (e.g. pods/log streaming), and a same-batch Role+RoleBinding dry-run cannot
  # resolve an absent Role — without these verbs the layer deadlocks (proven 2026-07-24: web +
  # platform-dev Roles unapplyable, whole layer ReconciliationFailed). SAFE here because the
  # tenant-guard ValidatingAdmissionPolicy is the real shape gate on this path: no wildcard
  # verbs/apiGroups/resources, fixed GVK allowlist, and af-tenant-* namespace pinning.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    verbs: ["escalate", "bind"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Cilium is the CNI: workspace egress isolation is a CiliumNetworkPolicy.
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The rendered per-workspace Role grants the orchestrator READ on its own namespace's
  # pods + pod logs (sandbox job log streaming). Kubernetes RBAC escalation-prevention
  # requires the CREATOR to hold every permission it grants, so the reconciler must hold
  # these too (read-only; the tenant-guard admission still constrains creatable Role shapes).
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Flux writes events for the objects it applies as this identity.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # ESO plumbing, required by the P2 R-1 (sandbox) render and by nothing else.
  # A sandbox-mode tenant render emits a SecretStore + an ExternalSecret beside the
  # orchestrator (agentforge-platform adapters/gitops/renderer.py), so without these
  # verbs the ENTIRE agentforge-tenants Kustomization wedges the moment the first
  # workspace is rolled onto sandbox manifests — observed 2026-08-02:
  #
  #   ExternalSecret/.../af-creds-platform-dev-delivery dry-run failed (Forbidden):
  #   ... cannot patch resource "externalsecrets" in API group "external-secrets.io"
  #
  # Flux stops applying rather than deleting, so a running tenant keeps serving; the
  # cost is that no tenant change lands until this is granted. `secretstores` is
  # included because it is the same render and would fail next.
  #
  # SCOPE, stated rather than glossed: this is a real privilege increase. The
  # reconciler can already create/patch `secrets` directly, so writing secret DATA is
  # not new — but an ExternalSecret pulls from OpenBao through the SecretStore's own
  # auth, which reaches material the reconciler cannot read itself. What bounds it is
  # unchanged and load-bearing: the tenants repo is CP-written and PR-gated, and the
  # agentforge-tenant-guard ValidatingAdmissionPolicy pins every object to the
  # af-tenant-* namespaces and the tenant path.
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # R8 observability. The CP renders ONE PodMonitor per pool into that pool's own tenant namespace
  # (agentforge-platform adapters/gitops/renderer.py `_podmonitor`, file 55-podmonitor.yaml) once the
  # operator flips AFP_METRICS_PODMONITOR_ENABLED on the CP Deployment. Same wedge shape as the ESO
  # grant above, and it was measured, not assumed — before this rule,
  #
  #   kubectl auth can-i create podmonitors.monitoring.coreos.com \
  #     --as=system:serviceaccount:flux-system:agentforge-tenants-reconciler \
  #     -n af-tenant-tenant-zero-platform-dev   =>   no
  #
  # so the FIRST pool re-rendered after the flip would commit a manifest this identity cannot apply,
  # and Flux stops applying the whole agentforge-tenants Kustomization rather than skipping the file —
  # stalling EVERY tenant's manifests, not just the one that was re-rendered.
  #
  # ORDERING, and it is the reason this rule lands ALONE and FIRST: this file reconciles through the
  # `agentforge-tenants-git-auth` Kustomization (10m interval), while the tenant-guard VAP that must
  # ALSO admit the GVK and the CP env flag that turns rendering on both reconcile through `apps`.
  # There is no dependsOn between those two Kustomizations, so shipping them together buys no
  # atomicity — it just makes the wedge window a coin flip. Grant first, verify, then admit, then flip.
  #
  # PODMONITOR ONLY, deliberately. No servicemonitors/probes/scrapeconfigs (nothing on this path
  # renders them) and above all NO prometheusrules: a tenant-writable PrometheusRule would let the
  # tenant path define cluster-wide recording rules and alerts, which is a far larger grant than
  # "tell Prometheus which of my own pods to scrape". `delete` because the Kustomization is
  # prune: true; `update`/`patch` because Flux server-side-applies on every interval.
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["podmonitors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentforge-tenants-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentforge-tenants-reconciler
subjects:
  - kind: ServiceAccount
    name: agentforge-tenants-reconciler
    namespace: flux-system
