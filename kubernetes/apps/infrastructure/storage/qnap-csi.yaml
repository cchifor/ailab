# QNAP iSCSI block CSI (Trident operator). Provides network block RWO from the QNAP ZFS pool
# (zpool1) over iSCSI. The TridentBackendConfig + StorageClass live in the separate `qnap-storage`
# Flux Kustomization (dependsOn infrastructure) because their CRD is installed by THIS HelmRelease.
# Talos nodes already have the siderolabs/iscsi-tools extension (iscsid/iscsiadm).
apiVersion: v1
kind: Namespace
metadata:
  name: trident
  labels:
    # the Trident node DaemonSet needs privileged (iSCSI, host mounts)
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qnap-trident
  namespace: trident
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: ./Helm/trident
      # Revision, not the default ChartVersion: the chart is 2.0.0 at both v1.6.0 and v1.6.2, so a tag
      # bump alone would never re-render it (Talos upgrade program P4a, 2026-10-09).
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: qnap-csi
        namespace: flux-system
  # CRDs: Helm skips crds/ on upgrade by default. CreateReplace applies a changed chart CRD
  # (tridentorchestrator; the operator creates the rest at runtime). Identical at v1.6.0/v1.6.2.
  install:
    createNamespace: false
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    forceInstallRancherClusterRoles: false
