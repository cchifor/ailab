apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - csi-driver-nfs.yaml
  - storageclass-nfs.yaml
  - local-path-provisioner.yaml
  - qnap-csi.yaml
  - snapshot-controller # external-snapshotter v8 (CRDs + controller) — enables the VolumeSnapshot API
  - volumesnapshotclass-nfs.yaml # nfs.csi.k8s.io class; without it every nfs-csi PVC failed to snapshot, so each scheduled backup was PartiallyFailed with the volume DATA uncaptured
  - velero # Velero filesystem backup (Kopia via node-agent) -> versitygw S3 on the QNAP (ADR 0010); CSI snapshot data movement was dropped after its clone path orphaned QNAP LUNs
  - talos-backup # daily age-encrypted etcd snapshot -> versitygw (control-plane DR)
  - backup-offsite # nightly encrypted rclone sync of the versitygw buckets -> Google Drive (copy #3)
  - iscsi-recovery-tmo.yaml # pins live iSCSI recovery_tmo to 120s; the QNAP Trident driver writes "2m0s" where open-iscsi wants an integer, so the kernel reads it as 2
