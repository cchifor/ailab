# cert-manager — in-cluster TLS certificate automation (ADR 0007: the single cert authority for the
# planned Traefik wildcard *.chifor.me). The ClusterIssuers live in cert-manager-config/ and are applied
# by a SEPARATE Flux Kustomization that dependsOn this (issuers fail admission until the webhook is Ready).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: cert-manager
      version: "v1.20.2"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  values:
    crds:
      enabled: true
      keep: true # an errant uninstall must NOT garbage-collect every Certificate/Issuer in the cluster
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
    webhook:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 64Mi }
    cainjector:
      # cainjector watches every CRD. Under the old 128Mi limit it ran at about 95%, and KubeVirt's large
      # CRDs pushed it over (docs/relay-workers/kubevirt-spike-record-2026-11-09.md, F15). On install its
      # RSS reached ~103 MiB and it re-read its own code pages from cp3's disk (800-900 major faults/s,
      # 2.2 GB/s) until it restarted; on removal it was OOM-killed. Otherwise its RSS was 69-86 MiB
      # (2026-11-01 to 11-10). 256Mi covers that peak plus its code pages; 128Mi covers its working set.
      resources:
        requests: { cpu: 10m, memory: 128Mi }
        limits: { memory: 256Mi }
