# Pins the env images on every env-pool node (sleep-DaemonSet pattern): removes the multi-minute
# stage-3 image pull from cold/refill paths, makes the images kubelet-GC-proof (referenced by a
# running container), and self-heals after a node rebuild. Runs runc (no RuntimeClass — this must
# never consume kata resources) and tolerates only the env taint.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: env-image-prepull
  namespace: testpool
spec:
  selector:
    matchLabels:
      app: env-image-prepull
  template:
    metadata:
      labels:
        app: env-image-prepull
    spec:
      nodeSelector:
        ailab.io/env-pool: "true"
      tolerations:
        - key: dedicated
          operator: Equal
          value: env
          effect: NoSchedule
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      containers:
        - name: dind-pin
          image: registry.chifor.me/testpool/env-dind:20260906-9c48b627@sha256:86280ae7ccc0f28506d97c1c4127b878da0b6e9b390ba8d106a50cb55593dc5f
          command: ["sleep", "infinity"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            runAsUser: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: control-pin
          image: registry.chifor.me/testpool/env-control:20260906-9c48b627@sha256:47514f2a10842a6239f3ac1e47db66e530ed813fe7ce6c1a9a91e8731005b3d9
          command: ["sleep", "infinity"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            runAsUser: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
