# Pins the env images on every env-pool node (sleep-DaemonSet pattern): removes the multi-minute
# stage-3 image pull from cold/refill paths, makes the images kubelet-GC-proof (referenced by a
# running container), and self-heals after a node rebuild. Runs runc (no RuntimeClass — this must
# never consume kata resources) and tolerates only the env taint.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: env-image-prepull
  namespace: testpool
spec:
  selector:
    matchLabels:
      app: env-image-prepull
  template:
    metadata:
      labels:
        app: env-image-prepull
    spec:
      nodeSelector:
        ailab.io/env-pool: "true"
      tolerations:
        - key: dedicated
          operator: Equal
          value: env
          effect: NoSchedule
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      containers:
        - name: dind-pin
          image: registry.chifor.me/testpool/env-dind:20260901-1f7d6e25@sha256:0480f62bd40ed66e1112621826e7df6274f13b4e26758f76d0778d8c17501802
          command: ["sleep", "infinity"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            runAsUser: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: control-pin
          image: registry.chifor.me/testpool/env-control:20260901-da642abc@sha256:36d8ea2dee1523c84d924e0b41cdcaff2343dcd555866414411570f6e1f4f472
          command: ["sleep", "infinity"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            runAsUser: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
