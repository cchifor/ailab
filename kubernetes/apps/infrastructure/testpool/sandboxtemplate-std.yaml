# env-std — the std flavor (L/PW/parallel-M class; 16 Gi limit). Two-container shape and every
# entrypoint quirk below is spike-proven (kubernetes/infra/env-pool/SPIKE-REPORT.md, F1-F7):
#   - /var/lib/docker MUST be a Block-mode PVC (Filesystem mode rides virtio-fs -> vfs fallback)
#   - try-mount-else-mkfs (busybox blkid exits 0 on blank devices)
#   - keep dockerd-entrypoint.sh (iptables-LEGACY selection; kata guest kernel has no nf_tables),
#     with an explicit unix-only --host (no tcp bind, no 15s TLS-warning slowdown)
#   - entrypoint asserts overlay2 and refuses vfs
#   - ALL exec traffic targets the control container (dockerd's cgroup-v2 subtree control makes
#     the dind container un-exec-able). Both probes are TCP against control's ready-port 9099,
#     which is held open by ready-watchdog.py (ConfigMap ready-watchdog, mounted read-only) ONLY
#     while a virtio-fs write+fsync on /work and a dockerd /_ping each answer within 5 s:
#       startup   = tcp 9099, 1 s period, 600 failures (the port opens after dockerd answered and
#                   both checks passed once)
#       readiness = tcp 9099, 5 s period, 6 failures (~30 s of a closed port)
#     The readiness contract since 2026-09-20 (plans/2026-09-20-env-pool-frozen-guest-outage-plan.md):
#     "a lease can run docker here", decided IN the guest by a long-lived process and reported
#     through a probe the kubelet answers itself. An exec probe was the first design and was
#     rejected by its own fault injection: with virtiofsd frozen the probe's `sh` cannot load, later
#     execs fail fast with a non-timeout CRI error that kubelet 1.31's prober DISCARDS, and the pod
#     stayed Ready=True for 7+ min. The old fork-per-connection `nc -l` loop had the opposite flaw:
#     any exec hiccup closed the port for a moment, and the warm-pool GC deletes any member older
#     than its grace period the instant it is observed NotReady.
#   - Both entrypoints trap TERM and end in `sleep infinity & wait $!` (a foreground sleep would
#     never let the trap run), so a graceful stop takes ~1 s, not 30 s grace + SIGKILL.
# Both images are estate-built (env-image/, rebuilt by CI on main): env-dind = docker:28.3-dind
# + e2fsprogs; env-control = the lease toolchain (node 22, uv, docker CLI, rsync/git/jq/nc/python3 —
# deliberately NO browsers, see the PLAYWRIGHT_BROWSERS_PATH note below).
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: env-std
  namespace: testpool
spec:
  podTemplate:
    metadata:
      labels:
        app: env-std
        testpool.chifor.me/flavor: std
    spec:
      runtimeClassName: kata-env
      automountServiceAccountToken: false
      dnsPolicy: "None"
      dnsConfig:
        nameservers: ["1.1.1.1", "9.9.9.9"]
      terminationGracePeriodSeconds: 30
      # One warm member per env node. Placement is otherwise only the kata-env RuntimeClass
      # (label + toleration), so without this both members could land on one node and a node loss
      # would still take the whole warm capacity. DoNotSchedule: a member that cannot spread stays
      # Pending (visible: TestpoolNoWarmCapacity) rather than silently doubling up.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: env-std
      containers:
        - name: dind
          image: registry.chifor.me/testpool/env-dind:20260906-9c48b627@sha256:86280ae7ccc0f28506d97c1c4127b878da0b6e9b390ba8d106a50cb55593dc5f
          securityContext:
            privileged: true
          command: ["sh", "-c"]
          args:
            - |
              set -x
              # TERM = graceful stop: forward to dockerd, reap it, exit 0. Installed first so a
              # stop during the init loop below exits too. $DPID is empty until dockerd starts.
              trap 'kill -TERM "$DPID" 2>/dev/null; wait "$DPID" 2>/dev/null; exit 0' TERM
              # e2fsprogs is baked in env-dind (env-image/Dockerfile.dind) — no runtime apk.
              DEV=/dev/dockerblk
              mkdir -p /var/lib/docker
              if ! mount -o defaults,noatime "$DEV" /var/lib/docker 2>/work/mount1.err; then
                mkfs.ext4 -q -L dockerlib "$DEV"
                mount -o defaults,noatime "$DEV" /var/lib/docker
              fi
              # SPIKE-PROVEN flags ONLY: --userland-proxy=false needs br_netfilter, which the kata
              # guest kernel lacks — it hard-failed dockerd in production (2026-09-01). Do not add
              # untested flags to this line.
              dockerd-entrypoint.sh dockerd \
                --host=unix:///run/dsock/docker.sock \
                --registry-mirror=https://registry.chifor.me >/work/dockerd.log 2>&1 &
              DPID=$!
              export DOCKER_HOST=unix:///run/dsock/docker.sock
              i=0
              until docker version >/dev/null 2>&1; do
                i=$((i+1)); [ $i -gt 1800 ] && echo "DOCKERD NEVER READY" && tail -40 /work/dockerd.log && exit 1
                sleep 0.2
              done
              docker info --format '{{.Driver}}' | grep -q overlay2 || { echo "FATAL: storage driver is not overlay2"; tail -40 /work/dockerd.log; exit 2; }
              echo ENV-DIND-OK
              sleep infinity & wait $!
          resources:
            requests: { cpu: "1", memory: 2Gi }     # parked-priced: scheduling by requests, capacity by limits
            limits: { cpu: "5", memory: 12Gi }
          volumeDevices:
            - name: dockerlib
              devicePath: /dev/dockerblk
          volumeMounts:
            - { name: shm, mountPath: /dev/shm }
            - { name: dsock, mountPath: /run/dsock }
            - { name: work, mountPath: /work }
        - name: control
          image: registry.chifor.me/testpool/env-control:20260906-9c48b627@sha256:483a885a680a16501c4e07994b2b9d1b35e95e59498fe82651a7957db9c2f534
          command: ["sh", "-c"]
          args:
            - |
              trap 'exit 0' TERM
              i=0
              until docker version >/dev/null 2>&1; do
                i=$((i+1)); [ $i -gt 3600 ] && echo CONTROL-GAVE-UP && exit 1
                sleep 0.2
              done
              mkdir -p /work/runs /work/src
              # Ready-port :9099, held open by the watchdog only while virtio-fs and dockerd answer,
              # reopened after 3 consecutive passes (ready-watchdog.yaml). Backgrounded: THIS shell
              # stays PID 1, so a stall makes the member NotReady without killing a lease in flight;
              # a short stall recovers in place, a long one gets the member replaced by the
              # warm-pool GC. Its log lines are the guest-side evidence.
              python3 /opt/ready-watchdog/ready-watchdog.py &
              echo ENV-CONTROL-READY
              sleep infinity & wait $!
          env:
            - name: DOCKER_HOST
              value: unix:///run/dsock/docker.sock
            # In-env location marker for workload-class guards (agentforge AGENTS.md routing):
            # wrapper scripts / compose interpolations read it to prove they run inside a
            # leased env rather than on a dev-worker. Guards must not REQUIRE it before the
            # warm member has cycled onto this template revision.
            - name: TESTPOOL_ENV
              value: "1"
            # Per-lease browser cache (per-repo playwright versions install here on first use,
            # ~150MB/version). Cross-lease warm browsers need the /data single-golden-volume
            # layout (caches subpath shared to control) — a future restructure; the control IMAGE
            # deliberately carries no browsers (see env-image/Dockerfile.control rationale).
            - name: PLAYWRIGHT_BROWSERS_PATH
              value: /work/caches/ms-playwright
          startupProbe:
            tcpSocket: { port: 9099 }
            periodSeconds: 1
            failureThreshold: 600
          # TCP, answered by the kubelet itself (no CRI path to be discarded — see header). The
          # watchdog decides when :9099 is open; 6 refusals in a row (~30 s) = NotReady.
          readinessProbe:
            tcpSocket: { port: 9099 }
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          volumeMounts:
            - { name: dsock, mountPath: /run/dsock }
            - { name: work, mountPath: /work }
            - { name: ready-watchdog, mountPath: /opt/ready-watchdog, readOnly: true }
      volumes:
        - name: ready-watchdog
          configMap: { name: ready-watchdog, defaultMode: 0444 }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 1Gi } # Chromium needs >=1g shm; charged to the pod limit
        - name: dsock
          emptyDir: {}
        - name: work
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: dockerlib
      spec:
        accessModes: ["ReadWriteOnce"]
        volumeMode: Block
        storageClassName: testpool-iscsi
        # Publication protocol: golden snapshots are immutable golden-vN; THIS name is the pointer
        # and bumping it (git change) is the rollout. hack/golden-refresh.sh builds vN+1.
        dataSource:
          apiGroup: snapshot.storage.k8s.io
          kind: VolumeSnapshot
          name: golden-v1
        resources:
          requests:
            storage: 60Gi
---
# Warm pool: 2 members, one per env node (the template's topologySpreadConstraints) — since
# env-node-2 (parent plan T4, gate G3b): a node loss, a Talos upgrade or host maintenance on one
# node leaves one warm member. A parked env costs ~100 Mi working set (spike-measured), and
# adoption is 0.2-1 s; the cold chain (~90-150 s) is paid here, off the lease path. Until golden-v1
# exists (bootstrap runbook in README) members cycle Pending harmlessly under the 15m readiness
# grace. The namespace quota (pods 6, requests.memory 24Gi) holds two members plus leases.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: env-std-pool
  namespace: testpool
spec:
  replicas: 2
  sandboxTemplateRef:
    name: env-std
