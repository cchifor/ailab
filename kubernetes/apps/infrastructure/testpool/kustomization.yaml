# The leasable test-environment pool (testpool) — production tree.
# hack/ is deliberately NOT listed (operator-run scripts + pod manifests, never Flux-applied).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - runtime-storage.yaml
  - networkpolicy.yaml
  - ready-watchdog.yaml # the in-guest ready-port watchdog the template's probes target (2026-09-20)
  - sandboxtemplate-std.yaml
  - prepull-daemonset.yaml
  - tep-access.yaml
  - env-reaper.yaml # kube-system DaemonSet + testpool Role: bounded Kata teardown (2026-09-20 outage)
  - warm-spread-repair.yaml # kube-system CronJob + testpool Role: keeps one warm member per env node (parent plan T4, PR #835 review)
