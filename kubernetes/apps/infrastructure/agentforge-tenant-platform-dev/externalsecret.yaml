# tenant-zero/platform-dev worker credential — materializes the Secret `af-creds-platform-dev-delivery`
# the CP-rendered orchestrator Deployment (af-orch-platform-dev-delivery) consumes via envFrom. Clone of
# agentforge-workers/worker-externalsecret.yaml (playground). dataFrom.extract pulls the WHOLE
# orchestrator subtree `af/data/tenants/tenant-zero/platform-dev/orchestrator`, so the forge PATs +
# AF_CONTROL_PLANE_TOKEN PLUS the orchestrator-only AF_CAPABILITY_SIGNING_KEY + AF_CAPABILITY_KID all
# surface as Secret keys automatically once the subtree is complete (Phase-2 step 3). The private signing
# key stays orchestrator-side — NEVER delivered to a sandbox Job.
#
# tenant-zero shares ONE capability signing key across its workspaces: AF_CAPABILITY_KID is the SAME
# `tz-213512e80fde7c84` playground uses, which is why Phase-2 step 2 WIDENS that existing kid (adds
# `platform-dev` to allowed_workspaces + `delivery` to allowed_pools) rather than registering a new kid.
#
# creationPolicy: Owner — ESO OWNS af-creds-platform-dev-delivery and will REPLACE the current partial
# manual seed (5 keys, no signing key) with the full KV subtree once step 3 lands.
#
# ⚠ NotReady until the KV subtree at af/data/tenants/tenant-zero/platform-dev/orchestrator is complete
# (Phase-2 step 3). Harmless while NotReady (see eso-secretstore.yaml header). Reconciled by the ESO
# CONTROLLER out-of-band; the orchestrator only READS the mounted env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: af-creds-platform-dev-delivery
  namespace: af-tenant-tenant-zero-platform-dev
  labels:
    app.kubernetes.io/name: agentforge-worker
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: af-eso-platform-dev
    kind: SecretStore
  target:
    name: af-creds-platform-dev-delivery
    creationPolicy: Owner
  dataFrom:
    # extract the WHOLE orchestrator subtree -> every KV key becomes a Secret key (forge PATs +
    # AF_CONTROL_PLANE_TOKEN + AF_CAPABILITY_SIGNING_KEY + AF_CAPABILITY_KID). Orchestrator-only.
    - extract:
        key: tenants/tenant-zero/platform-dev/orchestrator
