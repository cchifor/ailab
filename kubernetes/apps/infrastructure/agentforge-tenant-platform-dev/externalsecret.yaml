# tenant-zero/platform-dev worker credential — materializes the Secret `af-creds-platform-dev-delivery`
# the CP-rendered orchestrator Deployment (af-orch-platform-dev-delivery) consumes via envFrom. Cloned from
# the playground's worker-externalsecret.yaml (playground retired 2026-10-30). dataFrom.extract pulls the WHOLE
# orchestrator subtree `af/data/tenants/tenant-zero/platform-dev/orchestrator`, so the v3 AF_BOT_TOKENS
# map (ONE JSON bot-username→PAT key; the extract makes the KV key name the env var name, so the v3
# cutover changes the DOC, not this manifest — docs/runbooks/agentforge-v3-cutover.md) +
# AF_CONTROL_PLANE_TOKEN PLUS the orchestrator-only AF_CAPABILITY_SIGNING_KEY + AF_CAPABILITY_KID all
# surface as Secret keys automatically once the subtree is complete (Phase-2 step 3). The private signing
# key stays orchestrator-side — NEVER delivered to a sandbox Job.
#
# AF_CAPABILITY_KID: platform-dev signs with its OWN derived kid, `cap-b5663179affeeaba5366c3ffd232681d`
# (declared in security/openbao/capability-kids-configmap.yaml, verified live 2026-10-30). An earlier
# version of this comment said it shared the playground's legacy `tz-213512e80fde7c84`; that was the
# Phase-2 plan, superseded by the provisioner-minted kid, and `tz-…` was revoked with the playground.
#
# creationPolicy: Owner — ESO OWNS af-creds-platform-dev-delivery and will REPLACE the current partial
# manual seed (5 keys, no signing key) with the full KV subtree once step 3 lands.
#
# ⚠ Owner also means ESO sets an ownerReference on that Secret, so DELETING this ExternalSecret
# garbage-collects the orchestrator's credentials. Since the 2026-08-02 re-provision this object is
# dual-declared (the CP render emits its own 61-externalsecret.yaml) and both Flux Kustomizations run
# prune:true — removing it from EITHER side deletes the Secret. Running pods keep their env (envFrom is
# read once at start), but any restart before ESO re-syncs comes up without credentials.
#
# `deletionPolicy` is intentionally NOT pinned here, even though the dual-declaration risk note in
# kustomization.yaml leans on its default (Retain) to keep the Secret across a failed refresh. Setting
# it explicitly would add a field the CP render does NOT emit, widening the set of fields the two
# declarations disagree on and therefore the SSA flip-flop surface. Pin it once the render is
# authoritative and this file is retired. The refreshInterval 1h below also bounds that exposure: a
# stripped-caProvider window must coincide with an hourly refresh to be observable at all.
#
# ⚠ NotReady until the KV subtree at af/data/tenants/tenant-zero/platform-dev/orchestrator is complete
# (Phase-2 step 3). Harmless while NotReady (see eso-secretstore.yaml header). Reconciled by the ESO
# CONTROLLER out-of-band; the orchestrator only READS the mounted env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: af-creds-platform-dev-delivery
  namespace: af-tenant-tenant-zero-platform-dev
  labels:
    app.kubernetes.io/name: agentforge-worker
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: af-eso-platform-dev
    kind: SecretStore
  target:
    name: af-creds-platform-dev-delivery
    creationPolicy: Owner
  dataFrom:
    # extract the WHOLE orchestrator subtree -> every KV key becomes a Secret key (forge PATs +
    # AF_CONTROL_PLANE_TOKEN + AF_CAPABILITY_SIGNING_KEY + AF_CAPABILITY_KID). Orchestrator-only.
    - extract:
        key: tenants/tenant-zero/platform-dev/orchestrator
