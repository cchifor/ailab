# tenant-zero/platform-dev worker ESO auth — the credential path for the CP-created `platform-dev`
# subscription workspace (pool `delivery`). Clone of agentforge-workers/worker-secretstore.yaml
# (playground). The CP-rendered orchestrator Deployment (af-orch-platform-dev-delivery) envFrom's the
# Secret `af-creds-platform-dev-delivery`, but platform-dev's tenant-repo render is STALE (pre-ESO): it
# shipped WITHOUT any ESO to materialize that Secret, and the Secret currently in-cluster is a partial
# MANUAL seed missing AF_CAPABILITY_SIGNING_KEY/AF_CAPABILITY_KID. This file adds the per-workspace
# eso-auth SA + the namespaced OpenBao SecretStore; externalsecret.yaml adds the ExternalSecret that
# (re)fills the Secret from OpenBao af/data/tenants/tenant-zero/platform-dev/orchestrator.
#
# Shape is the EXACT one the CP renderer emits (agentforge-platform gitops/renderer.py: 11-eso-
# serviceaccount + 60-secretstore): eso-auth SA (eso_auth_sa_prefix `af-eso-` + workspace slug =>
# `af-eso-platform-dev`), NAMESPACED SecretStore (name == the eso-auth SA) using OpenBao/vault kubernetes
# auth under the per-tenant role `af-tenant-tenant-zero-platform-dev`, KV v2 mount `af`.
#
# ⚠ OWNERSHIP: the CP renderer would ALSO emit 11-eso-serviceaccount.yaml + 60-secretstore.yaml +
# 61-externalsecret.yaml for platform-dev on a (re-)provision. This operator copy is a DELIBERATE
# override for the STALE render — do NOT re-provision platform-dev via the CP while these operator
# objects exist (Flux would dual-own them). If a future CP re-provision is wanted, delete this
# agentforge-tenant-platform-dev tree first. (Playground precedent: operator owns the ESO stack.)
#
# ⚠ ACTIVATION: the OpenBao role `af-tenant-tenant-zero-platform-dev` (bound to ns
# af-tenant-tenant-zero-platform-dev + SA af-eso-platform-dev) is PROVISIONER-owned — Phase-2 step 1
# (re-seed OpenBao) created it. The ExternalSecret stays NotReady until the KV subtree
# af/data/tenants/tenant-zero/platform-dev/orchestrator is complete (Phase-2 step 3). Harmless while
# NotReady: the orchestrator keeps its current (idle) Secret; nothing crashes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: af-eso-platform-dev
  namespace: af-tenant-tenant-zero-platform-dev
  labels:
    app.kubernetes.io/name: agentforge-worker
    app.kubernetes.io/component: eso-auth
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
# ESO mints a short-TTL token for this SA (TokenRequest); no pod runs as it, so keep its token unmounted.
automountServiceAccountToken: false
---
# Namespaced SecretStore (NOT ClusterSecretStore) — OpenBao/vault via kubernetes auth, authenticating as
# the af-eso-platform-dev SA under the per-tenant role. KV v2 mount `af`. The tenant role is scoped to
# `af/data/tenants/tenant-zero/platform-dev/*`, which cannot name any `af/data/operator/*` key (the R-2
# reserved-prefix split), so this store can read ONLY this workspace's own subtree.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: af-eso-platform-dev
  namespace: af-tenant-tenant-zero-platform-dev
  labels:
    app.kubernetes.io/name: agentforge-worker
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
spec:
  provider:
    vault:
      server: "https://openbao.openbao.svc:8200"
      path: "af"        # KV v2 mount
      version: "v2"
      # caProvider: verify OpenBao's cert-manager TLS cert (openbao-tls, ailab-ca). A NAMESPACED
      # SecretStore resolves caProvider IN ITS OWN namespace, so Secret `openbao-tls` (ca.crt) MUST be
      # present here — openbao-ca-cert.yaml issues it via a per-ns cert-manager Certificate off the
      # ailab-ca ClusterIssuer (the renderer does NOT emit this; it is always operator-provided).
      caProvider:
        type: Secret
        name: openbao-tls
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "af-tenant-tenant-zero-platform-dev"   # per-tenant; bound to this ns + af-eso-platform-dev SA
          serviceAccountRef:
            name: af-eso-platform-dev
            # The provisioner pins the OpenBao k8s-auth role to token_reviewer audience "openbao"
            # (provisioner/templates.py K8S_TOKENREVIEW_AUDIENCE). ESO must mint the SA TokenRequest
            # with that SAME audience — else the OpenBao login is rejected and the Secret never syncs.
            audiences: ["openbao"]
