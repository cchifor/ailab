# The tenant-ns staging PVC the platform-dev orchestrator mounts at AF_SANDBOX_STAGING_ROOT (the shared
# NFS the sandbox Kata Job also mounts, subPath <job_id>). Statically bound (volumeName +
# storageClassName "") to the operator-owned NFS PV af-sbx-stage-tenant-zero-platform-dev
# (agentforge-sandbox/platform-dev-staging-pv.yaml). Clone of agentforge-workers/worker-staging-pvc.yaml
# (playground). Without it the orchestrator pod fails scheduling once re-rendered to mount staging.
#
# The CP renderer emits an equivalent 70-staging-pvc.yaml on a (re-)provision; this operator copy is a
# DELIBERATE override for platform-dev's STALE tenant-repo render (see eso-secretstore.yaml header for
# the do-not-re-provision-while-present caveat).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: af-sbx-stage-tenant-zero-platform-dev
  namespace: af-tenant-tenant-zero-platform-dev
  labels:
    app.kubernetes.io/part-of: agentforge
    agentforge.io/org: tenant-zero
    agentforge.io/workspace: platform-dev
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: af-sbx-stage-tenant-zero-platform-dev
  resources:
    requests:
      storage: 5Gi
