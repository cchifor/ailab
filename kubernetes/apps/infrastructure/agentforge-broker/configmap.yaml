# NON-SECRET broker env (design §5) — the AF_BROKER_-prefixed knobs BrokerSettings reads (agentforge
# broker/config.py). NO secret material lives here: the ledger PASSWORD/DSN-with-auth comes from the
# ESO-synced broker-ledger Secret (AF_BROKER_LEDGER_DSN via secretKeyRef — see deployment.yaml), and the
# OAuth + kid public keys come from mounted ESO Secrets. Only the broker's identity, the bounds
# defaults, ports, and the (non-secret) ledger COORDINATES are here.
#
# SHARED across every per-account broker Deployment (broker-anthropic-max1 / broker-anthropic-max2 /
# broker-openai-codex): each Deployment `envFrom`s this ConfigMap for the account-INDEPENDENT knobs and
# then OVERRIDES the per-account identity `AF_BROKER_AUDIENCE` with an inline container `env:` (inline env
# wins over envFrom). AF_BROKER_AUDIENCE therefore lives per-Deployment, NOT here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentforge-broker-env
  namespace: agentforge-broker
  labels:
    app.kubernetes.io/name: agentforge-broker
    app.kubernetes.io/component: broker
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
data:
  # NB: AF_BROKER_AUDIENCE (this broker instance's identity = provider/account, design §3 — a capability is
  # accepted only if its `aud` == this) is set PER-DEPLOYMENT as an inline `env:` in each broker-*.yaml
  # (ONE broker Deployment per (provider, account)), NOT here, so this ConfigMap stays account-agnostic.
  # Upstream provider base — CONFIG ONLY (the gateway proxy is PREFLIGHT-gated, design §4/§10); the exact
  # enumerated host(s) land with the preflight. Left empty until then.
  AF_BROKER_UPSTREAM_BASE_URL: ""
  # Conservative per-request worst-case token reservation (design §5) — reserved BEFORE dispatch so the
  # budget bound is real even before the precise (validated-input + max-output + aux) figure lands.
  AF_BROKER_WORST_CASE_TOKENS: "200000"
  AF_BROKER_LEASE_TTL_S: "120"       # expiring-concurrency lease TTL (crash reclaim)
  AF_BROKER_SWEEP_INTERVAL_S: "30"   # supervised lease-sweep interval (< lease TTL)
  AF_BROKER_MAX_BODY_BYTES: "1048576"      # smuggling/DoS body cap (1 MiB)
  AF_BROKER_BODY_READ_TIMEOUT_S: "30"      # wall-clock deadline for the pre-admission body read
  AF_BROKER_PORT: "8700"             # HTTP API (the DIRECT ClusterIP the sandbox reaches, source-IP TOFU)
  AF_BROKER_METRICS_PORT: "9464"     # Prometheus metrics
  # The mounted operator kid-registry JSON (public verify keys + per-kid ceilings), synced by ESO from
  # OpenBao (externalsecret-kids.yaml) and mounted read-only. Public keys are non-secret, but syncing
  # via ESO matches the operator keypair-controller publish path (design §3/§7).
  AF_BROKER_KID_REGISTRY_PATH: "/var/run/broker/kids/registry.json"
  # How often the broker re-reads AF_BROKER_KID_REGISTRY_PATH from disk (agentforge #55 @28c2252,
  # BrokerSettings.kid_reload_interval_s). Bounds how long after ESO writes a newly-provisioned public kid
  # before this replica serves it — which the provisioner's activation barrier waits on. Kept in step with
  # the -kids ExternalSecret refreshInterval (~1m, see each broker-*.yaml) so end-to-end kid propagation is
  # ~2m worst case (ESO fetch + file reload).
  AF_BROKER_KID_RELOAD_INTERVAL_S: "60"
  # How often the broker re-reads the mounted operator OAuth (AF_BROKER_OAUTH_MOUNT_PATH below) from disk
  # (BrokerSettings.oauth_reload_interval_s, an atomic last-good swap). EXPLICIT since C-P0-08: the code
  # default is 300s, which was the silent second term of the rotate->serving latency behind the -oauth
  # ExternalSecret's refreshInterval (now 5m, see each broker-*.yaml). Kept in step with the -kids reloader
  # above so both mounted-file reloaders run on the same 60s cadence: rotation propagation is ~6 min worst
  # case (5m ESO fetch + 60s file reload), was ~65 (1h + 300s).
  AF_BROKER_OAUTH_RELOAD_INTERVAL_S: "60"
  # The PATH to the mounted ledger DSN file (design §5/§B) — NON-secret. The DSN itself (with the
  # agentforge_broker password) is the read-only broker-ledger Secret mounted at this path; the DSN is
  # NEVER placed in this ConfigMap. (Follow-up: the merged broker/config.py reads AF_BROKER_LEDGER_DSN
  # from env; it must gain *_FILE reading before activation — see deployment.yaml.)
  AF_BROKER_LEDGER_DSN_FILE: "/var/run/broker/ledger/AF_BROKER_LEDGER_DSN"
  # The mounted broker-oauth DIR (the gateway reads the operator OAuth from here to inject the
  # upstream Bearer, design §4). The dir holds CLAUDE_CODE_OAUTH_TOKEN (anthropic) or auth.json
  # (openai); the gateway picks by this instance's provider. Required by the gateway composition root.
  AF_BROKER_OAUTH_MOUNT_PATH: "/var/run/broker/oauth"
  # ── Usage HEARTBEAT (agentforge plan 3c) — OFF. Turning it on SPENDS THE SUBSCRIPTION. ──
  #
  # WHY IT EXISTS. For the three anthropic seats the vendor usage probe answers `scope_missing`
  # BY DESIGN: a `claude setup-token` "can only make model requests", so api.anthropic.com's
  # /api/oauth/usage is closed to it. The ONLY compliant server-side source of a Claude figure is
  # the rate-limit-header tee the broker runs on RELAYED responses — and that needs traffic.
  # Nothing has ever been relayed through any broker (af_broker_tokens_used_total = 0 on all four
  # seats over 30 d; af_broker_requests_total has no series at all), so every Claude meter reads
  # zero. With this set, each broker REPLICA sends one minimal Haiku turn (max_tokens: 1) whenever
  # it has itself relayed nothing for that many minutes, and records the response's rate-limit
  # headers. A replica that IS relaying agent traffic skips the beat and spends nothing.
  #
  # VALUE = MINUTES. "0" or unset = OFF (no task, no request, ever). A value in (0, 15) is
  # REFUSED by the broker (warn + stay off) — the knob spends the operator's subscription, so the
  # only safe rounding is downward. Recommended first value: "60".
  #
  # COST at "60", per DAY: each anthropic seat runs replicas: 2, so 2 x 24 = 48 requests/seat/day,
  # 3 seats (claude-max-1/2/3) = 144 requests/day; claude-max-4 when it lands makes it 192. Each
  # request is ~14 input tokens (the Claude Code system line + a one-character user turn) and
  # 1 output token, so ~700 tokens/seat/day, ~2.1k tokens/day across the three live seats. At the
  # "15" floor those figures are 4x: 576 requests and ~8.4k tokens/day across three seats.
  # It is charged to the SAME Claude subscription the PR-reviewer agents run on. It is small, but
  # it is not free, and it is a standing charge that continues while nobody is using the estate.
  #
  # WHAT YOU WILL SEE when it works (first beat lands within one interval of the ConfigMap roll):
  #   * af_broker_usage_heartbeat_total{aud,outcome} appears — outcome=ok is the good one;
  #     `skipped` means real agent traffic suppressed the beat; `rejected` (with a 4xx in the
  #     broker log line "usage heartbeat aud=... outcome=rejected status=...") means the request
  #     shape needs a fix, not that the seat is broken.
  #   * af_broker_usage_utilization_pct{aud,window="headers_session"} and {window="headers_weekly"}
  #     gain series for the anthropic seats — today only openai/codex-pro has any, from its
  #     working vendor probe.
  #   * agentforge.chifor.me → Settings → Subscriptions: the Claude seats' 5 h and 7 d meters stop
  #     reading zero. `fetched_at` stays null and the band still says `scope_missing` — that is
  #     the VENDOR PROBE, which cannot be fixed; the header windows are the real figures.
  #
  # ⚠ CHANGING THIS VALUE ALONE DOES NOTHING. This estate runs no config reloader (no stakater
  # `reloader`, no checksum annotation on the broker Deployments) and the knob arrives via
  # `envFrom`, which is read ONCE AT POD START. Flux will apply the edit and the running brokers
  # will keep whatever they started with. Pair the edit with
  #   kubectl -n agentforge-broker rollout restart deploy/broker-anthropic-max1 \
  #     deploy/broker-anthropic-max2 deploy/broker-anthropic-claude-max-3 \
  #     deploy/broker-anthropic-claude-max-4
  # or let the next pin(agentforge) bump roll them. This cuts BOTH ways: setting it back to "0"
  # does not stop the heartbeat until the pods roll either. (The upside of read-once: a
  # crash-loop or a rollout cannot multiply the beat rate — each replica sleeps a full interval
  # before its first beat.)
  #
  # SCOPE. Anthropic seats only. This ConfigMap is shared with broker-openai-codex, but the broker
  # builds no heartbeat for an openai audience (its wham/usage probe already returns real
  # figures), so setting this here costs the Codex subscription nothing.
  AF_BROKER_USAGE_HEARTBEAT_INTERVAL_M: "60"
  # NON-SECRET ledger coordinates (documentation + operational reference). The DB login is
  # agentforge_broker: open/reserve/reconcile ONLY, NEVER close (the reaper alone holds close, design §5).
  LEDGER_HOST: "infra-pg-rw.databases.svc.cluster.local"
  LEDGER_PORT: "5432"
  LEDGER_DB: "agentforge_broker"
  LEDGER_USER: "agentforge_broker"
