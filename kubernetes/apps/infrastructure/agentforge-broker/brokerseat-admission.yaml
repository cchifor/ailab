# ValidatingAdmissionPolicies — the FAIL-CLOSED shape pins behind brokerseat-rbac.yaml. Native VAP
# (admissionregistration.k8s.io/v1, GA on this 1.31 cluster; no Kyverno in the estate), the same
# username-gated style as apps/agentforge/admission/cp-flux-guard.yaml and
# agentforge-codex-refresh/admission.yaml. failurePolicy: Fail so a CEL/eval error DENIES.
#
# WHY RBAC IS NOT ENOUGH. `create` cannot be resourceName-scoped (k8s ignores resourceNames for create)
# and RBAC cannot constrain an object's CONTENT, so "the CP may create a BrokerSeat" is really "the CP
# may create ANY BrokerSeat" and "the provisioner may create/update Deployments in agentforge-broker"
# is really "...ANY Deployment there, including a git seat's". These two policies turn the design's
# ownership rules into admission facts:
#
#   (a) agentforge-cp-brokerseat-guard — the control plane may only name provider/account/clusterIP.
#       It can never fake ownership (ownerReferences), readiness (status), a finalizer, a label or an
#       annotation on a seat, and the CR name is forced to the mechanical broker-<provider>-<account>.
#   (b) agentforge-provisioner-seat-objects-guard — everything the provisioner writes is a SEAT OBJECT:
#       named from its stem, labelled agentforge.io/broker-seat=<stem>, owned by exactly the BrokerSeat
#       <stem> (controller + blockOwnerDeletion), NEVER carrying a Flux label and NEVER replacing an
#       object that is not already this stem's — so a Flux-managed git seat is out of reach even though
#       RBAC grants `update` on the kind. Beyond names it binds STRUCTURE to what the seat template
#       renders (plan amendments F10/F11/F12 + round-2 F10): one pinned-image container running as the
#       tokenless broker SA whose Secret sources are only <stem>-{oauth,kids,ledger}; Services and the
#       PDB selecting the seat's own pods and nothing else; ExternalSecrets on the shared operator
#       store, targeting their own name, sourcing exactly operator/broker/<provider>/<account>/<kind>
#       with no template/templateFrom/find/sourceRef; a CiliumNetworkPolicy whose endpointSelector is
#       exactly the seat's own identity with only the template's ingress/egress rule shapes (identity
#       peers in the template's namespaces, the provider's FQDNs on 443) and the template's egressDeny
#       belt. A seat object that would widen the seat's network reach, mount another seat's credential
#       or hand a pod another seat's identity is refused at admission, whatever the controller does.
#
# The fixture table in scripts/check-seat-guard-cel.py evaluates BOTH policies' CEL (cel-python) against
# the stamped render of a real git seat and one adversarial mutation per clause; it runs in
# .gitea/workflows/tenant-guard-cel.yaml. Nothing else in the estate evaluates this CEL (a client
# dry-run parses YAML; a server dry-run proves it compiles) — re-run it after EVERY edit here.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agentforge-cp-brokerseat-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      # CREATE is the CP's only intended write (brokerseat-rbac.yaml grants no update/patch/status).
      # UPDATE and the status subresource are matched too so the pins hold even if that RBAC were ever
      # widened: a CR the controller has adopted carries a finalizer, so (1) refuses any CP update of
      # it, and (6) refuses any status write outright.
      - apiGroups: ["agentforge.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["brokerseats", "brokerseats/status"]
  matchConditions:
    - name: only-agentforge-cp
      expression: "request.userInfo.username == 'system:serviceaccount:agentforge:agentforge-platform'"
  validations:
    # (1) No finalizers — agentforge.io/brokerseat is the PROVISIONER's finalizer, added on first sight.
    - expression: "!has(object.metadata.finalizers)"
      message: "agentforge CP may not set finalizers on a BrokerSeat (the provisioner owns the finalizer)."
    # (2) No ownerReferences — a CR is a ROOT object; only the children the provisioner renders are owned.
    - expression: "!has(object.metadata.ownerReferences)"
      message: "agentforge CP may not set ownerReferences on a BrokerSeat."
    # (3) No labels — nothing selects a BrokerSeat by label, and a Flux/broker-seat label here could
    #     only be an attempt to look like something the CP is not.
    - expression: "!has(object.metadata.labels)"
      message: "agentforge CP may not set labels on a BrokerSeat."
    # (4) No annotations — the render digest and every other stamp is the provisioner's.
    - expression: "!has(object.metadata.annotations)"
      message: "agentforge CP may not set annotations on a BrokerSeat."
    # (5) The mechanical name (the CRD's own root rule, repeated here so a CP-side violation is refused
    #     by THIS policy with THIS message whatever the CRD's schema does first).
    - expression: "object.metadata.name == 'broker-' + object.spec.provider + '-' + object.spec.account"
      message: "agentforge CP must name a BrokerSeat broker-<spec.provider>-<spec.account>."
    # (6) Never a status — readiness is the provisioner's word alone (status subresource, its RBAC only).
    - expression: "!has(object.status)"
      message: "agentforge CP may not write BrokerSeat status."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agentforge-cp-brokerseat-guard
spec:
  policyName: agentforge-cp-brokerseat-guard
  validationActions: ["Deny"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agentforge-provisioner-seat-objects-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      # EXACTLY the five child kinds brokerseat-rbac.yaml grants the provisioner (create + update).
      # NO namespace narrowing here on purpose (validation 1 DENIES any other namespace): the guard is
      # a statement about every such object this SA ever writes, not only the ones in the ns its Role
      # happens to cover today.
      - apiGroups: ["apps"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
      - apiGroups: ["policy"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["poddisruptionbudgets"]
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["externalsecrets"]
      - apiGroups: ["cilium.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ciliumnetworkpolicies"]
  matchConditions:
    - name: only-agentforge-provisioner
      expression: "request.userInfo.username == 'system:serviceaccount:openbao:agentforge-provisioner'"
  variables:
    - name: kind
      expression: "request.kind.kind"
    - name: labels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
    # The seat's STEM is the ownership label's value; validation 2 pins the object's name to it, so
    # every later clause may derive names/paths from `stem` alone.
    - name: stem
      expression: "'agentforge.io/broker-seat' in variables.labels ? variables.labels['agentforge.io/broker-seat'] : ''"
    - name: oldLabels
      expression: "(request.operation == 'UPDATE' && has(oldObject.metadata.labels)) ? oldObject.metadata.labels : {}"
    # The ONLY three Secrets a seat pod may source (the ESO targets of its own three ExternalSecrets).
    - name: seatSecrets
      expression: "[variables.stem + '-oauth', variables.stem + '-kids', variables.stem + '-ledger']"
    - name: owner
      expression: "(has(object.metadata.ownerReferences) && size(object.metadata.ownerReferences) == 1) ? object.metadata.ownerReferences[0] : {}"
    # Guarded reads of the Deployment's pod spec ({} / [] for another kind or a malformed one) so the
    # Deployment clauses can index them without nested has() chains erroring.
    - name: podSpec
      expression: "(variables.kind == 'Deployment' && has(object.spec.template) && has(object.spec.template.spec)) ? object.spec.template.spec : {}"
    - name: ctrs
      expression: "has(variables.podSpec.containers) ? variables.podSpec.containers : []"
    - name: vols
      expression: "has(variables.podSpec.volumes) ? variables.podSpec.volumes : []"
    - name: podLabels
      expression: "(variables.kind == 'Deployment' && has(object.spec.template) && has(object.spec.template.metadata) && has(object.spec.template.metadata.labels)) ? object.spec.template.metadata.labels : {}"
    # EVERY OpenBao source key an ExternalSecret names (data[].remoteRef.key + dataFrom[].extract.key;
    # a malformed entry contributes '' and fails the split check). The seat's OWN audience path is
    # re-derived from each key and compared to the stem: operator/broker/<p>/<a>/<kind> <=> broker-<p>-<a>.
    - name: esKeys
      expression: >-
        (has(object.spec.data) ? object.spec.data.map(d, (has(d.remoteRef) && has(d.remoteRef.key)) ? d.remoteRef.key : '') : []) +
        (has(object.spec.dataFrom) ? object.spec.dataFrom.map(d, (has(d.extract) && has(d.extract.key)) ? d.extract.key : '') : [])
    # The provider's upstream hosts EXACTLY as the seat template renders them (broker_templates/
    # {anthropic,openai}.yaml egress rule (3)); an anthropic seat may not name an OpenAI host or vice
    # versa. matchName only — a matchPattern wildcard is refused by validation 12. Two-way on purpose:
    # validation 2 already forces the stem's provider into {anthropic, openai}, and cel-go's checker
    # refuses to join a typed list with an untyped `[]` in a ternary.
    - name: fqdnAllow
      expression: >-
        variables.stem.startsWith('broker-openai-')
          ? ['chatgpt.com', 'auth.openai.com']
          : ['api.anthropic.com', 'console.anthropic.com', 'claude.ai']
  validations:
    # (1) NAMESPACE — a seat object lives in agentforge-broker and nowhere else (the Role is namespaced
    #     there today; this holds even if that ever widens).
    - expression: >-
        request.namespace == 'agentforge-broker' &&
        (!has(object.metadata.namespace) || object.metadata.namespace == 'agentforge-broker')
      message: "agentforge provisioner may only write seat objects in namespace agentforge-broker."
    # (2) NAME + OWNERSHIP LABEL — the object carries agentforge.io/broker-seat=<stem> where <stem> is a
    #     mechanical broker-<provider>-<account> (<= 52 chars, the CP renderer's _STEM_MAX), and its
    #     name is the template's name for its kind: <stem> (Deployment/PDB/CNP), <stem> or
    #     <stem>-headless (Service), <stem>-{oauth,kids,ledger} (ExternalSecret). Hence every name
    #     starts with 'broker-' and no seat can write under another seat's stem.
    - expression: >-
        variables.stem.matches('^broker-(anthropic|openai)-[a-z0-9]+(-[a-z0-9]+)*$') &&
        size(variables.stem) <= 52 &&
        ((variables.kind in ['Deployment', 'PodDisruptionBudget', 'CiliumNetworkPolicy'] &&
            object.metadata.name == variables.stem) ||
         (variables.kind == 'Service' &&
            (object.metadata.name == variables.stem || object.metadata.name == variables.stem + '-headless')) ||
         (variables.kind == 'ExternalSecret' &&
            object.metadata.name in variables.seatSecrets))
      message: "agentforge provisioner seat objects must carry agentforge.io/broker-seat=broker-<provider>-<account> and be named <stem> / <stem>-headless / <stem>-{oauth,kids,ledger} for their kind."
    # (3) OWNERSHIP — exactly ONE ownerReference: the BrokerSeat <stem>, controller + blockOwnerDeletion,
    #     so the CP's Foreground delete of the CR is what removes the object (and only that CR's).
    - expression: >-
        has(object.metadata.ownerReferences) && size(object.metadata.ownerReferences) == 1 &&
        has(variables.owner.apiVersion) && variables.owner.apiVersion == 'agentforge.io/v1alpha1' &&
        has(variables.owner.kind) && variables.owner.kind == 'BrokerSeat' &&
        has(variables.owner.name) && variables.owner.name == variables.stem &&
        has(variables.owner.uid) && size(variables.owner.uid) > 0 &&
        has(variables.owner.controller) && variables.owner.controller == true &&
        has(variables.owner.blockOwnerDeletion) && variables.owner.blockOwnerDeletion == true
      message: "agentforge provisioner seat objects must have exactly one ownerReference: BrokerSeat <stem> (agentforge.io/v1alpha1) with controller=true and blockOwnerDeletion=true."
    # (4) NEVER A FLUX OBJECT — no kustomize.toolkit.fluxcd.io label on the new object, and on UPDATE the
    #     object being replaced must ALREADY be this stem's seat object (same ownership label, one
    #     ownerReference with the SAME uid) and must not carry a Flux label either. A Flux-managed git
    #     seat's Deployment/Service/PDB/ExternalSecret/CNP is therefore unreachable, and a previous CR
    #     incarnation's object (different uid, still being GC'd) cannot be adopted by an update.
    - expression: >-
        !('kustomize.toolkit.fluxcd.io/name' in variables.labels) &&
        !('kustomize.toolkit.fluxcd.io/namespace' in variables.labels) &&
        (request.operation != 'UPDATE' ||
          (!('kustomize.toolkit.fluxcd.io/name' in variables.oldLabels) &&
           !('kustomize.toolkit.fluxcd.io/namespace' in variables.oldLabels) &&
           'agentforge.io/broker-seat' in variables.oldLabels &&
           variables.oldLabels['agentforge.io/broker-seat'] == variables.stem &&
           has(oldObject.metadata.ownerReferences) && size(oldObject.metadata.ownerReferences) == 1 &&
           has(oldObject.metadata.ownerReferences[0].uid) &&
           oldObject.metadata.ownerReferences[0].uid == variables.owner.uid))
      message: "agentforge provisioner may not write a Flux-labelled object, and may only update an object that already belongs to the same BrokerSeat (same agentforge.io/broker-seat label and owner uid)."
    # (5) DEPLOYMENT POD SHAPE — exactly one container (no init/ephemeral), the DIGEST-PINNED orchestrator
    #     image (a tag or another repository is refused), the tokenless broker SA with no auto-mounted
    #     token, no host namespaces.
    - expression: >-
        variables.kind != 'Deployment' ||
        (size(variables.ctrs) == 1 &&
         !has(variables.podSpec.initContainers) && !has(variables.podSpec.ephemeralContainers) &&
         has(variables.ctrs[0].image) &&
         variables.ctrs[0].image.matches('^registry[.]chifor[.]me/agentforge/orchestrator@sha256:[0-9a-f]{64}$') &&
         has(variables.podSpec.serviceAccountName) && variables.podSpec.serviceAccountName == 'agentforge-broker' &&
         has(variables.podSpec.automountServiceAccountToken) && variables.podSpec.automountServiceAccountToken == false &&
         (!has(variables.podSpec.hostNetwork) || variables.podSpec.hostNetwork == false) &&
         (!has(variables.podSpec.hostPID) || variables.podSpec.hostPID == false) &&
         (!has(variables.podSpec.hostIPC) || variables.podSpec.hostIPC == false))
      message: "agentforge provisioner seat Deployment must run exactly one container on the digest-pinned registry.chifor.me/agentforge/orchestrator@sha256:<64hex> image as serviceAccountName agentforge-broker with automountServiceAccountToken=false, no init/ephemeral containers, no host namespaces."
    # (6) DEPLOYMENT IDENTITY — the selector and the pod template's app.kubernetes.io/name are the seat's
    #     OWN stem (component=broker is what the sandbox egress CNP admits by identity). A pod labelled
    #     as another seat would receive that seat's Service traffic and inherit its CNP identity.
    - expression: >-
        variables.kind != 'Deployment' ||
        (has(object.spec.selector) && has(object.spec.selector.matchLabels) &&
         object.spec.selector.matchLabels == {'app.kubernetes.io/name': variables.stem} &&
         !has(object.spec.selector.matchExpressions) &&
         'app.kubernetes.io/name' in variables.podLabels &&
         variables.podLabels['app.kubernetes.io/name'] == variables.stem &&
         'app.kubernetes.io/component' in variables.podLabels &&
         variables.podLabels['app.kubernetes.io/component'] == 'broker' &&
         !('kustomize.toolkit.fluxcd.io/name' in variables.podLabels))
      message: "agentforge provisioner seat Deployment must select and label its pods app.kubernetes.io/name=<stem> (component=broker), never another seat's identity."
    # (7) DEPLOYMENT SECRET SOURCES — volumes are only `secret` (one of <stem>-{oauth,kids,ledger}) or
    #     `emptyDir` — no hostPath/projected/configMap/PVC/csi/downwardAPI/nfs/ephemeral — and every
    #     env secretKeyRef / envFrom secretRef names one of those three Secrets. The kubelet resolves
    #     these WITHOUT the pod's SA having Secret RBAC, so this is the only thing that keeps another
    #     seat's OAuth (or any other Secret in the namespace) out of a seat pod.
    - expression: >-
        variables.kind != 'Deployment' ||
        (variables.vols.all(v,
           (has(v.secret) ? (has(v.secret.secretName) && v.secret.secretName in variables.seatSecrets)
                          : has(v.emptyDir)) &&
           !has(v.hostPath) && !has(v.projected) && !has(v.configMap) && !has(v.persistentVolumeClaim) &&
           !has(v.csi) && !has(v.downwardAPI) && !has(v.nfs) && !has(v.ephemeral)) &&
         variables.ctrs.all(c,
           (!has(c.env) || c.env.all(e,
              !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
              (has(e.valueFrom.secretKeyRef.name) && e.valueFrom.secretKeyRef.name in variables.seatSecrets))) &&
           (!has(c.envFrom) || c.envFrom.all(e,
              !has(e.secretRef) || (has(e.secretRef.name) && e.secretRef.name in variables.seatSecrets)))))
      message: "agentforge provisioner seat Deployment may mount only emptyDir and its own <stem>-{oauth,kids,ledger} Secrets, and may reference only those Secrets via env secretKeyRef / envFrom secretRef."
    # (8) SERVICES — selector is exactly the seat's own pods, type ClusterIP with no external exposure,
    #     ports only the template's 8700/9464 (no nodePort); <stem>-headless is the headless one
    #     (clusterIP None) and <stem> is the PINNED one (a clusterIP inside the Service CIDR 10.96/12).
    - expression: >-
        variables.kind != 'Service' ||
        (has(object.spec.selector) && object.spec.selector == {'app.kubernetes.io/name': variables.stem} &&
         has(object.spec.type) && object.spec.type == 'ClusterIP' &&
         !has(object.spec.externalIPs) && !has(object.spec.externalName) && !has(object.spec.loadBalancerIP) &&
         has(object.spec.ports) && object.spec.ports.all(p,
           has(p.port) && p.port in [8700, 9464] && (!has(p.nodePort) || p.nodePort == 0)) &&
         ((object.metadata.name == variables.stem + '-headless' &&
             has(object.spec.clusterIP) && object.spec.clusterIP == 'None') ||
          (object.metadata.name == variables.stem &&
             has(object.spec.clusterIP) &&
             object.spec.clusterIP.matches('^10[.](9[6-9]|10[0-9]|11[01])[.](25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.](25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$'))))
      message: "agentforge provisioner seat Services must select app.kubernetes.io/name=<stem> only, be ClusterIP (no externalIPs/externalName/loadBalancer/nodePort) on ports 8700/9464, with <stem>-headless clusterIP None and <stem> pinned inside 10.96.0.0/12."
    # (9) PDB — selects exactly the seat's own pods.
    - expression: >-
        variables.kind != 'PodDisruptionBudget' ||
        (has(object.spec.selector) && has(object.spec.selector.matchLabels) &&
         object.spec.selector.matchLabels == {'app.kubernetes.io/name': variables.stem} &&
         !has(object.spec.selector.matchExpressions))
      message: "agentforge provisioner seat PodDisruptionBudget must select app.kubernetes.io/name=<stem> only."
    # (10) EXTERNALSECRET STORE + TARGET — the SHARED operator SecretStore agentforge-broker-store (kind
    #      SecretStore, never a ClusterSecretStore), target.name == its own name with creationPolicy
    #      Owner, NO target.template (the seat template renders none — so no templateFrom[].secret
    #      reading another seat's Secret into this one), no per-source sourceRef/generatorRef store
    #      override, no dataFrom.find wildcard, no rewrite.
    - expression: >-
        variables.kind != 'ExternalSecret' ||
        (has(object.spec.secretStoreRef) &&
         has(object.spec.secretStoreRef.name) && object.spec.secretStoreRef.name == 'agentforge-broker-store' &&
         has(object.spec.secretStoreRef.kind) && object.spec.secretStoreRef.kind == 'SecretStore' &&
         has(object.spec.target) && has(object.spec.target.name) &&
         object.spec.target.name == object.metadata.name &&
         has(object.spec.target.creationPolicy) && object.spec.target.creationPolicy == 'Owner' &&
         !has(object.spec.target.template) &&
         (!has(object.spec.data) || object.spec.data.all(d, !has(d.sourceRef))) &&
         (!has(object.spec.dataFrom) || object.spec.dataFrom.all(d,
            !has(d.find) && !has(d.sourceRef) && !has(d.generatorRef) && !has(d.rewrite))))
      message: "agentforge provisioner seat ExternalSecrets must use secretStoreRef {agentforge-broker-store, SecretStore}, target their own name with creationPolicy Owner, carry no target.template, and set no find/sourceRef/generatorRef/rewrite."
    # (11) EXTERNALSECRET SOURCES — exactly the template's source per kind, on the seat's OWN audience
    #      path: <stem>-oauth = ONE dataFrom.extract of operator/broker/<p>/<a>/oauth (and no data);
    #      <stem>-kids = ONE data entry registry.json <- .../kids property registry.json; <stem>-ledger =
    #      ONE data entry AF_BROKER_LEDGER_DSN <- .../ledger property AF_BROKER_LEDGER_DSN (each with no
    #      dataFrom). Every key must re-derive THIS stem (broker-<p>-<a>), so another audience's
    #      credential, a tenant path or an unrelated operator doc can never be synced into a seat.
    - expression: >-
        variables.kind != 'ExternalSecret' ||
        (variables.esKeys.all(k,
           size(k.split('/')) == 5 && k.split('/')[0] == 'operator' && k.split('/')[1] == 'broker' &&
           k.split('/')[2] in ['anthropic', 'openai'] &&
           'broker-' + k.split('/')[2] + '-' + k.split('/')[3] == variables.stem) &&
         ((object.metadata.name == variables.stem + '-oauth' &&
             !has(object.spec.data) && has(object.spec.dataFrom) && size(object.spec.dataFrom) == 1 &&
             has(object.spec.dataFrom[0].extract) && has(object.spec.dataFrom[0].extract.key) &&
             object.spec.dataFrom[0].extract.key.split('/')[4] == 'oauth') ||
          (object.metadata.name == variables.stem + '-kids' &&
             !has(object.spec.dataFrom) && has(object.spec.data) && size(object.spec.data) == 1 &&
             has(object.spec.data[0].secretKey) && object.spec.data[0].secretKey == 'registry.json' &&
             has(object.spec.data[0].remoteRef) && has(object.spec.data[0].remoteRef.key) &&
             object.spec.data[0].remoteRef.key.split('/')[4] == 'kids' &&
             has(object.spec.data[0].remoteRef.property) && object.spec.data[0].remoteRef.property == 'registry.json') ||
          (object.metadata.name == variables.stem + '-ledger' &&
             !has(object.spec.dataFrom) && has(object.spec.data) && size(object.spec.data) == 1 &&
             has(object.spec.data[0].secretKey) && object.spec.data[0].secretKey == 'AF_BROKER_LEDGER_DSN' &&
             has(object.spec.data[0].remoteRef) && has(object.spec.data[0].remoteRef.key) &&
             object.spec.data[0].remoteRef.key.split('/')[4] == 'ledger' &&
             has(object.spec.data[0].remoteRef.property) && object.spec.data[0].remoteRef.property == 'AF_BROKER_LEDGER_DSN')))
      message: "agentforge provisioner seat ExternalSecrets must source exactly operator/broker/<provider>/<account>/{oauth|kids|ledger} for THEIR OWN stem in the seat template's shape (oauth: one dataFrom.extract; kids: one data entry registry.json; ledger: one data entry AF_BROKER_LEDGER_DSN)."
    # (12) CILIUMNETWORKPOLICY — endpointSelector is EXACTLY the seat's own pod identity (never empty,
    #      never another seat); no `specs`, no nodeSelector, no ingressDeny; every ingress rule is
    #      identity-based (fromEndpoints in the template's peer namespaces, no entities/CIDR/nodes) on
    #      ports 8700/9464 only; every egress allow rule is either toEndpoints in kube-system/databases
    #      on 53/5432 (L7 `dns` visibility allowed) or toFQDNs matchName from the provider's allowlist
    #      on 443 — no toEntities/toCIDR/toServices/toGroups/toNodes, no matchPattern; and the template's
    #      egressDeny belt (host/remote-node + the private, link-local and loopback CIDRs, ::/0) is
    #      present. A CNP can only ADD reach for the pods it selects, so this is what keeps a seat pod
    #      from being opened to the world or to another seat's identity.
    - expression: >-
        variables.kind != 'CiliumNetworkPolicy' ||
        (!has(object.specs) && has(object.spec) &&
         has(object.spec.endpointSelector) &&
         object.spec.endpointSelector == {'matchLabels': {'app.kubernetes.io/name': variables.stem}} &&
         !has(object.spec.nodeSelector) && !has(object.spec.ingressDeny) &&
         has(object.spec.ingress) && object.spec.ingress.all(r,
           has(r.fromEndpoints) && size(r.fromEndpoints) >= 1 && r.fromEndpoints.all(f,
             has(f.matchLabels) && !has(f.matchExpressions) &&
             'k8s:io.kubernetes.pod.namespace' in f.matchLabels &&
             f.matchLabels['k8s:io.kubernetes.pod.namespace'] in ['agentforge', 'agentforge-sandbox', 'monitoring', 'openbao']) &&
           !has(r.fromEntities) && !has(r.fromCIDR) && !has(r.fromCIDRSet) && !has(r.fromNodes) &&
           !has(r.fromRequires) && !has(r.fromGroups) && !has(r.icmps) && !has(r.authentication) &&
