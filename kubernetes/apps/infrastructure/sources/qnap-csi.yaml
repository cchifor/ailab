# The QNAP-CSI-PlugIn (Trident-based) chart ships only in-repo (no public Helm repo), so it's
# sourced as a GitRepository + HelmRelease (chart path ./Helm/trident). Driver csi.trident.qnap.io.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: qnap-csi
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/qnap-dev/QNAP-CSI-PlugIn
  ref:
    tag: v1.6.2
    # Pinned to the tag's commit (annotated tag ef11525e -> commit 8e88467e): commit takes precedence,
    # so a force-moved tag cannot change the deployed storage driver. Bump both together.
    commit: 8e88467ecf612fb84bbcd4caf300b624fca41de2
