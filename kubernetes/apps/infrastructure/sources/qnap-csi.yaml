# The QNAP-CSI-PlugIn (Trident-based) chart ships only in-repo (no public Helm repo), so it's
# sourced as a GitRepository + HelmRelease (chart path ./Helm/trident). Driver csi.trident.qnap.io.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: qnap-csi
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/qnap-dev/QNAP-CSI-PlugIn
  ref:
    tag: v1.6.2
    # Tag only - NO `commit:`. With a commit and no branch, source-controller does a FULL clone of this
    # repository; on 2026-10-09 that crash-looped source-controller (liveness kill, exit 137) and stalled
    # every Flux source for ~45 min. The tag is the pin; v1.6.2 = commit 8e88467e (annotated tag ef11525e).
