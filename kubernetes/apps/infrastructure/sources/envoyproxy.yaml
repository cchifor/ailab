# Envoy Gateway charts. Only the CRDs chart (gateway-crds-helm) is installed by the operator, for
# the Workbricks cell (infrastructure/envoy-gateway-crds/); the cell runs its own controller.
# OCI-only on Docker Hub, so an `type: oci` HelmRepository like kro.yaml. source-controller resolves
# a pinned tag once per chart interval, well inside Docker Hub's anonymous pull budget.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: envoyproxy
  namespace: flux-system
spec:
  type: oci
  interval: 24h
  url: oci://docker.io/envoyproxy
