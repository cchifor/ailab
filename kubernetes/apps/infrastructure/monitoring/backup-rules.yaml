# Alerts over the 3-2-1 backup chain (ADR 0010). Written after an incident in which BOTH the
# authoritative local copy and the off-site copy were dead simultaneously and nothing said so:
#
#   * Velero (copy #2) — a stray `manual-dumps/` directory written into the `velero` bucket on
#     2026-08-05 made the BackupStorageLocation fail validation, so EVERY backup failed from that
#     day on. Velero's own metrics were never scraped (the chart ships its ServiceMonitor off), so
#     there was no series to alert on. Found only by reading BSL status by hand, 5 days later.
#   * rclone-offsite (copy #3) — `--max-delete 100` against a Kopia GC backlog of 7446 aborted every
#     run, for 41 consecutive days. No rule referenced the job.
#
# Both failure modes are STALENESS, not error-rate: the jobs were running and visibly "there", they
# just stopped producing. Every rule below is therefore anchored on a last-success timestamp rather
# than on a failure counter, so a silently unproductive backup is loud by default.
#
# `release: kube-prometheus-stack` so the operator's ruleSelector picks it up (same convention as
# k6-load-rules.yaml / soak-leak-rules.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backup-chain
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: backup-chain
      rules:
        # Copy #3 (off-site). Threshold 48h against a daily 04:00 schedule: one missed night is
        # tolerated (Drive rate-limits can legitimately push a run long), two is a real fault.
        - alert: BackupOffsiteSyncStale
          expr: |
            (time() - kube_cronjob_status_last_successful_time{namespace="backup-offsite", cronjob="rclone-offsite"}) > 172800
            or absent(kube_cronjob_status_last_successful_time{namespace="backup-offsite", cronjob="rclone-offsite"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Off-site backup sync has not succeeded in >48h"
            description: >-
              rclone-offsite last completed successfully
              {{ with query "time() - kube_cronjob_status_last_successful_time{namespace='backup-offsite', cronjob='rclone-offsite'}" }}{{ . | first | value | humanizeDuration }}{{ end }}
              ago. Google Drive is copy #3 of the 3-2-1; the local versitygw copy is unaffected.
              Check `kubectl -n backup-offsite logs job/rclone-offsite-<id>` for an ABORT line from
              the source-floor guard, or an rclone exit code.

        # Copy #2 (local, authoritative) — the one that actually matters for restores.
        # 36h against a 02:00 daily schedule. `absent()` is load-bearing: if Velero has NEVER
        # produced a successful backup the timestamp series does not exist at all, and a bare
        # staleness comparison would silently evaluate to nothing instead of firing.
        - alert: VeleroBackupStale
          expr: |
            (time() - max(velero_backup_last_successful_timestamp{schedule!=""})) > 129600
            or absent(velero_backup_last_successful_timestamp{schedule!=""})
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "No successful Velero backup in >36h"
            description: >-
              The authoritative local backup copy is not being produced. Check the
              BackupStorageLocation first — `kubectl -n velero get backupstoragelocation default
              -o jsonpath='{.status.message}'`. An `Unavailable` BSL fails every backup, and the
              usual cause is an unexpected top-level directory written into the `velero` bucket.

        # The rule above aggregates with max() ACROSS schedules on purpose — it answers "is the
        # chain producing anything at all", and the daily is what makes that question answerable
        # every 24h. The cost is that a healthy daily masks a weekly that has stopped succeeding
        # forever, and the weekly is the only 30-day restore point.
        #
        # The obvious fix — `max by (schedule)` on the rule above — is WRONG: the weekly
        # legitimately goes 168h between successes, so a 36h threshold would fire against it
        # permanently. It needs its own rule with its own threshold instead.
        #
        # 8 days = the 7-day cadence plus 24h of OVERRUN tolerance. It does NOT tolerate a missed
        # Sunday: from a last success at Sun 03:00Z, a miss on the next Sunday puts age past 8d on
        # the MONDAY after that first miss, and it fires then. (Tolerating one full miss and firing
        # only on the second would need >14d.) An earlier revision of this comment claimed the
        # opposite — "tolerates one missed Sunday but not two" — which was simply wrong arithmetic.
        #
        # Firing after the FIRST miss is the intended policy, not a side effect: this is the only
        # 30-day restore point, and waiting a fortnight to learn it has stopped is the same
        # "silently not producing" failure this whole rule group exists to catch. A healthy week
        # peaks at 7d + runtime (~40min), so there is ~23h of margin against a false page.
        #
        # Note the two branches have different tolerances by nature: `> 691200` waits 8 days, while
        # `absent()` + `for: 1h` fires within the hour. That is deliberate — an absent series means
        # the rule can no longer see its target at all (a renamed or mistyped `schedule` label, the
        # schedule deleted), which should be loud immediately rather than after a week of silence.
        - alert: VeleroWeeklyBackupStale
          expr: |
            (time() - max(velero_backup_last_successful_timestamp{schedule="velero-weekly"})) > 691200
            or absent(velero_backup_last_successful_timestamp{schedule="velero-weekly"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No successful WEEKLY Velero backup in >8 days"
            description: >-
              The 30-day restore point is not being produced, even though the daily may look
              healthy — VeleroBackupStale aggregates across schedules and cannot see this. Check
              `kubectl -n velero get backups.velero.io -l velero.io/schedule-name=velero-weekly`
              for the most recent attempt and its phase.

        # A PartiallyFailed backup does NOT advance velero_backup_last_successful_timestamp, so ONE
        # bad volume blanks the success signal for the whole chain and presents identically to "the
        # backup system is dead" — 36h later VeleroBackupStale fires critical and says nothing about
        # which volume. That is what happened on 2026-08-16: csi-driver-nfs implements a snapshot by
        # tar-ing the volume directory, Valkey's AOF grew while tar was reading it
        # ("archive/tar: write too long"), and that single 19 MB cache volume made both the daily and
        # the weekly read as total failures. This rule names the condition early, at warning, while
        # the rest of the backup is in fact fine — the staleness rule above stays as the backstop.
        - alert: VeleroBackupPartiallyFailing
          expr: increase(velero_backup_partial_failure_total{schedule!=""}[24h]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "A scheduled Velero backup completed with errors in the last 24h"
            description: >-
              At least one scheduled backup finished PartiallyFailed, so its volume data is
              incomplete AND the chain's last-success timestamp did not advance. Find the failing
              item with `kubectl -n velero exec deploy/velero -- /velero backup logs <name>
              --insecure-skip-tls-verify | grep level=error` (the flag is needed because versitygw
              serves a self-signed cert). A volume that legitimately cannot be snapshotted should be
              labelled velero.io/exclude-from-backup and recorded in ADR 0010, not left to fail
              nightly.

        # PartiallyFailed is alerted above; FAILED was not, which is the gap the 2026-09-09 audit
        # found. velero-daily-20260908020031 finished phase=Failed with 55 errors and zero objects on
        # the store, and raised no dedicated alert at all — the only rule that eventually caught it was
        # VeleroBackupStale, at 36h + for:1h, i.e. 37 HOURS after the backup that did not happen.
        # The counter is scraped and live (3 series); nothing referenced it.
        #
        # `increase(...[6h])`, not `> 0` on the lifetime counter: a raw counter stays non-zero forever
        # after one failure, so the alert would never resolve and would be silenced within a week.
        # {schedule!=""} for the same reason as the two rules around it — an ad-hoc `velero backup
        # create` that fails is the operator's business, not a page.
        - alert: VeleroBackupFailing
          expr: increase(velero_backup_failure_total{schedule!=""}[6h]) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "A scheduled Velero backup FAILED in the last 6h"
            description: >-
              A scheduled backup finished phase=Failed — not PartiallyFailed. Nothing usable was
              written for that run, so the restore point does not exist. Check
              `kubectl -n velero get backups.velero.io --sort-by=.status.startTimestamp` and the
              stored results object; on 2026-09-08 the cause was the object store being unreachable,
              which VersitygwProbeFailed should catch first.

        # Catches a BSL that fails validation while an older success keeps the staleness rule quiet.
        # {schedule!=""} matches the other rules in this group: the metric also carries a series
        # with an EMPTY schedule label for ad-hoc backups, so without the filter a hand-run
        # `velero backup create` that fails validation pages critical for 6h as though a scheduled
        # producer had died. Verified live — the empty-schedule series exists alongside the
        # per-schedule ones.
        - alert: VeleroBackupValidationFailing
          expr: increase(velero_backup_validation_failure_total{schedule!=""}[6h]) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Velero backups are failing validation"
            description: >-
              Velero rejected a backup before it ran. Almost always a BackupStorageLocation problem
              rather than a workload problem; see `.status.message` on the BSL.

        # Copy #2's other producer — the age-encrypted etcd snapshot (talos-backup, 01:00 daily).
        # This is the total-cluster-loss path, so it is held to the same 36h bar as Velero.
        - alert: TalosEtcdBackupStale
          expr: |
            (time() - kube_cronjob_status_last_successful_time{namespace="talos-backup", cronjob="talos-backup"}) > 129600
            or absent(kube_cronjob_status_last_successful_time{namespace="talos-backup", cronjob="talos-backup"})
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "No successful Talos etcd snapshot in >36h"
            description: >-
              Without a recent etcd snapshot, a total cluster loss is only recoverable to the last
              good snapshot. The SOPS-encrypted Talos secrets bundle in git is a separate artifact
              and is unaffected.
        # ── versitygw round-trip probe (W4) ────────────────────────────────────────────────────────
        # These two alerts exist because on 2026-09-08 versitygw was unusable for ~4.5h and NOTHING
        # said so. The first alert of the whole incident was GiteaForgeDown, 1.5h in — a downstream
        # symptom of a storage failure that had no alert of its own.
        #
        # Why the existing signals were silent, and why these are shaped as they are:
        #   * a USB stall left versitygw ACCEPTING TCP while its POSIX backend was blocked on hung
        #     I/O, so `storage-fabric-probe`'s blackbox tcp_connect module was GREEN throughout;
        #   * an unauthenticated HTTPS request returns 403 from the auth layer WITHOUT touching the
        #     backend, so an HTTP check would also have been green;
        #   * therefore the probe these watch does a real authenticated PUT -> GET -> verify content
        #     -> DELETE (talos-backup/versitygw-probe.yaml). Only that proves the disk is usable.
        #
        # The pair is deliberate: Failed catches a backend that is answering-but-broken within a
        # couple of minutes, while Stale catches the probe not running AT ALL (suspended CronJob,
        # unschedulable, image pull failure) — a broken probe must never read as healthy.
        - alert: VersitygwProbeFailed
          # Fires when the most recent FAILURE is newer than the most recent SUCCESS.
          #
          # The obvious form — `max(kube_job_status_failed{...}) > 0` — is wrong, and wrong in the
          # direction that matters: kube_job_status_failed is a per-Job gauge that stays 1 for as
          # long as the failed Job object is retained. With failedJobsHistoryLimit: 6 and
          # ttlSecondsAfterFinished: 3600 that is up to an hour, so a single failed probe would keep
          # a CRITICAL alert firing for an hour after the object store recovered. An alert that
          # reports an outage that is over is training to ignore it.
          #
          # Comparing timestamps makes recovery self-clearing: kube_job_status_completion_time is
          # only set on SUCCESS, so as soon as one probe passes, the right-hand side moves past the
          # stale failure and the alert resolves — while the failed Jobs stay in place for triage.
          #
          # If a probe has NEVER succeeded the right-hand side has no series and this cannot fire.
          # That gap is deliberate and covered by VersitygwProbeStale's absent() clause below, which
          # is the alert designed for "no successful round-trip", including the never case.
          expr: |
            max(
              kube_job_status_start_time{namespace="talos-backup", job_name=~"versitygw-probe-.*"}
              and on (namespace, job_name)
              (kube_job_status_failed{namespace="talos-backup", job_name=~"versitygw-probe-.*"} > 0)
            )
            >
            max(kube_job_status_completion_time{namespace="talos-backup", job_name=~"versitygw-probe-.*"})
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "versitygw object store failed a read/write round-trip"
            description: >-
              The versitygw probe could not complete PUT -> GET -> verify -> DELETE against
              192.168.1.225:7070. The object store is NOT usable even if it is still accepting
              connections — that exact combination (listening, unable to serve) is what caused the
              2026-09-08 outage. Velero, the Talos etcd snapshots and the off-site sync all depend on
              it and will fail until it is fixed; they are bounded by their own deadlines so they
              will report rather than hang. Check the USB disk on the QNAP first:
              `dmesg | grep -iE 'usb|jbd2|ext4'` — a stalled USB bridge leaves the ext4 journal
              thread in D-state and every read on that filesystem hangs. Restarting versitygw does
              NOT fix that; the device needs a reset or a replug.
        - alert: VersitygwProbeStale
          expr: |
            (time() - kube_cronjob_status_last_successful_time{namespace="talos-backup", cronjob="versitygw-probe"}) > 1800
            or absent(kube_cronjob_status_last_successful_time{namespace="talos-backup", cronjob="versitygw-probe"})
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "versitygw probe has not succeeded in >30m (it runs every 10m)"
            description: >-
              No successful versitygw round-trip for over 30 minutes — three missed runs. Either the
              object store is failing (see VersitygwProbeFailed, which should also be firing) or the
              probe itself is not running: CronJob suspended, pods unschedulable, or the rclone image
              unpullable. A probe that silently stops running is indistinguishable from a healthy
              backend, which is the failure mode this alert exists to prevent. Check
              `kubectl -n talos-backup get cronjob versitygw-probe` and its recent Jobs.
