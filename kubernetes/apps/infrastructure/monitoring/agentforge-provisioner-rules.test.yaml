      - { eval_time: 9m,  alertname: ForgeProvisionerNotProgressing, exp_alerts: [] }
      - { eval_time: 14m, alertname: ForgeProvisionerNotProgressing, exp_alerts: [] }
      - eval_time: 15m
        alertname: ForgeProvisionerNotProgressing
        exp_alerts:
          - exp_labels:
              namespace: openbao
              pod: agentforge-provisioner-696fdc794d-gfphx
              severity: warning
            exp_annotations:
              summary: >-
                AgentForge provisioner agentforge-provisioner-696fdc794d-gfphx is up but has
