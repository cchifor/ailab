# Alerts for the LLM router (namespace llm-router; metrics via apps/llm-router/podmonitor.yaml,
# job=llm-router; series from the router's `metrics` plugin, llm-router README § Metrics).
#
# WHY THIS EXISTS: on 2026-10-14 OpenAI's "Degraded performance in Codex" refused 20-30 % of the
# router's requests from 06:00 to past 09:00 UTC (487 of 2,277 requests failed in three hours, 419
# of them `server_is_overloaded`; 18-30 % per hour against a 24 h baseline of 0-3 %), two of the
# five Codex accounts had been at 100 % of their weekly
# window since the previous evening, and the other three were burning toward it at about 1 % every
# 9 minutes - and nothing fired, because the router exported nothing. The dev workers, the reviewer
# bots and the platform's production key all route through it.
#
# THRESHOLDS: the failure ratio is per ROUTE, because the routes differ by an order of magnitude in
# traffic (dw-1 at ~450/h, codex-reviewer at ~9/h), and it is gated on at least 10 requests per 15
# minutes (the ratio over three requests is noise). 10 % for 15 minutes: the incident ran at 18-30 %
# per hour for three hours, while the healthy day never passed 3 % in any hour (3 h journal export
# 2026-10-14 05:58-08:46 UTC, and the 24 h export before it). The limit rules read the gauges the
# usage plugin keeps from every reply, so they fire on the provider's own numbers.
#
# ATTRIBUTION (2026-10-15): the second overload window, 06:00-09:35 UTC the next day, fired the route
# rule for dw-3 at 27 % and was read as a route, conversation-binding and retry problem; it was the
# provider's capacity, on every Codex account (15-31 % of every account's attempts per hour, every
# dev-worker conversation, siblings shedding the same conversation at the same rate), and its
# earliest sign was the time to first content: a steady 31 s on every account from 06:00, cached and
# cold prompts alike, against about 3 s the evening before with the same 100-180k-token contexts,
# an hour before the first failure ratio crossed a threshold. Two rules carry that reading:
# LlmRouterProviderOverloadShareHigh (the overload share per PROVIDER, from the attempts counter
# that already existed) and LlmRouterFirstContentSlow (the provider's median time to first content,
# from the `llm_router_first_content_seconds` histogram the router exports since
# router-0.1.0-20261015-overload-attribution). Their descriptions say what NOT to do: a provider-wide
# overload is not fixed by releasing bindings, re-keying or repointing routes.
#
# `release: kube-prometheus-stack` so the operator's ruleSelector picks it up.
# llm-router-rules.test.yaml pins that every rule fires on the incident's shape and stays silent on
# the healthy one; scripts/rules-lint.sh runs it on every PR.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llm-router
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: llm-router
      rules:
        # FIRST, because it keeps the rest honest: every rule below reads a series from this one
        # target, and a rule over an absent series never fires. `absent()` catches the monitor
        # selecting nothing at all (a label rename, a chart upgrade); `up == 0` a pod that is there
        # but not answering on 9464.
        - alert: LlmRouterMetricsAbsent
          expr: absent(up{job="llm-router"})
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "No llm-router scrape target (PodMonitor selects nothing)"
            description: >-
              Prometheus has had no up{job="llm-router"} series for 15m: the PodMonitor
              apps/llm-router/podmonitor.yaml selects no pod (label change, namespace, or the
              monitor is gone). Every other LlmRouter* alert is blind while this one is active.
        - alert: LlmRouterScrapeDown
          expr: up{job="llm-router"} == 0
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "llm-router metrics port not answering ({{ $labels.pod }})"
            description: >-
              The router pod {{ $labels.pod }} has not answered on its metrics port (9464) for 10m.
              A rollout gap is under a minute; this is the port not opened (ROUTER_METRICS_PORT,
              the metrics plugin disabled) or NetworkPolicy llm-router no longer admitting
              Prometheus. The LlmRouter* alerts below cannot fire while this one is active.
        # Failed requests (status="failed": not cancelled, not deferred) as a share of all requests
        # ended on the route, over 15 minutes, on routes with at least 10 requests in that window.
        - alert: LlmRouterFailureRatioHigh
          expr: |
            (
              sum by (route) (rate(llm_router_requests_total{job="llm-router",status="failed"}[15m]))
                /
              sum by (route) (rate(llm_router_requests_total{job="llm-router"}[15m]))
            ) > 0.10
            and
            sum by (route) (rate(llm_router_requests_total{job="llm-router"}[15m])) >= (10 / 900)
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "llm-router route {{ $labels.route }}: {{ $value | humanizePercentage }} of requests failing"
            description: >-
              Over the last 15 minutes {{ $value | humanizePercentage }} of the requests that entered
              route {{ $labels.route }} ended failed (at least 10 requests in the window). The
              healthy baseline is under 3 %. Read the codes on the Activity page or
              GET /admin/v1/stats?window=1h: upstream_code server_is_overloaded on every account is
              the provider (check status.openai.com); one account is that account; a 4xx code is
              the clients. Runbook: docs/runbooks/llm-router.md § Overload handling.
        # Attempts that ended on an upstream overload (upstream_code server_is_overloaded or server_error,
        # before or after output) as a share of ALL attempts on the provider, over 15 minutes, on providers
        # with at least 10 attempts in that window. Per provider, not per route or account: the route rule
        # above says that a route fails, this one says whose fault it is. Attempts count the failovers a
        # request survived, so the share runs a little above the route's request failure ratio in the
        # same window; the healthy day's share was 0-3 % per hour, both incidents' 15-31 %. 10 %, like the
        # route rule, so the two fire together and the reading is one glance.
        - alert: LlmRouterProviderOverloadShareHigh
          expr: |
            (
              sum by (provider) (rate(llm_router_attempts_total{job="llm-router",outcome="failed",upstream_code=~"server_is_overloaded|server_error"}[15m]))
                /
              sum by (provider) (rate(llm_router_attempts_total{job="llm-router"}[15m]))
            ) > 0.10
            and
            sum by (provider) (rate(llm_router_attempts_total{job="llm-router"}[15m])) >= (10 / 900)
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "llm-router: {{ $value | humanizePercentage }} of {{ $labels.provider }} attempts overloaded upstream"
            description: >-
              Over the last 15 minutes {{ $value | humanizePercentage }} of the router's upstream attempts on
              provider {{ $labels.provider }} ended on an overload (server_is_overloaded or server_error; at
              least 10 attempts in the window). The healthy baseline is under 3 %. This is the provider's
              capacity, not a route, a key or a conversation binding: do not release bindings, re-key or
              repoint routes for it, and do not raise concurrency. Clients that retry (the Codex CLI on
              server_error) recover their turns; the cost is latency and quota. Confirm it is every account
              with sum by (account) of the same ratio, check status.openai.com, and see
              LlmRouterFirstContentSlow for the queue ahead of it. Runbook: docs/runbooks/llm-router.md
              § Overload attribution.
        # The provider's median time from an attempt's start to its first content, over 15 minutes, on
        # providers with at least 10 attempts that reached content in that window. The earliest sign of an
        # upstream admission queue: a provider shedding load queues every request first (31 s on every
        # Codex account on 2026-10-15, before the overloads, cached and cold prompts alike), while a
        # healthy provider answers 100-180k-token turns in 1-5 s. 20 s sits between the two, and the
        # histogram's buckets straddle it (12, 20, 30, 45 s).
        - alert: LlmRouterFirstContentSlow
          expr: |
            histogram_quantile(0.5, sum by (provider, le) (rate(llm_router_first_content_seconds_bucket{job="llm-router"}[15m]))) > 20
            and
            sum by (provider) (rate(llm_router_first_content_seconds_count{job="llm-router"}[15m])) >= (10 / 900)
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: 'llm-router: {{ $labels.provider }} median time to first content is about {{ $value | printf "%.0f" }} s'
            description: >-
              Over the last 15 minutes the median time from an attempt's start to its first content on
              provider {{ $labels.provider }} was about {{ $value | printf "%.0f" }} s (interpolated within a
              histogram bucket, so read it as a range; at least 10 attempts with content in the window). A
              healthy provider answers in a few seconds whatever the context size;
              a steady 20-45 s on every account is the provider's admission queue, and mid-stream overloads
              (LlmRouterProviderOverloadShareHigh) usually follow. Nothing in the router changes this: do not
              release bindings, re-key or repoint routes. Per account: the same quantile by (account, le).
              Runbook: docs/runbooks/llm-router.md § Overload attribution.
        # A subscription near the end of its long window (Codex: primary = weekly; Claude: weekly).
        # The 5-hour Claude window is left out: it fills and empties several times a day by design.
        # A reading whose OWN reset time has passed is stale, not a wall: the router refreshes usage only
        # for accounts it can use, so a disabled or reauth_required account keeps exporting its last
        # reading (codex-4: 100 % with a reset of 2026-10-24 21:08Z, still firing on 10-26). A known,
        # past reset suppresses it; an account that reports no reset time (or 0) keeps alerting.
        # SEVERITY BY PROVIDER (2026-10-26). Claude is served through the smart pool `pool-claude`
        # (both reviewer personas' Claude reviews, Fable/Opus since ailab #1421/#1429), which routes
        # around a spent account by itself, so ONE Claude account at its wall is context, not an action:
        # its per-account rules are `info` (inhibited by InfoInhibitor unless something in the
        # llm-router namespace is warning or worse) and the pool-level LlmRouterClaudePoolHeadroomLow
        # below is the Claude warning. Codex stays `warning` per account: it has no pool-level early
        # warning (LlmRouterProviderExhausted fires only once EVERY account is limited), and its
        # per-account walls are what the 2026-10-14 incident needed to see. Same alert names either
        # way, so silences and dashboards keep matching; the provider label picks the rule.
        - alert: LlmRouterAccountNearLimit
          expr: >-
            llm_router_account_limit_used_percent{job="llm-router",provider!="claude",window=~"primary|weekly"} >= 90
            unless on (job, account, provider, window)
            ((llm_router_account_limit_resets_at_seconds{job="llm-router"} > 0) <= time())
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "llm-router account {{ $labels.account }} at {{ $value | printf \"%.0f\" }}% of its {{ $labels.window }} window"
            description: >-
              Account {{ $labels.account }} ({{ $labels.provider }}) has used {{ $value | printf "%.0f" }}% of its
              {{ $labels.window }} limit window for 30m. At 100 % the provider refuses it until the
              reset (llm_router_account_limit_resets_at_seconds; the Status page shows the time).
              Decide now whether to throttle its callers, let it run on credits, or add capacity:
              the pool keeps serving on the other accounts until they reach the same wall.
        - alert: LlmRouterAccountNearLimit
          expr: >-
            llm_router_account_limit_used_percent{job="llm-router",provider="claude",window=~"primary|weekly"} >= 90
            unless on (job, account, provider, window)
            ((llm_router_account_limit_resets_at_seconds{job="llm-router"} > 0) <= time())
          for: 30m
          labels: { severity: info }
          annotations:
            summary: "llm-router account {{ $labels.account }} at {{ $value | printf \"%.0f\" }}% of its {{ $labels.window }} window"
            description: >-
              Account {{ $labels.account }} ({{ $labels.provider }}) has used {{ $value | printf "%.0f" }}% of its
              {{ $labels.window }} limit window for 30m. At 100 % the provider refuses it until the
              reset (llm_router_account_limit_resets_at_seconds; the Status page shows the time).
              Decide now whether to throttle its callers, let it run on credits, or add capacity:
              the pool keeps serving on the other accounts until they reach the same wall.
        - alert: LlmRouterAccountLimited
          expr: llm_router_account_limit_status{job="llm-router",provider!="claude",status="limited"} == 1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "llm-router account {{ $labels.account }} is limited (refused until its reset)"
            description: >-
              The provider reports account {{ $labels.account }} ({{ $labels.provider }}) at 100 % of
              a limit window: the router skips it (quota_exhausted) until the reset the Status page
              shows. One account down is capacity, not an outage; see LlmRouterProviderExhausted.
        - alert: LlmRouterAccountLimited
          expr: llm_router_account_limit_status{job="llm-router",provider="claude",status="limited"} == 1
          for: 10m
          labels: { severity: info }
          annotations:
            summary: "llm-router account {{ $labels.account }} is limited (refused until its reset)"
            description: >-
              The provider reports account {{ $labels.account }} ({{ $labels.provider }}) at 100 % of
              a limit window: the router skips it (quota_exhausted) until the reset the Status page
              shows. One account down is capacity, not an outage; see LlmRouterProviderExhausted.
        # The Claude POOL running out of room: fewer than two Claude accounts below 90 % of their weekly
        # window, so the next wall leaves pool-claude on one account or none - every Fable/Opus review
        # and every other pool-claude caller then queues on it. `or vector(0)`: no account below 90 %
        # makes the inner count EMPTY, not 0, and an empty vector never compares; the `and on()` gate
        # keeps "no Claude readings at all" silent (LlmRouterMetricsAbsent owns an absent target) and
        # needs at least two accounts with a reading, so a one-account pool is left to the per-account
        # rules. A stale reading (its own reset already past, the NearLimit rules' `unless`) counts as
        # no headroom here, on purpose, whatever its percentage: it is an account the router could not
        # refresh - disabled, reauth_required - which is not capacity either (reviewers on #1432). A
        # reading with no reset time (0) is not provably stale and counts as it reads. 30m rides out a reading
        # that dips under 90 % only between two usage refreshes.
        - alert: LlmRouterClaudePoolHeadroomLow
          expr: |
            (
              (
                count(
                  (llm_router_account_limit_used_percent{job="llm-router",provider="claude",window="weekly"} < 90)
                  unless on (job, account, provider, window)
                  ((llm_router_account_limit_resets_at_seconds{job="llm-router"} > 0) <= time())
                )
                or vector(0)
              )
                < 2
            )
            and on ()
            (count(llm_router_account_limit_used_percent{job="llm-router",provider="claude",window="weekly"}) >= 2)
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "llm-router: only {{ $value }} Claude account(s) below 90% of their weekly window"
            description: >-
              pool-claude has {{ $value }} account(s) with weekly headroom (below 90 %), held for 30m. The
              Claude reviewer (Fable, then Opus) and every other pool-claude caller now depend on that
              many accounts; when they reach their walls the reviews wait (lossless, ReviewbotStalled
              after 1 h) until the earliest reset. Each account's reading and reset:
              llm_router_account_limit_used_percent / llm_router_account_limit_resets_at_seconds
              {provider="claude",window="weekly"}, or the router's Status page. Options: add or
              re-enable a Claude account, slow non-review pool-claude callers, or accept the pause.
              Runbook: docs/runbooks/llm-router.md § Reviewer routes.
        # Every account of a provider limited: the pools of that provider serve nothing but credits.
        # Left: the `status="limited"` series whose VALUE is 1 (the limited accounts). Right: the
        # `status="limited"` series whatever their value (a label selector matches the series, not
        # the value) - the exporter writes all three `status` series (0 or 1) for every account
        # that has a limits READING, so the right-hand side is the accounts with a reading, not the
        # accounts configured. Two of three limited: 2 == 3 is false, no page (tested). Readings
        # persist in the router's store and come back after a restart, so a Codex or Claude account
        # that has ever served has one; an account that never reported (brand new, or a provider
        # without limit headers) has no series and is invisible here. The `>= 2` floor keeps that
        # from turning one limited account into a critical page; an always-present per-account
        # series from the exporter would be the complete fix.
        - alert: LlmRouterProviderExhausted
          expr: |
            (
              count by (provider) (llm_router_account_limit_status{job="llm-router",status="limited"} == 1)
                ==
              count by (provider) (llm_router_account_limit_status{job="llm-router",status="limited"})
            )
            and
            count by (provider) (llm_router_account_limit_status{job="llm-router",status="limited"} == 1) >= 2
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "llm-router: every {{ $labels.provider }} account is limited"
            description: >-
              All {{ $value }} {{ $labels.provider }} accounts the router holds are at 100 % of a limit
              window. Requests on that provider's routes now fail (or run on credits where an
              account has them) until the earliest reset. The dev workers' Codex CLI cannot fall
              back to another provider through the router. Runbook: docs/runbooks/llm-router.md
              § Overload handling.
