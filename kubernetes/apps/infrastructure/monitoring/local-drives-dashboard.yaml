  "data": {
    "local-drives.json": "{\n  \"title\": \"Local Drives (Proxmox hosts' NVMe)\",\n  \"uid\": \"ailab-local-drives\",\n  \"description\": \"The Proxmox hosts' local NVMe drives: throughput, latency, who uses them, the thin pool, endurance and trims. Generated by scripts/gen-local-drives-dashboard.py.\",\n  \"tags\": [\n    \"infrastructure\",\n    \"ailab\",\n    \"storage\",\n    \"nvme\",\n    \"proxmox\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"graphTooltip\": 1,\n  \"refresh\": \"1m\",\n  \"time\": {\n    \"from\": \"now-24h\",\n    \"to\": \"now\"\n  },\n  \"links\": [\n    {\n      \"title\": \"AI Lab Fleet\",\n      \"type\": \"link\",\n      \"icon\": \"dashboard\",\n      \"targetBlank\": false,\n      \"url\": \"/d/ailab-reporting/\"\n    }\n  ],\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"DS_PROMETHEUS\",\n        \"type\": \"datasource\",\n        \"query\": \"prometheus\",\n        \"current\": {},\n        \"hide\": 0,\n        \"label\": \"Datasource\",\n        \"refresh\": 1\n      },\n      {\n        \"name\": \"host\",\n        \"type\": \"query\",\n        \"label\": \"Host\",\n        \"datasource\": {\n          \"type\": \"prometheus\",\n          \"uid\": \"${DS_PROMETHEUS}\"\n        },\n        \"query\": {\n          \"query\": \"label_values(node_uname_info{job=\\\"proxmox-node\\\"}, nodename)\",\n          \"refId\": \"host\"\n        },\n        \"definition\": \"label_values(node_uname_info{job=\\\"proxmox-node\\\"}, nodename)\",\n        \"refresh\": 1,\n        \"multi\": true,\n        \"includeAll\": true,\n        \"sort\": 1,\n        \"current\": {\n          \"selected\": true,\n          \"text\": [\n            \"All\"\n          ],\n          \"value\": [\n            \"$__all\"\n          ]\n        },\n        \"hide\": 0\n      },\n      {\n        \"name\": \"topn\",\n        \"type\": \"custom\",\n        \"label\": \"Top N\",\n        \"query\": \"5,8,10,15,25\",\n        \"current\": {\n          \"selected\": true,\n          \"text\": \"8\",\n          \"value\": \"8\"\n        },\n        \"hide\": 0,\n        \"multi\": false,\n        \"includeAll\": false,\n        \"options\": [\n          {\n            \"selected\": false,\n            \"text\": \"5\",\n            \"value\": \"5\"\n          },\n          {\n            \"selected\": true,\n            \"text\": \"8\",\n            \"value\": \"8\"\n          },\n          {\n            \"selected\": false,\n            \"text\": \"10\",\n            \"value\": \"10\"\n          },\n          {\n            \"selected\": false,\n            \"text\": \"15\",\n            \"value\": \"15\"\n          },\n          {\n            \"selected\": false,\n            \"text\": \"25\",\n            \"value\": \"25\"\n          }\n        ]\n      }\n    ]\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"type\": \"row\",\n      \"title\": \"Overview (per host; values at the end of the range)\",\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 24,\n        \"h\": 1\n      },\n      \"panels\": []\n    },\n    {\n      \"id\": 2,\n      \"type\": \"stat\",\n      \"title\": \"Life used (rated endurance)\",\n      \"description\": \"SMART percentage_used: the drive's own estimate of its rated write endurance consumed. 100% is the rating, not a failure; the risk of the drive going read-only rises past it. AiNodeNvmeWearHigh fires at 95% (ADR 0042: pause that node's CI runners).\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS_PROMETHEUS}\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 1,\n        \"w\": 4,\n        \"h\": 5\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 70\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 85\n              },\n              {\n                \"color\": \"purple\",\n                \"value\": 95\n              }\n            ]\n          },\n          \"decimals\": 0\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\",\n        \"textMode\": \"value_and_name\",\n        \"justifyMode\": \"auto\",\n        \"orientation\": \"vertical\",\n        \"wideLayout\": true,\n        \"text\": {\n          \"titleSize\": 16,\n          \"valueSize\": 24\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${DS_PROMETHEUS}\"\n          },\n          \"expr\": \"(nvme_percentage_used_ratio{job=\\\"proxmox-node\\\",device=\\\"nvme0n1\\\"} * 100) * on(instance) group_left(nodename) node_uname_info{job=\\\"proxmox-node\\\",nodename=~\\\"$host\\\"}\",\n          \"legendFormat\": \"{{nodename}}\",\n          \"instant\": true,\n          \"range\": false\n        }\n      ]\n    },\n    {\n      \"id\": 3,\n      \"type\": \"stat\",\n      \"title\": \"Written \\u00b7 last 24 h\",\n      \"description\": \"Bytes the host wrote to the drive in the last 24 h: the raw difference of the drive's own counter (data units written x 512,000 B) now and 24 h ago, not an extrapolated increase(). This is what wears it. TB here are decimal, as in the drive's endurance rating.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS_PROMETHEUS}\"\n      },\n      \"gridPos\": {\n        \"x\": 4,\n        \"y\": 1,\n        \"w\": 4,\n        \"h\": 5\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"decbytes\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"blue\",\n                \"value\": null\n              }\n            ]\n          },\n          \"decimals\": 1\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\",\n        \"textMode\": \"value_and_name\",\n        \"justifyMode\": \"auto\",\n        \"orientation\": \"vertical\",\n        \"wideLayout\": true,\n        \"text\": {\n          \"titleSize\": 16,\n          \"valueSize\": 24\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${DS_PROMETHEUS}\"\n          },\n          \"expr\": \"(clamp_min(nvme_data_units_written_total{job=\\\"proxmox-node\\\",device=\\\"nvme0n1\\\"} - nvme_data_units_written_total{job=\\\"proxmox-node\\\",device=\\\"nvme0n1\\\"} offset 1d, 0) * 512000) * on(instance) group_left(nodename) node_uname_info{job=\\\"proxmox-node\\\",nodename=~\\\"$host\\\"}\",\n          \"legendFormat\": \"{{nodename}}\",\n          \"instant\": true,\n          \"range\": false\n        }\n      ]\n    },\n    {\n      \"id\": 4,\n      \"type\": \"stat\",\n      \"title\": \"Written per day \\u00b7 7-day average\",\n      \"description\": \"The same counter's raw difference over 7 days, divided by 7.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS_PROMETHEUS}\"\n      },\n      \"gridPos\": {\n        \"x\": 8,\n        \"y\": 1,\n        \"w\": 4,\n        \"h\": 5\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"decbytes\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"blue\",\n                \"value\": null\n              }\n            ]\n          },\n          \"decimals\": 1\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\",\n        \"textMode\": \"value_and_name\",\n        \"justifyMode\": \"auto\",\n        \"orientation\": \"vertical\",\n        \"wideLayout\": true,\n        \"text\": {\n          \"titleSize\": 16,\n          \"valueSize\": 24\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${DS_PROMETHEUS}\"\n          },\n          \"expr\": \"(clamp_min(nvme_data_units_written_total{job=\\\"proxmox-node\\\",device=\\\"nvme0n1\\\"} - nvme_data_units_written_total{job=\\\"proxmox-node\\\",device=\\\"nvme0n1\\\"} offset 7d, 0) * 512000 / 7) * on(instance) group_left(nodename) node_uname_info{job=\\\"proxmox-node\\\",nodename=~\\\"$host\\\"}\",\n          \"legendFormat\": \"{{nodename}}\",\n          \"instant\": true,\n          \"range\": false\n        }\n      ]\n    },\n    {\n      \"id\": 5,\n      \"type\": \"stat\",\n      \"title\": \"Days to 100% at the 7-day rate\",\n      \"description\": \"Days until life used reaches 100% if the drive keeps being written at its 7-day average: remaining % x (bytes written per 1% so far) / bytes per day. The health table has the date. A projection, not a failure date.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS_PROMETHEUS}\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 1,\n        \"w\": 4,\n        \"h\": 5\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"suffix: d\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"red\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 30\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 90\n              }\n            ]\n          },\n          \"decimals\": 0\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\",\n        \"textMode\": \"value_and_name\",\n        \"justifyMode\": \"auto\",\n        \"orientation\": \"vertical\",\n        \"wideLayout\": true,\n        \"text\": {\n          \"titleSize\": 16,\n          \"valueSize\": 24\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${DS_PROMETHEUS}\"\n          },\n          \"expr\": \"(clamp_min((1 - nvme_percentage_used_ratio{job=\\\"proxmox-node\\\",device=\\\"nvme0n1\\\"}) * (nvme_data_units_written_total{job=\\\"proxmox-node\\\",device=\\\"nvme0n1\\\"} / clamp_min(nvme_percentage_used_ratio{job=\\\"proxmox-node\\\",device=\\\"nvme0n1\\\"}, 0.01)) / clamp_min((nvme_data_units_written_total{job=\\\"proxmox-node\\\",device=\\\"nvme0n1\\\"} - nvme_data_units_written_total{job=\\\"proxmox-node\\\",device=\\\"nvme0n1\\\"} offset 7d) / 7, 1), 0)) * on(instance) group_left(nodename) node_uname_info{job=\\\"proxmox-node\\\",nodename=~\\\"$host\\\"}\",\n          \"legendFormat\": \"{{nodename}}\",\n          \"instant\": true,\n          \"range\": false\n        }\n      ]\n    },\n    {\n      \"id\": 6,\n      \"type\": \"stat\",\n      \"title\": \"Thin pool used\",\n      \"description\": \"local-lvm (pve/data) data space allocated, from pve-exporter. A full pool fails every guest's writes on the host; #1886 alerts at 85% and 95%. The Capacity row has the GiB and the guests.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS_PROMETHEUS}\"\n      },\n      \"gridPos\": {\n        \"x\": 16,\n        \"y\": 1,\n        \"w\": 4,\n        \"h\": 5\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 75\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 85\n              }\n            ]\n          },\n          \"decimals\": 1\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\",\n        \"textMode\": \"value_and_name\",\n        \"justifyMode\": \"auto\",\n        \"orientation\": \"vertical\",\n        \"wideLayout\": true,\n        \"text\": {\n          \"titleSize\": 16,\n          \"valueSize\": 24\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${DS_PROMETHEUS}\"\n          },\n          \"expr\": \"100 * max by (nodename) (label_replace(pve_disk_usage_bytes{job=\\\"pve-exporter\\\",id=~\\\"storage/($host)/local-lvm\\\"}, \\\"nodename\\\", \\\"$1\\\", \\\"id\\\", \\\"storage/([^/]+)/local-lvm\\\")) / max by (nodename) (label_replace(pve_disk_size_bytes{job=\\\"pve-exporter\\\",id=~\\\"storage/($host)/local-lvm\\\"}, \\\"nodename\\\", \\\"$1\\\", \\\"id\\\", \\\"storage/([^/]+)/local-lvm\\\"))\",\n          \"legendFormat\": \"{{nodename}}\",\n          \"instant\": true,\n          \"range\": false\n        }\n      ]\n    },\n    {\n      \"id\": 7,\n      \"type\": \"stat\",\n      \"title\": \"Critical warning \\u00b7 media errors\",\n      \"description\": \"0 = OK. Otherwise the drive's critical-warning byte (spare below threshold, temperature, reliability degraded, read-only, backup failed) is set or it has reported unrecovered media errors: the Endurance row's health table says which.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS_PROMETHEUS}\"\n      },\n      \"gridPos\": {\n        \"x\": 20,\n        \"y\": 1,\n        \"w\": 4,\n        \"h\": 5\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"none\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 1\n              }\n            ]\n          },\n          \"decimals\": 0,\n          \"mappings\": [\n            {\n              \"type\": \"value\",\n              \"options\": {\n                \"0\": {\n                  \"text\": \"OK\",\n                  \"color\": \"green\",\n                  \"index\": 0\n                }\n              }\n            }\n          ]\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\",\n        \"textMode\": \"value_and_name\",\n        \"justifyMode\": \"auto\",\n        \"orientation\": \"vertical\",\n        \"wideLayout\": true,\n        \"text\": {\n          \"titleSize\": 16,\n          \"valueSize\": 24\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${DS_PROMETHEUS}\"\n          },\n          \"expr\": \"(nvme_critical_warning{job=\\\"proxmox-node\\\",device=\\\"nvme0n1\\\"} + nvme_media_errors_total{job=\\\"proxmox-node\\\",device=\\\"nvme0n1\\\"}) * on(instance) group_left(nodename) node_uname_info{job=\\\"proxmox-node\\\",nodename=~\\\"$host\\\"}\",\n          \"legendFormat\": \"{{nodename}}\",\n          \"instant\": true,\n          \"range\": false\n        }\n      ]\n    },\n    {\n      \"id\": 8,\n      \"type\": \"row\",\n      \"title\": \"Throughput at the drive (nvme0n1; bytes/s and IOPS on separate panels)\",\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 6,\n        \"w\": 24,\n        \"h\": 1\n      },\n      \"panels\": []\n    },\n    {\n      \"id\": 9,\n      \"type\": \"timeseries\",\n      \"title\": \"Write throughput\",\n      \"description\": \"Everything the host sends to the drive: every guest, the host's root and swap, and the thin pool's metadata. Rate over Grafana's $__rate_interval (at least 4 scrapes).\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS_PROMETHEUS}\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 7,\n        \"w\": 6,\n        \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"binBps\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 1,\n            \"fillOpacity\": 0,\n            \"showPoints\": \"never\",\n            \"spanNulls\": false,\n            \"stacking\": {\n              \"mode\": \"none\",\n              \"group\": \"A\"\n            }\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"showLegend\": true\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${DS_PROMETHEUS}\"\n          },\n          \"expr\": \"(rate(node_disk_written_bytes_total{job=\\\"proxmox-node\\\",device=\\\"nvme0n1\\\"}[$__rate_interval])) * on(instance) group_left(nodename) node_uname_info{job=\\\"proxmox-node\\\",nodename=~\\\"$host\\\"}\",\n          \"legendFormat\": \"{{nodename}}\"\n        }\n      ]\n    },\n    {\n      \"id\": 10,\n      \"type\": \"timeseries\",\n      \"title\": \"Read throughput\",\n      \"description\": \"Everything the host sends to the drive: every guest, the host's root and swap, and the thin pool's metadata. Rate over Grafana's $__rate_interval (at least 4 scrapes).\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS_PROMETHEUS}\"\n      },\n      \"gridPos\": {\n        \"x\": 6,\n        \"y\": 7,\n        \"w\": 6,\n        \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"binBps\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 1,\n            \"fillOpacity\": 0,\n            \"showPoints\": \"never\",\n            \"spanNulls\": false,\n            \"stacking\": {\n              \"mode\": \"none\",\n              \"group\": \"A\"\n            }\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"showLegend\": true\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${DS_PROMETHEUS}\"\n          },\n          \"expr\": \"(rate(node_disk_read_bytes_total{job=\\\"proxmox-node\\\",device=\\\"nvme0n1\\\"}[$__rate_interval])) * on(instance) group_left(nodename) node_uname_info{job=\\\"proxmox-node\\\",nodename=~\\\"$host\\\"}\",\n          \"legendFormat\": \"{{nodename}}\"\n        }\n      ]\n    },\n    {\n      \"id\": 11,\n      \"type\": \"timeseries\",\n      \"title\": \"Write IOPS\",\n      \"description\": \"Everything the host sends to the drive: every guest, the host's root and swap, and the thin pool's metadata. Rate over Grafana's $__rate_interval (at least 4 scrapes). Completed write requests per second (after the block layer merged them).\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS_PROMETHEUS}\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 7,\n        \"w\": 6,\n        \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"iops\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 1,\n            \"fillOpacity\": 0,\n            \"showPoints\": \"never\",\n            \"spanNulls\": false,\n            \"stacking\": {\n              \"mode\": \"none\",\n              \"group\": \"A\"\n            }\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"showLegend\": true\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${DS_PROMETHEUS}\"\n          },\n          \"expr\": \"(rate(node_disk_writes_completed_total{job=\\\"proxmox-node\\\",device=\\\"nvme0n1\\\"}[$__rate_interval])) * on(instance) group_left(nodename) node_uname_info{job=\\\"proxmox-node\\\",nodename=~\\\"$host\\\"}\",\n          \"legendFormat\": \"{{nodename}}\"\n        }\n      ]\n    },\n    {\n      \"id\": 12,\n      \"type\": \"timeseries\",\n      \"title\": \"Read IOPS\",\n      \"description\": \"Everything the host sends to the drive: every guest, the host's root and swap, and the thin pool's metadata. Rate over Grafana's $__rate_interval (at least 4 scrapes). Completed read requests per second.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS_PROMETHEUS}\"\n      },\n      \"gridPos\": {\n        \"x\": 18,\n        \"y\": 7,\n        \"w\": 6,\n        \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"iops\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 1,\n            \"fillOpacity\": 0,\n            \"showPoints\": \"never\",\n            \"spanNulls\": false,\n            \"stacking\": {\n              \"mode\": \"none\",\n              \"group\": \"A\"\n            }\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"showLegend\": true\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\":