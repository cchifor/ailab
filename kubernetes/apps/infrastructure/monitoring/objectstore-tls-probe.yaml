# Verify the certificate served by nginx, using internal routing and browser SNI.
# No S3 credentials, signed URLs, storage reads or Kubernetes API access.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: objectstore-tls-probe
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: objectstore-tls-probe}
  template:
    metadata:
      labels: {app.kubernetes.io/name: objectstore-tls-probe}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: blackbox
          image: quay.io/prometheus/blackbox-exporter:v0.29.0@sha256:9613f2884689b6fad9f1939f6a3b0388c93a022cfaededb19545b329b5c83dea
          args: ["--config.file=/etc/blackbox/blackbox.yml", "--web.listen-address=:9115"]
          ports: [{name: http, containerPort: 9115}]
          readinessProbe:
            httpGet: {path: /-/healthy, port: http}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: config, mountPath: /etc/blackbox, readOnly: true}
            - {name: ca, mountPath: /etc/objectstore-ca, readOnly: true}
      volumes:
        - name: config
          configMap: {name: objectstore-tls-probe}
        - name: ca
          configMap: {name: objectstore-tls-ca}
---
apiVersion: v1
kind: Service
metadata:
  name: objectstore-tls-probe
  namespace: monitoring
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: objectstore-tls-probe}
  ports: [{name: http, port: 9115, targetPort: http}]
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: objectstore-tls
  namespace: monitoring
  labels: {release: kube-prometheus-stack}
spec:
  jobName: objectstore-tls
  interval: 60s
  scrapeTimeout: 10s
  module: objectstore_tls
  prober:
    url: objectstore-tls-probe.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static: [objectstore-forge-tls.strive-ailab.svc.cluster.local:443]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: objectstore-tls-probe
  namespace: monitoring
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: objectstore-tls-probe}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports: [{protocol: TCP, port: 9115}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: strive-ailab}
          podSelector:
            matchLabels: {strive.io/service: objectstore}
      ports: [{protocol: TCP, port: 8443}]
