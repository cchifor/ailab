# ntfy — self-hosted push notifications (phone/desktop). Alertmanager routes every alert here
# (kube-prometheus-stack.yaml receiver `ntfy`); subscribe in the ntfy app to ntfy.chifor.me topic
# `ailab-alerts` (login as user `ailab`). Auth is deny-all + the seeded `ailab` admin user.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: monitoring
data:
  server.yml: |
    base-url: "https://ntfy.chifor.me"
    listen-http: ":80"
    behind-proxy: true
    auth-file: "/var/lib/ntfy/user.db"
    auth-default-access: "deny-all"
    cache-file: "/var/cache/ntfy/cache.db"
    cache-duration: "12h"
    attachment-cache-dir: "/var/cache/ntfy/attachments"
  # Named template for Alertmanager (receiver URL ?template=ailab-alertmanager, kube-prometheus-stack.yaml).
  # BOUNDED BY CONSTRUCTION — every emitted field is truncated: severity 12 B, summary 240 B (newlines
  # flattened), instance/pod 80 B each, title alertname 80 B / namespace 40 B; at most 8 alert lines, then
  # "…and N more". Worst case ~3.5 KB, under ntfy's 4 KB limit. Why it matters: ntfy REJECTS a rendered
  # message over 4 KB with HTTP 400 ("message or title is too large after replacing template") and
  # Alertmanager treats 400 as unrecoverable, so the notification is DROPPED — the built-in `alertmanager`
  # template prints full descriptions and dropped a 3-alert CIRunnerBuildCacheHigh group on 2026-09-29.
  # Tested (ntfy inline-template mode, scratch topic): real group 311 B; 11 hostile alerts (1 KB+ multiline
  # multibyte summaries, 500-char labels) 3469 B; empty common alertname -> "Alerts". `trunc` cuts bytes,
  # so a multibyte character at the cut renders as U+FFFD — cosmetic, ntfy accepts it.
  # ORDERING: this must be LIVE (ntfy restarted onto it) BEFORE the receiver URL names it — an unknown
  # template is also an HTTP 400 drop. Hence the URL switch ships in a separate, later PR.
  ailab-alertmanager.yml: |
    title: |-
      {{ if eq .status "firing" }}🔥{{ else }}✅{{ end }} {{ trunc 80 (or .commonLabels.alertname "Alerts") }}{{ with .commonLabels.namespace }} ({{ trunc 40 . }}){{ end }}{{ if gt (len .alerts) 1 }} ×{{ len .alerts }}{{ end }}
    message: |-
      {{- range $i, $a := .alerts }}{{ if lt $i 8 }}{{ if $i }}
      {{ end }}{{ if eq $a.status "firing" }}•{{ else }}✓{{ end }} [{{ trunc 12 (or $a.labels.severity "none") }}] {{ trunc 240 (replace "\n" " " (or $a.annotations.summary $a.annotations.description $a.labels.alertname "")) }}{{ with $a.labels.instance }} — {{ trunc 80 . }}{{ end }}{{ with $a.labels.pod }} — {{ trunc 80 . }}{{ end }}{{ end }}{{ end }}
      {{- if gt (len .alerts) 8 }}
      …and {{ sub (len .alerts) 8 }} more{{ end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-data-iscsi # renamed: storageClassName is immutable, so a new PVC forces the migration
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  # qnap-iscsi block (ext4, real POSIX locking) — SQLite-on-NFS is unsafe (matches gitea/grafana) and
  # nfs-csi has no Velero VolumeSnapshotClass so the old PVC was never backed up. Migration: Flux creates
  # this fresh PVC, the Recreate-strategy Deployment switches to it, and the `ailab` admin auto-reseeds
  # via the postStart hook.
  # ⚠️ Flux prunes the now-removed `ntfy-data` PVC on reconcile, and nfs-csi is reclaimPolicy:Delete, so
  #    its data IS destroyed (the admin reseed makes that acceptable). For a rollback fallback, annotate
  #    the LIVE old PVC `kustomize.toolkit.fluxcd.io/prune: disabled` BEFORE merging.
  storageClassName: qnap-iscsi
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ntfy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
      annotations:
        # subPath mounts never refresh and templates load at startup: bump this whenever
        # ailab-alertmanager.yml changes so the pod restarts onto the new template.
        ailab.io/ntfy-template-rev: "1"
    spec:
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.28.0
          args: ["serve"]
          ports:
            - { name: http, containerPort: 80 }
          env:
            - name: NTFY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ntfy-auth
                  key: password
            # Publisher identity for the QNAP (ai-storage). QuTS hero's Notification Center can only
            # reach a webhook through its "custom SMS service provider", which does a plain HTTP GET
            # and cannot set an Authorization header — so the NAS authenticates via ntfy's ?auth=
            # query parameter, and this user is deliberately write-only on one topic so a URL that
            # necessarily carries its credential in a query string cannot be used to READ alerts.
            - name: NTFY_QNAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ntfy-qnap-auth
                  key: password
          # The auth db only exists AFTER the server's first start, so seed the `ailab` admin user via
          # a postStart hook that waits for the db (idempotent), not an initContainer.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    for i in $(seq 1 60); do
                      if ntfy user list >/dev/null 2>&1; then
                        # RECONCILE, don't just create. Each user is add-if-missing followed by an
                        # unconditional change-pass/change-role/access, so the db is driven to match
                        # the Secrets on every start.
                        #
                        # `add --ignore-exists` alone is NOT enough: it succeeds without touching an
                        # existing user, so rotating either Secret would leave the old password in
                        # user.db while the pod came up healthy — Alertmanager and the QNAP would
                        # both start getting 401s with nothing saying so. Same for a role that
                        # drifted: an existing `qnap` left at admin would silently defeat the
                        # write-only restriction.
                        #
                        # `add --ignore-exists` also replaces an earlier `user list | grep -qw`
                        # guard, which was wrong for a second reason: `-` is not word-constituent,
                        # so the ACL line "- write-only access to topic qnap-alerts" satisfies
                        # `grep -w qnap` by itself. A guard matching a TOPIC name would skip the add
                        # and the next command would fail the hook — and a failing postStart kills
                        # the container, crashlooping the thing that delivers every alert.
                        NTFY_PASSWORD="$NTFY_ADMIN_PASSWORD" \
                          ntfy user add --ignore-exists --role=admin ailab \
                          || { echo 'ntfy postStart: ailab user add failed' >&2; exit 1; }
                        NTFY_PASSWORD="$NTFY_ADMIN_PASSWORD" ntfy user change-pass ailab \
                          || { echo 'ntfy postStart: ailab change-pass failed' >&2; exit 1; }
                        ntfy user change-role ailab admin \
                          || { echo 'ntfy postStart: ailab change-role failed' >&2; exit 1; }
                        # The QNAP publisher. Seeded here for the same reason as ailab: the auth db
                        # lives on the PVC, so a volume rebuild would otherwise silently drop this
                        # user and the NAS's alerts would 401 into the void with nothing saying so.
                        NTFY_PASSWORD="$NTFY_QNAP_PASSWORD" \
                          ntfy user add --ignore-exists --role=user qnap \
                          || { echo 'ntfy postStart: qnap user add failed' >&2; exit 1; }
                        NTFY_PASSWORD="$NTFY_QNAP_PASSWORD" ntfy user change-pass qnap \
                          || { echo 'ntfy postStart: qnap change-pass failed' >&2; exit 1; }
                        ntfy user change-role qnap user \
                          || { echo 'ntfy postStart: qnap change-role failed' >&2; exit 1; }
                        ntfy access qnap qnap-alerts write-only \
                          || { echo 'ntfy postStart: qnap ACL grant failed' >&2; exit 1; }
                        exit 0
                      fi
                      sleep 1
                    done
                    # Loop exhausted: db never appeared. Fail loudly so the pod restarts instead of
                    # coming up Ready with deny-all auth and silently 401-ing every Alertmanager webhook.
                    echo 'ntfy postStart: auth db never appeared in 60s; ailab admin not seeded' >&2
                    exit 1
          volumeMounts:
            - { name: config, mountPath: /etc/ntfy/server.yml, subPath: server.yml }
            # ntfy reads named templates from --template-dir (default /etc/ntfy/templates) at startup.
            - { name: config, mountPath: /etc/ntfy/templates/ailab-alertmanager.yml, subPath: ailab-alertmanager.yml }
            - { name: data, mountPath: /var/lib/ntfy }
            - { name: cache, mountPath: /var/cache/ntfy }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          livenessProbe:
            httpGet: { path: /v1/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: ntfy-config
        - name: data
          persistentVolumeClaim:
            claimName: ntfy-data-iscsi
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: ntfy
  ports:
    - { name: http, port: 80, targetPort: http }
