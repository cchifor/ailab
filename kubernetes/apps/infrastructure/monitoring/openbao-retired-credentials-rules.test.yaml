# `promtool test rules` fixtures for openbao-retired-credentials-rules.yaml. Run by
# scripts/rules-lint.sh on every PR, after `promtool check rules`.
#
# `rule_files` is the extracted spec name, because rules-lint.sh hands promtool the `spec:` body of
# each PrometheusRule under the manifest's basename.
rule_files:
  - openbao-retired-credentials-rules.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: a re-minted provisioner token the revoker did not remove pages after 45m; the kept OpenBao tokens never do
    input_series:
      # A re-bootstrap recreates the retired Secret at 5m and nobody deletes it.
      - series: 'kube_secret_info{namespace="openbao", secret="openbao-provisioner-token"}'
        values: "_x4 1x60"
      # The tokens OpenBao itself still needs are always present and must stay silent.
      - series: 'kube_secret_info{namespace="openbao", secret="openbao-operator-provisioner-token"}'
        values: "1x64"
      - series: 'kube_secret_info{namespace="openbao", secret="openbao-breakglass-token"}'
        values: "1x64"
    alert_rule_test:
      - eval_time: 45m
        alertname: OpenBaoRetiredProvisionerTokenPresent
        exp_alerts: []
      - eval_time: 55m
        alertname: OpenBaoRetiredProvisionerTokenPresent
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "openbao/openbao-provisioner-token exists again, but the AgentForge provisioner is retired"
              description: >-
                The Secret openbao/openbao-provisioner-token exists, yet the AgentForge provisioner that
                used it was retired on 2026-10-31. A full OpenBao re-bootstrap (root path) mints this
                long-lived token; nothing reads it now, and its policy can write tenant policies and
                k8s-auth roles. The openbao-retired-token-revoker CronJob (every 15m) should already have revoked and deleted it; check its Jobs' logs. To do it by hand: exec a one-off pod or shell that reads
                the token from the Secret and POSTs v1/auth/token/revoke-self with it (any token may
                revoke itself; expect 204, then 403 from lookup-self), then
                `kubectl --context admin@ai -n openbao delete secret openbao-provisioner-token`.
                Never print the token. See docs/runbooks/openbao-recovery.md.

  - interval: 1m
    name: the state today (Secret deleted) is silent
    input_series:
      - series: 'kube_secret_info{namespace="openbao", secret="openbao-operator-provisioner-token"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 30m
        alertname: OpenBaoRetiredProvisionerTokenPresent
        exp_alerts: []
