# Host-level node_exporter on the OPPORTUNISTIC CI runner VMs that live on the cloudlab cluster
# (cloud-ci-N, ADR 0032; docs/runbooks/ci-runners.md §9). Deliberately NOT part of ci-runners-node.yaml:
# those hosts are powered off at night, so every rule written for the 24/7 pool (CIRunnerNodeDown at
# `up == 0`, the beacon-absence rules, CIRunnerTargetNotARunner's `ci-runner-*` nodename check) would
# page every evening. This job's rules (ci-runners-cloud-rules.yaml) are GATED on the cloud HOST being
# up, joined through the `cloud_host` label below against job="cloud-node"'s `nodename`.
#
# One Service+Endpoints per cloud host: the Service label is the only per-target metadata a static
# Endpoints scrape can carry, and `cloud_host` is what the host-up join needs. `nodename` comes from
# the Endpoints hostname field (as cloud-node.yaml does) so legends read cloud-ci-N.
#
# Addresses are added ONLY after a VM exists, is registered and answers on :9100 (the cloud2 set
# is still empty): an address without a VM is `up == 0` while the host is up — a firing alert for a
# runner that was never built (codex review of the 2026-09-23 plan). IPAM: docs/network-plan.md.
apiVersion: v1
kind: Service
metadata:
  name: ci-runner-cloud1
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ci-runner-cloud
    cloud_host: cloud1
spec:
  clusterIP: None
  ports:
    - { name: metrics, port: 9100, targetPort: 9100, protocol: TCP }
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ci-runner-cloud1
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ci-runner-cloud
    cloud_host: cloud1
# cloud-ci-1/2 built 2026-09-23 (cloudlab #20), registered + online in Gitea the same evening.
subsets:
  - addresses:
      - { ip: 192.168.0.32, hostname: cloud-ci-1 } # vmid 6101
      - { ip: 192.168.0.33, hostname: cloud-ci-2 } # vmid 6102
      - { ip: 192.168.0.29, hostname: cloud-ci-6 } # vmid 6106, added 2026-09-23 (cloudlab #22)
    ports:
      - { name: metrics, port: 9100, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: ci-runner-cloud2
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ci-runner-cloud
    cloud_host: cloud2
spec:
  clusterIP: None
  ports:
    - { name: metrics, port: 9100, targetPort: 9100, protocol: TCP }
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ci-runner-cloud2
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ci-runner-cloud
    cloud_host: cloud2
# cloud2 has no runner VMs until its BIOS SVM is actually on (probed OFF 2026-09-23; plan Phase 4).
subsets: []
---
apiVersion: v1
kind: Service
metadata:
  name: ci-runner-cloud3
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ci-runner-cloud
    cloud_host: cloud3
spec:
  clusterIP: None
  ports:
    - { name: metrics, port: 9100, targetPort: 9100, protocol: TCP }
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ci-runner-cloud3
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ci-runner-cloud
    cloud_host: cloud3
# cloud-ci-3/4 built 2026-09-23 (cloudlab #20), registered + online in Gitea the same evening.
# cloud-ci-5 (.30, vmid 6105) added 2026-09-23 on measured headroom (cloudlab #22, ailab #845).
subsets:
  - addresses:
      - { ip: 192.168.0.34, hostname: cloud-ci-3 } # vmid 6103
      - { ip: 192.168.0.35, hostname: cloud-ci-4 } # vmid 6104
      - { ip: 192.168.0.30, hostname: cloud-ci-5 } # vmid 6105, added 2026-09-23 (cloudlab #22)
    ports:
      - { name: metrics, port: 9100, protocol: TCP }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ci-runner-cloud
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [monitoring]
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-runner-cloud
  endpoints:
    - port: metrics
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: ci-runner-cloud
        - sourceLabels: [__meta_kubernetes_service_label_cloud_host]
          targetLabel: cloud_host
        - sourceLabels: [__meta_kubernetes_endpoint_hostname]
          targetLabel: nodename
