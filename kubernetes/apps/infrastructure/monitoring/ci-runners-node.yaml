# Host-level node_exporter on the 5 CI runner VMs (.14-.18:9100), installed via the github_runner +
# gitea_runner ansible roles (both reuse the node_exporter role). The VMs run Gitea Actions (act_runner),
# plus the GitHub agent co-located during the bake-in (ADR 0017). Gives true CPU/mem/disk/network
# for the runner pool so heavy CI load (compose e2e + buildx) is visible on the dashboards alongside
# the hypervisors. relabel forces job="ci-runner-node" so dashboard queries stay clean.
apiVersion: v1
kind: Service
metadata:
  name: ci-runner-node
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ci-runner-node
spec:
  clusterIP: None
  ports:
    - { name: metrics, port: 9100, targetPort: 9100, protocol: TCP }
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ci-runner-node
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ci-runner-node
subsets:
  - addresses:
      - { ip: 192.168.0.14 } # ci-runner-1 (ai-node1)
      - { ip: 192.168.0.15 } # ci-runner-2 (ai-node2)
      - { ip: 192.168.0.16 } # ci-runner-3 (ai-node3)
      - { ip: 192.168.0.17 } # ci-runner-4 (ai-node1)
      - { ip: 192.168.0.18 } # ci-runner-5 (ai-node2)
      # .19/.23/.29-.31: the five out-of-band runners (not in tofu state -- see
      # kubernetes/infra/runners/variables.tf and docs/network-plan.md, the IPAM registry).
      # 2026-09-07: .20/.21/.22 were REMOVED from this list. Those are cloudlab's GPU hosts
      # cloud1/cloud2/cloud3 (kernel 6.14.11-9-pve), NOT CI runners -- ci-runner-7/8/9 moved to
      # .29/.30/.31 on 2026-09-03 and this list was never updated. The effect was doubly wrong:
      # three real runners had NO alerting at all, and every job="ci-runner-node" rule was being
      # evaluated against another cluster's hypervisors, so a cloudlab problem would have paged
      # as a CI-runner problem. Verified by node_exporter nodename on each address.
      - { ip: 192.168.0.19 } # ci-runner-6 (ai-node3, vmid 4106)
      - { ip: 192.168.0.23 } # ci-runner-10 (ai-node2, vmid 4110)
      - { ip: 192.168.0.29 } # ci-runner-7 (ai-node3, vmid 4107) -- was wrongly .20 = cloud1
      # .30 / ci-runner-8 (ai-node1, vmid 4108) RETIRED 2026-09-12 to return ~10 GiB to ai-node1 for
      # the qwen3.8-27b-ailab instance. Dropped from this list in the SAME change that destroys the
      # VM: a target left here would scrape a dead address and fire NodeExporterDown forever, which
      # is the failure this list already carries a long comment about in the other direction.
      - { ip: 192.168.0.31 } # ci-runner-9 (ai-node1, vmid 4109) -- was wrongly .22 = cloud3; moved node2 -> node1 2026-09-07
    ports:
      - { name: metrics, port: 9100, protocol: TCP }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ci-runner-node
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [monitoring]
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-runner-node
  endpoints:
    - port: metrics
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: ci-runner-node
