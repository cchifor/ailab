# `promtool test rules` fixtures for gitea-worker-credential-rules.yaml (run by scripts/rules-lint.sh).
# Every rule is asserted both ways: it fires on the shape it was written for, after its hold, and stays
# silent on the live post-cut-over state (2026-10-11: four slot bots with exactly their three tokens,
# the shared dev-worker-bot with its three legacy tokens) and on a retired, credential-free account.
# Series shape: cnpg_gitea_worker_credentials_<column>{namespace, pod, worker}.
rule_files:
- gitea-worker-credential-rules.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  name: the live state after the 2026-10-11 cut-over fires nothing
  input_series:
  - series: cnpg_gitea_worker_credentials_active{namespace="databases",pod="infra-pg-6",worker="dev-worker-1-bot"}
    values: 1x60
  - series: cnpg_gitea_worker_credentials_tokens{namespace="databases",pod="infra-pg-6",worker="dev-worker-1-bot"}
    values: 3x60
  - series: cnpg_gitea_worker_credentials_tokens_unexpected{namespace="databases",pod="infra-pg-6",worker="dev-worker-1-bot"}
    values: '0x60'
  - series: cnpg_gitea_worker_credentials_kinds_present{namespace="databases",pod="infra-pg-6",worker="dev-worker-1-bot"}
    values: 3x60
  - series: cnpg_gitea_worker_credentials_max_tokens_per_kind{namespace="databases",pod="infra-pg-6",worker="dev-worker-1-bot"}
    values: 1x60
  - series: cnpg_gitea_worker_credentials_active{namespace="databases",pod="infra-pg-6",worker="dev-worker-2-bot"}
    values: 1x60
  - series: cnpg_gitea_worker_credentials_tokens{namespace="databases",pod="infra-pg-6",worker="dev-worker-2-bot"}
    values: 3x60
  - series: cnpg_gitea_worker_credentials_tokens_unexpected{namespace="databases",pod="infra-pg-6",worker="dev-worker-2-bot"}
    values: '0x60'
  - series: cnpg_gitea_worker_credentials_kinds_present{namespace="databases",pod="infra-pg-6",worker="dev-worker-2-bot"}
    values: 3x60
  - series: cnpg_gitea_worker_credentials_max_tokens_per_kind{namespace="databases",pod="infra-pg-6",worker="dev-worker-2-bot"}
    values: 1x60
  - series: cnpg_gitea_worker_credentials_active{namespace="databases",pod="infra-pg-6",worker="dev-worker-3-bot"}
    values: 1x60
  - series: cnpg_gitea_worker_credentials_tokens{namespace="databases",pod="infra-pg-6",worker="dev-worker-3-bot"}
    values: 3x60
  - series: cnpg_gitea_worker_credentials_tokens_unexpected{namespace="databases",pod="infra-pg-6",worker="dev-worker-3-bot"}
    values: '0x60'
  - series: cnpg_gitea_worker_credentials_kinds_present{namespace="databases",pod="infra-pg-6",worker="dev-worker-3-bot"}
    values: 3x60
  - series: cnpg_gitea_worker_credentials_max_tokens_per_kind{namespace="databases",pod="infra-pg-6",worker="dev-worker-3-bot"}
    values: 1x60
  - series: cnpg_gitea_worker_credentials_active{namespace="databases",pod="infra-pg-6",worker="dev-worker-4-bot"}
    values: 1x60
  - series: cnpg_gitea_worker_credentials_tokens{namespace="databases",pod="infra-pg-6",worker="dev-worker-4-bot"}
    values: 3x60
  - series: cnpg_gitea_worker_credentials_tokens_unexpected{namespace="databases",pod="infra-pg-6",worker="dev-worker-4-bot"}
    values: '0x60'
  - series: cnpg_gitea_worker_credentials_kinds_present{namespace="databases",pod="infra-pg-6",worker="dev-worker-4-bot"}
    values: 3x60
  - series: cnpg_gitea_worker_credentials_max_tokens_per_kind{namespace="databases",pod="infra-pg-6",worker="dev-worker-4-bot"}
    values: 1x60
  - series: cnpg_gitea_worker_credentials_active{namespace="databases",pod="infra-pg-6",worker="dev-worker-bot"}
    values: 1x60
  - series: cnpg_gitea_worker_credentials_tokens{namespace="databases",pod="infra-pg-6",worker="dev-worker-bot"}
    values: 3x60
  - series: cnpg_gitea_worker_credentials_tokens_unexpected{namespace="databases",pod="infra-pg-6",worker="dev-worker-bot"}
    values: 3x60
  - series: cnpg_gitea_worker_credentials_kinds_present{namespace="databases",pod="infra-pg-6",worker="dev-worker-bot"}
    values: '0x60'
  - series: cnpg_gitea_worker_credentials_max_tokens_per_kind{namespace="databases",pod="infra-pg-6",worker="dev-worker-bot"}
    values: '0x60'
  alert_rule_test:
  - eval_time: 60m
    alertname: GiteaWorkerBotUnexpectedToken
    exp_alerts: []
  - eval_time: 60m
    alertname: GiteaWorkerBotTokenKindMissing
    exp_alerts: []
  - eval_time: 60m
