    values: '0x60'
  alert_rule_test:
  - eval_time: 5m
    alertname: GiteaWorkerBotUnexpectedToken
    exp_alerts: []
  - eval_time: 15m
    alertname: GiteaWorkerBotUnexpectedToken
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: databases
        worker: dev-worker-2-bot
      exp_annotations:
        summary: Gitea worker bot dev-worker-2-bot holds 1 unexpected token(s)
        description: A per-slot worker bot holds an access token that is not one of its own dw<N>-(git|repo|pkg)-<stamp> ceremony tokens. Only the enrolment and rotation ceremonies mint tokens for these
          accounts (docs/runbooks/s2s-identity.md). List the account's token names with psql on the infra-pg primary (never token_hash) and delete the stray one by id.
  - eval_time: 25m
    alertname: GiteaWorkerBotTokenKindMissing
    exp_alerts: []
  - eval_time: 35m
    alertname: GiteaWorkerBotTokenKindMissing
