        worker: dev-worker-1-bot
      exp_annotations:
        summary: Gitea worker bot dev-worker-1-bot has held two tokens of one kind for 24h
        description: A rotation mints the new token before deleting the old one, so two tokens of one kind may coexist briefly. After 24 hours the old one should have been deleted by its recorded id (docs/runbooks/s2s-identity.md,
