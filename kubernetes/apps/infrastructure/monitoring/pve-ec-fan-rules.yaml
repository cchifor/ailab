# Proxmox host CPU fans: the Bosgame M5's EC, through the ec_su_axb35 driver (ansible role pve_ec_fan,
# docs/runbooks/node-maintenance.md "EC fan curve"). The ec_* series are node_exporter textfile metrics that
# ec-fan-textfile.timer writes every 30 s (job proxmox-node). They exist only on a host where the role is
# enabled: switching it off deletes the file, so none of these can fire on a host without the role.
#
# ProxmoxCpuFanStalled: fan1 or fan2 (the CPU fans) under 1000 rpm for 5m while the EC reads above 70 C.
# Above 70 C the curve runs them at 40 % or more (level 2 from 55 C, ~2650 rpm), the lowest running level
# (20 %) is ~1540 rpm, and the firmware curve (auto) spins them at that temperature too, so this is a stalled
# fan, a loose fan cable, or an
# EC that stopped following the curve. fan3, the small system fan, is left out on purpose: ai-node1's fan3 does
# not spin even at a fixed 100 % (a known hardware fault: the fan is unplugged or failed), so a fan3 rule would
# fire there permanently. A per-node fan3 alert is a possible follow-up.
#
# ProxmoxEcFanTextfileStale: the file has not been rewritten for 5m (the timer stopped, or the script fails).
# node_exporter keeps serving the last values it read, so the stall alert above would be judging old numbers.
#
# ProxmoxCpuFanNotOnCurve: the driver is loaded, but a CPU fan the profile manages (ec_fan_managed, from the
# profile's fan list) has not been in curve mode for 15m: ec-fan-profile failed (at boot the driver's sysfs did
# not appear within its 10 s wait), or the module was reloaded and nothing restarted the profile. The fan is on
# the firmware curve (auto), which is safe; the CPU-fan curve is not running. A fan dropped from the list is on
# auto by design and is not alerted on; fan3 is not managed by the role. 15m rides out a converge's restart and
# a short hand test.
#
# ProxmoxEcFanGovernorStale: ec-fan-governor (the daemon that decides the CPU fans' levels 3-5 on the smoothed
# EC temperature) has not refreshed the heartbeat in its own file, ec_fan_governor.prom, for 5m: the daemon is
# dead, stopped or stuck, or it keeps failing (it skips the heartbeat on a tick that could not read the EC
# temperature or a governed fan's mode or level, or write a level). The driver's curve still keeps the floor and the instant steps up at
# 95/96/98 C, so the APU is safe, but a fan the governor raised to 60 %+ stays there (the curve's rampdown
# for those levels is low) and a sustained-heat step up waits for 95 C. Turning the role off removes the
# file, so this cannot fire on a host without it. It also fires when ec-fan-profile is stopped by hand for
# 5m (the governor is PartOf it).
#
# ProxmoxEcFanGovernorMissing: the driver is loaded (fresh textfile) but there is no governor file at all for
# 10m: the governor never started (a config its `check` refuses, a missing script), or the file was deleted.
# The stale rule above cannot see a series that does not exist. The governor writes the file as it starts.
#
# ProxmoxEcFanDriverNotLoaded: the file is fresh but says the module is not loaded, for 10m: typically a new
# kernel booted without the module (no headers for it, so DKMS could not build it), or Secure Boot came back on.
# The fans run on the firmware curve (safe), the CPU-fan curve is off, and the rpm series, and with them the
# stall alert, are gone.
# Fixtures: pve-ec-fan-rules.test.yaml.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pve-ec-fan
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: pve-ec-fan
      rules:
        - alert: ProxmoxCpuFanStalled
          expr: |
            ec_fan_rpm{job="proxmox-node", fan=~"1|2"} < 1000
              and on (job, instance) ec_temp_celsius{job="proxmox-node"} > 70
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Proxmox host {{ $labels.instance }} CPU fan {{ $labels.fan }} at {{ $value }} rpm above 70 C"
            description: "CPU fan {{ $labels.fan }} on {{ $labels.instance }} has read under 1000 rpm for 5m while the EC temperature is above 70 C, where the curve runs it at 40 % or more (~2650 rpm). Check on the host: `cat /sys/class/ec_su_axb35/fan{{ $labels.fan }}/{mode,level,rpm}` and `systemctl status ec-fan-profile`. Level 4-5 with a low rpm is the fan or its cable; a low level is the curve: `systemctl restart ec-fan-profile`, or `rmmod ec_su_axb35` to hand the fans back to the firmware. Runbook: docs/runbooks/node-maintenance.md \"EC fan curve\"."
        - alert: ProxmoxEcFanTextfileStale
          expr: time() - ec_fan_textfile_timestamp_seconds{job="proxmox-node"} > 300
          labels:
            severity: warning
          annotations:
            summary: "Proxmox host {{ $labels.instance }}: EC fan metrics not updated for {{ $value | humanizeDuration }}"
            description: "ec-fan-textfile has not rewritten ec_fan.prom on {{ $labels.instance }} for over 5m, so the fan and temperature series are the last values node_exporter read and the CPU-fan stall alert is judging old numbers. Check `systemctl status ec-fan-textfile.timer ec-fan-textfile.service` and `journalctl -u ec-fan-textfile`. Runbook: docs/runbooks/node-maintenance.md \"EC fan curve\"."
        - alert: ProxmoxEcFanGovernorStale
          expr: time() - ec_fan_governor_heartbeat_timestamp_seconds{job="proxmox-node"} > 300
          labels:
            severity: warning
          annotations:
            summary: "Proxmox host {{ $labels.instance }}: ec-fan-governor silent for {{ $value | humanizeDuration }}"
            description: "ec-fan-governor has not rewritten ec_fan_governor.prom on {{ $labels.instance }} for over 5m, so the CPU fans' levels 3-5 are not being decided on the smoothed temperature. The driver's curve still keeps the floor and steps up at 95/96/98 C (the APU is safe), but a fan the governor raised to 60 %+ stays there and a sustained-heat step up waits for 95 C. Check `systemctl status ec-fan-governor ec-fan-profile` and `journalctl -u ec-fan-governor`, then `systemctl restart ec-fan-profile` (it restarts the governor too) or converge `just ec-fan --limit <host>`. Runbook: docs/runbooks/node-maintenance.md \"EC fan curve\"."
        - alert: ProxmoxEcFanGovernorMissing
          expr: |
            ec_fan_driver_loaded{job="proxmox-node"} == 1
              unless on (job, instance) ec_fan_governor_heartbeat_timestamp_seconds{job="proxmox-node"}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Proxmox host {{ $labels.instance }}: the EC fan driver is loaded but ec-fan-governor has never reported"
            description: "On {{ $labels.instance }} the ec_su_axb35 driver has been loaded for 10m but there is no ec_fan_governor.prom, so the CPU fans' levels 3-5 are not decided on the smoothed temperature (the curve's floor and its instant steps up at 95/96/98 C still work). The governor writes that file as it starts: it has not started, or its config is refused. Check `systemctl status ec-fan-governor` and `journalctl -u ec-fan-governor` (a refused config names the rule it breaks), then converge `just ec-fan --limit <host>`. Runbook: docs/runbooks/node-maintenance.md \"EC fan curve\"."
        - alert: ProxmoxCpuFanNotOnCurve
          expr: |
            ec_fan_mode_info{job="proxmox-node", fan=~"1|2", mode!="curve"} == 1
              and on (job, instance, fan) ec_fan_managed{job="proxmox-node"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Proxmox host {{ $labels.instance }}: CPU fan {{ $labels.fan }} is in {{ $labels.mode }} mode, not on the curve"
            description: "ec-fan-profile manages CPU fan {{ $labels.fan }} on {{ $labels.instance }}, but the driver has reported mode {{ $labels.mode }} for 15m, so the CPU-fan curve is not running (in auto the firmware curve still cools it). Usually the profile failed at boot or the module was reloaded without a profile restart: check `systemctl status ec-fan-profile` and `journalctl -b -u ec-fan-profile`, then `systemctl restart ec-fan-profile` or converge `just ec-fan --limit <host>` (the converge restarts it when the fans are off the profile). Runbook: docs/runbooks/node-maintenance.md \"EC fan curve\"."
        - alert: ProxmoxEcFanDriverNotLoaded
          expr: ec_fan_driver_loaded{job="proxmox-node"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Proxmox host {{ $labels.instance }}: ec_su_axb35 is not loaded, the CPU-fan curve is off"
            description: "The EC fan driver has not been loaded on {{ $labels.instance }} for 10m. The fans run on the firmware curve, which is safe, but the CPU-fan curve is off and there are no fan rpm series to alert on. Usually a new kernel booted without the module: check `dkms status ec_su_axb35`, `dpkg -l proxmox-headers-$(uname -r)` and `journalctl -b -u systemd-modules-load -u ec-fan-profile`, then converge `just ec-fan --limit <host>`. Runbook: docs/runbooks/node-maintenance.md \"EC fan curve\"."
