rule_files:
  - objectstore-tls-rules.yaml
evaluation_interval: 1h
tests:
  - name: 90 day certificate renews with 30 days remaining without permanent expiry warning
    interval: 1h
    input_series:
      - series: kube_service_info{namespace="strive-ailab",service="objectstore-forge-tls"}
        values: 1x2200
      - series: probe_success{job="objectstore-tls"}
        values: 1x2200
      - series: probe_ssl_earliest_cert_expiry{job="objectstore-tls"}
        values: 7776000x1439 12960000x761
      - series: certmanager_certificate_expiration_timestamp_seconds{namespace="strive-ailab",name="objectstore-forge-tls"}
        values: 7776000x1439 12960000x761
    alert_rule_test:
      - eval_time: 1439h
        alertname: ObjectstoreTLSProbeFailed
        exp_alerts: []
      - eval_time: 1439h
        alertname: ObjectstoreTLSProbeMissing
        exp_alerts: []
      - eval_time: 1439h
        alertname: ObjectstoreTLSCertificateTelemetryMissing
        exp_alerts: []
      - eval_time: 1439h
        alertname: ObjectstoreTLSCertificateExpiring
        exp_alerts: []
      - eval_time: 1439h
        alertname: ObjectstoreTLSIssuedCertificateAhead
        exp_alerts: []
      - eval_time: 1440h
        alertname: ObjectstoreTLSProbeFailed
        exp_alerts: []
      - eval_time: 1440h
        alertname: ObjectstoreTLSProbeMissing
        exp_alerts: []
      - eval_time: 1440h
        alertname: ObjectstoreTLSCertificateTelemetryMissing
        exp_alerts: []
      - eval_time: 1440h
        alertname: ObjectstoreTLSCertificateExpiring
        exp_alerts: []
      - eval_time: 1440h
        alertname: ObjectstoreTLSIssuedCertificateAhead
        exp_alerts: []
      - eval_time: 1456h
        alertname: ObjectstoreTLSProbeFailed
        exp_alerts: []
      - eval_time: 1456h
        alertname: ObjectstoreTLSProbeMissing
        exp_alerts: []
      - eval_time: 1456h
        alertname: ObjectstoreTLSCertificateTelemetryMissing
        exp_alerts: []
      - eval_time: 1456h
        alertname: ObjectstoreTLSCertificateExpiring
        exp_alerts: []
      - eval_time: 1456h
        alertname: ObjectstoreTLSIssuedCertificateAhead
        exp_alerts: []
      - eval_time: 2160h
        alertname: ObjectstoreTLSProbeFailed
        exp_alerts: []
      - eval_time: 2160h
        alertname: ObjectstoreTLSProbeMissing
        exp_alerts: []
      - eval_time: 2160h
        alertname: ObjectstoreTLSCertificateTelemetryMissing
        exp_alerts: []
      - eval_time: 2160h
        alertname: ObjectstoreTLSCertificateExpiring
        exp_alerts: []
      - eval_time: 2160h
        alertname: ObjectstoreTLSIssuedCertificateAhead
        exp_alerts: []
