# Alerts over the Gitea forge's STANDING CREDENTIALS (git.chifor.me, the master forge — ADR 0017).
# Written for the 2026-10-07 auth-hardening plan (B5): the inventory then showed the org account
# `cchifor` holding 26 access tokens (spec and runbook said 21), `gitea_admin` 41 of which only two are
# documented consumers, and `chifor` one token plus an OAuth2 grant to the Git Credential Manager app.
# Gitea access tokens have no expiry column, so nothing ages them out and nothing counted them.
#
# SOURCE: the custom CNPG exporter queries in apps/databases/infra-pg-gitea-credential-queries.yaml,
# scraped from the infra-pg pods through PodMonitor infra-pg-metrics. COUNTS AND AGES ONLY — never a
# token value, hash, name or id. Per owner (cchifor, chifor, gitea_admin and any is_admin user) the
# exporter emits cnpg_gitea_credentials_{tokens,oldest_token_age_seconds,tokens_not_allowlisted,
# oauth_grants}, zero-filled, plus the unlabelled cnpg_gitea_site_admins_total.
#
# EVERY EXPRESSION IS `max by (namespace, owner)` (or by namespace): the exporter runs on the primary
# only (`primary: true`) but a failover overlap or a dropped `primary:` would otherwise double the alert
# per pod, and the alert is about the owner, not the pod.
#
# ZERO IS NOT MISSING. A valid owner with no tokens exports a ROW OF ZEROS, so GiteaCredentialInventoryMissing
# watches ABSENCE only, per (family, owner): one absent() per required metric family and per required
# owner, each wrapped in label_replace to carry the family name. A single absent(<one family>) or a
# count() < N would stay silent when one owner's row (or one family) disappears while the rest are
# still present — the exact blind spot this alert is for. The fixtures pin both directions.
#
# EXPECTED TO FIRE ON LOAD, until the B6 clean-up deletes the credentials: GiteaOrgAccountHasTokens
# (cchifor, 26), GiteaOwnerTokenStanding (chifor, cc-admin-20260913), GiteaAdminTokenNotAllowlisted
# (gitea_admin, 39) and GiteaOwnerOAuthGrant (chifor, the Git Credential Manager grant). They are meant
# to be silenced by exactly those alertname+owner pairs, with an expiry, not removed.
#
# `release: kube-prometheus-stack` so the operator's ruleSelector picks it up (same convention as
# backup-rules.yaml / reviewbot-rules.yaml). Fixtures in gitea-credential-rules.test.yaml (NOT a
# resource — promtool only, via scripts/rules-lint.sh).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gitea-credential
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: gitea-credential
      rules:
        # The org account is a converted user that should hold NOTHING: any token on it acts with the
        # organization's identity. Scoped to cchifor by name.
        - alert: GiteaOrgAccountHasTokens
          expr: max by (namespace, owner) (cnpg_gitea_credentials_tokens{namespace="databases", owner="cchifor"}) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Gitea org account {{ $labels.owner }} holds {{ $value | humanize }} access token(s)"
            description: >-
              The organization account cchifor (a converted user, uid 2) holds access tokens, and an
              organization account should hold none: each one acts with the org's identity, and
              Gitea access tokens never expire. Move every consumer to a per-purpose bot account,
              then delete the token (API with basic auth of gitea_admin, or the account's
              Applications page). Count and age only are exported - never the token values.
        # The owner's interactive credential is minted for a task and deleted afterwards. The oldest
        # token's age (created_unix) is 0 when the owner holds none, so a clean owner never matches.
        - alert: GiteaOwnerTokenStanding
          expr: max by (namespace, owner) (cnpg_gitea_credentials_oldest_token_age_seconds{namespace="databases", owner="chifor"}) > 4 * 3600
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Gitea owner {{ $labels.owner }} holds a token older than 4h"
            description: >-
              The oldest access token of the owner account chifor is more than 4 hours old. The owner's
              tokens are minted for a task and deleted afterwards; Gitea access tokens never
              expire, so one left behind is a standing credential with the owner's site-admin
              rights. Find it by id and name (never token_hash) and delete it.
        # gitea_admin is the break-glass site admin. Its allowlist is exactly its two documented
        # consumers, keyed by (id, name, scope) INSIDE the exporter query; only the count of tokens
        # outside it leaves the database.
        - alert: GiteaAdminTokenNotAllowlisted
          expr: max by (namespace, owner) (cnpg_gitea_credentials_tokens_not_allowlisted{namespace="databases", owner="gitea_admin"}) > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Gitea {{ $labels.owner }} holds {{ $value | humanize }} token(s) outside its allowlist"
            description: >-
              The break-glass site-admin account gitea_admin holds access tokens that are not on its
              allowlist. The allowlist is exactly two documented consumers, keyed by id, name and
              scope (ConfigMap infra-pg-gitea-credential-queries): af-ci-scaler-2941 (read:admin)
              and flux-ailab-read (read:repository). Anything else is an undocumented credential
              on a site-admin identity. List id, name and scope with psql on the infra-pg primary
              and delete it through the API; a rotated documented token needs its new id added to
              the allowlist in the same PR.
        # An OAuth2 grant yields refresh tokens that outlive access tokens and are NOT in the token
        # list, so the token rules cannot see them.
        - alert: GiteaOwnerOAuthGrant
          expr: max by (namespace, owner) (cnpg_gitea_credentials_oauth_grants{namespace="databases", owner="chifor"}) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Gitea owner {{ $labels.owner }} has {{ $value | humanize }} OAuth2 grant(s)"
            description: >-
              The owner account chifor has authorised an OAuth2 application (the built-in Git
              Credential Manager app issues refresh tokens that outlive any access token and do not
              appear in the token list). Revoke it under Settings, Applications, Authorized OAuth2
              Applications, or delete the oauth2_grant row.
        # The site-admin set is two people. The literal 2 below is that decision; when the set changes
        # on purpose, change it in the same PR. An ABSENT series does not match `!= 2` (the empty vector
        # has no members), which is GiteaCredentialInventoryMissing's job.
        - alert: GiteaAdminUserCountChanged
          expr: max by (namespace) (cnpg_gitea_site_admins_total{namespace="databases"}) != 2
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Gitea has {{ $value | humanize }} site admins (expected 2)"
            description: >-
              Gitea should have exactly two site admins, gitea_admin and chifor. A third is a
              privilege change nobody announced; one fewer means an admin lost the flag. List them
              with psql on the infra-pg primary (select name, is_admin from "user"). When the admin
              set changes on purpose, change the literal 2 in gitea-credential-rules.yaml in the
              same PR.
        # ONE absent() PER (family, owner), joined with `or` and tagged with the family name through
        # label_replace (absent() only carries its equality matchers, so without it every family's alert for
        # an owner would be the same label set and `or` would keep just one). Required: the four
        # per-owner families for cchifor, chifor and gitea_admin, plus the site-admin count. 13 terms.
        # The hold is 30m: a CNPG failover or a pod roll drops the series for a scrape or two, never
        # for half an hour.
        - alert: GiteaCredentialInventoryMissing
          expr: |
            label_replace(absent(cnpg_gitea_credentials_tokens{namespace="databases", owner="cchifor"}), "family", "cnpg_gitea_credentials_tokens", "", "")
            or label_replace(absent(cnpg_gitea_credentials_tokens{namespace="databases", owner="chifor"}), "family", "cnpg_gitea_credentials_tokens", "", "")
            or label_replace(absent(cnpg_gitea_credentials_tokens{namespace="databases", owner="gitea_admin"}), "family", "cnpg_gitea_credentials_tokens", "", "")
            or label_replace(absent(cnpg_gitea_credentials_oldest_token_age_seconds{namespace="databases", owner="cchifor"}), "family", "cnpg_gitea_credentials_oldest_token_age_seconds", "", "")
            or label_replace(absent(cnpg_gitea_credentials_oldest_token_age_seconds{namespace="databases", owner="chifor"}), "family", "cnpg_gitea_credentials_oldest_token_age_seconds", "", "")
            or label_replace(absent(cnpg_gitea_credentials_oldest_token_age_seconds{namespace="databases", owner="gitea_admin"}), "family", "cnpg_gitea_credentials_oldest_token_age_seconds", "", "")
            or label_replace(absent(cnpg_gitea_credentials_tokens_not_allowlisted{namespace="databases", owner="cchifor"}), "family", "cnpg_gitea_credentials_tokens_not_allowlisted", "", "")
            or label_replace(absent(cnpg_gitea_credentials_tokens_not_allowlisted{namespace="databases", owner="chifor"}), "family", "cnpg_gitea_credentials_tokens_not_allowlisted", "", "")
            or label_replace(absent(cnpg_gitea_credentials_tokens_not_allowlisted{namespace="databases", owner="gitea_admin"}), "family", "cnpg_gitea_credentials_tokens_not_allowlisted", "", "")
            or label_replace(absent(cnpg_gitea_credentials_oauth_grants{namespace="databases", owner="cchifor"}), "family", "cnpg_gitea_credentials_oauth_grants", "", "")
            or label_replace(absent(cnpg_gitea_credentials_oauth_grants{namespace="databases", owner="chifor"}), "family", "cnpg_gitea_credentials_oauth_grants", "", "")
            or label_replace(absent(cnpg_gitea_credentials_oauth_grants{namespace="databases", owner="gitea_admin"}), "family", "cnpg_gitea_credentials_oauth_grants", "", "")
            or label_replace(absent(cnpg_gitea_site_admins_total{namespace="databases"}), "family", "cnpg_gitea_site_admins_total", "", "")
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Gitea credential inventory series missing: {{ $labels.family }}{{ if $labels.owner }} for {{ $labels.owner }}{{ end }}"
            description: >-
              One of the cnpg_gitea_* inventory series (see the family and owner labels) has been
              absent for 30 minutes, so the credential alerts in this group are blind to it. A valid
              owner with nothing to report still exports a row of zeros, so absence means the account
              is gone or renamed, the custom query is failing, or the exporter is not being scraped.
              Check the ConfigMap infra-pg-gitea-credential-queries, the
              cnpg_collector_last_collection_error series, the infra-pg primary's log and the
              infra-pg-metrics target.
