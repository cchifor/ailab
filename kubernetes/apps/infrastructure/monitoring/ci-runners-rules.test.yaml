# `promtool test rules` fixtures for ci-runners-rules.yaml (run by scripts/rules-lint.sh, which picks
# up any <rule>.test.yaml sibling). Covers the shared-cache and dead-root-filesystem alerts added for
# plans/2026-10-12-runner-between-job-cleanup-plan.md (PR 3); each case asserts the firing case AND a
# silent twin, so an alert that can never fire (or always fires) is caught here.
# Expected annotations are rendered from the rule file with the fixture labels.
rule_files:
  - ci-runners-rules.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    name: corrupt entries still queued after 30m fire; a purged queue does not
    input_series:
      - series: gitea_runner_cache_corrupt_pending{job="ci-runner-node", instance="192.168.0.15:9100", cache="uv"}
        values: 1+0x60
      - series: gitea_runner_cache_corrupt_pending{job="ci-runner-node", instance="192.168.0.16:9100", cache="uv"}
        values: 1+0x10 0+0x50
    alert_rule_test:
      - eval_time: 20m
        alertname: CIRunnerCacheCorruptPending
        exp_alerts: []
      - eval_time: 45m
        alertname: CIRunnerCacheCorruptPending
        exp_alerts:
          - exp_labels:
              instance: 192.168.0.15:9100
              cache: uv
              severity: warning
            exp_annotations:
              summary: CI runner 192.168.0.15:9100 has corrupt uv cache entries not yet purged
              description: 'The nightly cache verify found uv cache entries on 192.168.0.15:9100 whose content no longer matches their own hash, and they are still in the purge queue, so every job that
                installs them fails (uv; npm re-fetches). The queue is applied inside act_runner''s next start (its ExecStartPre); the cleanup restarts it in an idle gap at most every 6h, so a never-idle
                runner keeps them. `systemctl restart gitea-act-runner` applies it at once (waits for the running job). Then read /var/lib/gitea-runner-cache/result.json and `journalctl -t gitea-runner-cache-purge`.
                Corruption points at the host, not the job: see docs/runbooks/ci-runners.md.'
  - interval: 1m
    name: no verify beacon for 30h on a long-up runner fires; one with the beacon, or just booted, does not
    input_series:
      - series: up{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 1+0x2880
      - series: up{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 1+0x2880
      - series: node_boot_time_seconds{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 0+0x2880
      - series: node_boot_time_seconds{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 0+0x2880
      - series: gitea_runner_cache_verify_last_run_seconds{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 0+60x2880
      - series: up{job="ci-runner-node", instance="192.168.0.17:9100"}
        values: 1+0x2880
      - series: node_boot_time_seconds{job="ci-runner-node", instance="192.168.0.17:9100"}
        values: 0+60x2880
    alert_rule_test:
      - eval_time: 20h
        alertname: CIRunnerCacheVerifyBeaconMissing
        exp_alerts: []
      - eval_time: 36h
        alertname: CIRunnerCacheVerifyBeaconMissing
        exp_alerts:
          - exp_labels:
              job: ci-runner-node
              instance: 192.168.0.15:9100
              severity: warning
            exp_annotations:
              summary: CI runner 192.168.0.15:9100 has never published a cache-verify beacon
              description: '192.168.0.15:9100 is scraped but has no gitea_runner_cache_verify_last_run_seconds: the nightly gitea-runner-cache-verify.timer has never completed a run there. Check `systemctl
                status gitea-runner-cache-verify.timer gitea-runner-cache-verify.service`.'
  - interval: 1m
    name: a verify that last ran over 3 days ago fires; a nightly one, or a just-booted runner, does not
    input_series:
      - series: up{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 1+0x5400
      - series: up{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 1+0x5400
      - series: node_boot_time_seconds{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 0+0x5400
      - series: node_boot_time_seconds{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 0+0x5400
      - series: gitea_runner_cache_verify_last_run_seconds{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 0+0x5400
      - series: gitea_runner_cache_verify_last_run_seconds{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 0+60x5400
      - series: up{job="ci-runner-node", instance="192.168.0.17:9100"}
        values: 1+0x5400
      - series: node_boot_time_seconds{job="ci-runner-node", instance="192.168.0.17:9100"}
        values: 0+60x5400
      - series: gitea_runner_cache_verify_last_run_seconds{job="ci-runner-node", instance="192.168.0.17:9100"}
        values: 0+0x5400
    alert_rule_test:
      - eval_time: 70h
        alertname: CIRunnerCacheVerifyStale
        exp_alerts: []
      - eval_time: 75h
        alertname: CIRunnerCacheVerifyStale
        exp_alerts:
          - exp_labels:
              job: ci-runner-node
              instance: 192.168.0.15:9100
              severity: warning
            exp_annotations:
              summary: CI runner 192.168.0.15:9100 cache verify has not run for over 3 days
              description: The nightly shared-cache integrity check on 192.168.0.15:9100 last finished more than 3 days ago. Check `systemctl status gitea-runner-cache-verify.service` and its journal.
  - interval: 1m
    name: nothing readable (no mtime series) pages critical; one bad beacon is a warning; a blip is nothing
    input_series:
      - series: node_textfile_scrape_error{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 0+0x5 1+0x30
      - series: node_textfile_mtime_seconds{job="ci-runner-node", instance="192.168.0.15:9100", file="/x/a.prom"}
        values: 1+0x5 stale
      - series: node_textfile_scrape_error{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 0+0x5 1+0x30
      - series: node_textfile_mtime_seconds{job="ci-runner-node", instance="192.168.0.16:9100", file="/x/a.prom"}
        values: 1+0x35
      - series: node_textfile_scrape_error{job="ci-runner-node", instance="192.168.0.17:9100"}
        values: 0+0x5 1 0+0x29
      - series: node_textfile_mtime_seconds{job="ci-runner-node", instance="192.168.0.17:9100", file="/x/a.prom"}
        values: 1+0x35
    alert_rule_test:
      - eval_time: 7m
        alertname: CIRunnerRootFilesystemFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: CIRunnerRootFilesystemFailed
        exp_alerts:
          - exp_labels:
              job: ci-runner-node
              instance: 192.168.0.15:9100
              severity: critical
            exp_annotations:
              summary: CI runner 192.168.0.15:9100 cannot read any node_exporter textfile (root filesystem failed?)
              description: 'node_exporter on 192.168.0.15:9100 reads none of its textfiles. That is a shut-down root filesystem: SSH resets during key exchange and commands fail with EIO. See docs/runbooks/ci-runners.md
                "A runner whose root filesystem has died": confirm via the guest agent, pause the runner in Gitea, then `qm reset`.'
      - eval_time: 12m
        alertname: CIRunnerTextfileBeaconUnreadable
        exp_alerts: []
      - eval_time: 25m
        alertname: CIRunnerTextfileBeaconUnreadable
        exp_alerts:
          - exp_labels:
              job: ci-runner-node
              instance: 192.168.0.16:9100
              severity: warning
            exp_annotations:
              summary: CI runner 192.168.0.16:9100 has a textfile beacon node_exporter cannot parse
              description: One of the gitea_runner beacons in /var/lib/prometheus/node-exporter on 192.168.0.16:9100 is malformed (the other files still parse). Its alerts are blind until it is fixed; check
                `journalctl -u prometheus-node-exporter` for the file name.
  - interval: 1m
    name: a verify that saw read flaps (an intact file read wrong) warns after 5m; a clean runner does not
    input_series:
      - series: gitea_runner_cache_read_flaps{job="ci-runner-node", instance="192.168.0.15:9100", cache="uv"}
        values: 1+0x20
      - series: gitea_runner_cache_read_flaps{job="ci-runner-node", instance="192.168.0.16:9100", cache="uv"}
        values: 0+0x20
    alert_rule_test:
      - eval_time: 3m
        alertname: CIRunnerCacheReadFlaps
        exp_alerts: []
      - eval_time: 10m
        alertname: CIRunnerCacheReadFlaps
        exp_alerts:
          - exp_labels:
              instance: 192.168.0.15:9100
              cache: uv
              severity: warning
            exp_annotations:
              summary: CI runner 192.168.0.15:9100 read different bytes from an intact uv cache file
              description: 'The last nightly cache verify on 192.168.0.15:9100 hashed a uv file wrong, then right on a fresh re-read: the file is intact and the READ was corrupted in memory. Jobs on this
                runner crash at random (segfaults in python, libc, rustc). Pause the runner in Gitea and investigate its host: docs/runbooks/ci-runners.md "A runner that corrupts memory".'
  - interval: 1m
    name: a BuildKit cache.db over 8 GB for 6h warns; one under it, or over it for less, does not
    input_series:
      - series: gitea_runner_cleanup_buildkit_db_bytes{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 24586000000+0x480
      - series: gitea_runner_cleanup_buildkit_db_bytes{job="ci-runner-node", instance="192.168.0.18:9100"}
        values: 2523000000+0x480
      - series: gitea_runner_cleanup_buildkit_db_bytes{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 9000000000+0x200 1000000000+0x280
    alert_rule_test:
      - eval_time: 5h
        alertname: CIRunnerBuildkitDbLarge
        exp_alerts: []
      - eval_time: 7h
        alertname: CIRunnerBuildkitDbLarge
        exp_alerts:
          - exp_labels:
              job: ci-runner-node
              instance: 192.168.0.15:9100
              severity: warning
            exp_annotations:
              summary: CI runner 192.168.0.15:9100 BuildKit cache.db is 22.9GiB
              description: 'BuildKit''s solver cache-key index on 192.168.0.15:9100 has grown past 8 GB. It never gives space back on its own and `docker system df` does not count it. Reset it in a drained window: docs/runbooks/ci-runners.md, Troubleshooting, "BuildKit cache.db".'
  - interval: 1m
    name: leaked buildx builders over 10 GB for 1h warn; under 10 GB, or over it for less, do not
    input_series:
      - series: gitea_runner_buildx_leaked_bytes{job="ci-runner-node", instance="192.168.0.31:9100"}
        values: 21474836480+0x120
      - series: gitea_runner_buildx_leaked_bytes{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 5000000000+0x120
      - series: gitea_runner_buildx_leaked_bytes{job="ci-runner-node", instance="192.168.0.23:9100"}
        values: 21474836480+0x30 0+0x90
    alert_rule_test:
      - eval_time: 50m
        alertname: CIRunnerLeakedBuildxBuilders
        exp_alerts: []
      - eval_time: 70m
        alertname: CIRunnerLeakedBuildxBuilders
        exp_alerts:
          - exp_labels:
              job: ci-runner-node
              instance: 192.168.0.31:9100
              severity: warning
            exp_annotations:
              summary: CI runner 192.168.0.31:9100 holds 20GiB in leaked buildx builders
              description: 'Builders that cancelled or killed jobs left behind on 192.168.0.31:9100 hold this much disk, and nothing reclaims them (gitea_runner_buildx_leaked_builders says how many). Reap them by hand on an idle runner: docs/runbooks/ci-runners.md, Troubleshooting, "Leaked buildx builders".'
  - interval: 1m
    name: no leaked-bytes series (a runner without the new script) does not warn
    input_series:
      - series: gitea_runner_buildx_leaked_builders{job="ci-runner-node", instance="192.168.0.31:9100"}
        values: 5+0x120
    alert_rule_test:
      - eval_time: 70m
        alertname: CIRunnerLeakedBuildxBuilders
        exp_alerts: []
  - interval: 1m
    name: leaked bytes from another job (a cloud runner) do not raise the on-prem alert
    input_series:
      - series: gitea_runner_buildx_leaked_bytes{job="ci-runner-cloud", instance="192.168.0.35:9100"}
        values: 21474836480+0x120
    alert_rule_test:
      - eval_time: 70m
        alertname: CIRunnerLeakedBuildxBuilders
        exp_alerts: []
  # ---- thin-pool trim (CIRunnerFstrim*): each rule keys on the role's gitea_runner_fstrim_enabled marker ----
  - interval: 1m
    name: a failed trim on a trim-enabled runner warns with its reason; a clean run, or the trim off, does not
    input_series:
      - series: gitea_runner_fstrim_enabled{job="ci-runner-node", instance="192.168.0.14:9100"}
        values: 1+0x60
      - series: gitea_runner_fstrim_exit_code{job="ci-runner-node", instance="192.168.0.14:9100"}
        values: 5+0x60
      - series: gitea_runner_fstrim_exit_reason{job="ci-runner-node", instance="192.168.0.14:9100", reason="fstrim_failed"}
        values: 1+0x60
      - series: gitea_runner_fstrim_enabled{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 1+0x60
      - series: gitea_runner_fstrim_exit_code{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 0+0x60
      - series: gitea_runner_fstrim_exit_reason{job="ci-runner-node", instance="192.168.0.15:9100", reason="window"}
        values: 1+0x60
      - series: gitea_runner_fstrim_exit_code{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 5+0x60
      - series: gitea_runner_fstrim_exit_reason{job="ci-runner-node", instance="192.168.0.16:9100", reason="fstrim_failed"}
        values: 1+0x60
    alert_rule_test:
      - eval_time: 5m
        alertname: CIRunnerFstrimFailed
        exp_alerts: []
      - eval_time: 15m
        alertname: CIRunnerFstrimFailed
        exp_alerts:
          - exp_labels:
              job: ci-runner-node
              instance: 192.168.0.14:9100
              reason: fstrim_failed
              severity: warning
            exp_annotations:
              summary: CI runner 192.168.0.14:9100 thin-pool trim ended with exit 5 (fstrim_failed)
              description: 'The last nightly chunked trim on 192.168.0.14:9100 failed. unsupported (1): / is not ext4 or its geometry is unreadable; invalid (2): a bad gitea_runner_fstrim_* setting; fstrim_failed (5); state (6): the cursor file cannot be written or synced; stuck (8): see CIRunnerFstrimStuck; signal (143/130): stopped, by hand or by the unit''s timeout. Read `journalctl -u gitea-runner-fstrim.service`. Freed space stays allocated on the node''s NVMe until it runs cleanly.'
  - interval: 1m
    name: a trim beacon over 26h old on a trim-enabled runner warns; a nightly one, or the trim off, does not
    input_series:
      - series: up{job="ci-runner-node", instance="192.168.0.14:9100"}
        values: 1+0x1700
      - series: up{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 1+0x1700
      - series: up{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 1+0x1700
      - series: gitea_runner_fstrim_enabled{job="ci-runner-node", instance="192.168.0.14:9100"}
        values: 1+0x1700
      - series: gitea_runner_fstrim_enabled{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 1+0x1700
      - series: gitea_runner_fstrim_last_run_seconds{job="ci-runner-node", instance="192.168.0.14:9100"}
        values: 0+0x1700
      - series: gitea_runner_fstrim_last_run_seconds{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 0+60x1700
      - series: gitea_runner_fstrim_last_run_seconds{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 0+0x1700
    alert_rule_test:
      - eval_time: 26h30m
        alertname: CIRunnerFstrimStale
        exp_alerts: []
      - eval_time: 28h
        alertname: CIRunnerFstrimStale
        exp_alerts:
          - exp_labels:
              job: ci-runner-node
              instance: 192.168.0.14:9100
              severity: warning
            exp_annotations:
              summary: CI runner 192.168.0.14:9100 thin-pool trim has not run for over 26h
              description: 'gitea-runner-fstrim.timer fires every night at the start of the runner''s window, and every run rewrites its beacon, so on 192.168.0.14:9100 it has missed at least one night: the timer is masked or disabled, the unit fails before the script starts, or the VM was down at the window start (Persistent=false: no catch-up). Check `systemctl status gitea-runner-fstrim.timer gitea-runner-fstrim.service`.'
  - interval: 1m
    name: a trim-enabled runner that never wrote the trim beacon warns after 27h; one that did, or the trim off, does not
    input_series:
      - series: gitea_runner_fstrim_enabled{job="ci-runner-node", instance="192.168.0.14:9100"}
        values: 1+0x1700
      - series: gitea_runner_fstrim_enabled{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 1+0x1700
      - series: gitea_runner_fstrim_last_run_seconds{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 0+60x1700
      - series: up{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 1+0x1700
    alert_rule_test:
      - eval_time: 26h
        alertname: CIRunnerFstrimBeaconMissing
        exp_alerts: []
      - eval_time: 28h
        alertname: CIRunnerFstrimBeaconMissing
        exp_alerts:
          - exp_labels:
              job: ci-runner-node
              instance: 192.168.0.14:9100
              severity: warning
            exp_annotations:
              summary: CI runner 192.168.0.14:9100 has the thin-pool trim enabled but has never published its beacon
              description: 'The gitea_runner role turned the nightly trim on for 192.168.0.14:9100, but no run has ever written gitea_runner_fstrim.prom: the timer has not fired in the 27h since (a first run comes at the next window start, within 24h). Check `systemctl status gitea-runner-fstrim.timer` and `systemctl list-timers gitea-runner-fstrim.timer`.'
  - interval: 1m
    name: three nights in a row ending at the deadline warn; one night, or the trim off, does not
    input_series:
      - series: gitea_runner_fstrim_enabled{job="ci-runner-node", instance="192.168.0.14:9100"}
        values: 1+0x3060
      - series: gitea_runner_fstrim_enabled{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 1+0x3060
      - series: gitea_runner_fstrim_exit_reason{job="ci-runner-node", instance="192.168.0.14:9100", reason="deadline"}
        values: 1+0x3060
      - series: gitea_runner_fstrim_exit_reason{job="ci-runner-node", instance="192.168.0.15:9100", reason="deadline"}
        values: 1+0x1440 stale
      - series: gitea_runner_fstrim_exit_reason{job="ci-runner-node", instance="192.168.0.15:9100", reason="cap"}
        values: _x1441 1+0x1618
      - series: gitea_runner_fstrim_exit_reason{job="ci-runner-node", instance="192.168.0.16:9100", reason="deadline"}
        values: 1+0x3060
    alert_rule_test:
      - eval_time: 48h
        alertname: CIRunnerFstrimDeadlineRepeated
        exp_alerts: []
      - eval_time: 50h
        alertname: CIRunnerFstrimDeadlineRepeated
        exp_alerts:
          - exp_labels:
              job: ci-runner-node
              instance: 192.168.0.14:9100
              reason: deadline
              severity: warning
            exp_annotations:
              summary: CI runner 192.168.0.14:9100 thin-pool trim hit its deadline three nights in a row
              description: 'On 192.168.0.14:9100 a TRIM slice has overrun the window end by the kill allowance on each of the last three nights: TRIM on the node''s NVMe is much slower than the 30 s/GiB the slices are sized for, and the cursor is stuck there. Check the node''s drive (wear, thermals, other discards at that hour) before raising gitea_runner_fstrim_sec_per_gb.'
  - interval: 1m
    name: a stuck trim pages at once on a trim-enabled runner; another reason, or the trim off, does not
    input_series:
      - series: gitea_runner_fstrim_enabled{job="ci-runner-node", instance="192.168.0.14:9100"}
        values: 1+0x30
      - series: gitea_runner_fstrim_exit_reason{job="ci-runner-node", instance="192.168.0.14:9100", reason="stuck"}
        values: _x5 1+0x25
      - series: gitea_runner_fstrim_enabled{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 1+0x30
      - series: gitea_runner_fstrim_exit_reason{job="ci-runner-node", instance="192.168.0.15:9100", reason="deadline"}
        values: 1+0x30
      - series: gitea_runner_fstrim_exit_reason{job="ci-runner-node", instance="192.168.0.16:9100", reason="stuck"}
        values: 1+0x30
    alert_rule_test:
      - eval_time: 4m
        alertname: CIRunnerFstrimStuck
        exp_alerts: []
      - eval_time: 7m
        alertname: CIRunnerFstrimStuck
        exp_alerts:
          - exp_labels:
              job: ci-runner-node
              instance: 192.168.0.14:9100
              reason: stuck
              severity: critical
            exp_annotations:
              summary: 'CI runner 192.168.0.14:9100 thin-pool trim is stuck: a FITRIM outlived SIGKILL'
              description: 'On 192.168.0.14:9100 a TRIM slice was killed at its window''s deadline and was still alive after the stuck grace: a discard the kernel cannot cancel, which may overlap the next runner''s trim window on the same node (and its etcd). It holds the trim lock until it ends. Before the next window: build the host-side admission interlock (docs/runbooks/ci-runners.md "Thin-pool trim", "Residual risk"), or stop the trim on that node''s runners. Look at the node''s drive.'
  - interval: 1m
    name: a TRIM slice in flight for over 2h warns; one cleared in time, or the trim off, does not
    input_series:
      - series: gitea_runner_fstrim_enabled{job="ci-runner-node", instance="192.168.0.14:9100"}
        values: 1+0x200
      - series: gitea_runner_fstrim_in_flight{job="ci-runner-node", instance="192.168.0.14:9100"}
        values: 1+0x200
      - series: gitea_runner_fstrim_enabled{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 1+0x200
      - series: gitea_runner_fstrim_in_flight{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 1+0x100 0+0x100
      - series: gitea_runner_fstrim_in_flight{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 1+0x200
    alert_rule_test:
      - eval_time: 110m
        alertname: CIRunnerFstrimInFlight
        exp_alerts: []
      - eval_time: 125m
        alertname: CIRunnerFstrimInFlight
        exp_alerts:
          - exp_labels:
              job: ci-runner-node
              instance: 192.168.0.14:9100
              severity: warning
            exp_annotations:
              summary: CI runner 192.168.0.14:9100 has had a TRIM slice in flight for over 2h
              description: 'gitea_runner_fstrim_in_flight has been 1 on 192.168.0.14:9100 for longer than any run can take (the longest window plus the kill allowance and the stuck grace): a fstrim was never reaped, so it may still be discarding outside its window. Check `pgrep -a fstrim` and `journalctl -u gitea-runner-fstrim.service`; with CIRunnerFstrimStuck, see that alert.'
