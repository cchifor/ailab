# `promtool test rules` fixtures for ci-runners-rules.yaml (run by scripts/rules-lint.sh, which picks
# up any <rule>.test.yaml sibling). Covers the shared-cache and dead-root-filesystem alerts added for
# plans/2026-10-12-runner-between-job-cleanup-plan.md (PR 3); each case asserts the firing case AND a
# silent twin, so an alert that can never fire (or always fires) is caught here.
# Expected annotations are rendered from the rule file with the fixture labels.
rule_files:
  - ci-runners-rules.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    name: corrupt entries still queued after 30m fire; a purged queue does not
    input_series:
      - series: gitea_runner_cache_corrupt_pending{job="ci-runner-node", instance="192.168.0.15:9100", cache="uv"}
        values: 1+0x60
      - series: gitea_runner_cache_corrupt_pending{job="ci-runner-node", instance="192.168.0.16:9100", cache="uv"}
        values: 1+0x10 0+0x50
    alert_rule_test:
      - eval_time: 20m
        alertname: CIRunnerCacheCorruptPending
        exp_alerts: []
      - eval_time: 45m
        alertname: CIRunnerCacheCorruptPending
        exp_alerts:
          - exp_labels:
              instance: 192.168.0.15:9100
              cache: uv
              severity: warning
            exp_annotations:
              summary: CI runner 192.168.0.15:9100 has corrupt uv cache entries not yet purged
              description: 'The nightly cache verify found uv cache entries on 192.168.0.15:9100 whose content no longer matches their own hash, and they are still in the purge queue, so every job that
                installs them fails (uv; npm re-fetches). The queue is applied with act_runner down, at its next restart; the cleanup restarts it in an idle gap at most every 6h, so a never-idle runner
                keeps them. `systemctl restart gitea-act-runner` applies it at once (waits for the running job). Then read /var/lib/gitea-runner-cache/result.json and `journalctl -t gitea-runner-cache-purge`.
                Corruption points at the host, not the job: see docs/runbooks/ci-runners.md.'
  - interval: 1m
    name: no verify beacon for 30h on a long-up runner fires; one with the beacon, or just booted, does not
    input_series:
      - series: up{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 1+0x2880
      - series: up{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 1+0x2880
      - series: node_boot_time_seconds{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 0+0x2880
      - series: node_boot_time_seconds{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 0+0x2880
      - series: gitea_runner_cache_verify_last_run_seconds{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 0+60x2880
      - series: up{job="ci-runner-node", instance="192.168.0.17:9100"}
        values: 1+0x2880
      - series: node_boot_time_seconds{job="ci-runner-node", instance="192.168.0.17:9100"}
        values: 0+60x2880
    alert_rule_test:
      - eval_time: 20h
        alertname: CIRunnerCacheVerifyBeaconMissing
        exp_alerts: []
      - eval_time: 36h
        alertname: CIRunnerCacheVerifyBeaconMissing
        exp_alerts:
          - exp_labels:
              job: ci-runner-node
              instance: 192.168.0.15:9100
              severity: warning
            exp_annotations:
              summary: CI runner 192.168.0.15:9100 has never published a cache-verify beacon
              description: '192.168.0.15:9100 is scraped but has no gitea_runner_cache_verify_last_run_seconds: the nightly gitea-runner-cache-verify.timer has never completed a run there. Check `systemctl
                status gitea-runner-cache-verify.timer gitea-runner-cache-verify.service`.'
  - interval: 1m
    name: a verify that last ran over 3 days ago fires; a nightly one, or a just-booted runner, does not
    input_series:
      - series: up{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 1+0x5400
      - series: up{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 1+0x5400
      - series: node_boot_time_seconds{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 0+0x5400
      - series: node_boot_time_seconds{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 0+0x5400
      - series: gitea_runner_cache_verify_last_run_seconds{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 0+0x5400
      - series: gitea_runner_cache_verify_last_run_seconds{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 0+60x5400
      - series: up{job="ci-runner-node", instance="192.168.0.17:9100"}
        values: 1+0x5400
      - series: node_boot_time_seconds{job="ci-runner-node", instance="192.168.0.17:9100"}
        values: 0+60x5400
      - series: gitea_runner_cache_verify_last_run_seconds{job="ci-runner-node", instance="192.168.0.17:9100"}
        values: 0+0x5400
    alert_rule_test:
      - eval_time: 70h
        alertname: CIRunnerCacheVerifyStale
        exp_alerts: []
      - eval_time: 75h
        alertname: CIRunnerCacheVerifyStale
        exp_alerts:
          - exp_labels:
              job: ci-runner-node
              instance: 192.168.0.15:9100
              severity: warning
            exp_annotations:
              summary: CI runner 192.168.0.15:9100 cache verify has not run for over 3 days
              description: The nightly shared-cache integrity check on 192.168.0.15:9100 last finished more than 3 days ago. Check `systemctl status gitea-runner-cache-verify.service` and its journal.
  - interval: 1m
    name: nothing readable (no mtime series) pages critical; one bad beacon is a warning; a blip is nothing
    input_series:
      - series: node_textfile_scrape_error{job="ci-runner-node", instance="192.168.0.15:9100"}
        values: 0+0x5 1+0x30
      - series: node_textfile_mtime_seconds{job="ci-runner-node", instance="192.168.0.15:9100", file="/x/a.prom"}
        values: 1+0x5 _x30
      - series: node_textfile_scrape_error{job="ci-runner-node", instance="192.168.0.16:9100"}
        values: 0+0x5 1+0x30
      - series: node_textfile_mtime_seconds{job="ci-runner-node", instance="192.168.0.16:9100", file="/x/a.prom"}
        values: 1+0x35
      - series: node_textfile_scrape_error{job="ci-runner-node", instance="192.168.0.17:9100"}
        values: 0+0x5 1 0+0x29
      - series: node_textfile_mtime_seconds{job="ci-runner-node", instance="192.168.0.17:9100", file="/x/a.prom"}
        values: 1+0x35
    alert_rule_test:
      - eval_time: 7m
        alertname: CIRunnerRootFilesystemFailed
        exp_alerts: []
      - eval_time: 12m
        alertname: CIRunnerRootFilesystemFailed
        exp_alerts: []
      - eval_time: 16m
        alertname: CIRunnerRootFilesystemFailed
        exp_alerts:
          - exp_labels:
              job: ci-runner-node
              instance: 192.168.0.15:9100
              severity: critical
            exp_annotations:
              summary: CI runner 192.168.0.15:9100 cannot read any node_exporter textfile (root filesystem failed?)
              description: 'node_exporter on 192.168.0.15:9100 reads none of its textfiles. That is a shut-down root filesystem: SSH resets during key exchange and commands fail with EIO. See docs/runbooks/ci-runners.md
                "A runner whose root filesystem has died": confirm via the guest agent, pause the runner in Gitea, then `qm reset`.'
      - eval_time: 12m
        alertname: CIRunnerTextfileBeaconUnreadable
        exp_alerts: []
      - eval_time: 25m
        alertname: CIRunnerTextfileBeaconUnreadable
        exp_alerts:
          - exp_labels:
              job: ci-runner-node
              instance: 192.168.0.16:9100
              severity: warning
            exp_annotations:
              summary: CI runner 192.168.0.16:9100 has a textfile beacon node_exporter cannot parse
              description: One of the gitea_runner beacons in /var/lib/prometheus/node-exporter on 192.168.0.16:9100 is malformed (the other files still parse). Its alerts are blind until it is fixed; check
                `journalctl -u prometheus-node-exporter` for the file name.
