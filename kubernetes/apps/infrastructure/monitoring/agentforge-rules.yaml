# Alerts for the AgentForge fleet (ADR 0019 — Talos-worker topology; NOT the ADR 0018 host-systemd
# topology this file was originally written for). `release: kube-prometheus-stack` so the operator's
# ruleSelector picks it up. This file IS listed in kustomization.yaml — a rule file Flux never applies
# is the same defect as a rule that cannot fire, and this file was BOTH until 2026-08-10.
#
# -- WHY EVERY RULE IN HERE WAS REWRITTEN (measured 2026-08-10) ---------------------------------------
#
# The five rules this file used to hold ALL pinned `job="agentforge"`. That job has ZERO targets and
# ZERO series: it was a static Service/Endpoints/ServiceMonitor (monitoring/agentforge.yaml) for
# agentforge running as a host systemd unit on the dev-worker VMs, a topology ADR 0019 superseded, and
# both manifests were commented out of kustomization.yaml so neither was ever applied. Every one of
# the five `expr`s therefore evaluated to an EMPTY VECTOR and none could ever fire — alerting that
# presents as coverage while watching nothing. Re-verified 2026-08-10: `up{job="agentforge"}` and
# `forge_*{job="agentforge"}` both return 0 series.
#
# The live jobs are `agentforge-worker` (the operator-managed orchestrator pods, via
# agentforge-workers/worker-podmonitor.yaml) and `agentforge-dispatcher` (the read-only KEDA scale
# oracle, via agentforge-workers/dispatcher-servicemonitor.yaml).
#
# ROLE ASYMMETRY — the reason these rules are not a find-and-replace of the job label. The dispatcher
# is a stripped READ-ONLY scale oracle: "NO webhook API, NO claims, NO Job creation" per
# dispatcher-deployment.yaml. Mechanically (agentforge @ v0.4.0), `dispatcher()` builds the same
# forge_* registry but never constructs an Orchestrator and never calls build_app, so every gauge the
# reconcile/claim loop owns is a STRUCTURAL CONSTANT 0 on it — an unlabelled Prometheus gauge is
# exported at 0 from construction whether or not anything ever writes it. Measured:
#   forge_last_reconcile_timestamp = 0  -> `time() - ts > 900` is 1.79e9 there, i.e. TRUE FOREVER.
#   forge_worker_up                = 0  -> a `== 0` rule would fire permanently.
#   forge_auth_degraded            = 0  -> never written; the latch lives in the worker's claim loop.
# So a rule reading any of those MUST be pinned to job="agentforge-worker". Only `up` (synthesised by
# Prometheus per target) is uniform across both jobs, which is why ForgeTargetDown spans them.
# Conversely `forge_pending` is dispatcher-EXCLUSIVE (only `_dispatch_once` writes it), so it is
# absent from worker pods entirely — no rule here reads it.
#
# -- COVERAGE BOUNDARY: THESE RULES SEE ONLY HALF THE FLEET (ailab#284) -------------------------------
#
# Every forge_*-reading rule below is BLIND to:
#   * every CP-RENDERED tenant pool — live today af-orch-platform-dev-delivery in
#     af-tenant-tenant-zero-platform-dev. Measured 2026-08-10: forge_* series exist in exactly two
#     (namespace, job) pairs — agentforge/agentforge-dispatcher (19 series) and
#     af-tenant-tenant-zero-playground/agentforge-worker (78). The CP pool has NONE, because the
#     worker PodMonitor's selector keys on operator-only labels the CP renderer does not emit.
#   * the reaper — `agentforge-reaper` declares no containerPorts (re-confirmed live 2026-08-10,
#     command ["agentforge","reaper"]) AND its entrypoint never constructs the metrics registry or
#     calls start_http_server at all, so it is metrics-invisible by construction, not just unselected.
#     Giving it a port would not help until the entrypoint changes; observe it via logs only.
# The CP-rendered pools are the half doing the real delivery work; the covered half is the playground
# planner. Until ailab#284 is resolved these rules are a genuine but PARTIAL signal — treat a silent
# fleet as unproven, not healthy. ailab#286's ForgeOrchestratorUnscraped
# (agentforge-coverage-rules.yaml) is the complementary rule that detects the unscraped pods
# themselves by joining against kube-state-metrics; it is deliberately NOT duplicated here.
#   * a THIRD blind spot, tracked separately as ailab#293: the whole `af_*` metric namespace has no
#     scrape target either. The provisioner really does export it — confirmed live 2026-08-10 by
#     port-forwarding the pod, HTTP 200 on :9465/metrics with af_provisioner_alerts_total present —
#     but it has NO Service at all, so #293's remedy is a PodMonitor, not a ServiceMonitor. Nothing in
#     this file reads af_*; the two namespaces are disjoint and no rule here should be read as
#     covering provisioner or seat-entitlement failures.
#
# -- RETIRED: ForgeWebhookHMACFailures ----------------------------------------------------------------
#
# RETIRED because it cannot be shown to fire — but NOT for the reason it looks like. Correcting a
# plausible misreading, because the distinction decides who can fix it:
#
#   `forge_webhooks_total` HAS NOT BEEN REMOVED. It is live in the pinned v0.4.0 image, declared
#   Counter("forge_webhooks_total", ..., ["result"]) in infra/metrics.py and incremented at four sites
#   in infra/api.py (:422 too_large, :437 bad_signature, :450 bad_payload, :457 ok). HMAC verification
#   is fully live in the worker. `git log -S forge_webhooks_total --all` returns exactly ONE commit —
#   the one that ADDED it. It has zero series for a different reason: it is a LABELLED counter, and a
#   labelled Prometheus instrument with no children emits HELP/TYPE but no samples, so it does not
#   exist as a series until the first delivery of each result.
#
#   No delivery can ever reach a pod we scrape. The worker's webhook API (8700) has NO Service and
#   cilium-egress.yaml puts the worker in ingress default-deny EXCEPT the metrics port
#   (worker-deployment.yaml). The dispatcher process has no /webhook route at all. The only pod class
#   that DOES receive webhooks is the CP-rendered tenant pool — which is exactly the class ailab#284
#   says is unscrapeable. The pods that can fail HMAC and the pods we can see are disjoint sets.
#
# So the expression is not wrong, it is UNFALSIFIABLE on the current scrape surface: it would return an
# empty vector forever, which is precisely the defect this rewrite removes. Shipping it re-pointed at
# job="agentforge-worker" would have been the same lie in a new spelling. It becomes worth restoring
# the moment ailab#284 is resolved and a webhook-receiving pool is scraped. Webhook HMAC failures are
# meanwhile observable ONLY in the worker log ("webhook HMAC rejected", with the source IP) and in
# Gitea's per-hook delivery history — neither is a Prometheus series, so a log-pipeline alert is the
# alternative if this signal is wanted before #284.
# The operationally important half of its intent — "a credential failed and delivery silently stopped"
# — is preserved by ForgeEngineAuthDegraded below. Its "webhooks are not arriving" half is carried by
# ForgeReconcileDriftHigh, which is the counter the reconciler backstop actually moves.
#
# -- EVIDENCE THAT EACH RULE BELOW CAN FIRE (live, 2026-08-10) ---------------------------------------
# Healthy-case rules are proven NON-EMPTY and evaluable, with a counterfactual that trips the
# comparison. An empty vector is not a passing alert; it is the defect this file just removed.
#
# HOW FAR BACK "MEASURED" CAN POSSIBLY MEAN HERE — this bounds every claim below, and an earlier
# revision of this header overstated it as 7d. prometheusSpec sets `retention: 15d` AND
# `retentionSize: 8GB`, and the SIZE cap is the one that binds: measured 2026-08-10,
# prometheus_tsdb_size_retentions_total = 29 vs prometheus_tsdb_time_retentions_total = 0, and
# prometheus_tsdb_lowest_timestamp_seconds resolves to 08-07 06:00Z. EVERY metric in this TSDB starts
# there — prometheus_build_info and up{job="apiserver"} included — while the Prometheus pod itself has
# been up since 2026-07-06 and the agentforge-worker PodMonitor since 2026-07-30. So the usable
# history is ~3.1 DAYS, not 15 and not 7: no 7-day window exists to measure against, and any claim in
# this file quoting one is unverifiable by construction. Figures below say "3.12d" where they mean it.
#   ForgeTargetDown          up{job=~"agentforge-worker|agentforge-dispatcher"} -> 3 series, all 1.
#                            Counterfactual `== 1` -> 3 series fire. Historical: up==0 occurred on 4
#                            targets in 24h, ONE 30s sample each — never near the 5m hold, so `for: 5m`
#                            is sized off measurement (worker terminationGracePeriodSeconds=150).
#   ForgeReconcileStalled    time() - (ts > 0) -> 52.7s and 61.8s (2 series). 24h range -0.02s..89.6s,
#                            far under 900. Counterfactual `> 10` -> both series fire.
#   ForgeNeedsHuman...       REDESIGNED AGAIN 2026-08-10 (see its own note): the delta() form shipped
#                            earlier the same day could not fire on a STANDING backlog, which is the
#                            condition of interest. Measured at the moment of the rewrite: the delta
#                            expr = 0 and `> 0.5` -> EMPTY, while the replacement = 1 and FIRES.
#                            Counterfactual 08-10 05:00 (backlog flat at 8 for 11.7h, i.e. no
#                            un-cleared increment) -> 0, EMPTY, correctly silent.
#   ForgeEngineAuthDegraded  forge_auth_degraded{job="agentforge-worker"} -> 2 series, both 0; max 0
#                            over all 3.12d of retained history (was written up as "7d max 0").
#                            Counterfactual `== 0` -> 2 series fire. The set site is real, not a
#                            declared-but-never-written gauge: app/orchestrator.py:1684
#                            `emit(lambda m: m.auth_degraded.set(1))` (agentforge @ v0.4.0).
#   ForgeReconcileDriftHigh  sum by (namespace)(increase(...[30m])) -> 1 series, value 0 (drift has been
#                            0 for 24h — the healthy case). The expression SHAPE is proven to trip by
#                            evaluating the identical shape over a counter that does move:
#                            sum by (namespace)(increase(forge_claims_total{job="agentforge-worker"}
#                            [30m])) -> 5.09, and `> 0.5` fires.
#   ForgeScaleOracleMissing  Measured 2026-09-01. forge_pending -> 9 series; the ScaledObject's own
#                            query -> 4. Four counterfactuals, all as designed: (a) the shipped expr
#                            NOW -> EMPTY; (b) same expr with account="claude-max-9" -> FIRES (this is
#                            a replay of the 2026-08-09 seat-move incident, not a synthetic probe);
#                            (c) bogus account AND no publisher -> EMPTY, i.e. the `and on()` guard
#                            really does dedupe against ForgeTargetDown; (d) over [24h:1m] the shipped
#                            expr would have fired ZERO times while the naive absent(forge_pending)
#                            form would have fired 1270 times — that delta IS the reason for the
#                            guard. Retention at the time: 44.9h, so the 24h window is fully covered
#                            (the dispatcher held a live target for only 170 of those 1440 minutes,
#                            the tail of the 48-day outage). `for: 15m` is sized to clear Prometheus'
#                            5m staleness window plus a restarted dispatcher's first publish, both of
#                            which are already ForgeTargetDown's business.
#
# -- ADDITIVE, SILENT UNTIL THE ENGINE PIN LANDS (C-P0-08, 2026-09-02) ------------------------------
#
# ForgeDispatchStalled, ForgeUnexplainedEscalations and ForgeOperatorServiceFailing (after
# ForgeReconcileDriftHigh) consume the P0 engine instruments: forge_last_dispatch_timestamp (agentforge C-P0-04, the
# dispatcher's success-arm stamp), forge_escalations_unexplained_total (the _heal_unexplained_escalation
# reconciler) and forge_operator_service_failures_total{kind} (agentforge C-P0-01, the per-issue
# grant/replan guards). Unlike every rule measured above they CANNOT be proven live from this repo: a
# series the pinned image does not export is an EMPTY VECTOR, and an empty vector never fires — so
# these are inert, not wrong, until the ailab pin PR carrying those engine changes merges. Their shapes
# are the file's already-proven ones (ForgeReconcileStalled's `time() - (ts > 0)`,
# ForgeReconcileDriftHigh's `sum by (namespace) (increase(...[w]))`), reused rather than invented, and
# `promtool check rules` (scripts/rules-lint.sh) proves they parse and type-check. Operator, after the
# pin: `count(forge_last_dispatch_timestamp)` > 0 and `forge_operator_service_failures_total` returns
# the two pre-touched kinds (grant, replan) at 0 — then each `expr` below is non-empty and evaluable.
#
# monitoring/agentforge.yaml (the dead ServiceMonitor) stays commented out and is now depended on by
# NOTHING — ailab#286 asks the operator whether to retire the whole ADR 0018 host-service surface; that
# decision is not taken here. Re-measure any claim above with: kubectl --context admin@ai -n monitoring
# port-forward svc/kube-prometheus-stack-prometheus 9090:9090 (the Prometheus pod is distroless — no
# shell, so port-forward and curl the HTTP API, or exec from Grafana).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agentforge
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: agentforge
      rules:
        # RE-POINTED from `up{job="agentforge"} == 0` (renamed from ForgeWorkerDown: the semantics
        # changed from "a host systemd unit stopped" to "a pod target exists but will not scrape").
        # Spans BOTH jobs deliberately — `up` is synthesised per target so it is uniform across them,
        # unlike forge_worker_up which is a constant 0 on the dispatcher.
        - alert: ForgeTargetDown
          expr: up{job=~"agentforge-worker|agentforge-dispatcher"} == 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "AgentForge target {{ $labels.job }}/{{ $labels.pod }} is failing to scrape"
            description: >-
              The metrics endpoint on {{ $labels.pod }} ({{ $labels.namespace }}) has been unscrapeable
              for >5m while the pod still exists — a crash-loop, a wedged event loop, or a
              NetworkPolicy change, NOT a scale-down (KEDA scale-to-zero removes the target entirely
              and this rule correctly stays silent). If this is the DISPATCHER, the KEDA scale oracle
              is blind and no worker will scale up on backlog — a silent full stop on delivery. If it
              is a WORKER, its held claims release on SIGTERM or expire with the lease TTL so work
              recovers, but fleet capacity is cut. Check `kubectl --context admin@ai -n
              {{ $labels.namespace }} describe pod {{ $labels.pod }}` and the container log. Blind to
              CP-rendered pools and the reaper (ailab#284) — those have no target at all, which is
              ailab#286's rule, not this one.
        # RE-POINTED to job=agentforge-worker. The `> 0` inner filter is load-bearing twice over: it
        # drops the dispatcher (which never reconciles, so its ts is a structural 0 and `time() - 0`
        # would breach forever) and it drops a freshly-started worker before its first stamp — which
        # can be up to 600s, since the discovery loop backs off 60s->600s while the forge is
        # unreachable and _stamp_reconcile only runs after a FULLY SUCCESSFUL pass.
        - alert: ForgeReconcileStalled
          expr: time() - (forge_last_reconcile_timestamp{job="agentforge-worker"} > 0) > 900
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge worker {{ $labels.pod }} has not reconciled for >15m"
            description: >-
              The reconcile loop is the delivery guarantee — webhooks are only hints, the poll is what
              actually picks work up — so when it stalls, issues strand in place silently. Observed
              healthy staleness is 30-90s against a 900s threshold, so this is a wide margin: a breach
              means the loop is genuinely wedged (Gitea unreachable from the tenant namespace, or the
              orchestrator task died without killing the process). Note the gauge only advances on a
              fully successful pass, so a partial failure freezes it rather than zeroing it. Check the
              orchestrator container log for reconcile backoff and Gitea reachability from
              {{ $labels.namespace }}.
        # REDESIGNED TWICE. History matters here because the second form failed in the SAME class as
        # the first, and the reason is a PromQL semantics trap worth writing down.
        #
        #  1. `forge_needs_human_pending > 0` (original). Fires immediately and never clears, because
        #     the playground carries a permanently parked backlog. Duty cycle 100% = ignored-by-default.
        #  2. `delta(max by (namespace)(...)[1h:1m]) > 0.5` (shipped 2026-08-10 06:47Z, THIS rule's
        #     predecessor). Wrong for a subtler reason: **delta() measures CHANGE, not PERSISTENCE.** A
        #     standing backlog is FLAT, so its delta is 0 — the rule was structurally unable to fire on
        #     the only condition anyone cares about. Measured, at the moment of this rewrite: backlog =
        #     9 (a real standing backlog), delta expr = 0, `> 0.5` -> EMPTY VECTOR.
        #     It was not merely mis-tuned, it was mis-shaped. The lifecycle that proves it (all UTC):
        #       06:03:31 backlog steps 8 -> 9; delta goes 0 -> ~1.017 (extrapolated)
        #       06:47:24 the PrometheusRule is created — 44 min into the only 60-min window it had
        #       06:48:23 pending (ALERTS_FOR_STATE activeAt), accumulating against `for: 30m`
        #       07:02    delta falls back under 0.5 as the step ages out of the [1h] subquery -> RESET
        #     ~14 of the required 30 min accumulated; zero Forge alerts ever reached Alertmanager.
        #     A clean +1 step gives a 60-min window of which `for: 30m` eats half, so the BEST case was
        #     ~28 min of firing, and only if the rule happened to be live before the step. Over the
        #     full 3.12d of retained history the delta form exceeded 0.5 for 218 of 4481 min (4.9%) in
        #     8 runs, longest 58 min — so "can fire in principle, cannot fire on a standing backlog".
        #
        # THE TRADE-OFF THIS FORM TAKES, stated explicitly because it is a judgement call, not a fix.
        # Two honest rules were available:
        #   (a) PERSISTENCE: `min_over_time(backlog[6h]) > 0` — "a backlog exists and has never been
        #       empty". Fires once and stays firing. Arguably the most honest representation of a real
        #       standing condition. REJECTED, on a measured routing fact rather than on taste:
        #       Alertmanager here routes EVERY alert to the ntfy receiver with NO severity-based route
        #       (only `alertname="Watchdog"` is dropped) and `repeat_interval: 4h`. A permanently-firing
        #       rule is therefore a phone push every 4h forever — `severity: info` would NOT de-page it
        #       — and the predictable end state is a muted ntfy topic, which loses EVERY ailab alert.
        #       That is a worse failure than the one being fixed. Making (a) safe needs an Alertmanager
        #       route + inhibition change; that is a real piece of work and is deliberately NOT smuggled
        #       into a rule-file PR. Named as the residual gap in the PR body.
        #   (b) WHAT SHIPPED: persistence of an UN-DRAINED INCREMENT. Compare the level against its own
        #       6h low-water mark: "escalations arrived and the backlog has not been worked back down to
        #       where it was". This is a persistence test, not a change test — it stays true for as long
        #       as the elevated level persists, which is exactly what delta() could not do — while
        #       staying silent on the parked baseline that made form 1 useless.
        # Consequence to be clear-eyed about: a backlog that is parked and NEVER drained goes quiet
        # after 6h. That is intentional (it is an operator-created known state), but it means this rule
        # is a "new halted work" detector, NOT a backlog-size SLO. The size belongs on a dashboard.
        #
        # Shape decisions, each measured over the full 3.12d of retained history (2026-08-10):
        #  * AGGREGATE AWAY `pod` FIRST. The gauge is unlabelled and recomputed per pass as a pool-wide
        #    total, so every pod in a pool reports the same number: `max by (namespace)` is correct and
        #    `sum` would double-count (2 pods x 9 = 18). This — NOT the join — is what makes the rule
        #    churn-proof: 46 pod generations in 3.12d (~15/day, median lifetime ~115 min, 11 of them
        #    under 45 min) collapse into ONE continuous per-namespace series. `max` also absorbs the
        #    brief inter-pod skew that does occur (max-minus-min across pods was observed in {0,1}), and
        #    it absorbs it in the SAFE direction: a skew dip cannot drag the low-water mark down and
        #    suppress a real alert.
        #  * KEEP THE `forge_last_reconcile_timestamp > 0` GATE, and note it is now MORE load-bearing
        #    than it was under delta(), not less. Both gauges are written by the same _stamp_reconcile()
        #    call, so a non-zero stamp proves the pod has completed a pass and its count is real. The
        #    worker Deployment declares NO readinessProbe, so a pod becomes a scrape target as soon as
        #    it is Running and "first scrape beats first reconcile" is an OPEN RACE. Under delta() a
        #    spurious 0 polluted a 1h window; under min_over_time it would pin the low-water mark to 0
        #    for a full 6h and page at the full backlog value. Never observed (no worker pod has EVER
        #    reported ts == 0 across all 46 generations, including recovery from KEDA scale-to-zero,
        #    which returned samples of 7 and 8 directly) — but it is a race, not a guarantee, so the
        #    gate stays. It is free: gated and ungated aggregates have IDENTICAL sample counts (4433 of
        #    4433) over 3.12d, i.e. the gate has never dropped a worker sample. NB the job pin already
        #    excludes the dispatcher (whose ts is a structural 0 forever), so fresh-pod validity is the
        #    gate's only remaining job.
        #  * WINDOW 6h, chosen against the measured alternatives (duty cycle / longest run over 3.12d):
        #    2h 11.4%/1.9h · 4h 17.9%/3.9h · 6h 23.4%/5.9h · 12h 39.6%/11.9h · 24h 54.4%/21.3h. 6h is
        #    the knee: a ~5.5h firing window after the 30m hold (vs the delta form's ~28 min best case,
        #    ~12x) at a duty cycle still well clear of the 100% that made form 1 useless. It is also
        #    sized off the measured failure modes — the one observed scrape gap was 53 min (KEDA
        #    scale-to-zero, `minReplicaCount: 0`), and a gap restarts the 30m hold, so the window must
        #    exceed gap + hold = ~83 min with margin. 2h would not.
        #  * THRESHOLD `>= 1`, exact. min_over_time and max return real samples, so — unlike delta() and
        #    increase(), which extrapolate at window edges and forced the old 0.5 fudge — there is no
        #    extrapolation artefact to fudge around. The gauge is an integer count of open issues.
        #  * `for: 30m` KEPT, and now genuinely satisfiable: it is 8% of the firing window rather than
        #    50% of it. It preserves the original SLA ("nobody picked it up in 30m") and debounces a
        #    label that is added and removed by hand.
        - alert: ForgeNeedsHumanBacklogNotDraining
          expr: |
            (
              max by (namespace) (
                forge_needs_human_pending{job="agentforge-worker"}
                  and on(namespace, pod) (forge_last_reconcile_timestamp{job="agentforge-worker"} > 0)
              )
              -
              min_over_time(
                max by (namespace) (
                  forge_needs_human_pending{job="agentforge-worker"}
                    and on(namespace, pod) (forge_last_reconcile_timestamp{job="agentforge-worker"} > 0)
                ) [6h:5m]
              )
            ) >= 1
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge {{ $labels.namespace }}: {{ $value }} needs-human escalation(s) added in the last 6h and not cleared"
            description: >-
              The needs-human backlog for this tenant is {{ $value }} above its own 6h low-water mark —
              escalations arrived and nobody has worked the backlog back down. needs-human is a GLOBAL
              STOP for an issue: no agent will touch it until the label is cleared, so each un-cleared
              one is a permanently halted piece of work (budget breach, protected-path diff, repeated
              gate disagreement, or an engine auth failure). DO THIS: list the tenant's open issues
              carrying the needs-human label, newest first, and for each read the disagreement-summary
              comment the agent left, then either fix the cause and REMOVE the label to resume the run,
              or close the issue — the runbook has the per-cause procedure
              (docs/runbooks/agentforge.md). Removing the label is what resolves this alert; it clears
              once the count returns to its prior floor, so working the NEWEST escalations is what
              silences it. This is deliberately NOT a backlog-size alert: a parked backlog that is
              never drained goes quiet after 6h (see the note above the rule), so use the dashboard,
              not this alert, to judge total backlog. NOTE: it watches only the PLAYGROUND tenant
              today — CP-rendered delivery pools export nothing (ailab#284) and KEDA scale-to-zero
              blinds it while the pool is idle, so a quiet fleet is not proof of a quiet backlog.
        # NEW, and the reason ForgeWebhookHMACFailures could be retired without losing what mattered:
        # it carries that rule's inferred intent, "a credential failed and delivery silently stopped".
        # forge_auth_degraded is the current surface for exactly that — a ONE-WAY latch set after
        # _MAX_AUTH_FAILURES=2 consecutive LLM-engine auth refusals, after which the worker STOPS
        # CLAIMING entirely and /readyz fails. Nothing in the source ever clears it (recovery is a
        # human re-login plus a worker restart), so no `for:` is needed to debounce and the alert is
        # intentionally sticky until the pod is replaced — note it therefore self-clears on RESTART
        # rather than on repair, so correlate with /readyz before believing a resolve.
        # Worker-pinned: the dispatcher never runs the claim loop, so its 0 is structural.
        - alert: ForgeEngineAuthDegraded
          expr: forge_auth_degraded{job="agentforge-worker"} > 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "AgentForge worker {{ $labels.pod }} has latched engine-auth degraded (claiming stopped)"
            description: >-
              Two consecutive LLM-engine auth refusals latched auth_degraded on {{ $labels.pod }}: this
              worker has stopped claiming ALL work and will not resume on its own — the latch is
              one-way, so recovery is a human re-login for the engine credential plus a worker restart.
              This is the silent-wedge class the latch exists to make visible (a latched worker keeps
              polling and heartbeating with no other trace). A revoked or expired subscription login is
              the usual cause. Check the orchestrator log for "auth_degraded latched" and the engine
              credential in the tenant's ExternalSecret.
        # RE-POINTED to job=agentforge-worker (the dispatcher never reconciles, so it can never drift).
        # Summed by namespace rather than per-pod: drift is a fleet-level rate and the pod set churns.
        # "Drift" is specifically state-label <-> af:run marker divergence healed by the reconciler —
        # despite the metric's own help string, it is no longer a count of webhook-missed work items.
        - alert: ForgeReconcileDriftHigh
          expr: sum by (namespace) (increase(forge_reconcile_drift_total{job="agentforge-worker"}[30m])) > 5
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge {{ $labels.namespace }}: reconciler healing >5 state drifts/30m"
            description: >-
              The reconciler keeps converging issue state labels onto their authoritative af:run
              markers. Occasional healing is the design working; a sustained rate means labels are
              being lost or rewritten faster than they are being healed — a worker crashing between
              writes, or webhook deliveries not arriving so the poll is now the only delivery path.
              Check the Gitea org webhook delivery log for this tenant's repo and ALLOWED_HOST_LIST,
              and the orchestrator log for _heal_state_label. This is also the surviving proxy for the
              retired ForgeWebhookHMACFailures: a drifted webhook secret shows up here as work that
              only ever arrives via the poll.
        # NEW (C-P0-08). The dispatcher twin of ForgeReconcileStalled, and the alert that gives the
        # C-P0-04 backoff cap (600s -> 120s) its teeth: the dispatcher is the KEDA scale oracle for
        # EVERY pool, so a frozen forge_pending costs the whole fleet, unlike one stale worker scan.
        # forge_last_dispatch_timestamp is stamped only on the SUCCESS arm of a dispatch pass, so a
        # dispatcher that is up, scraped and looping on failed forge reads ("target present, oracle
        # dead") shows as an ageing stamp here while ForgeTargetDown stays silent — that gap, which
        # nothing above can see, is this rule's whole reason to exist.
        # The `> 0` inner filter is load-bearing exactly as in ForgeReconcileStalled: the gauge is a
        # structural 0 on every WORKER (the same registry is built there and never stamped) and on a
        # fresh dispatcher before its first successful pass, and `time() - 0` would breach forever.
        # Pinned to job="agentforge-dispatcher" for the same reason in the other direction — only that
        # job ever writes it. Threshold 600s = 5x the capped 120s backoff, i.e. at least four
        # consecutive failed passes after the cap, so a single transient forge error cannot page;
        # `for: 5m` on top of that clears Prometheus' staleness window and a restart's first pass.
        - alert: ForgeDispatchStalled
          expr: time() - (forge_last_dispatch_timestamp{job="agentforge-dispatcher"} > 0) > 600
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge dispatcher {{ $labels.pod }} has not completed a dispatch pass for >10m"
            description: >-
              The dispatcher is scraped (ForgeTargetDown is quiet) but its last SUCCESSFUL dispatch
              pass is more than 10 minutes old, so forge_pending — the ONE query every KEDA
              ScaledObject scales on — is frozen at whatever it last published. Backlog will not
              scale any pool up and a scaled-to-zero pool stays at zero: a silent fleet-wide stop on
              delivery, which is why this pages while a single worker's stale scan would not. The
              stamp only advances on a fully successful pass, so this is a dispatcher that keeps
              failing its forge reads (Gitea unreachable from the agentforge namespace, a revoked
              bot token, a repo that no longer exists) and is now in its capped 120s backoff. Check
              the dispatcher log for the failing pass (`kubectl --context admin@ai -n
              {{ $labels.namespace }} logs deploy/agentforge-dispatcher`) and Gitea reachability
              from that namespace. NOT a scrape outage — ForgeTargetDown owns that and this rule needs a
              live target to fire at all.
        # NEW (C-P0-08), and the P0 residue of the "escalate() recovery reconciler" item: the
        # comment-before-label ordering already ships (R4, agentforge #236) and
        # _heal_unexplained_escalation re-explains any needs-human park lacking an af:esc record, so
        # the remaining gap was that nobody would ever SEE it happen. The counter is deliberately
        # unlabelled (metrics.py: the engine cannot tell a torn escalation from a hand-applied label)
        # and pre-exported at 0 on every process that builds the registry, so `increase()` of a
        # never-written series is exactly 0 and the rule stays silent — including on the dispatcher,
        # which is why the job pin is convention (every worker-owned rule above carries it) rather
        # than a correctness guard here. Aggregated by namespace like ForgeReconcileDriftHigh: the
        # pod set churns (~15 generations/day measured above) and a per-pod series would lose its
        # window on every restart. `> 0` is exact for a counter that moves in integer steps; no
        # `for:` because the healer's write is the whole event — it does not persist to debounce.
        - alert: ForgeUnexplainedEscalations
          expr: sum by (namespace) (increase(forge_escalations_unexplained_total{job="agentforge-worker"}[1h])) > 0
          labels: { severity: warning }
          annotations:
            summary: "AgentForge {{ $labels.namespace }}: {{ $value }} needs-human park(s) without an escalation record in the last 1h"
            description: >-
              The reconciler found an issue parked at needs-human with NO af:esc record and wrote a
              synthesized explanation for it. That is the healer working, but the cause is one of two
              things worth a look: a TORN escalation (the label and the comment are two forge writes,
              so a worker died between them — check for a pod restart in this namespace around the
              increment) or a needs-human label applied BY HAND without the runbook comment (an
              operator parked work and left no reason, so the synthesized one is a placeholder).
              Either way find the issue: search the tenant's open needs-human issues for the
              healer's own comment (the af:esc record it wrote names itself), read what it could
              reconstruct, and if it was a hand-park replace the placeholder with the real reason so
              the next operator does not have to guess. Sustained increments across many issues mean
              a worker crash-looping mid-escalation — correlate with ForgeTargetDown and the pod's
              restart count, not with the issues themselves.
        # NEW (C-P0-08), consuming the C-P0-01 counter: reconcile_once's per-issue operator services
        # (a needs-budget grant, a needs-replan request) are guarded per issue — log + count + skip —
        # so that one issue's failing forge write no longer propagates into the discovery loop's
        # 60->600s backoff and blacks out discovery for EVERY repo. The counter is what makes that
        # guard visible: a failure before the request label cleared is retried next pass (the label
        # stays), one after it is consumed and only counted here, so a rising rate is either a forge
        # write that keeps failing for the same issue every pass or an operator request that was
        # silently eaten. Labelled by kind (grant | replan), pre-touched at 0 for both, so `increase()`
        # is 0 until a real failure and the rule is inert until then. `> 3` in 30m: the reconcile pass
        # runs roughly every minute, so a retried failure counts once per pass and clears 3 in ~4
        # passes — one transient forge blip does not page, a stuck one does within five minutes.
        - alert: ForgeOperatorServiceFailing
          expr: sum by (namespace, kind) (increase(forge_operator_service_failures_total{job="agentforge-worker"}[30m])) > 3
          labels: { severity: warning }
          annotations:
            summary: "AgentForge {{ $labels.namespace }}: {{ $labels.kind }} operator service failed {{ $value }} times in 30m"
            description: >-
              A per-issue operator service ({{ $labels.kind }}: grant = a needs-budget budget grant,
              replan = a needs-replan request) failed inside the reconcile pass more than 3 times in
              30 minutes and was skipped for those passes. The pass itself kept going — that is the
              C-P0-01 guard working, and discovery for the other repos was NOT blacked out — but the
              request it was serving is stuck: if the failure happens before the request label
              clears, the same issue is retried every pass and this keeps counting; if after, the
              operator's request was consumed without effect and the issue sits with its label gone
              and nothing done. Check the orchestrator log in this namespace for the guarded
              exception (it names the issue and the failing forge call), fix the cause (usually a
              Gitea write the bot token no longer has, or a repo/label that was renamed), then re-apply
              the needs-budget / needs-replan label on the issue to have it served again.
        # The KEDA scale oracle reads ONE query; this asserts that query still resolves. It is
        # deliberately NOT `absent(forge_pending)` — see the measurement note at the top. The
        # `and on() (count(up{...}) > 0)` guard is what makes it worth having: WITHOUT it the rule
        # duplicates ForgeTargetDown on every dispatcher outage (measured: 1270 of the last 1440
        # minutes, the tail of the 48-day CrashLoopBackOff), and a second chronic red on the same
        # ntfy channel is strictly worse than none — that channel is exactly how the 48-day outage
        # stayed invisible while ForgeTargetDown paged every 4h. WITH the guard it fires only when
        # the publisher is UP and the scaler's own selector still resolves to nothing.
        #
        # That is a real, dated incident, not a hypothesis. On 2026-08-09 the playground planner
        # moved claude-max-1 -> claude-max-2 and this query was left naming claude-max-1
        # (scaledobject.yaml:16-25): it matched nothing, ignoreNullValues treated that as 0, the
        # trigger went Active=False, and the pool sat at 0 replicas with FOUR pending planner issues
        # invisible to it. The ScaledObject stayed Ready=True and nothing logged an error at any
        # layer. The existing control is a comment saying the binding must move in the same change —
        # discipline that has already failed once. This is the mechanical backstop.
        #
        # THE SELECTOR BELOW MUST TRACK scaledobject.yaml's `query` EXACTLY. If they diverge, this
        # rule fires a false positive rather than going quiet — loud in the correct direction, and
        # the fix is to re-align the two.
        - alert: ForgeScaleOracleMissing
          expr: |
            absent(sum(forge_pending{account="claude-max-2",role=~"planner|reviewer|implementer|tester"}))
              and on() (count(up{job="agentforge-dispatcher"} == 1) > 0)
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge KEDA scale oracle resolves to nothing while the dispatcher is up"
            description: >-
              The dispatcher is scraping normally, but the exact query the playground ScaledObject
              scales on returns NO SERIES, so KEDA's ignoreNullValues=true is reading "no pending
              work" from what is actually a dead oracle. Backlog will not scale the pool up; only the
              Mon-Fri 08:00-18:00 cron warm-floor will, so evening and weekend delivery stops
              silently. Most likely the account/role labels in scaledobject.yaml no longer match what
              the dispatcher emits (the 2026-08-09 seat move), or a repo left the dispatcher's config.
              Compare `kubectl --context admin@ai -n af-tenant-tenant-zero-playground get scaledobject
              af-orch-playground-planner -o jsonpath='{.spec.triggers[0].metadata.query}'` against the
              live label set: `count by (account,role) (forge_pending)`. NOT a dispatcher outage —
              ForgeTargetDown owns that and this rule stays silent for it by construction.
