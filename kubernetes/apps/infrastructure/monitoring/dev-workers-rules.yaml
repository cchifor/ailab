# Alerts for the 6 dev-worker VMs (metrics via dev-workers-node.yaml, job=dev-worker-node).
#
# WHY THIS EXISTS: dev-workers had a scrape target and NO rules referencing job="dev-worker-node" at
# all, while the CI runners — Ubuntu VMs on the same three hypervisors, scraped the same way by the
# same node_exporter — had eight. (Not an identical fleet: 6 dev workers, 2 per node, vs 5 runners with
# only one on node3. The point is that the monitoring surface is the same, not the topology.) On
# 2026-08-11 22:32 dev-worker-1's kernel panicked and the VM sat dead for ~12h. The only thing that
# fired was the stack's generic `TargetDown`, at severity warning, which says "a target is down"
# rather than "a dev box is gone"; PVE still reported the guest `running`, so nothing else contradicted
# it either. The equivalent CI-runner alert, CIRunnerNodeDown, is severity CRITICAL.
#
# Deliberately node-level only. The dev workers run no beacon of their own (that is the gitea_runner
# role's mechanism, and these are not runners), so every rule here reads node_exporter series that
# exist today — nothing below is waiting on a script to be deployed first.
# `release: kube-prometheus-stack` so the operator's ruleSelector picks it up.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dev-workers
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: dev-workers
      rules:
        # CRITICAL, matching CIRunnerNodeDown. A dev worker is where the user's interactive sessions
        # and agentforge work live; losing one silently costs hours. 10m rides over a reboot (these now
        # auto-reboot on panic — kernel.panic=10, dev_worker role — so a self-healing panic should NOT
        # page, but one that does not come back must).
        - alert: DevWorkerNodeDown
          expr: up{job="dev-worker-node"} == 0
          for: 10m
          labels: { severity: critical }
          annotations:
            summary: "Dev worker {{ $labels.instance }} is down (no node_exporter scrape)"
            description: >-
              node_exporter on dev worker {{ $labels.instance }} has been unscrapeable for >10m.
              NOTE the guest can be dead while Proxmox still reports the VM `running` — that is exactly
              what a kernel panic looks like from outside (dev-worker-1, 2026-08-11). Do not trust
              `qm status`; check the console (`qm monitor <vmid>` then `screendump /tmp/x.ppm`) and
              whether disk/network counters are moving (`qm monitor` -> `info blockstats`). Recovery
              from a panic is `qm reset <vmid>` — ACPI shutdown cannot work on a panicked kernel.
        # The condition that preceded the panic, and the one that is actionable BEFORE it. Threshold is
        # 1.5 GiB to match CIRunnerLowMemory; dev-worker-1 sat at ~1 GiB free for weeks.
        - alert: DevWorkerLowMemory
          expr: node_memory_MemAvailable_bytes{job="dev-worker-node"} < 1.5e9
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Dev worker {{ $labels.instance }} low available memory (<1.5 GiB)"
            description: >-
              {{ $labels.instance }} has <1.5 GiB MemAvailable for >10m. On an oversubscribed
              hypervisor the balloon cannot inflate and the guest is pinned at its floor — check host
              RAM on the owning Proxmox node and the balloon (`qm config <vmid>` -> balloon vs memory).
              ai-node1 runs at ~88% and is the known-bad case; see kubernetes/infra/dev-workers.
        # Swap is the 4 GiB safety valve (dev_worker role, swappiness 10). Sustained use means the
        # guest is reclaiming constantly rather than absorbing a spike. dev-worker-1 had pushed 165 GB
        # through that 4 GiB file with 230M major page faults before it died.
        #
        # GATED ON MEMORY PRESSURE (PSI) since 2026-09-27. Swap OCCUPANCY alone is a stale-page
        # counter: dev-worker-1 held this alert for 271h with 97% swap used while PSI memory "some"
        # stalled <0.01% of the time — the pages were an idle TUI and a parked compose stack, evicted
        # once and never wanted back. An alert nobody can act on trained ntfy's only reader to ignore
        # it. Now it needs the working set to actually be starving as well: tasks stalled on memory
        # >5% of wall time over 15m (measured 7d max: <=1.4% on the unstressed workers, 26.8% on dw2 and
        # 38.7% on dw1 in real pressure episodes). Sustained heavy paging is DevWorkerThrashing's job below.
        # `unless ... <= 0.05`, not `and ... > 0.05`: FAIL-OPEN. A worker whose node_exporter stops
        # exporting PSI (kernel without CONFIG_PSI, collector disabled) keeps the old occupancy-only
        # behaviour instead of silently losing the alert.
        - alert: DevWorkerSwapPressure
          expr: |
            (
              node_memory_SwapTotal_bytes{job="dev-worker-node"} > 0
                and (node_memory_SwapTotal_bytes{job="dev-worker-node"} - node_memory_SwapFree_bytes{job="dev-worker-node"})
                    / node_memory_SwapTotal_bytes{job="dev-worker-node"} > 0.5
            )
            unless on (instance)
            rate(node_pressure_memory_waiting_seconds_total{job="dev-worker-node"}[15m]) <= 0.05
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Dev worker {{ $labels.instance }} using >50% of its swap"
            description: >-
              {{ $labels.instance }} is >50% into its 4 GiB safety-valve swap AND tasks have stalled on
              memory >5% of the time (PSI) for >30m — the working set no longer fits. Same remedy as
              DevWorkerLowMemory: host RAM headroom on the owning node, or stop what is resident.
        # SUSTAINED PAGING, which is the signal the two thresholds above both miss. A guest can sit
        # just under every threshold while thrashing: dev-worker-1 averaged ~205 major faults/s for the
        # WHOLE 13-day uptime before it panicked (230.1M cumulative / 13.02d) against dev-worker-3's
        # near-zero, and no absolute gauge would have flagged it.
        #
        # CONJOINED WITH ACTUAL SWAP-IN, and that is the load-bearing part. A major fault is a page
        # fetched from DISK — which a cold-cache docker build or a first-run e2e does constantly while
        # having plenty of free memory. On its own this rule would page on exactly that. `pswpin` is
        # narrower and unambiguous: pages read back FROM SWAP, which only happens if the kernel had
        # already evicted them, i.e. the working set genuinely did not fit. A build faults; only a
        # starved guest swaps back in.
        # Thresholds, measured 2026-08-12: the healthy fleet runs at 0.00-0.80 major faults/s, so 20 is
        # ~25x above the healthy maximum and ~10x below what the failing worker sustained. pswpin > 1/s
        # rather than > 0 so a single stray page cannot arm it.
        - alert: DevWorkerThrashing
          expr: >-
            (rate(node_vmstat_pgmajfault{job="dev-worker-node"}[5m]) > 20)
            and on (instance)
            (rate(node_vmstat_pswpin{job="dev-worker-node"}[5m]) > 1)
          for: 1h
          labels: { severity: warning }
          annotations:
            summary: "Dev worker {{ $labels.instance }} thrashing: >20 major faults/s AND swapping in, for 1h"
            description: >-
              {{ $labels.instance }} has been faulting >20 pages/s from disk AND reading pages back from
              swap for an hour — its working set does not fit in the RAM it is actually being given.
              This is the condition that preceded the dev-worker-1 kernel panic on 2026-08-11 (230.1M
              cumulative major faults over 13d, ~165 GB pushed through a 4 GiB swapfile), and it is
              invisible to threshold alerts because the guest sits *stably* starved rather than spiking.
              Check the balloon floor against the host's free RAM (`qm config <vmid>`, then `free -g` on
              the Proxmox node) — a guest on a node above ~80% used cannot inflate and is stuck at its
              floor. A cold-cache build faults heavily but does NOT swap in, which is why both halves
              have to be true here.
        # /workspace is its own disk (scsi1) and holds the agents' worktrees AND the docker/containerd
        # data-root, so it is the one that fills. This rule watched only "/" until 2026-10-01, when
        # dev-worker-3's /workspace reached 100% (agent unable to run any command) and dev-worker-2's
        # sat at 0.7% free, both silently — ~42 GB on each was node_modules/.venv/target in worktrees
        # idle for weeks, which the dev-worker-deps-prune timer (role dev_worker) now removes daily.
        #
        # 2026-10-09 (plans/2026-10-09-dev-worker-disk-hardening-plan.md, W1): the critical tier. The
        # warning tier is DevWorkerDiskLow below, which fires at disk-guard's own 15% trigger from
        # node_exporter alone — before it, the 12-15% band was silent whenever the guard's exhausted
        # signal reset (it did, every run longer than one scrape).
        - alert: DevWorkerDiskFilling
          expr: |
            node_filesystem_avail_bytes{job="dev-worker-node",mountpoint=~"/|/workspace"}
              / node_filesystem_size_bytes{job="dev-worker-node",mountpoint=~"/|/workspace"} < 0.12
          for: 15m
          labels: { severity: critical }
          annotations:
            summary: "Dev worker {{ $labels.instance }} {{ $labels.mountpoint }} <12% free"
            description: >-
              {{ $labels.instance }} {{ $labels.mountpoint }} is under 12% free for >15m. At 100% the
              agent on it cannot start any command, cleanup included. dev-worker-disk-guard (every 5 min,
              under 15% free) should already be reclaiming: `journalctl -u dev-worker-disk-guard -n 50`.
              If it deferred (docker busy) or exhausted its ladder, look by hand: `cleanup --dry-run`
              (docker: stale stacks, images, volumes, build cache), `docker system df`, then
              `du -xh --max-depth=2` on the mount. On `/` look in `$HOME` first: agents have parked
              tarballs and evidence trees there (dev-worker-3, 2026-10-09).
        # Under disk-guard's 15% trigger for 30m, from node_exporter alone: fires whether the guard is
        # healthy, hung, missing or failing (the guard's own alerts below say WHY reclaim did not help).
        # 15 days before this rule existed, every worker had a filesystem under 5% free at least once
        # (41 episodes, 29 on dev-worker-3's /workspace).
        - alert: DevWorkerDiskLow
          expr: |
            node_filesystem_avail_bytes{job="dev-worker-node",mountpoint=~"/|/workspace"}
              / node_filesystem_size_bytes{job="dev-worker-node",mountpoint=~"/|/workspace"} < 0.15
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Dev worker {{ $labels.instance }} {{ $labels.mountpoint }} <15% free for 30m"
            description: >-
              {{ $labels.instance }} {{ $labels.mountpoint }} has been under 15% free for 30m, below
              the point where dev-worker-disk-guard starts reclaiming. `journalctl -u
              dev-worker-disk-guard -n 60` shows what it ran and, if it is exhausted, the largest
              directories ("largest under"). Bursts of 36 GB in 6h have been measured, so at this
              level a disk can be full within hours. Runbook: docs/runbooks/dev-workers.md § Disk full.
        # A forecast, not a guarantee: replayed over 15 days of history (2026-09-24..10-09) a 6h fit
        # projected 12h ahead, gated under 25% free, warned before 39 of 41 real <5%-free episodes with
        # 16 false warnings, but its median lead was only ~70 min because the fills are bursts.
        # Abrupt allocations are DiskLow's and DiskFilling's job.
        - alert: DevWorkerDiskTimeToFull
          expr: |
            predict_linear(node_filesystem_avail_bytes{job="dev-worker-node",mountpoint=~"/|/workspace"}[6h], 12 * 3600) < 0
            and on (instance, mountpoint)
            node_filesystem_avail_bytes{job="dev-worker-node",mountpoint=~"/|/workspace"}
              / node_filesystem_size_bytes{job="dev-worker-node",mountpoint=~"/|/workspace"} < 0.25
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "Dev worker {{ $labels.instance }} {{ $labels.mountpoint }} on course to fill within 12h"
            description: >-
              At the last 6h's rate, {{ $labels.instance }} {{ $labels.mountpoint }} (under 25% free)
              runs out of space within 12h. Find what is growing before disk-guard has to: `sudo du
              -xh --max-depth=2 {{ $labels.mountpoint }} | sort -rh | head`, `docker system df`.
        # Inodes run out independently of bytes, and disk-guard's ladder only reacts to bytes.
        - alert: DevWorkerInodesLow
          expr: |
            (
              node_filesystem_files_free{job="dev-worker-node",mountpoint=~"/|/workspace"}
                / node_filesystem_files{job="dev-worker-node",mountpoint=~"/|/workspace"} < 0.10
            )
            or node_filesystem_files_free{job="dev-worker-node",mountpoint=~"/|/workspace"} < 200000
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Dev worker {{ $labels.instance }} {{ $labels.mountpoint }} is running out of inodes"
            description: >-
              {{ $labels.instance }} {{ $labels.mountpoint }} has under 10% (or 200k) free inodes; at
              zero every file create fails with ENOSPC however many bytes are free, and disk-guard
              does not react to inodes. Find the directory with the most files: `sudo du -x
              --inodes --max-depth=3 {{ $labels.mountpoint }} | sort -rn | head`.
        # disk-guard (role dev_worker, files/disk-guard) ran every reclaim step CLEANLY and a filesystem is still
        # under its trigger: eligible reclaim was not enough. What is left is outside what the guard may
        # remove (worktrees in use, compose stacks, named volumes, recent images, agent data in $HOME or
        # /workspace) and the disk will reach 100% unless a human frees or grows it. Added after
        # dev-worker-3's /workspace refilled to 100% on 2026-10-06, five days after the 10-01 cleanup;
        # on 2026-10-09 it was ~50 GB of agent-made tarballs, part of them moved into $HOME on /.
        # Per filesystem since 2026-10-09, and carried by every heartbeat of the next run: before, the
        # first heartbeat of each run reset it to 0, and on dev-worker-3 (a ladder longer than a 30 s
        # scrape) this alert recorded 33 firing samples in ~100 exhausted hours.
        - alert: DevWorkerDiskGuardExhausted
          expr: dev_worker_disk_guard_exhausted{job="dev-worker-node"} == 1
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "Dev worker {{ $labels.instance }}: disk-guard exhausted on {{ $labels.mountpoint }}"
            description: >-
              disk-guard on {{ $labels.instance }} ran its whole ladder (old codex releases, build cache,
              anonymous volumes, old containers + unused images, merged worktrees, idle deps) and a disk is
              still under its trigger. `journalctl -u dev-worker-disk-guard -n 80` names the low
              filesystem and, once an hour, its largest directories ("largest under"). Then
              `docker system df -v`; ask the agent owner what can go (bulk agent data belongs in the capped
              /workspace/archive, or on the NAS via the runbook), or grow the disk (kubernetes/infra/dev-workers).
        # Reclaim is being attempted and is not working: a step exits non-zero (docker daemon down,
        # cleanup crashing, a step timing out) on consecutive runs. Separate from Exhausted on purpose —
        # a failed step says nothing about whether what is left is live work.
        - alert: DevWorkerDiskGuardFailing
          expr: dev_worker_disk_guard_failed_steps{job="dev-worker-node"} > 0
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "Dev worker {{ $labels.instance }}: disk-guard reclaim steps are failing"
            description: >-
              disk-guard on {{ $labels.instance }} triggered (a disk is under its threshold) and
              {{ $value }} reclaim step(s) exited non-zero on its runs for 15m+, so the disk is not being
              relieved. `journalctl -u dev-worker-disk-guard -n 120` shows each step's exit code and
              output; `docker info` and `sudo cleanup --dry-run` reproduce the usual causes.
        # The guard's heartbeat. A stale or missing timestamp means the timer stopped, the tool crashes,
        # or / is too full for its textfile write — in each case nothing is guarding the disk. The
        # threshold carries the delay (a healthy run is every ~5 min; one ladder can take tens of
        # minutes), so `for` is short: it fires ~35 min after the last heartbeat, as the summary says.
        # A heartbeat with no COMPLETED run for 3h is a run that hangs between heartbeats' worth of
        # progress (a ladder at its longest is well under that).
        - alert: DevWorkerDiskGuardStale
          expr: |
            (time() - dev_worker_disk_guard_last_run_timestamp_seconds{job="dev-worker-node"}) > 1800
              or (time() - dev_worker_disk_guard_last_completed_timestamp_seconds{job="dev-worker-node"}) > 10800
              or (up{job="dev-worker-node"} == 1
                  unless on (instance) dev_worker_disk_guard_last_run_timestamp_seconds{job="dev-worker-node"})
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Dev worker {{ $labels.instance }}: disk-guard stale (no heartbeat 30m+ or no completed run 3h+)"
            description: >-
              No fresh dev_worker_disk_guard_last_run_timestamp_seconds from {{ $labels.instance }}, or
              no completed run (last_completed_timestamp_seconds) for 3h: the dev-worker-disk-guard
              timer is stopped or failing, a run hangs, or / is too full to write
              /var/lib/prometheus/node-exporter/dev_worker_disk_guard.prom. `systemctl status
              dev-worker-disk-guard.timer dev-worker-disk-guard.service`; roll out with
              `--tags disk_guard`.
        # Docker reclaim has been held off for over an hour by a busy docker client (a build, a pull, a
        # container starting) or by another cleanup run holding its lock. The deferral's start is
        # persisted across runs, so a long one is not mistaken for a fresh one every 5 min.
        - alert: DevWorkerDiskGuardDeferred
          expr: |
            (time() - dev_worker_disk_guard_deferred_since_timestamp_seconds{job="dev-worker-node"}) > 3600
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Dev worker {{ $labels.instance }}: disk-guard deferred for 1h+ ({{ $labels.reason }})"
            description: >-
              disk-guard on {{ $labels.instance }} has been unable to run its docker reclaim steps for
              over an hour ({{ $labels.reason }}) while the docker filesystem is short. `journalctl -u
              dev-worker-disk-guard | grep deferred` names the blocking command. A stuck `docker pull`
              or build holds it until /workspace reaches 5%; stop it if it is not live work.
        # No trustworthy completed-run result: the state file is missing or unreadable, or runs complete
        # but cannot persist it (state_write_failed is only in a run's final write, so it is read over
        # 15m), for 30m. A fresh worker has one within ~5 min. Exhausted/Failing are blind meanwhile.
        - alert: DevWorkerDiskGuardStateUnknown
          expr: |
            dev_worker_disk_guard_state_known{job="dev-worker-node"} == 0
              or max_over_time(dev_worker_disk_guard_state_write_failed{job="dev-worker-node"}[15m]) == 1
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Dev worker {{ $labels.instance }}: disk-guard has no completed-run result"
            description: >-
              /var/lib/dev-worker-disk-guard/state.json on {{ $labels.instance }} is missing,
              unreadable or cannot be written, so the Exhausted/Failing alerts are blind. `sudo cat
              /var/lib/dev-worker-disk-guard/state.json`, `journalctl -u dev-worker-disk-guard -n 30`
              (a full / makes the write fail).
        # The agents' archive dir (dev_worker_archive_dir) is capped by disk-guard on every run, but only
        # entries unchanged for an hour may go: a burst of new entries can hold it over the cap for up to
        # an hour by design. Over for 2h means the cap is not working (every entry keeps changing, or the
        # removal fails) and the archive is growing unbounded again. A scan that runs out of time
        # removes nothing and sets archive_scan_timeout (archive_bytes is then a lower bound): the same
        # alert, since an archive too big to scan in 120 s is exactly one the cap is not holding.
        - alert: DevWorkerArchiveOverCap
          expr: |
            dev_worker_disk_guard_archive_bytes{job="dev-worker-node"}
              > dev_worker_disk_guard_archive_max_bytes{job="dev-worker-node"}
            or dev_worker_disk_guard_archive_scan_timeout{job="dev-worker-node"} == 1
          for: 2h
          labels: { severity: warning }
          annotations:
            summary: "Dev worker {{ $labels.instance }}: agent archive over its cap for 2h+"
            description: >-
              /workspace/archive on {{ $labels.instance }} has been over its cap (or too big to scan in
              120 s) for 2h, which the hour-long grace for new entries cannot explain. `journalctl -u
              dev-worker-disk-guard | grep archive` shows whether entries keep changing ("everything left
              changed within the hour"), a removal fails ("could not remove": a root-owned entry is never
              removed) or the scan times out ("nothing removed this run": too many files — ask the agent
              to pack them). `du -sh /workspace/archive/* | sort -rh | head`.
