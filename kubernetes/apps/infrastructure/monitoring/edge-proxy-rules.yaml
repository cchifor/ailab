# Alerts for the edge proxy (ADR 0040, docs/standards/edge-ingress.md): the Caddy DaemonSet
# edge/edge-proxy that fronts every *.chifor.me hostname, directly and behind the tunnel.
# Metrics via apps/edge/proxy/podmonitor.yaml (job=edge-proxy; source=caddy for Caddy's per-host
# histogram, source=reloader for the cert-reloader sidecar's counters), DaemonSet readiness from
# kube-state-metrics, and the issued certificate's expiry from cert-manager. That one is scraped by
# the chart's ServiceMonitor cert-manager/cert-manager (infrastructure/cert-manager/helmrelease.yaml)
# with honorLabels false, so its series carry the Certificate's namespace as exported_namespace and
# `namespace` is cert-manager's own; EdgeCertExpiringSoon selects on exported_namespace and sets
# `namespace: edge` on the alert. If that monitor ever honors labels, the selector must follow.
#
# THE CERTIFICATE RULES: the cert-probe sidecar reads the certificate each pod's Caddy SERVES (TLS
# to localhost), so EdgeCertServedExpiringSoon is the direct answer, and EdgeCertProbeFailing says
# when that answer is missing. The others locate the cause:
#   EdgeCertExpiringSoon   the issued certificate (the Secret) is not being renewed;
#   EdgeCertNotLoaded      a pod's mounted pair is not the one Caddy loaded (reloader gauge);
#   EdgeCertReloaderStale / EdgeCertReloaderNotScraped  the reloader loop or its metrics are gone.
#
# WHY: from P5 the tunnel and the direct path both go through this proxy, so a proxy that is down,
# failing upstream or serving a stale certificate takes every public hostname with it.
# `release: kube-prometheus-stack` so the operator's ruleSelector picks it up.
# edge-proxy-rules.test.yaml asserts each rule both ways; scripts/rules-lint.sh runs it on every PR.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: edge-proxy
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: edge-proxy
      rules:
        - alert: EdgeProxyDown
          expr: kube_daemonset_status_number_ready{namespace="edge",daemonset="edge-proxy"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "edge-proxy has no ready pod"
            description: >-
              No edge-proxy pod is ready, so the VIP 192.168.0.51 answers nothing and, from P5,
              the tunnel has no backend either. Runbook: docs/runbooks/edge-ingress.md, Rollback.
        - alert: EdgeProxyDegraded
          expr: >-
            kube_daemonset_status_number_ready{namespace="edge",daemonset="edge-proxy"}
            < kube_daemonset_status_desired_number_scheduled{namespace="edge",daemonset="edge-proxy"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "edge-proxy has fewer ready pods than nodes"
            description: >-
              Some control-plane node has no ready edge-proxy pod for 15m (a drain file left in
              /config/drain, a failed rollout, or a missing certificate Secret). MetalLB announces
              only from nodes with a ready pod, so the VIP still works, with less headroom.
        - alert: EdgeProxyNotScraped
          expr: absent(up{job="edge-proxy",source="caddy"} == 1)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "no edge-proxy metrics target is up"
            description: >-
              Prometheus has no answering edge-proxy target for 15m: the PodMonitor, the metrics
              port 9180 or the NetworkPolicy edge-proxy. The other edge alerts are blind meanwhile.
        # Per LISTENER (server: direct, tunnel, redirect), not per host: Caddy's per-host labels are
        # off because on a TLS server they would record any Host a WAN client sends (unbounded). The
        # failing host is in the access log: kubectl -n edge logs -l app.kubernetes.io/name=edge-proxy -c caddy.
        - alert: EdgeUpstreamErrors
          expr: >-
            (
              sum by (server) (rate(caddy_http_request_duration_seconds_count{job="edge-proxy",code=~"5.."}[10m]))
              / sum by (server) (rate(caddy_http_request_duration_seconds_count{job="edge-proxy"}[10m]))
            ) > 0.2
            and sum by (server) (increase(caddy_http_request_duration_seconds_count{job="edge-proxy"}[10m])) >= 20
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "edge listener {{ $labels.server }}: over 20 % of requests fail with 5xx"
            description: >-
              More than a fifth of the requests through the edge proxy's {{ $labels.server }} listener
              have answered 5xx for 15m (502 = backend unreachable or Authelia down). Gated on at least
              20 requests per 10m. The access log names the hosts.
        - alert: EdgeCertReloadFailing
          expr: >-
            increase(edge_cert_reload_failures_total{job="edge-proxy"}[30m]) > 0
            or increase(edge_cert_invalid_total{job="edge-proxy"}[30m]) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "edge-proxy cannot load a renewed certificate"
            description: >-
              The cert-reloader sidecar on {{ $labels.pod }} keeps failing to reload Caddy, or the
              renewed pair does not validate, so Caddy is still serving the previous certificate.
              Check `kubectl -n edge logs {{ $labels.pod }} -c cert-reloader`.
        - alert: EdgeCertNotLoaded
          expr: edge_cert_files_not_loaded{job="edge-proxy"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "edge-proxy on {{ $labels.pod }} serves a certificate other than the mounted one"
            description: >-
              For an hour the certificate mounted on {{ $labels.pod }} has not been the one Caddy
              loaded: a renewal is not being served there. See EdgeCertReloadFailing and the
              cert-reloader container's log.
        - alert: EdgeCertReloaderStale
          expr: time() - edge_cert_reloader_heartbeat_seconds{job="edge-proxy"} > 900
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "the cert-reloader loop on {{ $labels.pod }} has stopped"
            description: >-
              The cert-reloader on {{ $labels.pod }} has not completed a pass for over 15 minutes,
              so EdgeCertNotLoaded cannot be trusted there and a renewal would not be loaded.
        - alert: EdgeCertReloaderNotScraped
          expr: up{job="edge-proxy",source="reloader"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "the cert-reloader metrics on {{ $labels.pod }} cannot be read"
            description: >-
              /reloader-metrics on {{ $labels.pod }} has failed to scrape for 15m (the sidecar has
              not written its file yet, or it is gone), so the certificate rules are blind there.
        - alert: EdgeCertServedExpiringSoon
          expr: edge_cert_served_not_after_seconds{job="edge-proxy"} - time() < 14 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} serves a certificate that expires in under 14 days"
            description: >-
              The certificate edge-proxy on {{ $labels.pod }} actually serves expires in under 14
              days. If EdgeCertExpiringSoon is quiet the Secret was renewed and this pod is not
              serving it: check EdgeCertNotLoaded, the cert-reloader log and the node's Secret volume.
        - alert: EdgeCertProbeFailing
          expr: >-
            edge_cert_probe_success{job="edge-proxy"} == 0
            or (time() - edge_cert_probe_heartbeat_seconds{job="edge-proxy"}) > 600
            or up{job="edge-proxy",source="probe"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "the served-certificate probe on {{ $labels.pod }} is not answering"
            description: >-
              The cert-probe sidecar on {{ $labels.pod }} has not read the served certificate for
              15m (Caddy's TLS listener, the sidecar, or its metrics endpoint), so
              EdgeCertServedExpiringSoon is blind there.
        - alert: EdgeCertExpiringSoon
          expr: >-
            certmanager_certificate_expiration_timestamp_seconds{exported_namespace="edge",name="edge-wildcard"}
            - time() < 14 * 86400
          for: 1h
          labels:
            severity: warning
            namespace: edge # the series' own namespace is cert-manager's; route this as an edge alert
          annotations:
            summary: "edge-wildcard certificate expires in under 14 days"
            description: >-
              cert-manager has not renewed *.chifor.me (Certificate edge/edge-wildcard; it renews at
              30 days left). Check the Certificate's events and the Cloudflare DNS-01 solver.
