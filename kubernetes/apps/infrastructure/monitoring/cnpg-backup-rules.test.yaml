# `promtool test rules` fixtures for cnpg-backup-rules.yaml. Run by scripts/rules-lint.sh on every PR,
# after `promtool check rules`.
#
# What `check rules` cannot see, and so each has a test that FAILS if it regresses:
#   1. The primary filter. A replica keeps the archiver row it had as a primary, so an unfiltered rule
#      pages on every healthy cluster; and a switchover must hand the verdict to the NEW primary.
#   2. Idle stays quiet. An idle primary has zero .ready segments and must not read as a backlog.
#   3. The two metric families. A fresh plugin timestamp must win over a stale in-tree one (and the
#      reverse during the migration), or the cutover pages, or worse, masks a real gap.
#   4. Absence. A cluster that is not scraped at all must page, not read as "all quiet".
#
# `rule_files` is the extracted spec name (rules-lint.sh hands promtool the `spec:` body under the
# manifest's basename).
rule_files:
  - cnpg-backup-rules.yaml

evaluation_interval: 1m

tests:
  # ------------------------------------------------------- 1. archiving failing: primary only, survives a switchover
  - interval: 1m
    name: a failing archiver pages on the primary after 15m, never on a replica
    input_series:
      - series: 'cnpg_pg_replication_in_recovery{namespace="trueswarm", pod="trueswarm-pg-1", cluster="trueswarm-pg"}'
        values: "0+0x30"
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="trueswarm", pod="trueswarm-pg-1", cluster="trueswarm-pg"}'
        values: "2000+0x30"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="trueswarm", pod="trueswarm-pg-1", cluster="trueswarm-pg"}'
        values: "1000+0x30"
      # The replica carries the same stale "failed > archived" row: must stay silent.
      - series: 'cnpg_pg_replication_in_recovery{namespace="trueswarm", pod="trueswarm-pg-2", cluster="trueswarm-pg"}'
        values: "1+0x30"
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="trueswarm", pod="trueswarm-pg-2", cluster="trueswarm-pg"}'
        values: "2000+0x30"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="trueswarm", pod="trueswarm-pg-2", cluster="trueswarm-pg"}'
        values: "1000+0x30"
    alert_rule_test:
      - eval_time: 14m
        alertname: CNPGWalArchivingFailing
        exp_alerts: []
      - eval_time: 16m
        alertname: CNPGWalArchivingFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: trueswarm
              pod: trueswarm-pg-1
              cluster: trueswarm-pg
            exp_annotations:
              summary: "CNPG WAL archiving failing on trueswarm/trueswarm-pg-1"
              description: "The primary trueswarm/trueswarm-pg-1 has failed to archive WAL more recently than it last succeeded, for over 15 minutes. Point-in-time recovery stops at the last archived segment, and pg_wal grows until the volume fills (CNPGVolumeNearlyFull). Check the Cluster's ContinuousArchiving condition and the archiver log (in-tree: the postgres container; plugin: the plugin-barman-cloud sidecar). \"Expected empty archive\" has its own documented escape hatch in the plan."

  - interval: 1m
    name: a switchover hands the archiver verdict to the new primary
    input_series:
      # pg-1 is primary for 10m with a failed archive, then becomes a replica; pg-2 takes over healthy.
      - series: 'cnpg_pg_replication_in_recovery{namespace="trueswarm", pod="trueswarm-pg-1", cluster="trueswarm-pg"}'
        values: "0+0x9 1+0x30"
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="trueswarm", pod="trueswarm-pg-1", cluster="trueswarm-pg"}'
        values: "2000+0x40"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="trueswarm", pod="trueswarm-pg-1", cluster="trueswarm-pg"}'
        values: "1000+0x40"
      - series: 'cnpg_pg_replication_in_recovery{namespace="trueswarm", pod="trueswarm-pg-2", cluster="trueswarm-pg"}'
        values: "1+0x9 0+0x30"
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="trueswarm", pod="trueswarm-pg-2", cluster="trueswarm-pg"}'
        values: "-1+0x40"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="trueswarm", pod="trueswarm-pg-2", cluster="trueswarm-pg"}'
        values: "3000+0x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: CNPGWalArchivingFailing
        exp_alerts: []

  # ...and the verdict really MOVES: here the new primary is the failing one. A rule that simply
  # dropped every pod after a role change would pass the test above; this one would catch it.
  # (ailab#1179 review: claude 65619)
  - interval: 1m
    name: after a switchover the new primary's failing archiver pages
    input_series:
      - series: 'cnpg_pg_replication_in_recovery{namespace="trueswarm", pod="trueswarm-pg-1", cluster="trueswarm-pg"}'
        values: "0+0x9 1+0x30"
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="trueswarm", pod="trueswarm-pg-1", cluster="trueswarm-pg"}'
        values: "-1+0x40"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="trueswarm", pod="trueswarm-pg-1", cluster="trueswarm-pg"}'
        values: "3000+0x40"
      - series: 'cnpg_pg_replication_in_recovery{namespace="trueswarm", pod="trueswarm-pg-2", cluster="trueswarm-pg"}'
        values: "1+0x9 0+0x30"
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="trueswarm", pod="trueswarm-pg-2", cluster="trueswarm-pg"}'
        values: "2000+0x40"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="trueswarm", pod="trueswarm-pg-2", cluster="trueswarm-pg"}'
        values: "1000+0x40"
    alert_rule_test:
      - eval_time: 24m
        alertname: CNPGWalArchivingFailing
        exp_alerts: []
      - eval_time: 26m
        alertname: CNPGWalArchivingFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: trueswarm
              pod: trueswarm-pg-2
              cluster: trueswarm-pg
            exp_annotations:
              summary: "CNPG WAL archiving failing on trueswarm/trueswarm-pg-2"
              description: "The primary trueswarm/trueswarm-pg-2 has failed to archive WAL more recently than it last succeeded, for over 15 minutes. Point-in-time recovery stops at the last archived segment, and pg_wal grows until the volume fills (CNPGVolumeNearlyFull). Check the Cluster's ContinuousArchiving condition and the archiver log (in-tree: the postgres container; plugin: the plugin-barman-cloud sidecar). \"Expected empty archive\" has its own documented escape hatch in the plan."

  # ------------------------------------------------------- 2. backlog, and idle stays quiet
  - interval: 1m
    name: a growing .ready backlog on the primary warns after 30m; an idle primary does not
    input_series:
      - series: 'cnpg_pg_replication_in_recovery{namespace="trueswarm-admin", pod="trueswarm-admin-pg-2", cluster="trueswarm-admin-pg"}'
        values: "0+0x40"
      - series: 'cnpg_collector_pg_wal_archive_status{namespace="trueswarm-admin", pod="trueswarm-admin-pg-2", cluster="trueswarm-admin-pg", value="ready"}'
        values: "8+0x40"
      - series: 'cnpg_pg_replication_in_recovery{namespace="trueswarm", pod="trueswarm-platform-pg-1", cluster="trueswarm-platform-pg"}'
        values: "0+0x40"
      - series: 'cnpg_collector_pg_wal_archive_status{namespace="trueswarm", pod="trueswarm-platform-pg-1", cluster="trueswarm-platform-pg", value="ready"}'
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 29m
        alertname: CNPGWalArchiveBacklog
        exp_alerts: []
      - eval_time: 32m
        alertname: CNPGWalArchiveBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: trueswarm-admin
              pod: trueswarm-admin-pg-2
              cluster: trueswarm-admin-pg
              value: ready
            exp_annotations:
              summary: "CNPG WAL archive backlog on trueswarm-admin/trueswarm-admin-pg-2 (8 segments)"
              description: "8 WAL segments have been waiting to be archived on the primary trueswarm-admin/trueswarm-admin-pg-2 for over 30 minutes. The archiver is behind or stuck; if it keeps growing, CNPGWalArchivingFailing or CNPGVolumeNearlyFull follows."

  # ------------------------------------------------------- 3. base-backup age across both metric families
  # time() is seconds since the test's epoch, so "0+60xN" sampled every minute is "always now". Sampled
  # per minute, not hourly: with the 5m lookback an hourly series is stale most of the time and `for:` never holds.
  - interval: 1m
    name: a stale in-tree backup pages after 26h; a fresh plugin timestamp on the same cluster wins
    input_series:
      # trueswarm-pg: in-tree only, never refreshed -> pages.
      - series: 'cnpg_pg_replication_in_recovery{namespace="trueswarm", pod="trueswarm-pg-1", cluster="trueswarm-pg"}'
        values: "0+0x1900"
      - series: 'cnpg_collector_last_available_backup_timestamp{namespace="trueswarm", pod="trueswarm-pg-1", cluster="trueswarm-pg"}'
        values: "0+0x1900"
      # trueswarm-platform-pg: the migrated shape — stale in-tree series plus a fresh plugin one -> quiet.
      - series: 'cnpg_pg_replication_in_recovery{namespace="trueswarm", pod="trueswarm-platform-pg-1", cluster="trueswarm-platform-pg"}'
        values: "0+0x1900"
      - series: 'cnpg_collector_last_available_backup_timestamp{namespace="trueswarm", pod="trueswarm-platform-pg-1", cluster="trueswarm-platform-pg"}'
        values: "0+0x1900"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="trueswarm", pod="trueswarm-platform-pg-1", cluster="trueswarm-platform-pg"}'
        values: "0+60x1900"
    alert_rule_test:
      - eval_time: 25h
        alertname: CNPGBaseBackupStale
        exp_alerts: []
      - eval_time: 30h
        alertname: CNPGBaseBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: trueswarm
              cluster: trueswarm-pg
            exp_annotations:
              summary: "CNPG trueswarm/trueswarm-pg: newest base backup is 1d 6h 0m 0s old"
              description: "The newest completed base backup of trueswarm/trueswarm-pg is older than 26 hours, so a daily ScheduledBackup was missed or failed. Recovery still works from the old base backup plus archived WAL, but replay takes longer and the retention window ages toward losing the base. Check `kubectl get backups -n trueswarm` and the ScheduledBackup's lastScheduleTime/suspend."

  # ------------------------------------------------------- 4. the latest attempt failed, then a success clears it
  - interval: 1m
    name: a failure newer than the last success warns; the next success clears it
    input_series:
      - series: 'cnpg_pg_replication_in_recovery{namespace="trueswarm-admin", pod="trueswarm-admin-pg-2", cluster="trueswarm-admin-pg"}'
        values: "0+0x60"
      - series: 'barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="trueswarm-admin", pod="trueswarm-admin-pg-2", cluster="trueswarm-admin-pg"}'
        values: "5000+0x60"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="trueswarm-admin", pod="trueswarm-admin-pg-2", cluster="trueswarm-admin-pg"}'
        values: "4000+0x29 6000+0x30"
    alert_rule_test:
      - eval_time: 12m
        alertname: CNPGBackupFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: trueswarm-admin
              cluster: trueswarm-admin-pg
            exp_annotations:
              summary: "CNPG trueswarm-admin/trueswarm-admin-pg: the latest base backup failed"
              description: "The most recent base-backup attempt of trueswarm-admin/trueswarm-admin-pg failed and no backup has completed since. Check the failed Backup object's status.error and the archiver log."
      - eval_time: 45m
        alertname: CNPGBackupFailing
        exp_alerts: []

  # ------------------------------------------------------- 5. absence: unscraped or down pages, scraped stays quiet
  - interval: 1m
    name: a cluster with no up target, or only a down one, pages; a scraped cluster does not
    input_series:
      # trueswarm-pg: no target at all (no series). trueswarm-admin-pg: target present but down.
      - series: 'up{job="trueswarm/trueswarm-platform-pg-metrics", namespace="trueswarm", pod="trueswarm-platform-pg-1", cluster="trueswarm-platform-pg"}'
        values: "1+0x30"
      - series: 'up{job="trueswarm-admin/trueswarm-admin-pg-metrics", namespace="trueswarm-admin", pod="trueswarm-admin-pg-2", cluster="trueswarm-admin-pg"}'
        values: "0+0x30"
    alert_rule_test:
      - eval_time: 14m
        alertname: CNPGBackupScrapeMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: CNPGBackupScrapeMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: trueswarm
              cluster: trueswarm-pg
            exp_annotations:
              summary: "CNPG trueswarm/trueswarm-pg has no scraped instance"
              description: "No instance of trueswarm/trueswarm-pg has been scraped successfully for 15 minutes, so every WAL-archiving and backup alert for it is blind. Check the pods, the trueswarm-pg-metrics PodMonitor (trueswarm-pg-podmonitors.yaml) and the monitoring -> :9187 NetworkPolicy."
          - exp_labels:
              severity: critical
              namespace: trueswarm-admin
              cluster: trueswarm-admin-pg
            exp_annotations:
              summary: "CNPG trueswarm-admin/trueswarm-admin-pg has no scraped instance"
              description: "No instance of trueswarm-admin/trueswarm-admin-pg has been scraped successfully for 15 minutes, so every WAL-archiving and backup alert for it is blind. Check the pods, the trueswarm-admin-pg-metrics PodMonitor (trueswarm-pg-podmonitors.yaml) and the monitoring -> :9187 NetworkPolicy."

  # The healthy primary is scraped for trueswarm-pg (in-tree family) and trueswarm-platform-pg (plugin
  # family). trueswarm-admin-pg's primary is NOT scraped: only its replica is, and that replica still
  # exports a fresh timestamp. Up stays 1, the scrape-level absence rule stays quiet, and every
  # primary-filtered rule would read as "fine". The two primary-anchored coverage rules must page.
  # (ailab#1179 review: codex 65613, claude 65618)
  - interval: 1m
    name: a cluster whose primary is not scraped pages even while a replica exports a fresh timestamp
    input_series:
      - series: 'up{job="trueswarm/trueswarm-pg-metrics", namespace="trueswarm", pod="trueswarm-pg-1", cluster="trueswarm-pg"}'
        values: "1+0x40"
      - series: 'up{job="trueswarm/trueswarm-platform-pg-metrics", namespace="trueswarm", pod="trueswarm-platform-pg-1", cluster="trueswarm-platform-pg"}'
        values: "1+0x40"
      - series: 'cnpg_pg_replication_in_recovery{namespace="trueswarm", pod="trueswarm-pg-1", cluster="trueswarm-pg"}'
        values: "0+0x40"
      - series: 'cnpg_collector_last_available_backup_timestamp{namespace="trueswarm", pod="trueswarm-pg-1", cluster="trueswarm-pg"}'
        values: "100+0x40"
      - series: 'cnpg_pg_replication_in_recovery{namespace="trueswarm", pod="trueswarm-platform-pg-1", cluster="trueswarm-platform-pg"}'
        values: "0+0x40"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="trueswarm", pod="trueswarm-platform-pg-1", cluster="trueswarm-platform-pg"}'
        values: "100+0x40"
      - series: 'up{job="trueswarm-admin/trueswarm-admin-pg-metrics", namespace="trueswarm-admin", pod="trueswarm-admin-pg-1", cluster="trueswarm-admin-pg"}'
        values: "1+0x40"
      - series: 'cnpg_pg_replication_in_recovery{namespace="trueswarm-admin", pod="trueswarm-admin-pg-1", cluster="trueswarm-admin-pg"}'
        values: "1+0x40"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="trueswarm-admin", pod="trueswarm-admin-pg-1", cluster="trueswarm-admin-pg"}'
        values: "100+0x40"
    alert_rule_test:
      - eval_time: 16m
        alertname: CNPGPrimaryNotObserved
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: trueswarm-admin
              cluster: trueswarm-admin-pg
            exp_annotations:
              summary: "CNPG trueswarm-admin/trueswarm-admin-pg: no scraped instance reports being the primary"
              description: "No scraped instance of trueswarm-admin/trueswarm-admin-pg has reported cnpg_pg_replication_in_recovery == 0 for 15 minutes, so every primary-filtered WAL-archiving and backup alert for it is blind. Either the primary is not being scraped (check its pod and target), the replication query is failing (cnpg_collector_last_collection_error), or the cluster has no primary."
      - eval_time: 31m
        alertname: CNPGBackupMetricMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: trueswarm-admin
              cluster: trueswarm-admin-pg
            exp_annotations:
              summary: "CNPG trueswarm-admin/trueswarm-admin-pg primary exports no backup timestamp"
              description: "The primary of trueswarm-admin/trueswarm-admin-pg has exported neither barman_cloud_cloudnative_pg_io_last_available_backup_timestamp (plugin) nor cnpg_collector_last_available_backup_timestamp (in-tree) for 30 minutes, so CNPGBaseBackupStale cannot evaluate. Check the instance metrics on :9187 and, after the migration, the plugin-barman-cloud sidecar."
      - eval_time: 31m
        alertname: CNPGBackupScrapeMissing
        exp_alerts: []
