# Alerts for the 2 PR-reviewer VMs and the reviewbot service on them (metrics via
# reviewers-node.yaml, job=reviewer-node; reviewbot_* come from the node_exporter textfile
# collector that reviewbot.py writes).
#
# WHY THIS EXISTS: on 2026-09-03/04 the claude persona failed every review of a large PR for
# ~30 hours and NOTHING fired. The reviewers had a scrape target, a dashboard row, and zero
# rules. platform#1067 was attempted 9 times across 3 heads over 71 minutes, never produced a
# verdict, and the operator merged it by hand after noticing the queue by eye. Root cause was
# a 300 s LLM deadline against runs that legitimately need 515 s.
#
# THRESHOLDS ARE MEASURED, NOT GUESSED. Each was checked against the live 48 h series before
# being written down, because the obvious values are wrong here in both directions:
#   * `reviewbot_oldest_job_age_seconds > 3600` — the intuitive "stuck over an hour" — held for
#     ZERO minutes during the incident (its peak was 3008 s). It would have been a rule that
#     could not fire. 1800 held for 40 min; 900 held for 101 min.
#   * `time() - reviewbot_last_success_timestamp_seconds > 6h` held for 369 MINUTES in the same
#     48 h — six hours of firing on an idle night when nobody had opened a PR. Gated on
#     `reviewbot_queue_depth > 0` it collapses to 25 scattered sample-minutes, all of which
#     `for: 30m` filters out.
# The lesson the estate already paid for once (agentforge-rules.yaml pinned to a job with zero
# targets) is that "the expression parses" and "the expression can fire" are different claims.
# reviewbot-rules.test.yaml pins both, and scripts/rules-lint.sh runs it on every PR.
#
# `release: kube-prometheus-stack` so the operator's ruleSelector picks it up.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: reviewbot
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: reviewbot
      rules:
        # FIRST, because it is what keeps the rest honest. Every reviewbot_* rule below reads a
        # textfile series; if the VM dies those series do not go stale, they VANISH, and an
        # expression over an absent series never fires. Without this alert the whole group is
        # silently defeated by the one failure it most needs to survive. CRITICAL to match
        # DevWorkerNodeDown — a dead reviewer stalls the automerge lane for every repo.
        - alert: ReviewerNodeDown
          expr: up{job="reviewer-node"} == 0
          for: 10m
          labels: { severity: critical }
          annotations:
            summary: "Reviewer VM {{ $labels.instance }} is down (no node_exporter scrape)"
            description: >-
              node_exporter on reviewer {{ $labels.instance }} has been unscrapeable for >10m.
              .24 = reviewer-1 (claude persona), .25 = reviewer-2 (codex persona); both are on
              ai-node3 (vmid 4501/4502). While a reviewer is down its persona posts no verdicts,
              so every PR needing "all personas clean" stops merging. Note the reviewbot_*
              alerts in this group CANNOT fire while this one is active — their series are gone,
              not stale.
        # Liveness of the metrics ticker, which writes every 15s. Only meaningful since metrics
        # moved off the worker loop: they used to be written only between jobs, so the heartbeat
        # tracked the LLM deadline exactly (measured max staleness 296s against a 300s timeout)
        # and no threshold below the deadline was possible.
        - alert: ReviewbotHeartbeatStale
          expr: time() - reviewbot_heartbeat_timestamp_seconds > 300
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "reviewbot ({{ $labels.persona }}) heartbeat is stale (>5m)"
            description: >-
              The reviewbot metrics ticker on {{ $labels.instance }} writes every 15s, so 300s is
              20 missed ticks — the process is wedged or dead, not busy. This proves PROCESS
              liveness only; a worker stuck inside a job keeps the heartbeat fresh, which is what
              ReviewbotWorkerStuck is for. Check `systemctl status reviewbot` and the journal.
        # The worker-progress signal the heartbeat deliberately no longer provides. One attempt
        # is bounded at llm_timeout_s (900s, primary+fallback SHARING one budget), plus posting,
        # so 40 min means wedged rather than working.
        - alert: ReviewbotWorkerStuck
          expr: reviewbot_running_job_age_seconds > 2400
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "reviewbot ({{ $labels.persona }}) has held one job for >40m"
            description: >-
              A single job on {{ $labels.instance }} has been in running/posting for over 40
              minutes. One attempt is capped at llm_timeout_s (900s) including the fallback, so
              this is a hang, not a long review — most likely a subprocess that ignored its
              deadline or a wedged Gitea POST. The worker is single-threaded: nothing else is
              being reviewed while this is true.
        # THE DETECTOR FOR THE 2026-09-04 INCIDENT, and the only rule here that would have caught
        # it early. 6 of the 12 timeouts fell inside the 09:59-11:00 hour. Everything else looked
        # healthy throughout: small PRs kept succeeding, so last_success stayed fresh, the queue
        # drained between retries, and the heartbeat never went stale for more than one deadline.
        - alert: ReviewbotReviewTimeouts
          expr: increase(reviewbot_llm_timeouts_total[1h]) >= 3
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "reviewbot ({{ $labels.persona }}) hit {{ $value | printf \"%.0f\" }} LLM deadlines in an hour"
            description: >-
              Three or more reviews on {{ $labels.instance }} exceeded llm_timeout_s within an
              hour. Each one burns the WHOLE budget of a single-threaded worker and produces
              nothing, and after max_timeout_attempts the head is quarantined with no verdict —
              which blocks the automerge lane for that PR. Either a specific PR is too expensive
              (check reviewbot_llm_seconds_max and reviewbot_llm_output_tokens_max: run length
              tracks REASONING, not diff size) or the deadline is too tight again. Raise
              pr_reviewer_llm_timeout_s in the role defaults, not per host.
        # The twin of ReviewbotReviewTimeouts, and the one this rule set was MISSING. A
        # timeout means the deadline was too tight for the work; a failure means the review
        # could not be produced at all — an undecodable diff, unparseable model output, a
        # Gitea write that did not land. Both leave the PR with no verdict and block the
        # automerge lane, so both must page.
        #
        # Measured 2026-09-06: platform#1074 (a 4.0 MB diff carrying a non-UTF-8 byte) failed
        # on every attempt on both personas for 22 hours — 66 failures, peaking at 15/h — and
        # NOTHING fired, because the only alert on this counter watched the timeout half.
        # ReviewbotQuarantined did catch the first occurrence, then went silent: the PR was
        # being pushed to, so each job was superseded by a new head before it could exhaust
        # max_attempts and quarantine.
        #
        # Threshold mirrors the timeout rule (>=3/h) rather than the observed 15/h peak: the
        # healthy baseline is a flat ZERO — all 66 failures in that 48h window were this one
        # PR — so three in an hour is already abnormal, and `for: 10m` rides out a blip.
        - alert: ReviewbotReviewFailures
          expr: increase(reviewbot_llm_failures_total[1h]) >= 3
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "reviewbot ({{ $labels.persona }}) failed {{ $value | printf \"%.0f\" }} reviews in an hour"
            description: >-
              Three or more reviews on {{ $labels.instance }} failed within an hour without
              hitting the deadline (that would be ReviewbotReviewTimeouts). The PRs involved
              have no verdict from this persona and cannot automerge. Check
              `journalctl -u reviewbot | grep failed` on the host — the failure note carries
              the reason and the PR. A single PR failing every attempt looks like this and
              will NOT reach ReviewbotQuarantined if it is being actively pushed to, because
              each new head supersedes the job before its attempts are exhausted. If the
              reviewers are behind main, converge them: `ansible-playbook reviewers.yml`.
        # The runbook's first diagnosis step is now a Grafana logs panel, so the log pipeline
        # is load-bearing and has to be watched like one. It is also pinned to a SINGLE node
        # IP (journal_ship_loki_url -> 192.168.0.41:30310): a NodePort is served by all three
        # nodes, but Alloy takes one URL, so draining .41 stops shipping while .42/.43 would
        # have served it. That is an accepted trade-off — there is no LAN VIP or internal DNS
        # name for the node set — and this alert is what makes it survivable: repointing is a
        # one-variable change once you know it happened.
        - alert: ReviewerLogShippingDown
          expr: up{job="reviewer-alloy"} == 0
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "Reviewer log shipping is down on {{ $labels.instance }}"
            description: >-
              Alloy on {{ $labels.instance }} has been unscrapeable for >15m, so reviewer
              journals are probably not reaching Loki and the dashboard's Reviewer Errors panel
              is blind — while still rendering an empty, healthy-looking panel. Check
              `systemctl status alloy` on the host. If the Loki endpoint moved, the URL is
              journal_ship_loki_url in roles/journal_ship (pinned to one node IP by design).
        # Drops are silent by nature: Alloy keeps running, the panel just thins out. rate_limited
        # and queue_is_full mean Loki is pushing back; line_too_long and ingester_error mean the
        # payload is being refused outright.
        - alert: ReviewerLogsDropped
          expr: sum by (instance, reason) (increase(loki_write_dropped_bytes_total{job="reviewer-alloy"}[1h])) > 0
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "Reviewer log shipping dropped bytes on {{ $labels.instance }} ({{ $labels.reason }})"
            description: >-
              Alloy on {{ $labels.instance }} dropped log bytes in the last hour, reason
              `{{ $labels.reason }}`. The Reviewer Errors panel is now incomplete without
              looking incomplete. rate_limited / queue_is_full point at Loki ingestion limits;
              line_too_long and ingester_error point at the payload.
        # Age, not depth: a reconcile burst of 18 that drains in 20 min is the NORMAL shape and
        # must not page. See the header for why this is 1800 and not the intuitive 3600.
        # Note this counts queued/retry only, so a single stuck job with an empty queue reports
        # zero — that gap is covered by ReviewbotWorkerStuck, not by lowering this.
        - alert: ReviewbotQueueBacklog
          expr: reviewbot_oldest_job_age_seconds > 1800
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "reviewbot ({{ $labels.persona }}) has a job queued >30m"
            description: >-
              The oldest queued job on {{ $labels.instance }} has been waiting over 30 minutes.
              Healthy bursts drain well inside this (the codex persona's 48h worst case was 28.8
              min); the claude persona's incident peak was 50.1 min. Usually means the worker is
              spending its time on failing retries — check ReviewbotReviewTimeouts and the
              journal for repeated attempts on one PR.
        # Safety net for the enqueue dedupe: 'quarantined' is now in the dedupe set (that is what
        # stops the reconciler re-queueing a hopeless job every 300s forever), so a give-up
        # STICKS until a new head supersedes it or an operator runs --requeue. It therefore has
        # to be visible. Reads the 24h-windowed gauge, not the cumulative one, which never falls
        # for a PR that was closed rather than pushed to and would latch this alert on forever.
        - alert: ReviewbotQuarantined
          expr: reviewbot_quarantined_recent_jobs > 0
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "reviewbot ({{ $labels.persona }}) quarantined a review in the last 24h"
            description: >-
              {{ $value }} job(s) on {{ $labels.instance }} gave up in the last 24h and will NOT
              be retried on their own — that PR has no verdict from this persona and cannot
              automerge. Recover with
              `sudo -u c4 python3 /usr/local/lib/reviewbot/reviewbot.py /etc/reviewbot/config.json --requeue <owner/repo> <pr>`.
              That refuses the `ambiguous POST` class unless you add --force: the pre-post marker
              check makes a retry cheap, not idempotent, so check the PR in Gitea first. Pushing a
              new head retires the row instead. See docs/runbooks/dev-workers.md.
        # Backstop for a TOTAL stall, gated on there being work to do. Honest scope: this would
        # NOT have caught the 2026-09-04 incident (small PRs kept succeeding throughout it) —
        # ReviewbotReviewTimeouts is the rule for that shape. Ungated it is a pure false-positive
        # generator; see the header.
        - alert: ReviewbotStalled
          expr: >-
            (time() - reviewbot_last_success_timestamp_seconds > 3600)
            and on (persona, instance)
            (reviewbot_queue_depth > 0)
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "reviewbot ({{ $labels.persona }}) has queued work but no success in >1h"
            description: >-
              {{ $labels.instance }} has jobs queued and has not completed one in over an hour.
              The queue gate is load-bearing: without it this fires through every idle night
              (measured: 369 minutes of an ungated 6h version over one 48h window). Check
              whether the LLM CLI still authenticates — a subscription re-login invalidates the
              seeded credentials, which are NOT ansible-managed.
        # The reconcile sweep — the safety-net that heals lost webhook deliveries — had NO alert
        # at all until 2026-09-10, while its metric was exported all along. Neither neighbour
        # covers it: ReviewbotHeartbeatStale watches the metrics ticker, which runs on its own
        # thread and keeps ticking through a dead reconciler, and ReviewbotStalled is gated on
        # queue_depth > 0, which a webhook-fed queue drains to zero. So a sweep could die and
        # page nobody — which is exactly what deleting an allowlisted repo used to cause.
        #
        # THREE branches, because "not completing" has three shapes and only one is a stale
        # number. `up` is kept on the LEFT of the outer `and` so every branch carries the same
        # target labels even in the branch where the timestamp series does not exist — a bare
        # `time() - metric` yields NOTHING to alert on when the series is absent, which is the
        # fresh-database case. Note this differs from the agentforge precedent
        # (agentforge-rules.yaml:28): that one guards an EXPORTED zero, and the `> 0` filter here
        # still does, but reviewbot.py omits the line entirely until the key exists.
        # Annotations name `instance`, NOT `persona`: the missing-series branch has no persona
        # label to interpolate. Gating on `up == 1` leaves node-down to ReviewerNodeDown.
        # 1800s = 6 reconcile_s cycles (300s) plus slack for sweep runtime (serial API calls,
        # 60s timeout each), the 15s metrics tick and the 30s scrape. `for: 15m` doubles as the
        # startup grace the missing/zero branches need. Worst-case detection ~45m, proportionate
        # for a safety-net sitting behind webhook delivery.
        - alert: ReviewbotReconcileStale
          expr: >-
            (up{job="reviewer-node"} == 1)
            and on (job, instance) (
                  ((time() - (reviewbot_last_reconcile_timestamp_seconds{job="reviewer-node"} > 0)) > 1800)
               or (reviewbot_last_reconcile_timestamp_seconds{job="reviewer-node"} == 0)
               or ((up{job="reviewer-node"} == 1)
                   unless on (job, instance) reviewbot_last_reconcile_timestamp_seconds{job="reviewer-node"})
            )
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "reviewbot reconcile sweep on {{ $labels.instance }} is not completing"
            description: >-
              The reconcile sweep on {{ $labels.instance }} has not completed in >30m, has never
              completed, or stopped exporting its timestamp. Webhook-driven reviews may still be
              working — this is the safety-net that heals MISSED deliveries, so its death is
              silent from the outside. Check `journalctl -u reviewbot | grep reconcile`, then
              whether the PAT still reads every repo in `/etc/reviewbot/config.json`.
        # Companion to the rule above: that one says the sweep is not finishing, this one says it
        # IS finishing but skipping a repo. Both are needed — a caught repo failure ADVANCES the
        # timestamp (so the stale rule stays silent), while a hung sweep freezes this gauge at its
        # last value (so this rule cannot be the only signal).
        # The freshness gate keeps a frozen gauge from double-paging alongside the stale rule.
        # Matching on (job, instance, persona) is explicit and load-bearing: the default would
        # also try to match `repo`, which the timestamp series does not carry, silently emptying
        # the gate. Set operators need no group_left.
        # DOCUMENTED SEAM: both rules use 1800s, so once a hung sweep passes that age this rule
        # stops matching while the stale rule has yet to satisfy its own 15m hold — a firing repo
        # alert can resolve up to 15m BEFORE the stale one fires. Deliberate: widening this gate
        # would buy continuous coverage at the price of double-paging every hung sweep.
        - alert: ReviewbotReconcileRepoFailing
          expr: >-
            (reviewbot_reconcile_repo_failed{job="reviewer-node"} == 1)
            and on (job, instance, persona) (
              (time() - (reviewbot_last_reconcile_timestamp_seconds{job="reviewer-node"} > 0)) <= 1800
            )
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "reviewbot ({{ $labels.persona }}) cannot sweep {{ $labels.repo }}"
            description: >-
              The sweep on {{ $labels.instance }} completes but {{ $labels.repo }} did not finish
              — most often a deleted or renamed repo still in the allowlist, or a PAT that lost
              its grant. Scope: this means "this repo's sweep did not complete", NOT "merge
              errors" — maybe_merge() swallows most of its own failures and never reaches this
              boundary. The other repos are unaffected (the sweep is fault-isolated per repo).
              Fix the allowlist in ansible/roles/pr_reviewer/defaults/main.yml and redeploy.
        # NO SELF-HEALING PATH, which is why this is worth a page rather than a dashboard.
        # THRESHOLD IS MEASURED (see the header): over the 78 most recently merged PRs across
        # ailab + platform, the lag from the last clean persona review to the merge ran median
        # 426s, p90 5070s, p99 40045s, MAX 45536s (12.6h) — merges legitimately trail by half a
        # day here, so the intuitive "a few hours" would page on healthy ones. 86400 sits clear
        # of that entire observed tail. Scope is narrow on purpose: maybe_merge() reports only
        # the VERDICT gate, so a PR held by `no-automerge`, by a non-allowlisted author, or by
        # pending CI never reaches this gauge — those are deliberate or transient states with
        # their own signals. ailab#616 (12h) and #619 (8h) are the founding incidents.
        - alert: ReviewbotMergeBlocked
          expr: reviewbot_merge_blocked_seconds > 86400
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "reviewbot ({{ $labels.persona }}) has a PR held >24h by the verdict gate"
            description: >-
              A PR on {{ $labels.instance }} is merge-eligible in every respect except that the personas are not all clean at its current head, and has been for over 24h. This is the shape that has NO self-healing path: the severity ladder relaxes only from round 3, review_round() counts distinct fully-reviewed HEADS, and a bot author (renovate-bot, agentforge-ci-bot) never pushes a new one — so a round-1 `important` holds the merge forever. Find it with `journalctl -u reviewbot | grep 'held at'`, then either fix the finding, or merge over it if it is a false positive, or set `no-automerge` to say a human owns it (which clears this alert).
        # A safety net in CONTINUOUS use means the thing it protects is gone. Deliberately reads
        # the fallback counter and not llm_primary_failed_total: a primary failure the fallback
        # rescues produces correct reviews, so nothing else in this group can see it.
        # THRESHOLD IS MEASURED: reviewbot_reviews_full_total peaked at 57 (claude) / 68 (codex)
        # per 6h over 7d, typical 44 — so a dead primary yields roughly one fallback per review,
        # ~44 per 6h (reviewer-1's real rate was 463 over 4 days = ~29 per 6h). 10 is far above
        # any plausible blip and far below either figure.
        - alert: ReviewbotPrimaryModelDown
          expr: increase(reviewbot_llm_fallback_used_total[6h]) >= 10
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "reviewbot ({{ $labels.persona }}) is running on its fallback model"
            description: >-
              The pinned primary model on {{ $labels.instance }} has failed often enough in 6h that the fallback is carrying the service. Reviews still land, which is exactly why this needs an alert: nothing else changes. `llm_failures_total` counts whole reviews and a rescued review is not a failed one, so reviewer-1 served 463 reviews on its fallback over 4 days (`claude-fable-5` quota, from 2026-09-06 19:17) with no signal but a per-run journal line. Check `journalctl -u reviewbot | grep 'primary model failed'`; if the quota is gone for good, repoint `pr_reviewer_llm_model` rather than leaving every review to pay a doomed first attempt.
