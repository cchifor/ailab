# Alerts over the per-slot WORKER BOT credentials (git.chifor.me): the worker identities plan
# (plans/2026-10-11-worker-identities-plan.md), Phase 5 drift alarm. Each dev-worker slot has its own
# Gitea account dev-worker-<N>-bot holding exactly three tokens, dw<N>-(git|repo|pkg)-<stamp>, minted by
# the enrolment or rotation ceremony (docs/runbooks/s2s-identity.md).
#
# SOURCE: the custom CNPG query gitea_worker_credentials in apps/databases/
# infra-pg-gitea-credential-queries.yaml, over the aggregate view credential_inventory.worker_credentials
# (apps/databases/gitea-credential-inventory.sql). COUNTS ONLY: token names are judged inside the view;
# no token value, hash, name or id leaves the database. `worker` is a Gitea login.
#
# THE LIVE SLOT LIST, dev-worker-[1-4]-bot, appears in GiteaWorkerBotTokenKindMissing,
# GiteaWorkerBotOutsideSlotList and GiteaWorkerCredentialInventoryMissing. It follows
# dev_worker_gitea_users in ansible/group_vars/dev_workers.yml: a slot change edits both in one PR.
#
# THE SHARED dev-worker-bot is exported (every token of it counts as unexpected, since it has no slot)
# but no rule alerts on its tokens yet: it is retired in Phase 5 once its consumers are drained, and
# the "dev-worker-bot holds a token" rule lands with that retirement. Its row must still be present
# (GiteaWorkerCredentialInventoryMissing covers all five families of all five accounts), because the
# account is kept for history.
#
# Every expression is `max by (namespace, worker)` for the same reason as gitea-credential-rules.yaml
# (a failover overlap must not double an alert). Fixtures: gitea-worker-credential-rules.test.yaml.
# Generated layout; edit the rules and the fixtures together.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gitea-worker-credential
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: gitea-worker-credential
    rules:
    - alert: GiteaWorkerBotUnexpectedToken
      expr: max by (namespace, worker) (cnpg_gitea_worker_credentials_tokens_unexpected{namespace="databases", worker=~"dev-worker-[0-9]+-bot"})
        > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Gitea worker bot {{ $labels.worker }} holds {{ $value | humanize }} unexpected token(s)
        description: A per-slot worker bot holds an access token that is not one of its own dw<N>-(git|repo|pkg)-<stamp>
          ceremony tokens. Only the enrolment and rotation ceremonies mint tokens for these accounts (docs/runbooks/s2s-identity.md).
          List the account's token names with psql on the infra-pg primary (never token_hash) and delete the stray
          one by id.
    - alert: GiteaWorkerBotTokenKindMissing
      expr: max by (namespace, worker) (cnpg_gitea_worker_credentials_kinds_present{namespace="databases", worker=~"dev-worker-[1-4]-bot"})
        < 3
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: Gitea worker bot {{ $labels.worker }} holds {{ $value | humanize }} of its 3 token kinds
        description: A live slot's bot is missing one of its git, repo or pkg tokens, so a credential the slot's
          OpenBao document carries no longer authenticates. Mint the missing kind with the enrolment ceremony and
          re-seed the slot (docs/runbooks/s2s-identity.md). The live slot list in this rule (dev-worker-[1-4]-bot)
          follows dev_worker_gitea_users in ansible/group_vars/dev_workers.yml.
    - alert: GiteaWorkerBotRotationStuck
      expr: max by (namespace, worker) (cnpg_gitea_worker_credentials_max_tokens_per_kind{namespace="databases",
        worker=~"dev-worker-[0-9]+-bot"}) == 2
      for: 24h
      labels:
        severity: warning
      annotations:
        summary: Gitea worker bot {{ $labels.worker }} has held two tokens of one kind for 24h
        description: A rotation mints the new token before deleting the old one, so two tokens of one kind may coexist
          briefly. After 24 hours the old one should have been deleted by its recorded id (docs/runbooks/s2s-identity.md,
          rotation). Finish the rotation or delete the stale token.
    - alert: GiteaWorkerBotTokenKindDuplicated
      expr: max by (namespace, worker) (cnpg_gitea_worker_credentials_max_tokens_per_kind{namespace="databases",
        worker=~"dev-worker-[0-9]+-bot"}) > 2
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Gitea worker bot {{ $labels.worker }} holds {{ $value | humanize }} tokens of one kind
        description: 'More than two tokens of one kind is never a rotation: a ceremony was retried without deleting
          what it minted. Keep only the token recorded in the slot''s OpenBao document and delete the others by
          id.'
    - alert: GiteaWorkerBotOutsideSlotList
      expr: |-
        max by (namespace, worker) (cnpg_gitea_worker_credentials_active{namespace="databases", worker=~"dev-worker-[0-9]+-bot", worker!~"dev-worker-[1-4]-bot"}) > 0
        or max by (namespace, worker) (cnpg_gitea_worker_credentials_tokens{namespace="databases", worker=~"dev-worker-[0-9]+-bot", worker!~"dev-worker-[1-4]-bot"}) > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Gitea worker bot {{ $labels.worker }} is outside the live slot list but active or holding tokens
        description: A dev-worker-<N>-bot account outside the live slots (dev-worker-[1-4]-bot) can still log in
          or holds tokens. A retired slot's account is kept for history with prohibit_login set and no tokens, and
          is then silent. Delete its tokens and set prohibit_login, or add the slot to the slot lists in the same
          PR.
    - alert: GiteaWorkerCredentialInventoryMissing
      expr: |-
        label_replace(absent(cnpg_gitea_worker_credentials_active{namespace="databases", worker="dev-worker-1-bot"}), "family", "cnpg_gitea_worker_credentials_active", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_tokens{namespace="databases", worker="dev-worker-1-bot"}), "family", "cnpg_gitea_worker_credentials_tokens", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_tokens_unexpected{namespace="databases", worker="dev-worker-1-bot"}), "family", "cnpg_gitea_worker_credentials_tokens_unexpected", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_kinds_present{namespace="databases", worker="dev-worker-1-bot"}), "family", "cnpg_gitea_worker_credentials_kinds_present", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_max_tokens_per_kind{namespace="databases", worker="dev-worker-1-bot"}), "family", "cnpg_gitea_worker_credentials_max_tokens_per_kind", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_active{namespace="databases", worker="dev-worker-2-bot"}), "family", "cnpg_gitea_worker_credentials_active", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_tokens{namespace="databases", worker="dev-worker-2-bot"}), "family", "cnpg_gitea_worker_credentials_tokens", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_tokens_unexpected{namespace="databases", worker="dev-worker-2-bot"}), "family", "cnpg_gitea_worker_credentials_tokens_unexpected", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_kinds_present{namespace="databases", worker="dev-worker-2-bot"}), "family", "cnpg_gitea_worker_credentials_kinds_present", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_max_tokens_per_kind{namespace="databases", worker="dev-worker-2-bot"}), "family", "cnpg_gitea_worker_credentials_max_tokens_per_kind", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_active{namespace="databases", worker="dev-worker-3-bot"}), "family", "cnpg_gitea_worker_credentials_active", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_tokens{namespace="databases", worker="dev-worker-3-bot"}), "family", "cnpg_gitea_worker_credentials_tokens", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_tokens_unexpected{namespace="databases", worker="dev-worker-3-bot"}), "family", "cnpg_gitea_worker_credentials_tokens_unexpected", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_kinds_present{namespace="databases", worker="dev-worker-3-bot"}), "family", "cnpg_gitea_worker_credentials_kinds_present", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_max_tokens_per_kind{namespace="databases", worker="dev-worker-3-bot"}), "family", "cnpg_gitea_worker_credentials_max_tokens_per_kind", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_active{namespace="databases", worker="dev-worker-4-bot"}), "family", "cnpg_gitea_worker_credentials_active", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_tokens{namespace="databases", worker="dev-worker-4-bot"}), "family", "cnpg_gitea_worker_credentials_tokens", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_tokens_unexpected{namespace="databases", worker="dev-worker-4-bot"}), "family", "cnpg_gitea_worker_credentials_tokens_unexpected", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_kinds_present{namespace="databases", worker="dev-worker-4-bot"}), "family", "cnpg_gitea_worker_credentials_kinds_present", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_max_tokens_per_kind{namespace="databases", worker="dev-worker-4-bot"}), "family", "cnpg_gitea_worker_credentials_max_tokens_per_kind", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_active{namespace="databases", worker="dev-worker-bot"}), "family", "cnpg_gitea_worker_credentials_active", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_tokens{namespace="databases", worker="dev-worker-bot"}), "family", "cnpg_gitea_worker_credentials_tokens", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_tokens_unexpected{namespace="databases", worker="dev-worker-bot"}), "family", "cnpg_gitea_worker_credentials_tokens_unexpected", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_kinds_present{namespace="databases", worker="dev-worker-bot"}), "family", "cnpg_gitea_worker_credentials_kinds_present", "", "")
        or label_replace(absent(cnpg_gitea_worker_credentials_max_tokens_per_kind{namespace="databases", worker="dev-worker-bot"}), "family", "cnpg_gitea_worker_credentials_max_tokens_per_kind", "", "")
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: Gitea worker credential series {{ $labels.family }} missing for {{ $labels.worker }}
        description: 'The worker-bot credential inventory (view credential_inventory.worker_credentials, created
          by apps/databases/gitea-credential-inventory.sql) exports no such series for this account: the view is
          missing (re-run the file on the infra-pg primary), the exporter query fails, or the account was renamed
          or deleted. A valid zero is a row of zeros, never a missing series.'
