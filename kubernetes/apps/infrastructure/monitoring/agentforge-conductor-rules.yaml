# Alerts over the conductor (`agentforge conduct`, conductor program row 7). The conductor is a
# fleet-wide OBSERVER: at T0 it reads the estate, classifies parked issues and writes nothing. Its
# whole value is that it notices things, so the failure that matters most is the one where it stops
# noticing and nothing says so.
#
# THE SERIES NAMES HERE KEEP `_total`, AND THAT IS NOT COSMETIC. A counter's SAMPLE name — what PromQL
# matches — is `forge_conduct_passes_total`; `registry.collect()` reports the FAMILY name with the
# suffix stripped. A rule written against the stripped spelling parses, type-checks, evaluates to an
# empty vector forever, and never fires. `promtool check rules` cannot catch it because an expression
# over a non-existent series is not an error.
#
# EVERY WINDOW IS SIZED OFF THE 300-SECOND PASS CADENCE (AF_CONDUCT_INTERVAL_S), never off a scrape
# interval. A `[5m]` window can legitimately contain ZERO increments on a perfectly healthy conductor,
# so any `increase(...) == 0` over a short window is a false positive by construction. The scrape is
# 30s (conductor-podmonitor.yaml) purely so a per-pass counter is never read as flat.
#
# AN UNLABELLED GAUGE IS 0 FROM CONSTRUCTION, AND 0 IS NOT A TIMESTAMP. prometheus_client exports
# `forge_conduct_last_pass_timestamp` at 0.0 the instant the registry is built, and it stays there
# until the first pass that observes the estate. Read as a stamp, that 0 is the Unix epoch: `time() - 0`
# is ~1.77e9 seconds, which satisfies any age threshold from the first scrape of a freshly booted
# conductor and renders as a 56-year outage. Every rule here that subtracts the gauge from `time()`
# carries `> 0` on the gauge as its precondition, and the never-stamped state has a rule of its own.
#
# `release: kube-prometheus-stack` so the operator's ruleSelector picks it up. Without it this file
# applies cleanly and is never loaded — no rule, no error, no event.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agentforge-conductor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: agentforge-conductor
    app.kubernetes.io/part-of: agentforge
    release: kube-prometheus-stack
spec:
  groups:
    - name: agentforge-conductor
      rules:
        # FIRST, deliberately: a conductor nobody is scraping is indistinguishable from a quiet estate,
        # and every other rule in this file is an empty vector while it is unscraped. This is the rule
        # that makes the others trustworthy.
        #
        # The PER-POD ANTI-JOIN, not `absent()`. The idiom is ForgeOrchestratorUnscraped's: join
        # kube-state-metrics' view of a ready container against a series only the workload itself can
        # publish, and alert on the difference. `absent()` is the form this estate has already measured
        # as wrong — over 24h the naive absent() form would have fired 1270 times where the guarded
        # form fired zero.
        #
        # forge_conduct_writes_total is the marker because it is UNLABELLED, which means prometheus_client
        # emits it at 0.0 the instant the registry is constructed — before any pass runs. So it is
        # present from the first scrape of a healthy conductor and absent only when nothing is scraped
        # at all. A labelled series would be absent until its first child was touched, which at T0
        # (where the conductor writes nothing) might be never.
        #
        # `for: 20m` matches the orchestrator rule and clears a rollout plus Prometheus' 5m staleness
        # window, which is already ForgeTargetDown's business.
        - alert: ForgeConductDown
          expr: |-
            max by (namespace, pod) (
              kube_pod_container_status_ready{namespace="agentforge", container="conductor"} == 1
            )
            unless on (namespace, pod) forge_conduct_writes_total
          for: 20m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor {{ $labels.namespace }}/{{ $labels.pod }} is unscraped (no forge_conduct_* metrics)"
            description: >-
              The conductor container is Ready but publishes no forge_conduct_* series, so every other
              conductor alert is an empty vector and the estate is unobserved without saying so. Check
              the PodMonitor binds the container port NAMED metrics (9464, the conductor's own
              registry) and not probe (8720, which serves /healthz and /readyz only), and that the
              CiliumNetworkPolicy admits the monitoring namespace to 9464.
        # A conductor that HAS observed the estate and has stopped. The stamp is set ONLY on a pass
        # that actually read the estate (`listings_complete and not any(incomplete.values())`), so a
        # stale stamp on a scraped conductor means nothing since has read it — every pass coming back
        # short (a forge outage, a spent budget, an auth failure), or no pass returning at all while
        # the process stays up. The expression does not tell those apart; the pass counter does, and
        # the description points the operator at it.
        #
        # `> 0` ON THE GAUGE IS THE PRECONDITION, not a tidy-up (the header's epoch note), written
        # inline the way the estate's other stamp rules write it (ForgeReconcileStalled,
        # ForgeDispatchStalled, ReviewbotReconcileStale): the filter passes the gauge through when it
        # holds a stamp and yields an empty vector when it holds the construction-time 0, and
        # `time() -` an empty vector is empty — so a conductor that has never stamped is invisible to
        # this rule rather than a 56-year outage to it. That conductor is ForgeConductNeverObserved's
        # case, below. The two rules partition the gauge — `== 0` there, `> 0` here — so at most one
        # of them can be the answer for any one process, and `$value` here is an age the engine
        # actually produced. The alert wears the gauge's own scrape labels.
        #
        # THE PASS COUNTER IS NOT A TERM, on purpose. `record_pass` writes the stamp and counts the
        # complete pass in one call, so on a healthy process `passes_total > 0` follows from
        # `gauge > 0` and decides nothing. On the one process where it does not follow, it decides
        # the wrong thing: the engine keeps stamping when the counter's write fails, by design
        # (test_a_wedged_counter_does_not_stop_the_liveness_stamp, agentforge
        # tests/unit/test_conduct_metrics.py — an instrument fault must never cost the liveness
        # series), and a `passes_total > 0` conjunct here would silence this rule on that process
        # while its stamped gauge silences NeverObserved, leaving a conductor that stopped observing
        # with no rule at all. The fixture's wedged-counter case holds that open.
        #
        # 1800s = six pass intervals: at 300s a conductor has passed on six consecutive chances to
        # re-stamp before the expression is true, and the 10m hold adds two more before it fires —
        # about forty minutes after the last observation, past any single transient and well inside
        # the time a human would want to know.
        - alert: ForgeConductBlind
          expr: |-
            (time() - (forge_conduct_last_pass_timestamp > 0)) > 1800
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor has not completed a pass in {{ $value | printf \"%.0f\" }}s"
            description: >-
              The conductor has observed the estate before — the stamp is live — and has not done so
              in over six pass intervals. Either every pass since is coming back short, or no pass is
              returning at all while the process is still scraped: forge_conduct_passes_total says
              which, and the per-sensor counter forge_conduct_sensor_incomplete_total says which read
              is short. A conductor that has never stamped at all is ForgeConductNeverObserved's case,
              not this one.
        # THE OTHER HALF OF THE PARTITION: a conductor that has never stamped. Thirty minutes into
        # the pod's life and no stamp means every pass that ended came back short or raised, or no
        # pass has ended at all: a lane reading a path that is not there, a permission the bot lacks,
        # a sensor that fails on every pass, a first pass that hung. A fault the process cannot see,
        # and Blind, above, cannot speak for.
        #
        # THE POD'S AGE IS THE CLOCK, NOT THE PASS COUNT. `time()` has nothing on the engine's side
        # to measure against here (the gauge is 0), and a count of passes only ticks for passes that
        # END — a conductor whose second pass hangs for ever sits at one pass, scraped and Ready,
        # and a rule waiting for a sixth would wait with it (reviewer-codex on #719). The pod's
        # start time is what kube-state-metrics already joins the Down rule against, it is a clock
        # that runs whether or not passes end, and 1800s is Blind's own six-interval yardstick on
        # this side of the partition: a healthy conductor stamps within its first interval, so a pod
        # half an hour old with no stamp has passed on six chances. The join is `on (namespace, pod)`
        # — the labels the PodMonitor stamps on every series and the two that name a pod — so a
        # rollout's new pod starts its own clock, and the pod-scoped max strips kube-state-metrics'
        # other labels (uid, service, ...) so the alert wears only the join's.
        #
        # `for: 10m` FOR THE IN-PLACE RESTART. A container that restarts inside a pod that is
        # already older than the clock re-exports the gauge at 0 while the pod's start time stays
        # where it was, so the expression is true from the new container's first scrape and stays
        # true until its first complete pass — one interval on a healthy conductor. The hold is two
        # intervals, so a restart that observes the estate as it should never fires, and one that
        # cannot fires ten minutes later than a fresh pod would. The count is still the first thing
        # to read: forge_conduct_passes_total says whether passes are ending short, raising, or not
        # ending at all, and the description says so.
        - alert: ForgeConductNeverObserved
          expr: |-
            max by (namespace, pod) (
              time() - kube_pod_start_time{namespace="agentforge", pod=~"agentforge-conductor-.*"}
            ) > 1800
              and on (namespace, pod) (forge_conduct_last_pass_timestamp == 0)
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor pod has been up for {{ $value | printf \"%.0f\" }}s and no pass has observed the estate"
            description: >-
              forge_conduct_last_pass_timestamp is still the 0 it is exported at before the first
              complete pass, half an hour or more after the pod started — so no pass has read the
              estate, which is a fault the process itself cannot see: a lane reading a path that is
              not there, a permission its bot lacks, a sensor that fails on every pass, or a pass
              that never ends. Read forge_conduct_passes_total first: a rising incomplete count is
              passes coming back short (forge_conduct_sensor_incomplete_total says which read), a
              rising failed count is passes raising (the log has the traceback), and a count that
              is not moving at all is a pass that hung. A rollout's new pod starts its own clock;
              the first complete pass hands the watch over to ForgeConductBlind.
        # Passes that RAISED, as opposed to passes that came back incomplete. The loop catches every
        # exception and backs off, so a raising pass is invisible in the process's health — it looks
        # like a conductor that is simply quiet. `_conduct_loop` (agentforge main.py) counts every
        # pass on this counter, on the return arm and on the except arm.
        #
        # [2h] BECAUSE OF THAT BACKOFF, which the rule's own annotation states. `backoff_seconds`
        # (conductor/loop.py) is `interval * 2 ** min(consecutive_failures, 2)`, so at the 300s
        # default a sustained failure run lands its failures at t=0, +600s, then +1200s apart for
        # ever. A window sized off the pass cadence — six intervals, [30m] — holds at most two of
        # those (1800/1200 = 1.5) and can never need three of anything; [2h] holds ~6 at the
        # backed-off cadence while still needing three, so one transient (or two) stays quiet.
        #
        # COUNTED, NOT increase()'d. increase() scales the raw step count to the window's edges by a
        # factor set by where the samples sit against them, and a COUNT threshold on it is a coin
        # toss at the margin: at a full scrape two failures read 2.01-2.07 (by window and scrape
        # interval) once the counter was non-zero when the window opened — over a `> 2` — and with
        # scrapes missing they read past three (samples at 60m, 70m and 90m read at 100m put two
        # steps at 3.17), while the factor is never under 1, so a `>= 3` is safe only from below.
        # changes() counts the value changes among the samples the window holds — an integer, no
        # extrapolation — and resets() subtracts the one change that is not a failure, a restart's
        # drop to 0. That is exact on this counter because record_pass_failure moves it by one and
        # the backoff puts at least 600s between two moves of one process, so a 30s scrape never
        # sees two as one. Where it is not exact it is quiet: a scrape gap wide enough to merge two
        # failures under-counts, and a failure that lands before the first scrape after a restart
        # is hidden unless the counter stood at 0 before it (n to 1 is one change less one reset;
        # 1 to 1 is no change at all).
        #
        # sum() is not decoration: an un-aggregated result carries the series' own labels onto the
        # alert — outcome="failed", redundant with the alert's name, and one alert per value of any
        # dimension the counter gains later. It sums ONE series per pod, because the conductor has
        # one PodMonitor; a second scrape of the same pod would count every failure twice.
        - alert: ForgeConductPassesFailing
          expr: |-
            sum(
              changes(forge_conduct_passes_total{outcome="failed"}[2h])
                - resets(forge_conduct_passes_total{outcome="failed"}[2h])
            ) >= 3
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor: {{ $value | printf \"%.0f\" }} passes raised in the last 2h"
            description: >-
              Passes are raising rather than returning incomplete, which the loop absorbs into its
              backoff. Check the conductor's logs for the traceback. The window is 2h BECAUSE of that
              backoff: a sustained run settles at one failed pass per four intervals (1200s at the
              300s default), so three failures span thirty to forty minutes of backoff plus the
              passes' own run time, and a window sized off the pass cadence holds at most two of them.
        # A CONFIG GENERATION THE LOOP REFUSED (agentforge #379). The refresh after every pass re-checks
        # the startup gate's isolation invariants against the tenant config's newest generation — the
        # repo-name grammar, a non-empty bound read set, filing repos disjoint from every repo the
        # config binds, act repos inside the bound set — and a generation that breaks one is not
        # adopted: the conductor keeps running on the last generation that satisfied them, and this
        # counter is the only outward sign. From the estate that is indistinguishable from a config
        # that never changed — passes complete, the stamp advances, every rule above stays quiet — while
        # whoever edited the config is reading an estate observed under the config they replaced.
        #
        # `> 0`, NOT A COUNT, over [30m]. One refusal is already the fact: someone pushed a generation
        # the gate rejects, and a restart on it would refuse to boot. The counter moves once per
        # REFRESH — once per pass interval while the source keeps serving the bad generation, and once
        # per 1200s in the backed-off regime, because the refresh runs after the sleep and backs off
        # with the pass. A threshold of one needs only a window longer than the slowest interval, and
        # 1800 > 1200 (a window of exactly the interval holds no step for one eval per cycle, which
        # is enough to drop the alert). Not `> 1` either: increase() extrapolates to the window's
        # edges, so one refusal reads as exactly 1 or as 1-and-a-bit depending on where its samples
        # sit against the window, and a threshold of one turns a single refusal into a coin toss on
        # scrape timing. The window is also the clear: refusals stop when a good generation lands,
        # and the alert resolves itself once the last one ages out — within 30m of it.
        #
        # sum() for ForgeConductPassesFailing's reason: the counter is unlabelled, so an un-aggregated
        # increase() would put the scrape's own labels on the alert. No `for`: a refusal is a discrete
        # event the counter records once and the window holds for just under 30m (until the sample
        # before the step leaves it), nothing about that can flap, and a hold would only delay the
        # page.
        - alert: ForgeConductConfigRejected
          expr: |-
            sum(increase(forge_conduct_config_rejected_total[30m])) > 0
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor refused a config generation and is running on the last one it accepted"
            description: >-
              forge_conduct_config_rejected_total advanced: the refresh after a pass re-checked the
              startup gate's isolation invariants against a new generation of the tenant config and
              refused it — the repo-name grammar, a non-empty bound read set, filing repos disjoint
              from every repo the config binds, act repos inside the bound set. The conductor keeps
              running on the last generation that satisfied them, so the estate it reports on is not
              the one the refused generation describes — and for as long as that generation is the
              one the source serves, a restart would refuse to boot on it with the same messages.
              The conductor's log carries them (`conduct: refusing config generation`); fix the
              generation at its Gitea source and the alert clears once the last refused refresh
              ages out of its 30m window.
        # T0's standing invariant, and the one rule here that is a POSTURE check rather than a health
        # check. At AF_CONDUCT_TIER=observe the write door refuses before its first forge call, so any
        # movement on this counter under that tier means the door let a write through under a tier
        # that forbids it — the arming that was not meant to happen.
        #
        # This is deliberately NOT the proof that T0 is write-free: the engine pins that with an AST
        # writer pin, because `writes == 0` at observe is a tautology rather than a measurement. This
        # rule catches the CONFIGURATION changing, not the code.
        #
        # THE RULE READS THE TIER, since the arming rungs. A conductor deployed at AF_CONDUCT_TIER=advise
        # writes by design — one lifecycle comment per park, the T1 program — and the earlier form of
        # this rule, which took every write for a breach, would have fired for as long as the tier
        # stayed armed, which is for ever, and muted ntfy under it (program-plan invariant 9).
        # `forge_conduct_tier_info{tier}` is the deployed tier as the engine read it at construction:
        # one child per tier of Settings' closed set (observe, advise, act-safe, act-approved,
        # escalate), the deployed one at 1 and the other four at 0, so the series is TOTAL and its
        # absence means the gauge was not scraped — never "some other tier".
        #
        # A WRITE MEETS ITS OWN POD'S TIER: `on (namespace, pod)`, the two labels the PodMonitor stamps
        # on both series, rather than a fleet-wide `max()`. The Deployment is Recreate, so two pods
        # never overlap — but the WINDOW does. A de-arming rollout (advise back to observe) leaves the
        # old pod's writes inside [30m] for half an hour after the new pod's observe child reads 1,
        # and a fleet-wide join would read that as a write at observe and page the operator who just
        # de-armed. Joined per pod, the old pod's writes meet the old pod's advise (0, then stale)
        # and nothing fires. `max by (namespace, pod)` strips the tier and scrape labels so the join
        # is on exactly those two; `sum by (namespace, pod)` on the left for
        # ForgeConductPassesFailing's reason — it sums the one series per pod.
        #
        # THE GAUGE'S ABSENCE IS THIS RULE'S QUIET DIRECTION, and ForgeConductTierUnknown (next) is
        # what makes that safe: a conductor that publishes no tier — an image from before the gauge —
        # cannot satisfy the conjunct, so this rule cannot fire on it, and a posture rule that cannot
        # fire is a posture nobody is checking.
        - alert: ForgeConductUnexpectedWrites
          expr: |-
            sum by (namespace, pod) (increase(forge_conduct_writes_total[30m])) > 0
              and on (namespace, pod) (
                max by (namespace, pod) (forge_conduct_tier_info{tier="observe"}) == 1
              )
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor {{ $labels.namespace }}/{{ $labels.pod }} wrote to the forge while deployed at tier=observe"
            description: >-
              forge_conduct_writes_total advanced on a pod whose forge_conduct_tier_info reads
              tier=observe. At observe the write door refuses before reaching the forge, so a write
              from that pod means the door let one through under a tier that forbids it — the
              posture the T0 invariant pins. Confirm the Deployment's AF_CONDUCT_TIER and the image
              the pod runs. A pod at advise or above writing is the T1 program working and is not
              this alert; a pod that publishes no tier at all is ForgeConductTierUnknown's.
        # THE TIER NOBODY IS SCRAPING READS AS "NOT OBSERVE". ForgeConductUnexpectedWrites is a
        # conjunction, and a conjunct over a series that is not there is an empty vector: a conductor
        # that publishes no forge_conduct_tier_info — an image from before the gauge, or a gauge
        # dropped from the registry — silences the posture rule without a word. That is the header's
        # instrument that reads healthy because nothing watches it, one rule over, and this is the
        # rule that says so.
        #
        # THE ANTI-JOIN, NOT `absent()`, for ForgeConductDown's reason: absent() cannot tell a pod
        # that is gone from a pod that is up and publishing no tier, and this estate has measured that
        # form as wrong. The left side is Down's — the Ready conductor container, pod-scoped — and so
        # is the marker: forge_conduct_writes_total is unlabelled, present from the first scrape of
        # any conductor, so `and on (namespace, pod)` on it is "this pod IS scraped", and `unless on
        # (namespace, pod) forge_conduct_tier_info` is "and publishes no tier". The two rules partition
        # the missing-series states: a pod publishing nothing is Down's, a pod publishing everything
        # but the tier is this one's, a pod publishing the tier is neither's — and a pod that never
        # became Ready is ForgeConductSecretNotReady's, which is why the left side is the Ready
        # container and not the pod's start time (a pod stuck at ContainerCreating has one).
        #
        # `for: 10m`: the writes counter and the tier gauge are constructed together, so on a healthy
        # conductor they arrive in the same scrape and the expression is never true; the hold covers
        # a scrape that lands while a pod is still coming up, and Prometheus' 5m staleness on the
        # series of a pod that has just left.
        #
        # MERGE ORDER, because the rule is right and its timing can still be wrong. The conductor
        # image this estate runs (conductor-deployment.yaml's digest: agentforge build 455c12b, the
        # #402 merge) publishes no forge_conduct_tier_info — the gauge is agentforge's
        # conduct-tier-info change, stacked on its T1 instruments, and agentforge main (9255b43 as
        # this is written) carries neither. Landed against that image, this rule fires on the live
        # pod ten minutes in and stays up — a phone push every four hours, at warning — until the
        # engine merges the gauge AND the ailab pin moves to a build that has it, a window nothing
        # here bounds (program-plan invariant 9). So this file lands AFTER the agentforge tier-info
        # and T1-instrument merges and the repin that carries them, and the PR that carries it is
        # held until that pin is live — and the pin must carry 5d (feat/conduct-diagnoses-pretouch,
        # the diagnoses pre-touch) as well, because ForgeConductWakesUnanswered below is a page on
        # every container restart on an image without it (its REQUIRES paragraph): the label comes
        # off on 5d pinned, not on the series scraped. The T1 rules below cost nothing in the
        # meantime — each is an empty vector on an image that exports none of their series — this
        # is the one rule that would not be. If it must land first, replace this paragraph with the
        # date the pin is due and the window accepted, in days.
        - alert: ForgeConductTierUnknown
          expr: |-
            max by (namespace, pod) (
              kube_pod_container_status_ready{namespace="agentforge", container="conductor"} == 1
            )
              and on (namespace, pod) forge_conduct_writes_total
              unless on (namespace, pod) forge_conduct_tier_info
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor {{ $labels.namespace }}/{{ $labels.pod }} publishes no forge_conduct_tier_info — its tier is unknown"
            description: >-
              The conductor is Ready and scraped (forge_conduct_writes_total is present) but publishes
              no forge_conduct_tier_info, so nothing here can say which tier it runs at, and
              ForgeConductUnexpectedWrites — which reads the tier before it will fire — is silent for
              this pod whatever it writes. The usual cause is an image from before the gauge (the
              agentforge conduct-tier-info change); check the pinned conductor digest, and until the
              pod publishes its tier, read the Deployment's AF_CONDUCT_TIER by hand.
        # THE OTHER HALF OF A FIX THAT WOULD OTHERWISE BE HALF-DONE (agentforge #365). The engine
        # counts per-sensor incompleteness under a CLOSED label vocabulary — an undeclared child
        # appears mid-flight and is invisible to the pre-touch, which is how a closed vocabulary
        # stops being one. Until #365 an undeclared sensor's count was DISCARDED, so a sensor
        # nobody had declared reported nothing at all and the gap was unreadable from outside.
        # #365 routes those counts to one reserved value instead; this is the rule that makes the
        # reserved value mean something. A bucket nothing alerts on is the same defect one layer
        # down — see this file's ForgeConductDown note on instruments that read healthy because
        # nothing watches them.
        #
        # WHAT A FIRING HERE MEANS, precisely: the conductor observed a sensor coming back short,
        # and CONDUCT_SENSORS does not declare that sensor, so its count cannot be attributed. T0's
        # exit criterion asks for `forge_conduct_sensor_incomplete_total` to be EXPLAINED PER
        # SENSOR, and an unattributable count is exactly what cannot be explained. The engine also
        # pins this shut in CI (a test derives conduct_pass's sensor keys from its AST and fails if
        # the vocabulary omits one), so reaching this rule means the pin was bypassed — a sensor key
        # computed rather than written as a literal is the case it cannot see.
        #
        # `> 0` on an increase() over 30m, not on the raw counter: the counter is pre-touched to 0
        # at construction, so `forge_conduct_sensor_incomplete_total > 0` would be satisfied forever
        # by a single historical occurrence. The window asks "is this happening now".
        - alert: ForgeConductSensorUnrecognised
          expr: |-
            sum(increase(forge_conduct_sensor_incomplete_total{sensor="unrecognised"}[30m])) > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor counted an incomplete read it cannot attribute to a sensor"
            description: >-
              forge_conduct_sensor_incomplete_total advanced on the reserved `unrecognised` label,
              which means a pass came back short on a sensor that CONDUCT_SENSORS
              (agentforge infra/conduct_metrics.py) does not declare. The count is real; the
              attribution is missing, so T0's "sensor_incomplete explained per sensor" cannot be
              satisfied while this fires. Fix in the ENGINE, not here - add the sensor to
              CONDUCT_SENSORS and add its own case to this file in the same change, so a declared
              sensor never lacks a rule and a rule never lacks a declared sensor. The engine's own
              AST pin should have caught this before it shipped, so also check why it did not: it
              reads sensor keys written as string literals in conduct_pass and cannot see one that
              is computed.
        # A DETECTOR ROW THAT CANNOT SEE, made visible (agentforge #393). A row that answers Unknown
        # files nothing and lets the filer resolve nothing, and from the estate that is the same
        # picture as a row watching a quiet estate: three rows sat Unknown on every one of the
        # conductor's first fifty-four passes (a two-document manifest, a second trigger type, a
        # rules file of another shape — agentforge #388) and nothing said so, because nothing
        # exported WHY a row did not answer. `forge_conduct_detector_unknown_total{detector, reason}`
        # counts every Unknown answer per pass; this reads it.
        #
        # PASSES, NOT ANSWERS. The counter advances once per Unknown ANSWER, and a row has one
        # answer per scope: a pass on which a row with six scopes could not read adds six, the same
        # six that a row with one scope adds over six passes — so a count of answers cannot tell a
        # one-pass blip on a wide row from an hour of blindness on a narrow one (reviewer-codex on
        # #723). changes() counts the SAMPLES at which a series moved, and a pass writes all of its
        # answers in one record_pass call, inside one 30s scrape, so a series moves once per pass
        # whatever the row's width; resets() takes back the one move that is a container restart.
        # That is the number of passes in the hour on which the row answered Unknown with that
        # reason. max by (detector) over its reasons: a row blind for one reason all hour is what a
        # row that cannot see looks like (every one of #388's three was), and one alert per row is
        # the unit an operator acts on. Two reasons taking turns on one row each read half and
        # stay under — the quiet direction, and the description points at the per-reason series.
        #
        # `>= 6` OVER [1h]: twelve passes an hour at the 300s cadence, so six is a row blind on
        # half of them; a one- or two-pass transient reads one or two. Far from both, and changes()
        # is an integer, so nothing here rides on a window edge (the coin toss
        # ForgeConductPassesFailing's `> 2` was, above).
        #
        # THE TWO PAIRS SUBTRACTED ARE DESIGNED, NOT TOLERATED, and each is subtracted as a
        # (detector, reason) PAIR rather than by reason alone, so the same word on another row is
        # still an alert. Both are what the first complete pass answered (2026-09-14 17:19Z) and
        # both are Unknown by the estate's construction, not the conductor's:
        #   WEBHOOK-WIRING-UNRENDERED / webhook_env_from_unresolved — the live CP-rendered pool wires
        #     its env through envFrom (a ConfigMap with no AF_WEBHOOK_* and an ESO-materialised Secret
        #     no repository read can see), so the Deployment alone cannot answer; the plan's
        #     RAISED-NOT-TAKEN paragraph records why no path grant changes that.
        #   BROKER-SEAT-UNAVAILABLE / no_snapshot_for_aud — the anthropic brokers export no usage
        #     snapshot series for their aud, so the row has nothing to read for those seats.
        # Adding a pair here is a claim that the row CANNOT answer by design, and it needs the
        # paragraph that says why; a row that merely does not answer today is this alert's business.
        # The pairs are spelled as a vector of label_replace()d constants, the one PromQL way to name
        # a (detector, reason) pair without a series to match against; `unless on (detector, reason)`
        # removes exactly those and nothing else.
        - alert: ForgeConductDetectorBlind
          expr: |-
            max by (detector) (
              (
                changes(forge_conduct_detector_unknown_total[1h])
                  - resets(forge_conduct_detector_unknown_total[1h])
              )
                unless on (detector, reason) (
                  label_replace(label_replace(vector(1), "detector", "WEBHOOK-WIRING-UNRENDERED", "", ""), "reason", "webhook_env_from_unresolved", "", "")
                  or label_replace(label_replace(vector(1), "detector", "BROKER-SEAT-UNAVAILABLE", "", ""), "reason", "no_snapshot_for_aud", "", "")
                )
            ) >= 6
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor row {{ $labels.detector }} answered Unknown on {{ $value | printf \"%.0f\" }} passes in the last hour"
            description: >-
              The detector row {{ $labels.detector }} could not read what it needed, for one and the
              same reason, on at least six passes of the last hour, so it filed nothing and resolved
              nothing for that scope — and from the estate that looks exactly like a row watching a
              quiet estate. forge_conduct_detector_unknown_total{detector="{{ $labels.detector }}"}
              carries the reason per series (a manifest of another shape, a path that is not there,
              a query the store refused, a budget ceiling); the conductor's own pass line in its log
              names the same reasons beside what it did find. Two (detector, reason) pairs are
              subtracted from this rule because they are Unknown by the estate's design; they are
              listed in the rule's comment with why, and a row that joins them needs the same
              paragraph.
        # THE GAP BETWEEN "ARMED" AND "RUNNING", watched permanently rather than once. The conductor's
        # forge PAT reaches its pod through an ExternalSecret (agentforge-conductor-forge, reading
        # operator/conductor/forge from the af KV mount), and that secret is REQUIRED — the pod does not
        # start without it. An ES stuck NotReady therefore leaves the pod at ContainerCreating, which
        # none of the liveness rules above can see: the container never becomes Ready, so
        # ForgeConductDown's anti-join has an empty left side, and no registry is ever served, so
        # ForgeConductNeverObserved has no gauge to join the pod's age against and ForgeConductBlind's
        # stamp precondition never holds. From the estate that state is indistinguishable from a rung
        # nobody merged, and a kubectl check after arming is that gap watched once, not watched.
        #
        # Shape, verified against the live store rather than written from memory: ESO exports BOTH
        # status="True" and status="False" series for every condition, as 1/0 — so NotReady is
        # `condition="Ready", status="False"` EQUAL TO 1, not the absence of the True series. And the
        # ES's own namespace lives in `exported_namespace` (plain `namespace` is ESO's), which is the
        # kind of label mistake that yields an empty vector that never fires.
        #
        # `for: 15m` is one ES refreshInterval plus slack: the SecretStore's role can take a provision
        # tick to exist, and a NotReady that clears on the next refresh is not an operator's problem.
        - alert: ForgeConductSecretNotReady
          expr: |-
            externalsecret_status_condition{
              exported_namespace="agentforge", name="agentforge-conductor-forge",
              condition="Ready", status="False"
            } == 1
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor's forge secret is NotReady — the pod cannot start"
            description: >-
              ExternalSecret agentforge-conductor-forge has reported Ready=False for 15m. The conductor
              Deployment requires this secret, so its pod sits at ContainerCreating — a state no other
              conductor rule can see, because the container never becomes Ready and no pass ever
              runs. Check `kubectl -n agentforge describe externalsecret agentforge-conductor-forge`:
              the usual causes are the af/data/operator/conductor/forge path not yet written by the
              openbao-provision Job (the seed is create-if-absent; the Job runs daily), or the
              SecretStore's AppRole role not yet minted.
        # ── T1: THE PARK LANE'S RULES ─────────────────────────────────────────────────────────────
        # From here the conductor WRITES. At AF_CONDUCT_TIER=advise the park lane posts one diagnosis
        # comment per park and the filer opens findings, and the T1 series read what the door let
        # through, what it refused and what the lanes withheld. The header's rules still hold — every
        # counter keeps `_total`, every window is sized off the pass cadence, every threshold is on
        # an increase() or a changes() over a window and never on a raw counter — with two things
        # new. One of these counters is NOT PRE-TOUCHED (forge_conduct_refusals_total by reason): a
        # child has no series until its first event, and increase() reads a series from its first
        # sample, so a child's first event is below any increase()'s notice until the counter moves
        # again; the rule that reads it says what that costs. forge_conduct_diagnoses_total by
        # (detector, op) was that shape too, until agentforge 5d (feat/conduct-diagnoses-pretouch)
        # touched every pair over the commentable rows and the two ops at 0 from construction — the
        # reserved pair excepted — because a pair with no series until its first comment made an
        # in-place restart invisible to increase() and ForgeConductWakesUnanswered a page on every
        # restart (#748); that rule REQUIRES the 5d image and says so. And forge_conduct_parks is a
        # GAUGE, rebuilt in place every pass, whole over the bound repos, and EMPTY when a pass could
        # not report its parks — absence on it is "not known", never 0. Every series below is exported by
        # agentforge's T1 instruments, unmerged as this is written and absent from the live pin
        # (ForgeConductTierUnknown's MERGE ORDER note): until the repin every rule here is an empty
        # vector, quiet and inert, and the section is read against that ordering.
        #
        # AND THE ROUTING FACT THAT SHAPES THE STANDING-STATE RULES: Alertmanager here routes EVERY
        # alert to ntfy — no severity route, only Watchdog dropped, repeat_interval 4h
        # (kube-prometheus-stack.yaml) — so `severity: info` de-pages nothing, and a rule that is up
        # for as long as a state holds is a phone push every four hours until the topic is muted,
        # which loses every ailab alert (agentforge-rules.yaml measured this on ForgeNeedsHuman and
        # rejected that shape; program-plan invariant 9). Two of the states below are a human's to
        # end and hold for weeks on this estate; they are announced for a day and then left on the
        # issue. The retirement instrument, which is true until a change lands, is a record and not
        # an alert at all. The Alertmanager route that would make a standing info alert safe is a
        # piece of work of its own and is deliberately not smuggled into a rule-file PR.
        #
        # A WAKE WITH NO DIAGNOSIS BEHIND IT (program row 6c's prerequisite). A lifecycle comment on a
        # bound repo wakes that repo's pool, and the door counts it under
        # forge_conduct_wake_writes_total{repo} on the ATTEMPT — before the POST, so that a request
        # that left and timed out is still a wake the pool may have taken.
        # forge_conduct_diagnoses_total{detector, op} is the other end of the same write: a comment
        # the lane saw APPLIED, by row and op. On a healthy conductor the two move together, in one
        # record_pass call; a wake with no diagnosis behind it is a comment the door sent that never
        # came back applied — the forge failing after the request left, a pool woken for a comment
        # nobody can read.
        #
        # THE HONEST COMPARISON IS FLEET-WIDE, and the reason is the labels: the wakes carry `repo`,
        # the diagnoses carry `detector, op`, a row is not a repo, and no series carries both — so
        # "wakes on repo R against diagnoses on repo R" is a join PromQL cannot write. Summed over
        # everything, the two are the same writes read at the two ends of the door, and the
        # difference is what fell between. The alert therefore names no repo and no lane; the pass
        # line in the conductor's log carries each lane's `failed=` count (`comments=` for the park
        # lane, `chains=` for the chain lane), and the description says so.
        #
        # THIS RULE REQUIRES THE PRE-TOUCHED ENGINE — agentforge 5d, feat/conduct-diagnoses-pretouch
        # — and the condition for removing #748's `no-automerge` label is 5d PINNED, not merely the
        # T1 series scraped. 5d touches every (detector, op) pair over the rows a comment can name
        # (the sixteen PARK-* rows and DAG-DEADLOCKED, crossed with finding and observation) at 0 at
        # construction, so a pair is on the wire from a container's first scrape and an in-place
        # restart reads 3, then 0, then 3 — a drop increase() takes for a reset and puts back. On
        # the engine before 5d a pair had no series until its first comment and was RE-MINTED after
        # a restart at the first commenting pass's own count: 3, then nothing, then 3 — no drop, so
        # no reset, the pair read as no change while the wakes beside it (pre-touched per pass, so
        # their 9 then 3 IS a reset) read whole, and this rule paged on an ordinary restart with
        # every comment applied (#748, both reviewers, high; this text recorded it as a residue and
        # measured it: W 9 then 3, one pair 3 then 3, fires at 145m). Nothing on the rule's side can
        # put back a sample that was never there; only the engine can make the sample exist. The
        # fixture "the reviewers' restart under the pre-touched engine" is the 5d shape, quiet at
        # every minute of the restart's passage through the window (swept 121m to 350m); the pre-5d
        # shape of the same input — the pair absent for the five minutes between the restart and
        # the first pass, then 3 — fires at 145m and 200m and is NOT a fixture: a case asserting a
        # false page green would document the defect as the contract. Enabled on an image without
        # 5d, this rule is that page, every four hours, on every restart.
        #
        # THE SECOND TERM ON EACH SIDE puts back the first sample of a series MINTED inside the
        # window — `min_over_time(x[2h])`, its first sample on a counter minted at its count — and
        # nothing for a series that existed before the window, which increase() reads whole, a
        # mid-window restart included, by its reset arithmetic. The term stays with 5d, and for the
        # WAKES it is load-bearing: that counter is pre-touched per PASS over the bound repos, in the
        # same record_pass call as its increment, so a new pod's first pass that attempts a wake
        # mints the series at its count, not at 0 (the rollout fixtures), and increase(), which
        # reads a series from its first sample, sees none of it. On the DIAGNOSES side the term is
        # reached by the reserved pair alone — (unrecognised, unrecognised), a row or an op outside
        # the engine's vocabularies, which 5d does not pre-touch and the engine's mirror pins refuse
        # first: every commentable pair exists at 0 before any comment, `min_over_time` of it is 0,
        # and the term adds nothing. The fixtures whose pairs are absent until their first comment
        # drive the pre-5d shape the term was written on; the two restart cases and three of the
        # others were re-run on the 5d shape out of tree and read the same. `or vector(0)` on each
        # of the four, because an aggregation over nothing is EMPTY, not 0, and an empty operand
        # empties the subtraction and the alert with it — on a conductor that has never applied a
        # comment, which is the estate this rule is for.
        #
        # "MINTED INSIDE THE WINDOW" IS THREE CLAUSES, NOT ONE, because "no sample at the window's
        # edge" (`unless x offset 2h`) is also what a SCRAPE GAP looks like. A Prometheus restart,
        # upgrade or node drain longer than the 5m lookback leaves every series without a sample at
        # the gap, and two hours later the gap is this window's edge: the one-clause test then reads
        # every live old series as minted and adds its LIFETIME count on each side, so the pod's
        # lifetime W-D — three lifecycle comments ever lost to forge timeouts over weeks, the one
        # thing that moves W without D, since the COMMENT arm after the wake count in
        # conductor/mutate.py returns no Refusal — is re-read as lost now, for (gap - 5m) minutes,
        # long after ForgeConductDown explained the gap. Measured on the one-clause form: a 15m gap
        # fired this alert for ten minutes two hours later on a conductor that lost nothing in the
        # window. So a series absent at the edge is minted UNLESS it existed in the two hours before
        # the window (`last_over_time(x[2h] offset 2h)`) AND its pod was not scraped at the edge
        # (`unless on (namespace, pod) forge_conduct_writes_total offset 2h` — the unlabelled marker
        # every scraped conductor exports): existed-before-and-pod-unscraped is a gap, and increase()
        # reads the series as the continuation it is. The pod clause is not decoration. "Existed
        # before the window" alone would also cover a pair RE-MINTED after an in-place restart when
        # the restart sits before the edge and the re-mint after it — the pair's old samples in the
        # two hours before the window, its new ones inside it, and increase() reading the re-mint
        # from its first sample, short by the whole of it; measured: a pair at 5, a restart, the pair
        # re-minted at 3, read as three lost for the twenty minutes the restart and the re-mint
        # straddled the edge. With the pod's own marker in the clause that pod WAS scraped at the
        # edge, the pair is minted, and its 3 is put back. A pair minted for the first time inside
        # the window is minted under every clause, gap or no gap: it has no samples before it. That
        # re-mint is the pre-5d shape of a diagnoses pair; on 5d the same restart reads 5, then 0,
        # then 3, a reset either way, and the clause is the wakes' — a first pass after the restart
        # that attempts none re-mints the wakes at 0, and one that attempts three at 3.
        #
        # THE GATE, LAST: `unless on () absent_over_time(forge_conduct_writes_total[2h] offset 2h)`.
        # When the store holds no conductor sample at all from the two hours before the window — a
        # Prometheus that began scraping the conductor under two hours ago, a PodMonitor freshly
        # adopted, an outage longer than the window — every series is minted by any test the samples
        # can express, and the lifetime counts come back on both sides for those two hours; measured:
        # an old conductor at W=10, D=7 scraped from empty history fired this alert for its first two
        # hours. So the rule reads nothing until the store has two hours behind the window: the quiet
        # direction, for the first two hours of a Prometheus' conductor history, while every other
        # rule here is finding its feet too. The gate is about the STORE, not the counters, and
        # stays with 5d; so do the three clauses, which are the wakes' (above). What 5d retires is
        # the diagnoses side's need for any of it, and the false page the REQUIRES paragraph names —
        # over the commentable rows, not all of CONDUCT_DETECTORS: an ESTATE or DEPLOY row is filed,
        # never commented, and a pair for it would be 0 forever.
        #
        # `>= 3` OVER [2h]. The two sides extrapolate separately (ForgeConductPassesFailing's note),
        # so equal counts read a few hundredths apart and `> 0` would take that for a lost comment;
        # and one lost comment is a timeout — the pool woken once for a comment it may not be able to
        # read, which the next pass's fold settles either way (the comment is on the issue, or it is
        # proposed again). Three is one pass's whole allowance (LIFECYCLE_WRITES_PER_PASS) lost, or
        # one comment lost on each of three passes: a forge dropping the conductor's comments, not a
        # single timeout. [2h] is twenty-four passes at the 300s cadence and six at the backed-off
        # 1200s, so a run at either lands three inside it. The input the arithmetic misread — an
        # in-place restart inside the window after which a pair was re-minted at a count no lower
        # than it had before, the pair read short by its OLD count while W read whole, the bar met
        # once such pairs' old counts summed to three — is the pre-5d engine's, and does not exist on
        # 5d (the REQUIRES paragraph). `for: 5m` for a pass that lands on a window edge.
        - alert: ForgeConductWakesUnanswered
          expr: |-
            (
              (
                (sum(increase(forge_conduct_wake_writes_total[2h])) or vector(0))
                  + (
                    sum(
                      min_over_time(forge_conduct_wake_writes_total[2h])
                        unless forge_conduct_wake_writes_total offset 2h
                        unless (
                          last_over_time(forge_conduct_wake_writes_total[2h] offset 2h)
                            unless on (namespace, pod) forge_conduct_writes_total offset 2h
                        )
                    ) or vector(0)
                  )
              ) - (
                (sum(increase(forge_conduct_diagnoses_total[2h])) or vector(0))
                  + (
                    sum(
                      min_over_time(forge_conduct_diagnoses_total[2h])
                        unless forge_conduct_diagnoses_total offset 2h
                        unless (
                          last_over_time(forge_conduct_diagnoses_total[2h] offset 2h)
                            unless on (namespace, pod) forge_conduct_writes_total offset 2h
                        )
                    ) or vector(0)
                  )
              ) >= 3
            )
              unless on () absent_over_time(forge_conduct_writes_total[2h] offset 2h)
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor woke bound pools with {{ $value | printf \"%.0f\" }} lifecycle comments in 2h that never came back applied"
            description: >-
              forge_conduct_wake_writes_total (lifecycle comments ATTEMPTED on bound repos, counted
              before the POST) advanced in the last 2h by at least three more than
              forge_conduct_diagnoses_total (comments the lanes saw APPLIED): the door sent comments
              that never came back as applied, so a bound pool may have been woken by a comment
              nobody can read. The two series share no label — wakes carry repo, diagnoses carry
              detector and op — so this is the fleet-wide difference and names no repo; the
              conductor's pass line carries each lane's failed= count beside its comments= and
              chains=. Check the forge's health from the conductor's side (timeouts and 5xx on
              POST) before anything else.
        # AN ISSUE NO OWN COMMENT CAN EVER SETTLE (conductor/filing.py, plan item 15). The filer's
        # lifetime ceiling is three own comments per issue — the finding, at most one observation,
        # and the resolution — and a fingerprint that RECURS after its resolution, with no room left
        # for a recurrence finding and the resolution after it, posts nothing and files no successor
        # while the issue is open; so does a resolution the ceiling itself left no room for. The
        # filer counts it under forge_conduct_park_quiet_total{reason="exhausted"} on EVERY pass the
        # state holds and names the fingerprint on its pass line, and nothing but the operator
        # closing the issue ends it: only then, with no open issue for the fingerprint, does the next
        # recurrence file anew. This is the T1 comments-per-issue criterion's second reason, made
        # visible from the estate.
        #
        # THE STATE'S FIRST DAY, NOT THE STATE. The counter is pre-touched at 0 for every declared
        # reason, so the first exhausted pass is visible to increase(), and `> 0` over [24h] is up
        # from that pass. But the counter moves on EVERY pass the state holds and the state holds
        # until a human closes the issue, so `> 0` alone would be up for the state's whole life plus
        # a day — on this estate's routing (the section header) a phone push every four hours until
        # the topic is muted, and `severity: info` de-pages none of it; measured: a state held for
        # ten days kept the one-clause form up for all ten. The second clause is the estate's form
        # (b), the NEW state rather than its persistence: `unless` the counter also moved in the day
        # BEFORE the window. The alert is then up for the state's first day — a window long enough
        # to survive an afternoon of passes coming back short (the counter only moves on passes
        # that return) without clearing and re-raising mid-state — and clears on its own whether or
        # not the state has ended; the standing to-do lives on the issue and the pass line, which
        # the description points at. sum() on both clauses for ForgeConductConfigRejected's reason,
        # and fleet-wide on purpose: a rollout mid-state hands the old pod's day to the new pod's,
        # so a standing state is announced once, not once per pod. The quiet direction: a state that
        # ends and recurs within a day of its last pass is folded into the first announcement (the
        # day before the window still moved); one that recurs later is announced afresh. No hold: a
        # pre-touched counter's step is a discrete event, and the clear is the window's.
        - alert: ForgeConductIssueExhausted
          expr: |-
            sum(increase(forge_conduct_park_quiet_total{reason="exhausted"}[24h])) > 0
              unless sum(increase(forge_conduct_park_quiet_total{reason="exhausted"}[24h] offset 24h)) > 0
          labels: { severity: info }
          annotations:
            summary: "AgentForge conductor has a filed issue it can never settle — close it by hand"
            description: >-
              forge_conduct_park_quiet_total{reason="exhausted"} advanced in the last 24h and not in
              the day before: a filed issue's fingerprint recurred after its resolution with no room
              under the lifetime ceiling (three own comments) for a recurrence finding and a
              resolution after it — or a resolution itself had no room — so the filer posts nothing
              on it and files no successor while it stays open. The conductor's pass line names the
              fingerprint (`exhausted=`). Close the issue: the next pass on which the finding recurs
              files a fresh one. This is the state's first day only — it clears a day after the
              state began whether or not the issue is closed, and the pass line carries the to-do
              until it is.
        # THE LIFETIME CEILING, HOLDING. Three own comments on an issue is all the conductor may ever
        # post on it — the park lane's ceiling (diagnose.decide, LIFECYCLE_COMMENTS) and the filer's
        # (max_comments_per_issue) alike — and a park whose issue already wears three is one the
        # conductor has said everything it can about: the lane folds it every pass, answers
        # `ceiling` and proposes nothing; the filer skips the observation it would have posted and
        # retains the entry. Counted under forge_conduct_park_quiet_total{reason="ceiling"} on every
        # pass it holds. From the estate that park looks like one the conductor is watching; it is
        # one the conductor has finished with, and a human's to act on.
        #
        # The same shape as ForgeConductIssueExhausted, for the same reasons: a standing state,
        # counted per pass on a pre-touched counter, a human's to end — announced for its first day
        # and then left on the issue, because on this estate's routing a standing alert is the muted
        # topic. Here that is not a corner: the playground's parked backlog is permanent
        # (agentforge-rules.yaml, backlog 9 and never drained) and a park that stands for weeks
        # reaches three conductor comments, so at T1 steady state a rule up for as long as the
        # ceiling holds would simply be up. The two are not one rule because they ask for different
        # things — an exhausted issue must be CLOSED for the filer to work again; a ceiling'd park
        # needs a human to act on the park itself.
        - alert: ForgeConductCeilingHolding
          expr: |-
            sum(increase(forge_conduct_park_quiet_total{reason="ceiling"}[24h])) > 0
              unless sum(increase(forge_conduct_park_quiet_total{reason="ceiling"}[24h] offset 24h)) > 0
          labels: { severity: info }
          annotations:
            summary: "AgentForge conductor has said all it may on at least one issue (lifetime ceiling) — it is a human's from here"
            description: >-
              forge_conduct_park_quiet_total{reason="ceiling"} advanced in the last 24h and not in
              the day before: on at least one issue the conductor's own comments have reached the
              lifetime ceiling (three), so the park lane proposes nothing more on that park and the
              filer skips the observation it would have posted. The conductor is finished with that
              issue — it will not be diagnosed again — and closing or moving it is a human's call.
              The conductor's pass line names what each lane withheld and why; the issue is the one
              wearing three conductor comments. This is the state's first day only — it clears a
              day after the ceiling was first counted, and the pass line carries the state until a
              human acts.
        # THE RESERVED QUIET REASON, read for ForgeConductSensorUnrecognised's reason. The lanes and
        # the filer withhold comments under a closed vocabulary (CONDUCT_QUIET_REASONS: ceiling,
        # unchanged, interval, held, classless, exhausted), pinned in the engine against every
        # Quiet(...) and quiet[...] the conductor spells; a reason outside it is counted under
        # `unrecognised` rather than dropped, and a bucket nothing alerts on is the same hole one
        # layer down. The counter is pre-touched at 0 for every declared reason and the reserved one,
        # so the first occurrence is visible to increase(). Same window, threshold and hold as the
        # sensor rule, for its reasons.
        - alert: ForgeConductQuietReasonUnrecognised
          expr: |-
            sum(increase(forge_conduct_park_quiet_total{reason="unrecognised"}[30m])) > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor withheld a comment for a reason it cannot name"
            description: >-
              forge_conduct_park_quiet_total advanced on the reserved `unrecognised` label: a lane
              or the filer withheld a lifecycle comment for a reason outside CONDUCT_QUIET_REASONS
              (agentforge infra/conduct_metrics.py). The count is real and the attribution is
              missing, so the T1 comments-per-issue criterion — which reads reason=ceiling and
              reason=exhausted — cannot be trusted while this fires. Fix in the ENGINE: add the
              reason to the vocabulary, and a rule here if it needs one, in the same change; then
              check why the engine's own pin over every Quiet(...) the conductor spells did not
              catch it first.
        # THE RESERVED REFUSAL REASON. A refusal's reason is the door's own word for it, held to
        # CONDUCT_REASON_SHAPE at the publisher: one that is not a word (whitespace, a slash, a quote,
        # free text) is counted under `unrecognised` rather than minted as a series. Every refusal
        # reason is a literal in conductor.mutate and word-shaped by construction, so reaching this
        # rule means a refusal was built from something read off the estate — the exact leak the
        # shape exists to stop.
        #
        # NOT PRE-TOUCHED, and what that costs: a refusal reason has no series until its first
        # refusal, so the reserved child's first refusal mints the series and is below increase()'s
        # notice — this fires on the SECOND. A refusal the door decides recurs on every pass the
        # proposal does, so a real one is seen on the next pass; one that happened once, ever, is
        # the series itself to show (a forge_conduct_refusals_total{reason="unrecognised"} that
        # exists at all is the fact). Otherwise the sensor rule's shape.
        - alert: ForgeConductRefusalUnrecognised
          expr: |-
            sum(increase(forge_conduct_refusals_total{reason="unrecognised"}[30m])) > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor's write door refused for a reason it cannot name"
            description: >-
              forge_conduct_refusals_total advanced on the reserved `unrecognised` label: the door
              refused a write for a reason outside the word shape CONDUCT_REASON_SHAPE (agentforge
              infra/conduct_metrics.py). Every refusal reason is a literal in conductor.mutate, so
              one that is not a word was built from something read off the estate. The count is
              real and the reason is missing from the series; the conductor's pass line carries the
              refusals by reason as the door spelled them. Fix in the ENGINE.
        # THE SWEEP, STARVED. The door budgets every pass — max_writes_per_pass mutations and
        # max_new_issues_per_pass filings (conductor.mutate) — and a proposal past either is refused
        # under reason=budget, counted, and carried to the next pass by the lane or the filer that
        # made it. One such pass is a burst: more to say than a pass may, the rest said next pass.
        # Pass after pass it is starvation — the proposals never drain, the newest finding waits
        # behind the oldest — and nothing else in the estate distinguishes that from a quiet sweep:
        # findings still get filed, the stamp still advances.
        #
        # PASSES, NOT REFUSALS (ForgeConductDetectorBlind's arithmetic). A starved pass refuses every
        # proposal past the budget, so a count of refusals cannot tell one wide pass from three
        # narrow ones, and it is the run of passes that means starvation. The door's delta reaches
        # the counter in one record_pass call, so a series moves at most once per pass, and
        # changes() less resets() over [1h] is the number of passes in the hour on which the door
        # refused on budget — an integer, no window-edge coin toss. `>= 3` is three of the hour's
        # twelve. sum() because the counter has one series per pod.
        #
        # NOT PRE-TOUCHED, and what that costs: the child is minted by the first budget refusal in
        # the container's life, and that sample is no change, so on a fresh series the bar is met on
        # the fourth starved pass of the hour and on the third ever after — the quiet direction, by
        # one pass, once per CONTAINER life rather than per pod. An in-place restart re-mints the
        # child at its first starved pass's count: below the old value that is one change less one
        # reset, uncounted again (the restart fixture); at or above it the change stands and the
        # pass is counted (verified: 4, 7, a restart, 9 reads two passes at 35m).
        - alert: ForgeConductFilingOverBudget
          expr: |-
            sum(
              changes(forge_conduct_refusals_total{reason="budget"}[1h])
                - resets(forge_conduct_refusals_total{reason="budget"}[1h])
            ) >= 3
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor's write door refused on budget on {{ $value | printf \"%.0f\" }} passes in the last hour — the sweep is starved"
            description: >-
              forge_conduct_refusals_total{reason="budget"} moved on at least three passes of the
              last hour: pass after pass the lanes and the filer propose more than the door's
              per-pass budget (max_writes_per_pass mutations, max_new_issues_per_pass filings)
              admits, so the rest is carried to the next pass and never drains. Read the
              conductor's pass line for what is being proposed — a storm of findings on one
              detector, or a backlog of parks to diagnose — before raising the budget; a budget
              raised for a storm is the storm let through.
        # THE RETIREMENT INSTRUMENT (plan item 26) — A RECORDED WEEK, NOT AN ALERT. Every park cites
        # an escalation, and its origin is one of two: `engine`, the af:esc record the current engine
        # writes, or `legacy`, the pre-marker template a legacy reader (conductor/recovery.py,
        # LEGACY_ORIGIN) still knows how to read — kept so the estate's old parks are classified, and
        # to be REMOVED once no park needs it. There are two legacy arms and they retire together, the
        # reader's docstring says so: the conductor's pre-marker reader and the engine's back-compat
        # in markers.carries_escalation, whose backstop would otherwise synthesize a record above
        # every legacy park. forge_conduct_parks{repo, prognosis, origin} is the last returned pass's
        # classification, rebuilt in place every pass with EVERY cell over the bound repos present (a
        # cell reads 0, never absent, when a pass reported) and EMPTY when a pass could not report its
        # parks — so a legacy sum of 0 is a pass that classified the estate and found no legacy park,
        # and an empty sum is a pass that does not know.
        #
        # NOT AN ALERT, on the routing fact in the section header. The retirement reading is "zero
        # for a week, and then zero until the retirement change lands" — a permanently-firing rule
        # by construction, which on this estate is a phone push every four hours until the topic is
        # muted; `severity: info` would not de-page it, and the route that would is not this file's
        # to smuggle in. The plan asks only that retirement be OBSERVABLE through the gauge's origin
        # label (park-lane-advise plan, item 26), and a recorded series is observable: a Grafana stat,
        # or the one-line query below at the moment of opening the change.
        #
        # THREE RECORDS. The two sums are the gauge, bridged: `last_over_time(...[30m])` is each cell's
        # last sample within half an hour, which carries a reading across a Recreate rollout (the
        # minutes between the old pod's last scrape and the new pod's first pass), a pass that could
        # not report its parks (one cadence) and a short unreadable stretch, and stops carrying it
        # after thirty minutes, since six cadences of not knowing is not knowing. `max by (repo,
        # prognosis, origin)` before the sum, not a bare sum across pods: the bridge holds the old
        # pod's cells beside the new pod's for up to half an hour after a rollout, and a bare sum
        # would read the estate's parks twice for that half hour. The old pod's stale cell wins only
        # upward — a legacy=1 it last saw keeps the count at 1 until it ages out — which is the
        # conservative direction for a retirement reading. The third record is THE WEEK: the time at
        # which the current run of readings that were KNOWN (both sums present), had PARKS (an estate
        # with none says nothing about the reader) and found NO LEGACY park began. It carries its
        # previous value while the run holds and resets to now the moment it does not — a legacy park
        # read, a gauge unknown for longer than the bridge (the sum is absent, so the conjunct fails),
        # an estate with no parks — so `time() - it` is the run's length, and a run is exactly what
        # "zero, continuously" means. A rule reading its own series reads the previous evaluation's
        # sample, which is what a running start needs; `last_over_time(self[30m])` on the carry so a
        # Prometheus outage shorter than the bridge does not restart the week (the `for: 7d` alert
        # this replaced would have restarted it, silently, on any Prometheus outage over
        # --rules.alert.for-outage-tolerance's 1h). The value is a Unix timestamp, so on the fixture's
        # clock it reads as minutes from 0, and one evaluation interval late: the run starts at the
        # eval after the last reading that broke it.
        #
        # THE RETIREMENT READING:
        #   time() - agentforge:conduct_parks_legacy_zero_since:timestamp_seconds >= 7 * 24 * 3600
        # is the week of zero, up (`/ 86400` for the days so far, on a stat panel). Open the change
        # that removes both legacy arms — the conductor's pre-marker reader (recovery.LEGACY_ORIGIN
        # and the arm that assigns it) and the engine's back-compat in markers.carries_escalation,
        # which retire together — and with them the origin=legacy cell of the gauge, these three
        # records and their fixtures. A legacy park read before that lands resets the week from its
        # last reading; which repo and prognosis carried it is on the raw gauge.
        - record: agentforge:conduct_parks_legacy:sum
          expr: |-
            sum(max by (repo, prognosis, origin) (last_over_time(forge_conduct_parks{origin="legacy"}[30m])))
        - record: agentforge:conduct_parks:sum
          expr: |-
            sum(max by (repo, prognosis, origin) (last_over_time(forge_conduct_parks[30m])))
        - record: agentforge:conduct_parks_legacy_zero_since:timestamp_seconds
          expr: |-
            (
              last_over_time(agentforge:conduct_parks_legacy_zero_since:timestamp_seconds[30m])
                and (agentforge:conduct_parks_legacy:sum == 0)
                and (agentforge:conduct_parks:sum > 0)
            )
              or vector(time())
