# Alerts over the conductor (`agentforge conduct`, conductor program row 7). The conductor is a
# fleet-wide OBSERVER: at T0 it reads the estate, classifies parked issues and writes nothing. Its
# whole value is that it notices things, so the failure that matters most is the one where it stops
# noticing and nothing says so.
#
# THE SERIES NAMES HERE KEEP `_total`, AND THAT IS NOT COSMETIC. A counter's SAMPLE name — what PromQL
# matches — is `forge_conduct_passes_total`; `registry.collect()` reports the FAMILY name with the
# suffix stripped. A rule written against the stripped spelling parses, type-checks, evaluates to an
# empty vector forever, and never fires. `promtool check rules` cannot catch it because an expression
# over a non-existent series is not an error.
#
# EVERY WINDOW IS SIZED OFF THE 300-SECOND PASS CADENCE (AF_CONDUCT_INTERVAL_S), never off a scrape
# interval. A `[5m]` window can legitimately contain ZERO increments on a perfectly healthy conductor,
# so any `increase(...) == 0` over a short window is a false positive by construction. The scrape is
# 30s (conductor-podmonitor.yaml) purely so a per-pass counter is never read as flat.
#
# AN UNLABELLED GAUGE IS 0 FROM CONSTRUCTION, AND 0 IS NOT A TIMESTAMP. prometheus_client exports
# `forge_conduct_last_pass_timestamp` at 0.0 the instant the registry is built, and it stays there
# until the first pass that observes the estate. Read as a stamp, that 0 is the Unix epoch: `time() - 0`
# is ~1.77e9 seconds, which satisfies any age threshold from the first scrape of a freshly booted
# conductor and renders as a 56-year outage. Every rule here that subtracts the gauge from `time()`
# carries `> 0` on the gauge as its precondition, and the never-stamped state has a rule of its own.
#
# `release: kube-prometheus-stack` so the operator's ruleSelector picks it up. Without it this file
# applies cleanly and is never loaded — no rule, no error, no event.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agentforge-conductor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: agentforge-conductor
    app.kubernetes.io/part-of: agentforge
    release: kube-prometheus-stack
spec:
  groups:
    - name: agentforge-conductor
      rules:
        # FIRST, deliberately: a conductor nobody is scraping is indistinguishable from a quiet estate,
        # and every other rule in this file is an empty vector while it is unscraped. This is the rule
        # that makes the others trustworthy.
        #
        # The PER-POD ANTI-JOIN, not `absent()`. The idiom is ForgeOrchestratorUnscraped's: join
        # kube-state-metrics' view of a ready container against a series only the workload itself can
        # publish, and alert on the difference. `absent()` is the form this estate has already measured
        # as wrong — over 24h the naive absent() form would have fired 1270 times where the guarded
        # form fired zero.
        #
        # forge_conduct_writes_total is the marker because it is UNLABELLED, which means prometheus_client
        # emits it at 0.0 the instant the registry is constructed — before any pass runs. So it is
        # present from the first scrape of a healthy conductor and absent only when nothing is scraped
        # at all. A labelled series would be absent until its first child was touched, which at T0
        # (where the conductor writes nothing) might be never.
        #
        # `for: 20m` matches the orchestrator rule and clears a rollout plus Prometheus' 5m staleness
        # window, which is already ForgeTargetDown's business.
        - alert: ForgeConductDown
          expr: |-
            max by (namespace, pod) (
              kube_pod_container_status_ready{namespace="agentforge", container="conductor"} == 1
            )
            unless on (namespace, pod) forge_conduct_writes_total
          for: 20m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor {{ $labels.namespace }}/{{ $labels.pod }} is unscraped (no forge_conduct_* metrics)"
            description: >-
              The conductor container is Ready but publishes no forge_conduct_* series, so every other
              conductor alert is an empty vector and the estate is unobserved without saying so. Check
              the PodMonitor binds the container port NAMED metrics (9464, the conductor's own
              registry) and not probe (8720, which serves /healthz and /readyz only), and that the
              CiliumNetworkPolicy admits the monitoring namespace to 9464.
        # A conductor that HAS observed the estate and has stopped. The stamp is set ONLY on a pass
        # that actually read the estate (`listings_complete and not any(incomplete.values())`), so a
        # stale stamp on a scraped conductor means nothing since has read it — every pass coming back
        # short (a forge outage, a spent budget, an auth failure), or no pass returning at all while
        # the process stays up. The expression does not tell those apart; the pass counter does, and
        # the description points the operator at it.
        #
        # `> 0` ON THE GAUGE IS THE PRECONDITION, not a tidy-up (the header's epoch note), written
        # inline the way the estate's other stamp rules write it (ForgeReconcileStalled,
        # ForgeDispatchStalled, ReviewbotReconcileStale): the filter passes the gauge through when it
        # holds a stamp and yields an empty vector when it holds the construction-time 0, and
        # `time() -` an empty vector is empty — so a conductor that has never stamped is invisible to
        # this rule rather than a 56-year outage to it. That conductor is ForgeConductNeverObserved's
        # case, below. The two rules partition the gauge — `== 0` there, `> 0` here — so at most one
        # of them can be the answer for any one process, and `$value` here is an age the engine
        # actually produced. The alert wears the gauge's own scrape labels.
        #
        # THE PASS COUNTER IS NOT A TERM, on purpose. `record_pass` writes the stamp and counts the
        # complete pass in one call, so on a healthy process `passes_total > 0` follows from
        # `gauge > 0` and decides nothing. On the one process where it does not follow, it decides
        # the wrong thing: the engine keeps stamping when the counter's write fails, by design
        # (test_a_wedged_counter_does_not_stop_the_liveness_stamp, agentforge
        # tests/unit/test_conduct_metrics.py — an instrument fault must never cost the liveness
        # series), and a `passes_total > 0` conjunct here would silence this rule on that process
        # while its stamped gauge silences NeverObserved, leaving a conductor that stopped observing
        # with no rule at all. The fixture's wedged-counter case holds that open.
        #
        # 1800s = six pass intervals: at 300s a conductor has passed on six consecutive chances to
        # re-stamp before the expression is true, and the 10m hold adds two more before it fires —
        # about forty minutes after the last observation, past any single transient and well inside
        # the time a human would want to know.
        - alert: ForgeConductBlind
          expr: |-
            (time() - (forge_conduct_last_pass_timestamp > 0)) > 1800
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor has not completed a pass in {{ $value | printf \"%.0f\" }}s"
            description: >-
              The conductor has observed the estate before — the stamp is live — and has not done so
              in over six pass intervals. Either every pass since is coming back short, or no pass is
              returning at all while the process is still scraped: forge_conduct_passes_total says
              which, and the per-sensor counter forge_conduct_sensor_incomplete_total says which read
              is short. A conductor that has never stamped at all is ForgeConductNeverObserved's case,
              not this one.
        # THE OTHER HALF OF THE PARTITION: a conductor that has never stamped. Six passes in and no
        # stamp means six passes have ended — returned short, or raised — and none observed the
        # estate: a lane reading a path that is not there, a permission the bot lacks, a sensor that
        # fails on every pass. A fault the process cannot see, and Blind, above, cannot speak for.
        #
        # THE PASS COUNT IS THE CLOCK, on purpose. `time()` has nothing to measure against on this side
        # (the gauge is 0), and the counter is the engine's own record of how many passes this
        # process has run. Both belong to the process: a container restart resets them in place and
        # a rollout replaces them with a new pod's, so either way the new process starts its count at
        # zero and gets six passes of its own — and the RAW sum, joined per pod, is what makes that
        # true. increase() would carry a pre-restart count across the reset, and a sum across pods
        # would let the outgoing pod's count answer for the incoming pod's zero gauge for as long as
        # its samples stay queryable. The join is `on (namespace, pod)` — the labels the PodMonitor
        # stamps on every series — rather than a bare `and`, because the gauge carries instance and
        # job as well, which the summed side does not, and a bare `and` would match nothing. `>= 6`
        # is Blind's six-pass-interval yardstick counted in the unit that exists on this side of the
        # partition; at the 300s cadence the sixth pass returns about 25 minutes after boot, and at
        # the backed-off cadence of a raising pass about 90.
        #
        # No `for`. The condition cannot flap: the count only grows until the gauge is stamped or the
        # process changes, and either is the alert clearing for the right reason (the first stamp
        # hands the watch to Blind). A hold would only delay the answer — a second clock on top of
        # the one the count already is.
        - alert: ForgeConductNeverObserved
          expr: |-
            sum by (namespace, pod) (forge_conduct_passes_total) >= 6
              and on (namespace, pod) (forge_conduct_last_pass_timestamp == 0)
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor has run {{ $value | printf \"%.0f\" }} passes since it started and none has observed the estate"
            description: >-
              forge_conduct_last_pass_timestamp is still the 0 it is exported at before the first
              complete pass, and six or more passes have ended since this process started — so
              none of them read the estate, which is a fault the process itself cannot see: a lane
              reading a path that is not there, a permission its bot lacks, a sensor that fails on
              every pass. The per-sensor counter forge_conduct_sensor_incomplete_total says which read
              is short, and forge_conduct_passes_total{outcome=failed} whether the passes raised
              rather than returned. Both the stamp and the count belong to the process, so a restart
              or a rollout starts the count over and the new process gets six passes of its own; the
              first complete pass hands the watch over to ForgeConductBlind.
        # Passes that RAISED, as opposed to passes that came back incomplete. The loop catches every
        # exception and backs off, so a raising pass is invisible in the process's health — it looks
        # like a conductor that is simply quiet. `_conduct_loop` (agentforge main.py) counts every
        # pass on this counter, on the return arm and on the except arm.
        #
        # [2h] BECAUSE OF THAT BACKOFF, which the rule's own annotation states. `backoff_seconds`
        # (conductor/loop.py) is `interval * 2 ** min(consecutive_failures, 2)`, so at the 300s
        # default a sustained failure run lands its failures at t=0, +600s, then +1200s apart for
        # ever. A window sized off the pass cadence — six intervals, [30m] — holds at most two of
        # those (1800/1200 = 1.5) and can never need three of anything; [2h] holds ~6 at the
        # backed-off cadence while still needing three, so one transient (or two) stays quiet.
        #
        # COUNTED, NOT increase()'d. increase() scales the raw step count to the window's edges by a
        # factor set by where the samples sit against them, and a COUNT threshold on it is a coin
        # toss at the margin: at a full scrape two failures read 2.01-2.07 (by window and scrape
        # interval) once the counter was non-zero when the window opened — over a `> 2` — and with
        # scrapes missing they read past three (samples at 60m, 70m and 90m read at 100m put two
        # steps at 3.17), while the factor is never under 1, so a `>= 3` is safe only from below.
        # changes() counts the value changes among the samples the window holds — an integer, no
        # extrapolation — and resets() subtracts the one change that is not a failure, a restart's
        # drop to 0. That is exact on this counter because record_pass_failure moves it by one and
        # the backoff puts at least 600s between two moves of one process, so a 30s scrape never
        # sees two as one. Where it is not exact it is quiet: a scrape gap wide enough to merge two
        # failures under-counts, and a failure that lands before the first scrape after a restart
        # is hidden unless the counter stood at 0 before it (n to 1 is one change less one reset;
        # 1 to 1 is no change at all).
        #
        # sum() is not decoration: an un-aggregated result carries the series' own labels onto the
        # alert — outcome="failed", redundant with the alert's name, and one alert per value of any
        # dimension the counter gains later. It sums ONE series per pod, because the conductor has
        # one PodMonitor; a second scrape of the same pod would count every failure twice.
        - alert: ForgeConductPassesFailing
          expr: |-
            sum(
              changes(forge_conduct_passes_total{outcome="failed"}[2h])
                - resets(forge_conduct_passes_total{outcome="failed"}[2h])
            ) >= 3
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor: {{ $value | printf \"%.0f\" }} passes raised in the last 2h"
            description: >-
              Passes are raising rather than returning incomplete, which the loop absorbs into its
              backoff. Check the conductor's logs for the traceback. The window is 2h BECAUSE of that
              backoff: a sustained run settles at one failed pass per four intervals (1200s at the
              300s default), so three failures span thirty to forty minutes of backoff plus the
              passes' own run time, and a window sized off the pass cadence holds at most two of them.
        # A CONFIG GENERATION THE LOOP REFUSED (agentforge #379). The refresh after every pass re-checks
        # the startup gate's isolation invariants against the tenant config's newest generation — the
        # repo-name grammar, a non-empty bound read set, filing repos disjoint from every repo the
        # config binds, act repos inside the bound set — and a generation that breaks one is not
        # adopted: the conductor keeps running on the last generation that satisfied them, and this
        # counter is the only outward sign. From the estate that is indistinguishable from a config
        # that never changed — passes complete, the stamp advances, every rule above stays quiet — while
        # whoever edited the config is reading an estate observed under the config they replaced.
        #
        # `> 0`, NOT A COUNT, over [30m]. One refusal is already the fact: someone pushed a generation
        # the gate rejects, and a restart on it would refuse to boot. The counter moves once per
        # REFRESH — once per pass interval while the source keeps serving the bad generation, and once
        # per 1200s in the backed-off regime, because the refresh runs after the sleep and backs off
        # with the pass. A threshold of one needs only a window longer than the slowest interval, and
        # 1800 > 1200 (a window of exactly the interval holds no step for one eval per cycle, which
        # is enough to drop the alert). Not `> 1` either: increase() extrapolates to the window's
        # edges, so one refusal reads as exactly 1 or as 1-and-a-bit depending on where its samples
        # sit against the window, and a threshold of one turns a single refusal into a coin toss on
        # scrape timing. The window is also the clear: refusals stop when a good generation lands,
        # and the alert resolves itself once the last one ages out — within 30m of it.
        #
        # sum() for ForgeConductPassesFailing's reason: the counter is unlabelled, so an un-aggregated
        # increase() would put the scrape's own labels on the alert. No `for`: a refusal is a discrete
        # event the counter records once and the window holds for just under 30m (until the sample
        # before the step leaves it), nothing about that can flap, and a hold would only delay the
        # page.
        - alert: ForgeConductConfigRejected
          expr: |-
            sum(increase(forge_conduct_config_rejected_total[30m])) > 0
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor refused a config generation and is running on the last one it accepted"
            description: >-
              forge_conduct_config_rejected_total advanced: the refresh after a pass re-checked the
              startup gate's isolation invariants against a new generation of the tenant config and
              refused it — the repo-name grammar, a non-empty bound read set, filing repos disjoint
              from every repo the config binds, act repos inside the bound set. The conductor keeps
              running on the last generation that satisfied them, so the estate it reports on is not
              the one the refused generation describes — and for as long as that generation is the
              one the source serves, a restart would refuse to boot on it with the same messages.
              The conductor's log carries them (`conduct: refusing config generation`); fix the
              generation at its Gitea source and the alert clears once the last refused refresh
              ages out of its 30m window.
        # T0's standing invariant, and the one rule here that is a POSTURE check rather than a health
        # check. At AF_CONDUCT_TIER=observe the write door refuses before its first forge call, so any
        # movement on this counter means the tier is no longer observe — an arming that was not meant
        # to happen, or a knob edited in place.
        #
        # This is deliberately NOT the proof that T0 is write-free: the engine pins that with an AST
        # writer pin, because `writes == 0` at observe is a tautology rather than a measurement. This
        # rule catches the CONFIGURATION changing, not the code.
        - alert: ForgeConductUnexpectedWrites
          expr: |-
            sum(increase(forge_conduct_writes_total[30m])) > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor wrote to the forge while T0 expects none"
            description: >-
              forge_conduct_writes_total advanced. At AF_CONDUCT_TIER=observe the write door refuses
              before reaching the forge, so this means the deployed tier is no longer observe. Confirm
              the Deployment's AF_CONDUCT_TIER and whether an arming rung landed.
        # THE OTHER HALF OF A FIX THAT WOULD OTHERWISE BE HALF-DONE (agentforge #365). The engine
        # counts per-sensor incompleteness under a CLOSED label vocabulary — an undeclared child
        # appears mid-flight and is invisible to the pre-touch, which is how a closed vocabulary
        # stops being one. Until #365 an undeclared sensor's count was DISCARDED, so a sensor
        # nobody had declared reported nothing at all and the gap was unreadable from outside.
        # #365 routes those counts to one reserved value instead; this is the rule that makes the
        # reserved value mean something. A bucket nothing alerts on is the same defect one layer
        # down — see this file's ForgeConductDown note on instruments that read healthy because
        # nothing watches them.
        #
        # WHAT A FIRING HERE MEANS, precisely: the conductor observed a sensor coming back short,
        # and CONDUCT_SENSORS does not declare that sensor, so its count cannot be attributed. T0's
        # exit criterion asks for `forge_conduct_sensor_incomplete_total` to be EXPLAINED PER
        # SENSOR, and an unattributable count is exactly what cannot be explained. The engine also
        # pins this shut in CI (a test derives conduct_pass's sensor keys from its AST and fails if
        # the vocabulary omits one), so reaching this rule means the pin was bypassed — a sensor key
        # computed rather than written as a literal is the case it cannot see.
        #
        # `> 0` on an increase() over 30m, not on the raw counter: the counter is pre-touched to 0
        # at construction, so `forge_conduct_sensor_incomplete_total > 0` would be satisfied forever
        # by a single historical occurrence. The window asks "is this happening now".
        - alert: ForgeConductSensorUnrecognised
          expr: |-
            sum(increase(forge_conduct_sensor_incomplete_total{sensor="unrecognised"}[30m])) > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor counted an incomplete read it cannot attribute to a sensor"
            description: >-
              forge_conduct_sensor_incomplete_total advanced on the reserved `unrecognised` label,
              which means a pass came back short on a sensor that CONDUCT_SENSORS
              (agentforge infra/conduct_metrics.py) does not declare. The count is real; the
              attribution is missing, so T0's "sensor_incomplete explained per sensor" cannot be
              satisfied while this fires. Fix in the ENGINE, not here - add the sensor to
              CONDUCT_SENSORS and add its own case to this file in the same change, so a declared
              sensor never lacks a rule and a rule never lacks a declared sensor. The engine's own
              AST pin should have caught this before it shipped, so also check why it did not: it
              reads sensor keys written as string literals in conduct_pass and cannot see one that
              is computed.
        # THE GAP BETWEEN "ARMED" AND "RUNNING", watched permanently rather than once. The conductor's
        # forge PAT reaches its pod through an ExternalSecret (agentforge-conductor-forge, reading
        # operator/conductor/forge from the af KV mount), and that secret is REQUIRED — the pod does not
        # start without it. An ES stuck NotReady therefore leaves the pod at ContainerCreating, which
        # none of the liveness rules above can see: the container never becomes Ready, so
        # ForgeConductDown's anti-join has an empty left side, and no pass runs, so
        # ForgeConductNeverObserved's six-pass floor is never reached and ForgeConductBlind's stamp
        # precondition never holds. From the estate that state is indistinguishable from a rung nobody
        # merged, and a kubectl check after arming is that gap watched once, not watched.
        #
        # Shape, verified against the live store rather than written from memory: ESO exports BOTH
        # status="True" and status="False" series for every condition, as 1/0 — so NotReady is
        # `condition="Ready", status="False"` EQUAL TO 1, not the absence of the True series. And the
        # ES's own namespace lives in `exported_namespace` (plain `namespace` is ESO's), which is the
        # kind of label mistake that yields an empty vector that never fires.
        #
        # `for: 15m` is one ES refreshInterval plus slack: the SecretStore's role can take a provision
        # tick to exist, and a NotReady that clears on the next refresh is not an operator's problem.
        - alert: ForgeConductSecretNotReady
          expr: |-
            externalsecret_status_condition{
              exported_namespace="agentforge", name="agentforge-conductor-forge",
              condition="Ready", status="False"
            } == 1
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "AgentForge conductor's forge secret is NotReady — the pod cannot start"
            description: >-
              ExternalSecret agentforge-conductor-forge has reported Ready=False for 15m. The conductor
              Deployment requires this secret, so its pod sits at ContainerCreating — a state no other
              conductor rule can see, because the container never becomes Ready and no pass ever
              runs. Check `kubectl -n agentforge describe externalsecret agentforge-conductor-forge`:
              the usual causes are the af/data/operator/conductor/forge path not yet written by the
              openbao-provision Job (the seed is create-if-absent; the Job runs daily), or the
              SecretStore's AppRole role not yet minted.
