# Scrape the three trueswarm CloudNativePG clusters, so cnpg-backup-rules.yaml (and the
# cnpg-replication rules) have series to fire on. Until this file they had ZERO metrics in Prometheus:
# none sets a PodMonitor the kps Prometheus selects (podMonitorSelector = `release:
# kube-prometheus-stack`), the same gap strive-pg-podmonitor.yaml closed for strive-pg.
#
# WHY NOW (plans/2026-10-09-k8s-1.35-and-barman-plugin-plan.md, Phase M). These are the only clusters
# in the estate with a WAL archive and base backups (in-tree Barman today, plugin-barman-cloud after
# the migration), and nothing alerted on either. trueswarm-platform-pg's last base backup was
# 2026-10-01, and trueswarm-pg/trueswarm-platform-pg have no ScheduledBackup at all. The migration
# must not be the first time anyone looks.
#
# Same shape as strive-pg-metrics / infra-pg-metrics, for the same two reasons:
#   * named `<cluster>-metrics`, never `<cluster>`: CNPG deletes a PodMonitor carrying the cluster's
#     own name (apps/databases/infra-pg.yaml);
#   * owned here, not in cchifor/trueswarm-admin: a PodMonitor is additive and mutates nothing.
#
# The `cluster` relabel gives every series the CNPG cluster name, so cnpg-backup-rules.yaml can
# aggregate per cluster across a switchover (the pod changes, the cluster does not).
#
# The monitoring -> :9187 ingress already exists in both namespaces (trueswarm-postgres,
# trueswarm-platform-postgres, admin-database NetworkPolicies).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: trueswarm-pg-metrics
  namespace: trueswarm
  labels:
    release: kube-prometheus-stack # kps Prometheus podMonitorSelector — without this it is ignored
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: trueswarm-pg
  podMetricsEndpoints:
    - port: metrics # CNPG instance-pod exporter :9187 (cnpg_* and, after the migration, barman_cloud_* series)
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cluster
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: trueswarm-platform-pg-metrics
  namespace: trueswarm
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: trueswarm-platform-pg
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cluster
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: trueswarm-admin-pg-metrics
  namespace: trueswarm-admin
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: trueswarm-admin-pg
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cluster
