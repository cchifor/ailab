apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - strive-durable-processing-rules.yaml # Durable task inventory, timing, recovery and budgets; promtool fixtures stay outside resources.
  - strive-durable-processing-dashboard.yaml # Grafana sidecar dashboard for the Workflow durable task-map instruments.
  - namespace.yaml
  - limitrange.yaml
  - grafana-admin.sops.yaml
  - grafana-oauth.sops.yaml # Authelia OIDC client secret (env into Grafana)
  - grafana-db.sops.yaml # infra-pg postgres password (GF_DATABASE_PASSWORD; twin of databases/infra-pg-grafana)
  - metrics-server.yaml # Metrics API (kubectl top / HPA / Homepage k8s widget)
  - pve-exporter-secret.sops.yaml # SOPS: read-only PVE token (PVEAuditor) for pve-exporter
  - pve-exporter.yaml # Proxmox VE metrics (hypervisors + VMs/CTs + storage pools)
  - proxmox-node.yaml # host node_exporter on the 3 Proxmox hosts (scrape target)
  - ci-runners-node.yaml # host node_exporter on the CI runner VMs (Gitea Actions; scrape target)
  - ci-runners-cloud.yaml # host node_exporter on the OPPORTUNISTIC cloudlab runner VMs (cloud-ci-N, ADR 0032). Own job (ci-runner-cloud) + per-host cloud_host label so its rules can be gated on the host being up — the hosts are off at night. Endpoints ship EMPTY until the VMs exist
  - dev-workers-node.yaml # host node_exporter on the 6 dev-worker VMs (scrape target)
  - reviewers-node.yaml # host node_exporter + reviewbot_* textfile metrics on the 2 reviewer VMs
  - reviewbot-rules.yaml # reviewer VM + reviewbot service alerts (the 2026-09-04 silent-failure gap)
  - llm-router-rules.yaml # LLM router: failure ratio per route, subscription limits, scrape target (the 2026-10-14 silent-overload gap)
  - edge-proxy-rules.yaml # edge proxy (ADR 0040): readiness, scrape, 5xx per host, certificate reload and expiry
  - kube-prometheus-stack.yaml
  - loki-lan.yaml # LAN NodePort :30310 — journald ingestion from the reviewer VMs (see file header for the exposure trade-off)
  - prometheus-lan.yaml # LAN NodePort :30090 — nightly k6 remote-write + baseline queries from the CI runner VMs (exposure trade-off in file header)
  - loki.yaml
  - alloy.yaml
  - flux-monitoring.yaml # PodMonitor for the 4 Flux controllers (gotk_reconcile_* metrics)
  - ai-llm-dashboard.yaml
  - reporting-dashboard.yaml # single infra reporting dashboard (hypervisors/instances/AI/storage)
  - loki-logs-dashboard.yaml # "Loki — Logs": most-used log queries (errors/volume/search) + Explore
  - k8s-releases-dashboard.yaml # "Kubernetes — Releases & Workloads": Flux status + workload usage + error/warn logs
  - trivy-dashboard.yaml # Trivy Operator security-scan dashboard (grafana.com ID 17813)
  - strive-red-dashboard.yaml # strive platform per-service RPS/error/p95 (OTLP RED metrics via alloy-otlp remote_write)
  - strive-edge-dashboard.yaml # "Strive - Edge": Traefik requests/5xx by entrypoint and service, gatekeeper /auth outcomes and RED by route, Gatus `Strive edge` probes, and the Traefik 5xx access-log lines (E5 of the 2026-10-07 auth-hardening plan). Traefik series exist since platform E1a (the traefik-metrics scrape) went live on 2026-10-07; the router-based panel needs E1b
  - k6-nightly-dashboard.yaml # "k6 — Nightly load (strive)": nightly k6 runs (rw via prometheus-lan) + 30d trends over the k6:* recording rules
  - k6-load-rules.yaml # k6:* recording rules by (scenario, env) — the 7d baseline for the platform's nightly regression gate
  - soak-leak-rules.yaml # weekly-soak alerts: soak running (info), error rate >5%, container RSS-leak detection gated on an active soak
  - ntfy-auth.sops.yaml # SOPS: ntfy admin password (server seeding + Alertmanager receiver)
  - ntfy-qnap-auth.sops.yaml # SOPS: write-only publisher the QNAP itself authenticates as (its Notification Center can only do a GET webhook, so the credential rides in a query string — hence write-only)
  - ntfy.yaml # self-hosted push notifications; Alertmanager routes all alerts here
  - storage-fabric-probe.yaml # per-node QNAP-fabric reachability (blackbox DaemonSet)
  - storage-fabric-rules.yaml # alerts on the probes
  - qnap-snmp-auth.sops.yaml # SOPS: read-only SNMP community for the NAS (source-restricted on the QNAP side)
  - qnap-snmp-exporter.yaml # the NAS itself — disks/SMART, temps, fans. It was the one major component with NO scrape at all; a failed drive in the RAID-Z1 would have alerted nobody (2026-08-16 storage audit)
  - qnap-rules.yaml # alerts on the above; QnapDiskSmartNotGood is the load-bearing one
  - ci-runners-rules.yaml # alerts on the runner VMs (down / disk / memory / buildx self-heal beacon)
  - ci-runners-cloud-rules.yaml # host-gated alerts on the cloudlab runner VMs (down-while-host-up / disk / cleanup beacon) — the 24/7 rules above would page every evening. Fixtures in ci-runners-cloud-rules.test.yaml (NOT a resource — promtool only)
  - dev-workers-rules.yaml # alerts on the 6 dev-worker VMs. The scrape target existed with ZERO rules against it, so dev-worker-1's kernel panic (2026-08-11) was covered only by the generic TargetDown at severity warning while the VM sat dead 12h and PVE still called it `running`
  - ai-llm-gpu-rules.yaml # the AI LLM nodes' iGPU page-table carve (512 MiB UMA) pinned at 100% for 10m = a wedged llama-server load (2026-10-01: node2 sat at 512/512 for 10h+, requests hung 15 min, LiteLLM never noticed). Fixtures in ai-llm-gpu-rules.test.yaml (NOT a resource — promtool only)
  - agentforge-provisioner-rules.yaml # ailab#293: the af_provisioner_* half — the BrokerSeat controller's alert-only failure modes and the seat-entitlement audit's findings, which reached only the pod log until security/openbao/provisioner-podmonitor.yaml gave them a scrape target. Fixtures in agentforge-provisioner-rules.test.yaml (NOT a resource — promtool only)
  - gitea-rules.yaml # alerts on the Gitea forge (down / memory / restart) — critical master forge
  - gitea-credential-rules.yaml # alerts on the forge's STANDING CREDENTIALS (B5, auth-hardening plan 2026-10-07): the org account holding tokens, an owner token older than 4h, gitea_admin tokens outside its two-token allowlist, an owner OAuth2 grant, the site-admin count != 2, and the inventory itself going missing (absent() per metric family and per owner — a valid zero-token row must NOT read as missing). Source: the custom CNPG queries in apps/databases/infra-pg-gitea-credential-queries.yaml (counts and ages only, never token values). Fixtures in gitea-credential-rules.test.yaml (NOT a resource — promtool only)
  - gitea-worker-credential-rules.yaml # the per-slot worker bots' tokens (worker identities plan 2026-10-11, Phase 5): an unexpected token on a slot bot, a missing git/repo/pkg kind on a live slot, a rotation left half-done for 24h, a duplicated kind, an active or token-holding account outside the live slots, and the inventory going missing. Source: query gitea_worker_credentials in apps/databases/infra-pg-gitea-credential-queries.yaml (counts only). Fixtures in gitea-worker-credential-rules.test.yaml (NOT a resource)
  - ha-rules.yaml # ADR 0016 guardrails: Tier-A replica loss, PDB drain-blockers, unaccepted-singleton inventory
  - backup-rules.yaml # ADR 0010 chain: staleness of the off-site sync, Velero, and the Talos etcd snapshot — all three were unmonitored, and two were silently dead for 41d/5d
  - strive-pg-podmonitor.yaml # strive-pg had ZERO metrics for 90d: CNPG's own PodMonitor lacks the `release` label kps selects on, so it was never scraped. Must precede the rules below — a rule with no series is not a safety net.
  - cnpg-replication-rules.yaml # CNPG REPLICATION health, anchored on slot/walreceiver/peer-count facts rather than pod readiness. Both clusters had dead replicas (infra-pg 14d, strive-pg ~27d) while reporting Ready=True and readyInstances complete — the max_slot_wal_keep_size cap invalidates a lagging slot PERMANENTLY and, with no WAL archive on either cluster, that is unrecoverable without a manual re-bootstrap. Fixtures in cnpg-replication-rules.test.yaml (NOT a resource — promtool only, via scripts/rules-lint.sh)
  - trueswarm-pg-podmonitors.yaml # the three trueswarm CNPG clusters (the only ones with a WAL archive + base backups) had ZERO metrics: same missing `release` label as strive-pg. Named <cluster>-metrics (CNPG deletes a PodMonitor named after the cluster); relabels cnpg.io/cluster -> cluster. Must precede cnpg-backup-rules.yaml
  - cnpg-backup-rules.yaml # CNPG BACKUP health for the trueswarm clusters (plans/2026-10-09-k8s-1.35-and-barman-plugin-plan.md, Phase M): archiver failing / .ready backlog / base backup >26h / latest backup failed, filtered to the primary with `and on (namespace, pod)`, reading the in-tree AND plugin-barman-cloud families so the rules hold across the migration; plus absence rules per expected cluster (not joined to any CNPG series, which vanish with the scrape). Fixtures in cnpg-backup-rules.test.yaml (NOT a resource - promtool only, via scripts/rules-lint.sh)
  - platform-rules.yaml # 2026-09-09 audit: the two blind spots that were not workload-specific — the alerting plane OOMing unnoticed (of 213 rules, the only container_memory ones are scoped to gitea/strive-ailab), and a control-plane RESTART WAVE, which KubePodCrashLooping structurally cannot express because each container restarts once and recovers. Fixtures in platform-rules.test.yaml (NOT a resource — promtool only)
  - control-plane-storage-rules.yaml # plans/2026-10-07-etcd-leader-churn-plan.md step E: cp1 holding etcd leadership (worst WAL-fsync tail; retire after step C) and host NVMe controller temperature (the shared QLC drives throttle/freeze when hot). Fixtures in control-plane-storage-rules.test.yaml (NOT a resource — promtool only)
  - strive-edge-rules.yaml # E3 of the 2026-10-07 auth-hardening plan: the public edge (Traefik) 5xx ratio/burst, gatekeeper ForwardAuth/route 5xx and TokenReview health, and TraefikScrapeMissing (the Traefik scrape from platform E1a, live since 2026-10-07). Fixtures in strive-edge-rules.test.yaml (NOT a resource - promtool only, via scripts/rules-lint.sh)
