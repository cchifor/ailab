# `promtool test rules` fixtures for pve-ec-fan-rules.yaml. Run by scripts/rules-lint.sh on every PR.
# `rule_files` is the extracted spec name (rules-lint.sh hands promtool each PrometheusRule's `spec:`
# body under the manifest's basename).
rule_files:
  - pve-ec-fan-rules.yaml

evaluation_interval: 1m

tests:
  # ------------------------------------------------------------------- ProxmoxCpuFanStalled
  - interval: 1m
    name: a CPU fan under 1000 rpm above 70 C for 5m warns
    input_series:
      - series: 'ec_fan_rpm{job="proxmox-node", instance="192.168.0.2:9100", fan="1"}'
        values: "4200x3 300x20"
      - series: 'ec_fan_rpm{job="proxmox-node", instance="192.168.0.2:9100", fan="2"}'
        values: "4200x23"
      - series: 'ec_temp_celsius{job="proxmox-node", instance="192.168.0.2:9100"}'
        values: "75x23"
    alert_rule_test:
      - eval_time: 7m
        alertname: ProxmoxCpuFanStalled
        exp_alerts: []
      - eval_time: 10m
        alertname: ProxmoxCpuFanStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              job: proxmox-node
              instance: 192.168.0.2:9100
              fan: "1"
            exp_annotations:
              summary: "Proxmox host 192.168.0.2:9100 CPU fan 1 at 300 rpm above 70 C"
              description: "CPU fan 1 on 192.168.0.2:9100 has read under 1000 rpm for 5m while the EC temperature is above 70 C, where the curve runs it at 40 % or more (~2650 rpm). Check on the host: `cat /sys/class/ec_su_axb35/fan1/{mode,level,rpm}` and `systemctl status ec-fan-profile`. Level 4-5 with a low rpm is the fan or its cable; a low level is the curve: `systemctl restart ec-fan-profile`, or `rmmod ec_su_axb35` to hand the fans back to the firmware. Runbook: docs/runbooks/node-maintenance.md \"EC fan curve\"."
  - interval: 1m
    name: both CPU fans stopped (0 rpm) above 70 C warn once each
    input_series:
      - series: 'ec_fan_rpm{job="proxmox-node", instance="192.168.0.2:9100", fan="1"}'
        values: "0x20"
      - series: 'ec_fan_rpm{job="proxmox-node", instance="192.168.0.2:9100", fan="2"}'
        values: "0x20"
      - series: 'ec_temp_celsius{job="proxmox-node", instance="192.168.0.2:9100"}'
        values: "82x20"
    alert_rule_test:
      - eval_time: 8m
        alertname: ProxmoxCpuFanStalled
        exp_alerts:
          - exp_labels: {severity: warning, job: proxmox-node, instance: 192.168.0.2:9100, fan: "1"}
            exp_annotations:
              summary: "Proxmox host 192.168.0.2:9100 CPU fan 1 at 0 rpm above 70 C"
              description: "CPU fan 1 on 192.168.0.2:9100 has read under 1000 rpm for 5m while the EC temperature is above 70 C, where the curve runs it at 40 % or more (~2650 rpm). Check on the host: `cat /sys/class/ec_su_axb35/fan1/{mode,level,rpm}` and `systemctl status ec-fan-profile`. Level 4-5 with a low rpm is the fan or its cable; a low level is the curve: `systemctl restart ec-fan-profile`, or `rmmod ec_su_axb35` to hand the fans back to the firmware. Runbook: docs/runbooks/node-maintenance.md \"EC fan curve\"."
          - exp_labels: {severity: warning, job: proxmox-node, instance: 192.168.0.2:9100, fan: "2"}
            exp_annotations:
              summary: "Proxmox host 192.168.0.2:9100 CPU fan 2 at 0 rpm above 70 C"
              description: "CPU fan 2 on 192.168.0.2:9100 has read under 1000 rpm for 5m while the EC temperature is above 70 C, where the curve runs it at 40 % or more (~2650 rpm). Check on the host: `cat /sys/class/ec_su_axb35/fan2/{mode,level,rpm}` and `systemctl status ec-fan-profile`. Level 4-5 with a low rpm is the fan or its cable; a low level is the curve: `systemctl restart ec-fan-profile`, or `rmmod ec_su_axb35` to hand the fans back to the firmware. Runbook: docs/runbooks/node-maintenance.md \"EC fan curve\"."
  - interval: 1m
    name: fan3 at 0 rpm (ai-node1's known hardware fault) never warns, however hot
    input_series:
      - series: 'ec_fan_rpm{job="proxmox-node", instance="192.168.0.2:9100", fan="3"}'
        values: "0x30"
      - series: 'ec_temp_celsius{job="proxmox-node", instance="192.168.0.2:9100"}'
        values: "90x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: ProxmoxCpuFanStalled
        exp_alerts: []
  - interval: 1m
    name: a slow or stopped CPU fan at 70 C or below does not warn
    input_series:
      - series: 'ec_fan_rpm{job="proxmox-node", instance="192.168.0.2:9100", fan="1"}'
        values: "0x30"
      - series: 'ec_fan_rpm{job="proxmox-node", instance="192.168.0.2:9100", fan="2"}'
        values: "900x30"
      - series: 'ec_temp_celsius{job="proxmox-node", instance="192.168.0.2:9100"}'
        values: "70x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: ProxmoxCpuFanStalled
        exp_alerts: []
  - interval: 1m
    name: a dip shorter than 5m, and a hot EC on ANOTHER host, do not warn
    input_series:
      - series: 'ec_fan_rpm{job="proxmox-node", instance="192.168.0.2:9100", fan="1"}'
        values: "4200x5 500x3 4200x15"
      - series: 'ec_temp_celsius{job="proxmox-node", instance="192.168.0.2:9100"}'
        values: "75x23"
      - series: 'ec_fan_rpm{job="proxmox-node", instance="192.168.0.3:9100", fan="1"}'
        values: "0x23"
      - series: 'ec_temp_celsius{job="proxmox-node", instance="192.168.0.3:9100"}'
        values: "50x23"
    alert_rule_test:
      - eval_time: 9m
        alertname: ProxmoxCpuFanStalled
        exp_alerts: []
      - eval_time: 20m
        alertname: ProxmoxCpuFanStalled
        exp_alerts: []
  - interval: 1m
    name: another job's copy of the series does not warn
    input_series:
      - series: 'ec_fan_rpm{job="ai-llm-node", instance="192.168.0.45:9100", fan="1"}'
        values: "0x20"
      - series: 'ec_temp_celsius{job="ai-llm-node", instance="192.168.0.45:9100"}'
        values: "85x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ProxmoxCpuFanStalled
        exp_alerts: []

  # -------------------------------------------------------------- ProxmoxEcFanTextfileStale
  # promtool's clock starts at 0, so a timestamp series rising 60 per 1m step is a file rewritten on time.
  - interval: 1m
    name: a file that stops being rewritten warns once it is over 5m old
    input_series:
      - series: 'ec_fan_textfile_timestamp_seconds{job="proxmox-node", instance="192.168.0.2:9100"}'
        values: "0+60x10 600x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: ProxmoxEcFanTextfileStale
        exp_alerts: []
      - eval_time: 15m
        alertname: ProxmoxEcFanTextfileStale
        exp_alerts: []
      - eval_time: 16m
        alertname: ProxmoxEcFanTextfileStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: proxmox-node
              instance: 192.168.0.2:9100
            exp_annotations:
              summary: "Proxmox host 192.168.0.2:9100: EC fan metrics not updated for 6m 0s"
              description: "ec-fan-textfile has not rewritten ec_fan.prom on 192.168.0.2:9100 for over 5m, so the fan and temperature series are the last values node_exporter read and the CPU-fan stall alert is judging old numbers. Check `systemctl status ec-fan-textfile.timer ec-fan-textfile.service` and `journalctl -u ec-fan-textfile`. Runbook: docs/runbooks/node-maintenance.md \"EC fan curve\"."
  - interval: 1m
    name: a file rewritten every 30 s never warns
    input_series:
      - series: 'ec_fan_textfile_timestamp_seconds{job="proxmox-node", instance="192.168.0.2:9100"}'
        values: "0+60x40"
    alert_rule_test:
      - eval_time: 39m
        alertname: ProxmoxEcFanTextfileStale
        exp_alerts: []
  # ------------------------------------------------------------- ProxmoxEcFanGovernorStale
  - interval: 1m
    name: a governor that stops rewriting its file warns once the file is over 5m old
    input_series:
      - series: 'ec_fan_governor_heartbeat_timestamp_seconds{job="proxmox-node", instance="192.168.0.3:9100"}'
        values: "0+60x10 600x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ProxmoxEcFanGovernorStale
        exp_alerts: []
      - eval_time: 16m
        alertname: ProxmoxEcFanGovernorStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: proxmox-node
              instance: 192.168.0.3:9100
            exp_annotations:
              summary: "Proxmox host 192.168.0.3:9100: ec-fan-governor silent for 6m 0s"
              description: "ec-fan-governor has not rewritten ec_fan_governor.prom on 192.168.0.3:9100 for over 5m, so the CPU fans' levels 3-5 are not being decided on the smoothed temperature. The driver's curve still keeps the floor and steps up at 94/96/98 C (the APU is safe), but a fan the governor raised to 60 %+ stays there and a sustained-heat step up waits for 94 C. Check `systemctl status ec-fan-governor ec-fan-profile` and `journalctl -u ec-fan-governor`, then `systemctl restart ec-fan-profile` (it restarts the governor too) or converge `just ec-fan --limit <host>`. Runbook: docs/runbooks/node-maintenance.md \"EC fan curve\"."
  - interval: 1m
    name: a governor writing every 15 s never warns
    input_series:
      - series: 'ec_fan_governor_heartbeat_timestamp_seconds{job="proxmox-node", instance="192.168.0.3:9100"}'
        values: "0+60x40"
    alert_rule_test:
      - eval_time: 39m
        alertname: ProxmoxEcFanGovernorStale
        exp_alerts: []
  # ----------------------------------------------------------- ProxmoxEcFanGovernorMissing
  - interval: 1m
    name: a loaded driver with no governor file for 10m warns
    input_series:
      - series: 'ec_fan_driver_loaded{job="proxmox-node", instance="192.168.0.4:9100"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 9m
        alertname: ProxmoxEcFanGovernorMissing
        exp_alerts: []
      - eval_time: 11m
        alertname: ProxmoxEcFanGovernorMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: proxmox-node
              instance: 192.168.0.4:9100
            exp_annotations:
              summary: "Proxmox host 192.168.0.4:9100: the EC fan driver is loaded but ec-fan-governor has never reported"
              description: "On 192.168.0.4:9100 the ec_su_axb35 driver has been loaded for 10m but there is no ec_fan_governor.prom, so the CPU fans' levels 3-5 are not decided on the smoothed temperature (the curve's floor and its instant steps up at 94/96/98 C still work). The governor writes that file as it starts: it has not started, or its config is refused. Check `systemctl status ec-fan-governor` and `journalctl -u ec-fan-governor` (a refused config names the rule it breaks), then converge `just ec-fan --limit <host>`. Runbook: docs/runbooks/node-maintenance.md \"EC fan curve\"."
  - interval: 1m
    name: a loaded driver with its governor reporting, or an unloaded driver without one, never warns
    input_series:
      - series: 'ec_fan_driver_loaded{job="proxmox-node", instance="192.168.0.4:9100"}'
        values: "1x30"
      - series: 'ec_fan_governor_heartbeat_timestamp_seconds{job="proxmox-node", instance="192.168.0.4:9100"}'
        values: "0+60x30"
      - series: 'ec_fan_driver_loaded{job="proxmox-node", instance="192.168.0.2:9100"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 29m
        alertname: ProxmoxEcFanGovernorMissing
        exp_alerts: []
  - interval: 1m
    name: a host without the role (no series) never warns
    input_series:
      - series: 'node_load1{job="proxmox-node", instance="192.168.0.3:9100"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 39m
        alertname: ProxmoxEcFanTextfileStale
        exp_alerts: []
      - eval_time: 39m
        alertname: ProxmoxEcFanGovernorStale
        exp_alerts: []
      - eval_time: 39m
        alertname: ProxmoxEcFanGovernorMissing
        exp_alerts: []
      - eval_time: 39m
        alertname: ProxmoxEcFanDriverNotLoaded
        exp_alerts: []
      - eval_time: 39m
        alertname: ProxmoxCpuFanStalled
        exp_alerts: []
      - eval_time: 39m
        alertname: ProxmoxCpuFanNotOnCurve
        exp_alerts: []

  # ----------------------------------------------------------------- ProxmoxCpuFanNotOnCurve
  - interval: 1m
    name: a managed CPU fan left on auto for 15m warns
    input_series:
      - series: 'ec_fan_mode_info{job="proxmox-node", instance="192.168.0.2:9100", fan="1", mode="curve"}'
        values: "1x4"
      - series: 'ec_fan_mode_info{job="proxmox-node", instance="192.168.0.2:9100", fan="1", mode="auto"}'
        values: "_x4 1x30"
      - series: 'ec_fan_mode_info{job="proxmox-node", instance="192.168.0.2:9100", fan="2", mode="curve"}'
        values: "1x35"
      - series: 'ec_fan_managed{job="proxmox-node", instance="192.168.0.2:9100", fan="1"}'
        values: "1x35"
      - series: 'ec_fan_managed{job="proxmox-node", instance="192.168.0.2:9100", fan="2"}'
        values: "1x35"
    alert_rule_test:
      - eval_time: 18m
        alertname: ProxmoxCpuFanNotOnCurve
        exp_alerts: []
      - eval_time: 21m
        alertname: ProxmoxCpuFanNotOnCurve
        exp_alerts:
          - exp_labels:
              severity: warning
              job: proxmox-node
              instance: 192.168.0.2:9100
              fan: "1"
              mode: auto
            exp_annotations:
              summary: "Proxmox host 192.168.0.2:9100: CPU fan 1 is in auto mode, not on the curve"
              description: "ec-fan-profile manages CPU fan 1 on 192.168.0.2:9100, but the driver has reported mode auto for 15m, so the CPU-fan curve is not running (in auto the firmware curve still cools it). Usually the profile failed at boot or the module was reloaded without a profile restart: check `systemctl status ec-fan-profile` and `journalctl -b -u ec-fan-profile`, then `systemctl restart ec-fan-profile` or converge `just ec-fan --limit <host>` (the converge restarts it when the fans are off the profile). Runbook: docs/runbooks/node-maintenance.md \"EC fan curve\"."
  - interval: 1m
    name: a managed CPU fan in fixed mode for 15m warns too
    input_series:
      - series: 'ec_fan_mode_info{job="proxmox-node", instance="192.168.0.2:9100", fan="2", mode="fixed"}'
        values: "1x20"
      - series: 'ec_fan_managed{job="proxmox-node", instance="192.168.0.2:9100", fan="2"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 16m
        alertname: ProxmoxCpuFanNotOnCurve
        exp_alerts:
          - exp_labels: {severity: warning, job: proxmox-node, instance: 192.168.0.2:9100, fan: "2", mode: fixed}
            exp_annotations:
              summary: "Proxmox host 192.168.0.2:9100: CPU fan 2 is in fixed mode, not on the curve"
              description: "ec-fan-profile manages CPU fan 2 on 192.168.0.2:9100, but the driver has reported mode fixed for 15m, so the CPU-fan curve is not running (in auto the firmware curve still cools it). Usually the profile failed at boot or the module was reloaded without a profile restart: check `systemctl status ec-fan-profile` and `journalctl -b -u ec-fan-profile`, then `systemctl restart ec-fan-profile` or converge `just ec-fan --limit <host>` (the converge restarts it when the fans are off the profile). Runbook: docs/runbooks/node-maintenance.md \"EC fan curve\"."
  - interval: 1m
    name: a fan dropped from the profile (auto by design), fan3 (not managed) on auto, and a restart blip do not warn
    input_series:
      - series: 'ec_fan_mode_info{job="proxmox-node", instance="192.168.0.2:9100", fan="2", mode="auto"}'
        values: "1x30"
      - series: 'ec_fan_managed{job="proxmox-node", instance="192.168.0.2:9100", fan="2"}'
        values: "0x30"
      - series: 'ec_fan_mode_info{job="proxmox-node", instance="192.168.0.2:9100", fan="3", mode="auto"}'
        values: "1x30"
      - series: 'ec_fan_mode_info{job="proxmox-node", instance="192.168.0.2:9100", fan="1", mode="auto"}'
        values: "_x5 1x2 _x23"
      - series: 'ec_fan_mode_info{job="proxmox-node", instance="192.168.0.2:9100", fan="1", mode="curve"}'
        values: "1x5 _x2 1x23"
      - series: 'ec_fan_managed{job="proxmox-node", instance="192.168.0.2:9100", fan="1"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: ProxmoxCpuFanNotOnCurve
        exp_alerts: []
  - interval: 1m
    name: every managed CPU fan on the curve does not warn
    input_series:
      - series: 'ec_fan_mode_info{job="proxmox-node", instance="192.168.0.2:9100", fan="1", mode="curve"}'
        values: "1x30"
      - series: 'ec_fan_mode_info{job="proxmox-node", instance="192.168.0.2:9100", fan="2", mode="curve"}'
        values: "1x30"
      - series: 'ec_fan_managed{job="proxmox-node", instance="192.168.0.2:9100", fan="1"}'
        values: "1x30"
      - series: 'ec_fan_managed{job="proxmox-node", instance="192.168.0.2:9100", fan="2"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: ProxmoxCpuFanNotOnCurve
        exp_alerts: []

  # ------------------------------------------------------------- ProxmoxEcFanDriverNotLoaded
  - interval: 1m
    name: a fresh file saying the module is not loaded warns after 10m
    input_series:
      - series: 'ec_fan_driver_loaded{job="proxmox-node", instance="192.168.0.2:9100"}'
        values: "1x5 0x20"
    alert_rule_test:
      - eval_time: 14m
        alertname: ProxmoxEcFanDriverNotLoaded
        exp_alerts: []
      - eval_time: 17m
        alertname: ProxmoxEcFanDriverNotLoaded
        exp_alerts:
          - exp_labels:
              severity: warning
              job: proxmox-node
              instance: 192.168.0.2:9100
            exp_annotations:
              summary: "Proxmox host 192.168.0.2:9100: ec_su_axb35 is not loaded, the CPU-fan curve is off"
              description: "The EC fan driver has not been loaded on 192.168.0.2:9100 for 10m. The fans run on the firmware curve, which is safe, but the CPU-fan curve is off and there are no fan rpm series to alert on. Usually a new kernel booted without the module: check `dkms status ec_su_axb35`, `dpkg -l proxmox-headers-$(uname -r)` and `journalctl -b -u systemd-modules-load -u ec-fan-profile`, then converge `just ec-fan --limit <host>`. Runbook: docs/runbooks/node-maintenance.md \"EC fan curve\"."
  - interval: 1m
    name: a module reload shorter than 10m does not warn
    input_series:
      - series: 'ec_fan_driver_loaded{job="proxmox-node", instance="192.168.0.2:9100"}'
        values: "1x5 0x2 1x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: ProxmoxEcFanDriverNotLoaded
        exp_alerts: []
