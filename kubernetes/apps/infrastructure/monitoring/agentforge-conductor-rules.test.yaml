        exp_alerts: []
      - eval_time: 4000m
        alertname: ForgeConductCeilingHolding
        exp_alerts: []
      # the recurrence: its last pass was three days ago, so the day before the window is quiet
      - eval_time: 4630m
        alertname: ForgeConductCeilingHolding
        exp_alerts: *ceiling_holding
      # 5100m: def counts the state on; abc's steps are in the window too, and the day before the
      # window holds abc's — one fleet-wide announcement, not a new pod's
      - eval_time: 5100m
        alertname: ForgeConductCeilingHolding
        exp_alerts: *ceiling_holding
      - eval_time: 6055m
        alertname: ForgeConductCeilingHolding
        exp_alerts: *ceiling_holding
      # 6065m: the recurrence's first step (4625m) is in the day before; the rollout did not reset it
      - eval_time: 6070m
        alertname: ForgeConductCeilingHolding
        exp_alerts: []
      - eval_time: 9000m
        alertname: ForgeConductCeilingHolding
        exp_alerts: []

  # ── ForgeConductQuietReasonUnrecognised ──────────────────────────────────────────────────────
  # The sensor rule's three cases, on the quiet counter: pre-touched, so the first occurrence is
