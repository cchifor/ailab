  # ── ForgeConductIssueExhausted / ForgeConductCeilingHolding ──────────────────────────────────
  #
  # One input, both rules, each reason driven while the other holds still: the two read the same
  # counter by reason and a fixture feeding each its own series could not tell `reason="exhausted"`
  # from a rule over the whole family. The counter is pre-touched at 0 for every reason, so every
  # series is present from boot; a state that holds is counted on EVERY pass, one step per 300s.
  # The last two cases are the ones the standing-state shape turns on: a state held for ten days is
  # announced for one (the one-clause form was up for all ten), a state that recurs three days
  # after it ended is announced again, and a rollout mid-state is not a second announcement.
  - interval: 1m
    name: an exhausted issue fires from its first pass and clears a day after its last
    input_series:
      # Exhausted from 10m to 25m (four passes), then the operator closes the issue.
      - series: 'forge_conduct_park_quiet_total{reason="exhausted", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "0+0x9 1+0x4 2+0x4 3+0x4 4+0x1500"
      - series: 'forge_conduct_park_quiet_total{reason="ceiling", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "0+0x1520"
      - series: 'forge_conduct_park_quiet_total{reason="unchanged", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "0+0x9 5+0x4 10+0x4 15+0x4 20+0x4 25+0x4 30+0x4 35+0x4 40+0x1480"
    alert_rule_test:
      - eval_time: 8m
        alertname: ForgeConductIssueExhausted
        exp_alerts: []
      - eval_time: 12m
        alertname: ForgeConductIssueExhausted
        exp_alerts: &issue_exhausted
          - exp_labels: { severity: info }
            exp_annotations:
              summary: "AgentForge conductor has a filed issue it can never settle — close it by hand"
              description: >-
                forge_conduct_park_quiet_total{reason="exhausted"} advanced in the last 24h and not in the day before: a filed issue's fingerprint recurred after its resolution with no room under the lifetime ceiling (three own comments) for a recurrence finding and a resolution after it — or a resolution itself had no room — so the filer posts nothing on it and files no successor while it stays open. The conductor's pass line names the fingerprint (`exhausted=`). Close the issue: the next pass on which the finding recurs files a fresh one. This is the state's first day only — it clears a day after the state began whether or not the issue is closed, and the pass line carries the to-do until it is.
      # 20h in: the issue was closed long ago and the last exhausted pass is still inside the day
      - eval_time: 1200m
        alertname: ForgeConductIssueExhausted
        exp_alerts: *issue_exhausted
      # a day and a bit after the last exhausted pass: gone
      - eval_time: 1470m
        alertname: ForgeConductIssueExhausted
        exp_alerts: []
      # the ceiling counter never moved, whatever the other reasons did
      - eval_time: 12m
        alertname: ForgeConductCeilingHolding
        exp_alerts: []
      - eval_time: 1200m
        alertname: ForgeConductCeilingHolding
        exp_alerts: []

  - interval: 1m
    name: a park at the lifetime ceiling fires the ceiling rule and not the exhausted one
    input_series:
      - series: 'forge_conduct_park_quiet_total{reason="ceiling", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "0+0x9 1+0x4 2+0x4 3+0x4 4+0x1500"
