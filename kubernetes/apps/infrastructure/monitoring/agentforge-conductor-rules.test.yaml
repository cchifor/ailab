        exp_alerts: []

  - interval: 5m
    name: a ceiling that recurs three days later is announced again, and a rollout mid-state is not
    input_series:
      # Pod abc: at the ceiling from 60m to 305m (fifty passes), the park then acted on; a fresh
      # ceiling from 4625m, and the pod is rolled at 5000m. Pod def boots at 5005m mid-state, its
      # counter pre-touched at 0, and counts the same standing state on.
      - series: 'forge_conduct_park_quiet_total{reason="ceiling", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "0+0x11 1+1x48 50+0x863 51+1x76 _x2000"
      - series: 'forge_conduct_park_quiet_total{reason="ceiling", namespace="agentforge", pod="agentforge-conductor-def", instance="10.42.0.9:9464", job="monitoring/agentforge-conductor"}'
        values: "_x1001 0 1+1x2000"
    alert_rule_test:
      - eval_time: 100m
