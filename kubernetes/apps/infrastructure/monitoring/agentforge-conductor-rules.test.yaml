      - eval_time: 1470m
        alertname: ForgeConductCeilingHolding
        exp_alerts: []
      - eval_time: 12m
        alertname: ForgeConductIssueExhausted
        exp_alerts: []

  - interval: 5m
    name: a ceiling held for ten days is announced for one
    input_series:
      # A park at the ceiling on every pass for ten days, one step per pass. The 5m grid is the
      # pass cadence, so the counter steps on every sample; the exhausted reason holds still.
      - series: 'forge_conduct_park_quiet_total{reason="ceiling", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "0 1+1x2900"
