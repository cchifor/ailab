# `promtool test rules` fixtures for agentforge-conductor-rules.yaml. Run by scripts/rules-lint.sh on
# every PR, after `promtool check rules`.
#
# WHY THIS FILE EXISTS. `check rules` proves an expression PARSES. It cannot prove the expression names
# a series that exists, and an expression over a non-existent series is an empty vector that never
# fires — which is the exact way this repo's five agentforge rules sat inert against a job with zero
# targets. Every series name below is spelled the way the conductor's registry actually exports it,
# with `_total` on the counters, so a rule written against the `collect()` family spelling would
# evaluate to nothing here and fail the "fires" assertion rather than passing silently.
#
# The second reason: every window in that file is sized off the 300s pass cadence — and the failure mode
# runs in BOTH directions. Too tight and the rule fires on a healthy conductor; too short and it cannot
# fire on a sick one. This file shipped with the second kind and said the opposite: its
# ForgeConductPassesFailing case drove one failure every 5 minutes and called that "the real shape of a
# conductor whose pass keeps raising", when `backoff_seconds` makes two failures 5 minutes apart
# impossible — the loop waits 600s after the first and 1200s after every one thereafter. The case has
# been replaced by one at the cadence the loop actually produces, and the window it exercises is now
# [2h] rather than [30m], which is what makes the rule reachable at all. A fixture whose input the
# production code cannot generate proves nothing, however green it is.
#
# `rule_files` is the extracted spec basename, because rules-lint.sh hands promtool the `spec:` body of
# each PrometheusRule under the manifest's name (the CRD wrapper is not a promtool rules file).
rule_files:
  - agentforge-conductor-rules.yaml

evaluation_interval: 1m

tests:
  # ── ForgeConductDown ──────────────────────────────────────────────────────────────────────────
  - interval: 1m
    name: a Ready conductor publishing no metrics is unscraped
    input_series:
      - series: 'kube_pod_container_status_ready{namespace="agentforge", pod="agentforge-conductor-abc", container="conductor"}'
        values: "1+0x40"
      # no forge_conduct_writes_total at all — the anti-join's right side is empty
    alert_rule_test:
      - eval_time: 25m
        alertname: ForgeConductDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: agentforge
              pod: agentforge-conductor-abc
            exp_annotations:
              summary: "AgentForge conductor agentforge/agentforge-conductor-abc is unscraped (no forge_conduct_* metrics)"
              description: "The conductor container is Ready but publishes no forge_conduct_* series, so every other conductor alert is an empty vector and the estate is unobserved without saying so. Check the PodMonitor binds the container port NAMED metrics (9464, the conductor's own registry) and not probe (8720, which serves /healthz and /readyz only), and that the CiliumNetworkPolicy admits the monitoring namespace to 9464."

  - interval: 1m
    name: a scraped conductor is not unscraped — including one that has never written
    input_series:
      - series: 'kube_pod_container_status_ready{namespace="agentforge", pod="agentforge-conductor-abc", container="conductor"}'
        values: "1+0x40"
      # 0 for the whole window: this is the T0 case, and it must NOT look like absence. An unlabelled
      # counter is exported at 0.0 from construction, which is precisely why it is the marker.
      - series: 'forge_conduct_writes_total{namespace="agentforge", pod="agentforge-conductor-abc"}'
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 25m
        alertname: ForgeConductDown
        exp_alerts: []

  # ── ForgeConductBlind ─────────────────────────────────────────────────────────────────────────
  - interval: 1m
    name: passes returning but never observing the estate
    input_series:
      # stamped once at t=0 and never again: passes are running but all coming back incomplete
      - series: 'forge_conduct_last_pass_timestamp'
        values: "0+0x60"
      - series: 'forge_conduct_passes_total{outcome="incomplete"}'
        values: "1+1x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: ForgeConductBlind
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "AgentForge conductor has not completed a pass in 2700s"
              description: "The conductor is up and its passes are returning, but none has observed the estate completely in over six pass intervals. The per-sensor counter forge_conduct_sensor_incomplete_total says which read is coming back short."

  # ── ForgeConductPassesFailing ─────────────────────────────────────────────────────────────────
  #
  # THREE CASES, because the first version of this fixture had only the quiet one and that is how a
  # rule that could never fire passed review. Both reviewers of PR #674 named it: the loop's own
  # backoff (`backoff_seconds` = interval * 2 ** min(failures, 2)) settles a sustained failure run at
  # ONE failed pass per 1200s, so the [30m] window this shipped with could hold at most 1.5 of them
  # and `> 2` was unreachable in precisely the regime the alert exists for. A fixture that only
  # asserts silence cannot tell "correctly quiet" from "structurally mute".
  - interval: 1m
    name: a healthy conductor at the 300s cadence does not trip the failure rule
    input_series:
      # six passes in 30m, every one of them fine — the shape of a perfectly healthy conductor
      - series: 'forge_conduct_passes_total{outcome="complete"}'
        values: "0+1x40"
      - series: 'forge_conduct_passes_total{outcome="failed"}'
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: ForgeConductPassesFailing
        exp_alerts: []

  - interval: 1m
    name: a sustained failure run AT THE BACKED-OFF CADENCE fires
    input_series:
      # The cadence the loop actually produces once it is failing: `backoff_seconds(300, n)` is
      # 300*2**min(n,2), so the failures land at t=0, +600s, then +1200s apart forever — 0, 10m, 30m,
      # 50m, 70m, 90m, 110m. This is the series a real outage writes, not one failure every 5 minutes
      # (which the backoff makes impossible).
      - series: 'forge_conduct_passes_total{outcome="failed"}'
        values: "1+0x9 2+0x19 3+0x19 4+0x19 5+0x19 6+0x19 7+0x19 8+0x19"
      # nothing completes during the run — the reason ForgeConductBlind is the neighbouring rule
      - series: 'forge_conduct_passes_total{outcome="complete"}'
        values: "0+0x149"
    alert_rule_test:
      - eval_time: 15m
        alertname: ForgeConductPassesFailing
        exp_alerts: [] # two failures in: still one transient away from meaning anything
      - eval_time: 75m
        alertname: ForgeConductPassesFailing
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "AgentForge conductor: 4 passes raised in the last 2h"
              description: "Passes are raising rather than returning incomplete, which the loop absorbs into its backoff. Check the conductor's logs for the traceback. The window is 2h BECAUSE of that backoff: a sustained run settles at one failed pass per four intervals (1200s at the 300s default), so three failures take roughly 50 minutes to accrue and a shorter window could not hold enough of them to fire at all."

  - interval: 1m
    name: two isolated failures two hours apart stay quiet
    input_series:
      # The loop recovers between them (consecutive_failures resets on success), so this is the shape
      # of ordinary transient forge flakiness rather than an outage. `> 2` is what separates them.
      - series: 'forge_conduct_passes_total{outcome="failed"}'
        values: "1+0x59 2+0x90"
      - series: 'forge_conduct_passes_total{outcome="complete"}'
        values: "1+1x149"
    alert_rule_test:
      - eval_time: 75m
        alertname: ForgeConductPassesFailing
        exp_alerts: []
      - eval_time: 145m
        alertname: ForgeConductPassesFailing
        exp_alerts: []

  # ── ForgeConductUnexpectedWrites ──────────────────────────────────────────────────────────────
  - interval: 1m
    name: a write at T0 means the tier is no longer observe
    input_series:
      - series: 'forge_conduct_writes_total'
        values: "0+0x20 1+0x20"
    alert_rule_test:
      - eval_time: 35m
        alertname: ForgeConductUnexpectedWrites
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "AgentForge conductor wrote to the forge while T0 expects none"
              description: "forge_conduct_writes_total advanced. At AF_CONDUCT_TIER=observe the write door refuses before reaching the forge, so this means the deployed tier is no longer observe. Confirm the Deployment's AF_CONDUCT_TIER and whether an arming rung landed."

  - interval: 1m
    name: a conductor that never writes does not trip the posture rule
    input_series:
      - series: 'forge_conduct_writes_total'
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: ForgeConductUnexpectedWrites
        exp_alerts: []

  # ── ForgeConductSensorUnrecognised ────────────────────────────────────────────────────────────
  #
  # The reserved bucket only means something if a rule reads it, and the rule only means something
  # if it can tell "this is happening" from "this happened once, ever" — the counter is pre-touched
  # to 0 at construction, so a bare `> 0` on the raw series would latch on the first occurrence and
  # never clear.
  - interval: 1m
    name: an unattributable incomplete read fires
    input_series:
      - series: 'forge_conduct_sensor_incomplete_total{sensor="unrecognised"}'
        values: "0+0x10 1+1x40"
      - series: 'forge_conduct_sensor_incomplete_total{sensor="issue"}'
        values: "0+0x50"
    alert_rule_test:
      - eval_time: 35m
        alertname: ForgeConductSensorUnrecognised
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "AgentForge conductor counted an incomplete read it cannot attribute to a sensor"
              description: "forge_conduct_sensor_incomplete_total advanced on the reserved `unrecognised` label, which means a pass came back short on a sensor that CONDUCT_SENSORS (agentforge infra/conduct_metrics.py) does not declare. The count is real; the attribution is missing, so T0's "sensor_incomplete explained per sensor" cannot be satisfied while this fires. Fix in the ENGINE, not here - add the sensor to CONDUCT_SENSORS and add its own case to this file in the same change, so a declared sensor never lacks a rule and a rule never lacks a declared sensor. The engine's own AST pin should have caught this before it shipped, so also check why it did not: it reads sensor keys written as string literals in conduct_pass and cannot see one that is computed."

  - interval: 1m
    name: a declared sensor coming back short is not this alert
    input_series:
      # the ordinary case this rule must stay out of: `parked` is DECLARED, so its count is
      # attributable and ForgeConductBlind/the per-sensor view own it
      - series: 'forge_conduct_sensor_incomplete_total{sensor="parked"}'
        values: "0+2x40"
      - series: 'forge_conduct_sensor_incomplete_total{sensor="unrecognised"}'
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: ForgeConductSensorUnrecognised
        exp_alerts: []

  - interval: 1m
    name: a single historical occurrence does not latch the alert forever
    input_series:
      - series: 'forge_conduct_sensor_incomplete_total{sensor="unrecognised"}'
        values: "0+0x5 3+0x90"
    alert_rule_test:
      - eval_time: 20m
        alertname: ForgeConductSensorUnrecognised
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "AgentForge conductor counted an incomplete read it cannot attribute to a sensor"
              description: "forge_conduct_sensor_incomplete_total advanced on the reserved `unrecognised` label, which means a pass came back short on a sensor that CONDUCT_SENSORS (agentforge infra/conduct_metrics.py) does not declare. The count is real; the attribution is missing, so T0's "sensor_incomplete explained per sensor" cannot be satisfied while this fires. Fix in the ENGINE, not here - add the sensor to CONDUCT_SENSORS and add its own case to this file in the same change, so a declared sensor never lacks a rule and a rule never lacks a declared sensor. The engine's own AST pin should have caught this before it shipped, so also check why it did not: it reads sensor keys written as string literals in conduct_pass and cannot see one that is computed."
      - eval_time: 90m
        alertname: ForgeConductSensorUnrecognised
        exp_alerts: [] # the step has aged out of the window; a raw `> 0` would still be firing
