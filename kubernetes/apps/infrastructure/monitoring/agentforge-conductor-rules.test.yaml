        alertname: ForgeConductQuietReasonUnrecognised
        exp_alerts: &quiet_unrecognised
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "AgentForge conductor withheld a comment for a reason it cannot name"
              description: "forge_conduct_park_quiet_total advanced on the reserved `unrecognised` label: a lane or the filer withheld a lifecycle comment for a reason outside CONDUCT_QUIET_REASONS (agentforge infra/conduct_metrics.py). The count is real and the attribution is missing, so the T1 comments-per-issue criterion — which reads reason=ceiling and reason=exhausted — cannot be trusted while this fires. Fix in the ENGINE: add the reason to the vocabulary, and a rule here if it needs one, in the same change; then check why the engine's own pin over every Quiet(...) the conductor spells did not catch it first."
  - interval: 1m
    name: a declared quiet reason advancing is not this alert
    input_series:
      - series: 'forge_conduct_park_quiet_total{reason="held", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "0+2x40"
      - series: 'forge_conduct_park_quiet_total{reason="unrecognised", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: ForgeConductQuietReasonUnrecognised
        exp_alerts: []
  - interval: 1m
    name: a single historical unrecognised quiet reason does not latch the alert forever
    input_series:
      - series: 'forge_conduct_park_quiet_total{reason="unrecognised", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "0+0x5 3+0x90"
    alert_rule_test:
      - eval_time: 20m
        alertname: ForgeConductQuietReasonUnrecognised
        exp_alerts: *quiet_unrecognised
      - eval_time: 90m
        alertname: ForgeConductQuietReasonUnrecognised
        exp_alerts: []

  # ── ForgeConductRefusalUnrecognised ───────────────────────────────────────────────────────────
  # NOT pre-touched: the reserved child is minted by its first refusal, at 1, and the first case
  # holds what the rule's comment says that costs — quiet on the mint, up on the second refusal.
  - interval: 1m
    name: a refusal for a reason that is not a word fires on its second occurrence
    input_series:
      # minted at 10m by the first refusal; the proposal recurs and is refused again at 15m
      - series: 'forge_conduct_refusals_total{reason="unrecognised", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "_x10 1+0x4 2+0x40"
    alert_rule_test:
      # 14m: the mint is a first sample, not a change
      - eval_time: 14m
        alertname: ForgeConductRefusalUnrecognised
        exp_alerts: []
      - eval_time: 20m
        alertname: ForgeConductRefusalUnrecognised
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "AgentForge conductor's write door refused for a reason it cannot name"
              description: "forge_conduct_refusals_total advanced on the reserved `unrecognised` label: the door refused a write for a reason outside the word shape CONDUCT_REASON_SHAPE (agentforge infra/conduct_metrics.py). Every refusal reason is a literal in conductor.mutate, so one that is not a word was built from something read off the estate. The count is real and the reason is missing from the series; the conductor's pass line carries the refusals by reason as the door spelled them. Fix in the ENGINE."
      # 50m: the last step at 15m has aged out of [30m]
      - eval_time: 50m
        alertname: ForgeConductRefusalUnrecognised
        exp_alerts: []
  - interval: 1m
    name: a refusal the door can name, and one unrecognised refusal ever, are not this alert
    input_series:
      - series: 'forge_conduct_refusals_total{reason="tier", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "0+3x40"
      # minted once and never moved again: the stated residue, and the series itself is the fact
      - series: 'forge_conduct_refusals_total{reason="unrecognised", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "_x10 1+0x30"
    alert_rule_test:
      - eval_time: 35m
        alertname: ForgeConductRefusalUnrecognised
        exp_alerts: []

  # ── ForgeConductFilingOverBudget ──────────────────────────────────────────────────────────────
  # PASSES, not refusals: the cases hold one wide pass quiet and three narrow ones loud, and a
  # restart's drop is taken back. The child is minted by the first budget refusal in the pod's life
  # (never 0), so the first starved pass is a first sample and no change.
  - interval: 1m
    name: a door refusing on budget pass after pass fires on the third pass it can count
    input_series:
      # Starved from 10m: four refused at 10m (the mint), three more on each of the next three
      # passes, a breather, and a fourth starved pass at 40m.
      - series: 'forge_conduct_refusals_total{reason="budget", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "_x10 4+0x4 7+0x4 10+0x4 13+0x14 16+0x40"
    alert_rule_test:
      # 24m: two changes (15m, 20m) — the mint at 10m is not one
      - eval_time: 24m
        alertname: ForgeConductFilingOverBudget
        exp_alerts: []
      # 29m: three changes since 25m, hold not up; 30m: up
      - eval_time: 29m
        alertname: ForgeConductFilingOverBudget
        exp_alerts: []
      - eval_time: 31m
        alertname: ForgeConductFilingOverBudget
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "AgentForge conductor's write door refused on budget on 3 passes in the last hour — the sweep is starved"
              description: >-
                forge_conduct_refusals_total{reason="budget"} moved on at least three passes of the last hour: pass after pass the lanes and the filer propose more than the door's per-pass budget (max_writes_per_pass mutations, max_new_issues_per_pass filings) admits, so the rest is carried to the next pass and never drains. Read the conductor's pass line for what is being proposed — a storm of findings on one detector, or a backlog of parks to diagnose — before raising the budget; a budget raised for a storm is the storm let through.
      - eval_time: 45m
        alertname: ForgeConductFilingOverBudget
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "AgentForge conductor's write door refused on budget on 4 passes in the last hour — the sweep is starved"
              description: >-
                forge_conduct_refusals_total{reason="budget"} moved on at least three passes of the last hour: pass after pass the lanes and the filer propose more than the door's per-pass budget (max_writes_per_pass mutations, max_new_issues_per_pass filings) admits, so the rest is carried to the next pass and never drains. Read the conductor's pass line for what is being proposed — a storm of findings on one detector, or a backlog of parks to diagnose — before raising the budget; a budget raised for a storm is the storm let through.
  - interval: 1m
    name: one wide pass over budget is a burst, not starvation
    input_series:
      # a series that existed (one old refusal), then a single pass refusing eight
      - series: 'forge_conduct_refusals_total{reason="budget", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "1+0x9 9+0x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: ForgeConductFilingOverBudget
        exp_alerts: []
      - eval_time: 65m
        alertname: ForgeConductFilingOverBudget
        exp_alerts: []
  - interval: 1m
    name: a restart between two starved passes is not a third
    input_series:
      # minted at 10m, a second starved pass at 15m, a container restart at 20m (the child is gone
      # until its next refusal), re-minted at 25m: changes() reads the drop as a third and resets()
      # takes it back.
      - series: 'forge_conduct_refusals_total{reason="budget", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "_x10 4+0x4 7+0x4 _x5 3+0x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: ForgeConductFilingOverBudget
        exp_alerts: []

  # ── the retirement records: agentforge:conduct_parks_legacy:sum, :conduct_parks:sum, ─────────
  #    :conduct_parks_legacy_zero_since:timestamp_seconds
  #
  # THE GAUGE IS FED AS THE ENGINE REBUILDS IT: every cell over a bound repo present, the legacy
  # cell at 0 and never absent while a pass reports, and ALL cells gone when a pass cannot report or
  # a pod is gone. The scrape interval here is 5m so a week is two thousand samples rather than ten;
  # the records' `last_over_time(...[30m])` sees every one of them. These are promql_expr_tests over
  # the recorded series — there is no alert to assert — and the week is asserted through the one
  # reading the rule comment documents: `time() - ...since... >= 7 * 24 * 3600`, counted so the
  # assertion is "up" or "not" rather than a number of seconds. The four cases hold the four things
  # the week turns on: a rollout gap shorter than the bridge is carried (and the two pods' cells
  # are not summed twice); a legacy park seen restarts the week from its last reading; a gap longer
  # than the bridge restarts it; and an estate with no parks at all never starts it. The since
  # value is a timestamp on the fixture's clock, minutes from 0 in seconds, and it lands one
  # evaluation interval (1m here) after the last reading that broke the run.
  - interval: 5m
    name: a week of zero legacy parks, carried across a rollout, is the retirement
    input_series:
      # Pod abc reports for three days (its last sample at 4320m) and is gone; pod def's first
      # pass reports at 4335m — a fifteen-minute gap the bridge carries.
      - series: 'forge_conduct_parks{repo="cchifor/platform", prognosis="PARK-DIAGNOSED", origin="legacy", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "0+0x864 _x1300"
      - series: 'forge_conduct_parks{repo="cchifor/platform", prognosis="PARK-DIAGNOSED", origin="engine", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "2+0x864 _x1300"
      - series: 'forge_conduct_parks{repo="cchifor/platform", prognosis="PARK-UNKNOWN", origin="none", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "1+0x864 _x1300"
      - series: 'forge_conduct_parks{repo="cchifor/platform", prognosis="PARK-DIAGNOSED", origin="legacy", namespace="agentforge", pod="agentforge-conductor-def", instance="10.42.0.9:9464", job="monitoring/agentforge-conductor"}'
        values: "_x867 0+0x1300"
      - series: 'forge_conduct_parks{repo="cchifor/platform", prognosis="PARK-DIAGNOSED", origin="engine", namespace="agentforge", pod="agentforge-conductor-def", instance="10.42.0.9:9464", job="monitoring/agentforge-conductor"}'
        values: "_x867 2+0x1300"
      - series: 'forge_conduct_parks{repo="cchifor/platform", prognosis="PARK-UNKNOWN", origin="none", namespace="agentforge", pod="agentforge-conductor-def", instance="10.42.0.9:9464", job="monitoring/agentforge-conductor"}'
        values: "_x867 1+0x1300"
    promql_expr_test:
      # inside the gap: the bridge carries abc's last reading, and the run has not broken
      - eval_time: 4330m
        expr: 'agentforge:conduct_parks:sum'
        exp_samples: [{labels: 'agentforge:conduct_parks:sum', value: 3}]
      # 4340m: abc's cells are still inside the bridge beside def's — three parks, not six
      - eval_time: 4340m
        expr: 'agentforge:conduct_parks:sum'
        exp_samples: [{labels: 'agentforge:conduct_parks:sum', value: 3}]
      - eval_time: 4340m
        expr: 'agentforge:conduct_parks_legacy:sum'
        exp_samples: [{labels: 'agentforge:conduct_parks_legacy:sum', value: 0}]
      # the run began at the first evaluation and was never broken — not by the rollout
      - eval_time: 4340m
        expr: 'agentforge:conduct_parks_legacy_zero_since:timestamp_seconds'
        exp_samples: [{labels: 'agentforge:conduct_parks_legacy_zero_since:timestamp_seconds', value: 0}]
      # five minutes short of the week
      - eval_time: 10075m
        expr: 'count(time() - agentforge:conduct_parks_legacy_zero_since:timestamp_seconds >= 7 * 24 * 3600)'
        exp_samples: []
      - eval_time: 10085m
        expr: 'count(time() - agentforge:conduct_parks_legacy_zero_since:timestamp_seconds >= 7 * 24 * 3600)'
        exp_samples: [{labels: '{}', value: 1}]
      # and it stays up
      - eval_time: 10800m
        expr: 'count(time() - agentforge:conduct_parks_legacy_zero_since:timestamp_seconds >= 7 * 24 * 3600)'
        exp_samples: [{labels: '{}', value: 1}]
  - interval: 5m
    name: a legacy park seen on day two restarts the week from its last reading
    input_series:
      # One legacy park classified from day 1 to day 1.5 (1440m to 2160m), then gone: the run
      # restarts at 2164m, the evaluation after the last reading of 1, and the week is up at 12245m.
      - series: 'forge_conduct_parks{repo="cchifor/platform", prognosis="PARK-DIAGNOSED", origin="legacy", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "0+0x287 1+0x144 0+0x2100"
      - series: 'forge_conduct_parks{repo="cchifor/platform", prognosis="PARK-DIAGNOSED", origin="engine", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "2+0x2532"
    promql_expr_test:
      - eval_time: 2000m
        expr: 'agentforge:conduct_parks_legacy:sum'
        exp_samples: [{labels: 'agentforge:conduct_parks_legacy:sum', value: 1}]
      # while the legacy park is read the run is "now", every evaluation
      - eval_time: 2000m
        expr: 'agentforge:conduct_parks_legacy_zero_since:timestamp_seconds'
        exp_samples: [{labels: 'agentforge:conduct_parks_legacy_zero_since:timestamp_seconds', value: 120000}]
      - eval_time: 2165m
        expr: 'agentforge:conduct_parks_legacy_zero_since:timestamp_seconds'
        exp_samples: [{labels: 'agentforge:conduct_parks_legacy_zero_since:timestamp_seconds', value: 129840}]
      - eval_time: 12250m
        expr: 'agentforge:conduct_parks_legacy_zero_since:timestamp_seconds'
        exp_samples: [{labels: 'agentforge:conduct_parks_legacy_zero_since:timestamp_seconds', value: 129840}]
      - eval_time: 10085m
        expr: 'count(time() - agentforge:conduct_parks_legacy_zero_since:timestamp_seconds >= 7 * 24 * 3600)'
        exp_samples: []
      - eval_time: 12235m
        expr: 'count(time() - agentforge:conduct_parks_legacy_zero_since:timestamp_seconds >= 7 * 24 * 3600)'
        exp_samples: []
      - eval_time: 12250m
        expr: 'count(time() - agentforge:conduct_parks_legacy_zero_since:timestamp_seconds >= 7 * 24 * 3600)'
        exp_samples: [{labels: '{}', value: 1}]
  - interval: 5m
    name: a gap longer than the bridge is not knowing, and restarts the week
    input_series:
      # The gauge is empty from 1445m to 1480m — eight passes that could not report their parks,
      # or a rollout that took forty minutes — which is past the thirty-minute bridge: the sums are
      # absent from 1470m, the run restarts at 1484m, and the week is up at 11565m.
      - series: 'forge_conduct_parks{repo="cchifor/platform", prognosis="PARK-DIAGNOSED", origin="legacy", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "0+0x288 _x8 0+0x2100"
      - series: 'forge_conduct_parks{repo="cchifor/platform", prognosis="PARK-DIAGNOSED", origin="engine", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "2+0x288 _x8 2+0x2100"
    promql_expr_test:
      - eval_time: 1465m
        expr: 'agentforge:conduct_parks:sum'
        exp_samples: [{labels: 'agentforge:conduct_parks:sum', value: 2}]
      - eval_time: 1470m
        expr: 'agentforge:conduct_parks:sum'
        exp_samples: []
      - eval_time: 1470m
        expr: 'agentforge:conduct_parks_legacy_zero_since:timestamp_seconds'
        exp_samples: [{labels: 'agentforge:conduct_parks_legacy_zero_since:timestamp_seconds', value: 88200}]
      - eval_time: 1485m
        expr: 'agentforge:conduct_parks_legacy_zero_since:timestamp_seconds'
        exp_samples: [{labels: 'agentforge:conduct_parks_legacy_zero_since:timestamp_seconds', value: 89040}]
      - eval_time: 10085m
        expr: 'count(time() - agentforge:conduct_parks_legacy_zero_since:timestamp_seconds >= 7 * 24 * 3600)'
        exp_samples: []
      - eval_time: 11560m
        expr: 'count(time() - agentforge:conduct_parks_legacy_zero_since:timestamp_seconds >= 7 * 24 * 3600)'
        exp_samples: []
      - eval_time: 11565m
        expr: 'count(time() - agentforge:conduct_parks_legacy_zero_since:timestamp_seconds >= 7 * 24 * 3600)'
        exp_samples: [{labels: '{}', value: 1}]
  - interval: 5m
    name: an estate with no parks at all says nothing about the legacy reader
    input_series:
      # every cell present and zero for well over a week: the parks conjunct is false throughout,
      # so the run is "now" at every evaluation and the week never starts
      - series: 'forge_conduct_parks{repo="cchifor/platform", prognosis="PARK-DIAGNOSED", origin="legacy", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "0+0x2120"
      - series: 'forge_conduct_parks{repo="cchifor/platform", prognosis="PARK-DIAGNOSED", origin="engine", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "0+0x2120"
      - series: 'forge_conduct_parks{repo="cchifor/platform", prognosis="PARK-UNKNOWN", origin="none", namespace="agentforge", pod="agentforge-conductor-abc", instance="10.42.0.7:9464", job="monitoring/agentforge-conductor"}'
        values: "0+0x2120"
    promql_expr_test:
      - eval_time: 10500m
        expr: 'agentforge:conduct_parks:sum'
        exp_samples: [{labels: 'agentforge:conduct_parks:sum', value: 0}]
      - eval_time: 10500m
        expr: 'agentforge:conduct_parks_legacy_zero_since:timestamp_seconds'
        exp_samples: [{labels: 'agentforge:conduct_parks_legacy_zero_since:timestamp_seconds', value: 630000}]
      - eval_time: 10500m
        expr: 'count(time() - agentforge:conduct_parks_legacy_zero_since:timestamp_seconds >= 7 * 24 * 3600)'
        exp_samples: []
