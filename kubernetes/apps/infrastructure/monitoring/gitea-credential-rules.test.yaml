            exp_annotations:
              summary: "Gitea credential inventory series missing: cnpg_gitea_credentials_oauth_grants for gitea_admin"
              description: *d_missing

  # ----------------------------------------------- inventory missing: one family
  # The age family is gone for EVERY owner (a renamed column, say) while the rest of the inventory is
  # present: one alert per owner, family named.
  - interval: 1m
    name: a missing metric family fires per owner while the other families are present
    input_series:
      - *s_tok_cchifor
      - *s_nal_cchifor
      - *s_grt_cchifor
      - *s_tok_chifor
      - *s_nal_chifor
      - *s_grt_chifor
      - *s_tok_admin
      - *s_nal_admin
      - *s_grt_admin
      - *s_site
    alert_rule_test:
      - eval_time: 29m
        alertname: GiteaCredentialInventoryMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: GiteaCredentialInventoryMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: databases
              owner: cchifor
              family: cnpg_gitea_credentials_oldest_token_age_seconds
            exp_annotations:
              summary: "Gitea credential inventory series missing: cnpg_gitea_credentials_oldest_token_age_seconds for cchifor"
              description: *d_missing
          - exp_labels:
              severity: warning
              namespace: databases
              owner: chifor
              family: cnpg_gitea_credentials_oldest_token_age_seconds
            exp_annotations:
              summary: "Gitea credential inventory series missing: cnpg_gitea_credentials_oldest_token_age_seconds for chifor"
              description: *d_missing
          - exp_labels:
              severity: warning
              namespace: databases
              owner: gitea_admin
              family: cnpg_gitea_credentials_oldest_token_age_seconds
            exp_annotations:
              summary: "Gitea credential inventory series missing: cnpg_gitea_credentials_oldest_token_age_seconds for gitea_admin"
              description: *d_missing

  # --------------------------------------- inventory missing: the site-admin count
  # The one family with no owner label. Its absence must fire (and GiteaAdminUserCountChanged, which
  # cannot see an absent series, must stay silent: that is exactly the gap this alert closes).
  - interval: 1m
    name: a missing site-admin count fires InventoryMissing and leaves the count rule silent
    input_series:
      - *s_tok_cchifor
      - *s_age_cchifor
      - *s_nal_cchifor
      - *s_grt_cchifor
      - *s_tok_chifor
      - *s_age_chifor
      - *s_nal_chifor
      - *s_grt_chifor
      - *s_tok_admin
      - *s_age_admin
      - *s_nal_admin
      - *s_grt_admin
    alert_rule_test:
      - eval_time: 29m
        alertname: GiteaCredentialInventoryMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: GiteaCredentialInventoryMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: databases
              family: cnpg_gitea_site_admins_total
            exp_annotations:
              summary: "Gitea credential inventory series missing: cnpg_gitea_site_admins_total"
              description: *d_missing
      - eval_time: 30m
        alertname: GiteaAdminUserCountChanged
        exp_alerts: []

  # ---------------------------------------------------- inventory missing: vanished
  # A series that WAS being exported and then stops (the query starts failing, the exporter dies):
  # chifor's token count goes away at minute 10 with the rest of the inventory still present. The
  # sample at minute 10 stays visible for the 5m lookback, so absent() is true from minute 15 and the
  # 30m hold ends at minute 45.
  - interval: 1m
    name: a series that vanishes mid-run fires 30m after it is gone
    input_series:
      - series: 'cnpg_gitea_credentials_tokens{namespace="databases",pod="infra-pg-6",owner="chifor"}'
        values: "0x10 _x60"
      - *s_tok_cchifor
      - *s_age_cchifor
      - *s_nal_cchifor
      - *s_grt_cchifor
      - *s_age_chifor
      - *s_nal_chifor
      - *s_grt_chifor
      - *s_tok_admin
      - *s_age_admin
      - *s_nal_admin
      - *s_grt_admin
      - *s_site
    alert_rule_test:
      - eval_time: 44m
        alertname: GiteaCredentialInventoryMissing
        exp_alerts: []
      - eval_time: 45m
        alertname: GiteaCredentialInventoryMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: databases
              owner: chifor
              family: cnpg_gitea_credentials_tokens
            exp_annotations:
              summary: "Gitea credential inventory series missing: cnpg_gitea_credentials_tokens for chifor"
              description: *d_missing
