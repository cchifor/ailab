# `promtool test rules` fixtures for gitea-credential-rules.yaml. Run by scripts/rules-lint.sh on
# every PR, after `promtool check rules`.
#
# WHY A FIXTURE: `check rules` proves an expression PARSES, not that it can ever be true, and a
# credential alert that cannot fire is worse than none (reviewbot-rules.test.yaml's header has the
# estate's two precedents). Every rule is therefore asserted BOTH ways: it fires on the shape it was
# written for, and it stays silent on the shape it must not page for.
#
# THE PROPERTY THIS FILE EXISTS TO PIN is the one GiteaCredentialInventoryMissing is for: a VALID ZERO
# is not a MISSING SERIES. An owner with no tokens still exports a row of zeros (the query LEFT JOINs
# from "user"), so the "valid zero rows" test must see NOTHING fire for an hour, while the "missing
# owner row", "missing family", "missing site-admin count" and "vanished series" tests must each fire
# the right (family, owner) alert while every OTHER inventory series is still present. A rule written
# as `absent(<one family>)` or as `count(...) < N` passes one half and fails the other.
#
# SERIES SHAPE: the CNPG exporter names a column `cnpg_<query>_<column>`, adds `owner` from the LABEL
# column, and the PodMonitor adds `namespace`/`pod`.
#
# YAML ANCHORS keep this readable: the baseline series are defined once (`&s_...`, in the valid-zero
# test) and each missing-series test lists the ones it KEEPS, so what a test omits is the visible
# gap. The `&d_...` anchors share each alert's description text between the rules file and its
# fixtures' expected annotations.
#
# `rule_files` is the extracted spec name, because rules-lint.sh hands promtool the `spec:` body of
# each PrometheusRule (the CRD wrapper is not a promtool rules file) under the manifest's basename.
rule_files:
  - gitea-credential-rules.yaml

evaluation_interval: 1m

tests:
  # ----------------------------------------------------------- the day-one shape
  # The live inventory on 2026-10-07: cchifor 26 tokens, chifor 1 token (24 days old) and 1 OAuth2
  # grant, gitea_admin 41 tokens of which 39 are outside the allowlist, 2 site admins. Four rules
  # fire and the two structural ones stay silent. (The first three are what B6's clean-up retires;
  # the OAuth2 grant is the Git Credential Manager authorisation.)
  - interval: 1m
    name: the live inventory fires the four standing-credential rules and nothing else
    input_series:
      - series: 'cnpg_gitea_credentials_tokens{namespace="databases",pod="infra-pg-6",owner="cchifor"}'
        values: "26x60"
      - series: 'cnpg_gitea_credentials_oldest_token_age_seconds{namespace="databases",pod="infra-pg-6",owner="cchifor"}'
        values: "5025443x60"
      - series: 'cnpg_gitea_credentials_tokens_not_allowlisted{namespace="databases",pod="infra-pg-6",owner="cchifor"}'
        values: "26x60"
      - series: 'cnpg_gitea_credentials_oauth_grants{namespace="databases",pod="infra-pg-6",owner="cchifor"}'
        values: "0x60"
      - series: 'cnpg_gitea_credentials_tokens{namespace="databases",pod="infra-pg-6",owner="chifor"}'
        values: "1x60"
      - series: 'cnpg_gitea_credentials_oldest_token_age_seconds{namespace="databases",pod="infra-pg-6",owner="chifor"}'
        values: "2081514x60"
      - series: 'cnpg_gitea_credentials_tokens_not_allowlisted{namespace="databases",pod="infra-pg-6",owner="chifor"}'
        values: "1x60"
      - series: 'cnpg_gitea_credentials_oauth_grants{namespace="databases",pod="infra-pg-6",owner="chifor"}'
        values: "1x60"
      - series: 'cnpg_gitea_credentials_tokens{namespace="databases",pod="infra-pg-6",owner="gitea_admin"}'
        values: "41x60"
      - series: 'cnpg_gitea_credentials_oldest_token_age_seconds{namespace="databases",pod="infra-pg-6",owner="gitea_admin"}'
        values: "7764565x60"
      - series: 'cnpg_gitea_credentials_tokens_not_allowlisted{namespace="databases",pod="infra-pg-6",owner="gitea_admin"}'
        values: "39x60"
      - series: 'cnpg_gitea_credentials_oauth_grants{namespace="databases",pod="infra-pg-6",owner="gitea_admin"}'
        values: "0x60"
      - series: 'cnpg_gitea_site_admins_total{namespace="databases",pod="infra-pg-6"}'
        values: "2x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: GiteaOrgAccountHasTokens
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: databases
              owner: cchifor
            exp_annotations:
              summary: "Gitea org account cchifor holds 26 access token(s)"
              description: &d_org >-
                The organization account cchifor (a converted user, uid 2) holds access tokens, and an
                organization account should hold none: each one acts with the org's identity, and
                Gitea access tokens never expire. Move every consumer to a per-purpose bot account,
                then delete the token (API with basic auth of gitea_admin, or the account's
                Applications page). Count and age only are exported - never the token values.
      - eval_time: 30m
        alertname: GiteaOwnerTokenStanding
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: databases
              owner: chifor
            exp_annotations:
              summary: "Gitea owner chifor holds a token older than 4h"
              description: &d_age >-
                The oldest access token of the owner account chifor is more than 4 hours old. The owner's
                tokens are minted for a task and deleted afterwards; Gitea access tokens never
                expire, so one left behind is a standing credential with the owner's site-admin
                rights. Find it by id and name (never token_hash) and delete it.
      - eval_time: 30m
        alertname: GiteaAdminTokenNotAllowlisted
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: databases
              owner: gitea_admin
            exp_annotations:
              summary: "Gitea gitea_admin holds 39 token(s) outside its allowlist"
              description: &d_adm >-
                The break-glass site-admin account gitea_admin holds access tokens that are not on its
                allowlist. The allowlist is exactly two documented consumers, keyed by id, name and
                scope (apps/databases/gitea-credential-inventory.sql): af-ci-scaler-2941 (read:admin)
                and flux-ailab-read (read:repository). Anything else is an undocumented credential
                on a site-admin identity. List id, name and scope with psql on the infra-pg primary
                and delete it through the API; a rotated documented token needs its new id added to
                that file, and the file re-run, in the same PR.
      - eval_time: 30m
        alertname: GiteaOwnerOAuthGrant
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: databases
              owner: chifor
            exp_annotations:
              summary: "Gitea owner chifor has 1 OAuth2 grant(s)"
              description: &d_grant >-
                The owner account chifor has authorised an OAuth2 application (the built-in Git
                Credential Manager app issues refresh tokens that outlive any access token and do not
                appear in the token list). Revoke it under Settings, Applications, Authorized OAuth2
                Applications, or delete the oauth2_grant row.
      - eval_time: 30m
        alertname: GiteaAdminUserCountChanged
        exp_alerts: []
      - eval_time: 60m
        alertname: GiteaCredentialInventoryMissing
        exp_alerts: []

  # ------------------------------------------------- valid zeros are not missing
  # THE load-bearing test, and the home of the baseline series every missing-series test below
  # re-uses. Every owner exports a full row of zeros (no tokens, no grants), gitea_admin sits at its
  # two allowlisted tokens (so oldest age is large but nothing is outside the allowlist), and the
  # site-admin count is the expected 2: nothing may fire for an hour, InventoryMissing least of all.
  # A second pod exports a few of the same rows to pin that the aggregation does not double anything.
  - interval: 1m
    name: valid zero-token rows fire nothing, and a zero is not a missing series
    input_series:
      - &s_tok_cchifor
        series: 'cnpg_gitea_credentials_tokens{namespace="databases",pod="infra-pg-6",owner="cchifor"}'
        values: "0x70"
      - &s_age_cchifor
        series: 'cnpg_gitea_credentials_oldest_token_age_seconds{namespace="databases",pod="infra-pg-6",owner="cchifor"}'
        values: "0x70"
      - &s_nal_cchifor
        series: 'cnpg_gitea_credentials_tokens_not_allowlisted{namespace="databases",pod="infra-pg-6",owner="cchifor"}'
        values: "0x70"
      - &s_grt_cchifor
        series: 'cnpg_gitea_credentials_oauth_grants{namespace="databases",pod="infra-pg-6",owner="cchifor"}'
        values: "0x70"
      - &s_tok_chifor
        series: 'cnpg_gitea_credentials_tokens{namespace="databases",pod="infra-pg-6",owner="chifor"}'
        values: "0x70"
      - &s_age_chifor
        series: 'cnpg_gitea_credentials_oldest_token_age_seconds{namespace="databases",pod="infra-pg-6",owner="chifor"}'
        values: "0x70"
      - &s_nal_chifor
        series: 'cnpg_gitea_credentials_tokens_not_allowlisted{namespace="databases",pod="infra-pg-6",owner="chifor"}'
        values: "0x70"
      - &s_grt_chifor
        series: 'cnpg_gitea_credentials_oauth_grants{namespace="databases",pod="infra-pg-6",owner="chifor"}'
        values: "0x70"
      - &s_tok_admin
        series: 'cnpg_gitea_credentials_tokens{namespace="databases",pod="infra-pg-6",owner="gitea_admin"}'
        values: "2x70"
      - &s_age_admin
        series: 'cnpg_gitea_credentials_oldest_token_age_seconds{namespace="databases",pod="infra-pg-6",owner="gitea_admin"}'
        values: "7764565x70"
      - &s_nal_admin
        series: 'cnpg_gitea_credentials_tokens_not_allowlisted{namespace="databases",pod="infra-pg-6",owner="gitea_admin"}'
        values: "0x70"
      - &s_grt_admin
        series: 'cnpg_gitea_credentials_oauth_grants{namespace="databases",pod="infra-pg-6",owner="gitea_admin"}'
        values: "0x70"
      - &s_site
        series: 'cnpg_gitea_site_admins_total{namespace="databases",pod="infra-pg-6"}'
        values: "2x70"
      # The replica, exporting a few of the same rows.
      - series: 'cnpg_gitea_credentials_tokens{namespace="databases",pod="infra-pg-5",owner="cchifor"}'
        values: "0x70"
      - series: 'cnpg_gitea_site_admins_total{namespace="databases",pod="infra-pg-5"}'
        values: "2x70"
    alert_rule_test:
      - eval_time: 29m
        alertname: GiteaCredentialInventoryMissing
        exp_alerts: []
      - eval_time: 31m
        alertname: GiteaCredentialInventoryMissing
        exp_alerts: []
      - eval_time: 60m
        alertname: GiteaCredentialInventoryMissing
        exp_alerts: []
      - eval_time: 60m
        alertname: GiteaOrgAccountHasTokens
        exp_alerts: []
      # gitea_admin's oldest token is 90 days old; the age rule is scoped to the owner chifor.
      - eval_time: 60m
        alertname: GiteaOwnerTokenStanding
        exp_alerts: []
      - eval_time: 60m
        alertname: GiteaAdminTokenNotAllowlisted
        exp_alerts: []
      - eval_time: 60m
        alertname: GiteaOwnerOAuthGrant
        exp_alerts: []
      - eval_time: 60m
        alertname: GiteaAdminUserCountChanged
        exp_alerts: []

  # --------------------------------------------------------------- org account
  - interval: 1m
    name: a token on the org account pages after the hold, one pod or two, and a lagging replica does not hide it
    input_series:
      - series: 'cnpg_gitea_credentials_tokens{namespace="databases",pod="infra-pg-6",owner="cchifor"}'
        values: "0x4 1x40"
      # The replica lags and still reports 0 for a while, then agrees. max by (...) must not let the
      # lagging zero hide the token, nor split the alert in two.
      - series: 'cnpg_gitea_credentials_tokens{namespace="databases",pod="infra-pg-5",owner="cchifor"}'
        values: "0x20 1x24"
      # chifor holds tokens too: the org-account rule is scoped to cchifor and must not match it.
      - series: 'cnpg_gitea_credentials_tokens{namespace="databases",pod="infra-pg-6",owner="chifor"}'
        values: "3x44"
    alert_rule_test:
      # The token appears at minute 5 (the primary's first sample of 1); the 10m hold ends at minute 15.
      - eval_time: 14m
        alertname: GiteaOrgAccountHasTokens
        exp_alerts: []
      - eval_time: 15m
        alertname: GiteaOrgAccountHasTokens
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: databases
              owner: cchifor
            exp_annotations:
              summary: "Gitea org account cchifor holds 1 access token(s)"
              description: *d_org

  # --------------------------------------------------------------- owner token age
  # chifor's oldest token is 3h50m old at t=0 (13800s) and ages one minute per minute. It crosses 4h
  # (14400s) at minute 10 (not YET greater: > is strict), so it is first true at minute 11 and the 5m
  # hold ends at minute 16. Exact boundaries on both sides.
  - interval: 1m
    name: an owner token older than 4h pages, a younger one and other owners' old tokens do not
    input_series:
      - series: 'cnpg_gitea_credentials_oldest_token_age_seconds{namespace="databases",pod="infra-pg-6",owner="chifor"}'
        values: "13800+60x60"
      # gitea_admin's 90-day-old tokens are the allowlist rule's business, not this one's.
      - series: 'cnpg_gitea_credentials_oldest_token_age_seconds{namespace="databases",pod="infra-pg-6",owner="gitea_admin"}'
        values: "7764565x60"
      # The org account's token is older than 4h too, but the rule is scoped to the owner chifor.
      - series: 'cnpg_gitea_credentials_oldest_token_age_seconds{namespace="databases",pod="infra-pg-6",owner="cchifor"}'
        values: "20000x60"
    alert_rule_test:
      - eval_time: 10m
        alertname: GiteaOwnerTokenStanding
        exp_alerts: []
      - eval_time: 15m
        alertname: GiteaOwnerTokenStanding
        exp_alerts: []
      - eval_time: 16m
        alertname: GiteaOwnerTokenStanding
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: databases
              owner: chifor
            exp_annotations:
              summary: "Gitea owner chifor holds a token older than 4h"
              description: *d_age

  - interval: 1m
    name: a token deleted before the 4h line never pages, and the zero-filled row (age 0) is silent
    input_series:
      # Age climbs to 3h59m, then the owner deletes the token: the row goes to 0 (zero-filled, not gone).
      - series: 'cnpg_gitea_credentials_oldest_token_age_seconds{namespace="databases",pod="infra-pg-6",owner="chifor"}'
        values: "14280+60x1 0x58"
    alert_rule_test:
      - eval_time: 30m
        alertname: GiteaOwnerTokenStanding
        exp_alerts: []
      - eval_time: 59m
        alertname: GiteaOwnerTokenStanding
        exp_alerts: []

  # ------------------------------------------------------------- admin allowlist
  - interval: 1m
    name: tokens outside the gitea_admin allowlist page after the hold, other owners are out of scope
    input_series:
      - series: 'cnpg_gitea_credentials_tokens_not_allowlisted{namespace="databases",pod="infra-pg-6",owner="gitea_admin"}'
        values: "39x30"
      # chifor's token is, by construction, outside any allowlist: not this rule's scope.
      - series: 'cnpg_gitea_credentials_tokens_not_allowlisted{namespace="databases",pod="infra-pg-6",owner="chifor"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 9m
        alertname: GiteaAdminTokenNotAllowlisted
        exp_alerts: []
      - eval_time: 10m
        alertname: GiteaAdminTokenNotAllowlisted
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: databases
              owner: gitea_admin
            exp_annotations:
              summary: "Gitea gitea_admin holds 39 token(s) outside its allowlist"
              description: *d_adm

  - interval: 1m
    name: a cleaned-up gitea_admin (only the two allowlisted tokens) is silent
    input_series:
      - series: 'cnpg_gitea_credentials_tokens{namespace="databases",pod="infra-pg-6",owner="gitea_admin"}'
        values: "2x30"
      - series: 'cnpg_gitea_credentials_tokens_not_allowlisted{namespace="databases",pod="infra-pg-6",owner="gitea_admin"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 30m
        alertname: GiteaAdminTokenNotAllowlisted
        exp_alerts: []

  # ------------------------------------------------------------------ OAuth grants
  - interval: 1m
    name: an OAuth2 grant on chifor pages, a revoked one and other owners' grants do not
    input_series:
      - series: 'cnpg_gitea_credentials_oauth_grants{namespace="databases",pod="infra-pg-6",owner="chifor"}'
        values: "1x20 0x20"
      # cchifor's and gitea_admin's grants are not this rule's business.
      - series: 'cnpg_gitea_credentials_oauth_grants{namespace="databases",pod="infra-pg-6",owner="cchifor"}'
        values: "2x40"
      - series: 'cnpg_gitea_credentials_oauth_grants{namespace="databases",pod="infra-pg-6",owner="gitea_admin"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 9m
        alertname: GiteaOwnerOAuthGrant
        exp_alerts: []
      - eval_time: 10m
        alertname: GiteaOwnerOAuthGrant
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: databases
              owner: chifor
            exp_annotations:
              summary: "Gitea owner chifor has 1 OAuth2 grant(s)"
              description: *d_grant
      # Revoked at minute 21: resolved.
      - eval_time: 30m
        alertname: GiteaOwnerOAuthGrant
        exp_alerts: []

  # ----------------------------------------------------------------- site admins
  - interval: 1m
    name: a third site admin pages, two does not, and one fewer pages too
    input_series:
      - series: 'cnpg_gitea_site_admins_total{namespace="databases",pod="infra-pg-6"}'
        values: "2x20 3x20 1x20"
    alert_rule_test:
      - eval_time: 19m
        alertname: GiteaAdminUserCountChanged
        exp_alerts: []
      # A third admin from minute 21; the 10m hold ends at minute 31.
      - eval_time: 30m
        alertname: GiteaAdminUserCountChanged
        exp_alerts: []
      - eval_time: 31m
        alertname: GiteaAdminUserCountChanged
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: databases
            exp_annotations:
              summary: "Gitea has 3 site admins (expected 2)"
              description: &d_count >-
                Gitea should have exactly two site admins, gitea_admin and chifor. A third is a
                privilege change nobody announced; one fewer means an admin lost the flag. List them
                with psql on the infra-pg primary (select name, is_admin from "user"). When the admin
                set changes on purpose, change the literal 2 in gitea-credential-rules.yaml in the
                same PR.
      # Down to one admin from minute 42: the condition never cleared, so the same alert keeps firing
      # and now reports 1.
      - eval_time: 55m
        alertname: GiteaAdminUserCountChanged
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: databases
            exp_annotations:
              summary: "Gitea has 1 site admins (expected 2)"
              description: *d_count

  # ------------------------------------------------- inventory missing: owner row
  # Every series EXCEPT one owner's four rows is present, so a rule that only asks "is there any
  # inventory series" stays silent here. Four alerts, one per family of the missing owner, each
  # carrying owner and family. absent() is true from the first evaluation (the series never
  # existed), so the 30m hold ends at minute 30. One test per required owner, so each of the twelve
  # (family, owner) terms of the expression is exercised on its own.
  - interval: 1m
    name: a missing chifor row fires per family while every other inventory series is present
    input_series:
      - *s_tok_cchifor
      - *s_age_cchifor
      - *s_nal_cchifor
      - *s_grt_cchifor
      - *s_tok_admin
      - *s_age_admin
      - *s_nal_admin
      - *s_grt_admin
      - *s_site
    alert_rule_test:
      - eval_time: 29m
        alertname: GiteaCredentialInventoryMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: GiteaCredentialInventoryMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: databases
              owner: chifor
              family: cnpg_gitea_credentials_tokens
            exp_annotations:
              summary: "Gitea credential inventory series missing: cnpg_gitea_credentials_tokens for chifor"
              description: &d_missing >-
                One of the cnpg_gitea_* inventory series (see the family and owner labels) has been
                absent for 30 minutes, so the credential alerts in this group are blind to it. A valid
                owner with nothing to report still exports a row of zeros, so absence means the account
                is gone or renamed, the custom query is failing, or the exporter is not being scraped.
                Check that the credential_inventory views exist (gitea-credential-inventory.sql), the
                cnpg_collector_last_collection_error series, the infra-pg primary's log and the
                infra-pg-metrics target.
          - exp_labels:
              severity: warning
              namespace: databases
              owner: chifor
              family: cnpg_gitea_credentials_oldest_token_age_seconds
            exp_annotations:
              summary: "Gitea credential inventory series missing: cnpg_gitea_credentials_oldest_token_age_seconds for chifor"
              description: *d_missing
          - exp_labels:
              severity: warning
              namespace: databases
              owner: chifor
              family: cnpg_gitea_credentials_tokens_not_allowlisted
            exp_annotations:
              summary: "Gitea credential inventory series missing: cnpg_gitea_credentials_tokens_not_allowlisted for chifor"
              description: *d_missing
          - exp_labels:
              severity: warning
              namespace: databases
              owner: chifor
              family: cnpg_gitea_credentials_oauth_grants
            exp_annotations:
              summary: "Gitea credential inventory series missing: cnpg_gitea_credentials_oauth_grants for chifor"
              description: *d_missing

  - interval: 1m
    name: a missing cchifor row fires per family while every other inventory series is present
    input_series:
      - *s_tok_chifor
      - *s_age_chifor
      - *s_nal_chifor
      - *s_grt_chifor
      - *s_tok_admin
      - *s_age_admin
      - *s_nal_admin
      - *s_grt_admin
      - *s_site
    alert_rule_test:
      - eval_time: 29m
        alertname: GiteaCredentialInventoryMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: GiteaCredentialInventoryMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: databases
              owner: cchifor
              family: cnpg_gitea_credentials_tokens
            exp_annotations:
              summary: "Gitea credential inventory series missing: cnpg_gitea_credentials_tokens for cchifor"
              description: *d_missing
          - exp_labels:
              severity: warning
              namespace: databases
              owner: cchifor
              family: cnpg_gitea_credentials_oldest_token_age_seconds
            exp_annotations:
              summary: "Gitea credential inventory series missing: cnpg_gitea_credentials_oldest_token_age_seconds for cchifor"
              description: *d_missing
          - exp_labels:
              severity: warning
              namespace: databases
              owner: cchifor
              family: cnpg_gitea_credentials_tokens_not_allowlisted
            exp_annotations:
              summary: "Gitea credential inventory series missing: cnpg_gitea_credentials_tokens_not_allowlisted for cchifor"
              description: *d_missing
          - exp_labels:
              severity: warning
              namespace: databases
              owner: cchifor
              family: cnpg_gitea_credentials_oauth_grants
            exp_annotations:
              summary: "Gitea credential inventory series missing: cnpg_gitea_credentials_oauth_grants for cchifor"
              description: *d_missing

  - interval: 1m
    name: a missing gitea_admin row fires per family while every other inventory series is present
    input_series:
      - *s_tok_cchifor
      - *s_age_cchifor
      - *s_nal_cchifor
      - *s_grt_cchifor
      - *s_tok_chifor
      - *s_age_chifor
      - *s_nal_chifor
      - *s_grt_chifor
      - *s_site
    alert_rule_test:
      - eval_time: 29m
        alertname: GiteaCredentialInventoryMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: GiteaCredentialInventoryMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: databases
              owner: gitea_admin
              family: cnpg_gitea_credentials_tokens
            exp_annotations:
              summary: "Gitea credential inventory series missing: cnpg_gitea_credentials_tokens for gitea_admin"
              description: *d_missing
          - exp_labels:
              severity: warning
              namespace: databases
              owner: gitea_admin
              family: cnpg_gitea_credentials_oldest_token_age_seconds
            exp_annotations:
              summary: "Gitea credential inventory series missing: cnpg_gitea_credentials_oldest_token_age_seconds for gitea_admin"
