  # ========================================================== GatekeeperTokenReviewLimited
  - interval: 1m
    name: a rate-limited TokenReview call pages, and resolves after 10 minutes
    input_series:
      # Scraped series: namespace / pod labels, pre-initialised to 0 at pod start. One call limited at ~10m.
      - series: 'gatekeeper_tokenreview_limited_total{job="gatekeeper",namespace="strive-ailab",pod="gatekeeper-aaa"}'
        values: "0x10 1x50"
      - series: 'gatekeeper_tokenreview_limited_total{job="gatekeeper",namespace="strive-ailab",pod="gatekeeper-bbb"}'
        values: "0x60"
      - series: 'gatekeeper_tokenreview_total{job="gatekeeper",namespace="strive-ailab",pod="gatekeeper-aaa",outcome="unavailable"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 9m
        alertname: GatekeeperTokenReviewLimited
        exp_alerts: []
      - eval_time: 12m
        alertname: GatekeeperTokenReviewLimited
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "gatekeeper TokenReview calls are being limited or are unavailable"
              description: >-
                In the last 10 minutes gatekeeper rate-limited a TokenReview call
                (gatekeeper_tokenreview_limited_total) or got an `unavailable` outcome
                (gatekeeper_tokenreview_total). Service-to-service tokens may be refused or delayed.
                Drills and planned platform-wide rolls run under a silence for this alert.
      - eval_time: 30m
        alertname: GatekeeperTokenReviewLimited
        exp_alerts: []

  - interval: 1m
    name: an `unavailable` TokenReview outcome pages even with no limiter series change
    input_series:
      - series: 'gatekeeper_tokenreview_limited_total{job="gatekeeper",namespace="strive-ailab",pod="gatekeeper-aaa"}'
        values: "0x60"
      - series: 'gatekeeper_tokenreview_total{job="gatekeeper",namespace="strive-ailab",pod="gatekeeper-aaa",outcome="unavailable"}'
        values: "0x10 2x50"
      - series: 'gatekeeper_tokenreview_total{job="gatekeeper",namespace="strive-ailab",pod="gatekeeper-aaa",outcome="authenticated"}'
        values: "100+10x60"
    alert_rule_test:
      - eval_time: 12m
        alertname: GatekeeperTokenReviewLimited
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "gatekeeper TokenReview calls are being limited or are unavailable"
              description: >-
                In the last 10 minutes gatekeeper rate-limited a TokenReview call
                (gatekeeper_tokenreview_limited_total) or got an `unavailable` outcome
                (gatekeeper_tokenreview_total). Service-to-service tokens may be refused or delayed.
                Drills and planned platform-wide rolls run under a silence for this alert.

  - interval: 1m
    name: the limiter and unavailable counters rising on DIFFERENT pods are one alert, not two
    input_series:
      - series: 'gatekeeper_tokenreview_limited_total{job="gatekeeper",namespace="strive-ailab",pod="gatekeeper-aaa"}'
        values: "0x10 3x50"
      - series: 'gatekeeper_tokenreview_total{job="gatekeeper",namespace="strive-ailab",pod="gatekeeper-bbb",outcome="unavailable"}'
        values: "0x10 4x50"
    alert_rule_test:
      - eval_time: 12m
        alertname: GatekeeperTokenReviewLimited
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "gatekeeper TokenReview calls are being limited or are unavailable"
              description: >-
                In the last 10 minutes gatekeeper rate-limited a TokenReview call
                (gatekeeper_tokenreview_limited_total) or got an `unavailable` outcome
                (gatekeeper_tokenreview_total). Service-to-service tokens may be refused or delayed.
                Drills and planned platform-wide rolls run under a silence for this alert.

  - interval: 1m
    name: healthy TokenReview traffic, other outcomes, a counter reset and a missing series do not page
    input_series:
      # Pre-initialised counters sitting at zero (no event).
      - series: 'gatekeeper_tokenreview_limited_total{job="gatekeeper",namespace="strive-ailab",pod="gatekeeper-aaa"}'
        values: "0x60"
      - series: 'gatekeeper_tokenreview_total{job="gatekeeper",namespace="strive-ailab",pod="gatekeeper-aaa",outcome="unavailable"}'
        values: "0x60"
      # Normal traffic, plus refusals and mismatches (caller errors, not unavailability).
      - series: 'gatekeeper_tokenreview_total{job="gatekeeper",namespace="strive-ailab",pod="gatekeeper-aaa",outcome="authenticated"}'
        values: "100+10x60"
      - series: 'gatekeeper_tokenreview_total{job="gatekeeper",namespace="strive-ailab",pod="gatekeeper-aaa",outcome="refused"}'
        values: "5+1x60"
      - series: 'gatekeeper_tokenreview_total{job="gatekeeper",namespace="strive-ailab",pod="gatekeeper-aaa",outcome="mismatch"}'
        values: "5+1x60"
      # A pod restart: the counter falls back to 0 with no new event (and a stale old value before it).
      - series: 'gatekeeper_tokenreview_limited_total{job="gatekeeper",namespace="strive-ailab",pod="gatekeeper-old"}'
        values: "5x20 0x40"
      # Another job's counter of the same name must not count.
      - series: 'gatekeeper_tokenreview_limited_total{job="other",namespace="x",pod="other-1"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 12m
        alertname: GatekeeperTokenReviewLimited
        exp_alerts: []
      - eval_time: 30m
        alertname: GatekeeperTokenReviewLimited
        exp_alerts: []

