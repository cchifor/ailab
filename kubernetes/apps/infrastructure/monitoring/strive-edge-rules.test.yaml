      # A weighted TraefikService in front of two Kubernetes Services: the router's exported_service is the
      # TraefikService, the service series carry the two children's names, so nothing joins, the zero-fill
      # applies and 1 origin 500 per tick pages as "edge-generated". No route uses a TraefikService today;
      # this pins the shape the alert description warns about (see the rule's header).
      - series: 'traefik_router_requests_total{namespace="platform-edge",exported_service="strive-ailab-web-weighted@kubernetescrd",router="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",code="500",method="GET",protocol="http",pod="traefik-a"}'
        values: "5+2x40 85x80"
      - series: 'traefik_service_requests_total{namespace="platform-edge",exported_service="strive-ailab-web-v1-80@kubernetescrd",code="500",method="GET",protocol="http",pod="traefik-a"}'
        values: "5+1x40 45x80"
      - series: 'traefik_service_requests_total{namespace="platform-edge",exported_service="strive-ailab-web-v2-80@kubernetescrd",code="500",method="GET",protocol="http",pod="traefik-a"}'
        values: "5+1x40 45x80"
    alert_rule_test:
      - eval_time: 15m
        alertname: StriveEdgeGenerated5xx
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_service: "strive-ailab-web-weighted@kubernetescrd"
            exp_annotations:
              summary: "Traefik answered 5xx itself for strive-ailab-web-weighted@kubernetescrd"
              description: >-
                More than 3 5xx in the last 10 minutes were returned to clients by the Traefik router of
                strive-ailab-web-weighted@kubernetescrd without its service handler producing them (router 5xx minus
                service 5xx): a ForwardAuth call that failed or answered 5xx, a middleware error, or a
                service with no endpoints. An origin 5xx and an unreachable origin are counted on both
                sides and do not count here (StriveEdge5xxBurst covers those). The Loki panel on the
                strive-edge dashboard (OriginStatus 0) lists the requests; check gatekeeper first
                (GatekeeperForwardAuth5xx) and its pods.
                If the route is fronted by a TraefikService (kubectl get traefikservices -A), the names
                do not join and its origin 5xx count here too.

  - interval: 30s
    name: two stray edge-generated 5xx, ForwardAuth 401s (router-only 4xx) and flat counters page nothing
    input_series:
      # Two stray router 500s with no service series: increase 2, below 3.
      - series: 'traefik_router_requests_total{namespace="platform-edge",exported_service="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",router="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",code="500",method="GET",protocol="http",pod="traefik-a"}'
        values: "5x20 6 7 7x98"
      # The normal live shape: ForwardAuth refusals are router-only 401s, rising fast. Not a 5xx.
      - series: 'traefik_router_requests_total{namespace="platform-edge",exported_service="strive-ailab-gatekeeper-122ddbcb16c62338409a@kubernetescrd",router="strive-ailab-gatekeeper-122ddbcb16c62338409a@kubernetescrd",code="401",method="GET",protocol="http",pod="traefik-a"}'
        values: "5+2x120"
      - series: 'traefik_router_requests_total{namespace="platform-edge",exported_service="strive-ailab-gatekeeper-122ddbcb16c62338409a@kubernetescrd",router="strive-ailab-gatekeeper-122ddbcb16c62338409a@kubernetescrd",code="200",method="GET",protocol="http",pod="traefik-a"}'
        values: "1000+10x120"
      - series: 'traefik_service_requests_total{namespace="platform-edge",exported_service="strive-ailab-gatekeeper-122ddbcb16c62338409a@kubernetescrd",code="200",method="GET",protocol="http",pod="traefik-a"}'
        values: "1000+10x120"
      # Flat counters: nothing happened in the window.
      - series: 'traefik_router_requests_total{namespace="platform-edge",exported_service="strive-ailab-keycloak-79d615decd89bc3a7b40@kubernetescrd",router="strive-ailab-keycloak-79d615decd89bc3a7b40@kubernetescrd",code="502",method="GET",protocol="http",pod="traefik-a"}'
        values: "40x120"
    alert_rule_test:
      - eval_time: 12m
        alertname: StriveEdgeGenerated5xx
        exp_alerts: []
      - eval_time: 25m
        alertname: StriveEdgeGenerated5xx
        exp_alerts: []

  - interval: 30s
    name: a never-hit service, a missing scrape and another namespace's router 500s page nothing
    input_series:
      # No traefik_* series at all, only an unrelated one: TraefikScrapeMissing reports that state.
      - series: 'up{job="kubelet",namespace="kube-system",service="kubelet"}'
        values: "1x120"
      # A never-hit service has no series in either family (Traefik creates them on the first request);
      # what exists here is a busy neighbour with 200s only.
      - series: 'traefik_router_requests_total{namespace="platform-edge",exported_service="strive-ailab-gatekeeper-122ddbcb16c62338409a@kubernetescrd",router="strive-ailab-gatekeeper-122ddbcb16c62338409a@kubernetescrd",code="200",method="GET",protocol="http",pod="traefik-a"}'
        values: "1000+10x120"
      - series: 'traefik_service_requests_total{namespace="platform-edge",exported_service="strive-ailab-gatekeeper-122ddbcb16c62338409a@kubernetescrd",code="200",method="GET",protocol="http",pod="traefik-a"}'
        values: "1000+10x120"
      # A router 500 flood in a namespace that is not the public edge (a copy of the scrape elsewhere).
      - series: 'traefik_router_requests_total{namespace="other",exported_service="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",router="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",code="500",method="GET",protocol="http",pod="traefik-x"}'
        values: "5+3x120"
    alert_rule_test:
      - eval_time: 12m
        alertname: StriveEdgeGenerated5xx
        exp_alerts: []
      - eval_time: 30m
        alertname: StriveEdgeGenerated5xx
        exp_alerts: []

  # =============================================================== GatekeeperForwardAuth5xx
  - interval: 1m
    name: sustained 5xx on /auth pages, summed over both gatekeeper pods
    input_series:
      # OTLP series: no namespace / pod, instance is "<pod>-1". One 5xx a minute per pod, 20 per 10m.
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth",http_status_code="500",http_method="GET",instance="gatekeeper-aaa-1"}'
        values: "20+1x40 61x100"
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth",http_status_code="502",http_method="GET",instance="gatekeeper-bbb-1"}'
        values: "20+1x40 61x100"
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth",http_status_code="200",http_method="GET",instance="gatekeeper-aaa-1"}'
        values: "5000+30x140"
    alert_rule_test:
      - eval_time: 12m
        alertname: GatekeeperForwardAuth5xx
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "gatekeeper /auth (ForwardAuth) is answering 5xx"
              description: >-
                More than 3 5xx from gatekeeper route /auth (the Traefik ForwardAuth target) in the last
                10 minutes, summed over its pods. Traefik turns a failed ForwardAuth call into its own
                5xx, so this is the origin-side half of what StriveEdge5xxBurst sees at the edge. Check
                the gatekeeper pods, Redis and the Keycloak reachability from gatekeeper.
      # Resolves 10 minutes after the 5xx stop (they stop at 40m).
      - eval_time: 60m
        alertname: GatekeeperForwardAuth5xx
        exp_alerts: []

  - interval: 1m
    name: ONE isolated 5xx, or two, on /auth pages nothing
    input_series:
      # One isolated 500 at ~10m.
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth",http_status_code="500",http_method="GET",instance="gatekeeper-aaa-1"}'
        values: "7x10 8x40"
      # Two on the other pod, not enough either (> 3 is the bar).
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth",http_status_code="502",http_method="GET",instance="gatekeeper-bbb-1"}'
        values: "3x10 4x4 5x36"
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth",http_status_code="200",http_method="GET",instance="gatekeeper-aaa-1"}'
        values: "5000+30x50"
    alert_rule_test:
      - eval_time: 12m
        alertname: GatekeeperForwardAuth5xx
        exp_alerts: []
      - eval_time: 25m
        alertname: GatekeeperForwardAuth5xx
        exp_alerts: []

  - interval: 1m
    name: no traffic, no 5xx series, non-5xx statuses, other routes and other jobs do not page
    input_series:
      # No traffic: flat counters.
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth",http_status_code="200",http_method="GET",instance="gatekeeper-aaa-1"}'
        values: "5000+0x40"
      # Heavy 4xx / 3xx on /auth is the normal login traffic, not a server failure.
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth",http_status_code="401",http_method="GET",instance="gatekeeper-aaa-1"}'
        values: "100+50x40"
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth",http_status_code="302",http_method="GET",instance="gatekeeper-aaa-1"}'
        values: "100+50x40"
      # 5xx on ANOTHER route is GatekeeperHttp5xx's, not this rule's.
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/userinfo",http_status_code="500",http_method="GET",instance="gatekeeper-aaa-1"}'
        values: "10+5x40"
      # 5xx on route /auth from a DIFFERENT service must not count (job guard).
      - series: 'http_server_request_duration_seconds_count{job="tms",http_route="/auth",http_status_code="500",http_method="GET",instance="tms-aaa-1"}'
        values: "10+5x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: GatekeeperForwardAuth5xx
        exp_alerts: []

  # ===================================================================== GatekeeperHttp5xx
  - interval: 1m
    name: sustained /auth/token 500s page, and the alert names the route
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="500",http_method="POST",instance="gatekeeper-aaa-1"}'
        values: "30+1x40 71x100"
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="200",http_method="POST",instance="gatekeeper-aaa-1"}'
        values: "800+5x140"
    alert_rule_test:
      - eval_time: 15m
        alertname: GatekeeperHttp5xx
        exp_alerts:
          - exp_labels:
              severity: warning
              http_route: /auth/token
            exp_annotations:
              summary: "gatekeeper route /auth/token is answering 5xx"
              description: >-
                More than 3 5xx from gatekeeper route /auth/token in the last 10 minutes,
                summed over its pods (for /auth/token a 503 is excluded: that is GatekeeperTokenUnavailable).
                Drills and planned platform-wide rolls run under a silence for this alert. Check the
                gatekeeper pod logs and the request's status code split on the strive-edge dashboard.
      - eval_time: 60m
        alertname: GatekeeperHttp5xx
        exp_alerts: []

  - interval: 1m
    name: a non-503 5xx other than 500 on /auth/token (504) also pages
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="504",http_method="POST",instance="gatekeeper-aaa-1"}'
        values: "30+1x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: GatekeeperHttp5xx
        exp_alerts:
          - exp_labels:
              severity: warning
              http_route: /auth/token
            exp_annotations:
              summary: "gatekeeper route /auth/token is answering 5xx"
              description: >-
                More than 3 5xx from gatekeeper route /auth/token in the last 10 minutes,
                summed over its pods (for /auth/token a 503 is excluded: that is GatekeeperTokenUnavailable).
                Drills and planned platform-wide rolls run under a silence for this alert. Check the
                gatekeeper pod logs and the request's status code split on the strive-edge dashboard.

  - interval: 1m
    name: /auth/token 503s are NOT GatekeeperHttp5xx's (the drill produced 107 of them)
    input_series:
      # 5 a minute for 40 minutes: far above the threshold on any other status, silent for 503.
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="503",http_method="POST",instance="gatekeeper-aaa-1"}'
        values: "30+5x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: GatekeeperHttp5xx
        exp_alerts: []
      - eval_time: 30m
        alertname: GatekeeperHttp5xx
        exp_alerts: []

  - interval: 1m
    name: a 5xx on any other route pages per route, /auth is left to GatekeeperForwardAuth5xx
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/userinfo",http_status_code="500",http_method="GET",instance="gatekeeper-aaa-1"}'
        values: "10+1x40"
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/userinfo",http_status_code="502",http_method="GET",instance="gatekeeper-bbb-1"}'
        values: "10+1x40"
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/api/v1/ready",http_status_code="503",http_method="GET",instance="gatekeeper-aaa-1"}'
        values: "10+1x40"
      # /auth 5xx at a rate that would fire this rule if it were not excluded.
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth",http_status_code="500",http_method="GET",instance="gatekeeper-aaa-1"}'
        values: "10+5x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: GatekeeperHttp5xx
        exp_alerts:
          - exp_labels:
              severity: warning
              http_route: /api/v1/ready
            exp_annotations:
              summary: "gatekeeper route /api/v1/ready is answering 5xx"
              description: >-
                More than 3 5xx from gatekeeper route /api/v1/ready in the last 10 minutes,
                summed over its pods (for /auth/token a 503 is excluded: that is GatekeeperTokenUnavailable).
                Drills and planned platform-wide rolls run under a silence for this alert. Check the
                gatekeeper pod logs and the request's status code split on the strive-edge dashboard.
          - exp_labels:
              severity: warning
              http_route: /auth/userinfo
            exp_annotations:
              summary: "gatekeeper route /auth/userinfo is answering 5xx"
              description: >-
                More than 3 5xx from gatekeeper route /auth/userinfo in the last 10 minutes,
                summed over its pods (for /auth/token a 503 is excluded: that is GatekeeperTokenUnavailable).
                Drills and planned platform-wide rolls run under a silence for this alert. Check the
                gatekeeper pod logs and the request's status code split on the strive-edge dashboard.

  - interval: 1m
    name: ONE isolated 5xx, no traffic and a missing series do not page GatekeeperHttp5xx
    input_series:
      # One 500 on /callback, one 500 on /auth/token.
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/callback",http_status_code="500",http_method="GET",instance="gatekeeper-aaa-1"}'
        values: "2x10 3x40"
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="500",http_method="POST",instance="gatekeeper-aaa-1"}'
        values: "9x10 10x40"
      # No traffic on a healthy route.
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/jwks",http_status_code="200",http_method="GET",instance="gatekeeper-aaa-1"}'
        values: "100+0x50"
      # A different job's 5xx on a shared route name.
      - series: 'http_server_request_duration_seconds_count{job="tms",http_route="/auth/userinfo",http_status_code="500",http_method="GET",instance="tms-aaa-1"}'
        values: "10+5x40"
    alert_rule_test:
      - eval_time: 12m
        alertname: GatekeeperHttp5xx
        exp_alerts: []
      - eval_time: 30m
        alertname: GatekeeperHttp5xx
        exp_alerts: []

  # ============================================================== GatekeeperTokenUnavailable
  - interval: 15s
    name: continuous /auth/token 503s page after 15 minutes, not before, and resolve when they stop
    input_series:
      # Four 503s a minute (one per 15 s sample) on one pod from 0 to 50 minutes, then flat.
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="503",http_method="POST",instance="gatekeeper-aaa-1"}'
        values: "5+1x200 205x400"
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="200",http_method="POST",instance="gatekeeper-aaa-1"}'
        values: "1000+1x600"
    alert_rule_test:
      - eval_time: 10m
        alertname: GatekeeperTokenUnavailable
        exp_alerts: []
      - eval_time: 18m
        alertname: GatekeeperTokenUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "gatekeeper /auth/token has answered 503 continuously for 15 minutes"
              description: >-
                gatekeeper route /auth/token (service-to-service token minting) answered 503, the
                TokenReview-unavailable status, in every two-minute window of the last 15 minutes. Check
                the Kubernetes API reachability from gatekeeper and GatekeeperTokenReviewLimited. Drills
                and planned platform-wide rolls run under a silence for this alert.
      # The 503s stop at 50m; the 2-minute windows empty out a few minutes later.
      - eval_time: 60m
        alertname: GatekeeperTokenUnavailable
        exp_alerts: []

  - interval: 15s
    name: LOW-volume /auth/token 503s (one per 90 seconds) still page when sustained
    input_series:
      # One 503 every 90 s (6 samples) for 24 minutes: no minute-long quiet spell, but no burst either.
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="503",http_method="POST",instance="gatekeeper-aaa-1"}'
        values: "0+0x5 1+0x5 2+0x5 3+0x5 4+0x5 5+0x5 6+0x5 7+0x5 8+0x5 9+0x5 10+0x5 11+0x5 12+0x5 13+0x5 14+0x5 15+0x5 16+0x5 17+0x5 18+0x5 19+0x5 20+0x5 21+0x5 22+0x5 23+0x5 24+0x5 25+0x5 26+0x5"
    alert_rule_test:
      - eval_time: 10m
        alertname: GatekeeperTokenUnavailable
        exp_alerts: []
      - eval_time: 21m
        alertname: GatekeeperTokenUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "gatekeeper /auth/token has answered 503 continuously for 15 minutes"
              description: >-
                gatekeeper route /auth/token (service-to-service token minting) answered 503, the
                TokenReview-unavailable status, in every two-minute window of the last 15 minutes. Check
                the Kubernetes API reachability from gatekeeper and GatekeeperTokenReviewLimited. Drills
                and planned platform-wide rolls run under a silence for this alert.

  - interval: 15s
    name: 503s on alternating pods are summed, so two pods that each fire every 2 minutes still page
    input_series:
      # Pod a counts every 2 minutes, pod b every 2 minutes offset by one minute: together one a minute.
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="503",http_method="POST",instance="gatekeeper-aaa-1"}'
        values: "0+0x7 1+0x7 2+0x7 3+0x7 4+0x7 5+0x7 6+0x7 7+0x7 8+0x7 9+0x7 10+0x7 11+0x7 12+0x7 13+0x7 14+0x7 15+0x7 16+0x7 17+0x7 18+0x7"
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="503",http_method="POST",instance="gatekeeper-bbb-1"}'
        values: "0+0x3 1+0x7 2+0x7 3+0x7 4+0x7 5+0x7 6+0x7 7+0x7 8+0x7 9+0x7 10+0x7 11+0x7 12+0x7 13+0x7 14+0x7 15+0x7 16+0x7 17+0x7 18+0x7"
    alert_rule_test:
      - eval_time: 21m
        alertname: GatekeeperTokenUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "gatekeeper /auth/token has answered 503 continuously for 15 minutes"
              description: >-
                gatekeeper route /auth/token (service-to-service token minting) answered 503, the
                TokenReview-unavailable status, in every two-minute window of the last 15 minutes. Check
                the Kubernetes API reachability from gatekeeper and GatekeeperTokenReviewLimited. Drills
                and planned platform-wide rolls run under a silence for this alert.

  - interval: 15s
    name: the 2026-10-06 drill shape (10 minutes of 503s) does not page
    input_series:
      # 503s at 4 a minute from 0 to 10 minutes, then flat: below the 15-minute sustain, at every
      # evaluation after it too.
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="503",http_method="POST",instance="gatekeeper-aaa-1"}'
        values: "5+1x40 45x300"
    alert_rule_test:
      - eval_time: 10m
        alertname: GatekeeperTokenUnavailable
        exp_alerts: []
      - eval_time: 14m
        alertname: GatekeeperTokenUnavailable
        exp_alerts: []
      - eval_time: 20m
        alertname: GatekeeperTokenUnavailable
        exp_alerts: []
      - eval_time: 30m
        alertname: GatekeeperTokenUnavailable
        exp_alerts: []

  - interval: 15s
    name: two 10-minute bursts with a 3-minute gap do not page (a quiet spell breaks the sustain)
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="503",http_method="POST",instance="gatekeeper-aaa-1"}'
        values: "5+1x40 45x12 46+1x40 86x200"
    alert_rule_test:
      - eval_time: 18m
        alertname: GatekeeperTokenUnavailable
        exp_alerts: []
      - eval_time: 24m
        alertname: GatekeeperTokenUnavailable
        exp_alerts: []

  - interval: 15s
    name: 503s that end because the series vanished (a pod replaced mid-burst) do not page
    input_series:
      # 8 minutes of 503s, then the series is gone for good. The few steps that still have data are
      # all 1, so a min-over-time formulation would page here; counting 15 present steps does not.
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="503",http_method="POST",instance="gatekeeper-aaa-1"}'
        values: "5+1x32 _x400"
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="200",http_method="POST",instance="gatekeeper-aaa-1"}'
        values: "1000+1x432"
    alert_rule_test:
      - eval_time: 10m
        alertname: GatekeeperTokenUnavailable
        exp_alerts: []
      - eval_time: 20m
        alertname: GatekeeperTokenUnavailable
        exp_alerts: []

  - interval: 15s
    name: ONE isolated 503, healthy traffic with no 503 series, 5xx other than 503, and a missing series do not page
    input_series:
      # One isolated 503 at about 5 minutes on a series that pre-exists.
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="503",http_method="POST",instance="gatekeeper-aaa-1"}'
        values: "9x20 10x300"
      # Continuous /auth/token 500s are GatekeeperHttp5xx's business, not this rule's.
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="500",http_method="POST",instance="gatekeeper-aaa-1"}'
        values: "5+1x320"
      # 503s on a different route (readiness) do not count.
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/api/v1/ready",http_status_code="503",http_method="GET",instance="gatekeeper-aaa-1"}'
        values: "5+1x320"
      - series: 'http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="200",http_method="POST",instance="gatekeeper-aaa-1"}'
        values: "1000+1x320"
    alert_rule_test:
      - eval_time: 10m
        alertname: GatekeeperTokenUnavailable
        exp_alerts: []
      - eval_time: 20m
        alertname: GatekeeperTokenUnavailable
        exp_alerts: []

  - interval: 15s
    name: with no gatekeeper series at all GatekeeperTokenUnavailable is silent
    input_series:
      - series: 'up{job="kubelet",namespace="kube-system",service="kubelet"}'
        values: "1x400"
    alert_rule_test:
      - eval_time: 20m
        alertname: GatekeeperTokenUnavailable
