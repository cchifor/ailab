        values: "0x40"
      - series: 'gatekeeper_redis_reconnections_total{job="gatekeeper",namespace="strive-ailab",pod="gatekeeper-bbb"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 1m
        alertname: GatekeeperRedisDisconnected
        exp_alerts: []
      - eval_time: 3m
        alertname: GatekeeperRedisDisconnected
        exp_alerts:
          - exp_labels:
              severity: critical
              pod: gatekeeper-aaa
            exp_annotations:
              summary: "gatekeeper pod gatekeeper-aaa is serving from its in-memory fallback, not Redis"
              description: >-
                gatekeeper_redis_connected has read 0 on pod gatekeeper-aaa for 2m: the replica lost
                Redis, or started without it, and keeps sessions and refresh state in its own memory, so a
