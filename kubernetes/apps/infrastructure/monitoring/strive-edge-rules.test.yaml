# `promtool test rules` fixtures for strive-edge-rules.yaml. Run by scripts/rules-lint.sh on every
# PR, after `promtool check rules`.
#
# WHY: `check rules` proves an expression PARSES, not that it can fire or that it stays quiet. Every
# rule below is asserted BOTH ways - it fires on the shape of the incident it exists for, and it is
# silent on the three shapes that must never page: NO TRAFFIC, ONE ISOLATED 5xx, and a MISSING SERIES
# (a 5xx series does not exist until the first such response, and a scrape can be absent). The `severity`
# label is asserted on every firing alert, because Alertmanager and the ntfy template read it.
#
# Series are written to match the REAL label sets (see the header of strive-edge-rules.yaml): the
# gatekeeper OTLP series carry http_route / http_status_code / instance="<pod>-1" and NO namespace
# or pod; the scraped gatekeeper_tokenreview_* series carry namespace / pod / outcome; the Traefik
# series carry entrypoint / code plus the scrape target's namespace / pod (verified live 2026-10-07); the
# router / service series StriveEdgeGenerated5xx reads carry exported_service / code / method / protocol
# (the router ones also `router`) plus namespace / pod (verified live in E4's controlled test, 2026-10-08).
#
# Counters start at a NON-ZERO value wherever the series is meant to pre-exist: a brand-new counter
# series loses its first event to increase() (see the rules header), and a fixture that begins at 0
# would silently test a different, weaker expression.
#
# `rule_files` is the extracted spec name, because rules-lint.sh hands promtool the `spec:` body of
# each PrometheusRule (the CRD wrapper is not a promtool rules file) under the manifest's basename.
rule_files:
  - strive-edge-rules.yaml

evaluation_interval: 1m

tests:
  # =================================================================== TraefikScrapeMissing
  - interval: 1m
    name: no Traefik target at all pages after 15m (the state before E1a), not before
    input_series:
      # Something else is being scraped, so this is "Traefik absent", not "Prometheus empty".
      - series: 'up{job="kubelet",namespace="kube-system",service="kubelet"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: TraefikScrapeMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: TraefikScrapeMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: platform-edge
              service: traefik-metrics
            exp_annotations:
              summary: "Traefik metrics are not being scraped (platform-edge/traefik-metrics)"
              description: >-
                There is no `up` series for service traefik-metrics in namespace platform-edge, or a
                Traefik target reports 0, and it has been so for 15m. Until it is back the StriveEdge*
                rules cannot fire. Check the ServiceMonitor `traefik` carries
                `release: kube-prometheus-stack`, that Service `traefik-metrics` exists with port
                `metrics`, and the Prometheus targets page (platform E1a).

  - interval: 1m
    name: one unscrapeable Traefik pod pages, the healthy two do not
    input_series:
      - series: 'up{namespace="platform-edge",service="traefik-metrics",pod="traefik-a"}'
        values: "0x40"
      - series: 'up{namespace="platform-edge",service="traefik-metrics",pod="traefik-b"}'
        values: "1x40"
      - series: 'up{namespace="platform-edge",service="traefik-metrics",pod="traefik-c"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: TraefikScrapeMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: TraefikScrapeMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: platform-edge
              service: traefik-metrics
              pod: traefik-a
            exp_annotations:
              summary: "Traefik metrics are not being scraped (platform-edge/traefik-metrics)"
              description: >-
                There is no `up` series for service traefik-metrics in namespace platform-edge, or a
                Traefik target reports 0, and it has been so for 15m. Until it is back the StriveEdge*
                rules cannot fire. Check the ServiceMonitor `traefik` carries
                `release: kube-prometheus-stack`, that Service `traefik-metrics` exists with port
                `metrics`, and the Prometheus targets page (platform E1a).

  - interval: 1m
    name: healthy targets, a pod rollout and a 10m scrape gap do not page
    input_series:
      # A rollout: traefik-a leaves, traefik-d arrives, traefik-b is up throughout. Series are keyed
      # by pod, so the replacement is a new series and absent() never sees an empty set.
      - series: 'up{namespace="platform-edge",service="traefik-metrics",pod="traefik-a"}'
        values: "1x15 _x25"
      - series: 'up{namespace="platform-edge",service="traefik-metrics",pod="traefik-d"}'
        values: "_x15 1x25"
      - series: 'up{namespace="platform-edge",service="traefik-metrics",pod="traefik-b"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: TraefikScrapeMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: TraefikScrapeMissing
        exp_alerts: []
      - eval_time: 35m
        alertname: TraefikScrapeMissing
        exp_alerts: []

  - interval: 1m
    name: a scrape gap shorter than the 15m hold (a Prometheus restart) does not page
    input_series:
      # All targets vanish for 10 samples, then return. absent() is true for part of the gap, the
      # `for: 15m` hold is what keeps this from paging.
      - series: 'up{namespace="platform-edge",service="traefik-metrics",pod="traefik-a"}'
        values: "1x10 _x10 1x20"
      - series: 'up{namespace="platform-edge",service="traefik-metrics",pod="traefik-b"}'
        values: "1x10 _x10 1x20"
      - series: 'up{job="kubelet",namespace="kube-system",service="kubelet"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 18m
        alertname: TraefikScrapeMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: TraefikScrapeMissing
        exp_alerts: []

  # ================================================================ StriveEdge5xxRatioHigh
  - interval: 30s
    name: 15% of web-entrypoint requests answering 5xx for 10m pages critical
    input_series:
      # Three Traefik pods, 2 req/s in total, 15% of it 5xx (+3 of every +20 per pod per 30s).
      # The series pre-exist (non-zero start), so rate() sees every event.
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="200",pod="traefik-a"}'
        values: "1000+17x120"
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="502",pod="traefik-a"}'
        values: "10+3x120"
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="200",pod="traefik-b"}'
        values: "1000+17x120"
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="500",pod="traefik-b"}'
        values: "10+3x120"
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="200",pod="traefik-c"}'
        values: "1000+17x120"
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="503",pod="traefik-c"}'
        values: "10+3x120"
    alert_rule_test:
      # The 10m `for:` has not elapsed yet.
      - eval_time: 8m
        alertname: StriveEdge5xxRatioHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: StriveEdge5xxRatioHigh
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "More than 5% of public edge requests are answering 5xx"
              description: >-
                Over 5% of requests on Traefik entrypoint web (all pods) answered 5xx for 10m, with
                traffic above 0.01 req/s. The strive-edge dashboard splits it by service; the Loki panel
                there shows whether Traefik generated the 5xx itself (OriginStatus 0: a middleware such
                as ForwardAuth failed, or no service was available) or relayed an origin status.

  - interval: 30s
    name: the ratio alert resolves once the 5xx stop
    input_series:
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="200",pod="traefik-a"}'
        values: "1000+17x60 2020+20x100"
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="502",pod="traefik-a"}'
        values: "10+3x60 190+0x100"
    alert_rule_test:
      - eval_time: 16m
        alertname: StriveEdge5xxRatioHigh
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "More than 5% of public edge requests are answering 5xx"
              description: >-
                Over 5% of requests on Traefik entrypoint web (all pods) answered 5xx for 10m, with
                traffic above 0.01 req/s. The strive-edge dashboard splits it by service; the Loki panel
                there shows whether Traefik generated the 5xx itself (OriginStatus 0: a middleware such
                as ForwardAuth failed, or no service was available) or relayed an origin status.
      # 30m of constant 5xx counters later the 5m rate window holds no 5xx.
      - eval_time: 45m
        alertname: StriveEdge5xxRatioHigh
        exp_alerts: []

  - interval: 30s
    name: a ratio below 5% (1%) stays silent on the ratio rule and the burst rule
    input_series:
      # 1 req/s, 1% 5xx: ratio 0.01. 5xx per 10m ~ 6, below the burst's 10 as well.
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="200",pod="traefik-a"}'
        values: "1000+30x120"
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="502",pod="traefik-a"}'
        values: "10+0x2 11+0x2 12+0x2 13+0x2 14+0x2 15+0x2 16+0x2 17+0x2 18+0x2 19+0x2 20+0x2 21+0x2 22+0x2 23+0x2 24+0x2 25+0x2 26+0x2 27+0x2 28+0x2 29+0x2 30+0x2 31+0x2 32+0x2 33+0x2 34+0x2 35+0x2 36+0x2 37+0x2 38+0x2 39+0x2 40+0x2 41+0x2 42+0x2 43+0x2 44+0x2 45+0x2 46+0x2 47+0x2 48+0x2 49+0x2"
    alert_rule_test:
      - eval_time: 20m
        alertname: StriveEdge5xxRatioHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: StriveEdge5xxBurst
        exp_alerts: []

  - interval: 30s
    name: ONE isolated 5xx at moderate traffic pages nothing
    input_series:
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="200",pod="traefik-a"}'
        values: "1000+10x120"
      # A single 502 at about 10 minutes, then flat. A 1-in-300 blip: ratio ~0.3% at the peak.
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="502",pod="traefik-a"}'
        values: "5x20 6x100"
    alert_rule_test:
      - eval_time: 12m
        alertname: StriveEdge5xxRatioHigh
        exp_alerts: []
      - eval_time: 12m
        alertname: StriveEdge5xxBurst
        exp_alerts: []
      - eval_time: 25m
        alertname: StriveEdge5xxRatioHigh
        exp_alerts: []
      - eval_time: 25m
        alertname: StriveEdge5xxBurst
        exp_alerts: []

  - interval: 2m
    name: a COMPLETE outage at very low traffic is below the ratio guard (E2 owns that case)
    input_series:
      # 100% 5xx, but one response per two minutes (0.0083 req/s, below the 0.01 req/s guard) and
      # 5 per 10m (below the burst's 10). Only the traffic guard keeps the ratio rule quiet here.
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="502",pod="traefik-a"}'
        values: "100+1x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: StriveEdge5xxRatioHigh
        exp_alerts: []
      - eval_time: 40m
        alertname: StriveEdge5xxBurst
        exp_alerts: []

  - interval: 30s
    name: no traffic at all (flat counters, 0/0) pages nothing
    input_series:
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="200",pod="traefik-a"}'
        values: "1000+0x120"
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="502",pod="traefik-a"}'
        values: "5+0x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: StriveEdge5xxRatioHigh
        exp_alerts: []
      - eval_time: 30m
        alertname: StriveEdge5xxBurst
        exp_alerts: []

  - interval: 30s
    name: a missing series (no Traefik data, or no 5xx series yet) pages nothing
    input_series:
      # No traefik_* series at all, only an unrelated one. The Traefik rules are silent;
      # TraefikScrapeMissing is what reports this state.
      - series: 'up{job="kubelet",namespace="kube-system",service="kubelet"}'
        values: "1x120"
      # A different pod set with ONLY 200s: the 5xx series does not exist yet.
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="200",pod="traefik-a"}'
        values: "1000+10x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: StriveEdge5xxRatioHigh
        exp_alerts: []
      - eval_time: 30m
        alertname: StriveEdge5xxBurst
        exp_alerts: []

  - interval: 30s
    name: 5xx on the metrics and websecure entrypoints and in other namespaces do not count
    input_series:
      # Only entrypoint="web" in namespace platform-edge is the public edge.
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="metrics",code="500",pod="traefik-a"}'
        values: "100+20x120"
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="websecure",code="500",pod="traefik-a"}'
        values: "100+20x120"
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="200",pod="traefik-a"}'
        values: "1000+30x120"
      - series: 'traefik_entrypoint_requests_total{namespace="other",entrypoint="web",code="500",pod="traefik-x"}'
        values: "100+20x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: StriveEdge5xxRatioHigh
        exp_alerts: []
      - eval_time: 30m
        alertname: StriveEdge5xxBurst
        exp_alerts: []

  # ================================================================== StriveEdge5xxBurst
  - interval: 30s
    name: a burst of 5xx pages whatever the ratio (the 2026-10-06 shape, 18 in four minutes)
    input_series:
      # 20 req/s of healthy traffic keeps the ratio far below 5% (< 0.2%), so ONLY the burst rule can
      # fire. 18 5xx between 10:00 and 14:00 (+3 per tick, six ticks), then nothing - like the
      # incident, the burst stops by itself.
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="200",pod="traefik-a"}'
        values: "100000+600x200"
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="500",pod="traefik-a"}'
        values: "5x20 8 11 14 17 20 23 23x174"
    alert_rule_test:
      - eval_time: 9m
        alertname: StriveEdge5xxBurst
        exp_alerts: []
      - eval_time: 14m
        alertname: StriveEdge5xxBurst
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "At least 10 public edge 5xx responses in 10 minutes"
              description: >-
                Traefik entrypoint web (all pods) answered at least 10 5xx in the last 10 minutes,
                whatever the ratio to traffic. On 2026-10-06 18:06-18:10Z the edge served 18 in four
                minutes and nothing alerted. Use the strive-edge dashboard to split by service, and the
                Loki panel (DownstreamStatus >= 500) to see router, origin status and Traefik pod.
      # The ratio rule must NOT have fired for the same burst: this is what the burst rule is for.
      - eval_time: 14m
        alertname: StriveEdge5xxRatioHigh
        exp_alerts: []
      # Resolves once the burst has left the 10m window.
      - eval_time: 40m
        alertname: StriveEdge5xxBurst
        exp_alerts: []

  - interval: 30s
    name: the burst is summed across pods, no single pod needs to reach 10
    input_series:
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="500",pod="traefik-a"}'
        values: "5+1x40 45x100"
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="502",pod="traefik-b"}'
        values: "5+1x40 45x100"
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="200",pod="traefik-a"}'
        values: "100000+600x140"
    alert_rule_test:
      # 20 minutes of one 5xx per 30 s on each pod: 40 per pod per 20 min, 20 in any 10m window.
      - eval_time: 18m
        alertname: StriveEdge5xxBurst
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "At least 10 public edge 5xx responses in 10 minutes"
              description: >-
                Traefik entrypoint web (all pods) answered at least 10 5xx in the last 10 minutes,
                whatever the ratio to traffic. On 2026-10-06 18:06-18:10Z the edge served 18 in four
                minutes and nothing alerted. Use the strive-edge dashboard to split by service, and the
                Loki panel (DownstreamStatus >= 500) to see router, origin status and Traefik pod.

  - interval: 30s
    name: fewer than 10 5xx in the window (6) stays silent
    input_series:
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="200",pod="traefik-a"}'
        values: "100000+600x200"
      - series: 'traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code="500",pod="traefik-a"}'
        values: "5x20 6 7 8 9 10 11 11x174"
    alert_rule_test:
      - eval_time: 14m
        alertname: StriveEdge5xxBurst
        exp_alerts: []

  # ============================================================ StriveEdgeGenerated5xx
  # Series match the live label sets measured in E4 (2026-10-08): the router series carry router and
  # exported_service (the router's service), the service series only exported_service, both plus the scrape
  # target's namespace / pod. Service names are real ones from the cluster. Counters start at a NON-ZERO value
  # wherever the series is meant to pre-exist (see the top of this file).
  - interval: 30s
    name: ForwardAuth refused (router 500, NO service 5xx series at all) pages - the zero-fill case
    input_series:
      # The E4 shape: a router 500 that the service handler never produced, so no service 500 series
      # exists. +1 per 30 s for 20 m (about 20 per 10m), then flat.
      - series: 'traefik_router_requests_total{namespace="platform-edge",exported_service="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",router="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",code="500",method="GET",protocol="http",pod="traefik-a"}'
        values: "5+1x40 45x80"
      - series: 'traefik_router_requests_total{namespace="platform-edge",exported_service="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",router="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",code="200",method="GET",protocol="http",pod="traefik-a"}'
        values: "1000+10x120"
      - series: 'traefik_service_requests_total{namespace="platform-edge",exported_service="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",code="200",method="GET",protocol="http",pod="traefik-a"}'
        values: "1000+10x120"
    alert_rule_test:
      - eval_time: 15m
        alertname: StriveEdgeGenerated5xx
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_service: "strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd"
            exp_annotations:
              summary: "Traefik answered 5xx itself for strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd"
              description: >-
                More than 3 5xx in the last 10 minutes were returned to clients by the Traefik router of
                strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd without its service handler producing them (router 5xx minus
                service 5xx): a ForwardAuth call that failed or answered 5xx, a middleware error, or a
                service with no endpoints. An origin 5xx and an unreachable origin are counted on both
                sides and do not count here (StriveEdge5xxBurst covers those). The Loki panel on the
                strive-edge dashboard (OriginStatus 0) lists the requests; check gatekeeper first
                (GatekeeperForwardAuth5xx) and its pods.
                If the route is fronted by a TraefikService (kubectl get traefikservices -A), the names
                do not join and its origin 5xx count here too.
      # Flat for 25 m by now: the 10m window holds no increase and the alert has resolved.
      - eval_time: 45m
        alertname: StriveEdgeGenerated5xx
        exp_alerts: []

  - interval: 30s
    name: origin 5xx and an unreachable origin (500 and 502 in BOTH families) stay silent
    input_series:
      # Router and service count the same requests, so the difference is 0 however many there are.
      - series: 'traefik_router_requests_total{namespace="platform-edge",exported_service="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",router="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",code="500",method="GET",protocol="http",pod="traefik-a"}'
        values: "5+1x40 45x80"
      - series: 'traefik_service_requests_total{namespace="platform-edge",exported_service="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",code="500",method="GET",protocol="http",pod="traefik-a"}'
        values: "5+1x40 45x80"
      # Traefik's own 502 against an origin that refuses the connection is counted by the service handler too.
      - series: 'traefik_router_requests_total{namespace="platform-edge",exported_service="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",router="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",code="502",method="GET",protocol="http",pod="traefik-a"}'
        values: "9+2x40 89x80"
      - series: 'traefik_service_requests_total{namespace="platform-edge",exported_service="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",code="502",method="GET",protocol="http",pod="traefik-a"}'
        values: "9+2x40 89x80"
    alert_rule_test:
      - eval_time: 15m
        alertname: StriveEdgeGenerated5xx
        exp_alerts: []
      - eval_time: 25m
        alertname: StriveEdgeGenerated5xx
        exp_alerts: []

  - interval: 30s
    name: ONE service with ForwardAuth refusals beside origin 500s pages for the edge share only
    input_series:
      # Router counts 2 per tick (1 edge-generated + 1 origin), service counts the 1 origin per tick:
      # the difference is the edge-generated 1 per tick (E4 measured 14 router, 6 service, 8 edge).
      - series: 'traefik_router_requests_total{namespace="platform-edge",exported_service="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",router="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",code="500",method="GET",protocol="http",pod="traefik-a"}'
        values: "5+2x40 85x80"
      - series: 'traefik_service_requests_total{namespace="platform-edge",exported_service="strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd",code="500",method="GET",protocol="http",pod="traefik-a"}'
        values: "5+1x40 45x80"
    alert_rule_test:
      - eval_time: 15m
        alertname: StriveEdgeGenerated5xx
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_service: "strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd"
            exp_annotations:
              summary: "Traefik answered 5xx itself for strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd"
              description: >-
                More than 3 5xx in the last 10 minutes were returned to clients by the Traefik router of
                strive-ailab-web-e1fade25a5de4567b1ba@kubernetescrd without its service handler producing them (router 5xx minus
                service 5xx): a ForwardAuth call that failed or answered 5xx, a middleware error, or a
                service with no endpoints. An origin 5xx and an unreachable origin are counted on both
                sides and do not count here (StriveEdge5xxBurst covers those). The Loki panel on the
                strive-edge dashboard (OriginStatus 0) lists the requests; check gatekeeper first
                (GatekeeperForwardAuth5xx) and its pods.
                If the route is fronted by a TraefikService (kubectl get traefikservices -A), the names
                do not join and its origin 5xx count here too.

  - interval: 30s
    name: it is per service - edge-generated 5xx on gatekeeper page that service alone, origin 5xx on web do not
    input_series:
