  # ================================================================ StriveTestBypassFromEdge
  # TIMELINES, for both rules below. promtool starts every series at t=0, and the new-series branch asks
  # whether a series existed 15m earlier (`offset 15m`), which before t=15m reaches back before the data.
  # So every fixture whose series must count as PRE-EXISTING evaluates only at 16m or later, and puts its
  # increments after that. A series that must count as NEW is absent until a mid-run sample (`_x20 1x50`).

  - interval: 1m
