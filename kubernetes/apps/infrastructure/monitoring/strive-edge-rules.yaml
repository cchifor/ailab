# Alerts for the strive platform's public edge (Cloudflare -> cloudflared -> Traefik -> gatekeeper
# ForwardAuth -> origin) and for gatekeeper itself. Item 4 / E3 of
# plans/2026-10-07-auth-hardening-and-ops-plan.md (D14).
#
# WHY THIS EXISTS: on 2026-10-06 18:06-18:10Z the edge served 18 5xx through ONE Traefik pod and
# nothing noticed. Six of them were generated by Traefik itself (OriginStatus 0, no service, no
# application 5xx), twelve carried an upstream status, gatekeeper logged no errors, and Traefik had
# NO scrape at all (its ServiceMonitor lacks the `release` label Prometheus selects on, and the
# `traefik` Service exposes no metrics port), so the only record was 7 days of access log lines. The
# plan's E1a fixes the scrape in the platform repo; this file is what reads it. E5's dashboard
# (strive-edge-dashboard.yaml) is the matching view; E2 (Gatus, apps/gatus/configmap.yaml) probes
# the public path from outside.
#
# TWO SERIES FAMILIES, with different label sets. Do not "tidy" them into one shape:
#   * http_server_request_duration_seconds_count{job="gatekeeper"} is the OTLP RED metric pushed
#     through alloy-otlp (see strive-red-dashboard.yaml). Labels: http_method, http_route,
#     http_status_code, instance (= "<pod>-1", NOT an ip:port), job. No namespace, no pod.
#   * gatekeeper_tokenreview_* is scraped from the pod's /metrics: namespace, pod, instance
#     (ip:5000), job="gatekeeper", plus the metric's own labels (outcome=authenticated|refused|
#     mismatch|unavailable). Both names and labels were checked against live Prometheus on
#     2026-10-07.
#   * traefik_entrypoint_requests_total{entrypoint, code, method, protocol} plus the scrape target's
#     namespace / pod / service="traefik-metrics" / job="traefik-metrics". Verified against live
#     Prometheus on 2026-10-07, when platform E1a (the `traefik-metrics` Service plus the
#     ServiceMonitor `release` label) went live (first sample ~08:46Z, so there is no earlier
#     history). entrypoint `web` is the one cloudflared talks to. WATCH `service`: Traefik's own
#     `service` label on traefik_service_requests_total collides with the target's
#     service="traefik-metrics" and Prometheus renames it `exported_service`, so any future rule that
#     groups or matches Traefik services (StriveEdgeGenerated5xx) must use `exported_service`.
#
# EVERY EXPRESSION SUMS ACROSS PODS (gatekeeper runs two replicas and a restart changes the pod
# label) and uses increase()/rate(), so a counter reset on a pod restart is handled.
#
# A BRAND-NEW COUNTER SERIES LOSES ITS FIRST EVENT. The OTLP exporter and Traefik both create the
# {code="502"} / {http_status_code="500"} series on the first such response, with value 1 and no
# earlier sample, and increase() cannot see a rise from nothing (measured on the live 503 series:
# the first sample of each is 1 and 2, not 0, so 3 of 110 events were invisible). The thresholds
# below are therefore "at least N visible events", and the very first 5xx a pod ever serves is
# invisible. That is accepted: these rules are for incidents, not for one stray response.
#
# The generic TargetDown does not cover the gatekeeper OTLP series (they are pushed, not scraped),
# and an expression over an absent series never fires, so the "no data" case is handled only
# where the plan asks for it (TraefikScrapeMissing). Fixtures in strive-edge-rules.test.yaml
# (NOT a resource - promtool only, via scripts/rules-lint.sh) assert each rule fires on its
# incident shape and stays silent on no traffic, one isolated 5xx and a missing series.
#
# STRIVEEDGEGENERATED5XX (router 5xx minus service 5xx), PROVEN BY E4's CONTROLLED TEST. With
# addRoutersLabels on (platform E1b) Traefik 3.4.3 exports traefik_router_requests_total{router,
# exported_service,code,method,protocol} next to traefik_service_requests_total{exported_service,code,
# method,protocol}, both plus the scrape target's namespace / pod / service="traefik-metrics". The router
# series is the status the router returned to the client; the service series is only what the service
# handler returned, so a 5xx that Traefik produced BEFORE the service (a failed ForwardAuth call, a
# service with no endpoints) is in the first family and not in the second. Every IngressRoute route in this
# estate has one Service, so its router and its Traefik service share one name and `exported_service`
# (on the router series it is the router's service) joins the two. Measured on 2026-10-08 on the live
# Traefik, from a pod in a scratch namespace (e4-edge-test, since deleted) with a Host that
# is not public, two bursts one scrape apart, final counters:
#   ForwardAuth target refuses the connection (500)     router 500 = 10  service: NO series  -> edge
#   ForwardAuth server itself answers 500 (relayed)     router 500 = 7   service: NO series  -> edge
#   service with no endpoints (503, OriginStatus 0)     router 503 = 9   service: NO series  -> edge
#   origin answers 500                                  router 500 = 8   service 500 = 8     -> 0
#   origin port refuses (Traefik's own 502)             router 502 = 9   service 502 = 9     -> 0
#   errors middleware over that 502 (sandbox-errors)    router 502 = 9   service 502 = 9     -> 0
#   one service: 8 ForwardAuth refusals + 6 origin 500  router 500 = 14  service 500 = 6     -> 8 (edge share)
#   a never-hit service                                 no series        no series           -> absent
# Live data agrees: the one real 5xx since E1a (a 504 on web, protocol sse) is in both families, and the
# ForwardAuth 401s are router-only, which is why the rule is restricted to code=~"5..". A plain `A - B` DROPS
# the edge-generated rows (no service series, so no match), the one case the rule exists for: the `or`
# branch zero-fills the service side from the router expression itself. A service with NO router series
# has nothing to subtract from, so a never-hit service stays absent. Counters live in Traefik's memory: a
# restart resets the router and the service series TOGETHER and a pod replacement is a new pod label,
# which `sum by (exported_service)` merges; neither is a false positive (fixtures: pod replacement and
# in-place counter reset). That is reasoning plus fixtures, NOT a live restart: Traefik is the shared edge
# and one replica, so E4 did not restart it. The 502 case matters for scope: an unreachable origin is
# counted by the service handler, so it is NOT "edge-generated" here; StriveEdge5xxBurst and
# StriveEdge5xxRatioHigh cover it.
#
# THE SECOND GROUP (strive-gatekeeper-hardening) READS SERIES THAT GATEKEEPER RELEASE AG1a CREATES
# (plan A1.0, A2.1, A4.1): gatekeeper_redis_connected{} (a label-less Gauge: 1 on live Redis, 0 on the
# per-process memory fallback, 0 from the first scrape on a replica that started in fallback), the
# existing gatekeeper_redis_fallback_total counter now incremented on every switch to memory, and two
# new gatekeeper_auth_requests_total label values, {method="test_bypass",status="edge_refused"} and
# {method="api_key",status="disabled"}. Checked against live Prometheus on 2026-10-07, BEFORE AG1a:
# job="gatekeeper" (namespace strive-ailab, pod, instance ip:5000, service, container, endpoint) is the
# real scrape label set; gatekeeper_auth_requests_total additionally carries tenant_id, method, status;
# gatekeeper_redis_fallback_total and gatekeeper_redis_reconnections_total ALREADY exist (pre-initialised
# at 0 on both pods, no increase in 7 days); gatekeeper_redis_connected, any method="api_key" series and
# any status="edge_refused" / "disabled" series do NOT exist yet. These four rules therefore stay silent
# until AG1a is live (an expression over an absent series never fires), and the fixtures in
# strive-edge-rules.test.yaml, not the cluster, are what proves them until then.
#
# THE FIRST EVENT OF A LAZILY CREATED SERIES: gatekeeper_auth_requests_total children are created per
# (tenant_id, method, status) on first use, so the FIRST edge_refused (or first non-disabled api_key)
# event on a pod appears as a brand-new series at value 1, and increase() cannot see a rise from
# nothing (the same blind spot as the 5xx counters above). For these two security signals a single
# request is exactly the case to see, so each rule has a second branch,
# `count((X > 0) unless (last_over_time(X[1h] offset 15m))) > 0`: a series that exists now with a value
# above 0 but had NO sample in the hour that ended 15m ago is its first event, and it keeps the alert up
# for the same 15m as the increase() branch. `unless` matches whole label sets, so an old series never
# counts, and a child created already at 0 (a pre-initialised one on a new pod) never counts.
# WHY A RANGE, NOT `X offset 15m`: the instant lookup finds a sample only within the 5m lookback delta
# before now-15m, so an OLD series whose scrape paused for more than 5m (a Prometheus restart, a
# NetworkPolicy roll) read as new for about (gap - 5m) and paged falsely. The 1h range tolerates a gap
# of up to about an hour. THE PRICE, a blind spot: a child that already existed, on a gatekeeper
# container that then restarted IN PLACE (same pod name and IP: its counters reset and the child is
# recreated lazily), and whose first event after the restart comes more than 15m but less than ~75m
# after the last pre-restart sample, reads as old to this branch and as a single sample to increase().
# A new pod (a rollout) is a new series and is seen. The redis gauge has neither gap (it exists from
# process start).
#
# DRILLS AND PLANNED PLATFORM-WIDE ROLLS run under an Alertmanager silence scoped to the expected
# alerts (GatekeeperHttp5xx, GatekeeperTokenUnavailable, GatekeeperTokenReviewLimited) and the
# window, instead of a permanent exemption here.
#
# `release: kube-prometheus-stack` so the operator's ruleSelector picks it up (same convention as
# backup-rules.yaml / reviewbot-rules.yaml). Every rule carries a `severity`; the fixtures assert it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: strive-edge
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: strive-edge
      rules:
        # FIRST, because it is what keeps the Traefik rules honest: every StriveEdge* rule reads a
        # traefik_* series, and an expression over an absent series never fires. If the scrape is
        # lost (a chart bump that drops the ServiceMonitor label, the traefik-metrics Service
        # removed) those rules go silent exactly when the edge is least observable. `absent()` covers
        # "no target at all"; `== 0` covers a discovered target that cannot be scraped. NOT a TargetDown
        # duplicate: the generic TargetDown reads `up` and cannot see a target that was never
        # discovered, which is the state E1a fixed (the target is scraped since 2026-10-07 ~08:46Z, so
        # this does not fire today; a 7-day backtest is true only up to that moment).
        - alert: TraefikScrapeMissing
          expr: |
            absent(up{namespace="platform-edge",service="traefik-metrics"})
            or
            up{namespace="platform-edge",service="traefik-metrics"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Traefik metrics are not being scraped (platform-edge/traefik-metrics)"
            description: >-
              There is no `up` series for service traefik-metrics in namespace platform-edge, or a
              Traefik target reports 0, and it has been so for 15m. Until it is back the StriveEdge*
              rules cannot fire. Check the ServiceMonitor `traefik` carries
              `release: kube-prometheus-stack`, that Service `traefik-metrics` exists with port
              `metrics`, and the Prometheus targets page (platform E1a).
        # Ratio on the one entrypoint cloudflared uses, summed over every Traefik pod. The traffic
        # guard is what makes the ratio meaningful: at 0.01 req/s a single 502 is a 30% ratio, so
        # without it every quiet-night blip would hold above 5%. A COMPLETE low-traffic outage (no
        # successful requests, a few 502s) is below the guard on purpose; E2's Gatus probes own that
        # case. 0/0 (no traffic at all) is NaN and compares false.
        - alert: StriveEdge5xxRatioHigh
          expr: |
            (
              sum(rate(traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code=~"5.."}[5m]))
              /
              sum(rate(traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web"}[5m]))
              > 0.05
            )
            and
            sum(rate(traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web"}[5m])) > 0.01
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "More than 5% of public edge requests are answering 5xx"
            description: >-
              Over 5% of requests on Traefik entrypoint web (all pods) answered 5xx for 10m, with
              traffic above 0.01 req/s. The strive-edge dashboard splits it by service; the Loki panel
              there shows whether Traefik generated the 5xx itself (OriginStatus 0: a middleware such
              as ForwardAuth failed, or no service was available) or relayed an origin status.
        # The incident shape: a short burst that never lifts the RATIO on a busy edge. 18 5xx over
        # 4 minutes on 2026-10-06 is invisible to a 5% ratio when thousands of 200s surround it.
        # No `for:` - the 10m increase window IS the hold, and a burst that has already happened is
        # worth knowing about even if it stopped. increase() extrapolates slightly, so the boundary
        # is "about 10"; the fixtures use clear margins on both sides.
        - alert: StriveEdge5xxBurst
          expr: |
            sum(increase(traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code=~"5.."}[10m])) >= 10
          labels:
            severity: warning
          annotations:
            summary: "At least 10 public edge 5xx responses in 10 minutes"
            description: >-
              Traefik entrypoint web (all pods) answered at least 10 5xx in the last 10 minutes,
              whatever the ratio to traffic. On 2026-10-06 18:06-18:10Z the edge served 18 in four
              minutes and nothing alerted. Use the strive-edge dashboard to split by service, and the
              Loki panel (DownstreamStatus >= 500) to see router, origin status and Traefik pod.
        # D14 / E4. The 5xx that Traefik answered ITSELF, per Traefik service: router 5xx minus service 5xx
        # over 10m, with the service side zero-filled (see the header: without the `or` branch the one
        # case this rule is for would vanish from the subtraction). Summed over pods, so the alert
        # carries only `exported_service` (router@provider, e.g. strive-ailab-web-<hash>@kubernetescrd).
        # No `for:` - the 10m increase window IS the hold, as for StriveEdge5xxBurst. increase()
        # extrapolates (7 real events read 7.6-8.8 in the E4 test) and the first 5xx of a brand-new
        # series is invisible, so "> 3" means about four or five real events; the fixtures keep clear
        # margins on both sides. It sees only the edge-generated share: an origin 5xx or an
        # unreachable origin is in the service series too and nets to 0.
        - alert: StriveEdgeGenerated5xx
          expr: |
            (
              sum by (exported_service) (increase(traefik_router_requests_total{namespace="platform-edge",code=~"5.."}[10m]))
              -
              (
                sum by (exported_service) (increase(traefik_service_requests_total{namespace="platform-edge",code=~"5.."}[10m]))
                or
                sum by (exported_service) (increase(traefik_router_requests_total{namespace="platform-edge",code=~"5.."}[10m])) * 0
              )
            ) > 3
          labels:
            severity: warning
          annotations:
            summary: "Traefik answered 5xx itself for {{ $labels.exported_service }}"
            description: >-
              More than 3 5xx in the last 10 minutes were returned to clients by the Traefik router of
              {{ $labels.exported_service }} without its service handler producing them (router 5xx minus
              service 5xx): a ForwardAuth call that failed or answered 5xx, a middleware error, or a
              service with no endpoints. An origin 5xx and an unreachable origin are counted on both
              sides and do not count here (StriveEdge5xxBurst covers those). The Loki panel on the
              strive-edge dashboard (OriginStatus 0) lists the requests; check gatekeeper first
              (GatekeeperForwardAuth5xx) and its pods.
        # gatekeeper's ForwardAuth route. Every authenticated request through the edge passes it, so
        # a 5xx here is blocked traffic rather than an application error. 7 days of live data: zero
        # 5xx, so > 3 in 10m is far above the baseline while ignoring one stray response.
        - alert: GatekeeperForwardAuth5xx
          expr: |
            sum(increase(http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth",http_status_code=~"5.."}[10m])) > 3
          labels:
            severity: warning
          annotations:
            summary: "gatekeeper /auth (ForwardAuth) is answering 5xx"
            description: >-
              More than 3 5xx from gatekeeper route /auth (the Traefik ForwardAuth target) in the last
              10 minutes, summed over its pods. Traefik turns a failed ForwardAuth call into its own
              5xx, so this is the origin-side half of what StriveEdge5xxBurst sees at the edge. Check
              the gatekeeper pods, Redis and the Keycloak reachability from gatekeeper.
        # Every other gatekeeper route, PER ROUTE so the alert names the one that is failing. /auth
        # is excluded (GatekeeperForwardAuth5xx owns it, with its own threshold story). For
        # /auth/token every 5xx EXCEPT 503 counts: a 503 there is the TokenReview-unavailable
        # answer, which has its own sustained-window rule (GatekeeperTokenUnavailable) because a
        # brief drill produced 107 of them in 7 days and must not page here. A route with no 5xx
        # series simply returns nothing.
        - alert: GatekeeperHttp5xx
          expr: |
            sum by (http_route) (
              increase(http_server_request_duration_seconds_count{job="gatekeeper",http_route!~"/auth|/auth/token",http_status_code=~"5.."}[10m])
              or
              increase(http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code=~"5..",http_status_code!="503"}[10m])
            ) > 3
          labels:
            severity: warning
          annotations:
            summary: "gatekeeper route {{ $labels.http_route }} is answering 5xx"
            description: >-
              More than 3 5xx from gatekeeper route {{ $labels.http_route }} in the last 10 minutes,
              summed over its pods (for /auth/token a 503 is excluded: that is GatekeeperTokenUnavailable).
              Drills and planned platform-wide rolls run under a silence for this alert. Check the
              gatekeeper pod logs and the request's status code split on the strive-edge dashboard.
        # Sustained TokenReview-unavailable. `sum(increase(...[2m])) > bool 0` is 1 for every minute
        # whose trailing two minutes saw a 503 and 0 otherwise; the subquery takes 15 such minutes
        # and the alert needs all 15 to be 1. The count is the guard that matters: sum_over_time over
        # a series that went absent (a pod replaced mid-burst) would otherwise be a smaller sum of
        # the steps that still had data, and `>= 15` makes a missing step a failure to fire, not a
        # pass. Two-minute windows, not one: a counter that rises between two samples that straddle a
        # window edge is in neither of two adjacent one-minute windows. So "each of the last 15
        # minutes" means "no gap longer than about 100 s between 503s", low volume included. The
        # 2026-10-06 drill (503s 17:22-17:31Z, 10 minutes) is deliberately below this; real outages
        # of TokenReview are not.
        - alert: GatekeeperTokenUnavailable
          expr: |
            sum_over_time(
              (
                sum(increase(http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="503"}[2m])) > bool 0
              )[15m:1m]
            ) >= 15
          labels:
            severity: critical
          annotations:
            summary: "gatekeeper /auth/token has answered 503 continuously for 15 minutes"
            description: >-
              gatekeeper route /auth/token (service-to-service token minting) answered 503, the
              TokenReview-unavailable status, in every two-minute window of the last 15 minutes. Check
              the Kubernetes API reachability from gatekeeper and GatekeeperTokenReviewLimited. Drills
              and planned platform-wide rolls run under a silence for this alert.
        # The TokenReview client's own signals (D16): a request rate-limited by the client, or an
        # upstream "unavailable" outcome. Either means service-to-service authentication is
        # degraded even if no 503 has reached a caller yet. Both counters are pre-initialised to 0 on
        # every pod (scraped, unlike the OTLP series), so increase() sees the first event. `or` of two
        # label-less sums: a missing branch simply contributes nothing.
        - alert: GatekeeperTokenReviewLimited
          expr: |
            sum(increase(gatekeeper_tokenreview_limited_total{job="gatekeeper"}[10m])) > 0
            or
            sum(increase(gatekeeper_tokenreview_total{job="gatekeeper",outcome="unavailable"}[10m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "gatekeeper TokenReview calls are being limited or are unavailable"
            description: >-
              In the last 10 minutes gatekeeper rate-limited a TokenReview call
              (gatekeeper_tokenreview_limited_total) or got an `unavailable` outcome
              (gatekeeper_tokenreview_total). Service-to-service tokens may be refused or delayed.
              Drills and planned platform-wide rolls run under a silence for this alert.
    # Auth-hardening plan items 1 (A1.0, A2.1, A4.1) and E3. Needs gatekeeper release AG1a: see the
    # header. A separate group so the dependency is visible and these rules evaluate on their own.
    - name: strive-gatekeeper-hardening
      rules:
        # TWO rules, not one, because `for:` applies to a whole expression: the STATE (this rule,
        # held 2m so a flap that reconnects does not page) and the TRANSITION (the next rule, no hold).
        # Per pod, so one failed replica beside a healthy one fires for that pod alone and its pod
        # label names the culprit. The gauge, not a counter, is the signal, because a replica that
        # STARTED in fallback has no event to count: its fallback counter is already 1 at its first
        # scrape, and an idle replica can sit in fallback with no failing operation. `max by (pod)`
        # drops the scrape's instance / container / endpoint labels so each alert carries just `pod`,
        # and keeps the pods apart: a healthy replica's 1 never masks a failed replica's 0.
        - alert: GatekeeperRedisDisconnected
          expr: |
            max by (pod) (gatekeeper_redis_connected{job="gatekeeper"}) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "gatekeeper pod {{ $labels.pod }} is serving from its in-memory fallback, not Redis"
            description: >-
              gatekeeper_redis_connected has read 0 on pod {{ $labels.pod }} for 2m: the replica lost
              Redis, or started without it, and keeps sessions and refresh state in its own memory, so a
              user routed to another replica is signed out and that state is not shared. The gauge reads 0
              from the first scrape of a replica that started in fallback, which no counter shows. Check
              Valkey (its NetworkPolicy and AUTH password if A1.2 or A1.5 just rolled) and this pod's logs
              for "in-memory fallback". Planned platform-wide rolls (A1.4, A1.5) run under a silence for
              this alert.
        # The transition. No `for:` - the 5m increase window IS the hold, and a fallback that already
        # reconnected is still worth knowing about (it is the ONLY rule that sees a flap shorter than
        # GatekeeperRedisDisconnected's 2m). A replica that started in fallback never fires this one
        # (its first sample is already 1); that case is the rule above.
        - alert: GatekeeperRedisFallbackEvent
          expr: |
            sum by (pod) (increase(gatekeeper_redis_fallback_total{job="gatekeeper"}[5m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "gatekeeper pod {{ $labels.pod }} fell back from Redis to in-memory in the last 5 minutes"
            description: >-
              gatekeeper_redis_fallback_total rose on pod {{ $labels.pod }} within 5 minutes: it switched
              to its in-memory fallback (a failed connect, or a failed Redis operation). This is the
              transition; GatekeeperRedisDisconnected is the state and fires only if the pod stays in
              fallback for 2m, so a brief flap that already reconnected shows only here. See also
              gatekeeper_redis_reconnections_total. Planned platform-wide rolls (A1.4, A1.5) run under a
              silence for this alert.
        # F-04. After AG1a the test-bypass track refuses a request carrying cf-ray, cf-connecting-ip or
        # cdn-loop (Cloudflare adds them; a client cannot remove them) with the usual 401, WITHOUT
        # comparing the token, and counts it. Any such request is either a client on the internet
        # sending the bypass header, or an internal test client that now reaches gatekeeper through the
        # edge. Summed over pods and tenants: one alert, and the dashboard's /auth outcomes panel splits
        # it. The second branch (`unless ... last_over_time(... offset 15m)`) catches the first refusal on a pod,
        # a series that does not exist until then; see the header.
        - alert: StriveTestBypassFromEdge
          expr: |
            sum(increase(gatekeeper_auth_requests_total{job="gatekeeper",method="test_bypass",status="edge_refused"}[15m])) > 0
            or
            count((gatekeeper_auth_requests_total{job="gatekeeper",method="test_bypass",status="edge_refused"} > 0) unless (last_over_time(gatekeeper_auth_requests_total{job="gatekeeper",method="test_bypass",status="edge_refused"}[1h] offset 15m))) > 0
          labels:
            severity: warning
          annotations:
            summary: "gatekeeper refused test-bypass requests that came through the Cloudflare edge"
            description: >-
              In the last 15 minutes gatekeeper counted a test-bypass request carrying a Cloudflare
              header (cf-ray, cf-connecting-ip or cdn-loop) as edge_refused and answered 401 without
              comparing the token. Either a client on the internet is sending the bypass header, or a
              test client (Sentinel) now reaches Traefik through Cloudflare instead of in-cluster; in that
              case its token has crossed the public edge. Plan A4.2 lists every path into Traefik.
        # F-02, D2 = a. API keys are retired: AG1a sets API_KEYS_ENABLED=false, after which an
        # X-API-Key is ignored and counted as status="disabled" (expected, so excluded here). Any other
        # api_key status means a key was looked up on some pod (accepted, refused or rate limited):
        # the flag is not false there (a rollback, a config drift), or the AG1a pin was reverted. The second
        # branch (`unless ... last_over_time(... offset 15m)`) catches the first lookup on a pod: that child
        # does not exist until then (see the header).
        - alert: GatekeeperApiKeyUsed
          expr: |
            sum(increase(gatekeeper_auth_requests_total{job="gatekeeper",method="api_key",status!="disabled"}[15m])) > 0
            or
            count((gatekeeper_auth_requests_total{job="gatekeeper",method="api_key",status!="disabled"} > 0) unless (last_over_time(gatekeeper_auth_requests_total{job="gatekeeper",method="api_key",status!="disabled"}[1h] offset 15m))) > 0
          labels:
            severity: warning
          annotations:
            summary: "gatekeeper looked up an API key although API keys are retired"
            description: >-
              In the last 15 minutes gatekeeper_auth_requests_total{method="api_key"} rose, or first
              appeared, with a status other than `disabled`: an X-API-Key was validated (accepted or
              refused), so API_KEYS_ENABLED is not false on at least one pod. Check the gatekeeper env on
              every pod and that the AG1a pin is still live. The expected `disabled` status (a key sent
              and ignored) does not page.
