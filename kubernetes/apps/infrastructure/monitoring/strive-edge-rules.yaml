# Alerts for the strive platform's public edge (Cloudflare -> cloudflared -> Traefik -> gatekeeper
# ForwardAuth -> origin) and for gatekeeper itself. Item 4 / E3 of
# plans/2026-10-07-auth-hardening-and-ops-plan.md (D14).
#
# WHY THIS EXISTS: on 2026-10-06 18:06-18:10Z the edge served 18 5xx through ONE Traefik pod and
# nothing noticed. Six of them were generated by Traefik itself (OriginStatus 0, no service, no
# application 5xx), twelve carried an upstream status, gatekeeper logged no errors, and Traefik had
# NO scrape at all (its ServiceMonitor lacks the `release` label Prometheus selects on, and the
# `traefik` Service exposes no metrics port), so the only record was 7 days of access log lines. The
# plan's E1a fixes the scrape in the platform repo; this file is what reads it. E5's dashboard
# (strive-edge-dashboard.yaml) is the matching view; E2 (Gatus, apps/gatus/configmap.yaml) probes
# the public path from outside.
#
# TWO SERIES FAMILIES, with different label sets. Do not "tidy" them into one shape:
#   * http_server_request_duration_seconds_count{job="gatekeeper"} is the OTLP RED metric pushed
#     through alloy-otlp (see strive-red-dashboard.yaml). Labels: http_method, http_route,
#     http_status_code, instance (= "<pod>-1", NOT an ip:port), job. No namespace, no pod.
#   * gatekeeper_tokenreview_* is scraped from the pod's /metrics: namespace, pod, instance
#     (ip:5000), job="gatekeeper", plus the metric's own labels (outcome=authenticated|refused|
#     mismatch|unavailable). Both names and labels were checked against live Prometheus on
#     2026-10-07.
#   * traefik_entrypoint_requests_total{entrypoint, code, method, protocol} plus the scrape target's
#     namespace / pod / service="traefik-metrics" / job="traefik-metrics". Verified against live
#     Prometheus on 2026-10-07, when platform E1a (the `traefik-metrics` Service plus the
#     ServiceMonitor `release` label) went live (first sample ~08:46Z, so there is no earlier
#     history). entrypoint `web` is the one cloudflared talks to. WATCH `service`: Traefik's own
#     `service` label on traefik_service_requests_total collides with the target's
#     service="traefik-metrics" and Prometheus renames it `exported_service`, so any future rule that
#     groups or matches Traefik services (StriveEdgeGenerated5xx) must use `exported_service`.
#
# EVERY EXPRESSION SUMS ACROSS PODS (gatekeeper runs two replicas and a restart changes the pod
# label) and uses increase()/rate(), so a counter reset on a pod restart is handled.
#
# A BRAND-NEW COUNTER SERIES LOSES ITS FIRST EVENT. The OTLP exporter and Traefik both create the
# {code="502"} / {http_status_code="500"} series on the first such response, with value 1 and no
# earlier sample, and increase() cannot see a rise from nothing (measured on the live 503 series:
# the first sample of each is 1 and 2, not 0, so 3 of 110 events were invisible). The thresholds
# below are therefore "at least N visible events", and the very first 5xx a pod ever serves is
# invisible. That is accepted: these rules are for incidents, not for one stray response.
#
# The generic TargetDown does not cover the gatekeeper OTLP series (they are pushed, not scraped),
# and an expression over an absent series never fires, so the "no data" case is handled only
# where the plan asks for it (TraefikScrapeMissing). Fixtures in strive-edge-rules.test.yaml
# (NOT a resource - promtool only, via scripts/rules-lint.sh) assert each rule fires on its
# incident shape and stays silent on no traffic, one isolated 5xx and a missing series.
#
# NOT HERE YET, on purpose: GatekeeperRedisDisconnected / GatekeeperRedisFallbackEvent,
# StriveTestBypassFromEdge and GatekeeperApiKeyUsed need a gatekeeper release that does not exist
# yet (A1.0 / AG1a), and StriveEdgeGenerated5xx waits for E1b (router metrics) and E4's test of the
# router-minus-service arithmetic on Traefik 3.4.3.
#
# DRILLS AND PLANNED PLATFORM-WIDE ROLLS run under an Alertmanager silence scoped to the expected
# alerts (GatekeeperHttp5xx, GatekeeperTokenUnavailable, GatekeeperTokenReviewLimited) and the
# window, instead of a permanent exemption here.
#
# `release: kube-prometheus-stack` so the operator's ruleSelector picks it up (same convention as
# backup-rules.yaml / reviewbot-rules.yaml). Every rule carries a `severity`; the fixtures assert it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: strive-edge
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: strive-edge
      rules:
        # FIRST, because it is what keeps the Traefik rules honest: every StriveEdge* rule reads a
        # traefik_* series, and an expression over an absent series never fires. If the scrape is
        # lost (a chart bump that drops the ServiceMonitor label, the traefik-metrics Service
        # removed) those rules go silent exactly when the edge is least observable. `absent()` covers
        # "no target at all"; `== 0` covers a discovered target that cannot be scraped. NOT a TargetDown
        # duplicate: the generic TargetDown reads `up` and cannot see a target that was never
        # discovered, which is the state E1a fixed (the target is scraped since 2026-10-07 ~08:46Z, so
        # this does not fire today; a 7-day backtest is true only up to that moment).
        - alert: TraefikScrapeMissing
          expr: |
            absent(up{namespace="platform-edge",service="traefik-metrics"})
            or
            up{namespace="platform-edge",service="traefik-metrics"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Traefik metrics are not being scraped (platform-edge/traefik-metrics)"
            description: >-
              There is no `up` series for service traefik-metrics in namespace platform-edge, or a
              Traefik target reports 0, and it has been so for 15m. Until it is back the StriveEdge*
              rules cannot fire. Check the ServiceMonitor `traefik` carries
              `release: kube-prometheus-stack`, that Service `traefik-metrics` exists with port
              `metrics`, and the Prometheus targets page (platform E1a).
        # Ratio on the one entrypoint cloudflared uses, summed over every Traefik pod. The traffic
        # guard is what makes the ratio meaningful: at 0.01 req/s a single 502 is a 30% ratio, so
        # without it every quiet-night blip would hold above 5%. A COMPLETE low-traffic outage (no
        # successful requests, a few 502s) is below the guard on purpose; E2's Gatus probes own that
        # case. 0/0 (no traffic at all) is NaN and compares false.
        - alert: StriveEdge5xxRatioHigh
          expr: |
            (
              sum(rate(traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code=~"5.."}[5m]))
              /
              sum(rate(traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web"}[5m]))
              > 0.05
            )
            and
            sum(rate(traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web"}[5m])) > 0.01
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "More than 5% of public edge requests are answering 5xx"
            description: >-
              Over 5% of requests on Traefik entrypoint web (all pods) answered 5xx for 10m, with
              traffic above 0.01 req/s. The strive-edge dashboard splits it by service; the Loki panel
              there shows whether Traefik generated the 5xx itself (OriginStatus 0: a middleware such
              as ForwardAuth failed, or no service was available) or relayed an origin status.
        # The incident shape: a short burst that never lifts the RATIO on a busy edge. 18 5xx over
        # 4 minutes on 2026-10-06 is invisible to a 5% ratio when thousands of 200s surround it.
        # No `for:` - the 10m increase window IS the hold, and a burst that has already happened is
        # worth knowing about even if it stopped. increase() extrapolates slightly, so the boundary
        # is "about 10"; the fixtures use clear margins on both sides.
        - alert: StriveEdge5xxBurst
          expr: |
            sum(increase(traefik_entrypoint_requests_total{namespace="platform-edge",entrypoint="web",code=~"5.."}[10m])) >= 10
          labels:
            severity: warning
          annotations:
            summary: "At least 10 public edge 5xx responses in 10 minutes"
            description: >-
              Traefik entrypoint web (all pods) answered at least 10 5xx in the last 10 minutes,
              whatever the ratio to traffic. On 2026-10-06 18:06-18:10Z the edge served 18 in four
              minutes and nothing alerted. Use the strive-edge dashboard to split by service, and the
              Loki panel (DownstreamStatus >= 500) to see router, origin status and Traefik pod.
        # gatekeeper's ForwardAuth route. Every authenticated request through the edge passes it, so
        # a 5xx here is blocked traffic rather than an application error. 7 days of live data: zero
        # 5xx, so > 3 in 10m is far above the baseline while ignoring one stray response.
        - alert: GatekeeperForwardAuth5xx
          expr: |
            sum(increase(http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth",http_status_code=~"5.."}[10m])) > 3
          labels:
            severity: warning
          annotations:
            summary: "gatekeeper /auth (ForwardAuth) is answering 5xx"
            description: >-
              More than 3 5xx from gatekeeper route /auth (the Traefik ForwardAuth target) in the last
              10 minutes, summed over its pods. Traefik turns a failed ForwardAuth call into its own
              5xx, so this is the origin-side half of what StriveEdge5xxBurst sees at the edge. Check
              the gatekeeper pods, Redis and the Keycloak reachability from gatekeeper.
        # Every other gatekeeper route, PER ROUTE so the alert names the one that is failing. /auth
        # is excluded (GatekeeperForwardAuth5xx owns it, with its own threshold story). For
        # /auth/token every 5xx EXCEPT 503 counts: a 503 there is the TokenReview-unavailable
        # answer, which has its own sustained-window rule (GatekeeperTokenUnavailable) because a
        # brief drill produced 107 of them in 7 days and must not page here. A route with no 5xx
        # series simply returns nothing.
        - alert: GatekeeperHttp5xx
          expr: |
            sum by (http_route) (
              increase(http_server_request_duration_seconds_count{job="gatekeeper",http_route!~"/auth|/auth/token",http_status_code=~"5.."}[10m])
              or
              increase(http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code=~"5..",http_status_code!="503"}[10m])
            ) > 3
          labels:
            severity: warning
          annotations:
            summary: "gatekeeper route {{ $labels.http_route }} is answering 5xx"
            description: >-
              More than 3 5xx from gatekeeper route {{ $labels.http_route }} in the last 10 minutes,
              summed over its pods (for /auth/token a 503 is excluded: that is GatekeeperTokenUnavailable).
              Drills and planned platform-wide rolls run under a silence for this alert. Check the
              gatekeeper pod logs and the request's status code split on the strive-edge dashboard.
        # Sustained TokenReview-unavailable. `sum(increase(...[2m])) > bool 0` is 1 for every minute
        # whose trailing two minutes saw a 503 and 0 otherwise; the subquery takes 15 such minutes
        # and the alert needs all 15 to be 1. The count is the guard that matters: sum_over_time over
        # a series that went absent (a pod replaced mid-burst) would otherwise be a smaller sum of
        # the steps that still had data, and `>= 15` makes a missing step a failure to fire, not a
        # pass. Two-minute windows, not one: a counter that rises between two samples that straddle a
        # window edge is in neither of two adjacent one-minute windows. So "each of the last 15
        # minutes" means "no gap longer than about 100 s between 503s", low volume included. The
        # 2026-10-06 drill (503s 17:22-17:31Z, 10 minutes) is deliberately below this; real outages
        # of TokenReview are not.
        - alert: GatekeeperTokenUnavailable
          expr: |
            sum_over_time(
              (
                sum(increase(http_server_request_duration_seconds_count{job="gatekeeper",http_route="/auth/token",http_status_code="503"}[2m])) > bool 0
              )[15m:1m]
            ) >= 15
          labels:
            severity: critical
          annotations:
            summary: "gatekeeper /auth/token has answered 503 continuously for 15 minutes"
            description: >-
              gatekeeper route /auth/token (service-to-service token minting) answered 503, the
              TokenReview-unavailable status, in every two-minute window of the last 15 minutes. Check
              the Kubernetes API reachability from gatekeeper and GatekeeperTokenReviewLimited. Drills
              and planned platform-wide rolls run under a silence for this alert.
        # The TokenReview client's own signals (D16): a request rate-limited by the client, or an
        # upstream "unavailable" outcome. Either means service-to-service authentication is
        # degraded even if no 503 has reached a caller yet. Both counters are pre-initialised to 0 on
        # every pod (scraped, unlike the OTLP series), so increase() sees the first event. `or` of two
        # label-less sums: a missing branch simply contributes nothing.
        - alert: GatekeeperTokenReviewLimited
          expr: |
            sum(increase(gatekeeper_tokenreview_limited_total{job="gatekeeper"}[10m])) > 0
            or
            sum(increase(gatekeeper_tokenreview_total{job="gatekeeper",outcome="unavailable"}[10m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "gatekeeper TokenReview calls are being limited or are unavailable"
            description: >-
              In the last 10 minutes gatekeeper rate-limited a TokenReview call
              (gatekeeper_tokenreview_limited_total) or got an `unavailable` outcome
              (gatekeeper_tokenreview_total). Service-to-service tokens may be refused or delayed.
              Drills and planned platform-wide rolls run under a silence for this alert.
