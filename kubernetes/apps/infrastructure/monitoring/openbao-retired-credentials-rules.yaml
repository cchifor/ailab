# OpenBao credentials of RETIRED systems that must never come back unnoticed.
#
# The AgentForge provisioner was retired on 2026-10-31 (plans/2026-10-31-retire-agentforge-plan.md,
# PR-2b). Its scoped long-lived token revoked itself and its Secret openbao-provisioner-token was
# deleted. The retained OpenBao bootstrap (`agentforge openbao-provision`, which OpenBao still runs)
# never re-mints that token on its daily run: on a provisioned vault it only re-runs the add-only
# operator reconcile. It mints it ONLY on the root path of a FIRST bootstrap, i.e. after a vault wipe
# and re-bootstrap (docs/runbooks/openbao-recovery.md). Until the follow-up that moves OpenBao off the
# AgentForge image removes that mint, this alert is the guarantee that such a token does not sit
# unclaimed: nothing reads it any more, and its policy can write tenant policies and auth roles.
#
# Source: kube-state-metrics kube_secret_info (metadata only, never the value).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbao-retired-credentials
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: openbao-retired-credentials
      rules:
        - alert: OpenBaoRetiredProvisionerTokenPresent
          expr: count(kube_secret_info{namespace="openbao", secret="openbao-provisioner-token"}) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "openbao/openbao-provisioner-token exists again, but the AgentForge provisioner is retired"
            description: >-
              The Secret openbao/openbao-provisioner-token exists, yet the AgentForge provisioner that
              used it was retired on 2026-10-31. A full OpenBao re-bootstrap (root path) mints this
              long-lived token; nothing reads it now, and its policy can write tenant policies and
              k8s-auth roles. Revoke it and delete the Secret: exec a one-off pod or shell that reads
              the token from the Secret and POSTs v1/auth/token/revoke-self with it (any token may
              revoke itself; expect 204, then 403 from lookup-self), then
              `kubectl --context admin@ai -n openbao delete secret openbao-provisioner-token`.
              Never print the token. See docs/runbooks/openbao-recovery.md.
