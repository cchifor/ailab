# openbao-platform-pg-sync — maintains one read-only Postgres login per LIVE dev-worker slot on the
# platform's CNPG cluster (strive-pg) and publishes it to the slot's OpenBao KV path as SYNC-OWNED
# fields: platform_pg_user / platform_pg_password / platform_pg_valid_until (ADR 0028). The worker's
# bao agent renders ~/.platform/pgpass from them; `platform psql` uses it through a port-forward.
#
# WHY HERE (ns strive-ailab) AND NOT NEXT TO THE OTHER SYNC: it needs the CNPG superuser to create
# roles and grant, and a Secret can only be mounted by a pod in its own namespace. This is the SAME
# Secret, mounted the SAME way, as the platform repo's own strive-pg-init-databases Job — an
# in-cluster, Flux-owned, reviewed workload. What ADR 0028 bounds is what a WORKER can read; this Job
# is on the cluster side of that line (plan §Decision 2).
#
# WHY WHEN-NEEDED ROTATION: a slot's password changes only when its KV fields are missing, the
# published validity has < PG_ROTATE_BEFORE_SECONDS left, the published password no longer logs in,
# or FORCE_ROTATE=1. Everything else (attributes, GUC defaults, grants) is re-asserted on every run.
# A re-run is therefore a no-op — which is what makes the bootstrap Job's reap-and-re-apply retry
# loop (below) safe, and `kubectl create job --from=cronjob/openbao-platform-pg-sync` always safe.
# Validity 14 d, rotate with 7 d left: a password is replaced roughly weekly, a leaked one dies within
# two weeks, and a week of missed runs expires nothing. A failed run is `KubeJobFailed` (the stack's
# existing kube-state-metrics rule, 15 m) — no new alert.
#
# WHY NOT pg_read_all_data: it is cluster-wide and cannot leave a database out without revoking
# PUBLIC's CONNECT there, which the platform's per-tenant roles rely on. The grants below are explicit
# per database, and `keycloak` (the identity store) is never in PLATFORM_DATABASES — the script
# refuses to start if it is. RLS is honoured (NOBYPASSRLS): airlock/workflow rows answer only with
# app.tenant_id set for the session — `platform psql --tenant <id>`.
#
# THE SLOT LIST (LIVE_SLOTS / RETIRED_SLOTS) is one of the enumerations scripts/check-slot-enumerations.py
# keeps in step with platform-access/rbac.yaml, k8stoken-sync.yaml and devworker-provision-job.yaml.
# Retiring a slot = move it from LIVE_SLOTS to RETIRED_SLOTS: the next run DROP OWNED BYs it in every
# database and DROPs the role (idempotent, resumable). Reviewer VMs are excluded on purpose (rbac.yaml).
#
# NEVER PRINTS A PASSWORD. Role names, database names, field names, timestamps, rotated/kept only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-platform-pg-sync
  namespace: strive-ailab
  labels:
    app.kubernetes.io/name: openbao-platform-pg-sync
    app.kubernetes.io/component: credential-sync
    app.kubernetes.io/part-of: agentforge
# No Kubernetes RBAC at all: the SA token is used ONLY to log in to OpenBao (k8s auth role
# platform-pg-sync, created by devworker-provision-job.yaml with the k8stoken-sync KV-write policy —
# a per-slot `read/create/update/patch` on af/data/dev-workers/dev-worker-<N>, shared on purpose so
# PR-C2's narrowing covers both writers). Postgres is reached with the mounted superuser Secret.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-platform-pg-sync-script
  namespace: strive-ailab
  labels:
    app.kubernetes.io/name: openbao-platform-pg-sync
    app.kubernetes.io/component: credential-sync
    app.kubernetes.io/part-of: agentforge
data:
  sync.py: |
    #!/usr/bin/env python3
    """Maintain a read-only Postgres login per live dev-worker slot and publish it to OpenBao.

    Runs in the CNPG operand image (python 3.9 + psycopg2 — no `match`, no `X | Y` annotations, no
    f-string `=`). NEVER puts a password anywhere it can be read: not in a log line, and not in SQL
    either — the server is sent a client-computed SCRAM-SHA-256 verifier, because every worker holds
    `pg_monitor` and `pg_stat_activity` shows other sessions' query text verbatim (measured on this
    cluster 2026-09-21), so a cleartext `ALTER ROLE ... PASSWORD` would hand slot B's new password to
    slot A. The same reason the session also silences statement logging: `pods/log` is readable by the
    very same workers.

    Fail-closed: OpenBao login first (a run that cannot publish must not rotate), a cluster-wide
    advisory lock for the whole run (`concurrencyPolicy: Forbid` serialises the CronJob against itself
    but NOT against the bootstrap Job or a hand-made one, and two runs could otherwise publish a
    password the other has already replaced), every role change in one transaction on the primary, and
    every credential — rotated or kept — proven read-only before anything is published.

    Rotation is WHEN-NEEDED: a slot's password changes only when its KV fields are missing, the
    published validity has less than PG_ROTATE_BEFORE_SECONDS left, Postgres disagrees with the
    published expiry, the published password is REJECTED by the server (28xxx — never because the
    connection failed for capacity or transport reasons), or FORCE_ROTATE=1. Everything else is
    re-asserted every run. That is what makes a re-run a no-op instead of a rotation.

    Tested by scripts/tests/test-platform-pg-sync.sh under this same image.
    """
    import base64
    import calendar
    import hashlib
    import hmac
    import json
    import os
    import secrets
    import ssl
    import sys
    import time
    import urllib.error
    import urllib.request

    import psycopg2
    from psycopg2 import sql

    SA_DIR = os.environ.get("SA_DIR", "/var/run/secrets/kubernetes.io/serviceaccount")
    BAO = os.environ["BAO_ADDR"]
    BAO_ROLE = os.environ.get("BAO_ROLE", "platform-pg-sync")
    MOUNT = os.environ.get("BAO_KV_MOUNT", "af")
    LIVE_SLOTS = [int(s) for s in os.environ["LIVE_SLOTS"].split()]
    RETIRED_SLOTS = [int(s) for s in os.environ.get("RETIRED_SLOTS", "").split()]
    DATABASES = os.environ["PLATFORM_DATABASES"].split()
    VALID_SECONDS = int(os.environ.get("PG_PASSWORD_VALID_SECONDS", "1209600"))   # 14 d
    ROTATE_BEFORE = int(os.environ.get("PG_ROTATE_BEFORE_SECONDS", "604800"))     # rotate with < 7 d left
    CONNECTION_LIMIT = int(os.environ.get("PG_CONNECTION_LIMIT", "10"))
    FORCE_ROTATE = os.environ.get("FORCE_ROTATE", "") == "1"
    # Roles whose FUTURE tables are readable without waiting for the next run: the migrator (`app` owns
    # every platform database and runs every alembic migration) and the CNPG superuser (the platform's
    # init Job and the workflow admin DSN connect as it). Database-wide, never IN SCHEMA, and never for
    # a tenant role: a per-schema default ACL is a dependency of that schema, and a default ACL FOR a
    # role blocks DROP ROLE — either would break the integration provisioner's per-tenant teardown.
    DEFAULT_PRIV_GRANTORS = os.environ.get("PG_DEFAULT_PRIV_GRANTORS", "app postgres").split()
    SYSTEM_SCHEMAS = ("pg_catalog", "information_schema", "pg_toast")
    FIELDS = ("platform_pg_user", "platform_pg_password", "platform_pg_valid_until")
    # The ONLY role membership these logins may hold. Anything else is drift and is revoked: a
    # membership in `app` (or pg_write_all_data) would make a "read-only" credential writable while
    # every attribute below still looked right.
    ALLOWED_MEMBERSHIPS = ("pg_monitor",)
    TS = "%Y-%m-%dT%H:%M:%SZ"
    LOCK_KEY = 0x706C6174666F726D  # "platform" — one advisory lock for every run of this sync
    # Postgres SQLSTATEs that mean "this credential is wrong", as opposed to "the server would not talk
    # to us": 28P01 invalid_password, 28000 invalid_authorization_specification.
    AUTH_FAILURE_SQLSTATES = ("28P01", "28000")


    def role_name(slot):
        return "dw%d_platform_ro" % slot


    def worker_name(slot):
        return "dev-worker-%d" % slot


    def log(msg):
        print(msg, flush=True)


    def new_password():
        return secrets.token_urlsafe(32)


    def scram_verifier(password, iterations=4096):
        """RFC 5802 SCRAM-SHA-256 verifier, the form `ALTER ROLE ... PASSWORD` stores verbatim.

        The password never reaches the server, so it cannot appear in pg_stat_activity (readable by
        every pg_monitor member, i.e. every other worker) or in a logged statement (readable through
        pods/log). SASLprep is the identity here: token_urlsafe emits only [A-Za-z0-9_-]."""
        salt = os.urandom(16)
        salted = hashlib.pbkdf2_hmac("sha256", password.encode("utf-8"), salt, iterations)
        client_key = hmac.new(salted, b"Client Key", hashlib.sha256).digest()
        stored_key = hashlib.sha256(client_key).digest()
        server_key = hmac.new(salted, b"Server Key", hashlib.sha256).digest()
        return "SCRAM-SHA-256$%d:%s$%s:%s" % (
            iterations, base64.b64encode(salt).decode(),
            base64.b64encode(stored_key).decode(), base64.b64encode(server_key).decode())


    def valid_until_from(now):
        return time.strftime(TS, time.gmtime(now + VALID_SECONDS))


    def parse_ts(value):
        return calendar.timegm(time.strptime(value, TS))


    # ---- Postgres ----------------------------------------------------------------------------------
    def pg_connect(dbname, user=None, password=None):
        return psycopg2.connect(
            host=os.environ["PGHOST"], port=os.environ.get("PGPORT", "5432"), dbname=dbname,
            user=user or os.environ["PGUSER"], password=password or os.environ["PGPASSWORD"],
            sslmode=os.environ.get("PGSSLMODE", "require"), connect_timeout=15,
            application_name="openbao-platform-pg-sync",
        )


    def quiet(cur):
        """Superuser-only: keep this session's statements out of the server log. Belt to the SCRAM
        verifier's braces — the workers can read the postgres pod's log through pods/log."""
        cur.execute("SET log_statement = 'none'")
        cur.execute("SET log_min_duration_statement = -1")


    def user_schemas(cur):
        cur.execute(
            "SELECT nspname FROM pg_namespace WHERE nspname NOT IN %s "
            "AND nspname NOT LIKE 'pg\\_temp%%' AND nspname NOT LIKE 'pg\\_toast\\_temp%%' ORDER BY 1",
            (SYSTEM_SCHEMAS,))
        return [r[0] for r in cur.fetchall()]


    def all_databases(cur):
        """Every connectable database, not just the allowlist. Retirement and allowlist-removal cleanup
        must reach a database that USED to be granted, or its leftover grants make DROP ROLE fail for
        ever and the old SELECT rights simply stay."""
        cur.execute("SELECT datname FROM pg_database WHERE datallowconn AND NOT datistemplate ORDER BY 1")
        return [r[0] for r in cur.fetchall()]


    def role_expiry(cur, role):
        """Postgres's own view of the expiry, as an epoch — None for no expiry or no role."""
        cur.execute("SELECT rolvaliduntil FROM pg_roles WHERE rolname = %s", (role,))
        row = cur.fetchone()
        if row is None or row[0] is None:
            return None
        return calendar.timegm(row[0].utctimetuple())


    def assert_role(cur, role, verifier=None, valid_until=None):
        """Create-if-absent, then restate every attribute so a hand edit converges back within a day.
        PASSWORD/VALID UNTIL only when this run rotates the slot; `verifier` is a SCRAM verifier, never
        a cleartext password."""
        ident = sql.Identifier(role)
        cur.execute("SELECT 1 FROM pg_roles WHERE rolname = %s", (role,))
        if cur.fetchone() is None:
            cur.execute(sql.SQL("CREATE ROLE {} NOLOGIN").format(ident))
        cur.execute(sql.SQL(
            "ALTER ROLE {} WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOBYPASSRLS "
            "NOREPLICATION CONNECTION LIMIT %s").format(ident), (CONNECTION_LIMIT,))
        if verifier is not None:
            cur.execute(sql.SQL("ALTER ROLE {} WITH PASSWORD %s VALID UNTIL %s").format(ident),
                        (verifier, valid_until))
        cur.execute(sql.SQL("GRANT pg_monitor TO {}").format(ident))
        # Drift repair: a membership granted out of band (app, pg_write_all_data, a tenant role) makes
        # this credential writable while every attribute above still reads correctly.
        cur.execute(
            "SELECT r.rolname FROM pg_auth_members m JOIN pg_roles r ON r.oid = m.roleid "
            "WHERE m.member = %s::regrole AND r.rolname <> ALL(%s)", (role, list(ALLOWED_MEMBERSHIPS)))
        for (extra,) in cur.fetchall():
            cur.execute(sql.SQL("REVOKE {} FROM {}").format(sql.Identifier(extra), ident))
            log("revoked unexpected membership %s from %s" % (extra, role))
        for guc, val in (("default_transaction_read_only", "on"),
                         ("statement_timeout", "300s"),
                         ("idle_in_transaction_session_timeout", "60s")):
            cur.execute(sql.SQL("ALTER ROLE {} SET {} = %s").format(ident, sql.Identifier(guc)), (val,))


    def grant_database(dbname, roles):
        """Read grants for `roles` in one database: CONNECT, USAGE on every user schema present now,
        SELECT on every table/view/sequence in them, and database-wide default privileges for the
        grantor roles."""
        conn = pg_connect(dbname)
        try:
            with conn:
                with conn.cursor() as cur:
                    quiet(cur)
                    schemas = user_schemas(cur)
                    for role in roles:
                        ident = sql.Identifier(role)
                        cur.execute(sql.SQL("GRANT CONNECT ON DATABASE {} TO {}").format(
                            sql.Identifier(dbname), ident))
                        for schema in schemas:
                            s = sql.Identifier(schema)
                            cur.execute(sql.SQL("GRANT USAGE ON SCHEMA {} TO {}").format(s, ident))
                            cur.execute(sql.SQL("GRANT SELECT ON ALL TABLES IN SCHEMA {} TO {}").format(s, ident))
                            cur.execute(sql.SQL("GRANT SELECT ON ALL SEQUENCES IN SCHEMA {} TO {}").format(s, ident))
                        for grantor in DEFAULT_PRIV_GRANTORS:
                            g = sql.Identifier(grantor)
                            cur.execute(sql.SQL(
                                "ALTER DEFAULT PRIVILEGES FOR ROLE {} GRANT SELECT ON TABLES TO {}").format(g, ident))
                            cur.execute(sql.SQL(
                                "ALTER DEFAULT PRIVILEGES FOR ROLE {} GRANT SELECT ON SEQUENCES TO {}").format(g, ident))
                        # SELECT is granted; everything else is REVOKED on every run, so "read-only" is an
                        # invariant this job restores rather than an assumption about who else has run a
                        # GRANT. A table-level REVOKE also removes column-level grants of that privilege.
                        for schema in schemas:
                            s_id = sql.Identifier(schema)
                            cur.execute(sql.SQL(
                                "REVOKE INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER "
                                "ON ALL TABLES IN SCHEMA {} FROM {}").format(s_id, ident))
                            # USAGE as well as UPDATE: USAGE alone permits nextval(), which WRITES the
                            # sequence's state — a "read-only" role could advance an application's id
                            # counter. SELECT survives, so reading last_value still works.
                            cur.execute(sql.SQL(
                                "REVOKE USAGE, UPDATE ON ALL SEQUENCES IN SCHEMA {} FROM {}").format(s_id, ident))
                            cur.execute(sql.SQL("REVOKE CREATE ON SCHEMA {} FROM {}").format(s_id, ident))
                        cur.execute(sql.SQL("REVOKE CREATE, TEMPORARY ON DATABASE {} FROM {}").format(
                            sql.Identifier(dbname), ident))
                    # Belt to that brace: prove from the catalog that nothing writable is left anywhere in
                    # this database, for any of the roles. A behavioural probe samples ONE table; this is
                    # exhaustive, and it is what catches a grant made out of band on some other table.
                    cur.execute(
                        "SELECT grantee, table_schema, table_name, privilege_type "
                        "FROM information_schema.role_table_grants "
                        "WHERE grantee = ANY(%s) AND privilege_type <> 'SELECT' LIMIT 5", (list(roles),))
                    leftover = cur.fetchall()
                    if leftover:
                        raise RuntimeError(
                            "%s: these roles still hold non-SELECT privileges after the revoke pass: %s"
                            % (dbname, "; ".join("%s on %s.%s: %s" % r for r in leftover)))
                    # information_schema.role_table_grants does NOT cover sequences, and a sequence USAGE
                    # grant is a write capability (nextval). Audit the relacl of every sequence directly.
                    cur.execute(
                        "SELECT r.rolname, n.nspname, c.relname, a.privilege_type "
                        "FROM pg_class c "
                        "JOIN pg_namespace n ON n.oid = c.relnamespace, "
                        "aclexplode(c.relacl) a "
                        "JOIN pg_roles r ON r.oid = a.grantee "
                        "WHERE c.relkind = 'S' AND r.rolname = ANY(%s) AND a.privilege_type <> 'SELECT' "
                        "LIMIT 5", (list(roles),))
                    seq_leftover = cur.fetchall()
                    if seq_leftover:
                        raise RuntimeError(
                            "%s: these roles still hold non-SELECT SEQUENCE privileges (nextval is a "
                            "write) after the revoke pass: %s"
                            % (dbname, "; ".join("%s on %s.%s: %s" % r for r in seq_leftover)))
                    log("granted %s: %d roles, schemas %s (non-SELECT privileges revoked)"
                        % (dbname, len(roles), ",".join(schemas)))
        finally:
            conn.close()


    def revoke_database(dbname, roles):
        """DROP OWNED BY strips every grant and default-privilege entry the role holds in this database
        (it owns nothing, so nothing else is dropped). Skips roles that no longer exist."""
        conn = pg_connect(dbname)
        try:
            with conn:
                with conn.cursor() as cur:
                    quiet(cur)
                    for role in roles:
                        cur.execute("SELECT 1 FROM pg_roles WHERE rolname = %s", (role,))
                        if cur.fetchone() is None:
                            continue
                        cur.execute(sql.SQL("DROP OWNED BY {}").format(sql.Identifier(role)))
                        log("revoked %s in %s" % (role, dbname))
        finally:
            conn.close()


    def login_state(role, password, dbname):
        """'ok' | 'rejected' | 'unavailable'. The distinction matters: a REJECTED credential must be
        rotated, but an UNAVAILABLE server (CONNECTION LIMIT exhausted by the worker's own sessions,
        a network blip, a failover) must NOT be — rotating there would replace a working password and
        then fail its own proof for the same reason, leaving KV stale and the worker locked out."""
        try:
            conn = pg_connect(dbname, user=role, password=password)
        except psycopg2.Error as exc:
            if getattr(exc, "pgcode", None) in AUTH_FAILURE_SQLSTATES:
                return "rejected"
            text = str(exc).lower()
            if "password authentication failed" in text or "role" in text and "does not exist" in text:
                return "rejected"
            return "unavailable"
        conn.close()
        return "ok"


    def prove_read_only(role, password, dbname):
        """The credential must WORK and be read-only BY PRIVILEGE. Every probe runs inside a
        transaction that is ALWAYS rolled back: if an unexpected privilege did exist, an autocommitted
        CREATE TABLE/INSERT would leave that change behind in a production database — the safety check
        must not be the thing that mutates it."""
        conn = pg_connect(dbname, user=role, password=password)
        try:
            conn.autocommit = False
            with conn.cursor() as cur:
                # Transaction 1: identity, the role-level read-only default, and a pg_monitor read.
                cur.execute("SELECT current_user, current_setting('transaction_read_only')")
                who, ro = cur.fetchone()
                if who != role or ro != "on":
                    raise RuntimeError("%s: logged in as %s with transaction_read_only=%s" % (role, who, ro))
                cur.execute("SELECT count(*) FROM pg_stat_activity")  # pg_monitor
                cur.execute("SELECT schemaname, tablename FROM pg_tables WHERE schemaname NOT IN %s "
                            "ORDER BY 1, 2 LIMIT 1", (SYSTEM_SCHEMAS,))
                row = cur.fetchone()
                conn.rollback()
                # Transaction 2: the write probes, with the read-only default turned OFF. The SET has to
                # be the FIRST statement of its transaction ("transaction read-write mode must be set
                # before any query"), which is why this is a second transaction rather than a flip in
                # the middle of the first.
                cur.execute("SET transaction_read_only = off")
                probes = [sql.SQL("CREATE TABLE openbao_platform_pg_sync_probe (x int)")]
                if row is not None:
                    probes.append(sql.SQL("INSERT INTO {}.{} DEFAULT VALUES").format(
                        sql.Identifier(row[0]), sql.Identifier(row[1])))
                for probe in probes:
                    cur.execute("SAVEPOINT probe")
                    try:
                        cur.execute(probe)
                    except psycopg2.Error as exc:
                        code = exc.pgcode
                        cur.execute("ROLLBACK TO SAVEPOINT probe")
                        # 42501 insufficient_privilege is the answer we want. 42P01/3F000 (the probe
                        # table's schema is unreadable) would mean the grant itself is wrong, and an
                        # RLS rejection (44000 check_violation on a WITH CHECK policy) is NOT proof of
                        # missing INSERT privilege — treat both as failures rather than silent passes.
                        if code != "42501":
                            raise RuntimeError("%s: write refused with SQLSTATE %s, expected 42501 "
                                               "(insufficient_privilege)" % (role, code))
                    else:
                        raise RuntimeError("%s: a write SUCCEEDED — the role is NOT read-only" % role)
        finally:
            conn.rollback()  # nothing this function did may survive
            conn.close()


    # ---- OpenBao (mirrors openbao-k8stoken-sync's sync.py) -------------------------------------------
    def call(url, ctx, method="GET", body=None, token=None, ctype="application/json"):
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(url, data=data, method=method)
        req.add_header("Accept", "application/json")
        if data:
            req.add_header("Content-Type", ctype)
        if token:
            req.add_header("Authorization", "Bearer " + token)
        try:
            with urllib.request.urlopen(req, context=ctx, timeout=30) as resp:
                raw = resp.read()
                return resp.status, (json.loads(raw) if raw else {})
        except urllib.error.HTTPError as exc:
            raw = exc.read()
            try:
                return exc.code, json.loads(raw) if raw else {}
            except ValueError:
                return exc.code, {"raw": "<unparseable>"}


    class Bao(object):
        def __init__(self):
            cafile = os.environ.get("BAO_CACERT")
            self.ctx = ssl.create_default_context(cafile=cafile) if cafile else None
            with open(SA_DIR + "/token", encoding="utf-8") as fh:
                sa_jwt = fh.read().strip()
            status, body = call(BAO + "/v1/auth/kubernetes/login", self.ctx, "POST",
                                {"role": BAO_ROLE, "jwt": sa_jwt})
            if status != 200:
                sys.exit("OpenBao k8s-auth login failed as role '%s': HTTP %s (role not created yet by "
                         "openbao-devworker-provision, or vault sealed)" % (BAO_ROLE, status))
            self.token = body["auth"]["client_token"]

        def _call(self, path, method="GET", body=None, ctype="application/json"):
            return call(BAO + "/v1/" + path, self.ctx, method, body, self.token, ctype)

        def current(self, worker):
            """(exists, fields) — the published platform_pg_* subset, {} when absent. Any status other
            than 200/404 aborts: an auth/network error must never read as 'absent'."""
            status, body = self._call("%s/data/dev-workers/%s" % (MOUNT, worker))
            if status == 200:
                data = (body.get("data") or {}).get("data") or {}
                return True, dict((k, data[k]) for k in FIELDS if k in data)
            if status == 404:
                return False, {}
            sys.exit("probe of %s returned HTTP %s; refusing to guess whether it exists" % (worker, status))

        def publish(self, worker, exists, fields):
            path = "%s/data/dev-workers/%s" % (MOUNT, worker)
            if exists:
                st, _ = self._call(path, "PATCH", {"data": fields}, "application/merge-patch+json")
                if st not in (200, 204):
                    sys.exit("patch of %s failed: HTTP %s — existing fields left untouched" % (worker, st))
                return
            # Create-only CAS: openbao-k8stoken-sync and openbao-devworker-provision write the same
            # documents and can observe absence at the same moment; a bare write would replace theirs.
            st, _ = self._call(path, "POST", {"data": fields, "options": {"cas": 0}})
            if st in (400, 409):
                st, _ = self._call(path, "PATCH", {"data": fields}, "application/merge-patch+json")
                if st not in (200, 204):
                    sys.exit("%s: lost the create race and the follow-up patch failed: HTTP %s" % (worker, st))
            elif st not in (200, 204):
                sys.exit("create of %s failed: HTTP %s" % (worker, st))


    def rotation_reason(fields, role, now, pg_expiry):
        """Why this slot must be rotated this run, or None to keep the published credential. Postgres's
        own rolvaliduntil is part of the decision: a role altered out of band to expire tomorrow (or
        never) still logs in today, and keeping it would break the published validity contract."""
        if FORCE_ROTATE:
            return "FORCE_ROTATE"
        if any(f not in fields for f in FIELDS):
            return "fields missing"
        if fields["platform_pg_user"] != role:
            return "published user is not %s" % role
        try:
            published = parse_ts(fields["platform_pg_valid_until"])
        except ValueError:
            return "unparseable valid_until"
        if published - now < ROTATE_BEFORE:
            return "%dh of validity left" % max(int((published - now) // 3600), 0)
        if pg_expiry is None:
            return "postgres has no expiry for this role"
        if abs(pg_expiry - published) > 300:  # 5 min of slack for clock/rounding
            return "postgres expiry disagrees with the published one"
        return None


    def main():
        if not LIVE_SLOTS:
            sys.exit("LIVE_SLOTS is empty; refusing to run")
        if set(LIVE_SLOTS) & set(RETIRED_SLOTS):
            sys.exit("a slot is both live and retired: %s" % sorted(set(LIVE_SLOTS) & set(RETIRED_SLOTS)))
        if "keycloak" in DATABASES:
            sys.exit("keycloak is the identity store and is never in PLATFORM_DATABASES")
        if not DATABASES:
            sys.exit("PLATFORM_DATABASES is empty; refusing to run")

        bao = Bao()  # first: a run that cannot publish must not rotate anything
        now = time.time()
        probe_db = DATABASES[0]
        admin_db = os.environ.get("PGDATABASE", "postgres")

        # ---- One run at a time, cluster-wide ----------------------------------------------------------
        # concurrencyPolicy: Forbid covers this CronJob against itself only. The bootstrap Job, a
        # `kubectl create job --from=cronjob/...` and the CronJob can all run at once, and two runs
        # racing between "prove" and "publish" would leave KV holding a password the other has already
        # replaced. The lock is session-level and held until this connection closes, i.e. for the whole
        # run including retirement and publication.
        lock_conn = pg_connect(admin_db)
        lock_conn.autocommit = True
        with lock_conn.cursor() as cur:
            quiet(cur)
            cur.execute("SELECT pg_try_advisory_lock(%s)", (LOCK_KEY,))
            if not cur.fetchone()[0]:
                sys.exit("another openbao-platform-pg-sync run holds the advisory lock; exiting without "
                         "touching Postgres or KV (the other run is doing this work)")
            cur.execute("SELECT pg_is_in_recovery()")
            if cur.fetchone()[0]:
                sys.exit("connected to a replica; PGHOST must be the -rw service")

        try:
            # ---- Decide per slot: rotate or keep -------------------------------------------------------
            plan = {}
            conn = pg_connect(admin_db)
            try:
                with conn:
                    with conn.cursor() as cur:
                        quiet(cur)
                        for slot in LIVE_SLOTS:
                            exists, fields = bao.current(worker_name(slot))
                            reason = rotation_reason(fields, role_name(slot), now,
                                                     role_expiry(cur, role_name(slot)))
                            plan[slot] = {"exists": exists, "fields": fields,
                                          "rotate": reason is not None, "reason": reason}
            finally:
                conn.close()

            # Every slot with a published password is probed BEFORE anything is committed — kept ones to
            # learn whether the credential still works, rotating ones to learn whether the server is even
            # able to talk to this role right now.
            #
            # `unavailable` is fatal for BOTH, and the rotating case is the one that bites: the new
            # password is committed by the role transaction below, and the proof happens after it. If the
            # server is refusing connections for capacity (the slot's own CONNECTION LIMIT exhausted by
            # the worker's sessions) the proof fails AFTER Postgres has the new password, and KV is left
            # holding the old one — the worker is locked out until a later run re-rotates it. Refusing to
            # start is strictly better, and it costs nothing: the next run rotates when there is room.
            for slot in sorted(plan):
                entry = plan[slot]
                published = entry["fields"].get("platform_pg_password")
                if published is None:
                    continue  # nothing published yet: no working credential to strand
                state = login_state(role_name(slot), published, probe_db)
                if state == "unavailable":
                    sys.exit("%s: the server would not accept a connection for %s (capacity or transport, "
                             "not credentials); exiting WITHOUT touching Postgres or KV so the working "
                             "password stands" % (worker_name(slot), role_name(slot)))
                if state == "rejected" and not entry["rotate"]:
                    entry.update(rotate=True, reason="published password is rejected by the server")

            # ---- Role state, one transaction on the primary --------------------------------------------
            conn = pg_connect(admin_db)
            try:
                with conn:
                    with conn.cursor() as cur:
                        quiet(cur)
                        for slot in sorted(plan):
                            entry = plan[slot]
                            if entry["rotate"]:
                                entry["password"] = new_password()
                                entry["valid_until"] = valid_until_from(now)
                                assert_role(cur, role_name(slot), scram_verifier(entry["password"]),
                                            entry["valid_until"])
                            else:
                                assert_role(cur, role_name(slot))
            finally:
                conn.close()

            # ---- Per-database grants; revocation for retired slots and de-allowlisted databases --------
            live_roles = [role_name(s) for s in sorted(plan)]
            retired_roles = [role_name(s) for s in RETIRED_SLOTS]
            conn = pg_connect(admin_db)
            try:
                with conn.cursor() as cur:
                    every_db = all_databases(cur)
            finally:
                conn.close()
            # CLEANUP FIRST, THEN GRANT — the order is load-bearing. `DROP OWNED BY` revokes the role's
            # privileges on SHARED objects too (pg_database is shared), so a cleanup pass run AFTER the
            # grants strips the database-level CONNECT it just made in EVERY database, not only in the
            # one it is connected to. Cleaning up first and granting second leaves exactly the intended
            # state, and the grant pass is what restores CONNECT for the allowlisted databases.
            #
            # Databases NOT in the allowlist (removed from it, or never in it) are cleaned for live roles
            # as well as retired ones: without that, a database dropped from the allowlist would keep its
            # SELECT rights for ever, and its leftover dependencies would make a later DROP ROLE fail on
            # every run.
            for dbname in every_db:
                roles_to_clean = retired_roles if dbname in DATABASES else live_roles + retired_roles
                if roles_to_clean:
                    revoke_database(dbname, roles_to_clean)
            for dbname in DATABASES:
                if dbname not in every_db:
                    sys.exit("PLATFORM_DATABASES names %s, which does not exist on this cluster" % dbname)
                grant_database(dbname, live_roles)
            if retired_roles:
                conn = pg_connect(admin_db)
                try:
                    with conn:
                        with conn.cursor() as cur:
                            quiet(cur)
                            for role in retired_roles:
                                cur.execute(sql.SQL("DROP ROLE IF EXISTS {}").format(sql.Identifier(role)))
                                log("retired %s: grants revoked in %d databases, role dropped if present"
                                    % (role, len(every_db)))
                finally:
                    conn.close()

            # ---- Prove EVERY live credential read-only before publishing anything ----------------------
            # Kept ones too: reasserting attributes and adding grants can never remove a write privilege
            # granted out of band, so "kept" must mean "re-proven", not "assumed".
            #
            # A failure here, AFTER a rotation has committed, leaves Postgres with a password KV does not
            # have. That is deliberately not papered over by publishing an unproven credential: the next
            # run reads the published password, the server rejects it, and the slot is rotated and
            # published again — so the state self-heals within a run, and the capacity pre-check above is
            # what stops the common cause of getting here at all.
            # PROVE AND PUBLISH ONE SLOT AT A TIME. A rotated slot's password is already committed in
            # Postgres by now, so the interval between that commit and its publication is the window in
            # which the worker would be locked out. Proving every slot before publishing any would make
            # slot 1's window as long as slot N's proof — one unrelated failure stranding every rotated
            # slot. Per-slot keeps each window to its own proof, which is as short as this can be without
            # two passwords per role (Postgres has no such thing).
            rotated = kept = 0
            for slot in sorted(plan):
                worker, role, entry = worker_name(slot), role_name(slot), plan[slot]
                password = entry["password"] if entry["rotate"] else entry["fields"]["platform_pg_password"]
                prove_read_only(role, password, probe_db)
                if not entry["rotate"]:
                    kept += 1
                    log("kept %s: %s valid until %s (re-proven read-only)"
                        % (worker, role, entry["fields"]["platform_pg_valid_until"]))
                    continue
                bao.publish(worker, entry["exists"], {
                    "platform_pg_user": role,
                    "platform_pg_password": entry["password"],
                    "platform_pg_valid_until": entry["valid_until"],
                })
                rotated += 1
                log("rotated %s: %s valid until %s (%s); published %s"
                    % (worker, role, entry["valid_until"], entry["reason"], ", ".join(FIELDS)))
            log("published %d/%d slots (rotated %d, kept %d)" % (rotated + kept, len(LIVE_SLOTS), rotated, kept))
        finally:
            lock_conn.close()  # releases the advisory lock


    if __name__ == "__main__":
        main()
---
# STEADY STATE: daily at 03:47 UTC, half an hour after openbao-k8stoken-sync (03:17), so the two
# writers to af/dev-workers/<slot> never run at once (they would be safe anyway — KV patch — but a
# quiet log is a readable log). Forbid serialises this CronJob against ITSELF only; the bootstrap Job
# below is a separate object, which is why the script never does check-then-write on KV.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-platform-pg-sync
  namespace: strive-ailab
  labels:
    app.kubernetes.io/name: openbao-platform-pg-sync
    app.kubernetes.io/component: credential-sync
    app.kubernetes.io/part-of: agentforge
spec:
  schedule: "47 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 4
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-platform-pg-sync
            app.kubernetes.io/part-of: agentforge
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          serviceAccountName: openbao-platform-pg-sync
          automountServiceAccountToken: true # the OpenBao k8s-auth login; nothing else uses it
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: sync
              # The CNPG operand image the platform's Cluster runs (python3 + psycopg2 bundled with
              # barman-cloud, verified 2026-09-21) — psycopg2's protocol stays in step with the server.
              image: ghcr.io/cloudnative-pg/postgresql:16.9
              imagePullPolicy: IfNotPresent
              command: ["python3", "-u", "/scripts/sync.py"]
              env:
                - { name: HOME, value: /tmp }
                - { name: PGHOST, value: strive-pg-rw.strive-ailab.svc.cluster.local } # the PRIMARY; the script refuses a replica
                - { name: PGPORT, value: "5432" }
                - { name: PGDATABASE, value: postgres }
                - { name: PGSSLMODE, value: require }
                - name: PGUSER
                  valueFrom: { secretKeyRef: { name: strive-pg-superuser, key: username } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: strive-pg-superuser, key: password } }
                # Headless per-pod name, as the sibling syncs use: resolves even when the vault pod is
                # up but SEALED, so this fails with a real error instead of a DNS miss.
                - { name: BAO_ADDR, value: "https://openbao-0.openbao-internal.openbao.svc.cluster.local:8200" }
                - { name: BAO_CACERT, value: /tls/ca.crt }
                - { name: BAO_ROLE, value: platform-pg-sync }
                - { name: BAO_KV_MOUNT, value: af }
                # SLOT LIST — see the header and scripts/check-slot-enumerations.py.
                - { name: LIVE_SLOTS, value: "1 2 3 4" }
                - { name: RETIRED_SLOTS, value: "5 6" } # slot 6 retired 2026-09-21 (PR-C1; its role never existed), slot 5 on 2026-09-23 (PR-C2: VM 4205 re-slotted as dev-worker-4)
                # Every platform database EXCEPT keycloak (the identity store — the script refuses it).
                - { name: PLATFORM_DATABASES, value: "airlock profile knowledge mcp workflow hatchet integration notification digest platform_managed tms sentinel" }
                - { name: PG_PASSWORD_VALID_SECONDS, value: "1209600" } # 14 d
                - { name: PG_ROTATE_BEFORE_SECONDS, value: "604800" } # rotate with < 7 d left
                - { name: PG_CONNECTION_LIMIT, value: "10" }
              volumeMounts:
                - { name: tls, mountPath: /tls, readOnly: true }
                - { name: script, mountPath: /scripts, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 10m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: true
                seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: tls
              # The OpenBao server CA (ailab-root-ca, public). The sibling syncs mount ns openbao's
              # openbao-tls Secret; a pod here cannot, so kustomization.yaml generates this ConfigMap
              # from the same PEM the workers pin (CI cmp-checks the two copies).
              configMap:
                name: openbao-platform-pg-sync-ca
            - name: script
              configMap:
                name: openbao-platform-pg-sync-script
                defaultMode: 0555
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
---
# BOOTSTRAP / RECOVERY RUN — the same shape as openbao-k8stoken-sync-bootstrap. Applying a CronJob
# does not run it; this Job is the first run on apply. The kustomize force annotation is the
# immutable-Job wedge guard (a script or image edit deletes+recreates THIS Job instead of failing the
# whole Kustomization). ttlSecondsAfterFinished reaps it (Failed as well as Complete) and Flux
# re-applies it on the next reconcile: that loop is the retry when the OpenBao role does not exist
# yet (devworker-provision runs daily), and because a run is a no-op unless rotation is due, the loop
# never rotates a live credential. Workers read KV, never this Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-platform-pg-sync-bootstrap
  namespace: strive-ailab
  annotations:
    kustomize.toolkit.fluxcd.io/force: "enabled"
  labels:
    app.kubernetes.io/name: openbao-platform-pg-sync
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: agentforge
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-platform-pg-sync
        app.kubernetes.io/part-of: agentforge
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      serviceAccountName: openbao-platform-pg-sync
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sync
          image: ghcr.io/cloudnative-pg/postgresql:16.9
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/scripts/sync.py"]
          env:
            - { name: HOME, value: /tmp }
            - { name: PGHOST, value: strive-pg-rw.strive-ailab.svc.cluster.local }
            - { name: PGPORT, value: "5432" }
            - { name: PGDATABASE, value: postgres }
            - { name: PGSSLMODE, value: require }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: strive-pg-superuser, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: strive-pg-superuser, key: password } }
            - { name: BAO_ADDR, value: "https://openbao-0.openbao-internal.openbao.svc.cluster.local:8200" }
            - { name: BAO_CACERT, value: /tls/ca.crt }
            - { name: BAO_ROLE, value: platform-pg-sync }
            - { name: BAO_KV_MOUNT, value: af }
            - { name: LIVE_SLOTS, value: "1 2 3 4" }
            - { name: RETIRED_SLOTS, value: "5 6" }
            - { name: PLATFORM_DATABASES, value: "airlock profile knowledge mcp workflow hatchet integration notification digest platform_managed tms sentinel" }
            - { name: PG_PASSWORD_VALID_SECONDS, value: "1209600" }
            - { name: PG_ROTATE_BEFORE_SECONDS, value: "604800" }
            - { name: PG_CONNECTION_LIMIT, value: "10" }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: script, mountPath: /scripts, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tls
          configMap:
            name: openbao-platform-pg-sync-ca
        - name: script
          configMap:
            name: openbao-platform-pg-sync-script
            defaultMode: 0555
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
