# Seed values for the estate operator-credential escrow (af/estate/*) — mounted into
# openbao-estate-provision (estate-provision-job.yaml). SAME CONTRACT as the other two seed files:
# the Job patches each path with `<name>.json` on every run, so keys present here OVERWRITE live KV
# (seed wins) and keys absent survive. Rotate = the real system AND this file in the same change —
# and note the OTHER homes each credential has (docs/runbooks/openbao-estate-credentials.md, the
# multi-home table): the vault is the durable escrow, but consumers still read .env / tfvars /
# ansible SOPS until they are migrated.
