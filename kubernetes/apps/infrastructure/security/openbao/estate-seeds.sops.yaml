# Seed values for the estate operator-credential escrow (af/estate/*) â€” mounted into
# openbao-estate-provision (estate-provision-job.yaml). The Job patches each path with
# `<name>.json` on every run, so keys present here OVERWRITE live KV (seed wins) and keys absent
# survive. Same contract as devworker-seeds.sops.yaml â€” but NOT as operator-seeds.sops.yaml, which
# since agentforge #276 is CREATE-IF-ABSENT (the live vault wins; a disagreeing seed is reported as
# drift rather than applied). Both of these files are shell `bao kv patch` loops and still
# overwrite. The old "same contract as the other two" claim is what let a revoked credential be
# silently restored over a corrected one; see docs/runbooks/openbao-recovery.md, "The
# seed-ownership contract". Rotate = the real system AND this file in the same change â€”
# and note the OTHER homes each credential has (docs/runbooks/openbao-estate-credentials.md, the
# multi-home table): the vault is the durable escrow, but consumers still read .env / tfvars /
# ansible SOPS until they are migrated.
#
# ADDED 2026-09-10 (ADR 0021) — restic.json, platform.json, oauth.json. Each was verified to exist
# ONLY on the operator workstation before being escrowed here: every *.sops.yaml in the repo was
# decrypted and value-hashed, and these matched nothing. Three candidates were REJECTED by that same
# check and deliberately are NOT here:
#   - OPENAI_API_KEY / ANTHROPIC_API_KEY — byte-identical to apps/ai/litellm-cloud-keys.sops.yaml.
#   - the rclone crypt password + salt — the same secret as backup-offsite/rclone-config.sops.yaml
#     holds in `rclone obscure` form (obscure is reversible, so that file already IS a home).
#   - the talos-backup age key — Tier C (it decrypts etcd snapshots, which contain this vault's own
#     breakglass token and these very seeds), so it stays OFFLINE and out of the vault entirely.
#     Note the workstation copy ~/work/keys/talos-backup-age.key is ORPHANED: its public key is not
#     the recipient talos-backup/cronjob.yaml encrypts to. The live key is kubernetes/infra/_out/.
