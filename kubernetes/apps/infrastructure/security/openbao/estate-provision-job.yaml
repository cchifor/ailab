# Estate infrastructure credentials in OpenBao (docs/runbooks/openbao-estate-credentials.md) — the
# vault half of "every operator credential has a durable, single home". Seeds the af/estate/* KV
# subtree from openbao-estate-seeds: one `<name>.json` stringData key per path, af/estate/<name>.
#
# SCOPE: af/estate/* holds the OPERATOR-plane infrastructure credentials that otherwise live only in
# gitignored plaintext on the operator workstation (.env, terraform.tfvars) or in ansible SOPS —
# Proxmox, QNAP, Cloudflare, registry, Gitea runner registration, the GitHub App key. It is the
# durable escrow + rotation source of truth for those systems. Kubernetes-native secrets (Flux SOPS
# Secrets under kubernetes/apps/**) deliberately do NOT get mirrored here — Flux+SOPS is their
# system of record and a second home would add rotation split-brains, not remove them.
#
# strive-realm is a deliberate, documented EXCEPTION to that last sentence, and only in part.
# Its e2e/load persona passwords were hand-created Secrets in ns strive-ailab with no git home
# at all (the platform repo's deploy/components/e2e/kustomization.yaml offers SOPS "or seed it
# directly", and directly is what happened), so they are squarely in scope. Its
# keycloak_admin_password is NOT: that one also lives in the platform repo's
# deploy/secrets/ailab/keycloak-secrets.enc.yaml, and escrowing it was an explicit operator
# decision (break-glass reach into the realm without the platform repo's age key) that buys a
# SECOND home. Rotating it must touch the platform SOPS file AND this seed in the same change,
# or seed-wins reverts it within a day. Recorded in the runbook's multi-home table so the cost
# is visible at rotation time.
#
# ACCESS: nothing is granted read on af/estate/* — not the dev-worker AppRoles, not any ESO
# SecretStore. The only readers are root-level tokens (breakglass) via the operator ceremonies in
# the runbook. Widening access is a deliberate future decision, not a default.
#
# AUTH + shape: identical to devworker-provision-job.yaml — breakglass root (Secret
# openbao-breakglass-token, data key root_token, optional:false so absence turns the Job red),
# `bao kv patch` SEED-WINS contract, daily re-run via ttlSecondsAfterFinished + Flux re-apply,
# per-object force annotation (2026-07-28 immutable-Job wedge guard). Seed-wins is the contract of
# THIS Job and the dev-worker one, NOT of the AgentForge operator seed in provision-job.yaml, which
# is create-if-absent (live vault wins, divergence reported as drift) — canonical statement:
# docs/runbooks/openbao-recovery.md § "The seed-ownership contract".
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-estate-provision-script
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-estate-provision
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: agentforge
data:
  provision.sh: |
    #!/bin/sh
    # Idempotent: kv patch/put are upserts, so the daily re-run just re-converges. Fail-closed:
    # `set -eu`, no `|| true`. NEVER echo credential material — BAO_TOKEN arrives via env from the
    # breakglass Secret and seed JSON is handed to bao by FILE PATH, never as an argv word; the
    # existence probe's output goes to /dev/null.
    set -eu

    SEED_DIR=/etc/openbao-estate-seeds

    bao token lookup >/dev/null || {
      echo "openbao unreachable/sealed or the breakglass token was rejected; aborting" >&2
      exit 1
    }

    # Seed-wins contract (same as devworker-seeds; NOT the same as operator-seeds, which is
    # create-if-absent — the live vault wins there. docs/runbooks/openbao-recovery.md § "The
    # seed-ownership contract" has all three side by side). Keys absent from a seed survive
    # untouched, keys present OVERWRITE live KV — rotating a value only in the vault is silently
    # reverted within a day. Rotate = vault AND the seeds file in the same change.
    for seed in "$SEED_DIR"/*.json; do
      [ -f "$seed" ] || continue
      name="$(basename "$seed" .json)"
      if bao kv get -mount=af "estate/${name}" >/dev/null 2>&1; then
        bao kv patch -mount=af "estate/${name}" "@${seed}"
      else
        bao kv put -mount=af "estate/${name}" "@${seed}"
      fi
    done

    # Fail-closed completeness check — the runbook's path/field matrix, hard-coded. Without it a
    # dropped or typoed seed file (or a seed missing one field) still prints the success line while
    # leaving af/estate/* PARTIALLY restored after a wipe, which is exactly the silent gap the
    # "after a wipe, nothing to do" claim depends on not having. Adding a path/field means adding
    # it HERE as well as to the seeds file (and the runbook table). Stdout goes to /dev/null — the
    # probe must never print a value.
    MATRIX="proxmox:root_password proxmox:api_token \
      qnap:admin_user qnap:admin_password \
      cloudflare:api_token \
      registry:ci_password registry:oidc_client_secret \
      gitea:runner_registration_token \
      github:app_private_key \
      restic:nextcloud_password \
      platform:hatchet_encryption_master_keyset platform:hatchet_jwt_public_keyset \
      platform:hatchet_jwt_private_keyset platform:hatchet_client_token platform:sendgrid_key \
      oauth:gcloud_client_id oauth:gcloud_client_secret \
      oauth:github_client_id oauth:github_client_secret \
      strive-realm:keycloak_admin_user strive-realm:keycloak_admin_password \
      strive-realm:e2e_worker_usernames strive-realm:e2e_worker_password \
      strive-realm:load_persona_username strive-realm:load_persona_password"

    # PASS 1 — the SEED must contain every matrix field, non-empty. This is NOT redundant with pass
    # 2: pass 2 probes LIVE KV after seeding, so a stale live value happily masks a seed that never
    # carried the field, and the "after a wipe there is nothing to do" claim then rests on a check
    # that cannot see the gap. It also catches an empty-string value, which `kv get -field` reports
    # as success.
    #
    # grep, not jq or python: the openbao image ships neither (verified against
    # quay.io/openbao/openbao:2.6.2 — busybox sh, sed and grep only). The seeds are single-line
    # JSON objects (json.dumps escapes newlines, so even the GitHub App private key is one line),
    # so `"<field>": "<non-quote>` is a sound present-and-non-empty test. The leading quote anchors
    # the name, which is what keeps "client_id" from matching inside "gcloud_client_id".
    for pair in $MATRIX; do
      path="${pair%%:*}"
      field="${pair##*:}"
      seed="$SEED_DIR/${path}.json"
      [ -f "$seed" ] || { echo "seed ${path}.json is missing but the matrix requires ${field}" >&2; exit 1; }
      grep -q "\"${field}\": *\"[^\"]" "$seed" || {
        echo "seed ${path}.json has no non-empty field '${field}'" >&2
        exit 1
      }
    done

    # PASS 2 — and it actually landed in the vault. Stdout to /dev/null: the probe must never print
    # a value.
    for pair in $MATRIX; do
      path="${pair%%:*}"
      field="${pair##*:}"
      bao kv get -mount=af -field="$field" "estate/${path}" >/dev/null || {
        echo "af/estate/${path} is missing field '${field}' after seeding; aborting" >&2
        exit 1
      }
    done

    echo "estate provision complete"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-estate-provision
  namespace: openbao
  annotations:
    # WEDGE GUARD — same rationale as provision-job.yaml (2026-07-28 immutable-Job outage): scope
    # delete+recreate to THIS Job so a template change never wedges the openbao Kustomization.
    kustomize.toolkit.fluxcd.io/force: "enabled"
  labels:
    app.kubernetes.io/name: openbao-estate-provision
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: agentforge
spec:
  backoffLimit: 6
  # Reaped after a day, which is also how this re-runs: Flux re-applies the reaped Job, so a seed
  # change converges within a day (or force it: delete the Job, reconcile the openbao Kustomization).
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-estate-provision
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: agentforge
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      automountServiceAccountToken: false # talks only to the OpenBao API, never to kube-apiserver
      securityContext:
        # uid 100 / gid 1000 is the `openbao` user baked into the image — same identity the server
        # StatefulSet runs under. These NUMERIC values stay explicit: 2.6.x images added `USER openbao`
        # (2.5.5 had none), and a NAMED image user cannot satisfy `runAsNonRoot: true`.
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: provision
          # Official OpenBao image (bao CLI + busybox sh), pinned to the server's version.
          image: quay.io/openbao/openbao:2.6.2
          command: ["/bin/sh", "/scripts/provision.sh"]
          env:
            # The headless per-pod name publishes not-ready addresses: a sealed-but-up pod yields a
            # real error instead of a DNS miss.
            - { name: BAO_ADDR, value: "https://openbao-0.openbao-internal.openbao.svc.cluster.local:8200" }
            - { name: BAO_CACERT, value: "/tls/ca.crt" }
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbao-breakglass-token
                  key: root_token
                  optional: false
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: script, mountPath: /scripts, readOnly: true }
            - { name: seeds, mountPath: /etc/openbao-estate-seeds, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tls
          secret:
            secretName: openbao-tls
            items:
              - { key: ca.crt, path: ca.crt }
        - name: script
          configMap:
            name: openbao-estate-provision-script
            defaultMode: 0555
        - name: seeds
          secret:
            secretName: openbao-estate-seeds
