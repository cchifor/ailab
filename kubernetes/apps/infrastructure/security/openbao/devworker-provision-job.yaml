# Dev-worker AppRole provisioning (ADR 0020) — the declarative half of giving each dev-worker VM its
# own OpenBao identity. Enables the `approle` auth mount, writes one read-only policy + one AppRole
# role per worker (PERIODIC tokens, so a renewing agent never hits the max-TTL cliff that locked the
# estate out on 2026-08-25) — and, since 2026-09-12, the same shape for the two reviewer VMs, whose
# only grant is the shared codex projection read (below), plus the k8s-auth role the codex CronJob
# publishes that projection under — and seed-patches the af/dev-workers/* KV paths from the
# openbao-devworker-seeds Secret (SEED-WINS contract — a key present in the seed overwrites live KV
# on every daily run). NB: that is the contract of THIS Job and of estate-provision-job.yaml, and it
# is NOT the AgentForge operator seed's — provision-job.yaml's `_apply_operator_seeds` is
# create-if-absent (live vault wins, divergence reported as drift). The header inside
# devworker-seeds.sops.yaml still says "SAME CONTRACT as operator-seeds.sops.yaml"; that half is
# stale and cannot be fixed without re-encrypting the file. Canonical statement of all three:
# docs/runbooks/openbao-recovery.md § "The seed-ownership contract".
#
# AUTH: the openbao-breakglass-token Secret (the never-expiring root minted during the 2026-08-30
# re-bootstrap; deliberately NOT in git — docs/runbooks/openbao-recovery.md). Root is required
# because provision-job.yaml revokes its own root token on the way out and the scoped provisioner
# token cannot enable auth mounts or write policies. `optional: false` so an absent breakglass Secret
# turns this Job red instead of silently skipping — fail-closed like the other openbao bootstrap Jobs.
#
# What this Job does NOT do: mint per-worker secret-ids. Issuance is an operator ceremony
# (docs/runbooks/openbao-dev-workers.md) so the only places a login credential ever exists are the
# operator's SOPS file and the worker's /etc/openbao-agent — never a k8s Secret.
#
# The openbao namespace has no default-deny CiliumNetworkPolicy (the two policies here are
# endpoint-scoped to the unsealer and the provisioner), so this Job needs no egress policy of its own,
# same as provision-job.yaml.
#
# ORDERING: this needs the `af` KV mount that provision-job.yaml creates, and nothing sequences the
# two — on a first-ever bring-up this Job can lose that race, exhaust its backoff and land Failed.
# That is self-healing, not a manual step: ttlSecondsAfterFinished reaps Failed Jobs as well as
# Complete ones, and Flux re-creates this one on the next reconcile.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-devworker-provision-script
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-devworker-provision
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: agentforge
data:
  provision.sh: |
    #!/bin/sh
    # Idempotent: every write is an upsert, so the daily re-run just re-converges. Fail-closed:
    # `set -eu` and no `|| true` — a half-provisioned vault must surface as a red Job.
    # NEVER echo credential material. BAO_TOKEN arrives via env from the breakglass Secret, the seed
    # JSON is handed to `bao` by FILE PATH (never as an argv word), and the one command that would
    # print a value (`bao kv get`, used as an existence probe) is redirected to /dev/null.
    set -eu

    SEED_DIR=/etc/openbao-devworker-seeds

    bao token lookup >/dev/null || {
      echo "openbao unreachable/sealed or the breakglass token was rejected; aborting" >&2
      exit 1
    }

    # `bao auth enable` fails when the mount already exists, so probe the mount list first.
    if ! bao auth list -format=json | grep -q '"approle/"'; then
      bao auth enable approle
    fi

    # ONE codex login for the whole estate (2026-09-12). The Codex Pro OAuth document the broker uses
    # (af/operator/broker/openai/codex-pro/oauth) is rotated by the af-codex-refresh CronJob, and that
    # CronJob also PUBLISHES a host projection of it — af/dev-workers/codex-auth: access + id token +
    # account_id, refresh_token replaced by "" — which is what every dev worker and reviewer VM
    # renders its ~/.codex/auth.json from. Hosts get `read` on the PROJECTION and nothing on the oauth
    # document: OpenAI refresh tokens are single-use, so a host that could fetch the refresh_token
    # (any process holding the worker's OpenBao token, e.g. an agent session via the cred sink) could
    # refresh behind the CronJob's back and revoke the entire family — which is how every host + the
    # broker lost codex on 2026-09-03. With only the projection readable, a host can use the token but
    # can never rotate it. `read` on the DATA path only — no metadata, no list, no write.
    CODEX_AUTH_GRANT='path "af/data/dev-workers/codex-auth" { capabilities = ["read"] }'

    # The six dev workers (inventory/hosts.yml, group dev_workers). Role and policy are both named
    # after the ansible inventory_hostname, so an audit entry names the machine. Adding a worker is
    # one word here plus the mint ceremony in docs/runbooks/openbao-dev-workers.md.
    for host in dev-worker-1 dev-worker-2 dev-worker-3 dev-worker-4 dev-worker-5 dev-worker-6; do
      # Read-only, scoped to this worker's own subtree plus the shared one. The metadata `list`
      # grants are what make `cred list` work; nothing here can create, update or delete, so a
      # compromised worker cannot rewrite another worker's credentials.
      bao policy write "$host" - <<EOF
    ${CODEX_AUTH_GRANT}
    path "af/data/dev-workers/common"        { capabilities = ["read"] }
    path "af/data/dev-workers/common/*"      { capabilities = ["read"] }
    path "af/data/dev-workers/${host}"       { capabilities = ["read"] }
    path "af/data/dev-workers/${host}/*"     { capabilities = ["read"] }
    path "af/metadata/dev-workers"           { capabilities = ["list"] }
    path "af/metadata/dev-workers/"          { capabilities = ["list"] }
    path "af/metadata/dev-workers/common"    { capabilities = ["read", "list"] }
    path "af/metadata/dev-workers/common/*"  { capabilities = ["read", "list"] }
    path "af/metadata/dev-workers/${host}"   { capabilities = ["read", "list"] }
    path "af/metadata/dev-workers/${host}/*" { capabilities = ["read", "list"] }
    EOF
      # PERIODIC token (token_period): the TTL resets on every renewal and there is no max-TTL to
      # run into — the antidote to the 2026-08-25 768h expiry lockout, which is what a long-lived
      # `bao agent` would otherwise walk straight into. secret_id_ttl=0 + secret_id_num_uses=0 keep
      # the secret-id a DURABLE per-VM bootstrap credential: the worker has to re-login after every
      # reboot and nothing re-delivers it. No *_bound_cidrs: the LAN NodePort SNATs the client away
      # before OpenBao sees it (openbao-lan.yaml), so the per-worker blast radius is the scoped
      # policy above plus revoking that worker's secret-id.
      bao write "auth/approle/role/${host}" \
        token_policies="${host}" \
        token_period=72h \
        secret_id_ttl=0 \
        secret_id_num_uses=0
    done

    # The two reviewer VMs (inventory/hosts.yml, group reviewers; ansible/reviewers.yml). Same
    # AppRole shape as a dev worker, but the policy is the codex projection read and NOTHING else: a
    # reviewer has no `cred`, no per-host subtree, and must not see the rest of the dev-workers KV
    # (gitea PAT, hypervisor key). The mint ceremony is the same one — docs/runbooks/openbao-dev-workers.md (e).
    for host in reviewer-1 reviewer-2; do
      bao policy write "$host" - <<EOF
    ${CODEX_AUTH_GRANT}
    EOF
      bao write "auth/approle/role/${host}" \
        token_policies="${host}" \
        token_period=72h \
        secret_id_ttl=0 \
        secret_id_num_uses=0
    done

    # codex-hosts-publisher — the WRITE side of af/dev-workers/codex-auth (the host projection above).
    # Bound to the af-codex-refresh CronJob's own ServiceAccount (ns agentforge-broker): that CronJob
    # is the one process that ever holds a freshly rotated auth.json, so it publishes the projection
    # right after each rotation. A SEPARATE k8s-auth role rather than a wider af-codex-refresher
    # policy: that policy is owned/reconciled by the agentforge provisioner and scoped to the oauth
    # document; this one is owned here, next to the readers, and scoped to the projection only —
    # `read` for the write-if-changed compare, no delete, nothing else under dev-workers/.
    bao policy write codex-hosts-publisher - <<'EOF'
    path "af/data/dev-workers/codex-auth" { capabilities = ["read", "create", "update"] }
    EOF
    bao write auth/kubernetes/role/codex-hosts-publisher \
      bound_service_account_names=af-codex-refresher \
      bound_service_account_namespaces=agentforge-broker \
      token_policies=codex-hosts-publisher \
      token_ttl=15m \
      token_max_ttl=30m

    # openbao-k8stoken-sync (ADR 0021) — the in-cluster job that mints per-worker kubeconfigs and
    # writes them to af/dev-workers/<host>.{tep,helmtest}_kubeconfig. It authenticates with the
    # KUBERNETES auth mount, NOT the breakglass token: a daily credential-writer must not hold root.
    #
    # CAPABILITIES: `read` and `patch` are NOT optional extras. KV-v2's patch is an HTTP PATCH that
    # requires the `patch` capability, and the existence probe that decides patch-vs-create requires
    # `read`. A create+update-only policy looks tighter and makes every sync fail.
    #
    # This grants nothing on dev-workers/common (the shared gitea_pat / proxmox_ssh_key), nothing on
    # af/estate/*, and no delete anywhere.
    bao policy write k8stoken-sync - <<'EOF'
    path "af/data/dev-workers/dev-worker-1" { capabilities = ["read", "create", "update", "patch"] }
    path "af/data/dev-workers/dev-worker-2" { capabilities = ["read", "create", "update", "patch"] }
    path "af/data/dev-workers/dev-worker-3" { capabilities = ["read", "create", "update", "patch"] }
    path "af/data/dev-workers/dev-worker-4" { capabilities = ["read", "create", "update", "patch"] }
    path "af/data/dev-workers/dev-worker-5" { capabilities = ["read", "create", "update", "patch"] }
    path "af/data/dev-workers/dev-worker-6" { capabilities = ["read", "create", "update", "patch"] }
    EOF
    # The kubernetes auth mount itself is created by provision-job.yaml (AF_OB_K8S_HOST, with
    # token_reviewer_jwt deliberately unset so the OpenBao SERVER pod's own SA does the TokenReview).
    # If that has not run yet this write fails and the Job is retried — the same benign ordering race
    # this Job already has with the `af` KV mount, self-healed by ttlSecondsAfterFinished + Flux.
    bao write auth/kubernetes/role/k8stoken-sync \
      bound_service_account_names=openbao-k8stoken-sync \
      bound_service_account_namespaces=openbao \
      token_policies=k8stoken-sync \
      token_ttl=15m \
      token_max_ttl=30m

    # Seed the KV subtree: one file per path, `<name>.json` -> af/dev-workers/<name>. `kv patch` is
    # the read-modify-write that gives the seed-wins-others-survive contract; it needs an existing
    # version, so a never-written path is created with `kv put` of the same file.
    seeded=0
    for seed in "$SEED_DIR"/*.json; do
      [ -f "$seed" ] || continue
      name="$(basename "$seed" .json)"
      # Stderr is captured into a VARIABLE, not a temp file: this container runs with
      # readOnlyRootFilesystem: true, so /tmp is not writable and a `2>/tmp/...` redirect fails
      # before the probe even runs. `2>&1 >/dev/null` keeps stderr and discards stdout (the order
      # matters). The assignment sits in an `if` condition so `set -e` does not abort on a non-zero
      # probe, which is the expected case for an absent path.
      if probe_err="$(bao kv get -mount=af "dev-workers/${name}" 2>&1 >/dev/null)"; then
        bao kv patch -mount=af "dev-workers/${name}" "@${seed}"
      elif printf '%s' "$probe_err" | grep -qiE 'no value found|not found'; then
        # GENUINELY absent. Create-only (cas=0), never a bare put: openbao-k8stoken-sync writes
        # sync-owned fields into these same paths, and both jobs can observe absence at once — the
        # loser of a bare-put race REPLACES the winner's document and silently erases the other's
        # fields. On a CAS conflict the path now exists, so fall through to the merge path.
        bao kv put -cas=0 -mount=af "dev-workers/${name}" "@${seed}" \
          || bao kv patch -mount=af "dev-workers/${name}" "@${seed}"
      else
        # An auth/network failure is NOT absence. Treating it as absence is how a transient error
        # turns into a destructive full-document write.
        echo "probe of dev-workers/${name} failed and was not a not-found; aborting" >&2
        echo "$probe_err" >&2
        exit 1
      fi
      seeded=$((seeded + 1))
    done
    [ "$seeded" -gt 0 ] || { echo "no *.json under $SEED_DIR; aborting" >&2; exit 1; }

    echo "devworker provision complete"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-devworker-provision
  namespace: openbao
  annotations:
    # WEDGE GUARD — same rationale as provision-job.yaml (2026-07-28 immutable-Job outage): a Job's
    # `spec.template` is immutable, so editing the script's ConfigMap name, the image or the security
    # context would otherwise fail "field is immutable" and take the whole `openbao` Kustomization
    # False. This annotation scopes delete+recreate to THIS Job, not Kustomization-wide `spec.force`
    # (which would also force the namespace / TLS Certificate / SOPS seed Secrets this layer owns).
    kustomize.toolkit.fluxcd.io/force: "enabled"
  labels:
    app.kubernetes.io/name: openbao-devworker-provision
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: agentforge
spec:
  backoffLimit: 6
  # Reaped after a day, which is also how this re-runs: Flux re-applies the reaped Job, so a seed
  # rotation or a script change converges within a day without anyone running `bao` by hand.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-devworker-provision
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: agentforge
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      automountServiceAccountToken: false # talks only to the OpenBao API, never to kube-apiserver
      securityContext:
        # uid 100 / gid 1000 is the `openbao` user baked into the image — the same identity the
        # server StatefulSet runs under, there via the chart's own default rather than anything
        # helmrelease.yaml sets. These NUMERIC values stay explicit: 2.6.x images added `USER openbao`
        # (2.5.5 had none), and a NAMED image user cannot satisfy `runAsNonRoot: true` — the kubelet
        # cannot prove a name is not uid 0 and refuses to start the container.
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: provision
          # The official OpenBao image (bao CLI + busybox sh), pinned to the SERVER's version so the
          # CLI and the API can never drift; quay.io is where the chart pulls the server from too.
          image: quay.io/openbao/openbao:2.6.2
          command: ["/bin/sh", "/scripts/provision.sh"]
          env:
            - { name: BAO_ADDR, value: "https://openbao-0.openbao-internal.openbao.svc.cluster.local:8200" }
            - { name: BAO_CACERT, value: "/tls/ca.crt" }
            # The headless per-pod name above is dialled rather than the `openbao` Service because it
            # publishes not-ready addresses: this Job can then reach a pod that is up but sealed and
            # fail with a real error instead of a DNS miss.
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbao-breakglass-token
                  key: root_token # verified against the live Secret; it carries no `token` key
                  optional: false
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: script, mountPath: /scripts, readOnly: true }
            - { name: seeds, mountPath: /etc/openbao-devworker-seeds, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tls
          secret:
            secretName: openbao-tls
            items:
              - { key: ca.crt, path: ca.crt }
        - name: script
          configMap:
            name: openbao-devworker-provision-script
            defaultMode: 0555
        - name: seeds
          secret:
            secretName: openbao-devworker-seeds
