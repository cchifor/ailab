# Provisions the OpenBao side of the Workbricks cell c1 (Workbricks OR-10). The cell's secrets live
# in the vault and reach its pods through External Secrets; the vault's transit engine signs three
# things for it, and the keys never leave the vault. This Job owns every vault object that makes
# that work, declaratively, the way strive-pg-harness-provision-job.yaml owns its role:
#   * the `transit/` secrets engine          enabled if absent (the estate's first transit mount);
#                                            REFUSES if something else is mounted there.
#   * three transit keys, ecdsa-p256         workbricks-c1-jwks-root  (gatekeeper's key attestations)
#                                            workbricks-c1-release    (release manifests)
#                                            workbricks-c1-audit      (audit checkpoints)
#     each exportable=false, allow_plaintext_backup=false, deletion_allowed=false. Creating an
#     existing key is a no-op in OpenBao (measured on 2.6.4: a second create with another type
#     exits 0 and changes nothing), so the Job always creates, then READS BACK and refuses unless
#     the key has exactly those settings.
#   * four policies + four k8s-auth roles, OWNED WHOLE (each role carries the same-named policy):
#       workbricks-c1-gatekeeper   SA gatekeeper@workbricks-c1        sign/verify + read pubkeys, jwks-root
#       workbricks-c1-app-control  SA app-control@workbricks-c1       sign/verify + read pubkeys, release
#       workbricks-c1-audit        SA audit@workbricks-c1             sign/verify + read pubkeys, audit
#       workbricks-c1-secrets      SA secret-delivery@workbricks-c1   read af/data/workbricks/c1/*
#                                  and secret-delivery@workbricks-c1-data
#   * RETIRED 2026-10-22: policy + role workbricks-c1-signing (SA signing@workbricks-c1, release AND
#     audit). Workbricks: `signing` is a library, not a service, and each caller signs with its own
#     key, so the one role became app-control (release) and audit (audit). Section 6 deletes the old
#     role, then the old policy -- the policy ONLY while it still equals its last reviewed form
#     (RETIRED_SIGN_FORM); a drifted one means a human changed it, and the Job refuses before any write.
#     The sandbox namespace (workbricks-c1-sandbox) gets NO vault access: its runners are
#     credential-free by design (Workbricks decision 9).
#   * KV: nothing is created. af/workbricks/c1/ is the prefix the secrets role may read; documents
#     under it are written by operators (e.g. the identity-provider client secrets, OR-9).
#
# Signing goes through the vault on purpose: `read` on transit/keys/<key> returns PUBLIC keys only,
# and no policy here grants export, backup, rotate, config or delete. Rotation is an operator act
# (`bao write -f transit/keys/<key>/rotate`), never the cell's.
#
# AUTH: the openbao-breakglass-token Secret, as for the sibling provision Jobs -- the scoped
# provisioner token cannot enable engines or write policies and auth roles. `optional: false` so an
# absent Secret turns this Job red rather than skipping silently.
#
# THE OWNERSHIP CONTRACT:
#   * GIT OWNS THE FOUR POLICIES AND THE FOUR ROLES WHOLE. `bao policy write` replaces the
#     policy; each role write spells out every field, empty and default ones included (a role
#     write is an update that keeps omitted fields), and reads each one back. A change made by hand
#     is reverted on the next run; an emergency change must suspend this Job (or the `openbao`
#     Kustomization) AND land in git before reconciliation resumes.
#   * THE KEYS ARE CREATED, NEVER CHANGED. Their key material exists only in the vault (and its
#     raft snapshots): a vault rebuilt from git alone gets NEW keys, so every signature and
#     attestation made before is unverifiable with the new public keys. docs/runbooks/
#     openbao-recovery.md, the TRANSIT row, has the order.
#   * REMOVING THIS FILE FROM GIT DOES NOT UNDO ITS WRITES. Rollback addresses the OpenBao objects
#     explicitly; the keys cannot be deleted at all until deletion_allowed is set on them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-workbricks-c1-provision-script
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-workbricks-c1-provision
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: workbricks
data:
  provision.sh: |
    #!/bin/sh
    # Idempotent and fail-closed: `set -eu`, no blanket `|| true`. Nothing here is credential
    # material: policies are printed before they are replaced (the audit trail), and the transit
    # read-back prints PUBLIC key metadata only.
    set -eu

    TRANSIT=transit
    KEYS="workbricks-c1-jwks-root workbricks-c1-release workbricks-c1-audit"
    GK_POLICY=workbricks-c1-gatekeeper
    APPCTL_POLICY=workbricks-c1-app-control
    AUDIT_POLICY=workbricks-c1-audit
    SECRETS_POLICY=workbricks-c1-secrets
    # Retired policy + role (see the header). RETIRED_SIGN_FORM is the normalised document the
    # previous version of this Job wrote (its SIGN_DESIRED): the only form section 6 may delete.
    RETIRED_SIGN=workbricks-c1-signing
    RETIRED_SIGN_FORM='path"transit/sign/workbricks-c1-release"{capabilities=["update"]}path"transit/sign/workbricks-c1-release/sha2-256"{capabilities=["update"]}path"transit/verify/workbricks-c1-release"{capabilities=["update"]}path"transit/verify/workbricks-c1-release/sha2-256"{capabilities=["update"]}path"transit/keys/workbricks-c1-release"{capabilities=["read"]}path"transit/sign/workbricks-c1-audit"{capabilities=["update"]}path"transit/sign/workbricks-c1-audit/sha2-256"{capabilities=["update"]}path"transit/verify/workbricks-c1-audit"{capabilities=["update"]}path"transit/verify/workbricks-c1-audit/sha2-256"{capabilities=["update"]}path"transit/keys/workbricks-c1-audit"{capabilities=["read"]}'

    bao token lookup >/dev/null || {
      echo "openbao unreachable/sealed or the breakglass token was rejected; aborting" >&2
      exit 1
    }

    # ---- 1. Drift guards on all four policies and the retired one, BEFORE anything is written --
    # Whole-document comparison after stripping full-line comments, then every whitespace
    # character (chatgpt-provision-job.yaml has the reasoning). None of the four has a
    # pre-ownership form: nothing created them before this Job, so the only document each may find
    # is its own output.
    #
    # THE MAINTENANCE RULE, which no test can enforce because it spans git revisions: when a
    # heredoc in section 4 changes, the live vault holds the OUTGOING desired form, so a Job that
    # only updated *_DESIRED refuses every run from then on. On ANY policy change here, do all three:
    #   1. edit the heredoc;
    #   2. set *_DESIRED to the new normalised form (the test pins each pair);
    #   3. set *_BASELINE to the OUTGOING *_DESIRED.
    normalise() {
      sed -e 's/^[[:space:]]*#.*$//' | tr -d '[:space:]'
    }
    GK_BASELINE='path"transit/sign/workbricks-c1-jwks-root"{capabilities=["update"]}path"transit/sign/workbricks-c1-jwks-root/sha2-256"{capabilities=["update"]}path"transit/verify/workbricks-c1-jwks-root"{capabilities=["update"]}path"transit/verify/workbricks-c1-jwks-root/sha2-256"{capabilities=["update"]}path"transit/keys/workbricks-c1-jwks-root"{capabilities=["read"]}'
    GK_DESIRED="$GK_BASELINE"
    APPCTL_BASELINE='path"transit/sign/workbricks-c1-release"{capabilities=["update"]}path"transit/sign/workbricks-c1-release/sha2-256"{capabilities=["update"]}path"transit/verify/workbricks-c1-release"{capabilities=["update"]}path"transit/verify/workbricks-c1-release/sha2-256"{capabilities=["update"]}path"transit/keys/workbricks-c1-release"{capabilities=["read"]}'
    APPCTL_DESIRED="$APPCTL_BASELINE"
    AUDIT_BASELINE='path"transit/sign/workbricks-c1-audit"{capabilities=["update"]}path"transit/sign/workbricks-c1-audit/sha2-256"{capabilities=["update"]}path"transit/verify/workbricks-c1-audit"{capabilities=["update"]}path"transit/verify/workbricks-c1-audit/sha2-256"{capabilities=["update"]}path"transit/keys/workbricks-c1-audit"{capabilities=["read"]}'
    AUDIT_DESIRED="$AUDIT_BASELINE"
    SECRETS_BASELINE='path"af/data/workbricks/c1/*"{capabilities=["read"]}'
    SECRETS_DESIRED="$SECRETS_BASELINE"

    # An unreadable policy must NOT look like an absent one: absence is established from the
    # policy LIST, and once a policy is known to exist the read must succeed or the Job stops.
    POLICY_LIST="$(bao policy list -format=json)" || {
      echo "cannot list policies; aborting rather than writing blind" >&2
      exit 1
    }
    guard_policy() {
      policy=$1; baseline=$2; desired=$3
      if echo "$POLICY_LIST" | grep -q "\"${policy}\""; then
        prev="$(bao policy read "$policy")" || {
          echo "policy $policy exists but could not be read; aborting rather than writing blind" >&2
          exit 1
        }
        echo "--- existing policy $policy (replaced below; kept here as the audit trail) ---"
        echo "$prev"
        echo "--- end existing policy ---"
        prev_norm="$(printf '%s\n' "$prev" | normalise)"
        if [ "$prev_norm" != "$baseline" ] && [ "$prev_norm" != "$desired" ]; then
          echo "REFUSING: policy $policy does not match the reviewed baseline or the desired" >&2
          echo "document. Something changed it outside git. Reconcile workbricks-c1-provision-job.yaml" >&2
          echo "with the policy printed above before letting this Job run again." >&2
          exit 1
        fi
        echo "policy $policy matches a reviewed form; safe to replace"
      else
        echo "policy $policy absent (fresh vault, or first run); creating it"
      fi
    }
    guard_policy "$GK_POLICY" "$GK_BASELINE" "$GK_DESIRED"
    guard_policy "$APPCTL_POLICY" "$APPCTL_BASELINE" "$APPCTL_DESIRED"
    guard_policy "$AUDIT_POLICY" "$AUDIT_BASELINE" "$AUDIT_DESIRED"
    guard_policy "$SECRETS_POLICY" "$SECRETS_BASELINE" "$SECRETS_DESIRED"
    # The retired policy: absent is fine (fresh vault, or already retired); present, it must still be
    # its last reviewed form, or the Job refuses here, before ANY write, and section 6 never deletes
    # a document somebody changed by hand.
    RETIRE_SIGN_POLICY=no
    if echo "$POLICY_LIST" | grep -q "\"${RETIRED_SIGN}\""; then
      prev="$(bao policy read "$RETIRED_SIGN")" || {
        echo "retired policy $RETIRED_SIGN exists but could not be read; aborting" >&2
        exit 1
      }
      echo "--- retired policy $RETIRED_SIGN (deleted in section 6; kept here as the audit trail) ---"
      echo "$prev"
      echo "--- end retired policy ---"
      if [ "$(printf '%s\n' "$prev" | normalise)" != "$RETIRED_SIGN_FORM" ]; then
        echo "REFUSING: retired policy $RETIRED_SIGN does not match its last reviewed form. Something" >&2
        echo "changed it outside git, and this Job deletes only the reviewed form. To unblock, review the" >&2
        echo "policy printed above, then EITHER delete it by hand (bao policy delete $RETIRED_SIGN; the" >&2
        echo "role goes on the next run) OR restore RETIRED_SIGN_FORM (bao policy write) and re-run." >&2
        exit 1
      fi
      echo "retired policy $RETIRED_SIGN matches its last reviewed form; will be deleted"
      RETIRE_SIGN_POLICY=yes
    fi

    # ---- 2. The transit engine ------------------------------------------------------------------
    # Presence from the mount LIST, then the TYPE from the mount itself: a kv (or any other) engine
    # at transit/ would make every key write below fail in confusing ways, so it is refused here.
    MOUNTS="$(bao secrets list -format=json)" || {
      echo "cannot list secrets engines; aborting" >&2
      exit 1
    }
    if echo "$MOUNTS" | grep -q "\"${TRANSIT}/\""; then
      mount_json="$(bao read -format=json "sys/mounts/${TRANSIT}")" || {
        echo "${TRANSIT}/ is listed but its mount could not be read; aborting" >&2
        exit 1
      }
      echo "$mount_json" | grep -q '"type": "transit"' || {
        echo "REFUSING: ${TRANSIT}/ is mounted, but not as a transit engine" >&2
        exit 1
      }
      echo "transit engine at ${TRANSIT}/ present"
    else
      bao secrets enable -path="$TRANSIT" \
        -description="transit signing keys; each key is owned by the provision Job that creates it" transit
      echo "transit engine enabled at ${TRANSIT}/"
    fi

    # ---- 3. The keys: created if absent, then verified, never changed ---------------------------
    key_has() {
      echo "$1" | grep -q "\"$2\": $3"
    }
    for key in $KEYS; do
      bao write -f "${TRANSIT}/keys/${key}" type=ecdsa-p256 exportable=false allow_plaintext_backup=false >/dev/null
      kj="$(bao read -format=json "${TRANSIT}/keys/${key}")" || {
        echo "transit key $key could not be read back; aborting" >&2
        exit 1
      }
      if key_has "$kj" type '"ecdsa-p256"' && key_has "$kj" exportable false &&
        key_has "$kj" allow_plaintext_backup false && key_has "$kj" deletion_allowed false; then
        echo "transit key $key: ecdsa-p256, not exportable, no plaintext backup, deletion not allowed"
      else
        echo "REFUSING: transit key $key exists with settings other than ecdsa-p256 /" >&2
        echo "exportable=false / allow_plaintext_backup=false / deletion_allowed=false. A key's type" >&2
        echo "cannot change and an exported key cannot be un-exported: an operator must decide." >&2
        exit 1
      fi
    done

    # ---- 4. The policies --------------------------------------------------------------------------
    # sign and verify on the key's base path and on its sha2-256 form only (ES256); `read` on
    # transit/keys/<key> returns the public keys. Nothing grants export, backup, rotate, config,
    # trim or delete.
    bao policy write "$GK_POLICY" - <<'EOF'
    path "transit/sign/workbricks-c1-jwks-root" { capabilities = ["update"] }
    path "transit/sign/workbricks-c1-jwks-root/sha2-256" { capabilities = ["update"] }
    path "transit/verify/workbricks-c1-jwks-root" { capabilities = ["update"] }
    path "transit/verify/workbricks-c1-jwks-root/sha2-256" { capabilities = ["update"] }
    path "transit/keys/workbricks-c1-jwks-root" { capabilities = ["read"] }
    EOF
    bao policy write "$APPCTL_POLICY" - <<'EOF'
    path "transit/sign/workbricks-c1-release" { capabilities = ["update"] }
    path "transit/sign/workbricks-c1-release/sha2-256" { capabilities = ["update"] }
    path "transit/verify/workbricks-c1-release" { capabilities = ["update"] }
    path "transit/verify/workbricks-c1-release/sha2-256" { capabilities = ["update"] }
    path "transit/keys/workbricks-c1-release" { capabilities = ["read"] }
    EOF
    bao policy write "$AUDIT_POLICY" - <<'EOF'
    path "transit/sign/workbricks-c1-audit" { capabilities = ["update"] }
    path "transit/sign/workbricks-c1-audit/sha2-256" { capabilities = ["update"] }
    path "transit/verify/workbricks-c1-audit" { capabilities = ["update"] }
    path "transit/verify/workbricks-c1-audit/sha2-256" { capabilities = ["update"] }
    path "transit/keys/workbricks-c1-audit" { capabilities = ["read"] }
    EOF
    # `read` on the DATA endpoint only: ESO's `data[].remoteRef` reads KV-v2 data and never
    # enumerates or fetches metadata. (A `dataFrom.find` would need list on metadata: ask first.)
    bao policy write "$SECRETS_POLICY" - <<'EOF'
    path "af/data/workbricks/c1/*" { capabilities = ["read"] }
    EOF
    for pair in "$GK_POLICY:$GK_DESIRED" "$APPCTL_POLICY:$APPCTL_DESIRED" "$AUDIT_POLICY:$AUDIT_DESIRED" \
      "$SECRETS_POLICY:$SECRETS_DESIRED"; do
      policy="${pair%%:*}"; desired="${pair#*:}"
      raw="$(bao policy read "$policy")" || {
        echo "policy $policy could not be read back; aborting" >&2
        exit 1
      }
      [ "$(printf '%s\n' "$raw" | normalise)" = "$desired" ] || {
        echo "policy $policy does not equal its desired form after writing; aborting" >&2
        exit 1
      }
    done
    echo "policies $GK_POLICY, $APPCTL_POLICY, $AUDIT_POLICY, $SECRETS_POLICY written and verified"

    # ---- 5. The auth roles, WRITTEN and OWNED WHOLE -----------------------------------------------
    # The shape af-app-strive-pg-harness has live: the ServiceAccount's uid as the entity alias, a
    # 1h token, the policy attached through token_policies. A role write is an UPDATE that keeps
    # every omitted field, so EVERY field is written explicitly, the empty and default ones included:
    # the login-deciding ones (above all bound_service_account_namespace_selector) and the token
    # ones (max/explicit-max TTL, period, use count, type, default policy), pinned to OpenBao's
    # defaults. Then everything is read back: list fields with EXACT element matches, scalar fields
    # against the value OpenBao prints for what was written.
    role_field_has() {
      bao read -field="$2" "auth/kubernetes/role/$1" | tr -d '[]' | tr ' ' '\n' | grep -qx "$3"
    }
    write_role() {
      role=$1; sa=$2; namespaces=$3; policy=$4
      bao write "auth/kubernetes/role/$role" \
        bound_service_account_names="$sa" \
        bound_service_account_namespaces="$namespaces" \
        bound_service_account_namespace_selector="" \
        audience="" \
        token_bound_cidrs="" \
        token_policies="$policy" \
        token_ttl=1h \
        token_max_ttl=0 \
        token_explicit_max_ttl=0 \
        token_period=0 \
        token_num_uses=0 \
        token_type=default \
        token_no_default_policy=false \
        alias_name_source=serviceaccount_uid
      for want in token_ttl=3600 token_max_ttl=0 token_explicit_max_ttl=0 token_period=0 \
        token_num_uses=0 token_type=default token_no_default_policy=false \
        alias_name_source=serviceaccount_uid; do
        got="$(bao read -field="${want%%=*}" "auth/kubernetes/role/$role")" || {
          echo "cannot read back role $role field ${want%%=*}; aborting" >&2
          exit 1
        }
        [ "$got" = "${want#*=}" ] || {
          echo "role $role has ${want%%=*}=$got after writing, expected ${want#*=}; aborting" >&2
          exit 1
        }
      done
      role_field_has "$role" token_policies "$policy" || {
        echo "role $role does not carry policy $policy after writing; aborting" >&2
        exit 1
      }
      [ "$(bao read -field=token_policies "auth/kubernetes/role/$role")" = "[$policy]" ] || {
        echo "role $role carries more than its one policy after writing; aborting" >&2
        exit 1
      }
      role_field_has "$role" bound_service_account_names "$sa" || {
        echo "role $role is not bound to ServiceAccount $sa after writing; aborting" >&2
        exit 1
      }
      for ns in $(echo "$namespaces" | tr ',' ' '); do
        role_field_has "$role" bound_service_account_namespaces "$ns" || {
          echo "role $role is not bound to namespace $ns after writing; aborting" >&2
          exit 1
        }
      done
      # audience and token_bound_cidrs are checked in the role's JSON: an EMPTY audience is absent
      # from `bao read -field=audience` (exit 1, "not present"), which must not read as a failure,
      # while a role that cannot be read at all still must.
      rj="$(bao read -format=json "auth/kubernetes/role/$role")" || {
        echo "cannot read back role $role; aborting" >&2
        exit 1
      }
      if echo "$rj" | grep -q '"audience": "[^"]'; then
        echo "role $role still carries an audience after writing; aborting" >&2
        exit 1
      fi
      echo "$rj" | grep -q '"token_bound_cidrs": \[\]' || {
        echo "role $role still carries token_bound_cidrs after writing; aborting" >&2
        exit 1
      }
      sel="$(bao read -field=bound_service_account_namespace_selector "auth/kubernetes/role/$role")" || {
        echo "cannot read back role $role's namespace selector; aborting" >&2
        exit 1
      }
      [ -z "$sel" ] || {
        echo "role $role still carries a namespace selector after writing; aborting" >&2
        exit 1
      }
      echo "role $role written: $sa@{$namespaces} carries $policy"
    }
    write_role workbricks-c1-gatekeeper gatekeeper workbricks-c1 "$GK_POLICY"
    write_role workbricks-c1-app-control app-control workbricks-c1 "$APPCTL_POLICY"
    write_role workbricks-c1-audit audit workbricks-c1 "$AUDIT_POLICY"
    write_role workbricks-c1-secrets secret-delivery workbricks-c1,workbricks-c1-data "$SECRETS_POLICY"

    # ---- 6. Retire workbricks-c1-signing: the role first, then the policy -------------------------
    # After the replacements exist. The ROLE goes whatever it holds: deleting a login path only
    # narrows access. The POLICY goes only when section 1 found it in its last reviewed form. Both
    # absences are established from LISTS and checked again after the delete; absent = nothing to do.
    # (Section 5 just wrote four roles, so the role list cannot legitimately come back empty.)
    ROLE_LIST="$(bao list -format=json auth/kubernetes/role)" || {
      echo "cannot list k8s-auth roles; aborting" >&2
      exit 1
    }
    if echo "$ROLE_LIST" | grep -q "\"${RETIRED_SIGN}\""; then
      bao delete "auth/kubernetes/role/$RETIRED_SIGN" >/dev/null
      after="$(bao list -format=json auth/kubernetes/role)" || {
        echo "cannot list k8s-auth roles after deleting $RETIRED_SIGN; aborting" >&2
        exit 1
      }
      if echo "$after" | grep -q "\"${RETIRED_SIGN}\""; then
        echo "retired role $RETIRED_SIGN is still listed after deleting it; aborting" >&2
        exit 1
      fi
      echo "retired role $RETIRED_SIGN deleted"
    else
      echo "retired role $RETIRED_SIGN absent; nothing to delete"
    fi
    if [ "$RETIRE_SIGN_POLICY" = yes ]; then
      bao policy delete "$RETIRED_SIGN" >/dev/null
      left="$(bao policy list -format=json)" || {
        echo "cannot list policies after deleting $RETIRED_SIGN; aborting" >&2
        exit 1
      }
      if echo "$left" | grep -q "\"${RETIRED_SIGN}\""; then
        echo "retired policy $RETIRED_SIGN is still listed after deleting it; aborting" >&2
        exit 1
      fi
      echo "retired policy $RETIRED_SIGN deleted"
    else
      echo "retired policy $RETIRED_SIGN absent; nothing to delete"
    fi
    echo "workbricks-c1 provisioning complete"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-workbricks-c1-provision
  namespace: openbao
  annotations:
    # WEDGE GUARD -- same rationale as the other provision Jobs (2026-07-28 immutable-Job outage).
    kustomize.toolkit.fluxcd.io/force: "enabled"
  labels:
    app.kubernetes.io/name: openbao-workbricks-c1-provision
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: workbricks
spec:
  backoffLimit: 6
  # Reaped after a day, which is also how this re-runs: Flux re-applies the reaped Job, so a policy
  # or role change in git converges within a day without anyone running `bao` by hand.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-workbricks-c1-provision
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: workbricks
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      automountServiceAccountToken: false # talks only to the OpenBao API, never to kube-apiserver
      securityContext:
        # uid 100 / gid 1000 is the `openbao` user baked into the image, NUMERIC because a NAMED
        # image user cannot satisfy runAsNonRoot.
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: provision
          # Official OpenBao image (bao CLI + busybox sh), the same pin as the sibling provision
          # Jobs: the server's MINOR (renovate.json holds the CLI to 2.6.x).
          image: quay.io/openbao/openbao:2.6.4
          command: ["/bin/sh", "/scripts/provision.sh"]
          env:
            # The headless per-pod name, not the `openbao` Service: a pod that is up but sealed
            # fails with a real error rather than a DNS miss.
            - { name: BAO_ADDR, value: "https://openbao-0.openbao-internal.openbao.svc.cluster.local:8200" }
            - { name: BAO_CACERT, value: "/tls/ca.crt" }
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbao-breakglass-token
                  key: root_token # the live Secret carries no `token` key
                  optional: false
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: script, mountPath: /scripts, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
