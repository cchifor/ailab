# One-time OpenBao PROVISION Job (plan §B "One-time provision Job openbao-provision"). Runs
# `agentforge openbao-provision` (orchestrator image) with the bootstrap (root) token. Idempotent via the
# `openbao-state` sentinel: if already provisioned, exit 0 WITHOUT needing the now-revoked root. Else:
#   - enable the `af` KV-v2 mount;
#   - enable + configure the `kubernetes` auth backend. TokenReview plumbing uses the ROBUST design: we do
#     NOT pass a static token_reviewer_jwt (a run-once Job's projected SA token would EXPIRE and silently
#     break every future login). Instead token_reviewer_jwt is left empty → OpenBao uses the SERVER pod's
#     own continuously-refreshed SA token, so the OpenBao SERVER SA (openbao-server) holds
#     system:auth-delegator (the ClusterRoleBinding below). Without it every ESO SecretStore login is NotReady;
#   - write base operator policies; MINT a scoped `provisioner` token (NOT root) into
#     Secret openbao-provisioner-token; seed the canary path (af/data/operator/canary) the canary
#     SecretStore reads; write the `openbao-state` sentinel {provisioned:"true", cluster_id:<...>};
#   - then REVOKE the root token + delete Secret openbao-bootstrap-token. Fail-closed.
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-provision
  namespace: openbao
  annotations:
    # WEDGE GUARD (2026-07-28 outage) — see unseal-job.yaml for the full rationale. A Job's
    # `spec.template` is IMMUTABLE and the orchestrator digest below is rewritten by every
    # `just pin-bootstrap`, so an in-place patch fails "field is immutable" and takes the whole
    # `openbao` Kustomization — plus external-secrets and its three dependents — False.
    # This annotation scopes delete+recreate to THIS Job (not Kustomization-wide `spec.force`, which
    # would also force the namespace / SOPS seed Secret / TLS Certificate this layer owns).
    #
    # Re-running is safe and already routine: `agentforge openbao-provision` short-circuits on the
    # `openbao-state` sentinel and exits 0 WITHOUT needing the (by then revoked) root token, and
    # ttlSecondsAfterFinished already reaps + re-applies this Job daily.
    kustomize.toolkit.fluxcd.io/force: "enabled"
  labels:
    app.kubernetes.io/name: openbao-provision
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: agentforge
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-provision
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: agentforge
    spec:
      serviceAccountName: openbao-provision
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: provision
          # digest pinned by `just pin-bootstrap` (agentforge main 7ca6c99: operator roles + seeding).
          image: registry.chifor.me/agentforge/orchestrator@sha256:0b3dfcae4eba730a653989a6ce034fde26b2e904525f5f936aca14c03393be67
          args: ["agentforge", "openbao-provision"]
          env:
            - { name: AF_OB_ADDR, value: "https://openbao-0.openbao-internal.openbao.svc.cluster.local:8200" }
            - { name: AF_OB_CACERT, value: "/tls/ca.crt" }
            - { name: AF_OB_K8S_NAMESPACE, value: "openbao" }
            - { name: AF_OB_KEYS_SECRET, value: "openbao-keys" }
            - { name: AF_OB_BOOTSTRAP_SECRET, value: "openbao-bootstrap-token" }
            - { name: AF_OB_PROVISIONER_SECRET, value: "openbao-provisioner-token" }
            - { name: AF_OB_KV_MOUNT, value: "af" }
            - { name: AF_OB_STATE_CM, value: "openbao-state" }
            # k8s-auth: only the host. token_reviewer_jwt + kubernetes_ca_cert are deliberately UNSET so
            # OpenBao uses its own SERVER pod SA (auto-refreshed) + local CA for TokenReviews — no static
            # token to expire. The server SA (openbao-server) carries system:auth-delegator (below).
            - { name: AF_OB_K8S_HOST, value: "https://kubernetes.default.svc" }
            # operator SEED VALUES (dispatcher PAT, reaper/broker ledger DSNs, CI tokens): a JSON blob
            # keyed by logical KV path, SOPS-mounted here and written under each subtree while root is
            # available (there is no admin token after the revoke). See operator-seeds.sops.yaml.
            #
            # ALSO the durable home for a CP-mode TENANT ORCHESTRATOR's credentials
            # (`tenants/<org>/<ws>/orchestrator`: the AF_BOT_TOKEN_* forge PATs + the
            # AF_CONTROL_PLANE_TOKEN workspace bearer). The control plane RENDERS the Deployment's
            # `envFrom: af-creds-<ws>-<pool>` and RECORDS the bearer's SHA-256, but it never writes the
            # plaintext anywhere — materializing that Secret is the OPERATOR's half of the contract
            # (agentforge-platform docs/operations.md, "Worker credentials (af-creds) materialization";
            # the P2/ESO path is "a Vault write, not a hand-built Secret"). Seeding here — rather than a
            # one-off `bao kv put` — is what makes it survive: `_apply_operator_seeds` re-runs on EVERY
            # provision Job and MERGE-writes add-only, so the values are re-seeded after an OpenBao wipe
            # (see docs/runbooks/openbao-recovery.md) while `AF_CAPABILITY_SIGNING_KEY`/`AF_CAPABILITY_KID`,
            # which the keypair lifecycle mirrors into the SAME doc, are preserved untouched.
            # A hand `kubectl create secret` is NOT a substitute: the tenant ExternalSecret is
            # creationPolicy:Owner and overwrites the Secret from OpenBao on its next refresh.
            - { name: AF_OB_SEEDS_FILE, value: "/etc/openbao-seeds/seeds.json" }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: seeds, mountPath: /etc/openbao-seeds, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tls
          secret:
            secretName: openbao-tls
            items:
              - { key: ca.crt, path: ca.crt }
        - name: seeds
          secret:
            secretName: openbao-operator-seeds
---
# The ONE unavoidable cluster RBAC (plan §B TokenReview plumbing). OpenBao (with token_reviewer_jwt unset)
# uses its OWN SERVER pod SA to call TokenReview whenever any SecretStore SA logs in; tokenreviews.create is
# granted ONLY by system:auth-delegator. Bound to the OpenBao SERVER SA (openbao-server, pinned via
# server.serviceAccount.name in the HelmRelease), NOT the run-once provision Job — a Job's projected token
# would expire. This grants NO Secret/token read — only the ability to submit TokenReviews.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-server-auth-delegator
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/part-of: agentforge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao-server
    namespace: openbao
