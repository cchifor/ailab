# OpenBao auto-INIT Job (plan §B "Init Job openbao-init"). Runs `agentforge openbao-init` (orchestrator
# image): dials the headless per-pod address (tolerating NXDOMAIN/refused/not-ready in a retry loop while
# the pod comes up SEALED), and — idempotently, fail-closed:
#   - if uninitialised: preflight a k8s write, `operator init -key-shares=1 -key-threshold=1`, then create
#     Secret openbao-keys (unseal_key ONLY) + Secret openbao-bootstrap-token (root_token, SEPARATE Secret /
#     RBAC), unseal, and assert sealed==false;
#   - if initialised: reconcile against the `openbao-state` sentinel — initialised+keys+bootstrap-MISSING is
#     OK ONLY if the sentinel says provisioned (root legitimately revoked), else FAIL LOUDLY (partial/
#     disaster). Never re-inits over a stale key, never success-loops on a wrong key.
# No key/token material is logged. Re-running the Job is a no-op. Idempotency truth = the sentinel, not a
# lookup on the (possibly-revoked) root token.
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-init
  namespace: openbao
  annotations:
    # WEDGE GUARD (2026-07-28 outage). A Job's `spec.template` is IMMUTABLE, and the orchestrator digest
    # below is rewritten by every `just pin-bootstrap` — so a routine re-pin is a template change, Flux's
    # server-side dry-run fails with "field is immutable", and the WHOLE `openbao` Kustomization goes
    # False. That cascades down the (correct) dependency chain: external-secrets dependsOn openbao, and
    # agentforge-workers / agentforge-ci-runners / agentforge-tenant-platform-dev dependOn that — four
    # kustomizations down for hours, broker pods stuck ContainerCreating 21h on ESO secrets that never
    # materialised, dispatcher frozen on a stale image.
    #
    # This per-object annotation makes kustomize-controller DELETE+RECREATE *this object only* when a
    # patch fails on an immutable field — i.e. it automates the exact manual recovery that cleared the
    # outage (delete the completed Job, let Flux recreate it at the new pin; both re-completed in 12s).
    #
    # Deliberately NOT Kustomization-wide `spec.force: true`: that would apply to everything this layer
    # owns — the openbao Namespace, the SOPS operator-seeds Secret, the openbao-tls Certificate, the
    # unsealer/provisioner Deployments — and a force-delete of the namespace or the seed Secret on this,
    # the estate's most sensitive component, risks exactly the KV loss an OpenBao wipe causes. Flux's own
    # docs warn spec.force "may cause downtime" and should not be left on long-term.
    #
    # Re-running is safe and is ALREADY the steady state: `agentforge openbao-init` is idempotent and
    # fail-closed (it reconciles against the `openbao-state` sentinel, never re-inits over a stale key),
    # and ttlSecondsAfterFinished below already reaps this Job daily, after which Flux re-applies it.
    # So this changes only *when* the re-run happens, never *whether* the bootstrap can run.
    kustomize.toolkit.fluxcd.io/force: "enabled"
  labels:
    app.kubernetes.io/name: openbao-init
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: agentforge
spec:
  backoffLimit: 6 # modest — the pod may be sealed/not-Ready for a while; the CLI retries internally too
  ttlSecondsAfterFinished: 86400 # auto-clean a day after Succeeded (keep logs briefly for verification)
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-init
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: agentforge
    spec:
      serviceAccountName: openbao-init
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # orchestrator image's unified nonroot USER
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: init
          # CHANGEME digest — pinned by scripts/pin-image-digests.py (`just pin-bootstrap`) BEFORE this Job
          # merges (plan Stage 0). ENTRYPOINT is ["tini","--"] + console script `agentforge`, so args must
          # be the full argv.
          image: registry.chifor.me/agentforge/orchestrator@sha256:5092eacb55740f16fddd61e13d9b891b8643a7700239f8be912a5f66e6e26790
          args: ["agentforge", "openbao-init"]
          env:
            - { name: AF_OB_ADDR, value: "https://openbao-0.openbao-internal.openbao.svc.cluster.local:8200" }
            - { name: AF_OB_CACERT, value: "/tls/ca.crt" }
            - { name: AF_OB_K8S_NAMESPACE, value: "openbao" }
            - { name: AF_OB_KEYS_SECRET, value: "openbao-keys" }
            - { name: AF_OB_BOOTSTRAP_SECRET, value: "openbao-bootstrap-token" }
            - { name: AF_OB_KV_MOUNT, value: "af" }
            - { name: AF_OB_STATE_CM, value: "openbao-state" }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            seccompProfile: { type: RuntimeDefault }
      volumes:
        # CA only — the init pod verifies OpenBao's server cert; it never needs the tls.key private half.
        - name: tls
          secret:
            secretName: openbao-tls
            items:
              - { key: ca.crt, path: ca.crt }
