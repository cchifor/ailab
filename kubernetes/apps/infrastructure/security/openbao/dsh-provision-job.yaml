# Provisions the OpenBao side of the dsh credential store (ailab #645).
#
# WHAT IT OWNS, AND WHY IT EXISTS. Policy `af-app-dsh` and the `af/dsh/credentials` KV path were
# going to be created by hand -- the policy already was, in a breakglass ceremony on 2026-09-07,
# and it has lived since then as a COMMENT in kubernetes/apps/apps/dsh/openbao-eso.yaml and nowhere
# else. That is precisely the unmanaged-state problem this repo keeps paying for: nothing recreates
# it after a wipe, nothing reviews a change to it, and the only record of its contents is prose.
# This Job takes ownership of the policy declaratively, the way devworker-provision-job.yaml owns
# the per-worker policies.
#
# AUTH: the openbao-breakglass-token Secret, for the same reason devworker-provision-job.yaml needs
# it -- the scoped provisioner token cannot write policies. `optional: false` so an absent Secret
# turns this Job red rather than skipping silently.
#
# THE OWNERSHIP CONTRACT, stated because it cuts both ways:
#   * GIT OWNS THE WHOLE POLICY. `bao policy write` REPLACES the document; it does not merge. A
#     grant added by hand is reverted on the next run -- and so is a grant REVOKED by hand during an
#     incident. That second direction is the dangerous one: stale git could restore a permission
#     somebody removed deliberately. An emergency policy change must therefore suspend this Job (or
#     its Flux Kustomization) AND land in git before reconciliation resumes.
#   * THE JOB DOES NOT OWN THE KV CONTENTS. It CREATES af/dsh/credentials if absent and never
#     touches it again. Every field after that belongs to the operator, which is the entire point of
#     the feature: adding a credential in OpenBao must reach dsh with no per-machine step, so a git
#     seed here would defeat it.
#   * IT DOES NOT OWN THE AUTH ROLE. auth/kubernetes/role/af-app-dsh is ASSERTED, never written.
#     Rewriting it risks silently narrowing settings this file does not know about -- the live role
#     carries alias_name_source, token_ttl and a token_policies list, and a role bound to the right
#     ServiceAccount but carrying the wrong policies authenticates fine and then reads nothing.
#   * REMOVING THIS FILE FROM GIT DOES NOT UNDO ITS WRITES. Rollback has to address the OpenBao
#     objects explicitly.
#
# WHAT IT DELIBERATELY DOES NOT DO: copy LITELLM_API_KEY into af/dsh/credentials. af/estate/litellm
# is that credential's home and dsh already reads it through its own ExternalSecret; a second home
# is the rotation split-brain docs/runbooks/openbao-estate-credentials.md exists to prevent
# ("rotation must touch ALL homes"). af/dsh/credentials is for credentials whose home is dsh.
# Operators must not add estate duplicates to it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-dsh-provision-script
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-dsh-provision
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: agentforge
data:
  provision.sh: |
    #!/bin/sh
    # Idempotent and fail-closed: `set -eu`, no blanket `|| true`. NEVER echo credential material.
    # A POLICY is not a credential, so the previous policy IS printed before it is replaced -- that
    # log line is the audit trail and the recovery source if this Job ever writes the wrong thing.
    set -eu

    POLICY=af-app-dsh
    ROLE=auth/kubernetes/role/af-app-dsh
    KV_PATH=dsh/credentials
    # A non-secret marker whose only job is to make the path exist and to prove the pipeline
    # end-to-end. The NAME must satisfy the credential seam's reference grammar
    # (^[A-Za-z_][A-Za-z0-9_]*$) or the dsh provider refuses it before the filesystem is touched.
    CANARY_NAME=DSH_OPENBAO_CANARY
    CANARY_VALUE=provisioned

    bao token lookup >/dev/null || {
      echo "openbao unreachable/sealed or the breakglass token was rejected; aborting" >&2
      exit 1
    }

    # ---- 1. Drift guard, BEFORE replacing anything ------------------------------------------
    # `bao policy write` replaces the document, so the failure mode that matters is silently
    # DROPPING a grant somebody added since this file was reviewed. Losing the estate/litellm grant
    # stops dsh-litellm syncing, and because a Secret change does not reach an already-running
    # container's environment, dsh would keep working on a stale credential until it is revoked --
    # an outage detached from its cause by days. So: enumerate the live grants and refuse to
    # proceed if any of them is not in the set this file is about to write.
    PREV="$(bao policy read "$POLICY" 2>/dev/null || true)"
    if [ -n "$PREV" ]; then
      echo "--- existing policy $POLICY (replaced below; kept here as the audit trail) ---"
      echo "$PREV"
      echo "--- end existing policy ---"
      UNKNOWN=0
      for p in $(echo "$PREV" | grep -oE 'path "[^"]+"' | sed 's/^path "//; s/"$//' | sort -u); do
        case "$p" in
          af/data/estate/litellm|af/metadata/estate/litellm|af/data/dsh/credentials) ;;
          *)
            echo "REFUSING: live policy grants '$p', which this Job would drop." >&2
            echo "Reconcile the desired policy in dsh-provision-job.yaml first." >&2
            UNKNOWN=1
            ;;
        esac
      done
      [ "$UNKNOWN" -eq 0 ] || exit 1
    fi

    # ---- 2. The policy ------------------------------------------------------------------------
    # af/data/dsh/credentials carries `read` ONLY. No metadata grant: ESO's `dataFrom.extract`
    # reads the KV-v2 DATA endpoint and does not enumerate paths or fetch metadata (that is the
    # `find` / metadataPolicy:Fetch branch, which this ExternalSecret does not use). The
    # estate/litellm metadata grant is carried forward untouched because it predates this file and
    # dropping it is exactly what the guard above exists to prevent.
    bao policy write "$POLICY" - <<'EOF'
    path "af/data/estate/litellm"     { capabilities = ["read"] }
    path "af/metadata/estate/litellm" { capabilities = ["read", "list"] }
    path "af/data/dsh/credentials"    { capabilities = ["read"] }
    EOF

    # Read back. A write that silently did nothing is indistinguishable from success otherwise.
    bao policy read "$POLICY" | grep -q 'af/data/dsh/credentials' || {
      echo "policy $POLICY did not contain the new grant after writing; aborting" >&2
      exit 1
    }
    bao policy read "$POLICY" | grep -q 'af/data/estate/litellm' || {
      echo "policy $POLICY LOST the litellm grant; aborting" >&2
      exit 1
    }
    echo "policy $POLICY written and verified"

    # ---- 3. The auth role is ASSERTED, not written --------------------------------------------
    # A role's NAME does not attach the same-named policy: token_policies does. Assert both the
    # role's existence and that it actually carries this policy, then leave it alone.
    bao read -field=token_policies "$ROLE" 2>/dev/null | grep -q "$POLICY" || {
      echo "$ROLE missing or does not carry policy $POLICY; this Job does not create roles." >&2
      echo "See kubernetes/apps/apps/dsh/openbao-eso.yaml for the role's expected shape." >&2
      exit 1
    }
    echo "$ROLE present and carries $POLICY"

    # ---- 4. Create the KV path, ONCE ----------------------------------------------------------
    # -cas=0 writes only when no version history exists. Once the path exists every later run
    # conflicts, which is the desired outcome: the operator owns the contents from then on. The
    # conflict is a SKIP, not a failure -- an unhandled non-zero here would fail the Job, and a
    # failing Job fails the openbao Flux Kustomization's health check and blocks its dependents.
    # Deliberately NO `kv patch` fallback (devworker-provision-job.yaml has one because its seeds
    # are git-owned; these contents are not) and no blanket `|| true`, which would hide a real
    # provisioning failure.
    if bao kv get -mount=af -format=json "$KV_PATH" >/dev/null 2>&1; then
      echo "af/$KV_PATH already exists; contents are operator-owned and left untouched"
    elif bao kv put -cas=0 -mount=af "$KV_PATH" "${CANARY_NAME}=${CANARY_VALUE}" >/dev/null 2>&1; then
      echo "af/$KV_PATH created with the $CANARY_NAME marker"
    elif bao kv get -mount=af -format=json "$KV_PATH" >/dev/null 2>&1; then
      # Lost a race with a concurrent creator. The path exists; that is the goal.
      echo "af/$KV_PATH created concurrently; leaving it alone"
    else
      # Reached when the path has version history but no readable current version -- a soft-deleted
      # or destroyed document. -cas=0 will never succeed again and this needs a human.
      echo "af/$KV_PATH is neither readable nor creatable (deleted/destroyed?); operator action needed" >&2
      exit 1
    fi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-dsh-provision
  namespace: openbao
  annotations:
    # WEDGE GUARD — same rationale as the other provision Jobs (2026-07-28 immutable-Job outage): a
    # Job's spec.template is immutable, so editing the script ConfigMap name, the image or the
    # security context would otherwise fail "field is immutable" and take the whole `openbao`
    # Kustomization False. Scoped to THIS Job rather than Kustomization-wide `spec.force`.
    kustomize.toolkit.fluxcd.io/force: "enabled"
  labels:
    app.kubernetes.io/name: openbao-dsh-provision
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: agentforge
spec:
  backoffLimit: 6
  # Reaped after a day, which is also how this re-runs: Flux re-applies the reaped Job, so a policy
  # change in git converges within a day without anyone running `bao` by hand.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-dsh-provision
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: agentforge
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      automountServiceAccountToken: false # talks only to the OpenBao API, never to kube-apiserver
      securityContext:
        # uid 100 / gid 1000 is the `openbao` user baked into the image, NUMERIC for the same reason
        # the other provision Jobs spell it out: a NAMED image user cannot satisfy runAsNonRoot.
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: provision
          # Pinned to the SERVER's image so the CLI and the API cannot drift.
          image: quay.io/openbao/openbao:2.6.2
          command: ["/bin/sh", "/scripts/provision.sh"]
          env:
            # The headless per-pod name, not the `openbao` Service: it publishes not-ready addresses,
            # so this Job reaches a pod that is up but sealed and fails with a real error rather than
            # a DNS miss.
            - { name: BAO_ADDR, value: "https://openbao-0.openbao-internal.openbao.svc.cluster.local:8200" }
            - { name: BAO_CACERT, value: "/tls/ca.crt" }
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbao-breakglass-token
                  key: root_token # the live Secret carries no `token` key
                  optional: false
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: script, mountPath: /scripts, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tls
          secret:
            secretName: openbao-tls
            items:
              - { key: ca.crt, path: ca.crt }
        - name: script
          configMap:
            name: openbao-dsh-provision-script
            defaultMode: 0555
