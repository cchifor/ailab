# Seed values for the dev-worker KV subtree (af/dev-workers/*) — mounted into the
# openbao-devworker-provision Job (devworker-provision-job.yaml). The Job `bao kv patch`es each
# path with this JSON on every run, so (a) keys absent from the seed survive untouched, but
# (b) keys PRESENT here overwrite live KV — the seed is authoritative, and rotating a seeded
# credential only in the vault gets silently reverted on the next daily run. Rotate = write the
# vault AND re-encrypt this file in the same change.
#
# NO LONGER THE SAME CONTRACT AS operator-seeds.sops.yaml, and the difference is the whole point.
# That file is applied by `_apply_operator_seeds` (Python), which since agentforge #276 is
# CREATE-IF-ABSENT: the live vault wins every key it already holds, and a disagreeing seed is
# reported as drift instead of overwriting. This file and estate-seeds.sops.yaml are applied by
# shell `bao kv patch` loops, which still overwrite. The header here used to claim parity with the
# operator seed; that claim is what let a revoked credential be silently restored over a corrected
# one for hours at a time. See docs/runbooks/openbao-recovery.md, "The seed-ownership contract".
# After an OpenBao wipe (docs/runbooks/openbao-recovery.md) this is what restores the subtree; the
# per-worker AppRole secret-ids do NOT come back with it (re-mint, docs/runbooks/openbao-dev-workers.md).
#
# One stringData key per KV path: `<name>.json` seeds `af/dev-workers/<name>`. `common.json` is the
# shared subtree every worker's policy can read; a per-worker path is added by dropping in e.g.
# `dev-worker-3.json` — no change to the provision script.
#
# gitea_pat = the shared `chifor` read/write forge PAT the workers use today (ansible
# dev_worker_gitea_token, rendered by git_forge.yml). Per-worker bot PATs are the planned follow-up.
apiVersion: v1
kind: Secret
metadata:
    name: openbao-devworker-seeds
    namespace: openbao
    labels:
        app.kubernetes.io/name: openbao-devworker-seeds
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: agentforge
type: Opaque
