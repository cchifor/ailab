apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Reconciled by the DEDICATED clusters/ai/openbao.yaml Flux Kustomization (wait:false), NOT the shared
# `infrastructure` one — a sealed OpenBao is not Ready and must not gate the infra layer. Activation is
# fully IaC: the tls/init/unsealer/provision manifests below bring OpenBao up initialised+unsealed+
# provisioned with NO manual `bao operator` commands (see helmrelease.yaml header).
resources:
  - namespace.yaml
  - helmrelease.yaml
  - tls.yaml # cert-manager Certificate (ailab-ca) -> Secret openbao-tls (server + client CA)
  - unseal-rbac.yaml # 4 split-identity SAs + namespaced Roles/RoleBindings
  - unseal-job.yaml # `agentforge openbao-init` — init + first unseal (idempotent, fail-closed)
  - unsealer.yaml # `agentforge openbao-unseal --loop` Deployment + egress CiliumNetworkPolicy
  - provision-job.yaml # `agentforge openbao-provision` — af mount + k8s auth + policies + scoped token
  # THREE independent seeders below, and they do NOT share a precedence — check which one owns a path
  # before reasoning about it. Canonical: docs/runbooks/openbao-recovery.md § "The seed-ownership
  # contract". operator-seeds = create-if-absent (bootstrap floor, live vault wins, drift reported);
  # devworker-seeds + estate-seeds = `bao kv patch` seed-wins (seed overwrites live KV daily).
  - operator-seeds.sops.yaml # SOPS seed values (dispatcher PAT + reaper DSN) mounted into provision-job — FLOOR, create-if-absent
  - capability-kids-configmap.yaml # OPERATOR-owned capability-kid policy (mounted by provisioner-deploy); CP-unwritable
  - provisioner-deploy.yaml # `agentforge provisioner` controller Deployment + egress CiliumNetworkPolicy
  - provisioner-podmonitor.yaml # kube-prometheus scrape of af_provisioner_* on :9465 (ailab#293) — object lives in ns `monitoring`, target is the Deployment above
  - openbao-lan.yaml # LAN NodePort :30820 for the dev-worker bao agents (ADR 0020)
  - devworker-seeds.sops.yaml # SOPS seed values for af/dev-workers/* (seed-wins contract)
  - devworker-provision-job.yaml # approle + per-worker policies/roles + KV seed (breakglass-auth)
  # SYNC-OWNED fields, and a FOURTH precedence alongside the three seeders above: af/dev-workers/
  # <host>.{tep,helmtest}_kubeconfig are written by this CronJob and deliberately NOT seeded — a seed
  # copy would fight the sync and revert to a stale bearer token. They are cluster-derived, so a wipe
  # loses them until the next successful sync rather than until an operator acts. Recovery ordering:
  # docs/runbooks/openbao-recovery.md § the *sync-owned* path class.
  - k8stoken-sync.yaml # TokenRequest -> per-worker kubeconfigs in af/dev-workers/* (k8s-auth, ADR 0021)
  - estate-seeds.sops.yaml # SOPS seed values for af/estate/* (proxmox/qnap/cloudflare/... — seed-wins)
  - estate-provision-job.yaml # seeds the af/estate/* operator-credential escrow (breakglass-auth)
  # A FIFTH precedence, and a narrow one: this Job owns policy af-app-dsh OUTRIGHT (bao policy write
  # replaces), but only CREATES af/dsh/credentials and never writes it again -- the contents are
  # operator-owned, because a git seed there would defeat the feature it provisions (ailab #645).
  - dsh-provision-job.yaml # policy af-app-dsh + af/dsh/credentials bootstrap (breakglass-auth)
  # NB: the Stage-1 k8s-auth canary (SecretStore/ExternalSecret) lives in ../openbao-canary/ — a SEPARATE
  # Flux Kustomization dependsOn external-secrets, because ESO CRDs don't exist yet when `openbao` applies
  # (external-secrets dependsOn openbao). Keeping the canary here deadlocked Flux on missing GVKs.
