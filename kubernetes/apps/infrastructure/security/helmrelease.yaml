# Trivy Operator — continuous vulnerability + misconfiguration scanning of cluster workloads. Headless
# (no UI): findings are CRDs (VulnerabilityReport etc.) + Prometheus metrics, surfaced via the Grafana
# dashboard (monitoring/trivy-dashboard.yaml). Especially valuable here — the cluster also runs the
# commercial Strive platform.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: trivy-operator
      version: "0.33.2" # appVersion 0.31.2
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    targetNamespaces: "" # cluster-wide
    excludeNamespaces: "trivy-system,kube-system"
    operator:
      scannerReportTTL: "24h"
      scanJobsConcurrentLimit: 3 # default 10 — throttle so the first sweep doesn't contend with AI/Strive
      scanJobTimeout: 5m
      builtInTrivyServer: true # one cached DB server -> thin scan jobs, no per-job GitHub DB pulls
      vulnerabilityScannerEnabled: true
      configAuditScannerEnabled: true
      rbacAssessmentScannerEnabled: true
      exposedSecretScannerEnabled: true
      # DISABLED: SBOM generation was by far the largest single consumer of etcd on this cluster.
      # Measured 2026-08-30: 706 SBOMReports serialize to 151.6 MiB, against 4.1 MiB for all 195
      # VulnerabilityReports, 1.0 MiB of ConfigAuditReports and 0.6 MiB of ExposedSecretReports — i.e.
      # ~96% of all aquasecurity CR bytes — while etcd's entire live (in-use) keyspace is only ~221 MB.
      # Nothing in this cluster reads them: SBOMReports export no Prometheus metric, and the Grafana
      # dashboard (monitoring/trivy-dashboard.yaml) plots only trivy_image_vulnerabilities,
      # trivy_image_exposedsecrets, trivy_resource_configaudits and the two rbacassessment series.
      # They are also effectively immortal, so this flag — not the TTL — is the only lever that bounds
      # them: scannerReportTTL above stamps VulnerabilityReports with report-ttl=24h (none observed
      # older than 23h), but SBOMReports are stamped report-ttl=0s or left unannotated entirely, and
      # accumulate from install day onward — the oldest here dated 2026-06-18, 72 days. Do NOT try to
      # fix this by shortening scannerReportTTL: it does not apply to SBOMReports at all, and a shorter
      # TTL only forces more rescans (already ~67 scan Jobs/53min), adding etcd *write* churn.
      # Cost of turning this off: ClusterVulnerabilityReports stop being refreshed (the chart notes SBOM
      # generation is required for them). Acceptable — the cluster's only one is a stale 2026-07-06
      # snapshot whose summary is all zeroes, and no dashboard or alert consumes it.
      sbomGenerationEnabled: false
      # DISABLED: the infra-assessment node-collector needs hostPID + host hostPath mounts, but the
      # trivy-system namespace enforces PodSecurity `baseline` (deliberately, so the ordinary scan jobs
      # are admitted). So every node-collector pod was rejected (`violates PodSecurity baseline`), the
      # Job retried until DeadlineExceeded, and it became the single largest source of Warning events
      # cluster-wide — while the infra/CIS report stayed perpetually empty. Vulnerability, config-audit,
      # rbac, and exposed-secret scanning (the primary value) all work fine under baseline and stay on.
      # To re-enable infra-assessment, the namespace PSA must be raised to `privileged` (namespace.yaml).
      infraAssessmentScannerEnabled: false
      clusterComplianceEnabled: false # NSA/CIS compliance reports off (heavy, not needed)
      metricsFindingsEnabled: true
      metricsVulnIdEnabled: false # per-CVE-id labels = Prometheus cardinality bomb
    trivy:
      ignoreUnfixed: true # only actionable (fixable) CVEs
      severity: "HIGH,CRITICAL"
      # builtInTrivyServer's DB-cache PVC must be on a class that honors fsGroup — the default nfs-csi
      # ignores it (NFS server owns the files), so uid 65534 hits "mkdir .cache/trivy: permission denied".
      storageClassName: qnap-iscsi
      resources:
        requests: { cpu: 100m, memory: 100M }
        limits: { cpu: 500m, memory: 500M }
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack # the stack's ServiceMonitor selector
    service:
      headless: false # default true -> clusterIP None -> dead Homepage siteMonitor dot
