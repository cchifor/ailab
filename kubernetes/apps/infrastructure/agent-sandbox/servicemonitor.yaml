# Scrape the agent-sandbox controller's :8080 metrics (Service "agent-sandbox-controller",
# port "metrics" — in the vendored manifest). `release: kube-prometheus-stack` so the operator's
# serviceMonitorSelector picks it up. Gives the claim/adoption latency + reconcile series the
# upstream perf docs describe; the testpool alerts (monitoring/testpool-rules.yaml) intentionally
# use only kube-state-metrics so they cannot go blind if this scrape breaks.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: agent-sandbox-controller
  endpoints:
    - port: metrics
      interval: 30s
