# PodMonitor for the OPERATOR-MANAGED orchestrator worker (worker-deployment.yaml) — ONE HALF of the
# R8 fleet coverage, and only that half. Read the COVERAGE BOUNDARY below before assuming the forge_*
# series cover the fleet. The other half is every CP-RENDERED tenant pool, and as of 2026-08-20 it is
# covered by a SECOND monitor that the CP renders into each pool's own tenant namespace — on the
# precondition stated below, and NOT by widening this one. That settles ailab#284; the boundary says
# which monitor owns what, on what precondition, and what still has no owner at all.
#
# `agentforge serve` exports the dedicated forge_* registry (forge_claims_total,
# forge_transitions_total, forge_llm_runs_total, forge_run_duration_seconds, …) via
# start_http_server on metrics_port 9464 (agentforge main.py `serve` + infra/settings.py default
# metrics_port: int = 9464), the Deployment declares the named `metrics` containerPort, and
# cilium-egress.yaml ALREADY admits ingress 9464 from the monitoring namespace — but nothing
# SELECTED the pods, so the series never reached Prometheus. That gap is structural, not a
# misconfiguration: before this file the estate held three PodMonitors (monitoring/flux-controllers,
# databases/infra-pg-metrics, strive-ailab/strive-pg) and one forge_* ServiceMonitor
# (monitoring/agentforge-dispatcher, namespaceSelector agentforge) — none selected any pod in an
# af-tenant-* namespace.
#
# A PodMonitor, NOT a ServiceMonitor: the worker has NO metrics Service. (Since the webhook
# fast-path it DOES have a Service — worker-webhook-service.yaml — but that fronts the 8700 webhook
# receiver only and deliberately lists no 9464 port, so there is still nothing here for a
# ServiceMonitor to select), and the estate already scrapes serviceless ports this way. The shape mirrors the sibling dispatcher-servicemonitor.yaml: it lives
# in `monitoring`, carries `release: kube-prometheus-stack` (the label the kube-prometheus
# Prometheus selects monitors by; podMonitorNamespaceSelector is {} and neither
# enforcedNamespaceLabel nor ignoreNamespaceSelectors is set, so a monitor in `monitoring` may
# name any target namespace), targets the NAMED port, scrapes at 30s, and pins job=. The selector
# keys on the worker's OPERATOR-ONLY labels — the same pair cilium-egress.yaml's endpointSelector
# uses. Scale-to-zero (KEDA) simply drops the target while idle — that is absence of a pod, not a
# scrape failure.
#
# -- COVERAGE BOUNDARY --------------------------------------------------------------------------
#
# ⚠️ READ THIS FIRST — HOW THIS BLOCK ROTS. Everything below about the CP-rendered pool describes
#   ANOTHER REPO'S OUTPUT (agentforge-platform's gitops renderer, materialised in the
#   cchifor/agentforge-tenants repo). That repo ships on its own schedule and NOTHING HERE FAILS
#   WHEN IT MOVES: no test, no CI check, and no alert covers any claim in this block. It has
#   already rotted once — the 2026-07-30 revision of this header listed THREE blockers, and by
#   2026-08-10 two of them were false because the CP had shipped the very change the header
#   described as "NOT made here". That stale text then propagated a wrong premise into downstream
#   work twice in one cycle, which is what ailab#284 was filed about. This 2026-08-20 revision
#   settles ailab#284 rather than restating it as open, and so carries its own rot risk in the
#   OPPOSITE direction: it describes an object that exists per pool only under the PRECONDITION
#   spelled out below, so check that precondition before reading the object's absence as a fault.
#   Treat every dated claim here as a SNAPSHOT and re-measure. The measurement commands are given
#   inline precisely so the next reader can re-derive rather than trust.
#
# THIS MONITOR COVERS (measured 2026-08-10): pods labelled app.kubernetes.io/name=agentforge-worker +
#   app.kubernetes.io/managed-by=agentforge-operator in the namespaces under matchNames.
#   Live: af-orch-playground-planner-* in af-tenant-tenant-zero-playground carries exactly that
#   pair and declares {name: metrics, containerPort: 9464}; both pods are scraped, health=up, and
#   their series land under job=agentforge-worker. Another OPERATOR-rendered worker in a new
#   namespace is covered by extending matchNames.
#
# THE CP-RENDERED POOLS ARE COVERED BY A DIFFERENT MONITOR — ailab#284 is SETTLED, and it settled
#   on the CP side moving. The control plane renders its OWN PodMonitor per pool, into that pool's
#   own tenant namespace, keyed on its own labels (agentforge-platform adapters/gitops/renderer.py
#   `_podmonitor`, committed as tenants/<org>/<workspace>/55-podmonitor.yaml):
#
#     name       the pool's Deployment name, e.g. af-orch-platform-dev-delivery
#     namespace  af-tenant-<org>-<workspace>   — NOT `monitoring`, where this file lives
#     selector   app.kubernetes.io/managed-by=agentforge-cp + agentforge.io/{org,workspace,pool}
#     labels     that same CP set, PLUS release: kube-prometheus-stack (the adoption label)
#     endpoint   port `metrics`, interval 30s, relabel job=agentforge-worker — identical to below
#
#   PRECONDITION, and it is the thing to check first when a CP pool looks unscraped: that file is
#   emitted only when AFP_METRICS_PODMONITOR_ENABLED is set on the CP Deployment
#   (apps/apps/agentforge/deployment.yaml) AND the pool has been RE-RENDERED since. Nothing
#   re-renders on a CP restart, a Flux reconcile or a background loop, so a pool provisioned before
#   the flip keeps no monitor until a pool rollout. Confirm per pool, do not infer:
#     kubectl --context admin@ai -n af-tenant-<org>-<workspace> get podmonitor
#
#   THE ESTATE PREREQUISITES ARE BOTH IN THIS REPO. The CP cannot emit the object until
#   apps/apps/agentforge/admission/tenant-guard.yaml admits monitoring.coreos.com/PodMonitor
#   (validation 1) and pins its shape (validation 17), AND
#   apps/agentforge-tenants-bootstrap/reconciler-rbac.yaml grants `podmonitors` to the
#   agentforge-tenants-reconciler ClusterRole. Those two reconcile through DIFFERENT Flux
#   Kustomizations with no dependsOn between them, which is why they land before the flag.
#
#   WHY TWO MONITORS RATHER THAN ONE WIDER SELECTOR — the durable reason, not a preference. The two
#   pod sets share ZERO labels, deliberately: worker-deployment.yaml's header records that the
#   operator worker omits every agentforge.io/* pod label precisely so the CP NetworkPolicy does not
#   select it. So do NOT widen THIS monitor's selector, and do NOT extend its matchNames to the
#   CP-rendered namespaces — it cannot match those pods either way, and a matchNames list covering
#   them would need an edit on every provision, which is exactly the growth problem a per-pool
#   CP-rendered monitor avoids.
#
#   THE TWO HALVES SHARE ONE JOB LABEL ON PURPOSE (both pin job=agentforge-worker) so a fleet query
#   spans them, and no pod is double-scraped only while the label sets stay disjoint. Re-check that
#   disjointness before adding app.kubernetes.io/name to the CP renderer's _labels(), or af-tenant-*
#   to the matchNames below — either one turns one job label into two scrapes of the same pod.
#
# ALSO NOT COVERED — THE REAPER, and it never has been. agentforge-reaper declares NO
#   containerPorts at all, so no monitor can bind a named port and no forge_* series has ever
#   existed for it in any job. UNVERIFIED and load-bearing before anyone "fixes" it: whether the
#   reaper's entrypoint starts the exporter at all (it does not run `agentforge serve`). If it does
#   not, adding a port + monitor yields a permanently-down target, which is a WORSE state than a
#   known absence. Establish that first.
#
# WHY SELECTION IS THE WHOLE GAME, whichever monitor is in question: there are no metricRelabelings
#   and no allowlists anywhere in ailab, so new forge_* series are ingested implicitly ONCE A TARGET
#   IS SELECTED. An unselected pod is therefore never a missing METRIC — it is all 21 forge_* names
#   missing at once, which is what makes the failure look like silence rather than an error.
#   Counters like forge_auto_replans_total are deliberately UNLABELLED so they are observable at
#   zero, which is what makes "the feature is inert" distinguishable from "the metric never
#   shipped"; for an unscraped pod that distinction is unavailable without exec'ing into it. The
#   standing cross-check on all of this is the ForgeOrchestratorUnscraped alert in
#   infrastructure/monitoring/agentforge-coverage-rules.yaml, which reads kube-state-metrics rather
#   than forge_* and so can see a pod no monitor has selected.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: agentforge-worker
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [af-tenant-tenant-zero-playground]
  selector:
    matchLabels:
      app.kubernetes.io/name: agentforge-worker
      app.kubernetes.io/managed-by: agentforge-operator
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: agentforge-worker
