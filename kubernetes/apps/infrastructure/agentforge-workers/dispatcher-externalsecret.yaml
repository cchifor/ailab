# af-dispatcher credentials (plan §1 + webhook fast-path) — BOTH dispatcher secrets: (1) the forge PATs so
# GiteaClient(bot_tokens()) can list open issues for the forge_pending scale oracle, delivered as
# AF_BOT_TOKENS into the `agentforge-dispatcher-forge` Secret; (2) the webhook HMAC secret Gitea signs its
# :8710 deliveries with, delivered as AF_WEBHOOK_SECRET into the `agentforge-dispatcher-webhook` Secret.
# TWO ExternalSecrets on purpose, not two keys in one: the forge Secret's key set is load-bearing (the
# 2026-08-04 crashloop + pin-revert coupling documented on it below), and a separate target lets the
# webhook path sit NotReady until its KV data is minted without ever touching the forge sync. The
# Deployment consumes both via envFrom (the webhook ref optional — see its comment there).
#
# ESO-synced (READ-ONLY to the dispatcher) from a DISTINCT operator OpenBao subtree
# `af/data/operator/dispatcher/*` behind an operator-owned SecretStore/role (`af-operator-dispatcher`)
# that NO tenant/broker/reaper role can read. This carries forge PATs + the webhook HMAC ONLY — by
# construction it can never hold AF_CAPABILITY_* signing material, sandbox, or broker creds (a disjoint
# operator KV subtree). NOTE the deliberate NON-choice: the WORKER's copy of the webhook secret belongs in
# the tenant orchestrator subtree `af/data/tenants/tenant-zero/playground/orchestrator` (its ESO
# dataFrom.extract's the WHOLE subtree, so it surfaces there with NO manifest change) — the dispatcher
# CANNOT read that path (disjoint roles is the whole point), hence the operator-subtree copy here. Mirrors
# the reaper-ledger.yaml operator-ESO pattern (dedicated eso-auth SA + namespaced vault SecretStore).
#
# ⚠ ACTIVATION: the operator provisions the OpenBao role `af-operator-dispatcher` (bound to ns agentforge +
# SA af-dispatcher-eso) + the KV data at `af/data/operator/dispatcher/forge` (key AF_BOT_TOKENS = the
# canonical JSON map over every principal in bootstrap.BOTS) and, for the webhook fast-path, at
# `af/data/operator/dispatcher/webhook` (key AF_WEBHOOK_SECRET — the SAME value minted into the Gitea
# webhook config and the tenant orchestrator subtree). NotReady until then (harmless: the webhook envFrom
# is optional + the Flux Kustomization is wait:false).
#
# The map is written by `agentforge.bootstrap --write-openbao` (tenant paths) or, for THIS operator path,
# by the operator directly. Every run of that command ROTATES all five PATs, so the value here is
# authoritative only until the next mint — see bootstrap.NO_SEEDS_OUT_WARNING before re-running it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: af-dispatcher-eso
  namespace: agentforge
  labels:
    app.kubernetes.io/name: agentforge-dispatcher
    app.kubernetes.io/component: eso-auth
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
# ESO mints a short-TTL token for this SA (TokenRequest); no pod runs as it, so keep its token unmounted.
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: agentforge-dispatcher-store
  namespace: agentforge
  labels:
    app.kubernetes.io/name: agentforge-dispatcher
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
spec:
  provider:
    vault:
      server: "https://openbao.openbao.svc:8200"
      path: "af"        # KV v2 mount
      version: "v2"
      # caProvider sweep (plan §B): verify OpenBao's cert-manager TLS cert (openbao-tls, ailab-ca). NOTE: a
      # NAMESPACED SecretStore resolves caProvider IN ITS OWN namespace (agentforge) — ESO ignores a cross-ns
      # `namespace:` — so Secret `openbao-tls` (ca.crt) MUST be present in THIS namespace (per-ns cert-manager
      # Certificate or trust-manager). Until then NotReady (harmless: dispatcher gated + wait:false).
      caProvider:
        type: Secret
        name: openbao-tls
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "af-operator-dispatcher"   # operator-fixed; disjoint from the broker + tenant + reaper roles
          serviceAccountRef:
            name: af-dispatcher-eso
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentforge-dispatcher-forge
  namespace: agentforge
  labels:
    app.kubernetes.io/name: agentforge-dispatcher
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: agentforge-dispatcher-store
    kind: SecretStore
  target:
    name: agentforge-dispatcher-forge
    creationPolicy: Owner
  data:
    # ONE key. The legacy AF_BOT_TOKEN_PLANNER mapping that stood beside it (#226) was projected ON
    # PURPOSE and had to OUTLIVE the cutover merge: it is the pin-REVERT bridge. A v2 image reads
    # only AF_BOT_TOKEN_PLANNER and ignores the map; a v3 image reads only AF_BOT_TOKENS (v3 dropped
    # the AF_BOT_TOKEN_* vars OUTRIGHT — no compat shim — and refuses to start when the map is
    # empty/missing/malformed). Projecting both made the SAME Secret satisfy either image, so the
    # image could be flipped — or flipped BACK — as a pure pin change. It comes off only once the
    # soak has retired "revert to v2" as an option, which is what this commit asserts.
    #
    # ⚠️ REVERTING THE PIN NOW COSTS A CREDENTIAL STEP AGAIN. Restoring a v2 worker/dispatcher digest
    # REQUIRES restoring the AF_BOT_TOKEN_PLANNER mapping here in the SAME change, or the reverted
    # image lands on a Secret that no longer carries the only key it reads. The vault side is intact
    # — `_apply_operator_seeds` merge-writes add-only, so the legacy key was never deleted from
    # `operator/dispatcher/forge` — but ESO will not project a key this file does not map.
    #
    # That ordering coupling is not hypothetical in either direction: it cost two fleet outages on
    # 2026-08-04. A pin landing ahead of the credential left the dispatcher exiting 1 on every start
    # ("AF_BOT_TOKENS must carry at least one bot PAT"), because the image had moved and this file
    # had not.
    #
    # NO capability/sandbox/broker keys — by construction, this is a disjoint operator KV subtree.
    #
    # v3: the canonical JSON object {"bot-username": "PAT"} (sorted keys, no whitespace) exactly as
    # Settings.bot_tokens parses it, covering every principal in bootstrap.BOTS.
    - secretKey: AF_BOT_TOKENS
      remoteRef:
        key: operator/dispatcher/forge
        property: AF_BOT_TOKENS
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentforge-dispatcher-webhook
  namespace: agentforge
  labels:
    app.kubernetes.io/name: agentforge-dispatcher
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: agentforge-dispatcher-store
    kind: SecretStore
  target:
    name: agentforge-dispatcher-webhook
    creationPolicy: Owner
  data:
    # The HMAC secret Gitea signs webhook deliveries with and the :8710 listener verifies. A SIBLING KV
    # doc `operator/dispatcher/webhook`, NOT another property on operator/dispatcher/forge: the forge
    # doc's key set is coupled to the pin-revert bridge history above, and the same af-operator-dispatcher
    # role covers the whole operator/dispatcher/* subtree either way. The KV key name IS the env var name
    # (the estate-wide ESO convention), so envFrom injects it with no mapping.
    #
    # AF_WEBHOOK_SECRET_PREVIOUS (the engine's rotation overlap: old signatures verify while Gitea configs
    # roll to the new value) is DELIBERATELY NOT mapped here in steady state — ESO fails the WHOLE sync on
    # a missing remote property, so a permanent mapping would hold this ExternalSecret NotReady whenever no
    # rotation is in flight. Rotation window procedure: write webhook_secret_previous (= the outgoing
    # value) next to AF_WEBHOOK_SECRET in the KV doc, add the mapping here, rotate every Gitea webhook
    # config, then remove both again.
    - secretKey: AF_WEBHOOK_SECRET
      remoteRef:
        key: operator/dispatcher/webhook
        property: AF_WEBHOOK_SECRET
