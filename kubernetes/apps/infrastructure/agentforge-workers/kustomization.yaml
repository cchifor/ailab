apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# AgentForge v2 P2 R-3 — worker autoscaling: the always-on af-dispatcher scale ORACLE + KEDA scale-to-zero
# over the SINGLE existing tenant-zero orchestrator identity. Its OWN directory + a dedicated Flux
# Kustomization (clusters/ai/agentforge-workers.yaml), mirroring the agentforge-broker/-sandbox precedent:
# self-contained so it never collides with the P1 agentforge admission (apps layer) or the concurrent P2
# operators editing infrastructure/{security,autoscaling}. NO shared aggregator index is edited.
#
# BOTH Deployments are DELIBERATELY UNLISTED/gated (placeholder @sha256 images, unpullable) — mirrors the
# reaper/broker precedent. Nothing here flips privilege_hardening. Re-add each Deployment once its digest
# is pinned + its prerequisites provisioned (see each Deployment header).
resources:
  # -- af-dispatcher (scale oracle) — trusted agentforge ns --------------------------------------------
  - dispatcher-serviceaccount.yaml # runtime SA (automount off, NO Role) — zero kube-apiserver access
  - dispatcher-externalsecret.yaml # eso-auth SA + operator SecretStore + READ-ONLY forge-PAT ExternalSecret
  - dispatcher-service.yaml        # ClusterIP over the metrics port (named)
  - dispatcher-servicemonitor.yaml # kube-prometheus scrape of forge_pending (mirrors monitoring/agentforge.yaml)
  - dispatcher-netpol.yaml         # ingress: metrics from monitoring; egress: in-cluster Gitea + DNS only
  # -- tenant-zero worker (scale target) — af-tenant-tenant-zero-playground ns -------------------------
  - worker-openbao-ca-cert.yaml    # per-ns openbao-tls (ailab-ca) so the namespaced SecretStore caProvider resolves
  - worker-secretstore.yaml        # eso-auth SA (af-eso-playground) + namespaced OpenBao SecretStore (per-tenant role)
  - worker-externalsecret.yaml     # materializes af-creds-playground-planner from tenants/tenant-zero/playground/orchestrator
  - worker-serviceaccount.yaml     # the orchestrator SA the worker runs as (was assumed-existing but never rendered → pod never created)
  - worker-staging-pvc.yaml        # tenant-ns staging PVC bound to the operator NFS PV (was omitted → pod FailedScheduling)
  - worker-webhook-service.yaml    # ClusterIP over the worker's webhook receiver (8700) — the dispatcher's fan-out target
  - scaledobject.yaml              # KEDA scale-to-zero (prometheus backlog + cron warm-floor) over the worker
  - cilium-egress.yaml             # worker egress: Gitea + kube-apiserver:6443 + DNS ONLY (deny world/metadata/IPv6)
  - worker-podmonitor.yaml         # kube-prometheus scrape of the worker's forge_* registry (R8; no Service → PodMonitor).
  # -- af-conductor (fleet-wide observer) — ARMED 2026-09-13 (PR-7b), tier=observe -----------------
  # Listed together, in dependency order, once the three arming prerequisites were met: the
  # conductor-bot forge principal is a collaborator on the filing repo; its PAT is seeded at
  # af/data/operator/conductor/forge (#705) and read by the ExternalSecret below; and the
  # Deployment's env carries every knob main::_require_conduct_wiring refuses (#695). The PodMonitor
  # is listed WITH the workload rather than with the rules, for the reason the unlisted-era comment
  # gave: a monitor pointed at a pod it cannot reach is a permanently-down target, which this repo
  # has twice written up as worse than a known absence.
  #
  # T0 is WRITE-FREE by construction: AF_CONDUCT_TIER=observe makes the write door refuse every
  # proposal on tier before any forge call, and monitoring/agentforge-conductor-rules.yaml carries
  # ForgeConductUnexpectedWrites for the day that stops being true. The exit criteria for leaving T0
  # are in plans/2026-09-06-conductor-program-plan.md (agentforge repo), "Rollout tiers".
  #
  # Before this listing the five files were UNVALIDATED (kustomize build renders only what this list
  # names). They were rendered through a scratch kustomization and pass kubeconform -strict
  # (7 resources, 0 invalid) — recorded in the PR that armed them, so the first CI parse is not the
  # first parse.
  - conductor-serviceaccount.yaml  # the eso SA the SecretStore authenticates as (no automount for the pod)
  - conductor-externalsecret.yaml  # SecretStore + ES: operator/conductor/forge -> AF_BOT_TOKENS (REQUIRED by the pod)
  - conductor-netpol.yaml          # egress: DNS, gitea:3000, prometheus:9090, CP:8080; ingress: monitoring -> :9464
  - conductor-deployment.yaml      # replicas 1, Recreate, observe tier; refuses to start on a missing knob
  - conductor-podmonitor.yaml      # kube-prometheus scrape of forge_conduct_* on :9464 (its OWN registry)
                                   # OPERATOR-managed pods ONLY — CP-rendered tenant pools stay unscraped until the CP
                                   # renderer emits a 9464 port + a monitoring ingress rule (see the file's COVERAGE BOUNDARY).
  # BOTH Deployments ARE listed and live (the gating described below was lifted when their
  # digests were pinned; the comment outlived it and is corrected here 2026-08-15 — it read
  # as "intentionally not listed" directly above the two lines listing them, which is how a
  # reader concludes this pool is dormant when it is running).
  #
  # NOTE FOR THE RESIZE PROGRAM: worker-deployment.yaml means af-orch-playground-planner is
  # an ESTATE-MANAGED pool, not a control-plane-rendered one — it carries no
  # `agentforge.io/pool` label and the CP cannot resize it. Its ScaledObject therefore stays
  # (it conflicts with nothing) and the paused-replicas annotation remains engine#186's to
  # remove. See docs/runbooks/agentforge.md "Resizing a tenant worker pool" for how to tell
  # the two kinds apart.
  - dispatcher-deployment.yaml
  - worker-deployment.yaml
