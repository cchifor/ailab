apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# AgentForge operator-managed workloads, with their own Flux Kustomization (clusters/ai/agentforge-workers.yaml).
#
# 2026-10-30: the tenant-zero PLAYGROUND was retired (plans/2026-10-30-retire-playground-plan.md). This
# directory used to hold its worker (af-orch-playground-planner + its ScaledObject, ESO stack, staging PVC,
# egress CNP and PodMonitor) and the af-dispatcher scale oracle, whose only consumer was that ScaledObject.
# Both are deleted; git history has them. The CP-rendered platform-dev pool lives in cchifor/agentforge-tenants
# and was never in this directory.
#
# What remains is the af-conductor, PARKED: its tenant config (cchifor/agentforge-config) binds only the
# retired playground repo, so it is held unlisted until an agentforge change lets it observe a CP-only
# estate (re-arming is a tracked follow-up). Its five files stay in place; only the two inert ones are
# listed, which also keeps this Flux unit non-empty (an empty path is a known Flux trap). To RE-ARM, list
# the three below again, in the order given, after the prerequisites in conductor-deployment.yaml's header:
#   - conductor-externalsecret.yaml  # SecretStore + ES: operator/conductor/forge -> AF_BOT_TOKENS (REQUIRED by the pod)
#   - conductor-deployment.yaml      # replicas 1 when armed, Recreate, observe tier
#   - conductor-podmonitor.yaml      # kube-prometheus scrape of forge_conduct_* on :9464 (its OWN registry)
# ⚠ UNLISTED MEANS UNVALIDATED: `kustomize build` renders only what is listed, so CI does not parse those
# three files while they are parked. Validate them through a scratch kustomization before re-listing.
resources:
  - conductor-serviceaccount.yaml  # the eso SA the SecretStore authenticates as (no automount for the pod)
  - conductor-netpol.yaml          # egress: DNS, gitea:3000, prometheus:9090, CP:8080; ingress: monitoring -> :9464
