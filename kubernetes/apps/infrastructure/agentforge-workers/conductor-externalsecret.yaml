# The conductor's credential surface: an ESO auth identity, a namespaced SecretStore over the operator
# KV subtree, and ONE ExternalSecret carrying the conductor-bot PAT.
#
# The subtree is `operator/conductor/*`, minted by the root-token openbao-provision Job from
# provisioner/bootstrap.py::DEFAULT_OPERATOR_ROLES — which already carries
# OperatorRole("af-operator-conductor", "af-conductor-eso", "agentforge", "operator/conductor"), and the
# provisioner image this cluster pins is a descendant of the commit that added it.
#
# ── BOTH PREREQUISITES ARE SATISFIED AS OF 2026-09-13; this ExternalSecret resolves when applied. ──
#   * ROLE + POLICY: `auth/kubernetes/role/af-operator-conductor` is live, bound to SA `af-conductor-eso`
#     in ns `agentforge`, carrying policy `af-operator-conductor` = read on `af/{data,metadata}/operator/
#     conductor/*`. Verified against the running vault, not inferred from the image.
#   * VALUE: `af/data/operator/conductor/forge` holds `AF_BOT_TOKENS` = {"conductor-bot": "<PAT>"}, and
#     the identical bytes are committed to operator-seeds.sops.yaml. Seeds are CREATE-IF-ABSENT with
#     live-wins, so a matching seed is a DR floor that reports no drift — see
#     docs/runbooks/openbao-recovery.md, "The seed-ownership contract".
#
# The forge principal behind that PAT (Gitea `conductor-bot`, a RESTRICTED account — it can see only
# what it is granted, like agentforge-cp-bot and dsh):
#   PAT scopes  write:issue, read:repository, read:user, read:package  — and deliberately NOT
#               write:repository, which is what stops a coarse `write` collaborator grant from meaning
#               push, merge, or branch creation. It can only move issues.
#   cchifor/ailab               write  filing repo (AF_CONDUCT_FILING_REPOS + AF_CONDUCT_ESTATE_REPO)
#                                      AND a GitOps blob source (AF_CONDUCT_AILAB_REPO). Gitea has no
#                                      issues-only tier, hence `write` + the narrowed PAT above.
#   cchifor/agentforge-tenants  read   GitOps blob source (AF_CONDUCT_TENANTS_REPO).
#   cchifor/agentforge-config   read   the TENANT CONFIG source. AF_CONFIG_SOURCE=gitea with
#                                      AF_CONFIG_REPO left at its default resolves here, the repo is
#                                      PRIVATE, and a restricted account with no grant on it cannot
#                                      read it — so omitting this grant is a startup failure that
#                                      names the config loader, not the identity. It is absent from
#                                      the program plan's prerequisite list; it is not optional.
# Rotation: mint a new PAT for `conductor-bot`, write it to the KV path, and re-commit the seed IN THE
# SAME CHANGE — a wipe restores whatever the seed last recorded, so a stale seed restores a revoked PAT.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: af-conductor-eso
  namespace: agentforge
  labels:
    app.kubernetes.io/name: agentforge-conductor
    app.kubernetes.io/component: eso-auth
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
# ESO mints a short-TTL token for this SA (TokenRequest); no pod runs as it, so keep its token unmounted.
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: agentforge-conductor-store
  namespace: agentforge
  labels:
    app.kubernetes.io/name: agentforge-conductor
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
spec:
  provider:
    vault:
      server: "https://openbao.openbao.svc:8200"
      path: "af"        # KV v2 mount
      version: "v2"
      # A NAMESPACED SecretStore resolves caProvider IN ITS OWN namespace — ESO ignores a cross-ns
      # `namespace:` — so Secret `openbao-tls` (ca.crt) must be present in `agentforge`. It already is:
      # the dispatcher's store in this same namespace depends on exactly the same Secret.
      caProvider:
        type: Secret
        name: openbao-tls
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "af-operator-conductor"   # operator-fixed; disjoint from dispatcher/broker/reaper/tenant
          serviceAccountRef:
            name: af-conductor-eso
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentforge-conductor-forge
  namespace: agentforge
  labels:
    app.kubernetes.io/name: agentforge-conductor
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: agentforge-conductor-store
    kind: SecretStore
  target:
    name: agentforge-conductor-forge
    creationPolicy: Owner
  data:
    # ONE key, and deliberately no more. The conductor writes as ONE principal — conductor-bot — which
    # is the whole point of the identity: it is kept OUT of the tenant config's `bots` map, so the
    # engine's ledger never folds a conductor comment into an issue's budget and a conductor marker can
    # never become a corrupt claim head. AF_BOT_TOKENS is the v3 map Settings.bot_tokens parses, so the
    # one entry is {"conductor-bot": "<PAT>"}.
    #
    # NO webhook key: the conductor serves no receiver. Its :8720 listener is /healthz + /readyz only,
    # and main::conduct() deliberately does not run the webhook preflight check, because PASSING the
    # secrets is what tells that check a process serves a receiver at all.
    #
    # NO control-plane bearer YET. PR-14 adds one as an `optional: true` entry — optional because a
    # REQUIRED ref on an unprovisioned Secret blocks pod CREATION, which is the failure mode the
    # dispatcher's webhook ExternalSecret documents from experience.
    - secretKey: AF_BOT_TOKENS
      remoteRef:
        key: operator/conductor/forge
        property: AF_BOT_TOKENS
