# The conductor's credential surface: an ESO auth identity, a namespaced SecretStore over the operator
# KV subtree, and ONE ExternalSecret carrying the conductor-bot PAT.
#
# The subtree is `operator/conductor/*`, minted by the root-token openbao-provision Job from
# provisioner/bootstrap.py::DEFAULT_OPERATOR_ROLES — which already carries
# OperatorRole("af-operator-conductor", "af-conductor-eso", "agentforge", "operator/conductor"), and the
# provisioner image this cluster pins is a descendant of the commit that added it. So the ROLE appears on
# the next daily run; the VALUE at operator/conductor/forge comes from the SOPS operator-seeds document
# and is a human act (see the program plan's prerequisites for PR-7b). Until both land this
# ExternalSecret is NotReady, which is harmless while the Deployment stays unlisted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: af-conductor-eso
  namespace: agentforge
  labels:
    app.kubernetes.io/name: agentforge-conductor
    app.kubernetes.io/component: eso-auth
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
# ESO mints a short-TTL token for this SA (TokenRequest); no pod runs as it, so keep its token unmounted.
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: agentforge-conductor-store
  namespace: agentforge
  labels:
    app.kubernetes.io/name: agentforge-conductor
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
spec:
  provider:
    vault:
      server: "https://openbao.openbao.svc:8200"
      path: "af"        # KV v2 mount
      version: "v2"
      # A NAMESPACED SecretStore resolves caProvider IN ITS OWN namespace — ESO ignores a cross-ns
      # `namespace:` — so Secret `openbao-tls` (ca.crt) must be present in `agentforge`. It already is:
      # the dispatcher's store in this same namespace depends on exactly the same Secret.
      caProvider:
        type: Secret
        name: openbao-tls
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "af-operator-conductor"   # operator-fixed; disjoint from dispatcher/broker/reaper/tenant
          serviceAccountRef:
            name: af-conductor-eso
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentforge-conductor-forge
  namespace: agentforge
  labels:
    app.kubernetes.io/name: agentforge-conductor
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: agentforge-conductor-store
    kind: SecretStore
  target:
    name: agentforge-conductor-forge
    creationPolicy: Owner
  data:
    # ONE key, and deliberately no more. The conductor writes as ONE principal — conductor-bot — which
    # is the whole point of the identity: it is kept OUT of the tenant config's `bots` map, so the
    # engine's ledger never folds a conductor comment into an issue's budget and a conductor marker can
    # never become a corrupt claim head. AF_BOT_TOKENS is the v3 map Settings.bot_tokens parses, so the
    # one entry is {"conductor-bot": "<PAT>"}.
    #
    # NO webhook key: the conductor serves no receiver. Its :8720 listener is /healthz + /readyz only,
    # and main::conduct() deliberately does not run the webhook preflight check, because PASSING the
    # secrets is what tells that check a process serves a receiver at all.
    #
    # NO control-plane bearer YET. PR-14 adds one as an `optional: true` entry — optional because a
    # REQUIRED ref on an unprovisioned Secret blocks pod CREATION, which is the failure mode the
    # dispatcher's webhook ExternalSecret documents from experience.
    - secretKey: AF_BOT_TOKENS
      remoteRef:
        key: operator/conductor/forge
        property: AF_BOT_TOKENS
