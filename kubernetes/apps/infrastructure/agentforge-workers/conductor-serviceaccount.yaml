# The conductor's runtime ServiceAccount — automount OFF and NO Role bound anywhere, so it has ZERO
# kube-apiserver access. The conductor is a fleet-wide OBSERVER: it reads the forge, classifies parked
# issues and (from a later rung) files findings. It never touches the k8s API, so it is modelled on the
# dispatcher rather than the reaper — the reaper mounts a token and has RBAC precisely because it GCs
# k8s objects, and copying that template here would hand an observer an apiserver identity it has no use
# for. The forge PAT arrives via the ESO-synced Secret (conductor-externalsecret.yaml), not this token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentforge-conductor
  namespace: agentforge
  labels:
    app.kubernetes.io/name: agentforge-conductor
    app.kubernetes.io/component: conductor
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
automountServiceAccountToken: false
