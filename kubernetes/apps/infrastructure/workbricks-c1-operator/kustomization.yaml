apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Operator-owned prerequisites of the Workbricks cell c1 (clusters/ai/workbricks-c1-operator.yaml).
# The request ids are those of the cell's operator-requests.md.
resources:
  - namespaces.yaml # OR-5: three namespaces, Pod Security restricted, prune disabled
  - resource-quotas.yaml # OR-5 compute quotas + the OR-6 priority guard
  - priority-class.yaml # OR-6: workbricks-low (500, never preempts)
  - gatekeeper-auth-delegator.yaml # OR-4: TokenReview for the cell's token issuer
  - gatewayclass.yaml # OR-7: the cell's GatewayClass
  - envoy-gateway-rbac.yaml # OR-7: the controller's cluster-scoped RBAC, narrowed to the cell's class
