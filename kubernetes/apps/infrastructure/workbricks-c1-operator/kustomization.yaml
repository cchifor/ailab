apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Operator-owned prerequisites of the Workbricks cell c1 (clusters/ai/workbricks-c1-operator.yaml).
# The request ids are those of the cell's operator-requests.md. The edge pieces (OR-7: GatewayClass,
# Envoy Gateway's cluster RBAC) are a separate unit, ../workbricks-c1-gateway.
resources:
  - namespaces.yaml # OR-5: three namespaces, Pod Security restricted, prune disabled
  - resource-quotas.yaml # OR-5 compute quotas + the OR-6 priority guard
  - priority-class.yaml # OR-6: workbricks-low (500, never preempts)
  - gatekeeper-auth-delegator.yaml # OR-4: TokenReview for the cell's token issuer
  - reconciler-rbac.yaml # OR-11: the identity the cell's own Flux unit impersonates (3 namespaces only)
  - certificate-issuer-guard.yaml # OR-8/OR-11: Certificates in the cell only from its own issuer
  - cell-admission-guards.yaml # OR-11: gateway attachment, Service exposure, SA-token Secrets, scrape scope, operator-owned objects
# OR-10 delivery: the CA the cell's namespaced External Secrets SecretStores pin to reach OpenBao
# (caProvider: {type: ConfigMap, name: openbao-ca, key: ca.crt}). This is the PUBLIC ailab-root-ca
# certificate, the same bytes as ../platform-access/ailab-root-ca.crt and the workers' copy (the
# manifests workflow `cmp`s all three). A ConfigMap the operator owns, rather than a cert-manager
# Certificate from the ailab-ca ClusterIssuer in the cell's namespaces: that would let the cell's
# deployer mint certificates from the estate's internal CA. Only the two namespaces with a vault
# role get it; workbricks-c1-sandbox has no vault access. Fixed names (no hash suffix): SecretStores
# reference them by name.
configMapGenerator:
  - name: openbao-ca
    namespace: workbricks-c1
    files:
      - ca.crt=ailab-root-ca.crt
    options:
      disableNameSuffixHash: true
      labels:
        workbricks/cell: c1
        workbricks/operator-owned: "true" # the cell's unit may not change it (cell-admission-guards.yaml)
  - name: openbao-ca
    namespace: workbricks-c1-data
    files:
      - ca.crt=ailab-root-ca.crt
    options:
      disableNameSuffixHash: true
      labels:
        workbricks/cell: c1
        workbricks/operator-owned: "true" # the cell's unit may not change it (cell-admission-guards.yaml)
