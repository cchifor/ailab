# REAPER PV+PVC for tenant-zero/platform-dev: the reaper's view of platform-dev's staging subdir, in the
# reaper's TRUSTED home namespace `agentforge` (#1505, plans/2026-10-31-playground-leftovers-plan.md).
#
# The reaper finds work ONLY by listing the 32-char job dirs under its one mount (agentforge
# adapters/exec/reaper.py run_once -> kube.py list_job_ids), so the subdir it mounts decides which
# workspace is reaped. Until 2026-10-31 it mounted the retired playground's subdir and never reaped
# platform-dev: its 24 job dirs and 7 Leases from 2026-08 were never collected.
#
# SAME per-org/ws export subdir as af-sbx-ws-tenant-zero-platform-dev (sandbox ns) and
# af-sbx-stage-tenant-zero-platform-dev (tenant ns), so <staging_root>/<job-id> here is the exact NFS
# bytes the orchestrator staged and the sandbox mounted. The reaper rmtree's a dir only AFTER winning
# that job's Lease by CAS (an orchestrator holds and renews it from before stage() until cleanup).
#
# ONE reaper reaps ONE workspace subdir. A second workspace needs its own reaper (or a multi-root
# reaper in agentforge); pointing this PV at the parent export instead would let the reaper list every
# org's tree.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: af-sbx-reaper-tenant-zero-platform-dev
  labels:
    velero.io/exclude-from-backup: "true" # raw nfs: PV (no CSI driver) -> Velero skips the data mover and the native-snapshot fallback is a NO-OP, so this was never actually backed up; contents are per-job scratch the reaper reclaims. Explicit beats silent (ADR 0010)
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
    agentforge.io/org: tenant-zero
    agentforge.io/workspace: platform-dev
    agentforge.io/role: sandbox-reaper
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  storageClassName: "" # static bind — do NOT let the nfs-csi default class provision this
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.0 # QuTS hero NFS rejects 4.1; 4.0 is single-port + NAT-friendly (matches storageclass-nfs)
    - hard
    - nconnect=4
  nfs:
    server: 10.55.0.254 # QNAP storage-fabric IP (matches the platform-dev PVs)
    path: /pve-nfs/agentforge-sandbox/tenant-zero/platform-dev # SAME per-org/ws subdir as af-sbx-ws-* + af-sbx-stage-*
  # Pre-bind to exactly this PVC so no other claim can grab the PV (cross-consumer safety).
  claimRef:
    namespace: agentforge
    name: af-sbx-reaper-tenant-zero-platform-dev
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: af-sbx-reaper-tenant-zero-platform-dev
  namespace: agentforge # the reaper's trusted home (NOT agentforge-sandbox)
  labels:
    velero.io/exclude-from-backup: "true" # raw nfs: PV (no CSI driver) -> Velero skips the data mover and the native-snapshot fallback is a NO-OP, so this was never actually backed up; contents are per-job scratch the reaper reclaims. Explicit beats silent (ADR 0010)
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
    agentforge.io/org: tenant-zero
    agentforge.io/workspace: platform-dev
    agentforge.io/role: sandbox-reaper
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: "" # bind to the static PV above, not the dynamic default
  volumeName: af-sbx-reaper-tenant-zero-platform-dev
  resources:
    requests:
      storage: 5Gi
