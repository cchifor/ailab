# Per-WORKSPACE RWX staging volume for the tenant-zero/platform-dev subscription workspace — SANDBOX
# side. Clone of workspace-pvc.yaml (playground) for the CP-created workspace `platform-dev` (pool
# `delivery`). Same per-org/ws NFS backing model (P2 R-2 §C): org+workspace-keyed export subdir
# `10.55.0.254:/pve-nfs/agentforge-sandbox/tenant-zero/platform-dev`, one STATIC PV per consumer, all
# pointing at that SAME server:path — so one tenant orchestrator's PV can never reach another org's tree.
#
# OPERATOR PREREQUISITE (same as playground): `mkdir -m 0777` the per-org/ws export subdir on the NFS
# server BEFORE this binds usefully (uid 65532 sandbox + the orchestrator/reaper uids all read+write;
# also sidesteps the NFS-ignores-fsGroup caveat). See the Phase-2 runbook.
#
#   * PV  af-sbx-ws-tenant-zero-platform-dev (cluster-scoped) — pre-bound (claimRef) to the PVC below.
#   * PVC af-sbx-ws-tenant-zero-platform-dev (agentforge-sandbox ns) — sandbox Jobs mount it at
#     /workspace with subPath <job-id> (sandbox-guard pins subPath == the pod's job-id label).
#
# The sibling PVs af-sbx-stage-tenant-zero-platform-dev (platform-dev-staging-pv.yaml; operator PROVIDES
# the PV, the tenant-ns PVC lives in agentforge-tenant-platform-dev/staging-pvc.yaml) point at the SAME
# per-org/ws export subdir. storageClassName:"" + volumeName bind statically; reclaim Retain.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: af-sbx-ws-tenant-zero-platform-dev
  labels:
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
    agentforge.io/org: tenant-zero
    agentforge.io/workspace: platform-dev
    agentforge.io/role: sandbox-workspace
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  storageClassName: "" # static bind — do NOT let the nfs-csi default class provision this
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.0 # QuTS hero NFS rejects 4.1; 4.0 is single-port + NAT-friendly (matches storageclass-nfs)
    - hard
    - nconnect=4
  nfs:
    server: 10.55.0.254 # QNAP storage-fabric IP (host router + SNAT over Thunderbolt)
    path: /pve-nfs/agentforge-sandbox/tenant-zero/platform-dev # per-org/ws export subdir; same server:path on all consumers
  # Pre-bind to exactly this PVC so no other claim can grab the PV (cross-consumer safety).
  claimRef:
    namespace: agentforge-sandbox
    name: af-sbx-ws-tenant-zero-platform-dev
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: af-sbx-ws-tenant-zero-platform-dev
  namespace: agentforge-sandbox
  labels:
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
    agentforge.io/org: tenant-zero
    agentforge.io/workspace: platform-dev
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: "" # bind to the static PV above, not the dynamic default
  volumeName: af-sbx-ws-tenant-zero-platform-dev
  resources:
    requests:
      storage: 5Gi
