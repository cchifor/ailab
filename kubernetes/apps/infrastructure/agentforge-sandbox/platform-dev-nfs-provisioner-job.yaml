# platform-dev sandbox NFS subdir provisioner — IaC replacement for the MANUAL operator
# `mkdir -m 0777` prerequisite (documented in workspace-pvc.yaml, and in #121's
# platform-dev-workspace-pvc.yaml header: "OPERATOR PREREQUISITE ... `mkdir -m 0777` the per-org/ws
# export subdir on the NFS server BEFORE this binds usefully"). The 100%-IaC mandate replaces that
# hand step with this Flux-reconciled Job.
#
# WHY: the tenant-zero/platform-dev static NFS PVs (ailab #121, branch feat/platform-dev-sandbox-eso:
#   platform-dev-workspace-pvc.yaml + platform-dev-staging-pv.yaml) both bind to the SINGLE per-org/ws
#   export subdir 10.55.0.254:/pve-nfs/agentforge-sandbox/tenant-zero/platform-dev (NOT a staging/
#   workspace pair — all consumers share one subdir, per-job <job-id> dirs are carved under it at
#   runtime by the orchestrator, exactly like playground's tenant-zero/playground). A static NFS PV
#   binds even when its server path is missing, but the first pod to MOUNT it fails with
#   "no such file or directory" until the subdir exists. This Job creates it so #121's PVs mount cleanly.
#
# GROUND TRUTH (stat via the live reaper mount of the playground subdir):
#   /pve-nfs/agentforge-sandbox/tenant-zero/playground -> uid=0 gid=0 mode=0777 (drwxrwxrwx)
#   The manual step created the subdir root:root 0777. mode 0777 (NOT ownership) is what lets uid 65532
#   — the sandbox securityContext runAsUser/runAsGroup (sandbox-guard.yaml validation 3) — AND the
#   orchestrator/reaper uids all read+write, and it sidesteps the NFS-ignores-fsGroup caveat
#   (workspace-pvc.yaml). This Job creates the platform-dev subdir the same way (root:root on a fresh
#   create) and idempotently enforces its existence + mode 0777 on every re-run (ownership of a
#   pre-existing dir is left untouched — 0777 is the load-bearing bit, not ownership).
#
# WHERE / PSA: runs in the `agentforge` namespace (the reaper's trusted home; baseline PSA — already a
#   target of this Kustomization via reaper-*.yaml). It CANNOT live in agentforge-sandbox: restricted
#   PSA forbids inline `nfs:` volumes, and sandbox-guard/sandbox-job-guard reject any non-Kata pod/Job.
#   It mounts the PARENT export via a dedicated static PV+PVC (platform-dev-nfs-provisioner-storage.yaml,
#   so the mount carries mountOptions [nfsvers=4.0, hard, nconnect=4]) and mkdirs the per-org/ws leaf.
#
# ROOT: the parent `tenant-zero` dir is operator-owned (not sandbox-writable), so creating a child
#   under it needs root — the same privilege the manual `mkdir` used. no_root_squash is confirmed (the
#   playground leaf is root:root, i.e. a root-created dir stayed root-owned rather than squashing to
#   nobody). No privilege beyond that: drop ALL caps, no privilege escalation, read-only rootfs.
#
# IDEMPOTENT + SELF-HEALING: `mkdir -p` + `chmod 0777` are safe to re-run. This Kustomization
#   (clusters/ai/agentforge-sandbox.yaml) is wait:false, so this Job never health-gates anything; the
#   completed Job is TTL-reaped and Flux may re-apply it on its interval — harmless, and it re-creates
#   the subdir should the NAS ever lose it.
#
# CONTENT-ADDRESSED NAME (durable against future spec changes): a Job's `spec.template` is IMMUTABLE, so
#   editing this Job in place while a prior (often still-TTL-present) Job exists wedges Flux with
#   "field is immutable". The name therefore carries a 10-hex suffix = sha256(image + "\n---\n" + args
#   shell-script)[:10]. ANY change to the container image or the script changes the suffix → a NEW Job is
#   created and the superseded one is Flux-PRUNED (this Kustomization has prune:true) — never a failed
#   in-place patch. Chosen over Kustomization-wide `spec.force:true` (which would delete+recreate the
#   BOUND Retain PVs this shared Kustomization also owns — reaper/workspace/staging).
#   ⚠ RECOMPUTE the suffix whenever you edit image/args.
#   PRECISE RECIPE (verified against the current suffix; `just af-verify-hashes` checks it in CI-style):
#     body = the args block-scalar text EXACTLY AS IT APPEARS IN THIS FILE (raw, still YAML-indented,
#     only the trailing newline stripped — NOT dedented); then:
#     printf '%s\n---\n%s' "<image>" "$body" | sha256sum | cut -c1-10
#
# CORRECTION (2026-07-28): this header previously claimed a per-object force annotation was "not
#   supported by this Flux". That was WRONG — `kustomize.toolkit.fluxcd.io/force` has shipped since Flux
#   0.39 and this estate runs kustomize-controller v1.8.5. Acting on that stale belief is what left the
#   openbao Jobs unguarded and wedged the openbao -> external-secrets -> workers/ci-runners/tenant chain
#   for hours. The annotation is now set below as a BACKSTOP: the content-addressed name remains the
#   PRIMARY mechanism (deterministic, and verified by `just af-verify-hashes`), but the annotation means
#   a FORGOTTEN suffix recompute degrades to an automatic delete+recreate instead of wedging the whole
#   agentforge-sandbox layer. Belt and braces, and scoped to this object only.
apiVersion: batch/v1
kind: Job
metadata:
  name: af-sbx-provision-tenant-zero-platform-dev-b1ae113c61 # suffix = sha256(image+args)[:10] — recompute on edit (header)
  namespace: agentforge # reaper's trusted home (baseline PSA); NOT agentforge-sandbox (restricted)
  annotations:
    # Backstop for a forgotten suffix recompute (see CONTENT-ADDRESSED NAME in the header): recreate
    # THIS Job on an immutable-field change rather than wedging the agentforge-sandbox Kustomization.
    # Per-object, so the bound Retain PVs this shared Kustomization also owns are never force-replaced.
    # Idempotent by construction (`mkdir -p` + `chmod 0777`), and already re-applied on TTL reap.
    kustomize.toolkit.fluxcd.io/force: "enabled"
  labels:
    app.kubernetes.io/managed-by: agentforge-operator
    app.kubernetes.io/part-of: agentforge
    app.kubernetes.io/component: sandbox-nfs-provisioner
    agentforge.io/org: tenant-zero
    agentforge.io/workspace: platform-dev
    agentforge.io/role: sandbox-provisioner
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600 # auto-clean an hour after completion (mirrors litellm-db-bootstrap)
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: agentforge-operator
        app.kubernetes.io/part-of: agentforge
        app.kubernetes.io/component: sandbox-nfs-provisioner
        agentforge.io/org: tenant-zero
        agentforge.io/workspace: platform-dev
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      automountServiceAccountToken: false # no kube-API access needed
      securityContext:
        # root: the export is no_root_squash and the operator-owned parent dir is not sandbox-writable,
        # so mkdir under it needs root (same as the manual `mkdir`). Baseline PSA permits root.
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: mirror.gcr.io/library/busybox:1.38@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d # estate registry-mirror cache (avoids Docker Hub anon 429); digest-pinned (immutable) per estate convention — tag kept for readability
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              DIR=/export/tenant-zero/platform-dev
              mkdir -p "$DIR"
              chmod 0777 "$DIR"
              stat -c 'provisioned %n uid=%u gid=%g mode=%a' "$DIR"
              echo "platform-dev sandbox NFS subdir ready (idempotent)"
          volumeMounts:
            - name: sandbox-export
              mountPath: /export
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        # Mount the PARENT export via a dedicated static PV+PVC (platform-dev-nfs-provisioner-storage.yaml)
        # rather than an inline `nfs:` volume, so the mount carries mountOptions [nfsvers=4.0, hard,
        # nconnect=4] — an inline nfs volume can't set them, and QuTS hero NFS rejects the kernel-default
        # 4.1 (codex finding, ailab #123). The PVC binds to the parent-export PV; the Job mkdirs
        # tenant-zero/platform-dev under it.
        - name: sandbox-export
          persistentVolumeClaim:
            claimName: af-sbx-provision-tenant-zero-platform-dev
