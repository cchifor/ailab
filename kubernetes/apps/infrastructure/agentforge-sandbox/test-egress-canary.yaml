# AgentForge v2 P2 — the ADR-0018/0019 TEST-TIER ZERO-EGRESS CANARY (companion to egress-canary.yaml).
# Renders a VALID sandbox Job shape (passes agentforge-sandbox-guard + -job-guard byte-for-byte: kata,
# tokenless agentforge-sandbox SA, the EXACT {workspace,home} 2-volume set, digest-pinned image, the pinned
# securityContext, the required Cilium identity labels) but with trust-class=TEST — the tier the repo
# `test_cmd`/`setup_cmd` runs in. It proves the `--network none` equivalent: a test/setup job reaches
# NOTHING — not the broker, not kube-dns, not a world IP, not the metadata service, not OpenBao.
#
# WHY A SEPARATE CANARY: the agent canary (egress-canary.yaml) proves the agent allow-list confines to the
# broker; THIS one proves the test tier gets the sandbox-test-zero-egress CNP (egressDeny toEntities:[all],
# deny-wins-over-allow) on top of the namespace default-deny, so a hostile/prompt-injected test_cmd has no
# exfil channel for any secret it might scrape. It is the fail-closed half of the credential-split boundary.
#
# ⚠⚠ GATED / UNLISTED — DELIBERATELY NOT in kustomization.yaml (mirrors egress-canary.yaml). Run it via
# scripts/verify-sandbox-boundary.sh (which injects a real broker pod IP so even the broker probe is a
# genuine denial, submits it, asserts the matrix, and tears it down) — never against a real tenant.
#
# SEMANTICS: EVERY probe MUST FAIL (zero egress). Any SUCCESS is a BOUNDARY BREACH and the canary exits
# non-zero. Because the test tier has zero egress, even the broker (by pod IP) MUST be unreachable — this is
# the discriminator from the agent tier, where the broker IS reachable.
apiVersion: batch/v1
kind: Job
metadata:
  name: agentforge-sandbox-test-egress-canary
  namespace: agentforge-sandbox
  labels:
    app.kubernetes.io/managed-by: agentforge
    app.kubernetes.io/component: sandbox
    app.kubernetes.io/part-of: agentforge
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 300
  podReplacementPolicy: Failed
  template:
    metadata:
      labels:
        # job-id here is a DOCUMENTED PLACEHOLDER — the harness mints the real 32-hex handle per run.
        agentforge.io/job-id: "testcanary0000000000000000000000"
        agentforge.io/trust-class: test
        agentforge.io/org: tenant-zero
        agentforge.io/workspace: playground
        agentforge.io/pool: planner
        app.kubernetes.io/managed-by: agentforge
        app.kubernetes.io/component: sandbox
    spec:
      restartPolicy: Never
      runtimeClassName: kata
      serviceAccountName: agentforge-sandbox   # the tokenless sandbox SA (no kube-apiserver access)
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: af-sbx-ws-tenant-zero-playground
        - name: home
          emptyDir:
            sizeLimit: 256Mi
      containers:
        - name: sandbox
          # The real sandbox image @sha256 (AF_SANDBOX_IMAGE); the harness re-pins the live digest.
          image: registry.chifor.me/agentforge/sandbox@sha256:1e6040afa51b8d855e0b6a531d2d185918641a19453a49a4fdd70c8263ff650f
          workingDir: /workspace
          env:
            # Plain-value ONLY. The harness injects a ready broker pod IP so the broker probe is a
            # REAL denial (the test tier must not reach even the broker). Empty ⇒ broker probe skipped.
            - name: AF_CANARY_BROKER_IP
              value: ""
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              rc=0
              # -k (insecure): assert NETWORK reachability, not cert trust — a reachable HTTPS target
              # with an untrusted cert must count as a BREACH, not be masked as "blocked" (curl 60).
              deny() { # $1=label $2=curl-target — MUST be unreachable (zero egress)
                if curl -sSk --max-time 5 --connect-timeout 5 -o /dev/null "$2"; then
                  echo "BREACH: reached $1 ($2)"; rc=1
                else
                  echo "ok (blocked): $1 ($2)"
                fi
              }
              deny "world-ip"  "https://1.1.1.1/"
              deny "metadata"  "http://169.254.169.254/latest/meta-data/"
              deny "alt-dns"   "https://example.com/"
              deny "broker-svc" "http://broker-anthropic-max1.agentforge-broker.svc.cluster.local:8700/"
              deny "openbao"   "https://openbao.openbao.svc.cluster.local:8200/v1/sys/health"
              # MANDATORY discriminator from the agent tier: the test tier must PROVE it does NOT reach
              # the broker even by POD IP (the agent tier CAN). This mirrors the agent's mandatory
              # positive control — a missing broker IP means we cannot prove the discriminator, so it is
              # INCONCLUSIVE (rc=1), NEVER a pass. deny() sets rc=1 if the broker IS reachable (BREACH).
              if [ -n "${AF_CANARY_BROKER_IP:-}" ]; then
                deny "broker-ip" "http://${AF_CANARY_BROKER_IP}:8700/"
              else
                echo "INCONCLUSIVE: no AF_CANARY_BROKER_IP — cannot prove the broker is UNREACHABLE (test discriminator)"; rc=1
              fi
              [ "$rc" -eq 0 ] && echo "BOUNDARY OK: test tier has ZERO egress (broker PROVEN unreachable)"
              exit "$rc"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            privileged: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
            readOnlyRootFilesystem: true
            procMount: Default
          volumeMounts:
            - name: workspace
              mountPath: /workspace
              subPath: "testcanary0000000000000000000000"
            - name: home
              mountPath: /home/nonroot
          resources:
            requests: { cpu: 50m, memory: 64Mi, ephemeral-storage: 64Mi }
            limits: { cpu: 500m, memory: 256Mi, ephemeral-storage: 256Mi }
