# OpenBao -> ESO delivery of the independent budget ledger's client files, one SecretStore and one
# ExternalSecret per consumer namespace (docs/runbooks/relay-worker-budget-authority.md, "Credential
# delivery"). Reconciled by clusters/ai/relay-budget-credentials.yaml (wait:false).
#
# THE OWNERSHIP CHAIN, so nothing here is hand-made except the VALUES, which the ceremony owns:
#   af/relay-budget/allocator   field `password`     Relay's relay_budget_allocator login (step 5)
#   af/relay-budget/router      field `password`     Router's relay_budget_router login (step 5)
#   af/relay-budget/ca          field `certificate`  public PEM of the CA that issued the ledger's
#                                                    server certificate (ailab-ca root)
#   af/relay-budget/witness     field `witness`      the external recovery witness JSON (step 6)
#   policies af-app-relay-budget / af-app-router-budget, and the k8s-auth roles of the same names:
#     security/openbao/relay-budget-provision-job.yaml (creates NO document: no git seed, no
#     generated value; every value comes from the operator's ceremony).
#
# NO SECRET MATERIAL IN GIT. The templates fix only the public parts of each DSN (login, the full
# Service hostname the server certificate names, port, database) so a ceremony typo cannot point a
# consumer at another login or host, and no query options exist for TLS to be weakened through.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- relay.yaml
- llm-router.yaml
