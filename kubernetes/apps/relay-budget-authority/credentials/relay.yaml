# Relay's ledger client files (the relay_budget_allocator login), rendered by ESO from OpenBao into
# Secret relay/relay-worker-budget with exactly three keys: `dsn`, `ca.crt`, `witness.json`. The
# shape apps/ai/litellm-chatgpt-eso.yaml and infrastructure/strive-pg-harness/eso.yaml use.
#
# CONSUMED ONLY BY kubernetes/components/relay-worker-budget-client, which mounts each key as a
# read-only subPath file (RELAY_WORKER_BUDGET_{DSN,CA,WITNESS}_FILE). Until a later reviewed PR
# includes that component, this Secret is inert.
#
# BACKUP: the rendered Secret carries velero.io/exclude-from-backup=true. The witness must stay out
# of every application and ledger backup selection, and the Velero daily/weekly schedules select
# the whole relay namespace (runbook, "Credential delivery").
#
# PASSWORD SHAPE: the operator generates 64 lowercase hex characters (`openssl rand -hex 32`), so
# the DSN needs no escaping; `urlquery` below is defence in depth only, the strive-pg-harness rule.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: relay-budget-eso
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay-budget-authority
    app.kubernetes.io/component: credential
automountServiceAccountToken: false # ESO mints its own token; nothing else may use this SA
---
# The CA that signed OpenBao's server certificate, materialised locally so the SecretStore can
# verify TLS: the throwaway-leaf trick every other namespace uses; only the chain is read.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: relay-budget-openbao-ca
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay-budget-authority
spec:
  secretName: relay-budget-openbao-tls
  duration: 8760h
  renewBefore: 720h
  commonName: openbao-ca-ref
  dnsNames: ["openbao-ca-ref.relay.svc"]
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: ailab-ca, kind: ClusterIssuer, group: cert-manager.io }
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: relay-budget-store
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay-budget-authority
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: af
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: af-app-relay-budget
          serviceAccountRef: { name: relay-budget-eso }
      caProvider: { type: Secret, name: relay-budget-openbao-tls, key: ca.crt }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: relay-worker-budget
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay-budget-authority
spec:
  # A changed document reaches the Secret within this interval, but NOT a running Relay: subPath
  # files never update in place, so a new password, CA or witness takes a deliberate rollout.
  refreshInterval: 1h
  secretStoreRef: { name: relay-budget-store, kind: SecretStore }
  target:
    name: relay-worker-budget
    creationPolicy: Owner
    template:
      engineVersion: v2
      # Replace + this exact data map: the Secret holds these three keys and nothing else (the raw
      # `password` never appears as a key of its own).
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/part-of: relay-budget-authority
          velero.io/exclude-from-backup: "true"
      data:
        dsn: "postgresql://relay_budget_allocator:{{ .password | urlquery }}@relay-budget-postgres.relay-budget-authority.svc.cluster.local:5432/relay_budget"
        ca.crt: "{{ .certificate }}"
        witness.json: "{{ .witness }}"
  data:
    - secretKey: password
      remoteRef: { key: relay-budget/allocator, property: password }
    - secretKey: certificate
      remoteRef: { key: relay-budget/ca, property: certificate }
    - secretKey: witness
      remoteRef: { key: relay-budget/witness, property: witness }
