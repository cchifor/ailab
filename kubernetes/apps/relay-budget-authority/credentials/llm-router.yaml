# Router's ledger reader files (the relay_budget_router login), rendered by ESO from OpenBao into
# Secret llm-router/llm-router-worker-budget with exactly three keys: `dsn`, `ca.crt`,
# `witness.json`. Same shape, same rules as relay.yaml beside it; only the login, the OpenBao
# document and the k8s-auth role differ.
#
# CONSUMED ONLY BY kubernetes/components/llm-router-worker-budget-reader, which mounts each key as a
# read-only subPath file (ROUTER_WORKER_BUDGET_{DSN,CA,WITNESS}_FILE). The router's
# `worker-budget-authority` plugin stays DISABLED whatever this Secret holds: it is enabled only
# through the router's authenticated admin API, after the ceremony and qualification.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: router-budget-eso
  namespace: llm-router
  labels:
    app.kubernetes.io/part-of: relay-budget-authority
    app.kubernetes.io/component: credential
automountServiceAccountToken: false # ESO mints its own token; nothing else may use this SA
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: router-budget-openbao-ca
  namespace: llm-router
  labels:
    app.kubernetes.io/part-of: relay-budget-authority
spec:
  secretName: router-budget-openbao-tls
  duration: 8760h
  renewBefore: 720h
  commonName: openbao-ca-ref
  dnsNames: ["openbao-ca-ref.llm-router.svc"]
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: ailab-ca, kind: ClusterIssuer, group: cert-manager.io }
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: router-budget-store
  namespace: llm-router
  labels:
    app.kubernetes.io/part-of: relay-budget-authority
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: af
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: af-app-router-budget
          serviceAccountRef: { name: router-budget-eso }
      caProvider: { type: Secret, name: router-budget-openbao-tls, key: ca.crt }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-router-worker-budget
  namespace: llm-router
  labels:
    app.kubernetes.io/part-of: relay-budget-authority
spec:
  refreshInterval: 1h
  secretStoreRef: { name: router-budget-store, kind: SecretStore }
  target:
    name: llm-router-worker-budget
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/part-of: relay-budget-authority
          velero.io/exclude-from-backup: "true"
      data:
        dsn: "postgresql://relay_budget_router:{{ .password | urlquery }}@relay-budget-postgres.relay-budget-authority.svc.cluster.local:5432/relay_budget"
        ca.crt: "{{ .certificate }}"
        witness.json: "{{ .witness }}"
  data:
    - secretKey: password
      remoteRef: { key: relay-budget/router, property: password }
    - secretKey: certificate
      remoteRef: { key: relay-budget/ca, property: certificate }
    - secretKey: witness
      remoteRef: { key: relay-budget/witness, property: witness }
