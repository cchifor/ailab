# Network block storage (RWO, iSCSI) from the QNAP ZFS pool. nfs-csi stays the RWX default;
# local-path is node-local. Use qnap-iscsi for migratable single-attach block volumes.
#
# DO NOT ADD mountOptions HERE — the QNAP Trident driver silently ignores them.
#
# The LUNs behind this class are THIN zvols (refreservation=none), so allocation only grows unless
# the guest filesystem tells the array which blocks it freed. Nothing does: the 2026-08-16 storage
# audit measured 103.5 GB allocated on the NAS against 55.4 GiB actually in use inside the
# filesystems (~48 GB stale), with the Prometheus LUN at 43.1 G of a 48 G volsize (90%) while its
# ext4 held 17.2 GiB — the source of the recurring "LUN has reached the threshold (90%)" events.
# (Those byte figures are point-in-time from that audit and will drift; the mechanism below is the
# durable part.)
#
# `mountOptions: [discard]` was tried here and REVERTED after measuring what actually happens. The
# Kubernetes half works fine — kubelet faithfully passes the option down:
#     volume_capability:<mount:<fs_type:"ext4" mount_flags:"discard" > >   (NodeStageVolume request)
# but csi.trident.qnap.io drops it. Its NodeStageVolume performs no mount at all (target= empty) and
# the real mount happens during publish, logged as:
#     mount_linux.MountDevice device=/dev/sdf mountpoint=... options=
# — empty. The driver uses its own publish_context "mountOptions", which is "" and has no knob in
# either the StorageClass parameters or the TridentBackendConfig (its qnap_config storage pools
# expose only serviceLevel/labels/features; there is no `defaults` block). Verified live 2026-08-16.
#
# So thin reclaim on this backend cannot be done with mount options at all. The remaining option is
# a periodic `fstrim` against the kubelet mount paths, which needs a PRIVILEGED pod with hostPath —
# a deliberate security-posture decision on a cluster that runs baseline PSA and specifically set
# nodeAgent.disableHostPath on Velero. Left open for the operator; see docs/runbooks/qnap-storage-setup.md.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: qnap-iscsi
provisioner: csi.trident.qnap.io
parameters:
  selector: "performance=performance1"
  fsType: "ext4"
allowVolumeExpansion: true
reclaimPolicy: Retain
