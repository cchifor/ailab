# Self-healing for a CNPG replica whose replication slot was LOST.
#
# WHY THIS EXISTS (ailab#923, 2026-09-28; the same trap on 2026-09-16 and 2026-07-21): when a
# standby falls more than max_slot_wal_keep_size behind, Postgres invalidates its slot
# (pg_replication_slots.wal_status = 'lost', invalidation_reason = 'wal_removed') and discards the
# WAL. From then on the walreceiver reconnects every 5 s and is refused forever. CloudNativePG 1.24
# does NOTHING about it: no re-clone, no condition, no event - the Cluster keeps reporting Ready=True
# and the instance "healthy", because readiness is a pod probe and a standby with no walreceiver
# passes it. There is no WAL archive in this estate, so a lost slot is permanent; the only fix is to
# re-clone that instance (delete its PVCs and pod; CNPG joins a NEW instance number), which is what an
# operator did by hand three times. `kubectl cnpg destroy --keep-pvc` does NOT fix it: it keeps the
# stale data directory (infra-pg.yaml's comment was corrected in the same change).
#
# HOW IT DECIDES (cnpg-lost-slot-reclone.sh, mounted from the ConfigMap kustomize generates from the
# file beside this manifest): every 5 min, ONLY for the clusters in CLUSTERS (infra-pg - the one whose
# topology, storage and recovery were examined), an init container `probe` asks the PRIMARY through the
# cluster's -rw Service, as the LOGIN-only managed role `slotwatch` (no superuser, no pods/exec, no
# pg_monitor - pg_replication_slots is readable by every role), for pg_is_in_recovery() and every
# physical slot's active/wal_status. The main container maps slots to instances from the Cluster's own
# .status.instanceNames + slotPrefix (exact match, not parsing), and acts only when: phase is "Cluster
# in healthy state", the slot is physical, INACTIVE and LOST, the instance is not currentPrimary, its
# pod carries cnpg.io/instanceRole=replica, no ailab.io/reclone-in-progress marker exists and the last
# re-clone (ailab.io/last-reclone) is older than MIN_INTERVAL_SECONDS (a finite budget: <= 4/day).
# It re-reads primary/phase/role immediately before mutating, writes the in-progress marker FIRST, then
# deletes the PVC(s) and the pod and waits (bounded) for both to disappear. One re-clone per execution.
# Later executions only OBSERVE while the marker exists: they clear it (and stamp last-reclone) once the
# replacement is verified - instances complete, old instance gone, no lost slot, every physical slot
# active - and exit 1 (KubeJobFailed pages) if it is still unverified after STUCK_AFTER_SECONDS.
#
# RESIDUAL RACE, stated: CNPG could begin a switchover between the last re-read and the delete; the
# operator has no maintenance lock a job can take. With 2 instances the lost-slot replica is the only
# failover candidate and is weeks stale - promoting it would be data loss - so removing it costs no
# usable HA. The qnap-iscsi StorageClass reclaims with Retain: every re-clone leaves a Released PV,
# logged by name; removal stays with the tridentctl recipe in docs/runbooks/infra-pg.md.
#
# DRY_RUN=true (the merged default) logs the decision without deleting anything. Flip it only after
# the drill in plans/2026-09-28-gitea-actions-retention-and-cnpg-reclone-plan.md (rollout step 2) and
# after retention has run safely (step 5) - an automatic destructive action must never hide a bad
# deletion rate. Stop: `kubectl -n databases patch cronjob cnpg-lost-slot-reclone -p '{"spec":{"suspend":true}}'`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-lost-slot-reclone
  namespace: databases
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-lost-slot-reclone
  namespace: databases
rules:
  # get/patch on the allowlisted Cluster only (annotations; patch could also change spec - accepted,
  # the script never does). No `list`: resourceNames do not apply to list.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    resourceNames: ["infra-pg"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-lost-slot-reclone
  namespace: databases
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: cnpg-lost-slot-reclone }
subjects:
  - { kind: ServiceAccount, name: cnpg-lost-slot-reclone, namespace: databases }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-lost-slot-reclone
  namespace: databases
  labels:
    app.kubernetes.io/name: cnpg-lost-slot-reclone
    app.kubernetes.io/part-of: databases
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 240
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 280
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cnpg-lost-slot-reclone
        spec:
          restartPolicy: Never
          serviceAccountName: cnpg-lost-slot-reclone
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            # The cluster's own image (infra-pg.yaml imageName), so psql matches the server and the
            # image is already on every node. Writes the slot state for the main container.
            - name: probe
              image: ghcr.io/cloudnative-pg/postgresql:17.11
              imagePullPolicy: IfNotPresent
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              env:
                - name: PGHOST
                  value: infra-pg-rw.databases.svc.cluster.local # CNPG points -rw at the CURRENT primary
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: postgres
                - name: PGSSLMODE
                  value: verify-ca
                - name: PGSSLROOTCERT
                  value: /ca/ca.crt
                - name: PGCONNECT_TIMEOUT
                  value: "15"
                - name: PSQLRC
                  value: /dev/null
                - name: PGUSER
                  valueFrom: { secretKeyRef: { name: infra-pg-slotwatch, key: username } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: infra-pg-slotwatch, key: password } }
              command: ["/bin/sh", "-euc"]
              args:
                - |
                  psql -v ON_ERROR_STOP=1 -At -o /work/slots.tsv \
                    -c "select 'in_recovery=' || pg_is_in_recovery()" \
                    -c "select slot_name || '|' || slot_type || '|' || active || '|' || coalesce(wal_status, '') || '|' || coalesce(safe_wal_size::text, '') || '|' || coalesce(invalidation_reason, '') from pg_replication_slots order by slot_name"
                  echo "probe: $(wc -l < /work/slots.tsv) line(s)"; cat /work/slots.tsv
              volumeMounts:
                - { name: work, mountPath: /work }
                - { name: ca, mountPath: /ca, readOnly: true }
          containers:
            - name: reclone
              image: docker.io/alpine/k8s:1.32.13@sha256:ffb0758383fdd5878419930052e2854afe6c0479303a59edaca4143ce8d3c016
              imagePullPolicy: IfNotPresent
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              env:
                - name: NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
                - name: CLUSTERS # space-separated allowlist; the Role's resourceNames must match
                  value: "infra-pg"
                - name: SLOTS_FILE
                  value: /work/slots.tsv
                - name: DRY_RUN
                  value: "true"
                - name: MIN_INTERVAL_SECONDS # >= 6 h between re-clones of one cluster: at most 4/day
                  value: "21600"
                - name: STUCK_AFTER_SECONDS # unverified marker older than 45 min => exit 1 every run
                  value: "2700"
                - name: DELETE_WAIT_SECONDS
                  value: "150"
                - name: HOME
                  value: /tmp
              command: ["/bin/sh", "/opt/reclone/cnpg-lost-slot-reclone.sh"]
              volumeMounts:
                - { name: work, mountPath: /work }
                - { name: tmp, mountPath: /tmp }
                - { name: script, mountPath: /opt/reclone, readOnly: true }
          volumes:
            - name: work
              emptyDir: { medium: Memory, sizeLimit: 8Mi }
            - name: tmp
              emptyDir: { medium: Memory, sizeLimit: 8Mi }
            - name: ca
              secret: { secretName: infra-pg-ca, items: [{ key: ca.crt, path: ca.crt }] }
            - name: script
              configMap: { name: cnpg-lost-slot-reclone-script, defaultMode: 0555 }
