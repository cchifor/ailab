# Credential for the `backup_dumper` role that infra-pg-dump-cronjob.yaml uses.
#
# The role itself is declared in infra-pg.yaml under spec.managed.roles, so CNPG creates and
# reconciles it -- the 2026-09-08 emergency dump used a HAND-MADE role whose creation was recorded
# nowhere, which is precisely the kind of artefact that does not survive a rebuild.
#
# It needs BOTH pg_read_all_data AND bypassrls: per-owner dumps on 2026-09-08 silently missed
# RLS-protected rows in agentforge_platform, and pg_read_all_data alone does NOT imply BYPASSRLS.
#
# Encrypted by the catch-all .sops.yaml rule (encrypted_regex ^(data|stringData)$), so the payload
# must live under stringData -- a top-level key would be committed in the clear.
apiVersion: v1
kind: Secret
metadata:
    name: infra-pg-dumper
    namespace: databases
    labels:
        # CNPG reloads a role's password Secret ONLY when it carries this label. Without it a rotated
        # password sits in the Secret while the server still has the old one, so the CronJob
        # authenticates with a credential the database was never told about and the backup fails on the
        # next rotation -- silently, which is the class of failure this change exists to remove.
        # (codex impl-review #9)
        cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
    username: ENC[AES256_GCM,data:S9NjWqSghbVroR3+2w==,iv:sfZI72cSK2N6SBzEAuARs00NdeQ8fNXsoxVa71vN03U=,tag:W+UJm2BgvMErh+zmb4f0TQ==,type:str]
