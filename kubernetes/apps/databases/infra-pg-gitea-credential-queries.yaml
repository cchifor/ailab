# Custom CNPG exporter queries over the GITEA database's credential inventory. Referenced from
# spec.monitoring.customQueriesConfigMap of infra-pg (infra-pg.yaml), NEXT TO the operator's default
# cnpg-default-monitoring ConfigMap (which the operator's defaulting webhook puts there and which this
# list must therefore restate, or the cnpg_pg_* families stop). Scraped through PodMonitor
# infra-pg-metrics; the alerts are monitoring/gitea-credential-rules.yaml (+ .test.yaml).
#
# WHY: owner-held Gitea access tokens and OAuth2 grants are standing credentials, and until now nothing
# counted them. On 2026-10-07 the org account `cchifor` held 26 tokens (the spec and runbook said 21),
# `gitea_admin` held 41 of which only two are documented consumers (docs/runbooks/s2s-identity.md,
# "Still open"), and `chifor` held one OAuth2 grant. Gitea access tokens have no expiry column, so
# a count and an age are the only handle there is.
#
# WHAT IS EXPORTED: counts and ages ONLY. Nothing selects token_hash, token_salt, token_last_eight, a
# token name or a token id into the output; the allowlist is compared INSIDE the view and only the
# number of non-matching rows leaves it. `owner` is a Gitea login name.
#
# THESE QUERIES READ TWO VIEWS, NOT THE TABLES. CNPG's exporter runs custom queries as the predefined
# role pg_monitor (SET ROLE pg_monitor on its postgres connection), which has no privilege on Gitea's
# tables: the first version of this file selected from "user" / access_token directly and failed with
# `ERROR: permission denied for table user (SQLSTATE 42501)` the moment it loaded (2026-10-07). The views
# credential_inventory.owner_credentials and credential_inventory.site_admins are owned by the superuser
# that creates them, return aggregates only, and pg_monitor has SELECT on them and nothing else. They
# are created by the operator-run one-shot gitea-credential-inventory.sql beside this file (docs/runbooks/
# infra-pg.md, "Gitea credential inventory"); the allowlist is defined THERE. Until they exist the
# queries fail and GiteaCredentialInventoryMissing fires after 30m.
#
# `primary: true` so the replica does not export a lagging duplicate; the rules aggregate with
# max by (owner) anyway so a failover overlap cannot double-count.
#
# TWO QUERIES, five metric families (CNPG names a family cnpg_<query>_<column>):
#   cnpg_gitea_credentials_tokens                  tokens the owner holds
#   cnpg_gitea_credentials_oldest_token_age_seconds age of the owner's oldest token (0 when none)
#   cnpg_gitea_credentials_tokens_not_allowlisted  tokens outside the allowlist
#   cnpg_gitea_credentials_oauth_grants            OAuth2 grants the owner has authorised
#   cnpg_gitea_site_admins_total                   users with is_admin
#
# ZERO-FILL: the owner rows come from "user" with LEFT JOINs (in the view), so an owner with no tokens
# still yields a row of zeros. A row that is ABSENT therefore means the account is gone or renamed (or
# the query/exporter is broken), which is what GiteaCredentialInventoryMissing alerts on - a valid zero
# must never look like a missing series.
#
# OWNERS: `cchifor` the org account, `chifor` the owner, `gitea_admin` the break-glass admin, plus every
# is_admin user, so a newly promoted admin shows up with its own row (GiteaAdminUserCountChanged fires
# too). The allowlist is keyed by (id, name, scope), all three: the two documented `gitea_admin` tokens,
# af-ci-scaler-2941 (id 12, read:admin) and flux-ailab-read (id 1, read:repository). The other owners have
# no allowlisted token, so for them tokens_not_allowlisted == tokens.
#
# Read-only by construction (SELECTs over views). Verified against the live gitea DB as pg_monitor
# (`SET ROLE pg_monitor`, default_transaction_read_only=on), 2026-10-07.
apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-pg-gitea-credential-queries
  namespace: databases
  labels:
    cnpg.io/reload: "true" # the default ConfigMap carries it; reload on edit without a pod restart
data:
  queries: |
    gitea_credentials:
      query: |
        SELECT owner, tokens, oldest_token_age_seconds, tokens_not_allowlisted, oauth_grants
        FROM credential_inventory.owner_credentials
      primary: true
      target_databases:
        - gitea
      metrics:
        - owner:
            usage: "LABEL"
            description: "Gitea login name of the credential holder"
        - tokens:
            usage: "GAUGE"
            description: "Number of access tokens the owner holds"
        - oldest_token_age_seconds:
            usage: "GAUGE"
            description: "Age in seconds of the owner's oldest access token by created_unix (0 when the owner holds none)"
        - tokens_not_allowlisted:
            usage: "GAUGE"
            description: "Number of the owner's access tokens outside the (id, name, scope) allowlist"
        - oauth_grants:
            usage: "GAUGE"
            description: "Number of OAuth2 grants the owner has authorised"

    gitea_site_admins:
      query: |
        SELECT total FROM credential_inventory.site_admins
      primary: true
      target_databases:
        - gitea
      metrics:
        - total:
            usage: "GAUGE"
            description: "Number of Gitea users with site-admin rights"
