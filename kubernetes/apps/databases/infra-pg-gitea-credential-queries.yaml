# Custom CNPG exporter queries over the GITEA database's credential inventory. Referenced from
# spec.monitoring.customQueriesConfigMap of infra-pg (infra-pg.yaml), NEXT TO the operator's default
# cnpg-default-monitoring ConfigMap (which the operator's defaulting webhook puts there and which this
# list must therefore restate, or the cnpg_pg_* families stop). Scraped through PodMonitor
# infra-pg-metrics; the alerts are monitoring/gitea-credential-rules.yaml (+ .test.yaml).
#
# WHY: owner-held Gitea access tokens and OAuth2 grants are standing credentials, and until now nothing
# counted them. On 2026-10-07 the org account `cchifor` held 26 tokens (the spec and runbook said 21),
# `gitea_admin` held 41 of which only two are documented consumers (docs/runbooks/s2s-identity.md,
# "Still open"), and `chifor` held one OAuth2 grant. Gitea access tokens have no expiry column, so
# a count and an age are the only handle there is.
#
# WHAT IS EXPORTED: counts and ages ONLY. The queries never select token_hash, token_salt,
# token_last_eight, a token name or a token id into the output; the allowlist below is compared INSIDE
# the query and only the number of non-matching rows leaves it. `owner` is a Gitea login name.
#
# RUNS AS: the exporter connects as the postgres superuser over the instance's local socket (CNPG
# docs), so it can read the gitea tables although they are owned by the `gitea` role. If a future
# CNPG release stops doing that the series simply vanish and GiteaCredentialInventoryMissing fires
# after 30m; the fallback is a superuser-owned view returning these same aggregates, granted to the
# exporter's role (plans/2026-10-07-auth-hardening-and-ops-plan.md, B5).
#
# `primary: true` so the replica does not export a lagging duplicate; the rules aggregate with
# max by (owner) anyway so a failover overlap cannot double-count.
#
# TWO QUERIES, five metric families (CNPG names a family cnpg_<query>_<column>):
#   cnpg_gitea_credentials_tokens                  tokens the owner holds
#   cnpg_gitea_credentials_oldest_token_age_seconds age of the owner's oldest token (0 when none)
#   cnpg_gitea_credentials_tokens_not_allowlisted  tokens outside the allowlist below
#   cnpg_gitea_credentials_oauth_grants            OAuth2 grants the owner has authorised
#   cnpg_gitea_site_admins_total                   users with is_admin
#
# ZERO-FILL: the owner rows come from "user" with LEFT JOINs, so an owner with no tokens still
# yields a row of zeros. A row that is ABSENT therefore means the account is gone or renamed (or the
# query/exporter is broken), which is what GiteaCredentialInventoryMissing alerts on - a valid zero
# must never look like a missing series.
#
# OWNERS: the three the plan names (`cchifor` the org account, `chifor` the owner, `gitea_admin`
# the break-glass admin) plus every is_admin user, so a newly promoted admin shows up with its own
# row (GiteaAdminUserCountChanged fires too).
#
# THE ALLOWLIST is keyed by (id, name, scope), all three, so replacing a documented token with a
# lookalike (same name, new id) or widening its scopes does NOT stay allowlisted. It is the two
# documented `gitea_admin` consumers (docs/runbooks/s2s-identity.md):
#   id 12  af-ci-scaler-2941  read:admin       (agentforge-ci/agentforge-ci-scaler-token)
#   id 1   flux-ailab-read    read:repository  (flux-system/flux-gitea-auth)
# Ids are unique across the table, so the list applies to every owner without naming one; the other
# owners have no allowlisted token, so for them tokens_not_allowlisted == tokens. ROTATING either
# token (a new id) means editing this list in the same PR, or GiteaAdminTokenNotAllowlisted fires.
#
# Read-only by construction (SELECTs only). Verified against the live gitea DB with
# `psql -U postgres -d gitea` under default_transaction_read_only=on, 2026-10-07.
apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-pg-gitea-credential-queries
  namespace: databases
  labels:
    cnpg.io/reload: "true" # the default ConfigMap carries it; reload on edit without a pod restart
data:
  queries: |
    gitea_credentials:
      query: |
        WITH allowlist (id, name, scope) AS (
          VALUES (1::bigint, 'flux-ailab-read'::text, 'read:repository'::text),
                 (12::bigint, 'af-ci-scaler-2941'::text, 'read:admin'::text)
        )
        SELECT u.name AS owner,
               count(t.id)::float8 AS tokens,
               COALESCE(extract(epoch FROM now()) - min(t.created_unix), 0)::float8 AS oldest_token_age_seconds,
               count(t.id) FILTER (WHERE a.id IS NULL)::float8 AS tokens_not_allowlisted,
               COALESCE(max(g.n), 0)::float8 AS oauth_grants
        FROM "user" u
        LEFT JOIN access_token t ON t.uid = u.id
        LEFT JOIN allowlist a ON a.id = t.id AND a.name = t.name AND a.scope = t.scope
        LEFT JOIN (SELECT user_id, count(*) AS n FROM oauth2_grant GROUP BY user_id) g ON g.user_id = u.id
        WHERE u.name IN ('cchifor', 'chifor', 'gitea_admin') OR u.is_admin
        GROUP BY u.id, u.name
      primary: true
      target_databases:
        - gitea
      metrics:
        - owner:
            usage: "LABEL"
            description: "Gitea login name of the credential holder"
        - tokens:
            usage: "GAUGE"
            description: "Number of access tokens the owner holds"
        - oldest_token_age_seconds:
            usage: "GAUGE"
            description: "Age in seconds of the owner's oldest access token by created_unix (0 when the owner holds none)"
        - tokens_not_allowlisted:
            usage: "GAUGE"
            description: "Number of the owner's access tokens outside the (id, name, scope) allowlist"
        - oauth_grants:
            usage: "GAUGE"
            description: "Number of OAuth2 grants the owner has authorised"

    gitea_site_admins:
      query: |
        SELECT count(*)::float8 AS total FROM "user" WHERE is_admin
      primary: true
      target_databases:
        - gitea
      metrics:
        - total:
            usage: "GAUGE"
            description: "Number of Gitea users with site-admin rights"
