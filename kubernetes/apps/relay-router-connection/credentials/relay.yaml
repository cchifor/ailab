# Relay's Router connection files, rendered by ESO from OpenBao into Secret relay/relay-router-files
# with exactly three keys: `admin-key.pem`, `reconciler-key.pem`, `escrow-token`
# (docs/runbooks/relay-router-connection.md, "OpenBao documents"). The shape
# relay-budget-authority/credentials/relay.yaml uses.
#
# CONSUMED ONLY BY kubernetes/components/relay-router-connection, which mounts the two PEMs as
# read-only subPath files and the token as a directory. Until a later reviewed PR includes that
# component, this Secret is inert, and with no document in OpenBao it is not even rendered.
#
# THE KEYS ARE THE OPERATOR'S: two Ed25519 private keys (PKCS#8 PEM) generated in the operator's session.
# THE ESCROW TOKEN IS MINTED HERE, automatically: the VaultDynamicSecret generator below asks OpenBao for a
# fresh token from token role relay-router-escrow (policy relay-router-escrow, 168 h, orphan, not renewable;
# security/openbao/relay-router-provision-job.yaml) on every refresh of the ExternalSecret, every 24 h. No
# token is stored in OpenBao's KV. Nothing here, and nothing in git, holds a key or a token.
#
# BACKUP: the rendered Secret carries velero.io/exclude-from-backup=true; the private keys and the
# token live in OpenBao only, whose own snapshot/restore covers them (openbao-recovery.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: relay-router-eso
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay-router-connection
    app.kubernetes.io/component: credential
automountServiceAccountToken: false # ESO mints its own token; nothing else may use this SA
---
# The CA that signed OpenBao's server certificate, materialised locally: the SecretStore verifies
# TLS with it, and the component projects ONLY its ca.crt into Relay as NODE_EXTRA_CA_CERTS for the
# in-cluster baoOrigin. The throwaway-leaf trick every other namespace uses; the leaf is never read.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: relay-router-openbao-ca
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay-router-connection
spec:
  secretName: relay-router-openbao-tls
  duration: 8760h
  renewBefore: 720h
  commonName: openbao-ca-ref
  dnsNames: ["openbao-ca-ref.relay.svc"]
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: ailab-ca, kind: ClusterIssuer, group: cert-manager.io }
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: relay-router-store
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay-router-connection
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: af
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: af-app-relay-router
          serviceAccountRef: { name: relay-router-eso }
      caProvider: { type: Secret, name: relay-router-openbao-tls, key: ca.crt }
---
# THE ESCROW TOKEN'S SOURCE (automatic rotation, 2026-11-22; docs/runbooks/relay-router-connection.md,
# "Escrow token"). POST auth/token/create/relay-router-escrow returns the token in the response's `auth`
# section, hence resultType Auth; the ExternalSecret's template reads its `client_token` key.
#   * The same identity as the SecretStore (k8s-auth role af-app-relay-router, SA relay-router-eso); its
#     policy may `update` exactly that one token-role path, so it can mint escrow tokens and nothing else.
#   * ttl 168h = the role's explicit max TTL. A token minted at a refresh still has 144 h left when the next
#     refresh is due: a failing generator leaves Relay six days on the last token, and
#     RelayRouterFilesNotReady (monitoring/ha-rules.yaml) fires within 30 min.
#   * Replaced tokens are NOT revoked: each expires at its TTL, so in steady state about seven are live,
#     all with the same escrow-only policy. ESO runs the generator before it reads the signer documents,
#     so a refresh that fails on a signer read still mints, and each retry mints again. Revoke them all
#     at once with sys/leases/revoke-prefix (runbook).
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: relay-router-escrow-token
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay-router-connection
spec:
  method: POST
  path: auth/token/create/relay-router-escrow
  parameters:
    ttl: 168h
    display_name: relay-router-escrow
  resultType: Auth
  provider:
    server: https://openbao.openbao.svc:8200
    auth:
      kubernetes:
        mountPath: kubernetes
        role: af-app-relay-router
        serviceAccountRef: { name: relay-router-eso }
    caProvider: { type: Secret, name: relay-router-openbao-tls, key: ca.crt }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: relay-router-files
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay-router-connection
spec:
  # EVERY refresh mints a new escrow token (the generator), so this interval is the rotation period:
  # 24 h against the token's 168 h. A new token reaches the running Relay shortly after the Secret
  # (directory mount); Relay rereads the file on every escrow call. A forced sync mints one too.
  # A new signer key does NOT reach a running Relay (subPath): it also needs a new kid and Router
  # trust, i.e. a deliberate rollout of both.
  refreshInterval: 24h
  secretStoreRef: { name: relay-router-store, kind: SecretStore }
  target:
    name: relay-router-files
    creationPolicy: Owner
    template:
      engineVersion: v2
      # Replace + this exact data map: the Secret holds these three keys and nothing else.
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/part-of: relay-router-connection
          velero.io/exclude-from-backup: "true"
      data:
        admin-key.pem: "{{ .adminKey }}"
        reconciler-key.pem: "{{ .reconcilerKey }}"
        escrow-token: "{{ .client_token }}"
  data:
    - secretKey: adminKey
      remoteRef: { key: relay-router/relay/admin-signer, property: private_key }
    - secretKey: reconcilerKey
      remoteRef: { key: relay-router/relay/reconciler-signer, property: private_key }
  # The generator's keys (client_token, accessor, policies, ...) join the template's context; only
  # client_token reaches the Secret, through the exact data map above.
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: relay-router-escrow-token
