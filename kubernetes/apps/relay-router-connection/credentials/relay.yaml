# Relay's Router connection files, rendered by ESO from OpenBao into Secret relay/relay-router-files
# with exactly three keys: `admin-key.pem`, `reconciler-key.pem`, `escrow-token`
# (docs/runbooks/relay-router-connection.md, "OpenBao documents"). The shape
# relay-budget-authority/credentials/relay.yaml uses.
#
# CONSUMED ONLY BY kubernetes/components/relay-router-connection, which mounts the two PEMs as
# read-only subPath files and the token as a directory. Until a later reviewed PR includes that
# component, this Secret is inert, and with no document in OpenBao it is not even rendered.
#
# THE VALUES ARE THE OPERATOR'S: two Ed25519 private keys (PKCS#8 PEM) generated in the operator's
# session, and an escrow token minted from token role relay-router-escrow (policy relay-router-escrow,
# security/openbao/relay-router-provision-job.yaml). Nothing here, and nothing in git, holds them.
#
# BACKUP: the rendered Secret carries velero.io/exclude-from-backup=true; the private keys and the
# token live in OpenBao only, whose own snapshot/restore covers them (openbao-recovery.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: relay-router-eso
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay-router-connection
    app.kubernetes.io/component: credential
automountServiceAccountToken: false # ESO mints its own token; nothing else may use this SA
---
# The CA that signed OpenBao's server certificate, materialised locally: the SecretStore verifies
# TLS with it, and the component projects ONLY its ca.crt into Relay as NODE_EXTRA_CA_CERTS for the
# in-cluster baoOrigin. The throwaway-leaf trick every other namespace uses; the leaf is never read.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: relay-router-openbao-ca
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay-router-connection
spec:
  secretName: relay-router-openbao-tls
  duration: 8760h
  renewBefore: 720h
  commonName: openbao-ca-ref
  dnsNames: ["openbao-ca-ref.relay.svc"]
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: ailab-ca, kind: ClusterIssuer, group: cert-manager.io }
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: relay-router-store
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay-router-connection
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: af
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: af-app-relay-router
          serviceAccountRef: { name: relay-router-eso }
      caProvider: { type: Secret, name: relay-router-openbao-tls, key: ca.crt }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: relay-router-files
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay-router-connection
spec:
  # A rotated escrow token reaches the Secret within this interval and the running Relay shortly
  # after (directory mount). A new signer key does NOT reach a running Relay (subPath): it also needs
  # a new kid and Router trust, i.e. a deliberate rollout of both.
  refreshInterval: 1h
  secretStoreRef: { name: relay-router-store, kind: SecretStore }
  target:
    name: relay-router-files
    creationPolicy: Owner
    template:
      engineVersion: v2
      # Replace + this exact data map: the Secret holds these three keys and nothing else.
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/part-of: relay-router-connection
          velero.io/exclude-from-backup: "true"
      data:
        admin-key.pem: "{{ .adminKey }}"
        reconciler-key.pem: "{{ .reconcilerKey }}"
        escrow-token: "{{ .escrowToken }}"
  data:
    - secretKey: adminKey
      remoteRef: { key: relay-router/relay/admin-signer, property: private_key }
    - secretKey: reconcilerKey
      remoteRef: { key: relay-router/relay/reconciler-signer, property: private_key }
    - secretKey: escrowToken
      remoteRef: { key: relay-router/relay/escrow-token, property: token }
