# OpenBao -> ESO delivery of the Relay Router connection's files, one SecretStore and one
# ExternalSecret per consumer namespace (docs/runbooks/relay-router-connection.md). Reconciled by
# clusters/ai/relay-router-credentials.yaml (wait:false).
#
# THE OWNERSHIP CHAIN, so nothing here is hand-made except the VALUES, which the operator owns:
#   af/relay-router/relay/admin-signer       field `private_key`  Ed25519 PKCS#8 PEM, kid relay-admin-2026-11
#   af/relay-router/relay/reconciler-signer  field `private_key`  Ed25519 PKCS#8 PEM, kid relay-reconciler-2026-11
#   af/relay-router/relay/escrow-token       field `token`        token from token role relay-router-escrow
#   af/relay-router/router/trust             fields `admin_public_key`, `reconciler_public_key` (SPKI PEM)
#   af/relay-router/escrow/<tenant>/<host-or-assistant>/<credential-id>   written by RELAY, never by hand
#   policies af-app-relay-router / af-app-router-relay-keys / relay-router-escrow, the k8s-auth roles
#   af-app-relay-router / af-app-router-relay-keys and the token role relay-router-escrow:
#     security/openbao/relay-router-provision-job.yaml (creates NO document and NO token).
#
# NO SECRET MATERIAL IN GIT. Nothing CONSUMES these Secrets yet: the wiring is
# kubernetes/components/relay-router-connection and llm-router-relay-keys-trust, included by later
# operator PRs in the runbook's order.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- relay.yaml
- llm-router.yaml
