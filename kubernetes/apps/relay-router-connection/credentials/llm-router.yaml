# Router's trust mapping for the Relay connection, rendered by ESO into Secret
# llm-router/llm-router-relay-trust with exactly one key, `trust.json` (llm-router relay-keys `Trust`
# schema; docs/runbooks/relay-router-connection.md, "Router trust mapping").
#
# GIT FIXES EVERYTHING BUT THE TWO PUBLIC KEYS: issuer, kids, roles, tenant, Router namespace, routes,
# access, lifetime/key ceilings and the worker budget ceiling. Only `admin_public_key` and
# `reconciler_public_key` (SPKI PEM of the operator's two Ed25519 key pairs) come from OpenBao,
# JSON-encoded with `toJson` (the litellm-chatgpt-eso.yaml precedent) so a PEM's newlines cannot
# break the document. The issuer, kids and tenant must equal
# kubernetes/components/relay-router-connection/connections.json (the activation test pins it).
#
# PLACEHOLDER, deliberately: workerBudgets.maxTokens is "operator-sets-8x(I+8192)", a string where the
# schema needs an integer, so a router given this file refuses the whole trust document. It becomes
# 8 x (I + 8192) once qualification proves I, the provider-enforced input bound (relay#277 comment
# 120818 B/D). scripts/tests/test_relay_router_connection.py refuses including the Router component
# while the placeholder is here. maxAuthoritySeconds 120 and maxRequests 8 are the 120818 D values.
#
# CONSUMED ONLY BY kubernetes/components/llm-router-relay-keys-trust (not included yet).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: router-relay-keys-eso
  namespace: llm-router
  labels:
    app.kubernetes.io/part-of: relay-router-connection
    app.kubernetes.io/component: credential
automountServiceAccountToken: false # ESO mints its own token; nothing else may use this SA
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: router-relay-keys-openbao-ca
  namespace: llm-router
  labels:
    app.kubernetes.io/part-of: relay-router-connection
spec:
  secretName: router-relay-keys-openbao-tls
  duration: 8760h
  renewBefore: 720h
  commonName: openbao-ca-ref
  dnsNames: ["openbao-ca-ref.llm-router.svc"]
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: ailab-ca, kind: ClusterIssuer, group: cert-manager.io }
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: router-relay-keys-store
  namespace: llm-router
  labels:
    app.kubernetes.io/part-of: relay-router-connection
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: af
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: af-app-router-relay-keys
          serviceAccountRef: { name: router-relay-keys-eso }
      caProvider: { type: Secret, name: router-relay-keys-openbao-tls, key: ca.crt }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-router-relay-trust
  namespace: llm-router
  labels:
    app.kubernetes.io/part-of: relay-router-connection
spec:
  # A changed public key reaches the Secret within this interval, but NOT the running router: the
  # file is a subPath and the plugin reads it once. A trust change is a deliberate router rollout.
  refreshInterval: 1h
  secretStoreRef: { name: router-relay-keys-store, kind: SecretStore }
  target:
    name: llm-router-relay-trust
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/part-of: relay-router-connection
          velero.io/exclude-from-backup: "true"
      data:
        # Router namespace `default` is the namespace of every live route and key. routes/access:
        # the researcher selection is {kind: model, model: relay-researcher-luna} with no route, and
        # the router admits a budgeted worker only when its routes include the requested model as a
        # route alias (relay-keys worker-budget-preflight; inference authorize), so the one route is
        # the dedicated adapted route `relay-researcher-luna` (one deployment: openai-2 / gpt-6-luna;
        # relay#277 comment 121330), API access only (the worker budget refuses subscription
        # transports). The runbook's "Route precondition" gives the route the operator creates.
        trust.json: |
          {"version": 1, "issuers": [{
            "issuer": "relay.chifor.me",
            "keys": [
              {"kid": "relay-admin-2026-11", "publicKey": {{ .adminPublicKey | toJson }}, "roles": ["admin"]},
              {"kid": "relay-reconciler-2026-11", "publicKey": {{ .reconcilerPublicKey | toJson }}, "roles": ["reconciler"]}
            ],
            "tenants": [{
              "tenant": "00000000-0000-4000-8000-000000000001",
              "namespace": "default",
              "routes": ["relay-researcher-luna"],
              "access": ["api"],
              "maxLifetimeSeconds": 86400,
              "maxKeys": 4,
              "workerBudgets": {"maxTokens": "operator-sets-8x(I+8192)", "maxAuthoritySeconds": 120, "maxRequests": 8}
            }]
          }]}
  data:
    - secretKey: adminPublicKey
      remoteRef: { key: relay-router/router/trust, property: admin_public_key }
    - secretKey: reconcilerPublicKey
      remoteRef: { key: relay-router/router/trust, property: reconciler_public_key }
