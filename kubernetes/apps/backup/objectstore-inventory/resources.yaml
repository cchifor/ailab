# Temporary, single-backup inventory. Remove this component promptly after its receipt.
# Keep the completed Job: a TTL would let Flux recreate it; the script also expires Oct18.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: objectstore-inventory-20261011
  namespace: velero
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: objectstore-inventory-20261011
  namespace: velero
rules:
  - apiGroups: [velero.io]
    resources: [backups]
    resourceNames: [velero-weekly-20261011030034]
    verbs: [get]
  - apiGroups: [velero.io]
    resources: [downloadrequests]
    resourceNames: [objectstore-inventory-20261011]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: objectstore-inventory-20261011
  namespace: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: objectstore-inventory-20261011
subjects:
  - kind: ServiceAccount
    name: objectstore-inventory-20261011
    namespace: velero
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: objectstore-inventory-20261011
  namespace: platform-edge
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [objectstore-backup-inventory-20261011]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: objectstore-inventory-20261011
  namespace: platform-edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: objectstore-inventory-20261011
subjects:
  - kind: ServiceAccount
    name: objectstore-inventory-20261011
    namespace: velero
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: objectstore-backup-inventory-20261011
  namespace: platform-edge
data:
  purpose: Sanitized resource counts for the pinned backup; absence of receipt.json is unavailable.
# receipt.json belongs to the Job's merge patch; Flux never declares or overwrites that key.
---
apiVersion: velero.io/v1
kind: DownloadRequest
metadata:
  name: objectstore-inventory-20261011
  namespace: velero
spec:
  target:
    kind: BackupResourceList
    name: velero-weekly-20261011030034
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: objectstore-inventory-20261011
  namespace: velero
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: objectstore-inventory-20261011
  ingress: []
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toCIDR: [192.168.1.225/32]
      toPorts:
        - ports:
            - {port: "7070", protocol: TCP}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: objectstore-inventory-20261011
  namespace: velero
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: objectstore-inventory-20261011
    spec:
      serviceAccountName: objectstore-inventory-20261011
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory
          image: mirror.gcr.io/library/python:3.14-slim@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
          imagePullPolicy: IfNotPresent
          command: [python3, -B, /script/inventory.py]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: script, mountPath: /script, readOnly: true}
            - {name: trust, mountPath: /trust, readOnly: true}
      volumes:
        - name: script
          configMap:
            name: objectstore-inventory-script
        - name: trust
          configMap:
            name: objectstore-inventory-trust
