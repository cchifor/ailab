# Off-site leg (copy #3) — nightly one-directional `rclone sync` of the local versitygw buckets to an
# encrypted (rclone crypt) Google Drive remote. Runs at 04:00, AFTER Velero (02:00/03:00) + talos-backup
# (01:00) have finished, so it never mirrors a half-written/half-pruned repo. Drive is the best-effort
# DR tail, NOT a restore-critical path (see ADR 0010). The talos secrets bundle is NOT synced here — it
# already lives off-site SOPS-encrypted in git (kubernetes/infra/talos-secrets-bundle.sops.yaml).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rclone-offsite
  namespace: backup-offsite
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      # The first SEED can take many hours (Drive per-user rate limits on many small Kopia blobs);
      # give the job a long deadline so it isn't killed mid-seed.
      activeDeadlineSeconds: 79200 # 22h
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: rclone
              image: rclone/rclone:1.75.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  # NOT `set -e`: the two legs are independent and each must be allowed to fail without
                  # starving the other. Under `set -e` the velero leg's abort killed the script before the
                  # talos leg ever ran, so one wedged leg silently took BOTH off-site copies down with it.
                  set -u
                  # rclone rewrites the config to persist a refreshed Drive OAuth token, but the Secret
                  # mount is read-only, so every run logged a "Failed to save config" ERROR. Copy to a
                  # writable path: the refresh sticks for the run and the log loses a standing red herring.
                  cp /config/rclone.conf /tmp/rclone.conf
                  export RCLONE_CONFIG=/tmp/rclone.conf
                  # rclone's s3 backend has no per-remote TLS-skip, and --ca-cert REPLACES the CA pool —
                  # so combine the system CAs (for Google Drive) + the versitygw self-signed CA (for the
                  # garage remotes) into one bundle; both legs then verify properly.
                  SYS=/etc/ssl/certs/ca-certificates.crt
                  if [ -f "$SYS" ]; then cat "$SYS" /etc/ssl/versitygw/ca.pem > /tmp/ca-bundle.pem; else cp /etc/ssl/versitygw/ca.pem /tmp/ca-bundle.pem; fi
                  export RCLONE_CA_CERT=/tmp/ca-bundle.pem
                  # Throttled for Drive's per-USER quota on many small objects (own client_id raises only
                  # the per-PROJECT quota, NOT this one): tpslimit + modest transfers/checkers, and a hard
                  # stop at the 750 GiB/day volume cap.
                  # --drive-use-trash=false: every deletion here is of a blob Kopia/Velero already expired
                  # locally, and Drive charges trashed files against the shared 5 TB quota for 30 days.
                  # The mass-deletion safety guard is now sync_leg's source floor below, NOT --max-delete.
                  # --max-delete-size stays only as a byte-denominated catastrophe backstop, sized above
                  # any legitimate Kopia GC so it should never bind in normal operation.
                  # --ignore-existing: velero moved to Kopia (thousands of small, CONTENT-ADDRESSED and
                  # therefore IMMUTABLE objects); talos-etcd snapshots are likewise write-once. Re-hashing
                  # every already-uploaded object each run is pure waste that, combined with Drive's
                  # per-user small-object throttling, pushed the run past activeDeadlineSeconds (22h) ->
                  # KubeJobFailed nightly. Skipping existing objects lets each run make forward progress
                  # (upload only NEW objects) so the initial backlog converges over a night or two, then
                  # every run is a fast incremental. Safe here precisely because these objects never
                  # change; sync's delete phase (retention/GC propagation) is unaffected, still guarded by
                  # --max-delete. (2026-07-22)
                  FLAGS="--ignore-existing --max-delete-size 100Gi --fast-list --transfers 4 --checkers 8 --tpslimit 8 --tpslimit-burst 16 --drive-stop-on-upload-limit --drive-use-trash=false --retries 3 --low-level-retries 10 --stats 2m --stats-one-line -v"
                  RC=0
                  # PRIMARY SAFETY GUARD. The threat being defended against is "the local source got wiped
                  # or versitygw is down, so an empty listing mirrors a mass deletion to the last off-site
                  # copy". This asserts that precondition directly — the source must still hold a plausible
                  # amount of data — before any destructive mirror runs.
                  #
                  # It replaces `--max-delete 100`, which aimed at the same threat by counting deletions
                  # and wedged permanently as a result: Kopia GC legitimately expires thousands of blobs,
                  # so once the backlog passed 100, EVERY run aborted before deleting anything, which grew
                  # the backlog, which guaranteed the next abort. That ratchet ran 41 days (7446 pending
                  # deletes against a limit of 100) and by construction could never self-heal.
                  sync_leg() {
                    src="$1"; dst="$2"; floor="$3"
                    echo "=== sync $src -> $dst (encrypted) ==="
                    j=$(rclone size "$src" --json) || { echo "FATAL: cannot size $src — treating as unreachable"; return 1; }
                    b=$(echo "$j" | sed -n 's/.*"bytes":\([0-9]*\).*/\1/p')
                    c=$(echo "$j" | sed -n 's/.*"count":\([0-9]*\).*/\1/p')
                    echo "source holds ${c:-?} objects / ${b:-?} bytes (floor ${floor})"
                    if [ -z "$b" ] || [ "$b" -lt "$floor" ]; then
                      echo "ABORT: source below floor — refusing to mirror a possible mass deletion"
                      return 1
                    fi
                    rclone sync "$src" "$dst" $FLAGS
                  }
                  # Floors are roughly 10% of each bucket's steady-state size: low enough that ordinary
                  # shrinkage never trips them, high enough that an empty or unreachable source always does.
                  sync_leg garage-velero:velero gdrive-crypt:velero 5000000000 || RC=1
                  sync_leg garage-talos:talos-etcd-backups gdrive-crypt:talos-etcd-backups 1000000000 || RC=1
                  echo "=== off-site quota (alert if near 5TB shared with Photos/Gmail) ==="
                  rclone about gdrive: --json || true
                  echo "=== exit rc=$RC ==="
                  exit $RC
              env:
                - { name: HOME, value: /tmp }
              volumeMounts:
                - { name: config, mountPath: /config, readOnly: true }
                - { name: versitygw-ca, mountPath: /etc/ssl/versitygw, readOnly: true }
                - { name: cache, mountPath: /tmp }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: config
              secret:
                secretName: rclone-offsite-config
                items: [{ key: rclone.conf, path: rclone.conf }]
            - name: versitygw-ca
              configMap:
                name: versitygw-ca
            - name: cache
              emptyDir: {}
