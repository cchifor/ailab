apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml # talos.dev/v1alpha1 ServiceAccount (os:etcd:backup) -> mints talosconfig secret
  - secret.sops.yaml # SOPS: versitygw creds for the `talos-etcd-backups` bucket
  - versitygw-ca.yaml # self-signed CA -> AWS_CA_BUNDLE for the AWS SDK
  - cronjob.yaml # daily age-encrypted etcd snapshot -> versitygw
  - prune-cronjob.yaml # retention: delete snapshots older than 30d (talos-backup has no pruning)
  - versitygw-probe.yaml # 10-min authenticated PUT/GET/verify/DELETE round-trip against versitygw (W4) — a tcp_connect check stayed GREEN through the 2026-09-08 outage

# HANDOVER STEP A (W6, temporary — removed in step C).
# `kustomize.toolkit.fluxcd.io/prune: disabled` exempts these objects from Flux garbage collection
# while ownership moves from the `infrastructure` Kustomization to the new `backup` one. Without it,
# the moment these resources leave infrastructure's build, its next reconcile prunes them — and that
# includes this NAMESPACE, whose deletion would take Velero's Backup/Restore CRs and its
# BackupStorageLocation with it. Flux may well skip cross-Kustomization deletions on its own, but
# "may well" is not a basis for gambling the backup system; this makes it unconditional.
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
