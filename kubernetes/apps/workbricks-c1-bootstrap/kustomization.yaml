apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# SOPS-encrypted read-only SSH deploy key for the `workbricks-c1` GitRepository (cchifor/workbricks
# is private). Applied to flux-system by the workbricks-c1-git-auth Flux Kustomization
# (../clusters/ai/workbricks-c1-git-auth.yaml), which carries the sops-age decryption config. Kept
# OUTSIDE clusters/ai so the decryption-less flux-system Kustomization that sweeps clusters/ai never
# tries to apply the still-encrypted Secret (same layout as platform-bootstrap and cloudlab-bootstrap).
resources:
  - deploy-key.sops.yaml
