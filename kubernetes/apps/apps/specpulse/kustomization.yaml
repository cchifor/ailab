apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# specpulse (cchifor/specpulse): a private web app at specpulse.chifor.me with its own login (owner decision
# 2026-11-26: GitOps on ailab, private, native auth, a new Router key on claude-sub-opus, start empty, deploy from main).
# manifests.yaml is a VERBATIM copy of the specpulse repo's deploy/manifests/manifests.yaml (the chart rendered; it holds
# no Secret and names no infrastructure). Every cluster-specific value is set HERE, by the image override and the
# patches below, so an update is: copy the file again, pin the new digest. docs/runbooks/specpulse.md.
resources:
  - manifests.yaml
  - specpulse-secrets.sops.yaml # SOPS: Fernet key, session secret, Router key (claude-sub-opus), optional GitHub token
images:
  # The publish workflow (cchifor/specpulse .gitea/workflows/publish.yml, workflow_dispatch from main) pushes
  # specpulse/specpulse:sha-<40 hex>; the digest of that tag is pinned here.
  # Rollback: re-pin sha256:731eec81b7676f8b4f21df4b90595dea7e8567d486d7d9706ddbb5d9d00d0c5a (main 289d6243); no data
  # restore is needed. The only migration since then, 0009_session_epoch, is additive (users.session_epoch INTEGER NOT
  # NULL DEFAULT 0). The older image names every users column it reads or writes (web/auth.py), and its db.migrate()
  # applies pending migrations only, never refusing an applied one it does not know. A rollback loses only 0009's
  # behaviour: a password change no longer signs out the user's other sessions.
  - name: REGISTRY_PLACEHOLDER/specpulse/specpulse
    newName: registry.chifor.me/specpulse/specpulse
    digest: sha256:44b828bcb2bda6ac29d0bd4bfaae47c4dcc45de9ce6ac8adb6581b9c94d53a30 # publish run 155646, main 63bcc4cf (tag sha-63bcc4cf32bb5d7959f9a58bf7e20af1d4010f38)
patches:
  # Block storage for the SQLite database: Trident iSCSI, ReadWriteOnce, Retain, honours fsGroup.
  - target: { kind: PersistentVolumeClaim, name: specpulse-data }
    patch: |
      - op: replace
        path: /spec/storageClassName
        value: qnap-iscsi
  # The Router seat: the public origin (pods reach it over the NetworkPolicy's 443 egress; it resolves to Cloudflare
  # public addresses, outside the policy's private-range exclusions) and the one route the app key may use.
  - target: { kind: ConfigMap, name: specpulse-seats }
    patch: |
      - op: replace
        path: /data/seats.toml
        value: |
          [router]
          url = "https://router.chifor.me"
          route = "claude-sub-opus"
          target_model = "opus"
          key_file = "/run/specpulse/keys/router-key"
          billing = "included"
  # The chart rolls the pod when seats.toml changes through the checksum/seats annotation, which it computed from the
  # PLACEHOLDER content; the prepare init copies seats.toml only at pod start. So the annotation is set here to the
  # sha256 of the RENDERED seats.toml (kubectl kustomize, then sha256 of data["seats.toml"]): CHANGE IT TOGETHER
  # WITH THAT PATCH, or a Router change would wait for a manual restart. docs/runbooks/specpulse.md.
  - target: { kind: Deployment, name: specpulse }
    patch: |
      - op: replace
        path: /spec/template/metadata/annotations/checksum~1seats
        value: "16ee1c22df089407f57c6e3bbe3e6288f6c128293bcf5eeca482054c4c2c8914"
