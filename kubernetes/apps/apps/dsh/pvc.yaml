# Two volumes, split by lifetime and by what loses you if it disappears.
#
# dsh-home ($DSH_HOME) MUST be writable and MUST persist: every launch rewrites the profile's
# cordis.yml, and browser-auth initialisation takes a file lock on .credentials.yaml even when no
# secret changes. An emptyDir would boot fine and silently discard the LiteLLM credential and the
# browser session on every pod replacement. Read-only does not work at all.
#
# local-path, not the nfs-csi default: .credentials.yaml is rejected if it carries any group/other
# permission bit, and an NFS mount is the wrong place to be arguing about POSIX modes. The cost is
# node affinity, which is acceptable for a single-replica personal tool.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dsh-home
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 5Gi } }
---
# The npm install lives on its own volume so the app can be upgraded (bump DSH_VERSION, delete this
# PVC) without touching credentials, and so the pod needs no npm egress after first boot.
#
# ReadWriteMany on nfs-csi, NOT local-path: the install Job and the Deployment both mount this. With
# a local-path RWO volume the Job binds it to whichever node the Job landed on, and if the
# Deployment is ever scheduled elsewhere it stays Pending forever with no obvious cause. RWX removes
# that failure mode. Unlike dsh-home this holds only a node_modules tree -- nothing here cares about
# POSIX modes, so NFS is fine.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dsh-app
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-csi
  resources: { requests: { storage: 4Gi } }
---
# The agent's working directory, deliberately SEPARATE from dsh-home.
#
# dsh-base derives the sandbox root from the process working directory
# (`sandbox-policy.workspaceRoot: !!js process.cwd()`), so whatever the container's cwd is becomes
# the tree the agent may write under in the default `workspace-write` mode. It used to be `/`,
# which put .credentials.yaml, settings.yaml and profiles/ inside the agent's reach. The Deployment
# now pins workingDir here.
#
# ReadWriteOnce/local-path deliberately MATCHES dsh-home (declared above in this same file), not
# dsh-app. Reviewed question worth answering in place: does this newly node-lock the Deployment?
# No. dsh-home is already ReadWriteOnce/local-path, and a local-path PV carries node affinity, so
# the pod is pinned wherever dsh-home was first provisioned. VERIFIED on the live cluster
# 2026-09-08: dsh-home is bound to pvc-329c5297 with node affinity talos-cp1, and the pod already
# runs on talos-cp1. This claim therefore adds no constraint that did not already exist — the
# Deployment could not reschedule to another node before this change either.
#
# The consequence is real but pre-existing: if that node is lost, dsh stays down until it returns.
# Moving BOTH volumes to nfs-csi/RWX would lift it, at the cost of putting the agent's working
# directory and its session state on NFS. That is a separate decision, not this change.
#
# Sized larger than dsh-home because this is where the agent's actual output accumulates.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dsh-workspace
  namespace: dsh
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 10Gi } }
