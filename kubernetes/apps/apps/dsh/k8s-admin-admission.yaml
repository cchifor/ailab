# The Role is intentionally small, but Jobs and NetworkPolicies are indirect
# privilege paths. This guard keeps the namespace admin useful for acceptance
# while blocking Secret imports and arbitrary egress policy changes.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: dsh-k8s-admin-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [jobs]
      - apiGroups: [networking.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [networkpolicies]
  validations:
    - expression: >-
        request.userInfo.username != 'system:serviceaccount:dsh:dsh-k8s-admin' ||
        (request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name).matches('^dsh-[a-z0-9-]+-acceptance-[a-z0-9]+$')
      message: dsh-k8s-admin may change only dsh-*-acceptance-* Jobs and NetworkPolicies
    - expression: >-
        request.operation == 'DELETE' || request.userInfo.username != 'system:serviceaccount:dsh:dsh-k8s-admin' ||
        object.kind != 'Job' ||
        (has(object.spec.template.spec.serviceAccountName) && object.spec.template.spec.serviceAccountName == 'dsh-k8s-admin' &&
         !has(object.spec.template.spec.hostNetwork) && !has(object.spec.template.spec.hostPID) && !has(object.spec.template.spec.hostIPC) &&
         (!has(object.spec.template.spec.initContainers) || size(object.spec.template.spec.initContainers) == 0) &&
         (!has(object.spec.template.spec.ephemeralContainers) || size(object.spec.template.spec.ephemeralContainers) == 0) &&
         (!has(object.spec.template.spec.volumes) || object.spec.template.spec.volumes.all(v,
           !has(v.secret) && !has(v.hostPath) && (!has(v.projected) || v.projected.sources.all(s, !has(s.secret))))) &&
         object.spec.template.spec.containers.all(c,
           (!has(c.securityContext) || ((!has(c.securityContext.privileged) || c.securityContext.privileged == false) &&
             (!has(c.securityContext.allowPrivilegeEscalation) || c.securityContext.allowPrivilegeEscalation == false))) &&
           (!has(c.envFrom) || c.envFrom.all(e, !has(e.secretRef))) &&
           (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
             ((e.valueFrom.secretKeyRef.name == 'dsh-litellm' && e.valueFrom.secretKeyRef.key == 'api_key') ||
              (e.valueFrom.secretKeyRef.name == 'dsh-credentials' && e.valueFrom.secretKeyRef.key == 'DSH_CODEX_ACCESS_TOKEN'))))))
      message: acceptance Jobs may use only the existing model Secret references
    - expression: >-
        request.operation == 'DELETE' || request.userInfo.username != 'system:serviceaccount:dsh:dsh-k8s-admin' ||
        object.kind != 'NetworkPolicy' ||
        (has(object.spec.podSelector.matchLabels) && object.spec.podSelector.matchLabels['dsh.chifor.me/acceptance'] == 'true' &&
         (!has(object.spec.ingress) || size(object.spec.ingress) == 0) &&
         has(object.spec.egress) && size(object.spec.egress) > 0 &&
         object.spec.egress.all(e, size(e.to) > 0 && size(e.ports) > 0 &&
           e.to.all(t, has(t.ipBlock) && t.ipBlock.cidr in ['192.168.0.41/32','192.168.0.42/32','192.168.0.43/32']) &&
           e.ports.all(p, p.protocol == 'TCP' && p.port == 6443)))
      message: acceptance NetworkPolicies may only allow Kubernetes API egress
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: dsh-k8s-admin-guard
spec:
  policyName: dsh-k8s-admin-guard
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: dsh
