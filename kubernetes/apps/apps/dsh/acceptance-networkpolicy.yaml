# Acceptance pods need the API endpoint for kubectl diagnostics.  This selector is
# also required by acceptance-admission.yaml for operator-created NetworkPolicies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dsh-acceptance-api-egress
  namespace: dsh
spec:
  podSelector:
    matchLabels:
      dsh.chifor.me/acceptance: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 192.168.0.40/32 }
        - ipBlock: { cidr: 192.168.0.41/32 }
        - ipBlock: { cidr: 192.168.0.42/32 }
        - ipBlock: { cidr: 192.168.0.43/32 }
      ports:
        - { protocol: TCP, port: 6443 }
