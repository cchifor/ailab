# dsh runs model-generated tool calls. SAFETY.md is explicit that it is experimental and unaudited,
# and that "sandbox and approval controls cannot protect resources that execution is permitted to
# use" -- so the containment that matters is the one OUTSIDE the app. Default-deny both directions,
# then allow only what it demonstrably needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dsh-default-deny
spec:
  podSelector: { matchLabels: { app: dsh } }
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dsh-allow
spec:
  podSelector: { matchLabels: { app: dsh } }
  policyTypes: [Ingress, Egress]
  ingress:
    # Only cloudflared may reach the relay. This is what stops a pod-network client from bypassing
    # the Cloudflare Access gate at the edge, so the selector has to actually mean it.
    #
    # The podSelector is NOT redundant with the namespaceSelector. `edge` also runs
    # cloudflared-strive, a SEPARATE tunnel for another domain; a bare namespaceSelector admitted it
    # too, which is a wider boundary than the comment above claims. Both selectors sit in ONE `from`
    # element on purpose -- as two list items they would be OR'ed and grant namespace-wide access
    # again.
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: edge } }
          podSelector: { matchLabels: { app.kubernetes.io/name: cloudflared } }
      ports: [{ port: 8080, protocol: TCP }]
    # Homepage's siteMonitor probes the Service for the status dot on home.chifor.me. Without this
    # the default-deny above silently shows dsh as permanently down. Narrowed to the homepage pod
    # itself: that namespace also runs oauth2-proxy, which has no reason to reach dsh directly.
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: homepage } }
          podSelector: { matchLabels: { app.kubernetes.io/name: homepage } }
      ports: [{ port: 8080, protocol: TCP }]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }}]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    # LiteLLM is the ONLY model path. dsh reaches every model through the proxy, so it never needs
    # egress to the internet for inference -- no OpenAI, no Anthropic, no DeepSeek.
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ai } }
          podSelector: { matchLabels: { app.kubernetes.io/name: litellm } }
      ports: [{ port: 4000, protocol: TCP }]
