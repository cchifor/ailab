# Seed for $DSH_HOME/settings.yaml — copied in ONCE, on first boot, only if the file is absent.
# dsh owns this file afterwards (the Settings UI writes it, and adapters re-read it per request),
# so this must never overwrite a live one.
#
# Registers the estate's LiteLLM proxy as a CUSTOM provider. It must be custom, not built-in: a
# built-in provider id is always answered from the installed catalog even when its baseURL points at
# a gateway, so only a custom provider surfaces what LiteLLM actually serves.
#
# api MUST be openai-completions — LiteLLM speaks OpenAI Chat Completions. A provider speaks exactly
# one protocol, so a second one would be needed for anything Anthropic-shaped.
#
# CREDENTIAL: deliberately not set here. dsh keeps keys in $DSH_HOME/.credentials.yaml (write-only
# through the UI, and the file is rejected if it carries any group/other permission bit), and this
# repo cannot mint one — the SOPS age key is not available to CI. Enter the LiteLLM key once under
# Settings → Models → the litellm provider; it persists on the dsh-home PVC across restarts.
llm-pi-ai:
  providers:
    litellm:
      api: openai-completions
      baseURL: http://litellm.ai.svc.cluster.local:4000/v1
      models:
        # Vision is real on this route: cloud2 serves Qwen3.8-27B with the tower loaded (VISION=1),
        # probe-verified. A hand-entered model is text-only until it says otherwise, so `input` is
        # what makes image attachment work at all.
        - id: qwen3.8-27b-vllm-cloud
          input: [text, image]
        - id: qwen3.8-27b-vllm-fast-cloud
        - id: qwen3-coder-30b-a3b-cloud
        - id: qwen3.5-122b-ailab
