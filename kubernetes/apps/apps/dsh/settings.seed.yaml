# Seed for $DSH_HOME/settings.yaml — copied in ONCE, on first boot, only if the file is absent.
# dsh owns this file afterwards (the Settings UI writes it, and adapters re-read it per request),
# so this must never overwrite a live one.
#
# Registers the estate's LiteLLM proxy as a CUSTOM provider. It must be custom, not built-in: a
# built-in provider id is always answered from the installed catalog even when its baseURL points at
# a gateway, so only a custom provider surfaces what LiteLLM actually serves.
#
# api MUST be openai-completions — LiteLLM speaks OpenAI Chat Completions. A provider speaks exactly
# one protocol, so a second one would be needed for anything Anthropic-shaped.
#
# CREDENTIAL: deliberately not set here. dsh keeps keys in $DSH_HOME/.credentials.yaml (write-only
# through the UI, and the file is rejected if it carries any group/other permission bit), and this
# repo cannot mint one — the SOPS age key is not available to CI. Enter the LiteLLM key once under
# Settings → Models → the litellm provider; it persists on the dsh-home PVC across restarts.
llm-pi-ai:
  providers:
    litellm:
      # Reads the key from the environment; the Deployment populates it from the
      # External-Secrets-synced `dsh-litellm` Secret (ultimately af/estate/litellm in OpenBao).
      # LiteLLM REQUIRES a real key -- an absent header is 401 and a wrong one is 400
      # "No connected db", verified from this pod 2026-09-07. Without it the provider is
      # registered but every model call fails, which is exactly how it behaved before.
      apiKeyEnv: LITELLM_API_KEY
      # Bounds the BYTES of images carried in one request, not the count -- say that plainly,
      # because it is the difference between this helping and this being theatre. dsh re-sends
      # every image in the conversation on every turn, and when this budget is exceeded
      # offloadRequestImagesWithPolicy (dsh-llm) replaces the OLDEST images with placeholders,
      # front-only and in fixed quanta so the pruned prefix stays byte-stable and vLLM's prefix
      # cache survives. Pruning from the tail instead would invalidate the cache every turn.
      #
      # WHAT IT DOES NOT DO: bound the COUNT. Attachments measured on this deployment run
      # 2 KB-100 KB with a 40 KB median, so 64 images is ~2.6 MB and this budget never binds
      # first at those sizes. The count is bounded by the server instead (MM_IMAGES=64 on cloud2,
      # which is max_model_len/2048 and therefore the ceiling). This value exists for the other
      # shape of the problem: a handful of large screenshots, where 8 x 1 MiB would otherwise eat
      # the context before the image cap noticed.
      #
      # 8 MiB, down from the 20 MiB default. The adapter also caps each image at 1 MiB inside the
      # request (requestImagePolicy.maxBytes), so this is ~8 worst-case images and ~200 typical.
      maxRequestImageBytes: 8388608
      api: openai-completions
      baseURL: http://litellm.ai.svc.cluster.local:4000/v1
      models:
        # Vision is real on this route: cloud2 serves Qwen3.8-27B with the tower loaded (VISION=1),
        # probe-verified. A hand-entered model is text-only until it says otherwise, so `input` is
        # what makes image attachment work at all.
        - id: qwen3.8-27b-vllm-cloud
          input: [text, image]
        - id: qwen3.8-27b-vllm-fast-cloud
        - id: qwen3-coder-30b-a3b-cloud
        - id: qwen3.5-122b-cloud
        - id: qwen3.8-flash-next-cloud
    # ---------------------------------------------------------------------------------------
    # THE CODEX ROUTE (architecture B) -- dsh's own agent loop running on the Codex model.
    #
    # This is NOT the Codex CLI. `dsh-subagent-codex` (a delegation provider, architecture A)
    # spawns the real CLI as a one-shot leaf; this is the harness driving the Codex MODEL
    # through its own loop, so the agent keeps dsh's tools, session lifecycle and delegation
    # machinery. That is what makes "codex as conductor, qwen as workers" possible at all --
    # the CLI provider cannot conduct anything (it rejects agentOptions, personas, tool
    # filtering and depth, and returns final text only).
    #
    # `openai-codex` IS A SHIPPED CATALOG PROVIDER. dsh-llm-pi-ai depends on
    # @earendil-works/pi-ai ^0.85.1, whose catalog ships it, spoken over
    # `openai-codex-responses`.
    #
    # WHY apiKeyEnv WORKS ON AN OAUTH-ONLY PROVIDER. The catalog provider offers no api-key
    # method, and pi-ai's resolveProviderAuth honours an explicit key only when the provider
    # declares one -- so a naive profile is refused with `Provider is not configured` before
    # any request goes out. dsh's adapter handles exactly this case: routeAuth() adds the
    # harness api-key method BESIDE the catalog provider's own whenever the profile names a
    # credential. A profile that names none still gets the honest refusal, because this
    # adapter holds no OAuth store to fall back on. So naming a credential is REQUIRED here,
    # not optional.
    #
    # CREDENTIAL + baseURL ARE DELIBERATELY UNSET. Two estate decisions have to be made first
    # and neither belongs in a seed file:
    #   * WHICH UPSTREAM. Straight to OpenAI, or through the AgentForge codex broker, which
    #     already fronts the operator's Codex subscription and injects OAuth after verifying a
    #     capability JWT (ADR 0019). The broker is the estate's answer to "a token must not sit
    #     in a pod that executes model-authored code" -- which this pod does.
    #   * THE WIRE DETAIL. ADR 0019 finding (b): codex POSTs {base_url}/responses WITHOUT
    #     prepending /v1, so a broker/gateway base URL must itself END IN /v1 or every request
    #     404s. That lesson was paid for once already.
    # Until both are settled this provider is registered but unusable, which is the honest
    # state -- exactly as the litellm provider above shipped before its key existed.
    codex:
      # apiKeyEnv: CODEX_API_KEY      # populated by the dsh-codex ExternalSecret; see openbao-eso.yaml
      # baseURL: <broker or upstream, MUST end in /v1>
      api: openai-codex-responses
      models:
        - id: gpt-6-astra
