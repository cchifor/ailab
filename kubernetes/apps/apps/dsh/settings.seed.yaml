# Seed for $DSH_HOME/settings.yaml — copied in ONCE, on first boot, only if the file is absent.
# dsh owns this file afterwards (the Settings UI writes it, and adapters re-read it per request),
# so this must never overwrite a live one.
#
# Registers the estate's LiteLLM proxy as a CUSTOM provider. It must be custom, not built-in: a
# built-in provider id is always answered from the installed catalog even when its baseURL points at
# a gateway, so only a custom provider surfaces what LiteLLM actually serves.
#
# api MUST be openai-completions — LiteLLM speaks OpenAI Chat Completions. A provider speaks exactly
# one protocol, so a second one would be needed for anything Anthropic-shaped.
#
# CREDENTIAL: deliberately not set here. dsh keeps keys in $DSH_HOME/.credentials.yaml (write-only
# through the UI, and the file is rejected if it carries any group/other permission bit), and this
# repo cannot mint one — the SOPS age key is not available to CI. Enter the LiteLLM key once under
# Settings → Models → the litellm provider; it persists on the dsh-home PVC across restarts.
llm-pi-ai:
  providers:
    litellm:
      # Reads the key from the environment; the Deployment populates it from the
      # External-Secrets-synced `dsh-litellm` Secret (ultimately af/estate/litellm in OpenBao).
      # LiteLLM REQUIRES a real key -- an absent header is 401 and a wrong one is 400
      # "No connected db", verified from this pod 2026-09-07. Without it the provider is
      # registered but every model call fails, which is exactly how it behaved before.
      apiKeyEnv: LITELLM_API_KEY
      # Bounds the BYTES of images carried in one request, not the count -- say that plainly,
      # because it is the difference between this helping and this being theatre. dsh re-sends
      # every image in the conversation on every turn, and when this budget is exceeded
      # offloadRequestImagesWithPolicy (dsh-llm) replaces the OLDEST images with placeholders,
      # front-only and in fixed quanta so the pruned prefix stays byte-stable and vLLM's prefix
      # cache survives. Pruning from the tail instead would invalidate the cache every turn.
      #
      # WHAT IT DOES NOT DO: bound the COUNT. Attachments measured on this deployment run
      # 2 KB-100 KB with a 40 KB median, so 64 images is ~2.6 MB and this budget never binds
      # first at those sizes. The count is bounded by the server instead (MM_IMAGES=64 on cloud2,
      # which is max_model_len/2048 and therefore the ceiling). This value exists for the other
      # shape of the problem: a handful of large screenshots, where 8 x 1 MiB would otherwise eat
      # the context before the image cap noticed.
      #
      # 8 MiB, down from the 20 MiB default. The adapter also caps each image at 1 MiB inside the
      # request (requestImagePolicy.maxBytes), so this is ~8 worst-case images and ~200 typical.
      maxRequestImageBytes: 8388608
      api: openai-completions
      baseURL: http://litellm.ai.svc.cluster.local:4000/v1
      models:
        # A hand-entered model is text-only until it says otherwise, so `input: [text, image]` is
        # what makes image attachment work at all. It is emitted for exactly the routes whose
        # LiteLLM entry declares model_info.supports_vision: true (cloud2 serves Qwen3.8-27B with
        # the tower loaded, VISION=1, probe-verified) — claim vision THERE, not here.
        # generated by scripts/gen-litellm-consumers.py from litellm.yaml — do not hand-edit; run --write
        - id: qwen3.5-122b-cloud
        - id: qwen3.8-27b-vllm-cloud
          input: [text, image]
        - id: qwen3.8-27b-vllm-fast-cloud
        - id: qwen3.8-27b-fp8-unc-cloud
        - id: qwen3-coder-30b-a3b-cloud
        - id: qwen3.8-flash-next-cloud
          input: [text, image]
        - id: qwen3.8-27b-ailab
          input: [text, image]
    # Subscription credential projected from reviewer-2 seat B through OpenBao/ESO.
    # Omit api: the catalog supplies openai-codex-responses; that internal protocol
    # name is not an accepted explicit profile api value.
    openai-codex:
      displayName: OpenAI Codex (realjaysage)
      apiKeyEnv: DSH_CODEX_ACCESS_TOKEN
      transport: sse
      models:
        - id: gpt-6-astra
          input: [text, image]
    # A SECOND Codex subscription -- reviewer-2 seat d (codexrun4, realjaynesage@gmail.com) -- served
    # THROUGH LiteLLM's chatgpt/ provider as the route gpt-6-astra-realjaynesage (ADR 0026). Added
    # 2026-09-19, when seat b's weekly window read 100 % (reviewbot_llm_usage_percent{persona="codex",
    # seat="b"}) and dsh had no usable Astra route.
    #
    # NOT a second native openai-codex provider, because the installed adapter cannot host one: in
    # @deepseek-ai/dsh-llm-pi-ai 0.1.5-alpha.2 the Codex subscription protocol (openai-codex-responses)
    # is reachable only by reusing the CATALOG route id `openai-codex`, and a hand-declared route must
    # name `api` in openai-completions | openai-responses | anthropic-messages -- any other value fails
    # the adapter's Config schema for the WHOLE providers dict (that is what took every provider down
    # once; see the DSH_PROVIDER_REMOVE line in deployment.yaml). This exact block passes that schema,
    # verified in the pod 2026-09-19.
    #
    # api: openai-responses -- LiteLLM's chatgpt/ provider is Responses-native (it talks to
    # chatgpt.com/backend-api/codex/responses), and this model's reasoning + function tools need the
    # Responses protocol, as the paid gpt-6-astra route in litellm.yaml (openai/responses/...) already
    # established. Not openai-completions: chat-completions through this provider is unverified.
    #
    # apiKeyEnv: LITELLM_API_KEY -- the same env the litellm provider above reads (the ESO-synced
    # `dsh-litellm` Secret). The subscription token itself lives in the ai namespace (Secret
    # litellm-chatgpt-auth, mounted in the litellm pod at /chatgpt-auth) and NEVER in this pod: dsh
    # authenticates to the gateway, the gateway authenticates to OpenAI.
    #
    # A NON-CATALOG route inherits nothing, so every model field is spelled out. 272000 / 128000 are
    # the catalog's own gpt-6-astra values; input: [text, image] is what makes attachments work at all
    # (a hand-entered model is text-only until it says otherwise -- see the litellm block above).
    # reasoningEfforts mirrors the catalog's thinkingLevelMap for gpt-6-astra. "off" is QUOTED on
    # purpose: YAML 1.1 reads a bare `off` as the boolean false, and the key would then be false, not
    # the string "off" the adapter looks up.
    #
    # ACCEPTED PARAMETER LOSS on this path (recorded in ADR 0026; measured in the pinned LiteLLM
    # 1.101.0 image 2026-09-19): max_output_tokens is never sent -- maxTokens here sizes the model
    # and is not a per-request cap, so the model's own 128k ceiling applies; text.verbosity,
    # prompt_cache_key and parallel_tool_calls are dropped by LiteLLM's chatgpt Responses transform
    # (default verbosity; backend default for parallel tool calls; prefix caching rides on the
    # session_id header LiteLLM sets per call). None of these changes an answer's correctness.
    openai-codex-realjaynesage:
      displayName: OpenAI Codex (realjaynesage)
      apiKeyEnv: LITELLM_API_KEY
      api: openai-responses
      baseURL: http://litellm.ai.svc.cluster.local:4000/v1
      transport: sse
      models:
        - id: gpt-6-astra-realjaynesage
          name: GPT-6 Astra
          contextWindow: 272000
          maxTokens: 128000
          input: [text, image]
          reasoningEfforts: { "off": null, minimal: low, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
