# Seed for $DSH_HOME/settings.yaml — copied in ONCE, on first boot, only if the file is absent.
# dsh owns this file afterwards (the Settings UI writes it, and adapters re-read it per request),
# so this must never overwrite a live one. The PROVIDER blocks below are the exception: they are
# infrastructure this repo owns, and seed-settings in deployment.yaml re-splices each of them into
# the live file on every boot (reconcile-provider.js), so an edit here reaches the running pod.
#
# EVERY MODEL dsh OFFERS COMES FROM llm-router (router.chifor.me) since 2026-10-19 (ADR 0039).
# The LiteLLM provider, both Codex subscription providers and the shipped DeepSeek adapter are
# gone; deployment.yaml unwrites the PVC copies of the old blocks and cordis.patch.yml disables
# the DeepSeek row. One router key serves all three providers below:
#
#   key_353539972cec  "dsh all routes (ailab dsh.chifor.me, ns dsh)"  routes: all, 365 days
#
# escrowed as the field LLM_ROUTER_API_KEY of af/dsh/credentials in OpenBao. ESO projects that
# document into /dsh-credentials (openbao-eso.yaml) and openbao-credentials.mjs resolves
# `apiKeyEnv: LLM_ROUTER_API_KEY` from the projected file per request -- no env var, no
# Deployment change on rotation.
#
# WHY THREE PROVIDERS AND NOT ONE. A provider speaks exactly one protocol, and the router does not
# serve every model on both. Measured from this pod on 2026-10-19 with the key above:
#   /v1/chat/completions  200 with a tool call for Codex, Claude and the local Qwen models
#   /v1/responses         200 for Codex; `response.failed` for Claude and for Qwen
# Codex stays on the Responses protocol (reasoning items survive across turns there, which chat
# completions drops); Claude and Qwen use Chat Completions. The split also gives the model picker
# one heading per family.
#
# WHY https://router.chifor.me AND NOT A CLUSTER ADDRESS. The router's NetworkPolicy admits only
# its edge (the Caddy hold proxy that drains requests during router upgrades), and the edge admits
# only cloudflared. The public hostname is the router's documented client path, dsh already has
# general 443 egress (networkpolicy.yaml), and a request through it is held -- not dropped --
# across a router rollout. Measured from this pod: /v1/models 200, first token in 1-4 s.
#
# THE MODEL LISTS ARE HAND-WRITTEN from GET /v1/models with that key (2026-10-19). A model added
# on the router does not appear here by itself: add a row, and the next pod start reconciles it.
# The two image models (qwen-image-2.1, qwen-image-2.1-fast) are deliberately absent -- they are
# image-generation endpoints, not chat models, and dsh would fail every turn sent to them.
#
# IMAGE INPUT follows the router, not the model card: the router refuses an image on an account
# whose visionModels lacks the model, and today only gpt-6-luna is listed there (every local
# account reports vision: false). So `input: [text, image]` appears on exactly that one row; a
# hand-entered model is text-only until it says otherwise.
llm-pi-ai:
  providers:
    # Codex (ChatGPT subscriptions codex .. codex-5), through the router's `pool-codex` smart pool.
    #
    # X-Router-Route: pool-codex puts each request in the pool's MODEL MODE: the pool's `*` targets
    # serve the requested model on whichever subscription the smart strategy picks -- quota-aware,
    # and a conversation stays on one account (thread placement by prompt_cache_key). Without the
    # header a model name resolves to the router's DIRECT policy instead: plain priority over the
    # accounts in configuration order, which keeps hitting `codex` first even when its weekly window
    # is spent. Dev workers and the codex reviewer use the same pool.
    #
    # The next three settings are the ones the old LiteLLM Codex route needed, and both defects
    # reproduce through the router (measured from this pod 2026-10-19 on gpt-6-astra):
    #   * compat.supportsStrictMode: true. Without it the generic openai-responses adapter OMITS
    #     `strict` on function tools, the backend defaults it to true, and constrained decoding fills
    #     every optional property -- a bash call came back with sandbox_permissions:
    #     "workspace-write", which dsh refuses as a non-widening escalation. strict:false returned
    #     only {command}.
    #   * reasoningEfforts WITHOUT an `off` row, and `reasoning: medium`. With no effort selected
    #     pi-ai would send reasoning.effort "none", which the backend answers with HTTP 400
    #     unsupported_value (measured again through the router). The absent row makes `off` an
    #     explicit null so pi-ai omits `reasoning`, and the route default makes a fresh session
    #     usable at once.
    # contextWindow/maxTokens are the installed pi-ai catalog's openai-codex values (272000 /
    # 128000); gpt-6-sol and gpt-6-luna are not in that catalog and are given the family's values.
    llm-router-codex:
      displayName: LLM Router (Codex)
      apiKeyEnv: LLM_ROUTER_API_KEY
      api: openai-responses
      baseURL: https://router.chifor.me/v1
      headers: { X-Router-Route: pool-codex }
      transport: sse
      reasoning: medium
      compat: { supportsStrictMode: true }
      models:
        - id: gpt-6-astra
          name: GPT-6 Astra
          contextWindow: 272000
          maxTokens: 128000
          reasoningEfforts: { minimal: low, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
        - id: gpt-6-sol
          name: GPT-6 Sol
          contextWindow: 272000
          maxTokens: 128000
          reasoningEfforts: { minimal: low, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
        - id: gpt-6-luna
          name: GPT-6 Luna
          contextWindow: 272000
          maxTokens: 128000
          input: [text, image]
          reasoningEfforts: { minimal: low, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
        - id: gpt-5.6-sol
          name: GPT-5.6 Sol
          contextWindow: 272000
          maxTokens: 128000
          reasoningEfforts: { minimal: low, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
        - id: gpt-5.6-terra
          name: GPT-5.6 Terra
          contextWindow: 272000
          maxTokens: 128000
          reasoningEfforts: { minimal: low, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
        - id: gpt-5.6-luna
          name: GPT-5.6 Luna
          contextWindow: 272000
          maxTokens: 128000
          reasoningEfforts: { minimal: low, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
    # Claude (subscriptions claude .. claude-5), by model name: the router's direct policy tries the
    # accounts that list the model, up to three. Not through `pool-claude`: that pool's targets are
    # pinned to `sonnet`, so in model mode it would serve sonnet and refuse the other three.
    # 200000 is the conservative window (the router does not publish one); dsh compacts against it.
    llm-router-claude:
      displayName: LLM Router (Claude)
      apiKeyEnv: LLM_ROUTER_API_KEY
      api: openai-completions
      baseURL: https://router.chifor.me/v1
      models:
        - id: opus
          name: Claude Opus
          contextWindow: 200000
          maxTokens: 64000
        - id: sonnet
          name: Claude Sonnet
          contextWindow: 200000
          maxTokens: 64000
        - id: haiku
          name: Claude Haiku
          contextWindow: 200000
          maxTokens: 64000
        - id: fable
          name: Claude Fable
          contextWindow: 200000
          maxTokens: 64000
    # The estate's self-hosted Qwen servers, as the router names them. Where the old LiteLLM ids went:
    #   qwen3.8-27b-vllm-cloud / -vllm-fast-cloud  -> qwen3.8-27b  (a router ROUTE: cloud2 vLLM
    #                                                 192.168.0.28:18020, which serves that name)
    #   qwen3.8-flash-next-cloud                   -> qwen3.8-flash-next
    #   qwen3.8-27b-fp8-unc-cloud                  -> qwen3.8-27b-fp8
    #   qwen3.5-122b-cloud, qwen3-coder-30b-a3b-cloud, qwen3.8-27b-ailab  -> the same names, no suffix
    # qwen3.8-27b-w4a16 is new to dsh (it was the second LiteLLM deployment behind -vllm-cloud).
    # No contextWindow, as before: the route's defaultContextWindow (262144) applies.
    llm-router-local:
      displayName: LLM Router (Local)
      apiKeyEnv: LLM_ROUTER_API_KEY
      api: openai-completions
      baseURL: https://router.chifor.me/v1
      models:
        - id: qwen3.8-flash-next
        - id: qwen3.8-27b
        - id: qwen3.8-27b-ailab
        - id: qwen3.8-27b-fp8
        - id: qwen3.8-27b-w4a16
        - id: qwen3.5-122b
        - id: qwen3-coder-30b-a3b
# The default route for a NEW session. On a fresh volume this is simply seeded. On an existing one
# reconcile-default-model.js copies this block over the live one ONLY when the live block still
# names a retired provider (litellm, openai-codex, openai-codex-realjaynesage, deepseek-official),
# so a default the user picked later from the router's models is never overwritten.
agent-default-model:
  provider: llm-router-local
  model: qwen3.8-flash-next
