# dsh reads the LiteLLM key from OpenBao, not from a SOPS Secret.
#
# WHY: the credential has to reach a namespace that is deliberately isolated, and this repo
# cannot mint a SOPS Secret (the age key is not available here). More to the point, the estate
# rule is that tokens live in OpenBao — so the key is stored at af/estate/litellm and pulled in
# by External Secrets, the same way agentforge-broker and the tenants do it.
#
# The OpenBao side (created 2026-09-07, breakglass ceremony per
# docs/runbooks/openbao-estate-credentials.md):
#   af/estate/litellm            field `master_key`  (the value; nothing here ever prints it)
#   policy af-app-dsh            read on af/data/estate/litellm ONLY — one path, read-only
#   auth/kubernetes/role/af-app-dsh   bound_service_account_names=dsh-eso, namespaces=dsh
# Named af-app-dsh rather than af-operator-dsh: the af-operator-* family is AgentForge's, and
# this is an ordinary app, not part of that control plane.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dsh-eso
automountServiceAccountToken: false   # ESO mints its own token; nothing else may use this SA
---
# The CA that signed OpenBao's server cert, materialised locally so the SecretStore can verify
# TLS. Issuing a throwaway cert from the same ClusterIssuer is how every other namespace in this
# estate gets `ca.crt` — the leaf is never used, only the chain.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-ca
spec:
  secretName: openbao-tls
  duration: 8760h
  renewBefore: 720h
  commonName: openbao-ca-ref
  dnsNames: ["openbao-ca-ref.dsh.svc"]
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: ailab-ca, kind: ClusterIssuer, group: cert-manager.io }
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: dsh-store
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: af
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: af-app-dsh
          serviceAccountRef: { name: dsh-eso }
      caProvider: { type: Secret, name: openbao-tls, key: ca.crt }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dsh-litellm
spec:
  refreshInterval: 1h
  secretStoreRef: { name: dsh-store, kind: SecretStore }
  target:
    name: dsh-litellm
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef: { key: estate/litellm, property: master_key }
---
# The Codex credential, same store and same pattern as the LiteLLM key above.
#
# WHY NOT AN OPENBAO AGENT IN THE POD. The dev-workers run a bao agent plus the `cred` helper,
# and the obvious move is to do the same here. It would be a serious regression: an agent writes
# a sink token into the pod, and THIS pod executes model-authored code and offers
# `danger-full-access` in its UI -- the agent has a shell, so the sink becomes a credential-
# minting oracle for whatever the role allows. External Secrets keeps the token out of the
# workload entirely: ESO mints its own token in its own namespace and writes only the resolved
# value, which is why the dsh-eso ServiceAccount above carries
# automountServiceAccountToken: false. dsh has no first-party OpenBao/Vault plugin either
# (checked: dsh-credentials-vault, dsh-credentials-openbao, dsh-openbao, dsh-plugin-vault all
# absent from npm), so there is nothing to install in-process even if we wanted it.
#
# RE-EXAMINED 2026-09-10 and the answer held, on a stronger argument than the one above. The
# obvious rescue is a SINKLESS agent -- a listener on 127.0.0.1 with `use_auto_auth_token`, so
# there is no token FILE for the pod to read. That does not work, for two reasons found in
# cross-review rather than by inspection:
#   * containers in a pod share localhost, so model-authored code in the dsh container reaches
#     that listener on exactly the same terms this plugin would; and
#   * the listener attaches the agent's token to whatever is asked, and
#     `GET /v1/auth/token/lookup-self` returns the token itself at `data.id`, while
#     `POST /v1/auth/token/renew-self` returns it at `auth.client_token`.
# So "no sink file" does NOT mean "no token in the pod". Denying those two endpoints to the
# identity does not rescue it either: it breaks the agent's renewal path, leaving auto-auth to
# re-authenticate from scratch instead, and it is a narrow patch over a premise that was already
# wrong. The sinkless design is the same regression wearing a better costume.
#
# WHAT DID CHANGE. The gap the agent was being considered FOR -- a credential added in OpenBao
# needing a manifest edit here before dsh could use it -- is real, and is now closed by the
# discovery ExternalSecret at the bottom of this file plus openbao-credentials.mjs. ESO stays the
# transport; only the shape of what it syncs changed.
#
# NOT DECLARED, DELIBERATELY: the dsh-codex ExternalSecret was removed on 2026-09-11. The OpenBao
# side does not exist --
#   af/estate/codex             field `api_key`   (verified absent: `bao kv metadata get` -> no value)
#   policy af-app-dsh           has no estate/codex grant, and the policy is OWNED by
#                               security/openbao/dsh-provision-job.yaml, whose drift guard REFUSES
#                               a hand-added grant -- it changes there, in git, or not at all
# -- and an ExternalSecret that can never sync is NotReady FOREVER. The `apps` Flux Kustomization
# runs wait:true, so from 2026-09-10T15:44Z this one object failed the whole apps health check every
# 5 minutes (lastAppliedRevision stuck at d965063 while newer manifests were still being applied)
# and held edge-connector (cloudflared) and agentforge-tenants in DependencyNotReady for a day.
# That is exactly the "a not-Ready thing must never wedge the layer" rule openbao.yaml,
# agentforge-tenants.yaml and agentforge/db-migrate.yaml already state.
#
# Nothing consumes the Secret: deployment.yaml keeps CODEX_API_KEY as an `optional: true`
# secretKeyRef on dsh-codex (left unchanged, so this removal is inert to the pod), and codex
# 0.153.4 ignores CODEX_API_KEY anyway (see the env comment there). Flux prunes the in-cluster
# object on the next reconcile after this merges.
#
# RE-ADD ONLY after both OpenBao writes have landed and `bao kv get -mount=af estate/codex`
# succeeds under the af-app-dsh policy -- and then it will sync on its first refresh instead of
# wedging the layer:
#   apiVersion: external-secrets.io/v1
#   kind: ExternalSecret
#   metadata: { name: dsh-codex }
#   spec:
#     refreshInterval: 1h
#     secretStoreRef: { name: dsh-store, kind: SecretStore }
#     target: { name: dsh-codex, creationPolicy: Owner }
#     data:
#       - secretKey: api_key
#         remoteRef: { key: estate/codex, property: api_key }
#
# EVERY OTHER dsh CREDENTIAL, discovered rather than enumerated.
#
# THE PROBLEM THIS SOLVES. The dsh-litellm ExternalSecret above (and the parked dsh-codex one) each
# name ONE OpenBao path and project it into ONE env var declared in the Deployment. That means adding a credential to OpenBao is not
# enough for dsh to see it: it needs a new ExternalSecret, a new env var, a commit, a review and a
# Flux reconcile. OpenBao is meant to be the one place a credential is managed, so that rotating or
# ADDING one reaches every agent on every machine with no per-machine step. dsh was the exception.
#
# `dataFrom.extract` closes it. Every FIELD of the single KV-v2 document `af/dsh/credentials`
# becomes a KEY of the `dsh-credentials` Secret, so a field added in OpenBao appears in the pod at
# the next refresh with no change to this repo. The credentials are then read through the seam by
# openbao-credentials.mjs -- see that file for why a plugin is needed and not just a mount.
#
# WHY `extract` OVER ONE DOCUMENT RATHER THAN `find` OVER A PREFIX. `find` would discover
# per-credential documents under a prefix and is the better shape if these ever need separate
# OpenBao ACLs. It also needs `list` on the metadata prefix plus `read` covering paths that do not
# exist yet. `extract` needs `read` on exactly ONE path, which is a materially smaller grant for
# the same "no per-machine step" property, and this pod runs model-authored code. Start narrow.
#
# WHY NOT AN OPENBAO AGENT SIDECAR. The comment above says no; a 2026-09-10 cross-review made the
# answer stronger. Containers in a pod SHARE localhost, so an agent listener with
# `use_auto_auth_token` is reachable by model-authored code exactly as it is by the plugin, and
# `GET /v1/auth/token/lookup-self` returns the token at `data.id` (`renew-self` returns it at
# `auth.client_token`) -- so "no sink file" does not mean "no token in the pod". Denying those
# endpoints does not fix it either: the agent renews with the same token, so the denial breaks the
# agent. ESO keeps the OpenBao identity in ESO's own namespace and hands this pod only values.
#
# THE OPENBAO SIDE is owned by kubernetes/apps/infrastructure/security/openbao/dsh-provision-job.yaml:
#   af/dsh/credentials          one field per credential, the field NAME being the dsh reference
#                               (a POSIX identifier). The Job CREATES it with the DSH_OPENBAO_CANARY
#                               marker and never touches the contents again; every real field is
#                               an operator write (docs/runbooks/dsh.md, "Git access to the forge").
#   policy af-app-dsh           read on af/data/dsh/credentials, written by that Job.
# Until the Job has run, this ExternalSecret reports NotReady, the Secret is absent, and the
# Deployment mounts it `optional: true` -- so the harness runs exactly as before, resolving
# LITELLM_API_KEY from its env var. The plugin treats an absent mount as "OpenBao has nothing".
#
# FIELDS IN USE, and who reads them -- because "discovered, not enumerated" is about the
# transport, not about documentation:
#   GITEA_USER, GITEA_PAT       read by git-credential-openbao.sh (the agent's git identity for
#                               git.chifor.me), NOT through openbao-credentials.mjs: the shell
#                               that runs git never sees dsh's credentials service.
# Whatever else lands here is readable by the agent, which is why the document must hold only
# credentials dsh is meant to have (see the volume comment in deployment.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dsh-credentials
spec:
  # Deliberately shorter than the 1h above. This is the path a rotation travels, and the pod also
  # has to wait for kubelet to propagate the change into the mounted volume afterwards; an hour of
  # staleness on top of that is not a credential store, it is a cache.
  #
  # A POLLING PERIOD, NOT A STALENESS BOUND. Freshness here is eventual and bounded by nothing in
  # particular: this interval, plus kubelet's own sync period, plus -- if OpenBao is unreachable --
  # however long the failure lasts, because a successful sync leaves the previous values in the
  # Secret and readable indefinitely. The default deletionPolicy (Retain) likewise keeps the whole
  # Secret if the remote document is deleted; removing a FIELD from a document that still fetches
  # does propagate. Anything needing a hard revocation guarantee must revoke at the ISSUER.
  refreshInterval: 5m
  secretStoreRef: { name: dsh-store, kind: SecretStore }
  target:
    name: dsh-credentials
    creationPolicy: Owner
    # Owner + no `template`: the Secret's keys are exactly the document's field names, which is
    # what makes discovery work. Do not add a `template` here -- it would pin the key set and
    # reintroduce the per-credential edit this exists to remove.
  dataFrom:
    - extract:
        key: dsh/credentials
