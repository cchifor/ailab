# DeepSeek Harness (dsh) at https://dsh.chifor.me.
#
# ONE REPLICA, Recreate. dsh owns a single $DSH_HOME (RWO) and the release documents no readiness or
# shutdown behaviour under concurrent replicas; a rolling update would briefly run two processes over
# one home directory and one credential lock. Not worth finding out.
#
# ROOT OF A DEDICATED HOSTNAME, never a sub-path: the frontend injects <base href="/"> and auth
# redirects to /, so https://home.chifor.me/dsh/ cannot work even with path stripping at the proxy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: dsh } }
  template:
    metadata:
      labels: { app: dsh }
    spec:
      terminationGracePeriodSeconds: 30   # SIGTERM starts root disposal on a 5s budget; give it room
      automountServiceAccountToken: false # it executes model-generated code; do not hand it the API
      # runAsNonRoot is deliberately ABSENT here and set per-container instead. The
      # fix-ownership initContainer below must run as root, and a pod-level runAsNonRoot: true
      # would forbid that. fsGroup stays, but note it does NOT solve the ownership problem it
      # looks like it should: these PVCs are local-path (hostPath-backed) and kubelet applies no
      # fsGroup ownership management to them, and fsGroup sets the GROUP rather than the owner.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # The agent could not read back a single file it produced: every read_image ended in
        #     EPERM: operation not permitted, chmod '/dsh-home'
        # dsh chmods its storage root, and these mount points are created root:root mode 777 by
        # the local-path provisioner. Mode 777 is not enough -- chmod(2) needs OWNERSHIP or
        # CAP_FOWNER, so uid 1000 was refused on a directory it could otherwise write freely.
        #
        # NON-RECURSIVE on purpose. Only the two mount-point directories are root-owned; every
        # entry inside them is already node:node (verified live), so recursion would walk ~71 MiB
        # of session history on every pod start to change nothing.
        - name: fix-ownership
          image: mirror.gcr.io/library/node:22
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              chown 1000:1000 /dsh-home /workspace
              echo "owner now: $(stat -c %U:%G /dsh-home) /dsh-home, $(stat -c %U:%G /workspace) /workspace"
          volumeMounts:
            - { name: home, mountPath: /dsh-home }
            - { name: workspace, mountPath: /workspace }
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # CHOWN only. Root with everything else dropped is still a far smaller surface than
            # the default capability set this would otherwise inherit.
            capabilities: { drop: [ALL], add: [CHOWN] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
        # Fail loudly if the install Job has not populated the app volume, rather than letting the
        # main container crash-loop on a missing binary.
        - name: wait-for-install
          image: mirror.gcr.io/library/node:22
          env:
            - { name: DSH_VERSION, value: "0.1.5-alpha.2" }
            - { name: DSH_BUILD, value: "glibc" }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              BIN="/app/${DSH_VERSION}-${DSH_BUILD}/node_modules/.bin/dsh"
              MARK="/app/${DSH_VERSION}-${DSH_BUILD}/.installed"
              for i in $(seq 1 60); do
                # Both conditions, not just the binary. npm creates node_modules/.bin/dsh part-way
                # through the install; the Job writes .installed only after it completes AND
                # verifies the binary. Waiting on the executable alone can therefore start dsh
                # against a half-populated tree -- a race the forced glibc reinstall makes real,
                # because this path is empty on first roll rather than already complete.
                [ -x "$BIN" ] && [ -f "$MARK" ] && { echo "dsh ${DSH_VERSION} present"; exit 0; }
                echo "waiting for the dsh-install Job to populate /app/${DSH_VERSION}-${DSH_BUILD} ($i/60)"; sleep 5
              done
              echo "ERROR: $BIN missing -- is the dsh-install-* Job for this version complete?" >&2
              exit 1
          volumeMounts: [{ name: app, mountPath: /app, readOnly: true }]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
        - name: seed-settings
          image: mirror.gcr.io/library/node:22
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -s /dsh-home/settings.yaml ]; then
                # dsh owns this file once written (the Settings UI writes it), so it is NOT
                # overwritten -- but the litellm PROVIDER block inside it is infrastructure this
                # repo owns, and leaving that stale broke every model in dsh when #547 renamed the
                # local routes to their -cloud names. reconcile-provider.js rewrites only that
                # block and preserves the rest byte-for-byte. See the header there.
                echo "settings.yaml exists -- reconciling the provider blocks this repo owns"
                node /seed/reconcile-provider.js
                # REMOVE the broken `codex` provider, do not reconcile it. It was seeded with
                # `api: openai-codex-responses`, which the profile schema does not accept, and
                # schema validation covers the WHOLE providers dict -- so that one value failed
                # the entire section and took litellm down with it. No models, dead composer.
                #
                # Dropping it from the seed is not enough: settings.yaml lives on the PVC, so an
                # already-written block survives every boot. This actively unwrites it.
                #
                # SAFE TO KEEP INDEFINITELY: with the provider absent it prints "not present;
                # nothing to remove" and exits 0. Remove this line only when the codex route is
                # re-added in its correct form (see settings.seed.yaml), and in that case it must
                # be replaced by a reconcile of the new provider name, not simply deleted.
                DSH_PROVIDER=codex DSH_PROVIDER_REMOVE=1 node /seed/reconcile-provider.js
              else
                echo "seeding settings.yaml with the LiteLLM provider"
                # install -m 0644, NOT cp: the seed ConfigMap is mounted defaultMode 0444, and cp
                # preserves that, leaving a READ-ONLY settings.yaml. dsh owns this file after the
                # first boot -- the Settings UI writes it -- so a 0444 copy silently breaks every
                # later edit through the app. Observed: EACCES on the live volume, and the file
                # sat at -r--r--r-- until it was chmod-ed by hand.
                install -m 0644 /seed/settings.seed.yaml /dsh-home/settings.yaml
              fi
              # $DSH_HOME/AGENTS.md is the user-global instruction file the agent-instructions
              # row reads, and DSH_HOME is /dsh-home here (see the container env), so this is the
              # path the plugin actually looks at.
              #
              # OUTSIDE the if/else ON PURPOSE. This line first shipped INSIDE the else branch,
              # which runs only when settings.yaml is absent OR EMPTY (`-s` tests for a non-empty
              # file) -- in practice, a first boot onto a fresh volume. On this deployment
              # settings.yaml has existed since 2026-09-07, so that branch never runs and
              # AGENTS.md would never have been installed at all: the feature would have been
              # inert on the one estate it was written for, silently, while its own comment
              # claimed it was unconditional. It is unconditional now, which is what the comment
              # always said.
              #
              # UNCONDITIONAL rather than seed-once, for the same reason cordis.patch.yml is
              # reinstalled every boot: it is deployment-owned, and leaving it to the volume is
              # the unmanaged-state trap this directory has already been bitten by twice.
              #
              # THIS OVERWRITES the file each time the initContainer runs -- which is on pod
              # creation, NOT on a container restart. The agent CAN edit /dsh-home with its own
              # shell, so a hand-edit there survives until the next pod roll and is then lost.
              # That is the intended trade (git owns this file), but it is a trade, not an
              # impossibility: /dsh-home is writable by uid 1000 by design.
              install -m 0644 /seed/agents.seed.md /dsh-home/AGENTS.md
              # patchReload MUST NOT be "live" in a container or dsh crash-loops on FIRST boot.
              # MEASURED, not guessed -- see fix-profile.js for the mechanism and the evidence.
              mkdir -p /dsh-home/profiles/web
              # Reinstalled UNCONDITIONALLY: this patch layer is entirely ours, nothing in the app
              # writes it, and it is what keeps the browser session from expiring after 30 days AND
              # keeps trustedHosts populated. It lived only on the PVC until 2026-09-08, where a
              # volume rebuild would have silently reverted both. install -m 0644, not cp, for the
              # same 0444-ConfigMap-mode reason as settings.yaml above.
              install -m 0644 /seed/cordis.patch.yml /dsh-home/profiles/web/cordis.patch.yml
              # The SearXNG search provider, installed BESIDE cordis.patch.yml because that is the
              # directory a row's relative `name:` specifier resolves against. It cannot be npm-
              # installed into /app: dsh resolves bare specifiers from the PROFILE directory, whose
              # node_modules is a symlink farm of dsh's OWN dependency closure only. A sibling
              # package installed next to dsh is not in that closure, so a bare specifier throws
              # MODULE_NOT_FOUND and boot() rethrows -- crash-looping the pod, not degrading it.
              install -m 0644 /seed/searxng-search.mjs /dsh-home/profiles/web/searxng-search.mjs
              # The OpenBao credentials provider, beside it and for the same resolution reason.
              # Installed UNCONDITIONALLY on every boot, like cordis.patch.yml: the row that names
              # it is in that patch, and a profile carrying the row without the file is a
              # MODULE_NOT_FOUND at boot -- so these two must never be able to drift apart.
              install -m 0644 /seed/openbao-credentials.mjs /dsh-home/profiles/web/openbao-credentials.mjs
              # Agent teams (WP-1): project the GitOps-owned preset root.
              #
              # RECREATED FROM SCRATCH each boot, not merged into. A team removed from git
              # must disappear from the roster, and a roster has no per-preset off switch --
              # a stale team directory left behind stays SELECTABLE. Same discipline as
              # cordis.patch.yml being reinstalled unconditionally above.
              #
              # ConfigMap keys cannot contain "/", so the teams ship flattened as
              # <team>.<file> and the directory tree is rebuilt here. Mode 0644/0755 for the
              # same 0444-ConfigMap-mode reason as settings.yaml: the projected tree is read
              # by dsh as uid 1000 and must not inherit the mount's read-only bits.
              # NOT `rm -rf /dsh-teams`: this path is the emptyDir MOUNT POINT, so rm
              # clears the contents and then rmdir()s the mount itself, which the kernel
              # refuses with EBUSY -- `rm: cannot remove '/dsh-teams': Device or resource
              # busy`, exit 1. Under the `set -eu` at the top of this script that aborts
              # the initContainer on EVERY boot, including the first empty one, and
              # crash-loops the pod. Verified in a container before this line was written.
              # -mindepth 1 resets the CONTENTS and leaves the mount alone; -delete also
              # takes hidden entries, which a `rm -rf /dsh-teams/*` glob would miss.
              find /dsh-teams -mindepth 1 -delete
              for f in /seed/team-*.preset.yml; do
                [ -e "$f" ] || continue
                b=$(basename "$f" .preset.yml)
                # A team whose composition is missing would otherwise fail mid-projection,
                # and `install`'s own "cannot stat" names neither the team nor the cause in
                # pod logs. Fails the initContainer deliberately rather than leaving a
                # half-built directory the roster would list as a broken preset.
                if [ ! -e "/seed/$b.agent.cordis.yml" ]; then
                  echo "ERROR: team $b has a preset.yml but no agent.cordis.yml in the ConfigMap" >&2
                  exit 1
                fi
                mkdir -m 0755 -p "/dsh-teams/$b"
                install -m 0644 "$f" "/dsh-teams/$b/preset.yml"
                install -m 0644 "/seed/$b.agent.cordis.yml" "/dsh-teams/$b/agent.cordis.yml"
                echo "projected team: $b"
              done
              # The loop above is driven by *.preset.yml, so a composition with NO matching
              # preset.yml is simply never visited -- it ships in the ConfigMap, occupies a
              # content hash, and mounts nothing, with no signal anywhere. Asymmetric guards
              # only catch the half you thought of, so check the other direction too.
              for c in /seed/team-*.agent.cordis.yml; do
                [ -e "$c" ] || continue
                b=$(basename "$c" .agent.cordis.yml)
                if [ ! -d "/dsh-teams/$b" ]; then
                  echo "ERROR: team $b has an agent.cordis.yml but no preset.yml -- it would" >&2
                  echo "ERROR: ship in the ConfigMap and mount nothing" >&2
                  exit 1
                fi
              done
              # Profile plugin closure (WP-3): project what the install Job staged, and set
              # dsh.profile.bundles to exactly what actually landed.
              #
              # THE BUNDLES LIST IS THE DANGEROUS PART. A name in dsh.profile.bundles whose
              # package is absent throws in loadProfileDirectory -- an unhandled throw at boot,
              # which on a 1-replica Recreate Deployment is an outage, not a missing feature.
              # Verified in a container. So: SET the list from what is present on disk, never
              # merge into it (a git revert would otherwise leave a stale name behind), and if
              # the closure is missing entirely, ship the shipped bundles alone and log loudly.
              #
              # The marker is ADVISORY here, deliberately. wait-for-install gates on the DSH
              # install marker only; gating pod start on this one would turn "no codex provider"
              # into "no dsh".
              STAGE="/app/profiles/${DSH_VERSION}-${DSH_BUILD}-${DSH_PLUGINSET}/web"
              SIGNAL="/app/profiles/${DSH_VERSION}-${DSH_BUILD}-${DSH_PLUGINSET}/.staging-state"
              P=/dsh-home/profiles/web
              # WAIT FOR A TERMINAL STAGING STATE, bounded. wait-for-install gates on the DSH
              # install marker, which the Job writes BEFORE it stages plugins -- so on the first
              # rollout of a new plugin set this container can arrive while staging is still
              # running. Projecting then would drop the live closure and finish with shipped
              # bundles only, and the Job succeeding a minute later would never revisit this
              # pod: it would sit without its providers until something unrelated rolled it.
              #
              # The signal is terminal by construction (ok|failed|none), so this waits for a
              # DECISION, not for success -- a completed failure degrades immediately instead of
              # burning the budget.
              #
              # AND IT IS BOUNDED, because the alternative is worse. If the Job is absent,
              # crashed, or predates this mechanism, no signal ever appears; blocking forever
              # would convert a missing OPTIONAL feature into a dead harness. 120s against a
              # staging step measured at ~5s, then degrade loudly.
              waited=0
              while [ ! -f "$SIGNAL" ] && [ "$waited" -lt 120 ]; do
                [ "$waited" = 0 ] && echo "waiting for the install Job to finish staging plugins..."
                sleep 5
                waited=$((waited + 5))
              done
              if [ -f "$SIGNAL" ]; then
                echo "staging state: $(cat "$SIGNAL") (after ${waited}s)"
              else
                echo "WARNING: no staging state after ${waited}s -- is the dsh-install Job for this"
                echo "WARNING: plugin set present and complete? Continuing WITHOUT the providers."
              fi
              # STAGE-THEN-SWAP, and NEVER fatal. The obvious shape -- rm -rf the live closure
              # then cp the new one -- has a hole big enough to lose the harness through: under
              # `set -eu` a failed copy exits this container with the old modules already gone
              # AND the bundles list still naming them, which is precisely the crash-loop this
              # whole design exists to avoid. So the copy lands beside the live tree, is proven,
              # and only then replaces it; and every step is guarded so a projection failure
              # degrades to "no providers" instead of "no dsh".
              #
              # reconcile-bundles.js runs UNCONDITIONALLY afterwards, whatever happened above:
              # it is what makes the bundles list agree with what is actually on disk, so it
              # must never be skipped by an early exit.
              if [ -f "${STAGE}/.installed" ] && [ -d "${STAGE}/node_modules" ]; then
                ok=1
                rm -rf "$P/node_modules.new" || ok=0
                [ "$ok" = 1 ] && { cp -a "${STAGE}/node_modules" "$P/node_modules.new" || ok=0; }
                # Prove the copy before trusting it: a marker can outlive its closure, and an
                # empty directory copies successfully.
                [ "$ok" = 1 ] && [ -z "$(ls -A "$P/node_modules.new" 2>/dev/null)" ] && {
                  echo "WARNING: staged closure copied EMPTY -- discarding"; ok=0; }
                if [ "$ok" = 1 ]; then
                  # EVERY step guarded. `set -e` also fires on a failing command at the right of
                  # `&&`, so `[ -d X ] && mv ...` is NOT safe here -- that shape is exactly how
                  # an aborted swap would skip the reconciler and leave the bundles list naming
                  # packages that are no longer on disk.
                  rm -rf "$P/node_modules.old" || ok=0
                  if [ "$ok" = 1 ] && [ -d "$P/node_modules" ]; then
                    mv "$P/node_modules" "$P/node_modules.old" || ok=0
                  fi
                  [ "$ok" = 1 ] && { mv "$P/node_modules.new" "$P/node_modules" || ok=0; }
                fi
                if [ "$ok" = 1 ]; then
                  # pnpm settings travel with the closure: nodeLinker: hoisted is what made it
                  # relocatable, and minimumReleaseAgeExclude is what lets pnpm accept the
                  # -alpha bundles if the supported CLI is ever run here by hand. Non-fatal:
                  # a missing settings file does not invalidate the closure itself.
                  install -m 0644 "${STAGE}/pnpm-workspace.yaml" "$P/pnpm-workspace.yaml" \
                    || echo "WARNING: could not install pnpm-workspace.yaml"
                  rm -rf "$P/node_modules.old" || true
                  echo "projected profile plugin closure from ${STAGE}"
                else
                  # Put back whatever was working before rather than leaving nothing.
                  rm -rf "$P/node_modules.new" || true
                  if [ -d "$P/node_modules.old" ] && [ ! -d "$P/node_modules" ]; then
                    mv "$P/node_modules.old" "$P/node_modules" || true
                  fi
                  rm -rf "$P/node_modules.old" || true
                  echo "WARNING: projecting the plugin closure FAILED -- keeping the previous"
                  echo "WARNING: closure if there was one. reconcile-bundles will list only what"
                  echo "WARNING: is actually present, so dsh still boots."
                fi
              else
                echo "WARNING: no staged plugin closure at ${STAGE} -- dsh will boot with the"
                echo "WARNING: shipped bundles only. A team's delegation tool is then simply"
                echo "WARNING: ABSENT -- dsh-tool-subagent registers its tool only while the named"
                echo "WARNING: provider exists -- rather than the preset listing as broken."
                rm -rf "$P/node_modules" || true
              fi
              # ORDER MATTERS, and the obvious order is wrong. fix-profile.js CREATES the
              # profile manifest when it is absent (a fresh dsh-home), so running the bundle
              # reconcile first means that on a first boot there is no manifest to reconcile:
              # it exits early, fix-profile then writes the manifest with the SHIPPED bundles
              # only, and the closure that was just projected is never listed. Observed
              # end-to-end in a container -- the providers were on disk and absent from
              # dsh.profile.bundles. fix-profile first, then reconcile against a manifest that
              # is guaranteed to exist.
              node /seed/fix-profile.js
              node /seed/reconcile-bundles.js
          env:
            - { name: DSH_VERSION, value: "0.1.5-alpha.2" }
            - { name: DSH_BUILD, value: "glibc" }
            - { name: DSH_PLUGINSET, value: "ps1" }
          volumeMounts:
            - { name: home, mountPath: /dsh-home }
            - { name: relay, mountPath: /seed, readOnly: true }
            - { name: teams, mountPath: /dsh-teams }
            # read-only: this container reads the staged closure the install Job built, and
            # must never write to the shared app volume.
            - { name: app, mountPath: /app, readOnly: true }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: dsh
          image: mirror.gcr.io/library/node:22
          # The agent's sandbox root is process.cwd(): dsh-base sets
          #     sandbox-policy.workspaceRoot: !!js process.cwd()
          # with mode `workspace-write` by default. The container's cwd was `/`, so the sandbox
          # root was the WHOLE FILESYSTEM and model-executed tool calls could read and rewrite
          # /dsh-home/.credentials.yaml (the browser cookie SIGNING SECRET), settings.yaml, and the
          # cordis.patch.yml that defines trustedHosts. Confirmed on the live pod: the recorded
          # workspace was /dsh-home itself. Pinning workingDir to a dedicated volume moves the
          # sandbox root off the config directory, using the supported mechanism rather than
          # hand-editing storages/workspace.json (which carries workspace UUIDs and session ids).
          #
          # WHAT THIS DOES AND DOES NOT DO. It changes the cwd-derived sandbox root, which is what
          # confines writes under the default `workspace-write` mode. It does NOT rewrite the
          # existing workspace record: storages/workspace.json still names /dsh-home, with one
          # session attached. Rewriting that file was reviewed and rejected as high-risk -- it keys
          # workspaces by UUID and lists attached session ids, so an edit can orphan a session.
          # The supported way to move an existing workspace is the UI's directory picker
          # (dsh-client-ui-directory-picker-browse is enabled), pointing it at /workspace.
          # VERIFY AFTER ROLLOUT rather than assuming: create a session and confirm the agent can
          # write under /workspace and CANNOT write to /dsh-home/.credentials.yaml. If an old
          # session still resolves its root from its own recorded cwd, that session keeps the old
          # behaviour until it is replaced.
          workingDir: /workspace
          # --trusted-host is what makes the public authority acceptable to the /api trust fence:
          # a non-loopback deployment must declare the names it is reached by, or every proxied
          # request is refused 403. It must match the cloudflared hostname exactly.
          # Runs the VERSIONED tree, and DSH_VERSION is part of the pod spec. That is what couples an
          # upgrade to a rollout: bumping the version here (and on the Job) changes the Deployment,
          # so Kubernetes replaces the pod onto the new tree instead of the installer mutating
          # node_modules under a live process. Keep this value and the Job's in lockstep -- the
          # wait-for-install initContainer fails loudly rather than silently running the old one.
          command: ["/bin/sh", "-c"]
          args:
            - exec "/app/${DSH_VERSION}-${DSH_BUILD}/node_modules/.bin/dsh" web --no-open --port 3080 --trusted-host dsh.chifor.me
          env:
            - { name: DSH_VERSION, value: "0.1.5-alpha.2" }
            - { name: DSH_BUILD, value: "glibc" }
            # The LiteLLM credential, synced from OpenBao by External Secrets (openbao-eso.yaml).
            # settings.yaml references it as `apiKeyEnv: LITELLM_API_KEY` rather than embedding a
            # value, so the secret never lands in git and never lands in the seed ConfigMap either.
            - name: LITELLM_API_KEY
              valueFrom: { secretKeyRef: { name: dsh-litellm, key: api_key } }
            # The Codex credential for the `codex` PROVIDER ROUTE -- dsh's own agent loop on
            # the Codex model, read via settings.yaml's `apiKeyEnv` (architecture B).
            #
            # IT DOES NOT AUTHENTICATE THE CLI CHILD, and an earlier revision of this comment
            # wrongly said it did. codex 0.153.4 constructs its app-server auth manager as
            #     AuthManager::shared_from_config(&config, /*enable_codex_api_key_env*/ false)
            # (codex-rs/app-server/src/lib.rs, both entry points at rust-v0.153.4), so the CLI
            # ignores CODEX_API_KEY entirely. The dsh-subagent-codex child therefore needs
            # NATIVE Codex auth state under its own CODEX_HOME -- which is a persistence and
            # token-refresh question in a pod, not an env var -- and that is an open item
            # blocking architecture A's activation, recorded in the team-review header.
            #
            # optional: true, DELIBERATELY. The OpenBao path behind dsh-codex does not exist
            # yet: creating it is an operator write through the agentforge-provisioner, because
            # OpenBao 2.5.5 has no root-token recovery (ADR 0019 finding (c)). Without
            # `optional` a missing key would fail the pod outright -- turning an unconfigured
            # OPTIONAL feature into an outage of the whole harness. Unset simply means the
            # codex route reports the honest "Provider is not configured" refusal.
            - name: CODEX_API_KEY
              valueFrom: { secretKeyRef: { name: dsh-codex, key: api_key, optional: true } }
            - { name: DSH_HOME, value: /dsh-home }
            - { name: HOME, value: /dsh-home }
            # Feedback submission can export session data. Off for a private deployment.
            - { name: DSH_TELEMETRY_DISABLED, value: "1" }
            # Lets the agent install its own tools, which it could not do at all before.
            # Debian strips ensurepip from python3, so there was no pip AND no working
            # `python3 -m venv`; npm i -g failed because the default prefix /usr/local is not
            # writable by uid 1000. uv (installed to /app/tools/bin by the install Job) covers
            # Python, and a writable npm prefix on the home PVC covers node tooling.
            # Verified on the live pod before shipping: uv venv on the system python3, then
            # `uv pip install cairosvg`, then cairosvg rendering the agent's own SVG to PNG.
            - { name: npm_config_prefix, value: /dsh-home/.npm-global }
            # PATH is spelled out in full because a container env var cannot reference the
            # image's own PATH. The tail is node:22's default, verified live -- do not trim it.
            - { name: PATH, value: "/dsh-home/.local/bin:/dsh-home/.npm-global/bin:/app/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
          volumeMounts:
            - { name: app,  mountPath: /app, readOnly: true }
            - { name: home, mountPath: /dsh-home }
            - { name: tmp,  mountPath: /tmp }
            - { name: workspace, mountPath: /workspace }
            # readOnly: a `system`-trust preset root is deployment-owned. dsh-agent-presets
            # already suppresses write-back to a mounted preset file, but the agent runs in
            # THIS container with a shell -- and /dsh-teams sits outside /workspace precisely
            # so model-authored code cannot rewrite the compositions it runs under.
            - { name: teams, mountPath: /dsh-teams, readOnly: true }
            # OpenBao-managed credentials, projected by ESO (openbao-eso.yaml) and read through
            # the seam by openbao-credentials.mjs. readOnly, and OUTSIDE /workspace so the sandbox
            # root does not contain it.
            #
            # NO subPath, deliberately: a subPath mount pins a bind mount, and kubelet does not
            # propagate Secret updates into one, so a rotated credential would never arrive. The
            # whole volume is mounted so the atomic symlink swap kubelet uses is visible, which is
            # also why the plugin reopens by pathname on every read instead of holding a
            # descriptor.
            #
            # Not readable by the dsh USER only -- the agent runs in THIS container and can read
            # this directory. That is the same exposure LITELLM_API_KEY already has as an env var,
            # and it is why the OpenBao document behind it must hold ONLY credentials dsh is meant
            # to have. Containment here is the OpenBao ACL, not the filesystem.
            - { name: credentials, mountPath: /dsh-credentials, readOnly: true }
          # Probes are exec, not httpGet: unauthenticated / returns 401 once routes mount, which a
          # standard HTTP probe reads as failure, and the listener is on loopback where a Pod-IP
          # probe cannot reach it at all. A TCP connect to 127.0.0.1 proves the listener is up
          # without asserting anything about the auth state.
          startupProbe:
            exec: { command: ["/bin/sh","-c","node -e 'require(\"net\").connect(3080,\"127.0.0.1\").on(\"connect\",()=>process.exit(0)).on(\"error\",()=>process.exit(1))'"] }
            periodSeconds: 5
            failureThreshold: 60      # first boot settles the Loader before it listens
          livenessProbe:
            exec: { command: ["/bin/sh","-c","node -e 'require(\"net\").connect(3080,\"127.0.0.1\").on(\"connect\",()=>process.exit(0)).on(\"error\",()=>process.exit(1))'"] }
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "2",  memory: 4Gi }
        - name: relay
          image: mirror.gcr.io/library/node:22
          command: ["node", "/relay/relay.js"]
          env:
            - { name: RELAY_PORT, value: "8080" }
            - { name: DSH_PORT,   value: "3080" }
            # The authority the relay mints a session FOR, and the only Host it will inject on.
            # Must match the cloudflared hostname and the container's --trusted-host exactly: the
            # cookie name is a hash of this string, so a mismatch mints a cookie dsh never looks for.
            - { name: DSH_AUTHORITY, value: "dsh.chifor.me" }
          ports: [{ name: relay, containerPort: 8080, protocol: TCP }]
          # home, READ-ONLY, purely for .credentials.yaml: the relay signs a dsh session with the
          # same secret dsh verifies against. This does widen where that secret is readable, from one
          # container to two -- accepted because both are in this pod, the relay mounts it read-only
          # and never writes, and the agent's sandbox root was moved to /workspace precisely so
          # model-executed tool calls cannot reach /dsh-home at all.
          volumeMounts:
            - { name: relay, mountPath: /relay, readOnly: true }
            - { name: home,  mountPath: /dsh-home, readOnly: true }
          readinessProbe:
            tcpSocket: { port: relay }
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
      volumes:
        - { name: app,  persistentVolumeClaim: { claimName: dsh-app } }
        - { name: home, persistentVolumeClaim: { claimName: dsh-home } }
        - { name: workspace, persistentVolumeClaim: { claimName: dsh-workspace } }
        - { name: tmp,  emptyDir: { sizeLimit: 1Gi } }
        - { name: relay, configMap: { name: dsh-relay, defaultMode: 0444 } }
        # Agent-team preset root. emptyDir, not a PVC: seed-settings rebuilds it from the
        # content-hashed dsh-relay ConfigMap on every boot, so it holds nothing durable and a
        # team deleted from git cannot survive as a stale, still-selectable directory.
        - { name: teams, emptyDir: { sizeLimit: 16Mi } }
        # optional: true is REQUIRED, not defensive. The OpenBao path and policy behind
        # dsh-credentials are operator writes that do not exist yet (see openbao-eso.yaml), so this
        # Secret is absent today. Without `optional` the kubelet would refuse to start the pod --
        # turning an unconfigured, additive feature into an outage of the whole harness on a
        # 1-replica Recreate Deployment. Absent simply means the plugin finds nothing and every
        # reference resolves exactly as it does now.
        - { name: credentials, secret: { secretName: dsh-credentials, defaultMode: 0400, optional: true } }
