apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# dsh — DeepSeek Harness agent UI at dsh.chifor.me, using the estate's own models through LiteLLM.
namespace: dsh
resources:
  - namespace.yaml
  - pvc.yaml
  - install-job.yaml   # one-shot: npm-installs dsh into the app PVC (see the file for why not an image)
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml # default-deny both ways; only cloudflared in, only DNS + LiteLLM out

configMapGenerator:
  # Generated so the name carries a content hash: editing relay.js rolls the pod automatically
  # instead of leaving the old relay running — the same trap that made a LiteLLM change inert.
  - name: dsh-relay
    files:
      - relay.js
      - settings.seed.yaml
      - fix-profile.js

# ONE source of truth for the version. It has to appear in the Deployment twice (the initContainer
# that waits for the tree, and the container that execs it), and a hand-maintained triplicate is a
# footgun: a half-done bump would leave the pod silently running the previous tree. The Job's env is
# the source; both Deployment copies are derived from it, so a bump touches the Job only (plus its
# name, which must change because a Job's pod template is immutable).
replacements:
  - source:
      kind: Job
      name: dsh-install-0-1-2-rc-1
      fieldPath: spec.template.spec.containers.[name=install].env.[name=DSH_VERSION].value
    targets:
      - select: { kind: Deployment, name: dsh }
        fieldPaths:
          - spec.template.spec.initContainers.[name=wait-for-install].env.[name=DSH_VERSION].value
          - spec.template.spec.containers.[name=dsh].env.[name=DSH_VERSION].value
