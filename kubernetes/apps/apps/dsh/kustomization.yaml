apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# dsh — DeepSeek Harness agent UI at dsh.chifor.me, using the estate's own models through LiteLLM.
namespace: dsh
resources:
  - namespace.yaml
  - openbao-eso.yaml   # SA + CA + SecretStore + ExternalSecret: the LiteLLM key from OpenBao
  - pvc.yaml
  - install-job.yaml   # one-shot: npm-installs dsh into the app PVC (see the file for why not an image)
  - deployment.yaml
  - searxng.yaml      # self-hosted metasearch: dsh's ONLY route to web content
  - oauth2-proxy-searxng-secret.sops.yaml # SOPS: oauth2-proxy client + cookie secrets
  - searxng-auth.yaml # Authelia SSO gate publishing the SearXNG web UI at search.chifor.me
  - service.yaml
  - networkpolicy.yaml # default-deny both ways; only cloudflared in; DNS + LiteLLM + SearXNG + 443 out

configMapGenerator:
  # Generated so the name carries a content hash: editing relay.js rolls the pod automatically
  # instead of leaving the old relay running — the same trap that made a LiteLLM change inert.
  - name: dsh-relay
    files:
      - relay.js
      - settings.seed.yaml
      - fix-profile.js
      - reconcile-provider.js
      # Sets dsh.profile.bundles from the closure actually projected. NOT a merge: a bundle
      # named there but absent throws at profile load and crash-loops the pod.
      - reconcile-bundles.js
      - cordis.patch.yml
      - searxng-search.mjs   # the web SEARCH provider itself (see the file for why not npm)
      # The credentials provider. Same reason as searxng-search.mjs for being a file, and
      # the same consequence from the content hash: editing it rolls the pod, which is
      # required -- the profile is installed at boot, so a changed provider that did not
      # roll would leave the old one resolving credentials.
      - openbao-credentials.mjs
      # The agent's git identity for git.chifor.me. openbao-credentials.mjs feeds dsh's own
      # credentials SERVICE; the agent's shell never sees that (dsh-subprocess scrubs every
      # KEY/PASSWORD/SECRET/TOKEN-shaped and DSH_* variable before bash starts), so `git clone`
      # of a private repo failed with "could not read Username" (session 3d381759, 2026-09-11).
      # A git credential helper reading the SAME ESO mount, scoped by gitconfig.seed to
      # https://git.chifor.me, is the bridge. Both ride the content hash: a changed helper rolls
      # the pod, which is required because seed-settings installs it at boot.
      - git-credential-openbao.sh
      - gitconfig.seed
      # User-global agent instructions, installed to $DSH_HOME/AGENTS.md. COMPLEMENTARY to the
      # agent teams below, not in competition with them: this is instruction CONTENT, read by
      # dsh-agent-instructions from $DSH_HOME (its `dshHome` default, and DSH_HOME=/dsh-home
      # here); a team is a COMPOSITION, read by dsh-agent-presets from /dsh-teams. Different
      # path, different plugin, no shared state, so both can land.
      #
      # WHAT THE UPSTREAM DOCS ESTABLISH, per @deepseek-ai/dsh-agent-instructions: the global
      # file is rendered FIRST, followed by the project chain broad-to-specific; duplicate
      # sibling content renders once; and `maxBytes` caps the whole rendered baseline. So
      # ordering, de-duplication and the budget are defined WITHIN one agent.
      #
      # WHAT THEY DO NOT: anything about AGGREGATE cost once a team fans out. Every child
      # agent whose composition carries an agent-instructions row renders this same baseline
      # into its own context, so the per-agent budget is bounded and the per-TEAM cost is
      # not. That is a sizing input for WP-5's bounds, not a reason to withhold either file.
      - agents.seed.md
      # Agent teams (WP-1). Flattened as <team>.<file> because a ConfigMap key cannot
      # contain "/"; seed-settings rebuilds the directory tree at /dsh-teams. They ride the
      # content hash like everything else here, so editing a team rolls the pod -- which is
      # required, not incidental: dsh-agent-presets keys a preset's standing mount on the
      # composition file's stamp, and sessions already joined keep the generation they run.
      - agent-teams/team-solo.preset.yml
      - agent-teams/team-solo.agent.cordis.yml
      - agent-teams/team-conductor.preset.yml
      - agent-teams/team-conductor.agent.cordis.yml
      - agent-teams/team-review.preset.yml
      - agent-teams/team-review.agent.cordis.yml

# ONE source of truth for the version. It has to appear in the Deployment twice (the initContainer
# that waits for the tree, and the container that execs it), and a hand-maintained triplicate is a
# footgun: a half-done bump would leave the pod silently running the previous tree. The Job's env is
# the source; both Deployment copies are derived from it, so a bump touches the Job only (plus its
# name, which must change because a Job's pod template is immutable).
replacements:
  - source:
      kind: Job
      name: dsh-install-0-1-5-alpha-2-glibc-ps1
      fieldPath: spec.template.spec.containers.[name=install].env.[name=DSH_VERSION].value
    targets:
      - select: { kind: Deployment, name: dsh }
        fieldPaths:
          - spec.template.spec.initContainers.[name=wait-for-install].env.[name=DSH_VERSION].value
          - spec.template.spec.initContainers.[name=seed-settings].env.[name=DSH_VERSION].value
          - spec.template.spec.containers.[name=dsh].env.[name=DSH_VERSION].value
  # DSH_PLUGINSET travels the same way, and for a sharper reason than the other two. It selects
  # the STAGING PATH (/app/profiles/${DSH_VERSION}-${DSH_BUILD}-${DSH_PLUGINSET}/web) that the
  # Job writes and seed-settings reads. Hand-maintained on both sides, bumping it in the Job
  # alone would leave the Deployment looking for a closure nobody staged -- and that failure is
  # SILENT: the pod takes the no-closure branch, reconciles to shipped bundles only, and boots
  # perfectly well with the providers simply absent. One source, derived copies.
  - source:
      kind: Job
      name: dsh-install-0-1-5-alpha-2-glibc-ps1
      fieldPath: spec.template.spec.containers.[name=install].env.[name=DSH_PLUGINSET].value
    targets:
      - select: { kind: Deployment, name: dsh }
        fieldPaths:
          - spec.template.spec.initContainers.[name=seed-settings].env.[name=DSH_PLUGINSET].value
  # DSH_BUILD travels the same way, for the same reason. The install directory is
  # /app/${DSH_VERSION}-${DSH_BUILD}, so a Deployment carrying a different build tag than the Job
  # would wait forever on a path the installer never creates. One source, three copies, derived.
  - source:
      kind: Job
      name: dsh-install-0-1-5-alpha-2-glibc-ps1
      fieldPath: spec.template.spec.containers.[name=install].env.[name=DSH_BUILD].value
    targets:
      - select: { kind: Deployment, name: dsh }
        fieldPaths:
          - spec.template.spec.initContainers.[name=wait-for-install].env.[name=DSH_BUILD].value
          - spec.template.spec.initContainers.[name=seed-settings].env.[name=DSH_BUILD].value
          - spec.template.spec.containers.[name=dsh].env.[name=DSH_BUILD].value
