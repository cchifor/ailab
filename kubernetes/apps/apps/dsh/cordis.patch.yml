# dsh profile patch layer, applied after every bundle layer. Installed to
# $DSH_HOME/profiles/web/cordis.patch.yml by the seed-settings initContainer on
# every boot.
#
# WHY THIS IS IN GIT. It was created by hand on the PVC on 2026-09-07 and lived
# ONLY there until 2026-09-08. That made it invisible and fragile: recreating the
# dsh-home volume would silently revert the browser session to a 30-day expiry
# AND drop trustedHosts, which 403s every proxied request. Exactly the
# unmanaged-state problem that left dsh advertising four dead model ids after a
# rename. It is GitOps-owned now and reinstalled unconditionally each boot, so
# the volume can be rebuilt without losing it.
#
# WHAT IT FIXES. dsh authenticates the browser with a per-process launch token
# printed at startup (`dsh web: http://127.0.0.1:3080/?token=...`). Opening the
# app without it returns
#     dsh web authentication required; reopen the URL printed by dsh web.
# A valid token on GET / mints a signed cookie and thereafter the token is not
# needed. Two separate secrets are involved and they behave very differently:
#   * the LAUNCH TOKEN is randomBytes held in an in-memory WeakMap, so it changes
#     on every pod restart and cannot be pinned (there is no --token flag and no
#     env override);
#   * the COOKIE SIGNING SECRET is persisted in $DSH_HOME/.credentials.yaml, so
#     cookies SURVIVE restarts. Only their own expiry ends them.
# cookieMaxAgeDays therefore decides how often a human has to go and read the
# token out of the pod logs. The default is 30 days; 3650 makes it effectively
# once per browser. That is defensible here because Cloudflare Access already
# authenticates every request per-person at the edge and the NetworkPolicy admits
# only the cloudflared pod, so this cookie is a second layer rather than the
# control. Revocation exists: delete the client-connection/browser-session record
# from .credentials.yaml and every outstanding cookie is void on next activation.
#
# BOTH KEYS ARE RE-SPECIFIED DELIBERATELY. A patch REPLACES an entry's config
# rather than merging into it (the loader's replaceKeys deletes every key before
# assigning), so omitting trustedHosts here would not "keep the default" -- it
# would erase the authorities the /api browser-trust fence checks and 403 every
# request arriving through cloudflared. The upstream bundle comment documents the
# same idiom: a deployment adding authorities keeps this expression.
- id: connection
  config:
    trustedHosts: !!js ctx.webRuntime.trustedHosts
    cookieMaxAgeDays: 3650

# ---------------------------------------------------------------------------
# CAPABILITIES ENABLED 2026-09-08.
#
# `dsh --profile web --dump-config` showed 27 of 145 rows disabled, including context compaction,
# plan mode, web access and skills. That is upstream's default for this profile rather than a
# fault, but it leaves the harness unable to look anything up and unable to survive a long
# session: with compaction off the context window fills and the run ends.
#
# EVERY ROW BELOW CARRIES ITS FULL CONFIG, copied verbatim out of --dump-config rather than
# retyped. That is required, not tidiness: a patch REPLACES a row's config instead of merging into
# it, so enabling a row with a bare `disabled: false` would silently erase whatever config it had
# -- the same trap the connection row above documents for trustedHosts. plan-mode is where it
# would have bitten hardest: its config is a 37-line system-prompt section, and losing it would
# leave plan mode enabled but mute.
#
# NOT enabled, deliberately: tool-bash, tool-fs, tool-fs-search, tool-str-replace-editor. The
# running agent already exposes Bash/Write/Read (visible in the session UI) even though those rows
# read disabled here, so enabling them risks two registrations colliding on one tool name. Settle
# what the agent actually registers before touching them.
#
# MCP (dsh-mcp-client) is installed but stays OFF: upstream enables no MCP server by default
# because each server command is trusted executable code running OUTSIDE the agent sandbox.
# ---------------------------------------------------------------------------

# context compaction: without it a long session simply runs out of window
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: false

# the /compact command that drives the above on demand
- id: command-compact
  name: '@deepseek-ai/dsh-command-compact'
  disabled: false

# project instruction files (AGENTS.md and friends)
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
  disabled: false

# plan mode, kept verbatim including its 37-line prompt section
- id: plan-mode
  name: '@deepseek-ai/dsh-plan-mode'
  config:
    section: >
      You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or
      the user switches the session mode. Imperative language to implement
      changes means plan the implementation, not execute it. A user's
      conversational agreement — including an answer confirming something you
      asked — approves nothing and does not end plan mode; fold the confirmed
      decision into the plan and submit it through exit_plan_mode.


      Explore first. Use non-mutating reads, searches, static analysis, and
      checks to ground the plan in the actual repository. Do not edit or write
      files, change configuration, run formatters or code generation that
      rewrites tracked files, commit, or otherwise carry out the plan. Prefer
      existing functions and patterns over new machinery.


      The tool catalog stays the same across modes for request-cache stability.
      These plan-mode rules override any later tool description or guidance that
      suggests using mutation tools; those tools remain listed only to keep the
      request shape stable. Do not use todo_write to track this planning phase:
      it tracks implementation after an approved plan, while the plan itself
      belongs in exit_plan_mode.


      Resolve discoverable facts by inspection. Use ask_user_question only for
      user-owned choices or material ambiguity that inspection cannot answer. Do
      not ask the user where code lives or how current behavior works when you
      can find out.


      Make the plan decision-complete: state the goal and success criteria;
      group implementation changes by subsystem; identify public API, schema,
      and data-flow changes; cover edge cases, failure modes, tests, acceptance
      criteria, and explicit assumptions. Keep it concise enough to review but
      detailed enough that another engineer can implement it without making
      design decisions.


      When ready, call exit_plan_mode with the complete plan markdown, starting
      with a # title. Make exit_plan_mode the only and final tool call in that
      assistant response: it presents the plan for approval, and implementation
      begins only in a later step after approval. Do not paste the final plan as
      a plain reply or ask "should I proceed?" through prose or
      ask_user_question. If review rejects it, incorporate the feedback and
      present again. If the review channel is unavailable or aborted, stay in
      plan mode and ask the user to switch modes manually; do not proceed with
      implementation.
  disabled: false

# task list the agent maintains across a long task
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
  disabled: false

# skills
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  disabled: false

# skill discovery from the filesystem
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  disabled: false

# ---------------------------------------------------------------------------
# WEB ACCESS ENABLED 2026-09-08, through our own SearXNG rather than the internet.
#
# tool-web shipped disabled here for a good reason: this pod's NetworkPolicy allows egress to DNS
# and LiteLLM only, because it executes model-authored code. Enabling the tool without solving
# that would have handed the model a capability that always fails.
#
# It is solved by routing BOTH providers at searxng.dsh.svc, which fetches on dsh's behalf. dsh
# gains one Service as a destination, not a route to the internet. See searxng.yaml for the
# reasoning and the measurements.
#
# All three rows below restate their FULL config, because a patch replaces rather than merges.
# ---------------------------------------------------------------------------

# The provider itself, as a FILE, not an npm package.
#
# WHY NOT THE COMMUNITY PLUGIN. dsh-searxng-web@0.5.9 is a real, compatible package, but it is
# unreachable here. dsh resolves a row's `name:` from the PROFILE directory
# (file:///dsh-home/profiles/web/), not from the dsh install tree. That directory's node_modules is
# a symlink farm containing dsh's OWN dependency closure and nothing else -- verified on the live
# pod: 195 packages in /app, 193 in the farm, and the three absent ones are exactly the packages
# dsh does not depend on. An npm-installed sibling therefore throws MODULE_NOT_FOUND, boot()
# rethrows, and the POD CRASH-LOOPS. It does not degrade to "search is broken". The install Job's
# own resolve check would have passed, because it validates the wrong anchor.
#
# A relative specifier resolves against that same directory, so the provider ships through the
# mechanism this repo already uses for relay.js and reconcile-provider.js: the content-hashed
# ConfigMap, installed by the seed-settings initContainer. Editing it re-hashes and rolls the pod.
# No registry, no npm from a pod with no egress, no third-party code in the process that runs
# model-authored tool calls, and the file sits outside /workspace so the agent cannot rewrite it.
- insert:
    - id: searxng
      name: './searxng-search.mjs'
      config:
        baseUrl: 'http://searxng.dsh.svc.cluster.local:8080'

# searchProvider moves to ours. fetchProvider deliberately STAYS on the built-in http provider:
# SearXNG is a metasearch engine and does not fetch arbitrary pages on a caller's behalf, and the
# built-in provider carries an SSRF guard (rejects non-public addresses, revalidates on redirect)
# that is worth keeping. See tool-web below for what that means in practice.
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: searxng
    fetchProvider: http

# Both ON as of 2026-09-09. fetch was off while this pod had no egress — the http provider fetches
# from HERE, so every call would have failed, and advertising a tool that always fails just burns
# the model's turns. networkpolicy.yaml now allows outbound 443/80 (private ranges still excluded),
# so the built-in provider works. It is a plugin like any other, ships with dsh, and its guards are
# verified live: WEB_BLOCKED_URL on 192.168.0.1, on 127.0.0.1 and on 169.254.169.254, with a real
# page returning kind:'html' and a JSON API returning kind:'text'.
#
# Binary is refused by design (WEB_UNSUPPORTED_CONTENT_TYPE), because WebFetchBody is a closed
# union of html|text. DOCUMENT DOWNLOADS therefore go through the agent's own shell instead:
#     curl -L -o /workspace/doc.pdf https://example.com/doc.pdf
# which the same egress rule permits.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
  disabled: false
