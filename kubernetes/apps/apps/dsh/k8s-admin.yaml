# The dsh runtime's Kubernetes identity: ONE ServiceAccount bound to the built-in `cluster-admin`
# ClusterRole. Full access, by operator decision (2026-09-18, ADR 0025). The bounded design that
# preceded it -- a namespace Role plus the dsh-k8s-admin-guard ValidatingAdmissionPolicy (#770-#774)
# -- denied the agent's real acceptance workloads and could not even be read by the identity it
# denied, so it was replaced rather than patched.
#
# What this means: every container of the dsh pod (the token is automounted) and any workload that
# names this ServiceAccount can do anything the API allows, cluster-wide, including reading every
# Secret. It is a deliberate exception to ADR 0021 Tier A. Revoke by deleting the ClusterRoleBinding
# below from git; that stops FUTURE use only. Verification, the curl fallback and the history:
# docs/runbooks/dsh-k8s-admin.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dsh-k8s-admin
  namespace: dsh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dsh-k8s-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: dsh-k8s-admin
    namespace: dsh
