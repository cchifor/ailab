# One-shot installer for the dsh npm package into the dsh-app PVC.
#
# WHY A JOB AND NOT AN IMAGE: dsh publishes no official container image, and pushing a hand-built one
# needs the SOPS `ci` registry credential. A community image would hold the LiteLLM credential, so it
# is not a shortcut worth taking. Installing the official npm package into a volume keeps the supply
# chain to "what DeepSeek published", pinned by version.
#
# WHY A JOB AND NOT AN initContainer: the runtime pod is default-deny egress (networkpolicy.yaml)
# precisely because this thing executes model-generated tool calls. An initContainer shares the pod's
# NetworkPolicy, so npm access would have to be granted to the running agent forever. This Job
# carries app=dsh-install, which the deny policy's podSelector (app=dsh) does not match, so the npm
# reach exists ONLY here and only while installing.
#
# TO UPGRADE: bump DSH_VERSION and the Job name together (a Job's pod template is immutable), then
# delete the marker file or the PVC so this re-runs.
apiVersion: batch/v1
kind: Job
metadata:
  name: dsh-install-0-1-5-alpha-2-glibc
  annotations:
    # A Job's spec.template is IMMUTABLE, so any edit Flux applies to this object under the SAME
    # name is rejected with "field is immutable" — which fails the whole dsh Kustomization, not
    # just this Job (the 2026-07-28 outage). The upgrade path above avoids that by bumping the
    # name, but that is a convention, and the estate's invariant is enforced mechanically:
    # scripts/pin-image-digests.py refuses to pin ANY digest while a Flux-applied Job lacks this
    # annotation, because it cannot know that a future edit will not land on one. Without it the
    # image-pin job fails for every repo, which is how this was found — agentforge's pin-pr had
    # been red on five consecutive runs, blocking every deploy in the estate.
    kustomize.toolkit.fluxcd.io/force: "enabled"
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 4
  # Without a deadline a hung npm install retries until the TTL while the Deployment's
  # wait-for-install blocks behind it, with no signal beyond a Pending pod. 20 minutes is
  # generous against the 4-minute install measured on this cluster.
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels: { app: dsh-install }
    spec:
      restartPolicy: OnFailure
      # npm install executes arbitrary lifecycle scripts from the network. The runtime pod is denied
      # an API token; the installer -- the one container here that actually runs third-party code
      # fetched at build time -- had one mounted by default. That is backwards.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: install
          # node:22 (Debian bookworm), NOT alpine. The alpine image has no bash, and dsh's shell
          # backends spawn the literal binary "bash" -- every Bash tool call failed with
          # `spawn bash ENOENT`. It also had no python3/git/curl, so the agent had essentially no
          # toolchain. MEASURED in-cluster on 2026-09-08: alpine has none of bash/git/curl/python3;
          # node:22-slim adds only bash; node:22 has bash, git, curl, python3 AND make/g++, which
          # also lets npm build a native module from source when no prebuilt matches this platform.
          image: mirror.gcr.io/library/node:22
          env:
            - { name: DSH_VERSION, value: "0.1.5-alpha.2" }
            # The install directory is keyed on version AND libc. Moving alpine -> Debian changes
            # musl -> glibc, and the existing /app/0.1.2-rc.1 tree was resolved by npm for musl;
            # reusing it would run platform-specific prebuilds against the wrong libc. The marker
            # check below is per-directory, so without a distinct path npm would simply skip the
            # reinstall and the mismatch would be silent. Bump this on any base-image libc change.
            - { name: DSH_BUILD, value: "glibc" }
            - { name: npm_config_cache, value: /app/.npm }   # shared across versions; harmless
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # ---- uv, the agent's package manager -------------------------------------------
              # BEFORE the dsh install and its early exit, deliberately: the block below returns
              # early when the requested version is already present, which is the normal case, so
              # anything appended after it would never run on an existing estate.
              #
              # WHY THIS EXISTS. The agent could not install a single library. Debian ships python3
              # WITHOUT ensurepip, so there is no pip and `python3 -m venv` cannot bootstrap one
              # either, and `npm i -g` fails because the default prefix /usr/local is not writable
              # by uid 1000. It hit this trying to render an SVG: it wanted cairosvg, found no pip,
              # and gave up. uv is one static binary that needs neither root nor apt.
              #
              # INSTALLED HERE, not in the Deployment: this Job already has egress, so pod startup
              # never depends on reaching the internet. It goes on the /app volume rather than the
              # home PVC because this Job only mounts /app -- and dsh-home is ReadWriteOnce on
              # local-path, so mounting it here could pin the Job to a different node than the
              # Deployment and deadlock the volume. /app/tools is OUTSIDE the versioned prefix, so
              # it survives a DSH_VERSION bump.
              #
              # NOT fatal on failure. The primary duty of this Job is installing dsh; refusing to
              # upgrade dsh because astral.sh was unreachable would be the wrong trade. It retries,
              # then warns loudly and continues, and the next Job run tries again.
              if [ -x /app/tools/bin/uv ]; then
                echo "uv already present: $(/app/tools/bin/uv --version)"
              else
                mkdir -p /app/tools/bin
                # The loop condition is the OUTCOME, not a command status. `curl ... | sh` is a
                # pipeline whose status is sh's, and on a DNS or HTTP failure curl writes nothing
                # while sh reads that empty input and exits 0 -- so the pipeline "succeeded", the
                # first pass broke out, and the retry never happened on the one failure it exists
                # to survive. dash has no `set -o pipefail` to lean on, so the download is a
                # separate, checked step and the loop asks whether the binary actually appeared.
                n=0
                while [ ! -x /app/tools/bin/uv ] && [ $n -lt 3 ]; do
                  n=$((n+1))
                  if curl -LsSf https://astral.sh/uv/install.sh -o /tmp/uv-install.sh; then
                    env UV_INSTALL_DIR=/app/tools/bin INSTALLER_NO_MODIFY_PATH=1 sh /tmp/uv-install.sh || true
                  else
                    echo "uv download attempt ${n} failed"
                  fi
                  if [ ! -x /app/tools/bin/uv ] && [ $n -lt 3 ]; then
                    echo "uv attempt ${n} produced no binary; retrying"; sleep 5
                  fi
                done
                rm -f /tmp/uv-install.sh
                if [ -x /app/tools/bin/uv ]; then
                  echo "uv installed: $(/app/tools/bin/uv --version)"
                else
                  echo "WARNING: uv could not be installed -- the agent will have no way to install"
                  echo "WARNING: Python packages. dsh itself is unaffected. Re-run this Job to retry."
                fi
              fi

              # Versioned prefix, NOT a shared /app. dsh-app is ReadWriteMany, so the Job and the
              # RUNNING Deployment can mount it simultaneously; installing in place would rewrite
              # node_modules under a live process. Each version gets its own tree, and the Deployment
              # names the version it wants -- so an upgrade lands beside the running one and only
              # takes effect when the pod rolls.
              DEST="/app/${DSH_VERSION}-${DSH_BUILD}"
              mkdir -p "$DEST"
              MARKER="${DEST}/.installed"
              # The marker is written LAST and only after the binary is proven present. An earlier
              # version wrote it beside the install, which meant an OOM-killed or evicted Job could
              # leave a marker over a half-written node_modules and every later run would skip the
              # repair. Verify-then-mark, never mark-then-verify.
              if [ -f "$MARKER" ] && [ -x "${DEST}/node_modules/.bin/dsh" ]; then
                echo "already installed: ${DSH_VERSION}"
                exit 0
              fi
              [ -f "$MARKER" ] && echo "marker present but binary missing -- reinstalling" && rm -f "$MARKER"
              echo "installing @deepseek-ai/dsh@${DSH_VERSION} into ${DEST}"
              npm install --prefix "$DEST" --no-fund --no-audit "@deepseek-ai/dsh@${DSH_VERSION}"
              test -x "${DEST}/node_modules/.bin/dsh"
              touch "$MARKER"
              echo "installed:"; "${DEST}/node_modules/.bin/dsh" --version || true
          volumeMounts:
            - { name: app, mountPath: /app }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "2",  memory: 2Gi }
      volumes:
        - { name: app, persistentVolumeClaim: { claimName: dsh-app } }
