# Dedicated operator access. Each destination must also accept the public key belonging to
# af/dsh/credentials.DSH_OPERATOR_SSH_KEY as dsh-operator. See docs/runbooks/dsh.md.
# Operator approved all eight active runner hosts and passwordless sudo on 2026-09-17.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dsh-operator-ssh
  namespace: dsh
spec:
  podSelector:
    matchLabels:
      app: dsh
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 192.168.0.24/32 } # reviewer-1
        - ipBlock: { cidr: 192.168.0.25/32 } # reviewer-2
        - ipBlock: { cidr: 192.168.0.14/32 } # ci-runner-1
        - ipBlock: { cidr: 192.168.0.15/32 } # ci-runner-2
        - ipBlock: { cidr: 192.168.0.16/32 } # ci-runner-3
        - ipBlock: { cidr: 192.168.0.17/32 } # ci-runner-4
        - ipBlock: { cidr: 192.168.0.18/32 } # ci-runner-5
        - ipBlock: { cidr: 192.168.0.19/32 } # ci-runner-6
        - ipBlock: { cidr: 192.168.0.31/32 } # ci-runner-9
        - ipBlock: { cidr: 192.168.0.23/32 } # ci-runner-10
      ports:
        - { port: 22, protocol: TCP }
