# Renovate — runs every 4h, scans cchifor/ailab, opens dependency-update PRs (+ a Dependency Dashboard
# issue). Outbound-only bot: no Service, no WAN route. The CronJob writing git + Flux reconciling main
# compose cleanly (Renovate edits git; nothing applies until a PR is merged). automerge is OFF.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "0 */4 * * *"
  concurrencyPolicy: Forbid # overlapping runs race the same branches
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Self-delete finished Jobs after 48h (2026-09-07). failedJobsHistoryLimit alone keeps up to
      # three failed Jobs FOREVER, so a single transient failure pins KubeJobFailed indefinitely --
      # the 2026-09-03 run died on a GitHub rate-limited `ls-remote`, every run since succeeded, and
      # the alert was still firing four days later off that one dead Job object.
      # 48h is a CLEANUP-ELIGIBILITY ceiling, NOT a guaranteed retention window: failedJobsHistoryLimit
      # below independently evicts the oldest failed Job once a fourth appears, which under continuous
      # 4-hourly failures is ~12h, well inside the TTL. So "48h to investigate" holds for an ISOLATED
      # failure (the case this fixes) and not for a storm -- in a storm you get the three most recent
      # failures instead, which is the more useful evidence anyway.
      # This does NOT paper over real breakage -- the schedule is every 4h, so a persistently failing
      # Renovate produces a fresh failed Job long before the old one expires and the alert stays up.
      # NB applies to Jobs created AFTER this lands; the existing failed Job must be deleted once.
      ttlSecondsAfterFinished: 172800
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 12021
            fsGroup: 12021
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: renovate
              image: renovate/renovate:44
              envFrom:
                - secretRef:
                    name: renovate-credentials # RENOVATE_TOKEN + RENOVATE_GITHUB_COM_TOKEN
              env:
                - { name: RENOVATE_CONFIG_FILE, value: /usr/src/app/config.js }
                - { name: LOG_LEVEL, value: info }
              volumeMounts:
                - { name: config, mountPath: /usr/src/app/config.js, subPath: config.js, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: false # Renovate writes clones under /tmp + its own dirs
              resources:
                requests: { cpu: 100m, memory: 512Mi, ephemeral-storage: 1Gi }
                limits: { memory: 2Gi, ephemeral-storage: 3Gi }
          volumes:
            - name: config
              configMap:
                name: renovate-config
            - name: tmp
              emptyDir: { sizeLimit: 2Gi } # cap clone/tool-install scratch so a runaway run can't fill node ephemeral storage
