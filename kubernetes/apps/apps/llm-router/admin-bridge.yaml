# Verifier for the router's admin-bridge plugin (POST /register/admin-bridge): Trueswarm Admin
# signs short-lived, body-bound EdDSA assertions; the router checks them with this PUBLIC key and
# never shares its administrator token. The private half is trueswarm-admin/admin-router-bridge
# (private.pem); fingerprint verified 2026-09-29: sha256(DER SubjectPublicKeyInfo) starts
# 5cc3b92459c5c98b for both. The plugin stays inert without ADMIN_BRIDGE_VERIFY_KEY (router.yaml),
# and refuses to start on a non-Ed25519 key. Rotating the Admin key means replacing public.pem here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-bridge-verifier
  namespace: llm-router
  labels:
    app.kubernetes.io/name: llm-router
    app.kubernetes.io/component: admin-bridge
    app.kubernetes.io/part-of: llm-router
data:
  public.pem: |
    -----BEGIN PUBLIC KEY-----
    MCowBQYDK2VwAyEAF0FO0qSiBUOLtqPFokgRYzo1hK8vJNjDrBQZptd9C90=
    -----END PUBLIC KEY-----
