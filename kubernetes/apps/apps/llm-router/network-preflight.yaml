# One-shot connectivity check requested by the review of AILab#900.
# Same network-policy labels and runtime image as the router. No credentials,
# data mounts, listening ports, service account token or changes to the router.
apiVersion: batch/v1
kind: Job
metadata:
  name: router-network-preflight-20260927
  namespace: llm-router
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: llm-router
        app.kubernetes.io/component: network-preflight
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      tolerations:
        - {key: dedicated, operator: Equal, value: agent, effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: network-preflight
          image: docker.io/library/node@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
          command: [sh, -ec]
          args:
            - |
              node --input-type=module <<'JS'
              import {lookup} from 'node:dns/promises';
              import assert from 'node:assert/strict';
              await lookup('kubernetes.default.svc.cluster.local');
              await lookup('registry.npmjs.org');
              const r=await fetch('https://registry.npmjs.org/pnpm/10.32.1',{redirect:'error',signal:AbortSignal.timeout(20000)});
              assert.equal(r.status,200);assert.equal((await r.json()).version,'10.32.1');
              console.log('Cluster DNS and verified npm HTTPS passed.');
              JS
              export npm_config_cache=/tmp/npm-cache
              npx --yes pnpm@10.32.1 --version > /tmp/pnpm-version
              test "$(cat /tmp/pnpm-version)" = 10.32.1
              echo '{"cluster_dns":true,"registry_dns":true,"registry_https":true,"pnpm_version":"10.32.1","result":"passed"}'
          # Stay unready throughout: never become a public Service endpoint.
          # No port named "http" is declared or listened on, either.
          readinessProbe:
            exec: {command: [sh, -c, 'exit 1']}
            periodSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: '2', memory: 2Gi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          terminationMessagePolicy: FallbackToLogsOnError
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
