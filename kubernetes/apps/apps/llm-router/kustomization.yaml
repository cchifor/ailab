apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# LLM Router control plane (single-authority, single replica, namespace llm-router).
# Gitea CI publishes the validated runtime as an immutable OCI image. The old
# router-releases PVC remains declared for rollback. Runtime SQLite stays on
# the RWO qnap-iscsi data PVC. Completed pre-upgrade backups remain on that volume.
# NOT created here (operator/vault prerequisites):
#   * Secret llm-router-auth (key admin-token, >= 24 chars) — the pod fails
#     its startup gate until it exists (fail closed, no default credentials).
#   * The "edge" namespace label and the Cloudflare tunnel in edge-connector.
resources:
  - router.yaml
  - retirement-transport.yaml
  - edge.yaml
  - podmonitor.yaml # Prometheus scrape of the router's metrics port (rules: infrastructure/monitoring/llm-router-rules.yaml)
  - llm-router-oidc.sops.yaml # SOPS: Keycloak client secret, router_auth DB URL, break-glass token (llm-router#121)
components:
  # Budget authority runbook step 8 (docs/runbooks/relay-worker-budget-authority.md): the router's
  # reader files for the worker budget ledger. The worker-budget-authority plugin stays DISABLED
  # (step 9 enables it through the admin API, never a manifest).
  - ../../../components/llm-router-worker-budget-reader
  # Router connection runbook step 6 (remaining-live-steps step 2, docs/runbooks/):
  # Relay's reviewed trust for the relay-keys plugin, after its OpenBao document was written and read
  # back (step 1). Included without File B (owner decision, open point 6). Only the two Relay signer
  # keys can sign, and no running process holds them until hub step H6.
  - ../../../components/llm-router-relay-keys-trust
