# One-shot acceptance through GitOps. Keep the completed Job until its result is
# recorded, then remove this file and its NetworkPolicy in a reviewed change.
# No TTL: preserve the acceptance result until cleanup is reviewed.
apiVersion: batch/v1
kind: Job
metadata:
  name: router-plugin-settings-20261007
  namespace: llm-router
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 720
  template:
    metadata:
      labels:
        app: llm-router-acceptance
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      tolerations:
        - {key: dedicated, operator: Equal, value: agent, effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: canary
          image: registry.chifor.me/llm-router/router@sha256:0c1f9af1d3e0ee8bccc34a87ddd204d6500864c124e13844cd8346a81a127d44
          workingDir: /app
          command: [node, deploy/validate-plugin-settings.mjs]
          env:
            - name: ROUTER_BASE_URL
              value: http://llm-router.llm-router.svc.cluster.local
            - name: ROUTER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: llm-router-auth, key: admin-token}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-router-acceptance
  namespace: llm-router
spec:
  podSelector:
    matchLabels: {app: llm-router-acceptance}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {app: llm-router}
      ports:
        - {protocol: TCP, port: 8787}
