# llm-router browser sign-in through Keycloak (llm-router#121; docs/runbooks/llm-router.md). System of record =
# this SOPS file.
# - oidc-client-secret: the `llm-router` client secret in realm llm-router at id.chifor.me; byte-identical to
#   LLM_ROUTER_OIDC_CLIENT_SECRET in apps/keycloak/keycloak-secrets.sops.yaml. Rotation is a kcadm change first
#   (docs/runbooks/keycloak.md), never just an edit here.
# - auth-database-url: the router_auth role on infra-pg; its password is byte-identical to
#   databases/infra-pg-router-auth.sops.yaml. sslmode=no-verify: TLS on the wire without CA pinning (CNPG's own CA
#   rotates; a static copy here would go stale).
# - break-glass-token: loopback-only browser sign-in for a Keycloak outage (kubectl port-forward to the pod). It needs
#   the PG store; during a PG outage operate with the bearer admin token (llm-router-auth) instead.
apiVersion: v1
kind: Secret
metadata:
    name: llm-router-oidc
    namespace: llm-router
    labels:
        app.kubernetes.io/name: llm-router
        app.kubernetes.io/part-of: llm-router
type: Opaque
