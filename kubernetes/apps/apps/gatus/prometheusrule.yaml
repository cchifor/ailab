# Alert when a Gatus-monitored endpoint's last check is failing. Replaces log-scraping as the
# failure signal now that the per-check success logs are silenced (GATUS_LOG_LEVEL=WARN).
# Routes to ntfy via the existing Alertmanager config (all alerts -> ntfy). release label so the
# operator's ruleSelector (release=kube-prometheus-stack) discovers it from the gatus namespace.
# NOTE: the exact metric/label names are verified live after metrics: true takes effect.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gatus
  namespace: gatus
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: gatus-endpoints
      rules:
        - alert: GatusEndpointDown
          # gatus_results_endpoint_success is a 0/1 gauge of the last check per endpoint.
          #
          # `vllm-cloud2` is excluded BY NAME because it is expected-red for part of every day:
          # the cloudlab GPU hosts power off nightly by design, and this rule has no notion of a
          # maintenance window, so including it would page every night at 21:00 and train everyone
          # to ignore the alert. Omitting the endpoint's own native `alerts:` block does NOT
          # suppress this rule -- that was the mistake, caught in codex impl-review #10.
          #
          # The endpoint still exists and still shows red on the Gatus dashboard, which is what it
          # is for. Anything added here that is deliberately down part of the day needs the same
          # treatment, and a NEW exclusion needs its own justification on this comment.
          expr: gatus_results_endpoint_success{name!="vllm-cloud2"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Gatus endpoint {{ $labels.name }} ({{ $labels.group }}) is failing"
            description: "Health check '{{ $labels.name }}' in group '{{ $labels.group }}' (key {{ $labels.key }}) has reported failure for 5m."
