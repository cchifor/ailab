# ############################################################################################
#
# ntfy ACCESS TOKEN for Gatus's native alerting path (apps/gatus/configmap.yaml, `alerting.ntfy`).
#
# WHY A TOKEN AND NOT THE EXISTING ntfy-auth PASSWORD: Gatus's ntfy provider only ever sends
# `Authorization: Bearer <token>`, and it refuses at startup any value not prefixed `tk_`. It has
# no basic-auth option, so it cannot reuse the username/password in
# infrastructure/monitoring/ntfy-auth.sops.yaml the way Alertmanager's basic_auth webhook does.
#
# PROVENANCE: minted 2026-08-30 for a dedicated least-privilege `gatus` ntfy user, mirroring the
# existing `qnap` publisher. Verified at mint time: publishing to ailab-alerts returns 200, and
# publishing to qnap-alerts returns 403 — so this credential can write one topic and cannot read
# the alert history. Rotate with `ntfy token remove gatus <id>` + `ntfy token add gatus`.
#
# DURABILITY GAP — KNOWN, DELIBERATELY NOT FIXED HERE: ntfy's user.db lives on the
# ntfy-data-iscsi PVC, and the `gatus` user above is created BY HAND, so unlike `ailab` and `qnap`
# it is NOT reconciled by the postStart hook in infrastructure/monitoring/ntfy.yaml. A PVC rebuild
# silently drops both the user and this token and Gatus's alerts start 401-ing — the same
# failure-shape that hook's comments already warn about for `qnap`. Codifying a `gatus` user in
# that postStart block is the proper fix and is follow-up work, because it edits a monitoring
# workload.
