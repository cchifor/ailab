kind: Secret
metadata:
    name: ntfy-gatus-auth
    namespace: gatus
type: Opaque
stringData:
    token: ENC[AES256_GCM,data:6lf1SUvvjbxR4GFb+NPk4F359vHzCPCVnFhzUP6kOlY=,iv:FQr3QmdEKja8DHKa77/iTZXKr+gjJW3G2ChCBskzJDY=,tag:V+r8uqYWTnxAHyol3lbFHw==,type:str]
