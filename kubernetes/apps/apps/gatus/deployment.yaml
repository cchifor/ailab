apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: gatus
  labels:
    app.kubernetes.io/name: gatus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gatus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gatus
    spec:
      priorityClassName: platform-normal
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gatus
          image: ghcr.io/twin/gatus:v5.36.0
          env:
            - { name: GATUS_CONFIG_PATH, value: /config/config.yaml }
            # WARN silences the per-check "[watchdog] Monitored ... success=true; errors=0" spam
            # (~12 lines/min, 0 real failures) that floods error/warn log views. Failures are
            # tracked via Prometheus metrics + the GatusEndpointDown alert, and now also via the
            # native ntfy alerting path in configmap.yaml — not via logs.
            #
            # WARN still surfaces the one startup line that matters if the ntfy provider is
            # misconfigured: "[config.ValidateAlertingConfig] Ignoring provider=ntfy due to
            # error=..." is logged at WARN, and Gatus then runs on with alerting silently
            # DISABLED. The matching success line (configuredProviders=[ntfy]) is INFO, so set
            # this to INFO temporarily when verifying an alerting change.
            - { name: GATUS_LOG_LEVEL, value: WARN }
            # ntfy ACCESS TOKEN for the native alerting path. configmap.yaml references it as
            # ${NTFY_TOKEN}; Gatus expands environment variables in its config file before parsing,
            # which is what keeps the credential out of the ConfigMap.
            #
            # Deliberately NOT `optional: true`. A missing Secret must stop the pod loudly
            # (CreateContainerConfigError, and a failed `apps` Flux Kustomization since it has
            # wait: true) rather than let Gatus come up healthy with an empty token, no
            # Authorization header, and an alert path that 401s into the void — which is exactly
            # the class of silent-monitoring-failure this whole change exists to remove.
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ntfy-gatus-auth
                  key: token
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: gatus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gatus
  namespace: gatus
  labels:
    app.kubernetes.io/name: gatus
spec:
  selector:
    app.kubernetes.io/name: gatus
  ports:
    - { name: http, port: 8080, targetPort: http }
