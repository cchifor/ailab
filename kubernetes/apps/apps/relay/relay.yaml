apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay
spec:
  selector:
    app: relay
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
      annotations:
        chifor.me/release: relay-0.12.1-release-148784
        chifor.me/source-commit: dfc739a492217ea5a8dfaf2471aead43b2ea646c
        backup.velero.io/backup-volumes: data,dumps
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      tolerations:
      - key: dedicated
        operator: Equal
        value: agent
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      # Recreate stops the old application before this snapshot. Migration is
      # unreachable unless the existing coordinated backup pipeline succeeds.
      - name: backup-database
        image: docker.io/library/postgres:17.12-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        command:
        - timeout
        - '1800'
        - sh
        - /scripts/dump.sh
        env:
        - name: PGHOST
          value: relay-postgres.relay.svc.cluster.local
        - name: PGUSER
          value: relay_backup
        - name: PGDATABASE
          value: relay
        - name: PGCONNECT_TIMEOUT
          value: '15'
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        envFrom:
        - secretRef:
            name: relay-backup
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: dumps
          mountPath: /dumps
        - name: backup-scripts
          mountPath: /scripts
          readOnly: true
        - name: tmp
          mountPath: /tmp
      - name: backup-artifacts
        image: docker.io/library/node:22.23.5-bookworm-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee
        command:
        - node
        - /scripts/rollout-publish.mjs
        env:
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: dumps
          mountPath: /dumps
        - name: data
          mountPath: /artifacts
          readOnly: true
        - name: backup-scripts
          mountPath: /scripts
          readOnly: true
        - name: tmp
          mountPath: /tmp
      # FORWARD-ONLY: schema 92 (080-088 applied by v0.11.1, 089 by v0.11.4, 090-091 by v0.12.0, 092 by
      # v0.12.1: bus type and description, and the membership's changed_at/changed_by/paused_with). An older
      # image is NOT refused: v0.12.0 starts against schema 92, and recovery:fence/initialize demand exactly
      # 1..CURRENT_SCHEMA_VERSION, so a bare re-pin is never a rollback. Rollback to v0.12.0 (e63d533f...) =
      # restore this roll's EARLIEST pre-migration generation (the first backup-database log of the v0.12.1
      # rollout), then recovery:fence with a FRESH generation (relay-restore-fencing carries it), then a
      # reviewed PR re-pins v0.12.0. Its cost is H11's: every connector and agent key revoked, every session
      # ended, the undelivered outbox deleted, a new generation ConfigMap; writes after the backup are lost.
      # docs/runbooks/relay-researcher-hub-upgrade.md, H16, H15, H12 and H11, and "Rollback: migrations are
      # forward-only". Further back: restore the matching rollout's earliest pre-migration generation, fence,
      # re-pin (H15 to v0.11.6, H12 to v0.11.3, H11 to v0.10.25); below v0.10.2 restore the v0.10.2 rollout's
      # pre-migration generation 20261115T162747Z-119fcc01-b84d-4be5-a80c-ac5196caaf73 (else H1's), fence,
      # then a reviewed PR re-pins v0.9.1 (runbook "Rollback", the H2 mechanics).
      # Relay v0.12.1, source dfc739a492217ea5a8dfaf2471aead43b2ea646c (release/v0.12)
      # release v0.12.1 / run 148784; schema 92 (migration 092: bus types; membership pause records).
      # Native Pi inference sessions; see relay-inference-v0113-20261124.md.
      - image: registry.chifor.me/relay/control-plane@sha256:177c1af20e5708af2ceb01e4e6360bd0b08a4859f50edad3784257ef74ea350f
        workingDir: /app
        envFrom:
        - secretRef:
            name: relay-migrations
        env:
        - name: NODE_ENV
          value: production
        # A migration blocked on a lock fails (55P03) after 10 s instead of waiting behind a
        # straggler (rehearsed: 11 s). Each migration commits on its own, so the schema is then at the
        # last committed one (read schema_migrations). The kubelet retries migrate with backoff and each
        # retry resumes from the next uncommitted migration: clearing the lock is enough, do NOT force
        # a second rollout. A recreated Pod re-runs backup-database and publishes a generation of the
        # partly migrated schema, so a rollback restores this roll's EARLIEST generation (fence above).
        - name: PGOPTIONS
          value: "-c lock_timeout=10s"
        - name: RELAY_HOST
          value: 0.0.0.0
        - name: RELAY_PORT
          value: '8788'
        - name: RELAY_URL
          value: https://relay.chifor.me
        - name: RELAY_DATA_DIR
          value: /data
        - name: RELAY_LLM_URL
          value: https://router.chifor.me/v1
        - name: RELAY_LLM_MODEL
          value: gpt-6-luna
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        name: migrate
        command:
        - sh
        - -c
        - test -s /tmp/relay-pre-migration-backup.json && node dist/scripts/migrate.js && node dist/scripts/bootstrap.js
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
      containers:
      # Relay v0.12.1, source dfc739a492217ea5a8dfaf2471aead43b2ea646c (release/v0.12)
      # release v0.12.1 / run 148784; schema 92 (migration 092: bus types; membership pause records).
      # Native Pi inference sessions; see relay-inference-v0113-20261124.md.
      - image: registry.chifor.me/relay/control-plane@sha256:177c1af20e5708af2ceb01e4e6360bd0b08a4859f50edad3784257ef74ea350f
        workingDir: /app
        envFrom:
        - secretRef:
            name: relay-secrets
        env:
        - name: NODE_ENV
          value: production
        # Browser sign-in through the ailab Keycloak (ADR 0038, docs/runbooks/keycloak.md). Rollback =
        # `local` (the administrator-token sign-in; RELAY_ADMIN_TOKEN stays in relay-secrets).
        # OIDC_CLIENT_SECRET comes from relay-secrets and MUST equal Keycloak's `relay` client secret.
        - name: RELAY_AUTH_MODE
          value: oidc
        - name: OIDC_ISSUER
          value: https://id.chifor.me/realms/relay
        - name: OIDC_CLIENT_ID
          value: relay
        - name: OIDC_PROVIDER_NAME
          value: Relay ID
        # Also delivered by the envFrom relay-secrets above; named explicitly so the dependency is
        # visible here and the pod refuses to start (CreateContainerConfigError) if the key is missing.
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: relay-secrets
              key: OIDC_CLIENT_SECRET
        # Keycloak has no SMTP: an operator marks a member's email verified when binding them
        # (ADR 0038 decision 4). No OIDC_IDP_HINT until the Google broker exists.
        - name: OIDC_REQUIRE_EMAIL_VERIFIED
          value: '1'
        - name: RELAY_HOST
          value: 0.0.0.0
        - name: RELAY_PORT
          value: '8788'
        - name: RELAY_URL
          value: https://relay.chifor.me
        # Every request arrives from cloudflared, so without this all clients share one source
        # address for rate limits and the pending access-request cap. Cloudflare's edge overwrites
        # CF-Connecting-IP on every request. The header is trustworthy ONLY because
        # network-policy.yaml admits ingress to 8788 from edge/cloudflared alone; remove this
        # setting before adding any other ingress path to the relay pod.
        - name: RELAY_CLIENT_ADDRESS_HEADER
          value: cf-connecting-ip
        - name: RELAY_DATA_DIR
          value: /data
        - name: RELAY_LLM_URL
          value: https://router.chifor.me/v1
        - name: RELAY_LLM_MODEL
          value: gpt-6-luna
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        name: relay
        command:
        - node
        - dist/server/main.js
        ports:
        - name: http
          containerPort: 8788
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1536Mi
        startupProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
      - name: backup-holder
        image: docker.io/library/node:22.23.5-bookworm-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee
        # PID 1 with no handler ignores SIGTERM: exit on it, so a roll does not wait out the 45 s grace period
        # and record exit 137 (docker stop: 15.2 s / 137 without, 0.17 s / 0 with).
        command:
        - node
        - -e
        - process.on("SIGTERM",()=>process.exit(0));setInterval(()=>{},3600000)
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: dumps
          mountPath: /dumps
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: relay-data
      - name: tmp
        emptyDir: {}
      - name: dumps
        persistentVolumeClaim:
          claimName: relay-postgres-dumps
      - name: backup-scripts
        configMap:
          name: relay-backup-script
