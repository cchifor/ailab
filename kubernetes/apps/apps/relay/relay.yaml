apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay
spec:
  selector:
    app: relay
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
      annotations:
        chifor.me/release: relay-0.3.1-ci-20261004
        chifor.me/source-commit: 1a94684350342a41c5a95c8e742a86a49261af3e
        backup.velero.io/backup-volumes: data,dumps
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      tolerations:
      - key: dedicated
        operator: Equal
        value: agent
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      # Recreate stops the old application before this snapshot. Migration is
      # unreachable unless the existing coordinated backup pipeline succeeds.
      - name: backup-database
        image: docker.io/library/postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        command:
        - timeout
        - '1800'
        - sh
        - /scripts/dump.sh
        env:
        - name: PGHOST
          value: relay-postgres.relay.svc.cluster.local
        - name: PGUSER
          value: relay_backup
        - name: PGDATABASE
          value: relay
        - name: PGCONNECT_TIMEOUT
          value: '15'
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        envFrom:
        - secretRef:
            name: relay-backup
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: dumps
          mountPath: /dumps
        - name: backup-scripts
          mountPath: /scripts
          readOnly: true
        - name: tmp
          mountPath: /tmp
      - name: backup-artifacts
        image: docker.io/library/node:22.23.3-bookworm-slim@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
        command:
        - node
        - /scripts/rollout-publish.mjs
        env:
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: dumps
          mountPath: /dumps
        - name: data
          mountPath: /artifacts
          readOnly: true
        - name: backup-scripts
          mountPath: /scripts
          readOnly: true
        - name: tmp
          mountPath: /tmp
      - image: registry.chifor.me/relay/control-plane@sha256:d089449d0185dfa86b751f21017d6810f3d16afabb978689f78a0c942ab1c2df
        workingDir: /app
        envFrom:
        - secretRef:
            name: relay-migrations
        env:
        - name: NODE_ENV
          value: production
        - name: RELAY_HOST
          value: 0.0.0.0
        - name: RELAY_PORT
          value: '8788'
        - name: RELAY_URL
          value: https://relay.chifor.me
        - name: RELAY_DATA_DIR
          value: /data
        - name: RELAY_LLM_URL
          value: https://router.chifor.me/v1
        - name: RELAY_LLM_MODEL
          value: gpt-6-luna
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        name: migrate
        command:
        - sh
        - -c
        - test -s /tmp/relay-pre-migration-backup.json && node dist/scripts/migrate.js && node dist/scripts/bootstrap.js
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
      containers:
      - image: registry.chifor.me/relay/control-plane@sha256:d089449d0185dfa86b751f21017d6810f3d16afabb978689f78a0c942ab1c2df
        workingDir: /app
        envFrom:
        - secretRef:
            name: relay-secrets
        env:
        - name: NODE_ENV
          value: production
        - name: RELAY_HOST
          value: 0.0.0.0
        - name: RELAY_PORT
          value: '8788'
        - name: RELAY_URL
          value: https://relay.chifor.me
        - name: RELAY_DATA_DIR
          value: /data
        - name: RELAY_LLM_URL
          value: https://router.chifor.me/v1
        - name: RELAY_LLM_MODEL
          value: gpt-6-luna
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        name: relay
        command:
        - node
        - dist/server/main.js
        ports:
        - name: http
          containerPort: 8788
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1536Mi
        startupProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
      - name: backup-holder
        image: docker.io/library/node:22.23.3-bookworm-slim@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
        command:
        - node
        - -e
        - setInterval(()=>{},3600000)
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: dumps
          mountPath: /dumps
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: relay-data
      - name: tmp
        emptyDir: {}
      - name: dumps
        persistentVolumeClaim:
          claimName: relay-postgres-dumps
      - name: backup-scripts
        configMap:
          name: relay-backup-script
