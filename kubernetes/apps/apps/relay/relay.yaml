apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay
spec:
  selector:
    app: relay
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
      annotations:
        chifor.me/release: relay-0.2.0-20261002
        chifor.me/source-commit: e82a1222d4eab1d410ad67bcf017ada2f2856f12
        chifor.me/release-sha256: f60b8178e3f3c4271382355332154720de2587c310ff9cde4ee83defc75fa821
        backup.velero.io/backup-volumes: data,dumps
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      tolerations:
      - key: dedicated
        operator: Equal
        value: agent
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - image: docker.io/library/node:22.23.3-bookworm-slim@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
        workingDir: /app
        envFrom:
        - secretRef:
            name: relay-migrations
        env:
        - name: NODE_ENV
          value: production
        - name: RELAY_HOST
          value: 0.0.0.0
        - name: RELAY_PORT
          value: '8788'
        - name: RELAY_URL
          value: https://relay.chifor.me
        - name: RELAY_DATA_DIR
          value: /data
        - name: RELAY_LLM_URL
          value: https://router.chifor.me/v1
        - name: RELAY_LLM_MODEL
          value: gpt-6-luna
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: releases
          mountPath: /app
          subPath: relay-0.2.0-20261002
          readOnly: true
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        name: migrate
        command:
        - sh
        - -c
        - node dist/scripts/migrate.js && node dist/scripts/bootstrap.js
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
      containers:
      - image: docker.io/library/node:22.23.3-bookworm-slim@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
        workingDir: /app
        envFrom:
        - secretRef:
            name: relay-secrets
        env:
        - name: NODE_ENV
          value: production
        - name: RELAY_HOST
          value: 0.0.0.0
        - name: RELAY_PORT
          value: '8788'
        - name: RELAY_URL
          value: https://relay.chifor.me
        - name: RELAY_DATA_DIR
          value: /data
        - name: RELAY_LLM_URL
          value: https://router.chifor.me/v1
        - name: RELAY_LLM_MODEL
          value: gpt-6-luna
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: releases
          mountPath: /app
          subPath: relay-0.2.0-20261002
          readOnly: true
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        name: relay
        command:
        - node
        - dist/server/main.js
        ports:
        - name: http
          containerPort: 8788
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1536Mi
        startupProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
      - name: backup-holder
        image: docker.io/library/node:22.23.3-bookworm-slim@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
        command:
        - node
        - -e
        - setInterval(()=>{},3600000)
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: dumps
          mountPath: /dumps
          readOnly: true
      volumes:
      - name: releases
        persistentVolumeClaim:
          claimName: relay-releases
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: relay-data
      - name: tmp
        emptyDir: {}
      - name: dumps
        persistentVolumeClaim:
          claimName: relay-postgres-dumps
