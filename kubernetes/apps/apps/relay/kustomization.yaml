apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- storage.yaml
- relay-secrets.sops.yaml
- relay-migrations.sops.yaml
- relay-postgres.sops.yaml
- relay-backup.sops.yaml
- postgres.yaml
- relay.yaml
- network-policy.yaml
- postgres-bootstrap.yaml
- backup.yaml
# The relay-operator reaper: the independent backstop for the JIT automation identity's temporary admin
# (operator-reaper.yaml; docs/runbooks/relay.md, "Operator automation identity").
- relay-operator-reaper.sops.yaml
- operator-reaper.yaml
configMapGenerator:
- name: relay-operator-reaper-scripts
  namespace: relay  # a generator entry renders WITHOUT a namespace otherwise, and Flux rejects the whole layer
  files:
  - lease.py=operator-reaper/lease.py
  - setup.sql=operator-reaper/setup.sql
components:
# Default agent communication; it contains no router/OpenBao Secret or trust bridge.
- ../../../components/relay-default-communication
# Researcher hub upgrade H3 (docs/runbooks/relay-researcher-hub-upgrade.md): the recovery generation
# (initialized once by recovery:initialize) and worker installations, enabled together.
- ../../../components/relay-restore-fencing
- ../../../components/relay-infrastructure-installations
# H4a: the worker budget ledger's client files only (RELAY_WORKER_BUDGET_{DSN,CA,WITNESS}_FILE). The
# budget authority stays unstarted until H7's candidate file gives it a profile source.
- ../../../components/relay-worker-budget-client
# H6: the Router connection (its record, signer keys, escrow token and OpenBao egress), the agent
# control plane with its full scope (owner decision G2), and the control-plane collector with the
# worker alerts. Environments, Gitea issuers and notifications stay off (G2). Budget startup reads
# start_failed until H7: the authority has no profile source before then.
- ../../../components/relay-router-connection
- ../../../components/relay-agent-control-plane
- ../../../components/relay-control-monitoring
- ../../../components/relay-worker-monitoring
