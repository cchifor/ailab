apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: relay-operator-reaper
  namespace: relay
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: relay
spec:
  groups:
  - name: relay-operator-reaper
    rules:
    - alert: RelayOperatorReaperStale
      # `absent` covers a reaper that has NEVER succeeded (kube-state-metrics emits no last-success series until
      # the first success), a deleted CronJob and a missing scrape; the first run is due within 5 min.
      expr: >-
        (time() - kube_cronjob_status_last_successful_time{namespace="relay", cronjob="relay-operator-reaper"} > 1200)
        or absent(kube_cronjob_status_last_successful_time{namespace="relay", cronjob="relay-operator-reaper"})
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: The relay-operator reaper has not succeeded for 20+ minutes
        description: >-
          The independent backstop that removes a standing JIT admin membership (after a crashed
          `relay-operator.py session|call`) is not running. Check the CronJob relay/relay-operator-reaper and its last
          Job's logs; meanwhile run `python scripts/relay-operator.py status` (expect 0 memberships, 0 sessions).
    - alert: RelayOperatorReaperFailing
      expr: sum(kube_job_status_failed{namespace="relay", job_name=~"relay-operator-reaper-[0-9]+"} > 0) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: relay-operator reaper Jobs are failing
        description: >-
          A relay-operator-reaper Job failed (Lease API, database or image). A "password authentication failed" or
          "function ... does not exist" in its reap log means the database objects are missing (a restore or
          re-initialization loses them): run `python scripts/relay-operator-reaper-setup.py`. Meanwhile run
          `python scripts/relay-operator.py status` and `revoke` by hand if a membership stands.
