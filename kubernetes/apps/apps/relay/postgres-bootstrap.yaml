apiVersion: v1
kind: ConfigMap
metadata:
  name: relay-postgres-bootstrap
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay
data:
  010-relay-roles.sh: |
    #!/bin/sh
    set -eu
    # Run only during initdb, through the socket-only temporary bootstrap server.
    # Never grant runtime identities superuser, CREATEROLE, or membership in the migrator.
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL'
    \getenv owner_password RELAY_OWNER_PASSWORD
    \getenv app_password RELAY_APP_PASSWORD
    \getenv migrator_password RELAY_MIGRATOR_PASSWORD
    \getenv backup_password RELAY_BACKUP_PASSWORD
    CREATE ROLE relay_owner LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION BYPASSRLS PASSWORD :'owner_password';
    CREATE ROLE relay_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'app_password';
    CREATE ROLE relay_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'migrator_password';
    CREATE ROLE relay_backup LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION BYPASSRLS PASSWORD :'backup_password';
    ALTER DATABASE relay OWNER TO relay_migrator;
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    GRANT USAGE ON SCHEMA public TO relay_owner, relay_app, relay_backup;
    ALTER DEFAULT PRIVILEGES FOR ROLE relay_migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO relay_owner;
    ALTER DEFAULT PRIVILEGES FOR ROLE relay_migrator IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO relay_owner;
    ALTER DEFAULT PRIVILEGES FOR ROLE relay_migrator IN SCHEMA public GRANT SELECT ON TABLES TO relay_backup;
    ALTER DEFAULT PRIVILEGES FOR ROLE relay_migrator IN SCHEMA public GRANT SELECT ON SEQUENCES TO relay_backup;
    SQL
    # TCP connections never authenticate as the bootstrap superuser. Admin recovery uses
    # kubectl exec and the local socket, with no bootstrap password in the web container.
    { printf '%s\n' 'host all postgres all reject'; cat "$PGDATA/pg_hba.conf"; } > "$PGDATA/pg_hba.conf.relay"
    mv "$PGDATA/pg_hba.conf.relay" "$PGDATA/pg_hba.conf"
