rule_files:
- operator-reaper-rules.yaml
evaluation_interval: 1m
tests:
- name: never succeeded and older than threshold
  interval: 1m
  input_series:
  - series: kube_cronjob_created{namespace="relay",cronjob="relay-operator-reaper"}
    values: 0+0x35
  alert_rule_test:
  - eval_time: 31m
    alertname: RelayOperatorReaperStale
    exp_alerts:
    - exp_labels:
        namespace: relay
        cronjob: relay-operator-reaper
        severity: warning
      exp_annotations: &id001
        summary: The relay-operator reaper has not succeeded for 20+ minutes
        description: The independent backstop that removes a standing JIT admin membership
          (after a crashed `relay-operator.py session|call`) is not running. Check
          the CronJob relay/relay-operator-reaper and its last Job's logs; meanwhile
          run `python scripts/relay-operator.py status` (expect 0 memberships, 0 sessions).
  - eval_time: 31m
    alertname: RelayOperatorReaperUnobserved
    exp_alerts: []
- name: new CronJob has creation grace
  interval: 1m
  input_series:
  - series: kube_cronjob_created{namespace="relay",cronjob="relay-operator-reaper"}
    values: 1800+0x35
  alert_rule_test:
  - eval_time: 31m
    alertname: RelayOperatorReaperStale
    exp_alerts: []
  - eval_time: 31m
    alertname: RelayOperatorReaperUnobserved
    exp_alerts: []
- name: stale last success
  interval: 1m
  input_series:
  - series: kube_cronjob_created{namespace="relay",cronjob="relay-operator-reaper"}
    values: 0+0x35
  - series: kube_cronjob_status_last_successful_time{namespace="relay",cronjob="relay-operator-reaper"}
    values: 0+0x35
  alert_rule_test:
  - eval_time: 31m
    alertname: RelayOperatorReaperStale
    exp_alerts:
    - exp_labels:
        namespace: relay
        cronjob: relay-operator-reaper
        severity: warning
      exp_annotations: *id001
  - eval_time: 31m
    alertname: RelayOperatorReaperUnobserved
    exp_alerts: []
- name: recent success overrides old creation
  interval: 1m
  input_series:
  - series: kube_cronjob_created{namespace="relay",cronjob="relay-operator-reaper"}
    values: 0+0x35
  - series: kube_cronjob_status_last_successful_time{namespace="relay",cronjob="relay-operator-reaper"}
    values: 1200+0x35
  alert_rule_test:
  - eval_time: 31m
    alertname: RelayOperatorReaperStale
    exp_alerts: []
  - eval_time: 31m
    alertname: RelayOperatorReaperUnobserved
    exp_alerts: []
- name: missing telemetry held for ten minutes
  interval: 1m
  input_series: []
  alert_rule_test:
  - eval_time: 10m
    alertname: RelayOperatorReaperStale
    exp_alerts: []
  - eval_time: 10m
    alertname: RelayOperatorReaperUnobserved
    exp_alerts:
    - exp_labels:
        namespace: relay
        cronjob: relay-operator-reaper
        severity: warning
      exp_annotations:
        summary: The relay-operator reaper has no CronJob telemetry
        description: Check CronJob relay/relay-operator-reaper and kube-state-metrics;
          absence is not evidence that cleanup succeeded.
- name: missing telemetry still pending
  interval: 1m
  input_series: []
  alert_rule_test:
  - eval_time: 9m
    alertname: RelayOperatorReaperStale
    exp_alerts: []
  - eval_time: 9m
    alertname: RelayOperatorReaperUnobserved
    exp_alerts: []
- name: stale threshold still pending
  interval: 1m
  input_series:
  - series: kube_cronjob_created{namespace="relay",cronjob="relay-operator-reaper"}
    values: 0+0x35
  alert_rule_test:
  - eval_time: 30m
    alertname: RelayOperatorReaperStale
    exp_alerts: []
  - eval_time: 30m
    alertname: RelayOperatorReaperUnobserved
    exp_alerts: []
