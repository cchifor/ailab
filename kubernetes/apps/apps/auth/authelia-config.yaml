apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: auth
data:
  configuration.yml: |
    theme: 'light'
    server:
      address: 'tcp://0.0.0.0:9091'
    log:
      level: 'info'
      format: 'text'
    # The pod has no external NTP egress (UDP/123); that startup check is fatal by default — skip it
    # (the host/kubelet clock is authoritative). Validated 2026-06-15.
    ntp:
      disable_startup_check: true
    totp:
      issuer: 'chifor.me'
    webauthn:
      # Passkeys — closes the ADR 0012 "future: raise to two_factor (TOTP/WebAuthn)" line. With
      # `enable_passkey_login` the portal offers "Sign in with a passkey" ALONGSIDE the password form
      # (it replaces nothing), and a passkey satisfies the `one_factor` default policy on its own.
      # On Windows the platform authenticator is Windows Hello, so this is the face/PIN login.
      #
      # The Relying Party ID is derived from the session cookie domain (`chifor.me`), so ONE
      # registered credential covers every *.chifor.me app. Credentials live in infra-pg (see
      # `storage` below), not on a pod — both replicas see them and a reschedule keeps them.
      #
      # selection_criteria is left at defaults on purpose: `discoverability: preferred` is what makes
      # Windows Hello mint a DISCOVERABLE credential (required for passwordless login) while still
      # accepting a roaming key that can't store one. Forcing `required` would reject those.
      enable_passkey_login: true
      display_name: 'chifor.me'
    identity_validation:
      reset_password:
        jwt_lifespan: '5 minutes'
      elevated_session:
        # Registering a credential needs an elevated session, and the One-Time Code is delivered via
        # the `notifier` — which is `filesystem` here (no SMTP relay in the estate), so the code must
        # be read out of the pod by hand:
        #   kubectl --context admin@ai -n auth exec <pod> -- cat /data/notification.txt
        # With 2 replicas the code lands on WHICHEVER pod served the request, so check both. 5 minutes
        # (the default) is not enough for that dance — 15 gives room. See docs/runbooks/passkeys.md.
        code_lifespan: '15 minutes'
    authentication_backend:
      password_reset:
        disable: false
      file:
        path: '/secrets/users_database.yml'
        watch: false
        password:
          algorithm: 'argon2'
    access_control:
      default_policy: 'one_factor'
    session:
      # Shared session store (ADR 0016): both authelia replicas see the same sessions. Password via
      # AUTHELIA_SESSION_REDIS_PASSWORD_FILE env. auth-valkey is accepted-ephemeral — a bounce means
      # one estate-wide re-login.
      redis:
        host: 'auth-valkey.auth.svc.cluster.local'
        port: 6379
      cookies:
        - domain: 'chifor.me'
          authelia_url: 'https://sso.chifor.me'
          default_redirection_url: 'https://home.chifor.me'
          name: 'authelia_session'
          same_site: 'lax'
          # A workday: idle out after 8h, hard-expire at 12h. The old 5-minute `inactivity` was the
          # dominant source of estate-wide re-logins — five idle minutes in a Grafana tab logged you
          # out — and `remember_me` does NOT rescue it: remember_me overrides `expiration` only, and
          # `inactivity` is an independent timer that applies to remembered sessions too.
          expiration: '12 hours'
          inactivity: '8 hours'
          remember_me: '1 month'
    regulation:
      max_retries: 3
      find_time: '2 minutes'
      ban_time: '5 minutes'
    storage:
      # infra-pg (databases ns, ADR 0016) — replaces local SQLite so 2 replicas can share state
      # (TOTP/WebAuthn credentials, OIDC consents, regulation records). Password via
      # AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE env; schema migrates automatically on first start
      # (same storage_encryption_key as before).
      postgres:
        address: 'tcp://infra-pg-rw.databases.svc.cluster.local:5432'
        database: 'authelia'
        username: 'authelia'
        timeout: '5s'
    notifier:
      # Per-pod emptyDir now (no SMTP relay in the estate): a password-reset notification lands on
      # whichever replica served the request — `kubectl exec` into BOTH pods to find it.
      filesystem:
        filename: '/data/notification.txt'
    identity_providers:
      oidc:
        # jwks (RSA issuer key) + the *_secret values are merged from /secrets (SOPS) + *_FILE env.
        # Authelia 4.39 releases groups/email/name via the USERINFO endpoint by default, NOT the id_token.
        # The AgentForge CP reads its claims from the id_token (authlib token["userinfo"] = the parsed
        # id_token), so without this the groups claim is empty on login and no org is provisioned (the CP
        # fails SHUT). This policy also puts groups+email+name in the id_token for the agentforge client.
        claims_policies:
          agentforge_id_token:
            id_token: ['groups', 'email', 'name', 'preferred_username']
        # Named client policies (Authelia >= 4.38). `admins_only` denies every authenticated user outside
        # the `admins` group at the OIDC authorization step (Authelia shows "access denied", no app session
        # is created). Applied to the first-party admin surfaces — Homepage (oauth2-proxy) and the
        # registry web UI — so a plain SSO user (Gitea + chat + Grafana viewer) cannot reach them. Every
        # client left on 'one_factor' is open to any Authelia user by design (Gitea, Grafana, Open WebUI;
        # the AgentForge CP fails shut on its own without an `af:*` group).
        authorization_policies:
          admins_only:
            default_policy: 'deny'
            rules:
              - policy: 'one_factor'
                subject: ['group:admins']
        clients:
          - client_id: 'grafana'
            client_name: 'Grafana'
            client_secret: '$pbkdf2-sha512$310000$CMKUlWypPN6vZwlMlBZLaA$2mUFKRsGnbaII062DHL0Nz9QMZ2qVIL52tTJaAyG6Mop6A6e6CYG6UOIBe9cQ6lRoIIoQYv.yBxjMaDUCSYI5g'
            public: false
            authorization_policy: 'one_factor'
            require_pkce: true
            pkce_challenge_method: 'S256'
            redirect_uris:
              - 'https://grafana.chifor.me/login/generic_oauth'
            scopes: ['openid', 'profile', 'groups', 'email']
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'client_secret_basic'
          - client_id: 'open-webui'
            client_name: 'Open WebUI'
            client_secret: '$pbkdf2-sha512$310000$IWCIzzFvd6QBYU4P1Lp5qg$JCPWbxrDtzr7F/9YDvp0L6ARp5U8YqsfR5eebVD571xcFDQAjlSdJKXZE26UTRRJKb0FidZUB4SoHpFRI1hnKg'
            public: false
            authorization_policy: 'one_factor'
            require_pkce: true
            pkce_challenge_method: 'S256'
            redirect_uris:
              - 'https://chat.chifor.me/oauth/oidc/callback'
            scopes: ['openid', 'profile', 'groups', 'email']
            token_endpoint_auth_method: 'client_secret_basic'
          - client_id: 'homepage'
            client_name: 'Homepage'
            # oauth2-proxy gates home.chifor.me (Homepage has no native auth). Secret hash only here;
            # plaintext is in the SOPS secret oauth2-proxy-homepage (homepage ns).
            client_secret: '$pbkdf2-sha512$310000$E0TyCO.pOHUf1f7/qGL0IQ$MfA8SKebk4E.zU5LmVQ.tWFOWUwctQVgYgHO4i0A8YXYqZeUtppo1E7p4yF1GqXyKaJoKqiOjDs/S2.K8NF9qw'
            public: false
            authorization_policy: 'admins_only' # admin surface — see authorization_policies above
            consent_mode: 'implicit' # first-party app: auto-grant consent (no prompt) for seamless SSO
            require_pkce: true
            pkce_challenge_method: 'S256'
            redirect_uris:
              - 'https://home.chifor.me/oauth2/callback'
            scopes: ['openid', 'profile', 'groups', 'email']
            token_endpoint_auth_method: 'client_secret_basic'
          - client_id: 'registry'
            client_name: 'Container Registry'
            # zot web-UI login via Authelia. zot does NOT use PKCE (require_pkce: false, unlike the
            # others). Secret HASH only here; plaintext is in ansible/secrets/registry.sops.yaml
            # (registry_oidc_client_secret), consumed by the registry_zot role -> zot
            # http.auth.openid. Docker push (ci/htpasswd) + anonymous pull (Talos) are unaffected.
            client_secret: '$pbkdf2-sha512$310000$qq/PKAlfJkUAEttvKgwY3A$wEzLVupv9Wtgxw3uxsIiGk2RWL.qxZoXcbz.o1CddtC84NQGawI6XXnD.n.6SRO7rMncrQygfWrrP64rLUwqFA'
            public: false
            authorization_policy: 'admins_only' # admin surface — see authorization_policies above
            consent_mode: 'implicit'
            require_pkce: false
            redirect_uris:
              - 'https://registry.chifor.me/zot/auth/callback/oidc'
            scopes: ['openid', 'profile', 'groups', 'email']
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'client_secret_basic'
          - client_id: 'gitea'
            client_name: 'Gitea'
            # Gitea OIDC login source "Authelia" (gitea.yaml gitea.oauth). Secret HASH only here;
            # plaintext is in kubernetes/apps/apps/gitea/gitea-oauth.sops.yaml (key=gitea, secret=...).
            # Gitea authenticates with client_secret_basic and may omit PKCE -> require_pkce: false
            # (still accepted if sent). Callback is /user/oauth2/<source-name>/callback.
            client_secret: '$pbkdf2-sha512$310000$Rps1dyu9CKic1A0/rELDHQ$aiXVmLHemqcPCgpZ6IlMxcf5JGSH3eUvDZqptQIcGoH/6OQKrW73PToKeWcCtlJljk3x7frjoxM8AU.GhAfxjg'
            public: false
            authorization_policy: 'one_factor'
            consent_mode: 'implicit'
            require_pkce: false
            redirect_uris:
              - 'https://git.chifor.me/user/oauth2/Authelia/callback'
            scopes: ['openid', 'profile', 'groups', 'email']
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'client_secret_basic'
          - client_id: 'agentforge'
            client_name: 'AgentForge'
            # OPERATOR PREREQUISITE (usability): the CP derives org membership from the `groups` claim
            # (a group `af:<org>:<role>` grants membership; empty groups => the CP fails SHUT, everyone
            # denied). No user has an AgentForge group yet, so seed one on the tenant-zero owner in the
            # Authelia user DB (authelia-secret.sops.yaml), e.g. add `af:tenant-zero:owner` to your
            # groups, before expecting to log in and provision.
            # AgentForge v2 control plane (FastAPI OIDC RP) at agentforge.chifor.me (ADR 0019). Secret
            # HASH only here (pbkdf2-sha512, 310000 iters — matches the other clients); plaintext is in
            # kubernetes/apps/apps/agentforge/agentforge-oauth.sops.yaml (ns agentforge, key
            # OIDC_CLIENT_SECRET). The CP reads the `groups` claim for org RBAC. Regenerate the pair with:
            #   authelia crypto hash generate pbkdf2 --variant sha512 --iterations 310000 --random \
            #            --random.length 72 --random.charset rfc3986
            client_secret: '$pbkdf2-sha512$310000$zrkLDIixE/Cgd..skMs.AA$9qg5GdRSlahtbsovzdg4VwIngaVH3NY6ju/UGGZQPwFDlKOr9llUfBfyuMXUus/b.BH65Ehl8P3rLXQWnrNTlQ'
            public: false
            authorization_policy: 'one_factor'
            consent_mode: 'implicit' # first-party app: auto-grant consent (no prompt) for seamless SSO
            require_pkce: true
            pkce_challenge_method: 'S256'
            redirect_uris:
              # Must match the CP's actual callback route (FastAPI auth router prefix is /api/auth)
              # AND the app's AFP_OIDC_REDIRECT_URL — the app rejects a mismatched redirect_uri.
              - 'https://agentforge.chifor.me/api/auth/callback'
            scopes: ['openid', 'profile', 'groups', 'email']
            # Put groups+email in the id_token (the CP reads id_token claims, not the userinfo endpoint).
            claims_policy: 'agentforge_id_token'
            token_endpoint_auth_method: 'client_secret_basic'
