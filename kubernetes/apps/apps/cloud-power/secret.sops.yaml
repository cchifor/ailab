# PVE API token for the cloud-power shutdown path.
#
# Identity: cloudpower@pve!ailab — a DEDICATED user, not root. Role CloudPower grants exactly
# Sys.PowerMgmt + Sys.Audit on /nodes and VM.Audit on /vms. Verified: it can read node state and
# list guests (needed for the OFF preflight warning) but DELETE on a container returns 403, and
# /access/users and /storage both return EMPTY lists.
