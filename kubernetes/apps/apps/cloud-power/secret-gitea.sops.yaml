# Gitea PAT for the scheduled OFF: cloud-power pauses the cloud CI runners (cloud-ci-*) before a
# power-off and re-enables them once their hosts are down (plans/2026-09-28-cloud-power-scheduled-drain-plan.md).
#
# Identity: `org-ops-bot`, a NON-admin member of the org Owners team (never the site-admin
# `chifor`), token name `org-ops-cloud-power-20261006`, scope write:organization.
# Gitea 1.26 requires org OWNER for PATCH /orgs/{org}/actions/runners/{id} (reqOwnerCheck) and org
# READER for GET /orgs/{org}/actions/jobs; both sit in the `organization` token category and there
# is no narrower scope, so this token can administer the org. It is mounted only into the api pod,
# whose ingress is oauth2-proxy-only (networkpolicy.yaml); the hostNetwork wol pod never sees it.
#
# Mint (ONCE - PAT scopes are immutable, and token-auth cannot list or revoke tokens):
#   kubectl --context admin@ai -n gitea exec deploy/gitea -c gitea -- \
#     gitea admin user generate-access-token --raw -u org-ops-bot -t org-ops-cloud-power-<date> --scopes write:organization
# then write it under stringData.token here and `sops --encrypt --in-place` this file
# (.sops.yaml's generic rule: data|stringData). `git diff` must show ENC[...] for `token`.
# Then bump ailab.chifor.me/gitea-token-rotated on the api Deployment template (no reloader).
# Revoke: delete the token row (org-ops-bot has no usable password; token auth cannot revoke).
