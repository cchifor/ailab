# Defense-in-depth: the CP authenticates every request itself (FastAPI OIDC RP against Authelia) and
# is exposed via cloudflared (NO CF Access — it does its own SSO). Without a NetworkPolicy any
# in-cluster pod could reach agentforge-platform.agentforge.svc directly. This admits ingress ONLY
# from the cloudflared tunnel pods (ns edge) so arbitrary in-cluster pods can't reach the API. Egress
# is left unrestricted (the CP needs the kube-apiserver, infra-pg, Authelia, and the in-cluster Gitea).
#
# ⚠️ VALIDATE on the live cluster after applying:
#   * confirm the agentforge-platform pod stays Ready — kubelet liveness/readiness probes must still
#     reach it. Default Cilium allows host->pod; if Cilium runs the host firewall restricted, add a
#     CiliumNetworkPolicy fromEntities:[host] so the probes aren't denied.
#   * confirm https://agentforge.chifor.me loads through the tunnel.
#
# TWO POLICIES LIVE IN THIS FILE, and the second one is why: NetworkPolicies are additive-allow, so
# the only way to grant a reach that lands on ONE pod is a second policy whose podSelector names it.
# This first policy is namespace-wide (podSelector: {}), so every `from:` clause in it is a grant to
# EVERY pod in ns agentforge on the named port — which is the right shape for the tunnel and the
# tenant workers, and the wrong shape for "let Prometheus scrape the CP". Put CP-only reaches in the
# second policy below, not here.
#
# Ingress = the cloudflared tunnel (public SSO path) + tenant workers. In P1 the shadow worker must
# GET /api/v1/.../config and POST /api/ingest/events from its tenant namespace, so the worker->CP path
# is admitted here (not deferred to P2) — scoped to CP-managed tenant namespaces + the CP http port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentforge-allow-tunnel-only
  namespace: agentforge
spec:
  podSelector: {} # EVERY pod in ns agentforge — no longer just the CP: the dispatcher, the
                  # reaper and (unlisted) the conductor live here too, and each is in ingress
                  # default-deny from this policy whether or not it has one of its own.
  policyTypes: [Ingress]
  ingress:
    - from:
        # The public path: the cloudflared tunnel (-> the CP's own Authelia OIDC).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
    - from:
        # Tenant workers (config fetch + ingest). Scoped to CP-rendered tenant namespaces
        # (label app.kubernetes.io/managed-by: agentforge-cp — set by the renderer's namespace).
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/managed-by: agentforge-cp
      ports:
        - { protocol: TCP, port: 8080 } # the CP container/http port
---
# THE CP-ONLY INGRESS. Everything above is namespace-wide; everything here lands on the control-plane
# pod alone, because `agentforge-platform` is the only pod these two callers have any business
# reaching and 8080 is not a metrics port — it is the CP's FULL API, sharing one listener with
# /metrics. A grant on 8080 is a grant to the API.
#
# WHY A SECOND POLICY RATHER THAN TWO MORE `from:` CLAUSES ABOVE. Both reviewers of PR #674 caught the
# first version of this: a clause added to the policy above inherits its `podSelector: {}`, so
# "admit Prometheus to the CP" silently became "admit the whole monitoring namespace to every pod in
# ns agentforge on 8080". k8s NetworkPolicies are additive-allow and a policy's destination is fixed
# by its own podSelector, so narrowing the destination is not something a clause can do — it takes a
# policy. The dispatcher's precedent is not a counter-example: it admits monitoring to a DEDICATED
# metrics port (9464) on one workload, which is this shape, not the namespace-wide one.
#
# EACH PEER CARRIES BOTH SELECTORS. A `from:` list is OR and the AND lives inside a single list item,
# so splitting either peer's namespaceSelector and podSelector into two `-` entries would admit every
# pod in that namespace OR every pod anywhere carrying the label — silent over-admission of exactly
# what this file exists to prevent.
#
# ⚠️ THE LABELS ARE LOAD-BEARING AND WERE READ OFF THE LIVE CLUSTER (2026-09-11), not guessed: the
# kube-prometheus-stack Prometheus pod carries `app.kubernetes.io/name: prometheus` +
# `app.kubernetes.io/instance: kube-prometheus-stack-prometheus` (set by prometheus-operator). If a
# chart upgrade changes them this policy stops admitting the scrape and the CP target goes down —
# ForgePlatformTargetDown (monitoring/agentforge-platform-rules.yaml) is the alert that says so, and
# its description names this file first.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentforge-platform-allow-scrape-and-conductor
  namespace: agentforge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentforge-platform # the CP pod ALONE — not the namespace
  policyTypes: [Ingress]
  ingress:
    - from:
        # Prometheus, so the CP's ServiceMonitor has something it can open. Without this nothing
        # scrapes the CP: measured 2026-09-11, `up{namespace="agentforge"}` is one series (the
        # dispatcher's, which is admitted by its own CiliumNetworkPolicy) and `afp_*` is zero.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: kube-prometheus-stack-prometheus
        # The conductor (conductor program row 7), for the findings emitter PR-14 ships. Declared
        # alongside the workload it reaches rather than with that rung.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentforge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agentforge-conductor
      ports:
        - { protocol: TCP, port: 8080 } # the CP container/http port
