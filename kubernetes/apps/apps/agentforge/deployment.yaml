# AgentForge v2 control plane (agentforge-platform) — FastAPI OIDC RP + webapp + resource analyzer +
# GiteaClient (commits tenant desired state to the SEPARATE cchifor/agentforge-tenants repo) + the
# ConnectedCluster reconciler. Runs on the hub, ns agentforge. Image built + pushed to
# registry.chifor.me by the cchifor/agentforge-platform repo's release CI (anonymous-pull, Talos
# already trusts the registry — no imagePullSecret; precedent: headlamp/cloudflared).
#
# GO-LIVE: this Deployment IS now listed in kustomization.yaml (the image is a real pinned @sha256,
# below). Activation is a transactional switch: the readiness probe is /readyz (the DB SELECT-1
# check), so under the wait:true `apps` Kustomization the pod only reports Ready once the platform DB
# is reachable + MIGRATED — do not merge the go-live change until the DB is created + the migration
# Job has run AND the two bot tokens in agentforge-runtime.sops.yaml are minted+filled (see
# docs/runbooks/agentforge-platform-activation.md). The ServiceAccount + Service live in
# serviceaccount-service.yaml so RBAC + the cloudflared/NetworkPolicy references stay satisfied.
#
# P1: single replica (SSE broadcast state is in-memory; HA is P3). No PDB — a PDB on a singleton
# blocks node drains (the strive-pg-primary lesson). Structure mirrors auth/authelia.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentforge-platform
  namespace: agentforge
  labels:
    app.kubernetes.io/name: agentforge-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentforge-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentforge-platform
    spec:
      serviceAccountName: agentforge-platform
      # The Service is named `agentforge-platform`, so k8s would inject AGENTFORGE_PLATFORM_SERVICE_*
      # env vars; disable service links so they can't collide with the app's own config env.
      enableServiceLinks: false
      # Stateless (no PVC) -> evict fast off an unreachable node (default 300s).
      tolerations:
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 60 }
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 60 }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: platform
          # Pinned to the immutable @sha256 of the built image. Repo path is `agentforge/agentforge-platform`
          # (matches the platform CI push target + the sibling `agentforge/p1-worker` convention) — NOT
          # `cchifor/…`, which CI never populates. Entrypoint comes from the Dockerfile (`serve`; the
          # migrate variant lives in db-migrate.yaml).
          #
          # ⚠️ DO NOT ADD PROSE HERE NAMING THE CURRENT TAG, DIGEST OR PR.
          # The pin bot rewrites the `image:` line below and nothing else, so any comment that states
          # WHICH build is pinned is wrong by the next pin — usually within hours. This block previously
          # carried three stacked such paragraphs (`276ccad`, then `ebbb584`, then `c81afd6`), each added
          # to correct the last, and on 2026-07-30 all three disagreed with the line. That is not a
          # cosmetic problem: a reviewer read them and reported that production was running a CP build
          # four pins old, with a 308-line diff of "un-deployed" changes attached as evidence. It was
          # false — the running pod matched this line exactly — but it cost a real investigation.
          # State RULES here, which stay true; never VALUES, which do not.
          #
          # TO LEARN WHAT IS ACTUALLY PINNED AND RUNNING, resolve it — do not read a comment:
          #   git show gitea/main:kubernetes/apps/apps/agentforge/deployment.yaml | grep 'image:'
          #   kubectl -n agentforge get pods -o jsonpath='{..containerStatuses[0].imageID}'
          #   crane digest registry.chifor.me/agentforge/agentforge-platform:<tag>   # tag → digest
          # The pin PR's own title and body name the source commit; that record lives in git history,
          # which cannot go stale, instead of here.
          #
          # RULES THAT DO HOLD, and why:
          # - Verify tag→digest before merging a pin and fail closed if the tag has moved: the tag is
          #   mutable, the digest is not, and only the digest is deployed.
          # - Keep this digest in lockstep with db-migrate.yaml, and read the ⚠️ MIGRATION ORDERING
          #   note there first — it decides whether the two files may move in ONE commit (they may,
          #   whenever the new build moves no alembic head) or whether db-migrate must land alone first.
          # - /readyz fails closed on schema skew, so a Deployment pinned ahead of an un-migrated DB
          #   wedges the CP. That is what the ordering note exists to prevent.
          # - Overlays stay gated shut: AFP_SCHEMA_V2_MIN_WORKER is deliberately NOT set in this file.
          #   (Verifiable by reading this file, which is why it belongs here.)
          image: registry.chifor.me/agentforge/agentforge-platform@sha256:8bfbfd8e4aa753e929b57d75183fa0afa730d6cd29347eea787ef6b3381cc4fa
          ports:
            - { name: http, containerPort: 8080 }
          # ALL config is env_prefix AFP_ (agentforge_platform.settings.Settings). Non-secrets are plain
          # values here; secrets come from SOPS Secrets via secretKeyRef.
          env:
            # -- OIDC RP against Authelia (client block in auth/authelia-config.yaml) --
            - { name: AFP_OIDC_ISSUER, value: "https://sso.chifor.me" }
            - { name: AFP_OIDC_CLIENT_ID, value: "agentforge" }
            # auth router prefix is /api/auth (main._auth_router), so the callback is /api/auth/callback.
            - { name: AFP_OIDC_REDIRECT_URL, value: "https://agentforge.chifor.me/api/auth/callback" }
            - name: AFP_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: agentforge-oauth, key: AFP_OIDC_CLIENT_SECRET }
            # -- database (RLS boundary): two DSNs. app_dsn = afp_app (RLS-enforced request path);
            #    admin_dsn = afp_admin (migrations + audited service path, BYPASSRLS, DB owner). --
            - name: AFP_APP_DSN
              valueFrom:
                secretKeyRef: { name: agentforge-db, key: AFP_APP_DSN }
            - name: AFP_ADMIN_DSN
              valueFrom:
                secretKeyRef: { name: agentforge-db, key: AFP_ADMIN_DSN }
            # -- sessions: build_app() refuses to serve without a strong, non-placeholder key --
            - name: AFP_SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: agentforge-runtime, key: AFP_SESSION_SECRET }
            # -- per-user Gitea PAT encryption key ring (WS2): PUT /api/gitea/credential 503s without it --
            - name: AFP_CRED_ENC_KEY
              valueFrom:
                secretKeyRef: { name: agentforge-runtime, key: AFP_CRED_ENC_KEY }
            # -- SPA: serve the built Vue webapp bundled at /app/webapp in the image --
            - { name: AFP_WEBAPP_DIST, value: "/app/webapp" }
            # -- server-owned worker image the CP renders into tenant Deployments. Provisioning REFUSES
            #    (503) unless this is a pinned digest (repo@sha256:<64hex>) — the p1-worker release CI
            #    fills it. Placeholder here so the CP can start; provisioning is gated until it's real. --
            - { name: AFP_WORKER_IMAGE, value: "registry.chifor.me/agentforge/p1-worker@sha256:ad33340fabdc6f37486c1a5a561906077fc6882e9659965f06a6a921d6fa3e7d" }
            # -- workers fetch their config from the CP over this in-cluster URL. The Service exposes
            #    :8080 (== container port, no DNAT port translation — see serviceaccount-service.yaml). --
            - { name: AFP_CONTROL_PLANE_INTERNAL_URL, value: "http://agentforge-platform.agentforge.svc:8080" }
            # -- tenant git push target (the ONLY repo the CP bot may write); explicit for clarity --
            - { name: AFP_TENANTS_GITEA_URL, value: "https://git.chifor.me" }
            - { name: AFP_TENANTS_REPO, value: "cchifor/agentforge-tenants" }
            # CP bot token -> write access to cchifor/agentforge-tenants (operator-filled placeholder).
            - name: AFP_TENANTS_BOT_TOKEN
              valueFrom:
                secretKeyRef: { name: agentforge-runtime, key: AFP_TENANTS_BOT_TOKEN }
            # Workspace-repo label bootstrap token (distinct from the tenants token; operator-filled).
            - name: AFP_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef: { name: agentforge-runtime, key: AFP_BOOTSTRAP_TOKEN }
            # -- WS4 subscriptions (CP UX Stage 3; contracts C1-C4/C7/C8) ------------------------
            # OpenBao endpoint for the split status/rotator clients. Scheme/address/auth-mount and
            # the role names (af-cp-sub-status / af-cp-sub-rotator) are the Settings defaults and
            # match the Stage-0 provisioner roles; only the CA path needs naming (mounted below).
            - { name: AFP_OPENBAO_CA_PATH, value: "/etc/openbao-ca/ca.crt" }
            # Aud -> broker /readyz map (C4 rotation observability). ALSO the account INVENTORY the
            # Settings surface manages — its keys mirror the live agentforge-broker manifests, which
            # is how the three pre-existing accounts are detected (managed=pre-existing, no adoption
            # migration). The CP's PR-gated add/remove flow keeps BOTH maps below in sync with the
            # broker tree in the SAME PR (R7) — hand-editing one without the other is a drift bug.
            - name: AFP_BROKER_READYZ_URLS
              value: >-
                {"anthropic/claude-max-1":"http://broker-anthropic-max1.agentforge-broker.svc.cluster.local:8700/readyz",
                 "anthropic/claude-max-2":"http://broker-anthropic-max2.agentforge-broker.svc.cluster.local:8700/readyz",
                 "anthropic/claude-max-3":"http://broker-anthropic-claude-max-3.agentforge-broker.svc.cluster.local:8700/readyz",
                 "openai/codex-pro":"http://broker-openai-codex.agentforge-broker.svc.cluster.local:8700/readyz"}
            # Aud -> broker URL map the renderer embeds into tenant sandbox renders
            # (AF_SANDBOX_BROKER_URLS source; P2 provisioning refuses on an empty map).
            - name: AFP_SANDBOX_BROKER_URLS
              value: >-
                {"anthropic/claude-max-1":"http://broker-anthropic-max1.agentforge-broker.svc.cluster.local:8700",
                 "anthropic/claude-max-2":"http://broker-anthropic-max2.agentforge-broker.svc.cluster.local:8700",
                 "anthropic/claude-max-3":"http://broker-anthropic-claude-max-3.agentforge-broker.svc.cluster.local:8700",
                 "openai/codex-pro":"http://broker-openai-codex.agentforge-broker.svc.cluster.local:8700"}
          # WS4 (C1): the restricted agentforge-infra-bot Gitea token (AFP_INFRA_BOT_TOKEN) — the
          # SOPS Secret has existed since Stage 0 (agentforge-infra-bot.sops.yaml); this wires it.
          # The bot is a READ-only collaborator on cchifor/ailab: the CP can only OPEN AGit PRs
          # (push HEAD:refs/for/main), never push branches, approve, or merge.
          envFrom:
            - secretRef:
                name: agentforge-infra-bot
          volumeMounts:
            # ailab-ca ca.crt for the OpenBao TLS endpoint (ns-local copy, see openbao-ca-cert.yaml).
            - name: openbao-ca
              mountPath: /etc/openbao-ca
              readOnly: true
          # Readiness = /readyz (executes SELECT 1 on the admin DSN) so the pod only joins the Service
          # endpoints once the platform DB is reachable + migrated — under the wait:true `apps`
          # Kustomization this also gates the go-live rollout on a usable DB (avoids /healthz false
          # readiness). Liveness = /healthz (unconditional {"status":"ok"}) so a transient DB blip
          # removes the pod from endpoints without killing the process. failureThreshold widened so a
          # slow first DB connect / brief primary switchover doesn't flap-restart the pod.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        # WS4: the OpenBao CA (ailab-ca root) — same per-ns pattern as agentforge-broker.
        - name: openbao-ca
          secret:
            secretName: openbao-tls
            items:
              - { key: ca.crt, path: ca.crt }
