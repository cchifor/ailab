# Bearer token protecting the AgentForge control-plane /metrics endpoint (Prometheus scrape).
# agentforge.chifor.me is published through the CF tunnel and the CP is its own OIDC RP with no CF
# Access in front, so every route authenticates itself — except /metrics, which until 2026-09-11
# had no authentication at all: `curl https://agentforge.chifor.me/metrics` answered 200 with the
# full afp_* payload from the public internet. /metrics shares port 8080 with the API, so there is
# no internal-only listener to hide behind and this token is the whole boundary.
#
# EXACTLY the shape of gitea-metrics.sops.yaml next door, which exists for the same reason on the
# same tunnel (ADR 0017) and whose scrape is green today. CONSUMED TWICE, from this ONE Secret so
# the two sides cannot drift: deployment.yaml -> AFP_METRICS_TOKEN (settings.metrics_token), and
# servicemonitor.yaml -> endpoints[].bearerTokenSecret (Prometheus sends 'Authorization: Bearer').
#
# A SEPARATE Secret rather than another key in agentforge-runtime, deliberately: the
# prometheus-operator reads whatever Secret bearerTokenSecret names, and agentforge-runtime holds
# the session secret and two bot tokens. Single-purpose keeps that reach as small as the job.
#
# ORDERING: this Secret and the ServiceMonitor's bearerTokenSecret must be LIVE BEFORE the CP image
# that enforces the token is pinned. Both halves are harmless early — the old image ignores an extra
# env var (Settings is extra="ignore") and an unread Authorization header — and a pin that lands
# first would take the scrape down until this arrives (ForgePlatformTargetDown, 10m).
#
# ROTATION: `sops --set` this key, then restart the CP (the env is captured at startup) — Prometheus
# re-reads the Secret on its own. Nothing else consumes it.
apiVersion: v1
kind: Secret
metadata:
    name: agentforge-metrics
    namespace: agentforge
type: Opaque
stringData:
    token: ENC[AES256_GCM,data:vOPZLomCyjAA7ePANa15mciZZWe4WrcRJn6xtc56Mo5fjU7h7ft9Fqk5K9Wvecy8,iv:GWcn5/rWtglJAIx7isKGkpcL5qL6OD3lYFVlYiwrtEg=,tag:cozwhMasCG2jySN7pnOw8A==,type:str]
