# Homepage dashboard-as-code (gethomepage.dev). Edit + flux reconcile + `kubectl rollout restart`
# to update (Homepage reads config at boot). siteMonitor URLs are polled from the homepage pod for
# the status dots — kept to in-cluster health endpoints so they're reliable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: ailab
    theme: dark
    color: slate
    headerStyle: clean
    layout:
      AI: { style: row, columns: 3 }
      AgentForge: { style: row, columns: 1 }
      Dev Workers: { style: row, columns: 3 }
      Observability: { style: row, columns: 3 }
      Infrastructure: { style: row, columns: 4 }

  kubernetes.yaml: |
    mode: cluster

  docker.yaml: ""

  # Homepage copies skeleton custom.css/custom.js into /app/config on first page render; with the
  # config mounted read-only (ConfigMap) that copy hits EROFS and crashes the app. Provide them empty.
  custom.css: ""
  custom.js: |
    /* cloud-power - ON/OFF for the separate `pve` GPU cluster (cloud1/2/3).
     *
     * Homepage has no action-button widget, so the control is injected here. It talks to
     * /cloud-power/ on THIS origin, which oauth2-proxy peels off to the cloud-power service, so the
     * Authelia session cookie authenticates every call and there is no CORS and no second login.
     *
     * Placement is deliberately defensive: Homepage is a React app and its DOM changes between
     * releases, so we try a few containers and fall back to a fixed-position card. A MutationObserver
     * re-injects if a re-render drops the node. Worst case the card floats; it never disappears.
     */
    (function () {
      var BASE = '/cloud-power';
      var ID = 'cloud-power-card';
      var pending = null, pendingTimer = null;

      function el(tag, css, txt) {
        var e = document.createElement(tag);
        if (css) e.style.cssText = css;
        if (txt != null) e.textContent = txt;
        return e;
      }

      function btnCss(bg) {
        return 'font:inherit;font-weight:700;font-size:.75rem;letter-spacing:.04em;border:0;' +
          'border-radius:.4rem;padding:.35rem 1.1rem;cursor:pointer;color:#fff;background:' + bg;
      }

      function show(msg, text) { msg.style.display = 'block'; msg.textContent = text; }

      function build() {
        var card = el('div', 'background:#1e293bcc;border:1px solid #33415588;border-radius:.75rem;' +
          'padding:.9rem 1.1rem;margin:0 0 1rem 0;backdrop-filter:blur(6px);font-size:.85rem;color:#e2e8f0');
        card.id = ID;

        var head = el('div', 'display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem');
        head.appendChild(el('span', 'font-weight:600;letter-spacing:.02em', 'Cloud GPU'));
        var sum = el('span', 'color:#94a3b8;font-size:.78rem', 'checking...');
        head.appendChild(sum);
        card.appendChild(head);

        var dots = el('div', 'display:flex;gap:1rem;margin-bottom:.7rem;font-family:ui-monospace,monospace;font-size:.78rem');
        card.appendChild(dots);

        var row = el('div', 'display:flex;gap:.6rem;align-items:center');
        var bon = el('button', btnCss('#16a34a'), 'ON');
        var boff = el('button', btnCss('#dc2626'), 'OFF');
        row.appendChild(bon); row.appendChild(boff);
        card.appendChild(row);

        var msg = el('div', 'margin-top:.6rem;color:#94a3b8;font-size:.75rem;white-space:pre-wrap;display:none');
        card.appendChild(msg);

        bon.onclick = function () { wake(msg, sum); };
        boff.onclick = function () { off(msg, boff); };

        card._parts = { sum: sum, dots: dots, msg: msg, boff: boff };
        return card;
      }

      function refresh() {
        var card = document.getElementById(ID); if (!card) return;
        var p = card._parts;
        fetch(BASE + '/api/status', { credentials: 'same-origin' })
          .then(function (r) { return r.json(); })
          .then(function (s) {
            p.sum.textContent = s.up + '/' + s.total + ' up';
            p.dots.innerHTML = '';
            s.nodes.forEach(function (n) {
              var w = el('span', 'display:flex;align-items:center;gap:.3rem');
              w.appendChild(el('span', 'width:.55rem;height:.55rem;border-radius:50%;background:' +
                (n.up ? '#22c55e' : '#64748b')));
              w.appendChild(el('span', n.up ? 'color:#e2e8f0' : 'color:#64748b', n.name));
              p.dots.appendChild(w);
            });
          })
          .catch(function () { p.sum.textContent = 'unreachable'; });
      }

      function wake(msg, sum) {
        show(msg, 'sending wake packets...');
        fetch(BASE + '/api/wake', { method: 'POST', credentials: 'same-origin' })
          .then(function (r) { return r.json(); })
          .then(function () {
            show(msg, 'Magic packets sent. Nodes take several minutes to POST.');
            sum.textContent = 'waking...';
          })
          .catch(function (e) { show(msg, 'wake failed: ' + e); });
      }

      /* Two-step: the first click only REPORTS what would be stopped and arms a single-use,
       * time-boxed token issued by the server. A stray tap cannot power off a cluster mid-inference. */
      function off(msg, boff) {
        if (!pending) {
          show(msg, 'checking what is running...');
          fetch(BASE + '/api/shutdown/preflight', { method: 'POST', credentials: 'same-origin' })
            .then(function (r) { return r.json(); })
            .then(function (p) {
              pending = p.confirm;
              var list = p.guests.length
                ? p.guests.map(function (g) { return '  ' + g.node + '  ' + g.type + ' ' + g.vmid + ' ' + g.name; }).join('\n')
                : '  (no running guests)';
              show(msg, 'WILL STOP:\n' + list + '\n\nClick OFF again within ' + p.expires_in + 's to confirm.');
              boff.textContent = 'CONFIRM';
              clearTimeout(pendingTimer);
              pendingTimer = setTimeout(function () {
                pending = null; boff.textContent = 'OFF'; show(msg, 'confirmation expired');
              }, (p.expires_in || 30) * 1000);
            })
            .catch(function (e) { show(msg, 'preflight failed: ' + e); });
          return;
        }
        clearTimeout(pendingTimer);
        var tok = pending; pending = null; boff.textContent = 'OFF';
        show(msg, 'shutting down...');
        fetch(BASE + '/api/shutdown', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ confirm: tok })
        })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            show(msg, (d.results || []).map(function (x) { return x.node + ': ' + x.result; }).join('\n') || JSON.stringify(d));
          })
          .catch(function (e) { show(msg, 'shutdown failed: ' + e); });
      }

      function mount() {
        if (document.getElementById(ID)) return;
        var card = build();
        /* IN FLOW at the top of the page, but still OUTSIDE React's tree.
         *
         * The first version inserted next to #information-widgets - a foreign child of a
         * React-managed container - and reconciliation dropped it, so nothing ever showed. The fix
         * after that pinned it as a fixed overlay, which survived but read as a permanent popup.
         *
         * Next.js renders into <div id="__next"> inside <body>, and React only reconciles inside that
         * root. So a SIBLING placed before it is in normal document flow, sits above the dashboard,
         * and is never touched by a re-render. That gets both properties at once.
         *
         * Width is matched to Homepage's centred Tailwind `container` so it lines up with the cards
         * below instead of spanning the full viewport. */
        card.style.cssText += ';margin:1rem auto 0;max-width:1152px;width:calc(100% - 2rem)';
        var root = document.getElementById('__next') || document.body.firstChild;
        document.body.insertBefore(card, root);
        refresh();
      }

      function start() {
        mount();
        console.info('[cloud-power] control mounted');
        setInterval(refresh, 15000);
        /* Safety net only. The card now lives outside React's tree so nothing should remove it; the
         * id check makes each callback a no-op, so this cannot loop on its own mutations. */
        new MutationObserver(function () { mount(); }).observe(document.body, { childList: true });
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
      else start();
    })();
  bookmarks.yaml: |
    - Lab:
        - Repo:
            - abbr: GH
              href: https://github.com/cchifor/ailab
        - Cloudflare:
            - abbr: CF
              href: https://one.dash.cloudflare.com
        - Tailscale:
            - abbr: TS
              href: https://login.tailscale.com/admin

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true # metrics-server is installed -> real CPU/mem gauges
          memory: true
          label: ailab
        nodes:
          show: true
          cpu: true
          memory: true
    - search:
        provider: duckduckgo
        target: _blank
    - datetime:
        format: { timeStyle: short, dateStyle: short }

  services.yaml: |
    - AI:
        - Open WebUI:
            href: https://chat.chifor.me
            description: Chat UI (LLMs)
            icon: open-webui.png
            siteMonitor: http://open-webui.ai.svc.cluster.local:80
        - LiteLLM:
            href: https://api.chifor.me
            description: OpenAI-compatible router
            icon: mdi-router-network # litellm.png isn't in the icon CDN -> broken image; use a bundled MDI
            siteMonitor: http://litellm.ai.svc.cluster.local:4000/health/liveliness
    # No siteMonitor: the CP namespace's NetworkPolicy (agentforge-allow-tunnel-only) admits ingress
    # only from the cloudflared tunnel + CP-managed tenant namespaces, so an in-cluster poll from
    # homepage would be dropped.
    - AgentForge:
        - AgentForge CP:
            href: https://agentforge.chifor.me
            description: Agentic dev platform · control plane
            icon: mdi-robot # agentforge.png isn't in the icon CDN -> broken image; use a bundled MDI
    # Interactive dev-worker web terminals (ttyd). Public via the CF tunnel + Cloudflare Access
    # (kubernetes/infra/cloudflare/access.tf gates each dwN.chifor.me to allow_email). No siteMonitor:
    # the origin is Access-gated, so an in-cluster poll would just see the Access login page.
    - Dev Workers:
        - dev-worker-1:
            href: https://dw1.chifor.me
            description: Web terminal · Claude Code + Codex (ai-node1)
            icon: mdi-console
        - dev-worker-2:
            href: https://dw2.chifor.me
            description: Web terminal · Claude Code + Codex (ai-node2)
            icon: mdi-console
        - dev-worker-3:
            href: https://dw3.chifor.me
            description: Web terminal · Claude Code + Codex (ai-node3)
            icon: mdi-console
        - dev-worker-4:
            href: https://dw4.chifor.me
            description: Web terminal · Claude Code + Codex (ai-node1)
            icon: mdi-console
        - dev-worker-5:
            href: https://dw5.chifor.me
            description: Web terminal · Claude Code + Codex (ai-node2)
            icon: mdi-console
        - dev-worker-6:
            href: https://dw6.chifor.me
            description: Web terminal · Claude Code + Codex (ai-node3)
            icon: mdi-console
        - Renovate:
            href: https://github.com/cchifor/ailab/issues?q=is%3Aissue+is%3Aopen+label%3Arenovate
            description: Dependency update PRs · Dashboard
            icon: mdi-robot-outline
    - Observability:
        - Grafana:
            href: https://grafana.chifor.me
            description: Dashboards
            icon: grafana.png
            siteMonitor: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80/api/health
        - Prometheus:
            href: https://prometheus.chifor.me
            description: Metrics · CF Access
            icon: prometheus.png
            siteMonitor: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/-/healthy
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        - Alertmanager:
            href: https://alertmanager.chifor.me
            description: Alerts · CF Access
            icon: prometheus.png
            siteMonitor: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093/-/healthy
        - Uptime (Gatus):
            href: https://status.chifor.me
            description: Service status
            icon: gatus.png
            siteMonitor: http://gatus.gatus.svc.cluster.local:8080/health
            widget:
              type: gatus
              url: http://gatus.gatus.svc.cluster.local:8080
        - Loki (Logs):
            href: https://grafana.chifor.me/explore
            description: Logs · query via Grafana Explore
            icon: loki.png
            siteMonitor: http://loki.monitoring.svc.cluster.local:3100/ready
        - Hubble (Network):
            href: https://hubble.chifor.me
            description: Cilium L3/L4/L7 flows · CF Access
            icon: cilium.png
            siteMonitor: http://hubble-ui.kube-system.svc.cluster.local:80
        - ntfy (Alerts):
            href: https://ntfy.chifor.me
            description: Push notifications · Alertmanager
            icon: ntfy.png
            siteMonitor: http://ntfy.monitoring.svc.cluster.local:80/v1/health
        - Trivy (Security):
            href: https://grafana.chifor.me/d/trivy-operator
            description: Vuln + misconfig scans · Grafana
            icon: mdi-shield-search
            siteMonitor: http://trivy-operator.trivy-system.svc.cluster.local:80/metrics
    - Infrastructure:
        - SSO (Authelia):
            href: https://sso.chifor.me
            description: Login
            icon: authelia.png
            siteMonitor: http://authelia.auth.svc.cluster.local:9091/api/health
        - Proxmox:
            href: https://proxmox.chifor.me
            description: ai-node1/2/3 · CF Access
            icon: proxmox.png
        - QNAP:
            href: https://qnap.chifor.me
            description: ai-storage (ZFS) · CF Access
            icon: qnap.png
        - Tailscale:
            href: https://login.tailscale.com/admin
            description: Private mesh
            icon: tailscale.png
        - Registry (Zot):
            href: https://registry.chifor.me
            description: Private OCI images · SSO login
            icon: si-opencontainersinitiative
        - Headlamp (K8s):
            href: https://k8s.chifor.me
            description: Cluster explorer + Flux safe-ops · CF Access
            icon: headlamp.png
            siteMonitor: http://headlamp.headlamp.svc.cluster.local:80
        - Gitea:
            href: https://git.chifor.me
            description: Git forge · SSO login
            icon: gitea.png
            siteMonitor: http://gitea-http.gitea.svc.cluster.local:3000/api/healthz
        - Vaultwarden:
            href: https://vault.chifor.me
            description: Password manager · own auth
            icon: vaultwarden.png
            siteMonitor: http://vaultwarden.vaultwarden.svc.cluster.local:80/alive
