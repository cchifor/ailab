# ailab Keycloak runtime secrets (ADR 0038). System of record = this SOPS file (not escrowed in
# OpenBao: docs/runbooks/openbao-estate-credentials.md keeps SOPS-held values out of af/estate).
# - KC_BOOTSTRAP_ADMIN_*: master-realm admin, created by Keycloak ONLY at the first start while
#   master has no admin; changing it here later changes nothing live (docs/runbooks/keycloak.md).
# - KC_DB_PASSWORD: byte-identical to databases/infra-pg-keycloak.sops.yaml.
# - RELAY_OIDC_CLIENT_SECRET: the `relay` client secret, substituted into realm-relay.json at the ONE
#   initial import; byte-identical to OIDC_CLIENT_SECRET in apps/relay/relay-secrets.sops.yaml.
#   Rotation is a kcadm change first (runbook), never just an edit here.
