# Gitea Actions RUN-HISTORY retention - the piece Gitea itself does not have.
#
# WHY THIS EXISTS (ailab#923, 2026-09-28): LOG_RETENTION_DAYS / ARTIFACT_RETENTION_DAYS (14, gitea.yaml)
# purge logs and artifacts, NOT runs. Run/job/task/step rows are kept forever: on 2026-09-28 the
# gitea database was 12 GB of infra-pg's 20 Gi data+WAL volume - action_task 5.4 GB (292 k rows
# back to 2026-07-09), action_run_job 1.2 GB, action_task_step 3.5 M rows - growing at ~1,900
# runs / ~9,000 jobs per day; 33,045 runs were already older than 14 d (platform 25.4 k). That history
# is also what the `@midnight` cron.cleanup_actions walks (3.5 M deletes in 01:00-02:30Z that night),
# which is the burst that pushed infra-pg's replica past its 1 GB slot budget and killed replication.
#
# WHAT IT DOES: gitea-actions-run-retention.sh (mounted from the ConfigMap kustomize generates from the
# file beside this manifest) deletes COMPLETED runs older than RETENTION_DAYS through the Gitea API,
# oldest first, for every repository of the `cchifor` org (+ EXTRA_REPOS). Gitea 1.26's DeleteRun
# (services/actions/cleanup.go) deletes run -> jobs -> tasks -> steps -> outputs -> artifact ROWS in one
# transaction and only then removes log/artifact FILES best-effort (errors just logged). That is why
# RETENTION_DAYS (16) is LARGER than LOG/ARTIFACT_RETENTION_DAYS (14): the nightly cleanup has already
# expired the files of anything this job deletes, so the best-effort half is a no-op and nothing can be
# orphaned on the actions-storage PVC (the trap actions-storage.yaml documents).
#
# PACING IS THE POINT. MAX_DELETES_PER_RUN is a GLOBAL budget per execution, DELETE_PAUSE_SECONDS sits
# between deletions, and a REPLICATION GATE (Prometheus: any firing CNPG*/PostgresReplica* alert, or an
# unreachable Prometheus, pauses the job - exit 2, fail closed) is checked before the first deletion and
# every GATE_EVERY deletions. The schedule skips 00-02Z so it never overlaps cron.cleanup_actions.
#
# NUMBERS, from the 2026-09-28 canary (25 live deletions, 5 s pace, agentforge tail): ~1 MB of extra
# WAL per deleted run on top of Gitea's own ~150 KB/s; the replica's slot never dipped below 1.07 GB
# of headroom, replay lag <= 0.22 s. 300 per execution at a 3 s pace = ~15 min of work per hour;
# DURING that window the extra WAL is ~330 KB/s, i.e. >2x the ~150 KB/s background (the canary's 5 s
# pace was ~200 KB/s); averaged over the hour it is ~85 KB/s. Size slot headroom on the peak: 330 KB/s
# for 15 min = ~300 MB against the 1 GB budget. 21 executions/day = 6,300/day against ~1,934/day
# ageing in: the ~30 k backlog drains in ~8 days. Re-measure before raising either number.
#
# JOB SHAPE for that window: ~15 min of pauses + ~600 requests + 12 gate checks = ~20 min. So
# activeDeadlineSeconds 2700 (a deadline tuned for the 2-minute canary would kill a live run
# mid-deletion), concurrencyPolicy Forbid (an overrun never overlaps the next hour's execution),
# backoffLimit 0 + restartPolicy Never (a gate pause is exit 2 = a failed pod; a retry would start a
# fresh 300 budget, so there is none: one pod, one budget, per execution).
#
# SELECTION: runs are listed id DESC; the script walks each repo from the LAST page towards page 1 for at
# most MAX_PAGES_PER_REPO pages, never stops early on an ineligible page (a rerun keeps its old id), and
# re-reads every candidate right before DELETE (status still completed, completed_at still older than the
# cutoff). Offset pagination is not a snapshot: a run that shifts pages is caught by the next execution.
#
# TOKEN: Secret gitea-actions-retention (SOPS) - a PAT of the dedicated NON-ADMIN user `actions-retention`
# (org team with the Actions unit only; see gitea-actions-retention.sops.yaml.example). It reaches curl
# through a 600 config file on the tmpfs, never argv. Plain HTTP to the in-cluster service, like
# ci-rerun-watchdog - Cilium's pod network is the transport boundary.
#
# FAILURE POLICY: backoffLimit 0 + restartPolicy Never (a retry would reset the budget), Forbid, 401/403
# or an uncertain DELETE => exit 1 (KubeJobFailed pages; never "0 deleted, success"). One summary line
# per execution: `retention: deleted=N already_gone=N skipped_revalidation=N candidates_seen=N ...`.
# Stop a running execution: `kubectl -n gitea delete job <name>`; stop the schedule: `kubectl -n gitea
# patch cronjob gitea-actions-run-retention -p '{"spec":{"suspend":true}}'`. A manual run must carry its
# own env (`kubectl create job --from=cronjob/... --dry-run=client -o yaml`, edit, apply): editing the
# CronJob never changes a Job that already exists.
#
# DRY_RUN=true lists what would be deleted and exits 0 (how it merged; live since the canary). Deleted rows come back as dead
# tuples that autovacuum reuses in-file: growth stops and the free-space cliff moves out, but the 12 GB
# does not shrink on disk without a VACUUM FULL / pg_repack window - a separate decision.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitea-actions-run-retention
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-actions-run-retention
    app.kubernetes.io/part-of: gitea
spec:
  schedule: "17 3-23 * * *" # hourly, never inside the 01:00-02:30Z cron.cleanup_actions burst
  timeZone: Etc/UTC # the exclusion window is UTC; without this the schedule follows the controller's zone
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0 # one pod = one MAX_DELETES_PER_RUN budget; no retry can re-spend it
      # A gate PAUSE exits 2 (a Failed Job, by design above), and failedJobsHistoryLimit keeps the
      # newest 3 failed Jobs FOREVER on a schedule that rarely fails -- so KubeJobFailed stayed up for
      # a single benign pause (2026-09-28 21:17Z, replica alert firing) while every later hourly run
      # completed. Same trap and fix as renovate/cronjob.yaml. 12h keeps a failed pod for inspection
      # well past the next several executions; a PERSISTENT failure makes a fresh failed Job every
      # hour, so the alert still holds. Applies to Jobs created after this lands.
      ttlSecondsAfterFinished: 43200
      activeDeadlineSeconds: 2700 # ~20 min of work at 300 x 3 s + requests; 1500 was the canary shape
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gitea-actions-run-retention
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false # talks to Gitea and Prometheus only, never the API server
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: retention
              image: docker.io/alpine/k8s:1.32.13@sha256:ffb0758383fdd5878419930052e2854afe6c0479303a59edaca4143ce8d3c016
              imagePullPolicy: IfNotPresent
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              env:
                - name: GITEA_URL
                  value: "http://gitea-http.gitea.svc.cluster.local:3000"
                - name: ORG
                  value: "cchifor"
                - name: EXTRA_REPOS # space-separated owner/name outside the org, optional
                  value: ""
                - name: RETENTION_DAYS # MUST stay > LOG_RETENTION_DAYS / ARTIFACT_RETENTION_DAYS (gitea.yaml: 14)
                  value: "16"
                - name: MAX_DELETES_PER_RUN # global per execution; from the canary measurement in the header
                  value: "300"
                - name: DELETE_PAUSE_SECONDS
                  value: "3"
                - name: MAX_PAGES_PER_REPO
                  value: "20"
                - name: GATE_EVERY
                  value: "25"
                - name: PROM_URL
                  value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
                - name: DRY_RUN # false since 2026-09-28 (rollout step 4); auto-reclone stays dry-run until two clean nights
                  value: "false"
                - name: GITEA_TOKEN
                  valueFrom: { secretKeyRef: { name: gitea-actions-retention, key: token } }
              command: ["/bin/sh", "/opt/retention/gitea-actions-run-retention.sh"]
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
                - { name: script, mountPath: /opt/retention, readOnly: true }
          volumes:
            - name: tmp
              emptyDir: { medium: Memory, sizeLimit: 16Mi }
            - name: script
              configMap: { name: gitea-actions-run-retention-script, defaultMode: 0555 }
