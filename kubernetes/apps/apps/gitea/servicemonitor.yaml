# Prometheus scrape of Gitea's own /metrics endpoint — gitea_* application metrics (repositories, users,
# organizations, mirrors, issues, ...) plus Go runtime metrics. The kube-prometheus-stack Prometheus
# selects ServiceMonitors by `release: kube-prometheus-stack` across all namespaces. /metrics is
# token-protected ([metrics] TOKEN, ADR 0017) because it is internet-reachable via the CF tunnel; we
# authenticate with the bearer token from the gitea-metrics SOPS secret (same value Gitea reads).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitea
  namespace: gitea
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [gitea]
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
      app.kubernetes.io/instance: gitea
  endpoints:
    # Only gitea-http carries the `http` (3000) port; gitea-ssh has no such port so it is not scraped.
    - port: http
      path: /metrics
      scheme: http
      # 30s -> 4m (2026-09-29). Every scrape runs Gitea's statistics collector: a full count(*) over
      # commit_status, comment, issue, ... — measured 7-8s EACH against the 12 GB gitea DB on
      # qnap-iscsi, evicting the cache Gitea's real requests need. No alert reads gitea_* series
      # (gitea-rules.yaml uses up/kube-state/container metrics), and these are slow-moving counts.
      # 4m, not 5m: Prometheus' 5m lookback would make every series flicker absent at exactly 5m.
      interval: 4m
      scrapeTimeout: 60s
      bearerTokenSecret:
        name: gitea-metrics
        key: token
