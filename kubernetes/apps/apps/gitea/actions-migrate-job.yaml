# One-shot pre-copy of Gitea Actions artifacts + logs from versitygw S3 onto the local PVC (W1).
#
# This is the PRE-COPY, deliberately run while Gitea is still serving from S3 and nothing has been
# cut over. It exists so the maintenance window contains only a short delta sync rather than a
# 11 GB / 57,714-object transfer. Re-running it is the delta sync.
#
# PREFIX MAPPING — the one thing that is easy to get wrong. Gitea addresses these objects through
# MINIO_BASE_PATH, so the bucket looks like:
#
#     gitea-actions/actions_artifacts/...   <- storage.actions_artifacts
#     gitea-actions/actions_log/...         <- storage.actions_log
#
# and the local backend addresses them relative to its own PATH. So each prefix maps onto its own
# directory and the prefix must NOT be repeated inside it: syncing the bucket root would produce
# /data/actions_artifacts/actions_artifacts/... and Gitea would find nothing. Two explicit syncs,
# one per prefix, is why this is spelled out rather than done as a single recursive copy.
#
# OWNERSHIP. Gitea runs as uid 1000 / gid 1000 with fsGroup 1000 (verified on the live pod: `id` ->
# uid=1000(git)). The Job runs as the same uid/gid so the migrated tree is readable AND writable by
# Gitea afterwards — a copy owned by root would leave the forge unable to write new artifacts, which
# would only surface after the cutover.
#
# RWO. This PVC is ReadWriteOnce and Gitea will eventually mount it. While this Job's pod exists it
# holds the attachment, so the pod must be gone before Gitea is started on local storage. It carries
# no ttlSecondsAfterFinished on purpose: a completed Job that Flux keeps recreating would rescan
# 11 GB on every interval. It stays Completed; to run the delta sync, delete it and let Flux
# recreate it (`kubectl -n gitea delete job gitea-actions-migrate`), then delete it again before the
# cutover.
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-actions-migrate
  namespace: gitea
  annotations:
    # A Job's spec.template is immutable, so editing this in place would wedge the apps Kustomization
    # with "field is immutable". Recreate on change instead. Per-object, so nothing else in this
    # shared Kustomization is force-replaced.
    kustomize.toolkit.fluxcd.io/force: "enabled"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # git, matching the Gitea container
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rclone
          image: rclone/rclone:1.74.3
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "=== source: what is actually in the bucket ==="
              rclone size VGW:gitea-actions/actions_artifacts || true
              rclone size VGW:gitea-actions/actions_log || true

              # --checksum, not the default mtime+size: versitygw's POSIX backend does not preserve
              # S3 mtimes faithfully, so a size-and-time comparison would silently re-copy (or worse,
              # skip) objects. This is a one-shot migration of data with no second source of truth,
              # so it is compared by content.
              for p in actions_artifacts actions_log; do
                echo "=== sync $p -> /data/$p (prefix NOT duplicated) ==="
                mkdir -p "/data/$p"
                rclone sync "VGW:gitea-actions/$p" "/data/$p" \
                  --checksum --transfers 8 --checkers 16 \
                  --stats 30s --stats-one-line -v
              done

              echo "=== verify: object count AND total bytes must agree on both sides ==="
              # Tolerate whitespace in rclone's JSON rather than assuming it stays compact.
              # printf, not a heredoc: this whole script is a YAML block scalar, so every line keeps
              # its indentation and an indented terminator would never end the heredoc.
              field() { printf '%s' "$1" | sed -n "s/.*\"$2\"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p"; }
              fail=0
              for p in actions_artifacts actions_log; do
                sj=$(rclone size "VGW:gitea-actions/$p" --json)
                dj=$(rclone size "/data/$p" --json)
                sc=$(field "$sj" count); sb=$(field "$sj" bytes)
                dc=$(field "$dj" count); db=$(field "$dj" bytes)
                echo "  $p: source=${sc} objects / ${sb} bytes | destination=${dc} objects / ${db} bytes"
                [ -n "$sc" ] && [ -n "$dc" ] || { echo "  could not read sizes for $p" >&2; fail=1; continue; }
                [ "$sc" = "$dc" ] || { echo "  OBJECT COUNT MISMATCH in $p" >&2; fail=1; }
                [ "$sb" = "$db" ] || { echo "  BYTE COUNT MISMATCH in $p" >&2; fail=1; }
              done
              [ "$fail" = 0 ] || { echo "FAIL: source and destination disagree — do NOT cut over" >&2; exit 1; }

              # Per-file existence + size, NOT checksums. versitygw returns S3 ETags, and for a
              # multipart upload an ETag is an md5-of-md5s, not the object's MD5 — so a checksum
              # comparison would report differences that are not corruption and would fail this Job
              # for the wrong reason. --size-only is unambiguous on both sides. (The sync above still
              # used --checksum for its transfer decisions, where rclone degrades to size when no
              # common hash exists, so nothing is weakened by checking sizes here.)
              for p in actions_artifacts actions_log; do
                echo "=== per-file verify $p ==="
                rclone check "VGW:gitea-actions/$p" "/data/$p" --size-only --one-way
              done

              echo "=== on-disk result ==="
              du -sh /data/actions_artifacts /data/actions_log
              echo "migration copy complete and verified"
          env:
            - { name: HOME, value: /tmp }
            # Same remote shape as the talos-backup prune/probe jobs.
            - { name: RCLONE_CA_CERT, value: /etc/ssl/versitygw/ca.pem }
            - { name: RCLONE_S3_NO_CHECK_BUCKET, value: "true" }
            - { name: RCLONE_CONFIG_VGW_TYPE, value: s3 }
            - { name: RCLONE_CONFIG_VGW_PROVIDER, value: Other }
            - { name: RCLONE_CONFIG_VGW_ENDPOINT, value: "https://192.168.1.225:7070" }
            - { name: RCLONE_CONFIG_VGW_REGION, value: us-east-1 }
            - { name: RCLONE_CONFIG_VGW_FORCE_PATH_STYLE, value: "true" }
            - name: RCLONE_CONFIG_VGW_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: gitea-actions-s3, key: access-key } }
            - name: RCLONE_CONFIG_VGW_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: gitea-actions-s3, key: secret-key } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: actions, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: versitygw-ca, mountPath: /etc/ssl/versitygw, readOnly: true }
      volumes:
        - name: actions
          persistentVolumeClaim:
            claimName: gitea-actions-storage
        - name: tmp
          emptyDir: {}
        - name: versitygw-ca
          configMap:
            name: versitygw-ca
