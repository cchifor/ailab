apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The edge proxy (ADR 0040, docs/standards/edge-ingress.md). The Caddyfile is GENERATED from
# kubernetes/edge/hostnames.yaml by scripts/edge/render.py; CI fails when it is stale.
resources:
  - certificate.yaml
  - daemonset.yaml
  - services.yaml
  - networkpolicy.yaml
  - podmonitor.yaml
configMapGenerator:
  # The hash suffix rolls the DaemonSet on every config change. The namespace is set here on
  # purpose: a generated ConfigMap without one stalls the whole Flux layer.
  - name: edge-proxy-caddy
    namespace: edge
    files:
      - Caddyfile
      - cert-reloader.sh
