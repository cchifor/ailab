apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Edge / internet exposure (both halves live 2026-06-14): Cloudflare Tunnel (public, SSO-gated)
# + Tailscale operator/subnet-router (private mesh). See docs/runbooks/internet-exposure.md.
resources:
  - namespace.yaml
  - limitrange.yaml
  - cloudflared-creds.sops.yaml
  # Must precede cloudflared.yaml conceptually: cloudflared mounts the Secret this Certificate issues
  # (ailab root CA) to CA-pin the openbao.chifor.me origin. Kustomize does not order applies, but Flux
  # applies both in one reconcile and a pending mount only stalls the rollout — it never drops the tunnel.
  - openbao-ca-cert.yaml
  - cloudflared.yaml
  - tailscale-oauth.sops.yaml
  - tailscale.yaml
