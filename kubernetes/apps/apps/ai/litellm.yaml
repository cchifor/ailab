# LiteLLM proxy: one OpenAI-compatible endpoint (litellm.ai.svc:4000/v1) that routes by
# model name to the per-node llama-server backends. node3 (llama-swap) served ONLY qwen3.5-122b until
# 2026-09-08; that model moved to the cloudlab estate (cloud3), so node3 is no longer a routed
# backend here. Its ROUTING slot is free — the retention gates passed 2026-09-08 and the retained
# llm-qwen35 Service was deleted — but the CAPACITY is not reclaimed until node3's llama-swap unit
# is stopped and its 72 GiB of staged weights removed, a MANUAL step no manifest performs. Same
# distinction llm-service.yaml draws. gpt-oss-120b is retired locally (it thrashed
# node3's single iGPU against qwen3.5-122b) and its model_name is shimmed to the pinned qwen3.6 (below).
# See kubernetes/infra/ai-lxc + docs/runbooks/ai-model-swap.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      # THE CONSUMERS ARE GENERATED FROM THIS LIST. scripts/gen-litellm-consumers.py derives Open
      # WebUI's Local-group model_ids (open-webui.yaml), dsh's provider models (dsh/settings.seed.yaml)
      # and the checksum/config annotation below from every entry whose api_base host is a private
      # IPv4 or a .svc.cluster.local name and whose model_info.mode is unset or chat (an embedding or
      # rerank route is never a picker entry). `model_info: { hidden: true }` (a YAML boolean; a quoted
      # "true" fails the check) removes a route from the Local group in Open WebUI and from dsh while
      # it stays routable by name -- Open WebUI's connection "1" still discovers it under External,
      # because LiteLLM does not know the key and keeps advertising the name on /v1/models. The
      # generator locates this block the way scripts/check-inline-hashes.py does (the first
      # `config.yaml: |` literal block in the file), so litellm-config must stay the first such
      # ConfigMap in this file. Run `just af-gen-litellm` after editing here; CI runs the check.
      # max_input_tokens = the per-request context window the llama-server
      # actually serves (n_ctx / --parallel), with output headroom. LiteLLM
      # fails fast with a clean ContextWindowExceededError above this instead of
      # forwarding a doomed request; the deepagent codes it as a friendly
      # context_window_exceeded (platform PR #636). KEEP IN SYNC with the host
      # launch args in docs/runbooks/ai-host-setup.md.
      # qwen3.6-35b-a3b REMOVED 2026-09-07 (by request). It was alive -- node2 (.45) answered a
      # /v1/models probe -- so this is a deliberate retirement, not dead-route cleanup like the
      # entries below. It had been the "daily driver": pinned on node2, vision-capable, 114688 input.
      # node1's copy was already disabled 2026-08-15 (node1 could not hold qwen3.6 AND the qwen3.8
      # quality tier without OOM-killing dev-worker-4 + ci-runner-4).
      #
      # STILL SERVED ELSEWHERE, deliberately left alone: litellm-local.yaml registers it for the
      # agentforge workers, and litellm-vkeys.yaml grants org keys against THAT proxy's model_list
      # ("models MUST be a subset of litellm-local's"). Removing it here does not touch those.
      # node1/node2 still provision the weights (kubernetes/infra/ai-lxc/models.yaml).
      #
      # Open WebUI's TASK_MODEL_EXTERNAL pointed here and was repointed in the same change --
      # see open-webui.yaml. Leaving it would have made every task-model call 404.
      # gpt-oss-120b DELETED 2026-09-07. It had been retired as a local model on 2026-07-08 and kept
      # as a NAME SHIMMED to qwen3.6-35b-a3b so old callers would not break. That shim is worse than a
      # 404: a caller asking for gpt-oss-120b silently received a different model, with nothing in the
      # response saying so. The retirement note already offered "delete this entry to hard-retire the
      # name" as the alternative; this takes it. Callers now get an explicit model-not-found instead of
      # quiet wrong answers. gpt-oss-120b weights DO still sit on cloud3's NFS store (60 GiB) but are
      # not loaded by any llama-swap config, so nothing serves them. See docs/runbooks/ai-model-swap.md.
      - model_name: qwen3.5-122b-cloud
        litellm_params:
          model: openai/qwen3.5-122b
          api_base: http://192.168.0.26:8080/v1
          api_key: "sk-noauth"
        model_info:
          # cloud3 llama-swap serves this with `-c 262144 --parallel 2`. In llama.cpp `-c` is the
          # TOTAL KV context shared across slots, so each of the 2 slots gets 262144/2 = 131072.
          # 131072 - 32768 output headroom = 98304. (The previous 24576 described node3's retired
          # CTX=32768/--parallel 1 host and under-declared cloud3 by 4x.)
          max_input_tokens: 98304
      # ---- CLOUD GPU CLUSTER (cloud3, 4x RTX 3090 = 96 GiB VRAM) -------------------------------
      # Served by llama-swap in LXC 5101 on cloud3 at 192.168.0.26:8080 — a plain LAN address, not a
      # k8s Service: the `pve` cloud cluster is a SEPARATE Proxmox cluster and these are not cluster
      # workloads. Serving side: git.chifor.me/cchifor/cloudlab (host/llama-swap.yaml).
      #
      # ⚠️ DAY-ONLY. cloud1/2/3 power off nightly to save energy, so these backends VANISH overnight
      # and return in the morning (RTC alarm, with WoL for on-demand wake). Do NOT make them the sole
      # backend for anything that must work 24/7.
      #
      # NO-CANCEL CONSTRAINT (see the qwen3.8-27b block below): LiteLLM 1.91.0 does not propagate a
      # client disconnect upstream, so an abandoned request keeps decoding. On a --parallel 1 model
      # that wedges the only slot — measured at 7+ minutes on node1. Every cloud model below therefore
      # runs **--parallel 2 or more**, so an orphan costs capacity instead of blocking the model. The
      # 122B was moved from --parallel 1 to 2 (with -c doubled so each slot keeps its 32K) specifically
      # because of that finding. This is a mitigation, not a fix: the fix is upstream cancel support.
      # The per-model --parallel values live in cchifor/cloudlab host/llama-swap.yaml — pinned at
      # commit 9907877, which is the change that moved the 122B off a single slot. Verify there, not here.
      #
      # The three models total ~145 GiB against cloud3's 96 GiB of VRAM, so llama-swap holds ONE at a time and
      # unloads on TTL — a model switch costs a cold load from local NVMe. llama-swap always answers
      # :8080, so the router never sees a down backend while the cluster is awake.
      #
      # ---- EXECUTOR TIER (qwen3.8-27b-cloud) REMOVED 2026-09-07 -------------------------------
      # Was three llama.cpp instances pinned one-per-GPU on cloud2 (:8081/:8082/:8083), registered under
      # one model_name so the router load-balanced across three physically separate cards.
      # All three were DEAD when checked (HTTP 000, GPUs 1-3 idle at 0 MiB) and had been dead BEFORE
      # cloud2 moved to tensor-parallel vLLM -- the TP change did not kill them, it superseded them.
      # cloud2 now runs ONE vLLM engine across all four cards (qwen3.8-27b-vllm below), which is both
      # faster per request and larger in aggregate than the three pinned instances ever were.
      # ---- cloud2 vLLM (W4A16 + MTP), TENSOR-PARALLEL over ALL FOUR RTX 3090s, VISION ON ---
      # syv-ai/qwen38-27b-rtx3090 recipe: int4 AutoRound body, MTP n=4 drafts.
      # CORRECTED 2026-09-10 -- this line used to read "int4 AutoRound body, int8 lm_head/embed",
      # which describes the BASE checkpoint. It is not what runs. /v1/models on :18020 reports the
      # served root as `.../Qwen3.8-27B-W4A16-AutoRound-fast` (verified 2026-09-10): same int4
      # AutoRound body, but an int4 GPTQ lm_head and an int4 MTP drafter, NOT int8 ones.
      # NOBODY CHOSE THE -fast VARIANT. The host launcher's MODEL default is "the `-fast` directory
      # if present, else the base dir", so cloud2 serves it because it happens to be on disk. The
      # repo's record and the box had drifted apart on this since the recipe was first written.
      # The recipe's OWN single-user quality table prices the two variants (its numbers, not ours):
      #   base requantization   : int8 lm_head : PPL 8.045          : GSM8K 95.5% : ~107-109 tok/s
      #   -fast (WHAT WE SERVE) : int4 lm_head : PPL 8.095 (+0.6%)  : GSM8K 96.5% : ~114-124 tok/s
      # So the variant we ended up on is the FASTER and slightly worse-perplexity one, by accident.
      # A switch to the base dir is a TWO-variable change, not a clean lm_head A/B: lm_head and the
      # MTP drafter are exported as one artefact and move int4 -> int8 together.
      # Do NOT act on this from here. MODEL lives on the cloud2 host, not in this ConfigMap, and
      # the checkpoint choice is Phase C of cloudlab plans/2026-09-10-vllm-svg-fidelity-plan.md --
      # a gated ladder to run, not a change to ship. This comment is the RECORD, not a proposal.
      #
      # ⚠️ FAULT 2026-09-10 -- HTTP 200 IS NOT HEALTH FOR THIS ROUTE. Read this before you
      # trust anything :18020 returns, and before you trust the fallbacks block far below.
      # TWO SEPARATE FAULTS on that day, kept apart here because the plan keeps them apart and
      # because only ONE of them has an alert -- which is the caveat spelled out in that block.
      #
      # FAULT 1 -- THE DRAFTER WAS ALREADY DEAD before anything was run against the engine. The first
      # serve.log metrics line covering the 10:36 traffic (07:37:17 UTC = 10:37:17 local -- the LXC
      # logs in UTC, the hosts run EEST) already reads "Mean acceptance length: 1.00, Accepted: 0
      # tokens". Cumulatively: between 10:35 and 11:05, +123,810 draft rounds yielded +72 accepted
      # tokens, i.e. **0.014%** against ~25% position-0 acceptance read off /metrics at 10:35.
      # Rejection sampling makes a useless drafter SLOW BUT LOSSLESS, so output was still CORRECT
      # while this fault ran alone: fault 1 is what the **52.7 tok/s** (against the 200.4 recorded
      # below) measures, not the `!`.
      #
      # FAULT 2 -- TOKEN 0 FOREVER. At **10:37:57 local** a request carrying
      # `response_format: {type: json_schema}` hit xgrammar's IN-PLACE logits mask
      # (`apply_token_bitmask_inplace_kernel`); the FSM failed to advance, "grammar rejected tokens
      # [0]", and THAT request returned **HTTP 500**. From then on the engine answered with HTTP 200,
      # a well-formed OpenAI body, and **token id 0 (`!`)** as the entire content -- cold, idle,
      # single-stream, greedy included (T=0 reproduced it bit-identically 3/3, so this was destroyed
      # logits, not a sampler wandering). NOT literally every request 200'd -- the triggering one
      # 500'd -- and the three xhigh streams already in flight stayed COHERENT for ~4 more minutes,
      # collapsing to `!` only at ~10:42, within ~12 s of each other. The pelican SVG prompt returned
      # ZERO content in three attempts (finish_reason=length, all `!`).
      #
      # THE LINK BETWEEN THE TWO IS STRONG BUT NOT PROVEN, and the plan says so in those words: same
      # token id, an in-place mask on a shared buffer, and a known vLLM bug class (structured outputs
      # + speculative decoding failing to advance the FSM). The ~4 coherent minutes after 10:37:57
      # are a gap no evidence in either repo closes. Do NOT write this up as established cause, and
      # do not treat fault 1 as a symptom of fault 2 -- it preceded it.
      #
      # It does NOT self-heal: the unit sets Restart=no, and switching it to Restart=on-failure would
      # NOT help either, because the process never dies -- it keeps serving 200s. Only a restart or a
      # CONTENT-validating check ends it. RECOVERY -- note WHERE it runs: the engine is LXC 5103
      # (192.168.0.28), so the command is `pct exec 5103 -- systemctl restart vllm-qwen38` on the
      # cloud2 HOST (192.168.0.21), i.e. `python scripts/node-ssh.py 192.168.0.21 "pct exec 5103 --
      # systemctl restart vllm-qwen38"` from cloudlab. Run against .28 it does not exist. THE RESTART
      # IS NOT THE FIRST ACTION: runbook §11 makes the capture mandatory first (serve.log tail,
      # `nvidia-smi -q | grep -iE 'Xid|Pending|Retired|Remapp'`, `dmesg -T | grep -iE 'xid|nvrm'`),
      # because the restart destroys the only record of whether this was an illegal memory access, an
      # Xid or a silent NaN -- and if that capture is NOT clean a restart is the wrong tool entirely.
      # RESTORED 2026-09-10 12:54:53 EEST by exactly that command, after capture: answering again in
      # **105 s**, then greedy "Reply with exactly: OK" 3/3 and **158.6 tok/s** single-stream (plan
      # restore table; runbook §11 timeline row 12:54:53). THIS RECORD ASSERTS NOTHING ABOUT THE
      # ENGINE'S STATE AT ANY LATER TIME -- the restore cleared the latch, it did not fix the trigger.
      # CONSEQUENCE FOR THIS ROUTE, not yet mitigated: LiteLLM passes `response_format` straight
      # through, so any Open WebUI / dsh / tool-calling caller can put the estate's default chat
      # model into this state with one request. Rejecting `response_format`/`tools` here is the only
      # fix that needs no engine change -- it is a FOLLOW-UP awaiting operator sign-off and is
      # deliberately NOT done in this commit, which is record-correction only.
      # Full record: cloudlab plans/2026-09-10-vllm-svg-fidelity-plan.md and runbook
      # docs/runbooks/cloud-gpu-cluster.md §11.
      #
      # Kept under its OWN model_name (not pooled with qwen3.8-27b-cloud) because the backends are
      # not interchangeable: different engine and different throughput, so pooling them would let
      # LiteLLM silently route a request to a 3x slower backend with no way to tell which answered.
      #
      # TP=4 across all four cards since 2026-09-07. Measured against TP=2 on the same harness.
      # ⚠️ MEASURED 2026-09-07 -- and only PARTLY re-measured since. Treat the TP=2 -> TP=4 pairs
      # below as the last FULL measurement; they are kept rather than deleted because they are the
      # only complete measured anchor there is, and they are NOT replaced with estimates. The full
      # re-baseline is Phase B of the cloudlab plan.
      #   single-stream 179.5 -> 200.4 tok/s | xhigh C=1 158.8 -> 176.8
      #   C=4 284.7 -> 367.7 -- PENDING RE-MEASUREMENT: not re-run since 2026-09-07, and the plan
      #     bars the harness above C=1 until its A5 concurrency question is resolved.
      #   KV pool 385,074 -> 1,010,719 tokens, concurrency 2.94x -> 7.71x at 131072.
      # WHAT WAS RE-MEASURED, on 2026-09-10 AFTER the 12:54:53 restore (same engine that read
      # 52.7 tok/s while faulted), so a reader of this route is not left with only 2026-09-07:
      #   single-stream  **158.6 tok/s** (scripts/vllm-test.sh verdict: healthy) against the 200.4
      #                  above -- runbook §11 restore table and the plan's restore table.
      #   xhigh C=1      **~185 tok/s** against the 176.8 above -- plan B4, n=3, 26,259-30,692
      #                  completion tokens in 143.7-165.8 s, finish_reason=stop on all three.
      #   KV pool        1,011,940 tokens, **7.72x** at 131072 -- the 1,010,719 / 7.71x above, re-read
      #                  on a restored engine and +1,221 tokens against it.
      # Neither throughput figure is a like-for-like re-run of the 2026-09-07 harness (one is the
      # smoke script, one is the SVG eval), so they REPLACE nothing above -- they are what a restored
      # engine actually did on 2026-09-10, and they are recorded because "no fresh number exists"
      # would be false.
      # Chosen over TWO independent TP=2 engines: those pay for the weights twice, so their
      # two 385,074 pools total LESS than TP=4's single 1,010,719 -- and a split prefix cache
      # makes every agent turn a cold prefill. Measured on a 10-turn loop over a 22k seed:
      # turn 1 = 22.6 s with 0 cached, turn 10 = 9.9 s with 24,192 of 25,779 cached.
      # Per-sample quality is IDENTICAL under TP -- same weights, same all-gathered logits.
      #
      # CONTEXT: host runs --max-model-len 131072 (ceiling is 262144 if one huge prompt ever
      # needs it, at 3.83x). max_input_tokens = 131072 - 49152 = 81920. That output headroom is
      # deliberately large: xhigh reasoning measured 15,996-38,897 tokens per answer here, and
      # under-budgeting a reasoning model yields finish_reason=length with EMPTY content.
      #
      # SAMPLING PARAMS ARE LOAD-BEARING -- without them this model does not stop. vLLM's own
      # defaults leave top_k DISABLED, and with no top-k truncation the sampler wanders and never
      # emits the closing </think>; Open WebUI then dies with `TransferEncodingError`.
      # temperature 1.0 / top_p 0.95 / top_k 20 is Qwen3.8's official thinking-mode recipe.
      # A controlled 6-vs-6 A/B (same endpoint, same queue, uncapped) tested T=0.6 against it:
      # reliability identical (6/6 both), placement identical, and T=1.0 came back RICHER
      # (mean 88.7 vs 76.8 elements). Do not lower it -- an earlier apparent T=0.6 win was an
      # artifact of comparing batches run under different caps and client timeouts.
      #
      # reasoning_effort xhigh -- the model's own template default, and MEASURED better here on
      # "Generate an SVG of a pelican riding a bicycle" at constant temperature.
      # ⚠️ THE TWO LINES BELOW WERE MEASURED 2026-09-07 AND ARE PENDING RE-MEASUREMENT:
      #   medium -> 47-50 SVG elements, consistently flat: bird not seated, legs off the pedals
      #   xhigh  -> 75-110 elements, correct saddle/crank geometry, legs articulated to pedals
      # The element-count contrast is not in doubt. The "correct saddle/crank geometry" half IS: a
      # deterministic stroke-aware scorer re-ran the same prompt and sampling on 2026-09-10 ON THE
      # RESTORED ENGINE (plan C0 baseline, n=3, C=1) and scored 0/3 on the joint verdict. Check 1
      # (no leg painted above the saddle surface) failed on all three, at 4.0 / 6 / 7.0 px overshoot.
      # Check 2 failed on 2 of 3; s11 is the sample where the WHOLE pelican group is demonstrably
      # painted after the WHOLE bicycle group (elements 46-66 against 22-45), while s12's check-2
      # failure came via the label path and is recorded only as a failed check 2, not as
      # whole-bird-after-whole-bicycle. Element counts on 2026-09-10 were 67 / 75 / 84 -- ONE OF THE
      # THREE BELOW the 75-110 band recorded above, and none of them counted the way the plan's gate
      # defines it (RENDERED elements only, no padding), so that band is UNVERIFIED rather than
      # confirmed.
      #
      # SUPERSEDED THE SAME DAY, and the update matters more than the baseline: the C0 baseline was
      # extended to n=8 and the first Phase C rung was RUN AND RULED OUT.
      #   C0  (-fast, int4 lm_head)  joint pass 0/8   check1 fail 6/8   check2 fail 4/8, 2 unscorable
      #   C2  (base,  int8 lm_head)  joint pass 0/8   check1 fail 6/8   check2 fail 3/8, 2 unscorable
      # Same eight seeds, same prompt, same sampling, C=1. Paired, check 1 improved on 0 samples and
      # regressed on 1; check 2 improved on 1 and regressed on 2 -- exact McNemar p=1.000 on both.
      # That is NO DETECTED DIFFERENCE in these paired samples; at n=8 it is not a claim of
      # equivalence, and a real effect smaller than this design can see is not excluded.
      # So moving the target model's output projection from int4 to int8 changes NEITHER defect, and
      # the hypothesis that the -fast variant's int4 lm_head was blunting long-range structural
      # consistency is not supported. cloud2 was restored to C0.
      # Two side findings worth keeping: C2 cost no throughput at TP=4 (180.5 vs 180.9 tok/s -- the
      # recipe's ~107-109 vs ~114-124 figure is single-GPU and does not survive the lm_head being
      # sharded four ways), and a checkpoint change is a ~285 s outage rather than ~105 s because
      # changing MODEL= invalidates the torch.compile cache.
      # n=8 screens a rung out; the plan's n=20 is what would be needed to ACCEPT one. Chasing this
      # is Phase C of the cloudlab plan, not
      # a change to make here.
      # The cost is real (xhigh ~20-30K tokens vs ~4K). No decode cliff was seen on 2026-09-07: a
      # 28,177-token single-stream generation held 158.8 tok/s. The 52.7 tok/s of 2026-09-10 is NOT
      # a decode cliff either -- the drafter was dead (acceptance 0.014%), which makes rejection
      # sampling slow but lossless, so it is 5x slow for a reason that has nothing to do with length.
      # Callers can still override per request.
      # VISION: images work (host VISION=1). Verified with distinct-image probe 2026-09-07 --
      # red/blue/green -> RED/Blue/Green, 3/3 distinct AND correct. VIDEO IS UNTESTED: this
      # INT4 export ships no video_preprocessor_config.json, so do not advertise video.
      - model_name: qwen3.8-27b-vllm-cloud
        litellm_params:
          model: openai/qwen3.8-27b
          api_base: http://192.168.0.28:18020/v1
          api_key: "sk-noauth"
          temperature: 1.0
          top_p: 0.95
          extra_body:
            top_k: 20
            chat_template_kwargs: { reasoning_effort: xhigh }
        model_info: { supports_vision: true, max_input_tokens: 81920 }
      # qwen3.8-27b-vllm-fast — SAME cloud2 engine, thinking OFF. Exists for Open WebUI's
      # TASK_MODEL_EXTERNAL (chat titles, tags, retrieval query generation), which needs a backend that
      # is fast AND always warm. Review of PR #524 correctly flagged that pointing the task model at
      # qwen3-coder-30b-a3b moved it onto a TTL-unloading llama-swap host, so a title could pay a cold
      # model load. This route removes that: the vLLM service on :18020 is a persistent systemd unit,
      # always resident, so there is no swap to wait for.
      # enable_thinking:false is the whole point -- the main qwen3.8-27b-vllm route runs xhigh, which
      # spends 15,996-38,897 reasoning tokens per answer. Generating a four-word chat title through that
      # would be absurd. max_tokens is capped here for the same reason.
      # NOTE it is enable_thinking:false, NOT reasoning_effort:'off'. There is no 'off' rung: the chat
      # template hard-rejects anything outside xhigh/medium/low and returns
      #   400 "Unexpected reasoning effort off. Supported types are xhigh (default), medium, and low."
      # Verified against the live endpoint 2026-09-07: enable_thinking:false -> reasoning_tokens=0.
      # No extra VRAM: same engine, same weights, different sampling.
      # ⚠️ SAME ENGINE AS qwen3.8-27b-vllm-cloud (:18020), so the 2026-09-10 HTTP-200/token-0 fault
      # note on that route applies here IDENTICALLY -- `enable_thinking:false` isolates nothing, it
      # only changes sampling on the same process. On 2026-09-10 this alias, the Open WebUI default,
      # its TASK_MODEL_EXTERNAL and dsh's default provider were ALL returning `!`.
      - model_name: qwen3.8-27b-vllm-fast-cloud
        litellm_params:
          model: openai/qwen3.8-27b
          api_base: http://192.168.0.28:18020/v1
          api_key: "sk-noauth"
          temperature: 0.7
          top_p: 0.8
          max_tokens: 512
          extra_body:
            top_k: 20
            chat_template_kwargs: { enable_thinking: false }
        model_info: { max_input_tokens: 81920 }
      # ---- cloud3 vLLM: qwen3.8-27b-fp8 — the UNCENSORED FP8 checkpoint, TP=4 over all four RTX 3090s ---
      # orcarouter/Qwen3.8-27B-Uncensored-FP8 at HF 0f3cdb83, served by vLLM 0.28.0 (cu129 wheel: cloud3
      # runs driver 550 / CUDA 12.4) UNDER llama-swap on 192.168.0.26:8080 as a swap target, beside the
      # llama.cpp entries below, and carrying that host's `default` alias since 2026-09-11 (cloudlab
      # issue #7, PR #11, runbook §13). NOT the same engine as qwen3.8-27b-vllm-cloud on cloud2, and
      # kept under its own model_name for the same reason that entry gives: different checkpoint,
      # different box, a THIRD of the throughput, and a swap host -- pooling would hide which answered.
      #
      # FP8 on Ampere is WEIGHT-ONLY (Marlin W8A16): the memory of an 8-bit checkpoint, bf16 compute,
      # no FP8 speedup. MEASURED 2026-09-11 on this checkpoint, CUDA graphs on, no MTP: 66.8 tok/s
      # single stream, 149.6 tok/s aggregate at 4 streams (gate checkpoint, same config), KV pool
      # 775,637 tokens. Cold start through llama-swap ~100 s (173 s the first time a checkpoint
      # compiles); request_timeout below covers it, and every request may pay it after the 7200 s TTL
      # or after another cloud3 model has been swapped in -- cloud3 holds ONE model at a time.
      #
      # CONTEXT: host --max-model-len 131072 (raised from the 65536 the gates ran at, same pool, 5.9x
      # concurrency at full length). max_input_tokens = 131072 - 49152 = 81920, the same output
      # headroom as cloud2's route: xhigh reasoning measured 16-39k tokens per answer there, and an
      # under-budgeted reasoning model returns finish_reason=length with EMPTY content.
      # SAMPLING as on the cloud2 route -- Qwen3.8's thinking-mode recipe; the template of this
      # checkpoint accepts reasoning_effort (checked in its chat_template.jinja). Thinking termination,
      # tool calls and streaming through THIS proxy have not yet been exercised end to end from a
      # dev-worker (ClusterIP-only); the direct-to-backend probes are in cloudlab runbook §13.
      # VISION: the checkpoint keeps its vision tower (882 unconverted modules) and vLLM loads it, but
      # no image probe was run here -- supports_vision is deliberately NOT claimed. No fallbacks yet:
      # a fallback chain for this route is a routing decision for the operator, not a default.
      #
      # TWO NAMES, ONE BACKEND, since 2026-09-11. The route first shipped as `qwen3.8-27b-fp8-cloud`,
      # named after the weight format; in the dsh picker that said nothing about what makes this
      # checkpoint different, and the operator asked for the name to say "uncensored". A route is
      # not renamed (runbook model-registration.md §5: Open WebUI stores the model id per chat and
      # has no alias layer, so a rename strands every chat on the old id). Instead the ORIGINAL
      # name is kept as a hidden alias -- `model_info.hidden: true` drops it from the dsh picker
      # and from Open WebUI's Local group, while LiteLLM keeps answering to it (the runbook's
      # documented hide; note it is PARTIAL: Open WebUI's External connection discovers every
      # name from /v1/models, so the old id still shows there, as open-webui.yaml says) -- and
      # the name the generated consumers advertise is the entry below. The two entries MUST keep
      # identical litellm_params: they are one deployment under two names, and a drift between
      # them would make "which name did you use" a behavioural question. The `alias_of` key on
      # the new entry is what scripts/tests/test_litellm_aliases.py checks that invariant from;
      # it is free-form model_info to LiteLLM and ignored by the consumer generator.
      - model_name: qwen3.8-27b-fp8-cloud
        litellm_params:
          model: openai/qwen3.8-27b-fp8
          api_base: http://192.168.0.26:8080/v1
          api_key: "sk-noauth"
          temperature: 1.0
          top_p: 0.95
          extra_body:
            top_k: 20
            chat_template_kwargs: { reasoning_effort: xhigh }
        model_info: { max_input_tokens: 81920, hidden: true }
      # The advertised name for the same deployment (see the note above). `-fp8` stays in the
      # name because the format is the operational fact (weight-only on Ampere, the memory
      # saving, the cold start); `-unc` (uncensored) is what the checkpoint IS.
      - model_name: qwen3.8-27b-fp8-unc-cloud
        litellm_params:
          model: openai/qwen3.8-27b-fp8
          api_base: http://192.168.0.26:8080/v1
          api_key: "sk-noauth"
          temperature: 1.0
          top_p: 0.95
          extra_body:
            top_k: 20
            chat_template_kwargs: { reasoning_effort: xhigh }
        model_info: { max_input_tokens: 81920, alias_of: qwen3.8-27b-fp8-cloud }
      # ---- COGNITIVE TIER: cloud3 ---------------------------------------------------------------
      # qwen3-coder-next REPOINTED 2026-09-07: that model_name no longer exists. cloud3's llama-swap
      # then served exactly two models (qwen3-coder-30b-a3b, qwen3.8-27b) — a THIRD, qwen3.5-122b,
      # was added 2026-09-08 when it moved off ailab — and the weights for a
      # "qwen3-coder-next" are not on the store at all, so every request under the old name 404'd at
      # the backend. Registered here under the name llama-swap actually answers to.
      # 30B MoE with 3B ACTIVE -- decode speed tracks ACTIVE parameters, not total, which is what makes
      # this usable for agent loops. host -c 262144 across --parallel 2 => 131072/slot; minus ~8K output
      # headroom = 122880.
      # NOTE cloud3 now has FOUR GPUs (96 GiB), not the three this section was written for.
      - model_name: qwen3-coder-30b-a3b-cloud
        litellm_params:
          model: openai/qwen3-coder-30b-a3b
          api_base: http://192.168.0.26:8080/v1
          api_key: "sk-noauth"
        model_info: { max_input_tokens: 122880 }
      # qwen3.8-flash-next — the PLANNING tier, added 2026-09-08. 80B-class MoE with few active
      # params, which is what makes a long-context planner usable: decode speed tracks ACTIVE
      # parameters, not total. MEASURED on cloud3: 59.8 tok/s generation, 128 tok/s prompt eval,
      # 13.7 s cold load, 74.1 GiB of 96 GiB VRAM fully resident (nothing spills to host RAM).
      #
      # It runs on a SEPARATE llama.cpp build on the host (b10857) because the daily-driver build
      # there predates this architecture and rejects it with "unknown model architecture:
      # 'qwen4exp'". That is a serving-side detail — see cloudlab host/llama-swap.yaml — but it
      # is why this model appeared later than the other three on the same endpoint.
      #
      # host -c 262144 --parallel 1, so the whole 256K window serves ONE request; minus 32768
      # output headroom = 229376. The window is large because it is nearly free on this
      # architecture: 4x the context cost 11.6 GiB and no measurable speed change.
      - model_name: qwen3.8-flash-next-cloud
        litellm_params:
          model: openai/qwen3.8-flash-next
          api_base: http://192.168.0.26:8080/v1
          api_key: "sk-noauth"
          temperature: 1.0
          top_p: 0.95
          extra_body:
            top_k: 20
        model_info: { max_input_tokens: 229376 }
      # qwen3.8-flash-next-q6 — the SAME model at UD-Q6_K_XL (157.5 GiB file), added 2026-09-11 as
      # its OWN route, not a replacement: the Q3_K_XL entry above stays the planning tier (cloudlab
      # issue #7, plans/2026-09-11-cloud3-vllm-stack-plan.md, runbook §13). Same host and sampling;
      # what differs is placement: 50.7 GiB of the file is the 51B n-gram table, which llama.cpp
      # reads lazily from NVMe, and the experts of every even layer (24 of 48) sit in host RAM, so
      # the box's DDR4 is in the decode path.
      #
      # MEASURED 2026-09-11 on the same harness as the entry above, same day:
      #   2k prompt   Q6  7.7 tok/s, TTFT 14.4 s   |  Q3_K_XL 32.7 tok/s, TTFT 2.9 s
      #   30k prompt  Q6 1.35 tok/s, TTFT 172 s    |  Q3_K_XL  5.4 tok/s, TTFT 35 s
      # Three to four times slower (N=2 aggregate 17.5 vs 51.2); long prompts pay the offloaded
      # experts in prefill as well. Q6 is the higher-precision quant -- no quality evaluation was
      # run today, so "better answers" is the reason to pick it, not a measurement. Route to -cloud
      # for a planner that has to keep up with an agent loop. Both entries are the same llama-swap
      # host, so alternating requests swap the whole model each time -- do not fan a team across both.
      #
      # max_input_tokens is a PROVISIONAL, TIMEOUT-derived cap, not the served window. The host
      # serves -c 262144 --parallel 1 like the Q3 entry, but prefill of the offloaded experts
      # measured ~175 tok/s at 30k tokens, so the proxy's 900 s request_timeout (below) would be
      # reached near 150k prompt tokens -- and a cold load (52 s) and queueing behind another
      # model come out of the same budget. 98304 leaves ~340 s of that budget after a prefill at
      # the 30k rate; behaviour past 30k has not been measured, and the cap relies on the same
      # pre-call context check every entry in this list does -- its enforcement was NOT tested
      # from a dev-worker (this gateway is ClusterIP-only). Raise it only with request_timeout.
      - model_name: qwen3.8-flash-next-q6-cloud
        litellm_params:
          model: openai/qwen3.8-flash-next-q6
          api_base: http://192.168.0.26:8080/v1
          api_key: "sk-noauth"
          temperature: 1.0
          top_p: 0.95
          extra_body:
            top_k: 20
        model_info: { max_input_tokens: 98304 }
      # qwen3.8-27b — the quality tier, ON-DEMAND on node1 (.44) :8082 via its own llama-swap
      # instance, in the slot gemma-4 used to hold. 27B DENSE (not MoE), so every token reads all 27B
      # params: a MEASURED 9.3 tok/s vs qwen3.6's ~50. That is inherent to a dense model on a
      # bandwidth-bound iGPU, NOT a misconfiguration — route here for hard reasoning, not for chat
      # latency. Hybrid Gated-DeltaNet: only 16 of 64 layers carry a growing KV cache, so the full
      # 256K window costs little. host CTX=262144 --parallel 1 (ONE slot at full decode speed —
      # splitting a model this slow in two would halve an already-slow decode).
      # NOT pinned: loaded it costs 31.4 GiB of host RAM (node1 is post carve->GTT, so weights land in
      # GTT), which node1 cannot hold permanently — see kubernetes/infra/ai-lxc/models.yaml. It is
      # still listed here (unlike the on-demand heavyweight policy for gemma-4) because llama-swap
      # ALWAYS answers :8082, so the router never sees a down backend — the first request after idle
      # just pays a ~74 s cold start, covered by request_timeout below. Same deal as qwen3.5-122b.
      # max_input_tokens = 262144 - 16K output/reasoning headroom = 245760 (it is a reasoning model:
      # under-budgeting max_tokens yields empty content + finish_reason "length").
      # Needs llama.cpp b10430 (b9672 predates the arch) — node1 runs both builds side by side.
      # DEPLOYMENT REMOVED 2026-08-15 — qwen3.8-27b is served to Open WebUI ONLY, as a direct connection
      # to its llama-swap (open-webui.yaml OPENAI_API_BASE_URLS[1]). It must not be routed through here.
      #
      # LiteLLM 1.91.0 does not propagate a client disconnect upstream, and for THIS model that is not a
      # latency annoyance but a wedge: it serves ONE slot (--parallel 1), so an abandoned request keeps
      # decoding with no client attached and every later request queues behind it. Measured 2026-08-15:
      # a cancelled chat orphaned a generation that ran 7+ minutes after its client vanished (13k ->
      # 15.7k tokens, still climbing) and only a `systemctl restart llama-swap-qwen38` released the slot.
      # The same abort against llama-swap DIRECTLY freed the slot in 6 s (llama.cpp sees the peer go
      # away), so the direct path is the one where "stop" actually stops.
      #
      # It was briefly registered in BOTH — here, and directly in OWUI under a "direct." prefix_id — on
      # the assumption that unknown API consumers might need the LiteLLM name. They do not: no code in
      # this repo calls it, and over 6 h ALL 20 requests carried LiteLLM's AsyncOpenAI user-agent while
      # the direct connection saw zero. Keeping both only left the BROKEN entry as the obvious pick in
      # the model list. The prefix is now dropped too, so "qwen3.8-27b" resolves to the direct path and
      # pre-existing chats (which store that exact id) keep working.
      #
      # Consequence: num_retries/timeout overrides for it are gone with the deployment, and the global
      # litellm_settings.request_timeout no longer applies to qwen3.8 at all — OWUI has no timeout, and
      # cancellation is what bounds a run. Do NOT re-add this entry without also removing the direct
      # connection, or the broken path becomes reachable again.
      #
      # SCOPE (2026-08-19): everything above applies to THIS backend — node1 `.44:8082`, reachable
      # under the client-facing name `qwen3.8-27b`. It is NOT a ban on the Qwen3.8-27B *model*.
      # The cloud3 backend is registered above as `qwen3.8-27b-cloud` and does route through here;
      # that is deliberate and does not reopen this path, because (a) it is a different llama-swap on
      # different hardware, (b) it runs --parallel 2 so an orphaned request cannot wedge its only slot,
      # and (c) the bare name `qwen3.8-27b` still resolves ONLY to the direct OWUI connection, so
      # pre-existing chats storing that id are unaffected. Do not "fix" the apparent contradiction by
      # deleting the -cloud entry.
      # litellm-local.yaml keeps its own qwen3.8 entry for the platform's cost-tracked tenant routing;
      # it inherits the same no-cancel behaviour and is a separate decision, deliberately untouched here.
      # gemma-4-26b-a4b is RETIRED locally. It was stopped on node1 :8082 to free ~15 GiB VRAM for
      # Qwen3.6's extended context, and that port now belongs to qwen3.8-27b's llama-swap instance —
      # so gemma-4 can NOT be brought back by re-provisioning :8082 any more. Qwen3.6 and Qwen3.8 both
      # cover image+video, so no vision capability is lost. To serve it again you would have to free
      # another port/node.
      # Cloud models (real OpenAI/Anthropic) for the Strive platform's model
      # dropdown. Keys come from the litellm-cloud-keys Secret (SOPS), referenced
      # via os.environ/ so they never appear in this ConfigMap.
      - model_name: gpt-4.1
        litellm_params:
          model: openai/gpt-4.1
          api_key: os.environ/OPENAI_API_KEY
      - model_name: gpt-4.1-mini
        litellm_params:
          model: openai/gpt-4.1-mini
          api_key: os.environ/OPENAI_API_KEY
      # Embeddings for the platform's knowledge service. Until this entry the
      # gateway served NO embedding model, so knowledge's OpenAIEmbedder
      # (pointed here) could never come up with a working /v1/embeddings and
      # every estate deploy silently fell back to NoopEmbedder ZERO-vectors —
      # cosine KNN over zero vectors returns nothing, so app vector search
      # (pdf-insights propose/chat retrieval) always came back empty. Routed
      # to the real OpenAI upstream; 1536 dims = knowledge's vector(1536).
      - model_name: text-embedding-3-small
        litellm_params:
          model: openai/text-embedding-3-small
          api_key: os.environ/OPENAI_API_KEY
      - model_name: claude-sonnet-4-6
        litellm_params:
          model: anthropic/claude-sonnet-4-6
          api_key: os.environ/ANTHROPIC_API_KEY
      # Sonnet 5 — the platform catalog's current Claude id (replaces 4-6 there).
      # Kept alongside 4-6 during the deploy transition: the currently-running
      # deepagent still requests claude-sonnet-4-6 until the image digest bump.
      - model_name: claude-sonnet-5
        litellm_params:
          model: anthropic/claude-sonnet-5
          api_key: os.environ/ANTHROPIC_API_KEY
      # GPT-5.x flagship tier — completes the Strive platform's 8 "online" catalog
      # ids. Bare model_name = exactly what pydantic-ai sends over the wire; no
      # api_base (direct to api.openai.com) reusing the same litellm-cloud-keys key.
      - model_name: gpt-5.4
        litellm_params:
          model: openai/gpt-5.4
          api_key: os.environ/OPENAI_API_KEY
      - model_name: gpt-5.4-mini
        litellm_params:
          model: openai/gpt-5.4-mini
          api_key: os.environ/OPENAI_API_KEY
      - model_name: gpt-5.4-nano
        litellm_params:
          model: openai/gpt-5.4-nano
          api_key: os.environ/OPENAI_API_KEY
      - model_name: gpt-5
        litellm_params:
          model: openai/gpt-5
          api_key: os.environ/OPENAI_API_KEY
      - model_name: gpt-5-mini
        litellm_params:
          model: openai/gpt-5-mini
          api_key: os.environ/OPENAI_API_KEY
      # --------------------------------------------------------------- always-on fallback route
      # Added 2026-09-09. Both cloud routes above live on cloudlab hosts that POWER OFF NIGHTLY, so
      # neither can back the other after hours -- .26 shares .28's outage window by design. node2 is
      # an on-prem LXC that is always up, so it is the only honest terminal fallback in the estate.
      #
      # Registered here (it already exists in litellm-local for the agentforge workers) because
      # fallbacks resolve against THIS proxy's model_list -- a name this router cannot see is not a
      # fallback. Same family, different engine: llama.cpp, not vLLM, so it deliberately carries NONE
      # of :18020's vLLM-only sampling (chat_template_kwargs / enable_thinking would 400 here).
      #
      # It is smaller and, with node2's ttl idle-unload, a first request may pay a cold model load.
      # That is the correct trade against the alternative, which on 2026-09-08 was a 500 in the
      # user's chat window with no second route to try.
      - model_name: qwen3.6-35b-a3b-local
        litellm_params:
          model: openai/qwen3.6-35b-a3b
          api_base: http://llm-node2.ai.svc.cluster.local:8080/v1
          api_key: "sk-noauth"
        # supports_vision is FALSE, measured against the live endpoint rather than copied:
        #   POST /v1/chat/completions with an image_url part ->
        #     500 "image input is not supported - hint: ... you may need to provide the mmproj"
        # mmproj-F16.gguf IS present in /models/qwen3.6-35b-a3b/, but node2's llama-server ExecStart
        # does not pass --mmproj, so the projector is never loaded and the model is text-only at
        # runtime. Advertising vision here would send any image request that fails over from the
        # vision-capable cloud route straight into a 500 -- i.e. the fallback would silently not
        # cover multimodal traffic, which is the exact class of outage this chain exists to close.
        # (reviewer-claude on #606.)
        # hidden: the always-on fallback route is reachable by name and as a fallback target, but excluded from dsh and from Open WebUI's Local group (Open WebUI's second connection still lists it under External).
        model_info: { supports_vision: false, max_input_tokens: 114688, hidden: true }
    litellm_settings:
      drop_params: true
      # 900s to cover a llama-swap COLD START: the first request to an idle-unloaded heavyweight
      # (gpt-oss ~1.5-4 min, qwen3.5-122b ~4-5 min over NFS) must not time out before the model loads.
      # Matches llama-swap's healthCheckTimeout (kubernetes/infra/ai-lxc/provision.sh SWAP mode).
      request_timeout: 900
      # Spend guard: hard ceiling on third-party (OpenAI/Anthropic) cost so a LITELLM_MASTER_KEY leak on
      # the (soon-public) api.chifor.me can't run up unbounded cloud spend. Global across all models/keys;
      # tune to comfort. For finer control, move cloud models behind a separate virtual key with its own budget.
      max_budget: 50 # USD
      budget_duration: 30d
    # Router (all proxy traffic flows through it): health-aware load-balancing across a model's
    # deployments. On a failed call the router retries the OTHER deployment and, after allowed_fails,
    # parks the bad one for cooldown_time — so a down/restarting node degrades gracefully rather than
    # returning ~50% errors.
    # NB (2026-09-07): this text used to cite qwen3.6-35b-a3b's llm-node1/llm-node2 pair as the worked
    # example. That pair no longer exists — qwen3.6 was retired from THIS proxy in #524/#525, and
    # llm-node1 was deleted outright after ai-llm-1 stopped running a llama-server at all. The
    # multi-deployment machinery below is still live and still correct; it just has a different set of
    # models under it now. qwen3.6 does survive on litellm-local.yaml (agentforge workers), single
    # deployment, llm-node2 only.
    # (Single-deployment models like qwen3.5-122b/cloud still benefit from num_retries on transient 5xx.)
    router_settings:
      # least-busy: route to the deployment with the fewest in-flight requests. With --parallel 2 on each
      # node the pair exposes 4 effective slots; least-busy spreads concurrent chats far more evenly than
      # simple-shuffle's per-request coin-flip (a 2026-07-09 load test saw simple-shuffle pile ~12-60x the
      # tokens on node1 while node2 sat idle). Per-replica in-memory view (2 litellm replicas each track
      # their own), so it is best-effort across the pair — still strictly better than random.
      routing_strategy: least-busy
      # 2026-09-09: DEFAULT_MODELS and TASK_MODEL_EXTERNAL both resolved to :18020, which was
      # ConnectionRefused from 2026-09-08T17:20Z with NO fallback configured -- so the estate's
      # default chat model and its title/tag generation were both simply broken for a day. The host
      # pinged and :22 was open; only the vLLM unit was down, and nothing watched it.
      #
      # Ordered deliberately: the daytime cloud route first (same family, comparable quality), then
      # the always-on local route. Both cloud hosts power off nightly, so without the local entry the
      # chain is empty exactly overnight. A fallback list whose members share an outage window is not
      # a fallback list.
      #
      # ⚠️ THIS CHAIN DOES NOT COVER THE 2026-09-10 FAILURE MODE. Do not read its presence as
      # "the qwen3.8-27b-vllm-cloud route is covered" -- it is covered for ONE of the two OUTAGES
      # this route has actually had (2026-09-08 and 2026-09-10). (Full incident in the model_list
      # comment on that route.)
      # Fallbacks fire on ERRORS: an exception, a 5xx, a timeout, a connection refusal. That is
      # exactly the 2026-09-08 outage this chain was built for (ConnectionRefused), and it covers it.
      # The 2026-09-10 fault is the opposite shape: :18020 returned HTTP 200 with a well-formed body
      # whose content was `!!!!...`. Nothing raised, so num_retries never retried, no fallback ever
      # fired, and LiteLLM served the garbage to users for hours. Gatus's status-only `vllm-cloud2`
      # endpoint (group `AI`) missed it for the same reason -- a /v1/models STATUS probe passes while
      # the model behind it is emitting token 0. A well-formed 200 defeats every error-shaped defence
      # by construction.
      # WHAT COVERS IT, so the next reader does not re-derive this -- and what each one does NOT:
      #   1. `VLLMSpecDecodeAcceptanceCollapse` -- cloudlab
      #      kubernetes/apps/infrastructure/monitoring/cloud-vllm-rules.yaml. Fires when
      #      rate(vllm:spec_decode_num_accepted_tokens_total[10m]) /
      #      rate(vllm:spec_decode_num_draft_tokens_total[10m]) stays BELOW 0.02 (2%) for 10m, ANDed
      #      with a >1 draft-token/s guard on the same window so an idle or stopped engine (0/0)
      #      cannot fire it. Cheapest signal there is -- already on /metrics, no request of its own.
      #      It did NOT catch the 2026-09-10 incident: the rule POSTDATES it and was written from its
      #      counters. It would have, by a wide margin -- 2% sits ~9x below that day's 18.1%
      #      cumulative healthy acceptance and ~138x above its broken 0.0145% (the rule's own two
      #      measured points).
      #      ITS OWN ANNOTATION CARRIES THE CAVEAT AND SO DOES THIS LINE: it proves the drafter and
      #      the target model no longer agree, NOT that the output is garbage. Those were TWO
      #      SEPARATE faults on 2026-09-10 (see the route comment above). A token-0 latch with a
      #      HEALTHY drafter would not fire it at all, so a quiet acceptance alert is not evidence
      #      that this route's output is fine. Only a content check can say that.
      #   2. The content-validating Gatus endpoint landed on this branch alongside this change --
      #      kubernetes/apps/apps/gatus/configmap.yaml, `name: vllm-cloud2` in group `AI (content)`
      #      (the status-only endpoint of the same name stays in group `AI`). It POSTs
      #      scripts/vllm-test.sh's smoke request straight at :18020 -- fixed prompt, temperature 0,
      #      enable_thinking false, max_tokens 12 -- and asserts on the RESPONSE BODY:
      #      `[BODY].choices[0].message.content == pat(*OK*)` plus `!= pat(*!!!!!!!!!*)`, a LITERAL
      #      run of nine `!` (token id 0). That is the only check in the estate that reads what a
      #      user would have seen.
      #      ITS LIMIT IS STATED THERE AND IS NOT RESTATED AS COVERAGE HERE: Gatus conditions have no
      #      regex and no repetition operator, so vllm-test.sh's GENERAL degenerate-output rules --
      #      any character repeated more than 8 times, and the distinct-character floor -- are NOT
      #      expressible in it. A reply that starts "OK" and then degenerates onto some other
      #      character passes both conditions.
      # Keep the chain -- it is correct for what it covers, and it is still the only thing standing
      # between a user and a 500 when the unit is actually down. Just do not mistake it for health
      # monitoring of the model's OUTPUT.
      fallbacks:
        - qwen3.8-27b-vllm-cloud: ["qwen3.5-122b-cloud", "qwen3.6-35b-a3b-local"]
        - qwen3.8-27b-vllm-fast-cloud: ["qwen3.6-35b-a3b-local"]
      num_retries: 2
      allowed_fails: 2
      cooldown_time: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai
  labels:
    app.kubernetes.io/name: litellm
spec:
  # 2 replicas so a single-pod OOMKill (LiteLLM main-stable grows unbounded under sustained agentic
  # load) no longer blanks the WHOLE gateway — the surviving replica keeps serving every model while
  # the OOMed one restarts. LiteLLM is stateless here (STORE_MODEL_IN_DB=False) so replicas are safe.
  # NOTE: max_budget is tracked IN-MEMORY PER REPLICA, so the $50/30d cloud guard is now ~2x and resets
  # on any restart — for a hard cloud-cost cap use a DB/Redis-backed virtual-key budget instead.
  replicas: 2
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } # never drop below 2 healthy during a rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
      annotations:
        # Rolls the pod when config.yaml changes — LiteLLM reads the mounted
        # ConfigMap only at startup and there is no Reloader in-cluster, so a
        # ConfigMap-only edit would otherwise be a silent no-op. Recompute on
        # every model_list change with EXACTLY:
        #   yq -r 'select(.kind=="ConfigMap" and .metadata.name=="litellm-config") | .data."config.yaml"' \
        #     kubernetes/apps/apps/ai/litellm.yaml | sha256sum | cut -c1-12
        # Or let the generator stamp it: `just af-gen-litellm` (`python3 scripts/gen-litellm-consumers.py
        # --write` where just is not installed) writes this annotation with the same derivation
        # (scripts/check-inline-hashes.py's) and, in the same run, regenerates Open WebUI's model_ids
        # and the dsh seed's models rows from model_list. CI runs `just af-verify-litellm`'s command
        # (--check), so a hand edit to any of those three spans fails the manifests workflow.
        # NOTE (2026-08-14): the previous value was the sha256 of the MOUNTED file, which the yq
        # recipe above does not reproduce (yq appends a trailing newline). Standardised on the
        # documented recipe so the value is reproducible from the command as written.
        # WARNING (2026-08-15): the previous value "51af76d9c8d6" did NOT reproduce from the recipe above
        # for the config it was supposed to describe — verified against four readings of the yq output
        # (as-is / +newline / rstrip / rstrip+newline), none of which matched. So the annotation had
        # ALREADY drifted, which is why editing config.yaml did not roll the pods and the 2026-08-15
        # num_retries/timeout change needed a manual `kubectl rollout restart deploy/litellm`.
        #
        # RESOLVED (2026-08-19): the drift was real and is now closed. The 2026-08-15 value
        # "c5e7de0a28c0" was NOT the documented recipe either — measured three ways:
        #     yq recipe on that config            -> 11ce87388a0e
        #     PyYAML scalar, no trailing newline  -> c5e7de0a28c0   <- what was committed
        # i.e. the committed value came from an extraction that omits the trailing newline yq appends,
        # so the recipe as written could never reproduce it. THIS value is the documented recipe
        # applied to the current config.yaml (yq v4.53.3), so command and annotation finally agree.
        # Keep using the recipe verbatim; if it ever disagrees again, fix whichever is wrong rather
        # than committing a value from a different extraction.
        #
        # This bump matters: the ConfigMap is mounted as a volume and there is NO reloader controller
        # in the cluster, so this annotation is the ONLY rollout trigger. LiteLLM reads its config at
        # process start — without a bump Flux updates the ConfigMap, the pod template hash does not
        # move, no new ReplicaSet is created, and the running pods keep serving the OLD model list.
        #
        # BUMPED 2026-09-11, 369ac5bdabbc -> 2eeb80186320, for the qwen3.8-27b-vllm-cloud record
        # correction: the -fast-vs-base checkpoint comment, the 2026-09-10 two-fault note (drafter
        # collapse and the token-0 latch, recorded separately, with the 12:54:53 restore), the
        # 2026-09-07 measurements and what was re-measured after the restore, the C0 scorer result,
        # a pointer from the -fast route onto the same engine, and the warning that the fallbacks
        # chain does not cover a well-formed-200 failure. Those are ALL comments, so the
        # config LiteLLM parses is byte-identical in effect, so no ROUTING, sampling or limit changes.
        # It is not free, though, and 'changes no behaviour' would be too broad: the bump rolls the
        # Deployment, and a rollout terminates in-flight streams on the replaced replica. It is
        # taken anyway because the estate's rule is that this annotation tracks the ConfigMap: a
        # reader who diffs config.yaml and finds an unbumped checksum concludes the ConfigMap did not
        # change, which is exactly the drift the 2026-08-15/19 notes above were spent closing. The
        # cost is one rolling restart of a 2-replica maxUnavailable:0 Deployment.
        # Value is the documented yq recipe above applied to the current config.yaml, reproduced on
        # yq v4.44.5 (the recipe also reproduces the outgoing 369ac5bdabbc on that version, so this
        # is the same extraction as the previous value, not a new one).
        checksum/config: "a838466a2829"
    spec:
      # Spread the two replicas across nodes so one node going down (or an OOM storm on it) can't take
      # both gateway pods at once. Preferred (not required) — the 3-node cluster must still schedule both.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: { matchLabels: { app.kubernetes.io/name: litellm } }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: litellm
          # Pinned by DIGEST (main-stable is a MOVING tag → silent, unreviewed upgrades). This digest =
          # ghcr.io/berriai/litellm:main-stable as of 2026-07-08. Bump deliberately: pull main-stable,
          # read `docker inspect --format '{{index .RepoDigests 0}}'`, update here, review, merge.
          image: ghcr.io/berriai/litellm@sha256:a3715fa7ad8387941ab697259bd2881d68931657247a41984f90fae6d11c62bf
          command: ["litellm"]
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000", "--num_workers", "1"]
          ports:
            - { name: http, containerPort: 4000 }
          env:
            - { name: STORE_MODEL_IN_DB, value: "False" }
            - { name: LITELLM_LOG, value: "INFO" }
            # Auth for the (soon public) api.chifor.me. Internal callers (Open WebUI) send this too.
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: { name: litellm-secret, key: master-key }
            # Real cloud-provider keys (SOPS, litellm-cloud-keys) for the
            # gpt-4.1 / gpt-4.1-mini / claude-sonnet-4-6 models registered above.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: litellm-cloud-keys, key: OPENAI_API_KEY }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: litellm-cloud-keys, key: ANTHROPIC_API_KEY }
          volumeMounts:
            - { name: config, mountPath: /etc/litellm, readOnly: true }
          readinessProbe:
            httpGet: { path: /health/liveliness, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/liveliness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 1Gi }
            # LiteLLM loads heavy Python deps/tokenizers; <1Gi OOMs at startup.
            # 2Gi OOMKills mid-request under heavy agentic load (long qwen
            # reasoning turns via the router_orchestrator profile stream large
            # bodies + connection-pool buffers through the proxy) — the drop
            # surfaces to callers as "incomplete chunked read" / connection
            # errors. 6Gi gives headroom for concurrent streamed completions.
            limits: { memory: 6Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: litellm-config }
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai
  labels:
    app.kubernetes.io/name: litellm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - { name: http, port: 4000, targetPort: http, protocol: TCP }
---
# Keep at least one gateway pod during VOLUNTARY disruptions (node drain, rollout) so a maintenance
# action can't take the whole LiteLLM gateway down. (Does not guard involuntary OOMKills — replicas:2
# + anti-affinity cover those.)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm
  namespace: ai
  labels:
    app.kubernetes.io/name: litellm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
