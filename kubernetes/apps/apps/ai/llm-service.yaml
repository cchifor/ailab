apiVersion: v1
kind: Service
metadata:
  name: llm
  namespace: ai
  labels: { app.kubernetes.io/name: llm, app.kubernetes.io/component: llama-server }
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
---
apiVersion: v1
kind: Endpoints
metadata:
  name: llm
  namespace: ai
  labels: { app.kubernetes.io/name: llm }
subsets:
  # qwen3.6-35b-a3b now runs on node2 (.45) ONLY -- node1's copy was disabled 2026-08-15 and its
  # llama-server unit no longer exists. (This comment previously said "pinned on BOTH node1 and
  # node2", which stopped being true three weeks before the address was removed below.) `llm` stays
  # for metrics scraping + the compat /v1/models DNS; LiteLLM does not route chat here.
  # .44 REMOVED 2026-09-07. ai-llm-1 has no llama-server.service at all -- only
  # llama-swap-qwen38 on :8082 -- so .44:8080 has been a dead scrape target since node1's
  # qwen3.6 deployment was disabled (2026-08-15), producing a permanent TargetDown{job="llm"}.
  # This Service is scrape-only (nothing routes chat through it), so removing the address costs
  # no capacity. node1 is NOT unmonitored as a result: it is still covered as an LXC host.
  - addresses:
      - { ip: 192.168.0.45, hostname: ai-llm-2 }
    ports: [{ name: http, port: 8080, protocol: TCP }]
---
# Per-node Service for the surviving qwen3.6 route. This was originally a PAIR (llm-node1 +
# llm-node2) load-balancing qwen3.6 across node1 and node2. llm-node1 was RETIRED 2026-09-07:
# ai-llm-1 (.44) has no llama-server.service at all, so that Service pointed at a closed port and
# LiteLLM was round-robining roughly half of the agentforge workers' qwen3.6 requests into it.
#
# The Service+Endpoints pair was deliberately kept for one reconcile after its consumer
# (litellm-local.yaml) dropped the node1 deployment, because LiteLLM reads its config only at
# startup -- deleting it in the same reconcile would have pulled it out from under a still-running
# old pod. All three gate conditions were then verified on the live cluster before this removal:
#   1. `kubectl -n ai rollout status deploy/litellm-local` -> successfully rolled out, and the sole
#      remaining pod carries checksum/config 64ae47a82bad (the 23-day-old pod is gone);
#   2. the running proxy's loaded config has ZERO `api_base` entries pointing at llm-node1 -- only
#      llm-node2 and llm-qwen35 remain (llm-qwen35 has since been removed too, 2026-09-08 -- the
#      122b moved to cloudlab; only llm-node2 remains);
#   3. an authenticated chat/completions call for qwen3.6-35b-a3b through litellm-local returned
#      HTTP 200, finish_reason=stop.
#
# Deliberately NOT labelled app.kubernetes.io/component=llama-server: the `llm` Service above
# already scrapes .45, so labelling this too would double-scrape it.
apiVersion: v1
kind: Service
metadata:
  name: llm-node2
  namespace: ai
  labels: { app.kubernetes.io/name: llm-node2 }
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
---
apiVersion: v1
kind: Endpoints
metadata:
  name: llm-node2
  namespace: ai
  labels: { app.kubernetes.io/name: llm-node2 }
subsets:
  - addresses: [{ ip: 192.168.0.45, hostname: ai-llm-2 }]
    ports: [{ name: http, port: 8080, protocol: TCP }]
---
# llm-qwen35 (node3 .46 :8080) — qwen3.5-122b moved to the cloudlab estate 2026-09-08. It is now
# served by cloud3's llama-swap (192.168.0.26:8080) where 72 GiB of Q4_K_M weights sit entirely in
# 96 GiB of VRAM: MEASURED 60.6-66.2 tok/s fully resident, versus 16.6 tok/s here, where node3's
# iGPU LXC could not hold it and MoE experts spilled to host RAM. The user-facing route is
# qwen3.5-122b-cloud on the `litellm` gateway. The tenant gateway (litellm-local) does NOT follow
# it across — see the note there for why.
#
# THIS SERVICE IS DELIBERATELY RETAINED FOR ONE RECONCILE, exactly as llm-node1 was above.
# litellm.yaml repoints its api_base to 192.168.0.26 and bumps checksum/config in the SAME commit,
# but a checksum bump is a ROLLING update: the old gateway pods keep serving — from the OLD
# in-memory config, which still names llm-qwen35.ai.svc — until the new pods pass their probes and
# the old ones terminate. Deleting the Service in this same apply pulls the backend out from under
# those still-running pods. Precisely: removing the Service drops its CoreDNS record, so a fresh
# lookup NXDOMAINs, AND releases the ClusterIP, so once kube-proxy withdraws the DNAT rules even an
# already-resolved address has nowhere to land. A pooled keep-alive connection may outlive the
# deletion briefly — this is not an instant, total cutoff — but nothing guarantees it, and every new
# request from a draining pod fails. The failure mode is "some 122b requests error during the
# rollout", which is enough to avoid.
#
# The trigger is NOT that Flux applies these two files in an unpredictable order; kustomize-controller
# applies in a deterministic order. It is that the prune of a removed object is not gated on any
# rollout completing: the Service can be deleted while the old ReplicaSet's pods are still Running.
# The PR's manual restart sequence cannot close the window either, since Flux has already applied
# and pruned before any operator-run restart begins.
#
# BOTH GATEWAYS ARE AFFECTED, not just litellm. litellm-local's OLD config carried its own
# `qwen3.5-122b` entry pointing at this same llm-qwen35.ai.svc (removed in this PR, which also
# bumps that gateway's checksum/config), so a surviving old-checksum litellm-local pod resolves this
# Service exactly as an old litellm pod does. The two Deployments roll INDEPENDENTLY and either
# can lag or fail on its own, so a gate that proves only litellm has drained can pass while a
# stale tenant-facing pod still depends on this name.
#
# Removal is a FOLLOW-UP commit, gated on all four checks (the llm-node1 gate above checked both
# gateways for exactly this reason):
#   1. `kubectl -n ai rollout status deploy/litellm` AND `deploy/litellm-local` — both
#      successfully rolled out, with NO pod of either surviving on an old checksum/config
#      (compare each pod's annotation against the checksum/config literal currently in
#      litellm.yaml and litellm-local.yaml respectively — do not copy a value into this comment,
#      which is how the two references here went stale within a single review round);
#   2. the loaded config of BOTH running proxies has ZERO api_base entries naming llm-qwen35;
#   3. an authenticated chat/completions call for qwen3.5-122b-cloud returns HTTP 200;
#   4. node3's llama-server stays UP until 1-3 hold. Retaining the name alone does not preserve
#      availability: if the backend is stopped while an old pod still routes here, DNS resolves
#      and the connection is refused instead — a different error, the same outage.
#      Merging this PR does NOT stop it: models.yaml is INTENT, read by ai-lxc/provision.sh only
#      when that script is deliberately run, so node3 keeps serving on .46:8080 (verified HTTP 200
#      at merge time) with no action required here. The hazard is only manual — do not stop the
#      unit or re-run provision.sh for node3 until the drain is confirmed; do both in the same
#      follow-up that deletes this Service.
#
# ai-llm-3 (vmid 5003, .46) is deliberately KEPT, now empty: node3 was documented SINGLE-MODEL
# because qwen3.5-122b and gpt-oss-120b could not co-reside, so the slot is free again. The LXC
# still owns its address and its out-of-band /models-local mount (added by `pct set`, not tofu),
# which is why removing the model is cheap and destroying the container would not be.
# NOTE .46 still appears in monitoring.yaml's node_exporter endpoints — that is the LXC's own
# host metrics and is unrelated to this Service; it stays.
apiVersion: v1
kind: Service
metadata:
  name: llm-qwen35
  namespace: ai
  labels: { app.kubernetes.io/name: llm-qwen35, app.kubernetes.io/component: llama-server }
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
---
apiVersion: v1
kind: Endpoints
metadata:
  name: llm-qwen35
  namespace: ai
  labels: { app.kubernetes.io/name: llm-qwen35 }
subsets:
  # Still points at node3's llama-server, which is STILL RUNNING and still serving the 122b
  # (verified HTTP 200 on .46:8080). That is deliberate and is the whole point: old-checksum
  # gateway pods do route here until they drain, so the backend has to answer, not merely resolve.
  # An earlier draft of this comment called the address "harmless because nothing routes here" —
  # that contradicted the reason for keeping it. New traffic goes to 192.168.0.26; this exists
  # solely to keep the draining pods whole. Deleted, together with the node3 unit, in the
  # follow-up commit gated above.
  - addresses: [{ ip: 192.168.0.46, hostname: ai-llm-3 }]
    ports: [{ name: http, port: 8080, protocol: TCP }]
---
# llm-qwen38 (node1 :8082) REMOVED 2026-08-25 — the qwen3.8-27b on-demand instance is retired;
# its 31.4 GiB node1 reservation funds ci-runner-7/-8.
# CORRECTION 2026-09-07: ":8082 on .44 is now free" was already false when written and is corrected
# here -- ai-llm-1 runs llama-swap-qwen38.service on :8082 today (probed: HTTP 200 on /v1/models).
# What IS free on .44 is :8080: the llama-server unit does not exist there at all, which is why .44
# was removed from the `llm` Endpoints above.
