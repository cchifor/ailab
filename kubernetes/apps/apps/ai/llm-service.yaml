# `llm` and `llm-node2` Services + Endpoints REMOVED 2026-09-16, with qwen3.6-35b-a3b.
# Both pointed at .45:8080, which was qwen3.6's direct llama-server.service on ai-llm-2. That model
# was retired so node2 could host a qwen3.8-27b instance -- node2 cannot hold both (22.38 + 22.45 =
# 44.83 GiB). See kubernetes/infra/ai-lxc/models.yaml.
#
# ORDER MATTERS AND IT IS THE OPPOSITE OF THE ROUTING CASE. `llm` carried
# app.kubernetes.io/component: llama-server, so the `ai-llm-llamacpp` ServiceMonitor scraped it
# directly. A scraped Service whose backend has stopped fires TargetDown FOREVER -- this file already
# carries that scar from .44. So the Service is removed BEFORE the backend stops, whereas a ROUTING
# Service is only repointed AFTER its new backend is up.
#
# The `ai-llm-llamacpp` ServiceMonitor is deliberately KEPT even though it now matches zero Services.
# It is not a TargetDown risk (no targets = no scrape), and keeping it means a future direct-mode
# llama-server model is scraped automatically rather than silently unmonitored. The qwen3.8 engines
# do NOT match it on purpose: they are lazy, and their metrics travel the node_exporter textfile path.
---
# llm-qwen35 (node3 .46 :8080) REMOVED 2026-09-08. qwen3.5-122b moved to the cloudlab estate and is
# served by cloud3's llama-swap (192.168.0.26:8080), where 72 GiB of Q4_K_M weights sit entirely in
# 96 GiB of VRAM: MEASURED 60.6-66.2 tok/s fully resident, versus 16.6 tok/s here, where node3's
# iGPU LXC could not hold it and MoE experts spilled to host RAM. The user-facing route is
# qwen3.5-122b-cloud on the `litellm` gateway; the tenant gateway (litellm-local) deliberately did
# NOT follow it across — see the note there.
#
# The Service was RETAINED for one reconcile (#547) and deleted here only after its gate passed,
# the same two-step used for llm-node1. Deleting it in the same apply that repoints the gateway
# would have pulled the backend out from under still-draining pods: pruning a removed object is not
# gated on any rollout completing, so the Service can go while the old ReplicaSet is still Running.
#
# Gate results at removal (2026-09-08):
#   1. deploy/litellm and deploy/litellm-local both fully rolled; every surviving pod on the
#      current checksum/config, no old-checksum pod left of either.
#   2. no api_base naming llm-qwen35 in either gateway's config.
#   3. qwen3.5-122b-cloud returned HTTP 200 via the gateway, finish_reason=stop, correct content.
#   4. node3's llama-server was still UP and serving throughout, which is what checks 1-3 required.
#      STOPPING IT IS A SEPARATE, MANUAL STEP THAT THIS DIFF DOES NOT PERFORM. Deleting a k8s
#      Service cannot halt a systemd unit inside an LXC, and the models.yaml entry is INTENT, read
#      by ai-lxc/provision.sh only on a deliberate run. At the time of writing node3 is still
#      serving on .46:8080. The operator step that accompanies this merge is: stop llama-swap on
#      ai-llm-3, then reclaim the staged weights. Sequence it AFTER this merge, not before: while
#      the Service still exists it remains a ServiceMonitor target (component=llama-server), so
#      stopping the backend first produces exactly the permanent TargetDown this file records
#      having been bitten by on .44.
#
# CAVEAT worth keeping, learned while running check 2: you CANNOT verify what a running proxy
# loaded by reading its config file. The ConfigMap is mounted through a `..data` symlink that the
# kubelet swaps atomically, so /etc/litellm/config.yaml shows the NEWEST content even inside a pod
# that started on an older revision and is still serving the older config from memory. The
# checksum/config ANNOTATION is the only reliable statement of what a given pod actually loaded;
# treat check 1 as the real test and check 2 as corroboration. (The path is /etc/litellm/config.yaml
# per the container's --config arg — an earlier draft of this gate named a path that does not exist,
# and a `|| echo 0` fallback turned that mistake into a silent pass.)
#
# ai-llm-3 (vmid 5003, .46) is deliberately KEPT. Its ROUTING slot is free as of this commit, but
# the container is NOT yet empty: llama-swap is still running and 72 GiB of qwen3.5-122b weights are
# still staged under /models-local, both pending the manual step described in check 4. It becomes
# empty only after that. node3 was documented SINGLE-MODEL because qwen3.5-122b and gpt-oss-120b
# could not co-reside; gpt-oss's 60 GiB is already gone. The LXC still owns its address and its
# out-of-band /models-local mount (added by `pct set`, not tofu), which is why removing a model is
# cheap and destroying the container would not be.
# NOTE .46 still appears in monitoring.yaml's node_exporter endpoints — that is the LXC's own
# host metrics and is unrelated to this Service; it stays.
---
# llm-qwen38 (node1 :8082) RESTORED 2026-09-12, after being removed on 2026-08-25 to fund
# ci-runner-7/-8. That runner trade is unwound (ci-runner-8 destroyed; ai-node1 went 24.99 -> 34 GiB
# available), and the backing service never actually stopped: the 2026-09-07 correction below already
# recorded that ai-llm-1 has been running llama-swap-qwen38.service on :8082 the whole time, probed
# HTTP 200 on /v1/models. Only this routing was missing, which is why nothing could reach it.
#
# WHAT THIS UNBLOCKS. Every qwen3.8 route in litellm.yaml points at a cloudlab host (.26/.28), and
# those power off nightly -- measured `up` over 7d is 0.34-0.38, so the estate had NO Qwen3.8 route
# roughly two-thirds of the time, including every night. This is the always-on on-prem one.
#
# Still ON-DEMAND: llama-swap holds :8082 open and loads the model on first request (~24 s cold start
# from NFS, measured), then idle-unloads after ttl 1800. So this Endpoint is always up even when the
# model is not resident -- the router never sees a down backend, it sees a slow first request.
# The port differs from every other entry here (8082, not 8080) because it is a SECOND llama.cpp
# instance in the same LXC; :8080 on .44 genuinely has no unit at all, which is why .44 is absent
# from the `llm` Endpoints above and must stay absent.
apiVersion: v1
kind: Service
metadata:
  name: llm-qwen38
  namespace: ai
  labels: { app.kubernetes.io/name: llm-qwen38, app.kubernetes.io/component: llama-swap }
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - { name: http, port: 8082, targetPort: 8082, protocol: TCP }
---
apiVersion: v1
kind: Endpoints
metadata:
  name: llm-qwen38
  namespace: ai
  labels: { app.kubernetes.io/name: llm-qwen38 }
subsets:
  # MOVED .44 (ai-llm-1/node1) -> .45 (ai-llm-2/node2) on 2026-09-16. node1's instance was
  # retired: a LAZY load arrives all at once and node1's 7-day-minimum MemAvailable is 4.73 GiB
  # against this model's measured 22.45. node2 pays for it by retiring qwen3.6 (22.38 GiB).
  - addresses: [{ ip: 192.168.0.45, hostname: ai-llm-2 }]
    ports: [{ name: http, port: 8082, protocol: TCP }]
---
# llm-qwen38-node3 (node3 .46 :8082) ADDED 2026-09-16 -- the SECOND deployment of the same LiteLLM
# model_name (qwen3.8-27b-ailab). Paid for by retiring ci-runner-7, which freed a measured 10.40 GiB
# and took ai-node3's 7-day-minimum MemAvailable from 18.15 to ~28.6 GiB, clearing this model's
# 22.45 GiB with +6.1 GiB margin. Before that, NO node in the estate could absorb the load at its
# weekly floor.
#
# A SEPARATE Service, deliberately NOT a second address on llm-qwen38's Endpoints. LiteLLM must see
# two distinct api_base values to treat them as two deployments it can route between; folding .46
# into the existing Endpoints would hide the second engine behind kube-proxy and give the router one
# backend it cannot reason about (no per-deployment cooldown, no failover, no least-busy).
#
# component: llama-swap, NOT llama-server -- and that is load-bearing, not cosmetic. The
# `ai-llm-llamacpp` ServiceMonitor selects component=llama-server and scrapes /metrics directly.
# These engines are LAZY, so a direct scrape of an unloaded :8082 would fire TargetDown forever.
# Their metrics travel the node_exporter textfile path instead (llamacpp-metrics.timer, written by
# provision.sh), collected on :9100 from the node_exporter endpoints in monitoring.yaml.
apiVersion: v1
kind: Service
metadata:
  name: llm-qwen38-node3
  namespace: ai
  labels: { app.kubernetes.io/name: llm-qwen38-node3, app.kubernetes.io/component: llama-swap }
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - { name: http, port: 8082, targetPort: 8082, protocol: TCP }
---
apiVersion: v1
kind: Endpoints
metadata:
  name: llm-qwen38-node3
  namespace: ai
  labels: { app.kubernetes.io/name: llm-qwen38-node3 }
subsets:
  - addresses: [{ ip: 192.168.0.46, hostname: ai-llm-3 }]
    ports: [{ name: http, port: 8082, protocol: TCP }]
