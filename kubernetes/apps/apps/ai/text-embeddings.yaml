apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: text-embeddings-model
  namespace: ai
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-embeddings
  namespace: ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: text-embeddings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: text-embeddings
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-model
          image: ghcr.io/huggingface/text-embeddings-inference@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
          command: [/bin/sh, /bootstrap/prepare-embedding-model.sh]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 256Mi}
          volumeMounts:
            - {name: model, mountPath: /data}
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: embeddings
          image: ghcr.io/huggingface/text-embeddings-inference@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
          args:
            - --model-id
            - /data/bge-m3-5617a9f61b028005a4858fdac845db406aefb181/model
            - --served-model-name
            - bge-m3-local-v1
            - --auto-truncate
            - 'false'
            - --hostname
            - 0.0.0.0
            - --port
            - '8080'
            - --max-batch-tokens
            - '1024'
            - --max-batch-requests
            - '8'
            - --max-client-batch-size
            - '8'
            - --max-concurrent-requests
            - '8'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: '1', memory: 4Gi}
            limits: {cpu: '4', memory: 6Gi}
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - {name: model, mountPath: /data, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: text-embeddings-model
        - name: bootstrap
          configMap:
            name: embedding-bootstrap
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: text-embeddings
  namespace: ai
  labels:
    app.kubernetes.io/name: text-embeddings
spec:
  selector:
    app.kubernetes.io/name: text-embeddings
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: text-embeddings
  namespace: ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: text-embeddings
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - {protocol: TCP, port: 8080}
