apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# AI endpoint: surfaces the off-cluster ai-llm LXCs (llama.cpp on the Strix Halo iGPUs)
# as an in-cluster OpenAI-compatible service + Prometheus scrape targets.
resources:
  - namespace.yaml
  - limitrange.yaml
  - litellm-secret.sops.yaml
  - litellm-cloud-keys.sops.yaml # real OpenAI/Anthropic keys for the cloud models in litellm-config
  - litellm-local-secret.sops.yaml # own master key for litellm-local (LAN gateway — no cloud keys)
  - litellm-local-db.sops.yaml # DATABASE_URL for litellm-local's virtual-key/budget store (infra-pg litellm DB)
  - open-webui-oauth.sops.yaml # Authelia OIDC client secret for Open WebUI
  - open-webui-db.sops.yaml # Postgres DATABASE_URL for Open WebUI (infra-pg openwebui DB)
  - llm-service.yaml
  - monitoring.yaml
  - litellm.yaml
  - litellm-chatgpt-eso.yaml # SA + CA + SecretStore + templated ExternalSecret: the realjaynesage ChatGPT access token from OpenBao (ADR 0026)
  - text-embeddings.yaml
  - litellm-local.yaml # local-models-only LiteLLM + litellm-lan NodePort :30400 (agentforge, ADR 0018)
  - owui-valkey.yaml # dedicated valkey for the OWUI Socket.IO backplane (multi-replica)
  - open-webui.yaml
configMapGenerator:
  - name: embedding-bootstrap
    namespace: ai
    files:
      - prepare-embedding-model.sh
      - embedding-assets.sha256
      - embedding-input-limit.json
  # chatgpt_chat.py is MERGED INTO litellm-config (the ConfigMap litellm.yaml declares), not a
  # ConfigMap of its own: LiteLLM's custom_provider_map loader looks for <module>.py beside
  # config.yaml, and a pod that restarts mid-rollout must read config.yaml and the handler from
  # the same in-place ConfigMap -- a separate, hash-suffixed ConfigMap that only the new pod
  # template mounts would let an old pod see a custom_provider_map entry without its module.
  # disableNameSuffixHash keeps the name litellm-config; the `checksum/chatgpt-chat` pod-template
  # annotation (gated by scripts/check-inline-hashes.py) is what rolls the Deployment on an edit
  # to the handler, exactly as `checksum/config` does for config.yaml. ADR 0027.
  - name: litellm-config
    namespace: ai
    behavior: merge
    options:
      disableNameSuffixHash: true
    files:
      - chatgpt_chat.py
