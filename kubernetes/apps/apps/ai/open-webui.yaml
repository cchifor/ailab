# Open WebUI — chat UI in front of the LiteLLM router. Persists chats/config on the NFS
# default StorageClass. Single replica (Recreate) to keep its SQLite store consistent.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: ai
spec:
  accessModes: ["ReadWriteMany"] # nfs-csi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ai
  labels:
    app.kubernetes.io/name: open-webui
spec:
  # 2 replicas for HA + real concurrency, now that state lives in Postgres (not single-writer SQLite-on-NFS)
  # and websockets are Redis-backed. A 2026-07-09 load test showed the single replica serialized every chat
  # (lockstep latencies) and a busy /health got it liveness-killed.
  replicas: 2
  strategy:
    # maxUnavailable:0 + maxSurge:1 also brings pods up ONE at a time, so the first new pod runs the
    # Alembic schema migration on the fresh Postgres alone before the second starts (no migration race).
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - { name: http, containerPort: 8080 }
          env:
            # TWO OpenAI connections (';'-separated — OPENAI_API_BASE_URLS takes precedence over the
            # singular OPENAI_API_BASE_URL, which is now unset):
            #   [0] LiteLLM router — everything (cloud + qwen3.6 + qwen3.5-122b).
            #   [1] qwen3.8-27b DIRECT to its llama-swap, deliberately BYPASSING LiteLLM.
            # Why the bypass: cancelling/deleting a message in OWUI aborts the browser request, but
            # LiteLLM (1.91.0) does NOT propagate that disconnect upstream — it holds the connection to
            # llama-swap open until request_timeout (900s). qwen3.8 serves ONE slot (--parallel 1), so
            # an abandoned request owns the model for up to 15 min and every later message queues behind
            # it. Measured 2026-08-15: four requests each terminated at exactly 900s, 1:1 with
            # llama-swap "recovered from upstream disconnection". llama-swap is a Go reverse proxy that
            # DOES propagate context cancellation — PROVEN 2026-08-15 by aborting a streaming client
            # mid-generation: the llama.cpp slot went is_processing=False within 6s. Via LiteLLM the same
            # abort orphaned the generation for 7+ minutes (it kept decoding with no client attached,
            # 13k -> 15.7k tokens) until the service was restarted, wedging the single slot.
            # qwen3.8-27b is served ONLY by this connection — its LiteLLM deployment was REMOVED, and the
            # "direct." prefix_id dropped, so exactly ONE model of that name exists and it is the one that
            # can be stopped. It was previously registered in BOTH with a prefix, which left the BROKEN
            # LiteLLM-routed entry as the obvious pick in the model list: measured over 6h, 20/20 requests
            # took the LiteLLM path and none used the direct one. Do NOT re-add it to litellm.yaml.
            # (kubernetes/apps/apps/ai/litellm-local.yaml keeps its own qwen3.8 entry for the platform's
            # cost-tracked tenant routing; it has the same no-cancel property and is a separate decision.)
            - name: OPENAI_API_KEY # the LiteLLM master key (LiteLLM now requires it)
              valueFrom:
                secretKeyRef: { name: litellm-secret, key: master-key }
            - { name: OPENAI_API_BASE_URLS, value: "http://litellm.ai.svc.cluster.local:4000/v1" }
            # $(OPENAI_API_KEY) is expanded by kubelet from the env var declared ABOVE (declaration order
            # matters); llama-swap ignores the bearer token, so connection [1] uses a placeholder.
            - { name: OPENAI_API_KEYS, value: "$(OPENAI_API_KEY);sk-noauth" }
            # Keyed by connection INDEX as a string (openai.py: api_configs.get(str(idx), ...)).
            # model_ids restricts connection [1] to just qwen3.8 so llama-swap does not add duplicates.
            # NO prefix_id: the model must surface under its real id "qwen3.8-27b" so existing chats
            # (which store models: ['qwen3.8-27b']) keep resolving — now to the direct, cancellable path.
            # A prefix here would strand every prior conversation on a name nothing serves.
            - { name: ENABLE_OLLAMA_API, value: "False" } # we only use the OpenAI endpoint
            # Was 900s to match LiteLLM request_timeout + llama-swap healthCheckTimeout. A qwen3.5-122b
            # cold-load + long reasoning turn can run minutes; OWUI's aiohttp client would otherwise abort
            # the streamed response at its ~300s default and surface as "loading failed" in the browser
            # while the backend is still generating. See docs/runbooks/ai-model-swap.md.
            #
            # RAISED to 2400s (2026-08-15) because 900s was a hard CEILING ON RESPONSE LENGTH, not just a
            # safety net. qwen3.8-27b decodes at ~9.3 tok/s, so 900s caps ANY answer at ~8.4k tokens no
            # matter what the model wants to emit — and --reasoning-budget 3000 spends up to 3k of those
            # before a single output token, leaving ~5.4k. A large single-file artifact (chat
            # 27f19393: full-page canvas animation) is 10-25k tokens, so it could never finish: measured
            # 1,767,361 B of SSE (~8.4k tokens) cut at exactly 15m0.488s.
            # The failure is silent AND lossy: OWUI persists the aborted turn as
            # `error: {'content': ''}` with done=false, so the streamed text the user watched arrive is
            # NEVER saved. A following "continue" then sees an EMPTY assistant turn and restarts the task
            # (re-reasoning from scratch) instead of resuming — which is what it looks like to the user.
            # REMOVED ENTIRELY (2026-08-15) rather than raised: any finite value is still a cap on answer
            # length, and complex single-file artifacts must be able to run to completion. An EMPTY value
            # means no timeout — env.py does `int(raw) if raw else None` and passes that to
            # aiohttp.ClientTimeout(total=...), and total=None is unlimited.
            # KEEP IT EMPTY, NOT "0"/"none"/"unlimited": that same parse falls back to **300s** on any
            # non-integer string, which would be far WORSE than the 900s we started from.
            # Blast radius is limited to streamed chat: backend /models probes use a SEPARATE
            # AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST (10s), so a dead backend is still detected quickly.
            # SAFE ONLY WITH the direct llama-swap connection above, and this is now load-bearing rather
            # than merely advisable: with no timeout, the client abort is the ONLY thing that can end a
            # runaway generation. Via LiteLLM (which does not propagate disconnects) an abandoned request
            # would hold qwen3.8's single slot until the process is restarted. Do NOT ship this env change
            # without the OPENAI_API_BASE_URLS change above.
            # What still bounds a generation: EOS, --reasoning-budget, n_ctx exhaustion (262144 tokens is
            # ~7.8 h at 9.3 tok/s, ~5.5 h at 4-bit speeds), and the user pressing stop.
            - { name: AIOHTTP_CLIENT_TIMEOUT, value: "" }
            - { name: WEBUI_NAME, value: "ailab AI" }
            # SSO via Authelia OIDC (ADR 0012). Local login stays as break-glass; OAuth sign-up on.
            - { name: WEBUI_URL, value: "https://chat.chifor.me" }
            - { name: ENABLE_OAUTH_SIGNUP, value: "true" }
            - { name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL, value: "true" }
            - { name: OAUTH_PROVIDER_NAME, value: "Authelia" }
            - { name: OPENID_PROVIDER_URL, value: "https://sso.chifor.me/.well-known/openid-configuration" }
            - { name: OAUTH_CLIENT_ID, value: "open-webui" }
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: open-webui-oauth, key: OAUTH_CLIENT_SECRET }
            - { name: OAUTH_SCOPES, value: "openid email profile groups" }
            - { name: OAUTH_CODE_CHALLENGE_METHOD, value: "S256" }
            - { name: ENABLE_OAUTH_ROLE_MANAGEMENT, value: "true" }
            - { name: OAUTH_ROLES_CLAIM, value: "groups" }
            - { name: OAUTH_ALLOWED_ROLES, value: "openwebui,openwebui-admin" }
            - { name: OAUTH_ADMIN_ROLES, value: "openwebui-admin" }
            # --- Multi-replica state (replaces single-writer SQLite-on-NFS) ---
            # Relational store -> infra-pg Postgres (ADR 0016 pattern, alongside grafana/authelia). The old
            # webui.db + chroma.sqlite3 stay on the PVC as a reversible backup (unused while DATABASE_URL is set).
            - name: DATABASE_URL # postgresql://openwebui:***@infra-pg-rw.databases.svc:5432/openwebui
              valueFrom:
                secretKeyRef: { name: open-webui-db, key: DATABASE_URL }
            # Shared JWT signing key — REQUIRED for >1 replica. Without it each replica generates its own
            # .webui_secret_key, so a token issued by one replica gets 401 when the request is load-balanced
            # to another. (The Service sessionAffinity below is best-effort — keyed on the cloudflared pod IP,
            # not the browser — so cross-replica requests still happen and a shared key is still required.)
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: open-webui-db, key: WEBUI_SECRET_KEY }
            # RAG vectors -> pgvector (shared, multi-replica-safe). The default file-based Chroma on the RWX
            # PVC would be corrupted by 2 replicas writing concurrently. Reuses the same Postgres DB.
            - { name: VECTOR_DB, value: "pgvector" }
            - name: PGVECTOR_DB_URL
              valueFrom:
                secretKeyRef: { name: open-webui-db, key: DATABASE_URL }
            # Socket.IO backplane: an event produced on one replica must reach a client connected to another,
            # or streaming breaks across replicas. Dedicated owui-valkey (db 0 = websockets, db 1 = app cache).
            - { name: ENABLE_WEBSOCKET_SUPPORT, value: "true" }
            - { name: WEBSOCKET_MANAGER, value: "redis" }
            - { name: WEBSOCKET_REDIS_URL, value: "redis://owui-valkey.ai.svc.cluster.local:6379/0" }
            - { name: REDIS_URL, value: "redis://owui-valkey.ai.svc.cluster.local:6379/1" }
            # CRITICAL: make env vars authoritative. OWUI settings are "PersistentConfig" — seeded from env
            # only on FIRST boot, then served from the DB and env is IGNORED. Our ENABLE_*_GENERATION=false
            # below were silently overridden by DB values (all still `true`), so title/tags/follow-up kept
            # firing. ENABLE_PERSISTENT_CONFIG=false makes env win on every boot (safe here: connection, auth,
            # DB, vector, redis are ALL env-driven — nothing critical is UI-only). See 2026-07-09 diagnosis.
            - { name: ENABLE_PERSISTENT_CONFIG, value: "false" }
            # Disable the per-message auxiliary LLM calls (title/tags/follow-up/autocomplete). Each is an EXTRA
            # completion per user turn that, by default, hits the CURRENT chat model. On the slow qwen3.5-122b
            # they ran full-context AFTER each answer, filled both llama.cpp slots and EVICTED the prefix cache,
            # so the NEXT message queued + re-prefilled — measured 47-159s to first token (vs ~1s once disabled;
            # 2026-07-09 root-cause). Chats just won't get auto-titles/tags/suggestions.
            - { name: ENABLE_TITLE_GENERATION, value: "false" }
            - { name: ENABLE_TAGS_GENERATION, value: "false" }
            - { name: ENABLE_FOLLOW_UP_GENERATION, value: "false" }
            - { name: ENABLE_AUTOCOMPLETE_GENERATION, value: "false" }
            # Belt-and-suspenders: any task that DOES fire (web-search / retrieval / image query generation,
            # only when those features are used) is routed to the fast, always-warm daily driver — NEVER the
            # slow 122b. LiteLLM models are OpenAI-compatible, so OWUI uses TASK_MODEL_EXTERNAL (not TASK_MODEL).
            - { name: TASK_MODEL_EXTERNAL, value: "qwen3.6-35b-a3b" }
          volumeMounts:
            - { name: data, mountPath: /app/backend/data }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5 # default 1s is too tight — the single worker can't answer /health mid-stream
            failureThreshold: 30 # first start downloads an embedding model
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 180
            periodSeconds: 30
            # OWUI is a SINGLE replica / single uvicorn worker: while it streams several concurrent chats its
            # event loop can briefly miss the /health probe. A concurrent-load test (2026-07-09) showed the
            # DEFAULT probe (timeoutSeconds 1, failureThreshold 3) killing OWUI mid-chat — kubelet SIGKILL,
            # exit 137, Reason=Error (NOT an OOM: memory held ~0.7/2Gi) — which orphaned every in-flight
            # stream and failed all active sessions. Give the busy loop slack: 5s per check, and ~3min
            # (6×30s) of SUSTAINED failure before a restart. Real fix for the serialization is multi-replica
            # OWUI on Postgres (off SQLite-on-NFS) — tracked separately.
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ai
  labels:
    app.kubernetes.io/name: open-webui
spec:
  type: ClusterIP
  # Co-locate each source's WebSocket + HTTP on the same replica so a chat and the Socket.IO stream that
  # delivers it live on ONE pod — avoids the cross-replica Redis relay whose occasional drop hung a message
  # mid-stream (2026-07-09 rerun, msg3). Keyed on the cloudflared pod IP (best-effort: a browser whose WS and
  # POST traverse different cloudflared pods can still split — hence WEBUI_SECRET_KEY stays shared).
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP: { timeoutSeconds: 10800 }
  selector:
    app.kubernetes.io/name: open-webui
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
---
# Keep at least one OWUI pod during voluntary disruptions (node drain, rollout) now that it is HA.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: open-webui
  namespace: ai
  labels:
    app.kubernetes.io/name: open-webui
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
