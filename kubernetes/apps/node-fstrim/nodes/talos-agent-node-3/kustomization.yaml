apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# talos-agent-node-3 on ai-node3: agent node (dedicated=agent). Slot 03:30-03:42 UTC
# (the slot table: ../../kustomization.yaml).
resources:
  - ../../base
nameSuffix: -talos-agent-node-3
labels:
  - pairs:
      app.kubernetes.io/instance: talos-agent-node-3
    includeTemplates: true
patches:
  - target:
      kind: CronJob
    patch: |-
      - op: replace
        path: /spec/schedule
        value: "30 3 * * *"
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/nodeSelector/kubernetes.io~1hostname
        value: talos-agent-node-3
