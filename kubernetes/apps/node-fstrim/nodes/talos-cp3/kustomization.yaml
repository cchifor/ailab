apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# talos-cp3 on ai-node3: control plane: etcd member on this host's NVMe. Slot 02:54-03:06 UTC
# (the slot table: ../../kustomization.yaml).
resources:
  - ../../base
nameSuffix: -talos-cp3
labels:
  - pairs:
      app.kubernetes.io/instance: talos-cp3
    includeTemplates: true
patches:
  - target:
      kind: CronJob
    patch: |-
      - op: replace
        path: /spec/schedule
        value: "54 2 * * *"
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/nodeSelector/kubernetes.io~1hostname
        value: talos-cp3
