# Credential delivery for the Relay Router connection: an ESO SecretStore and one ExternalSecret in
# each consumer namespace (relay, llm-router), rendering Relay's signer keys + escrow token and the
# Router's trust mapping from OpenBao (docs/runbooks/relay-router-connection.md). Owner approval for
# the connection: cchifor/relay#277, 2026-11-14.
#
# DEDICATED Kustomization, wait:false, the relay-budget-credentials reasoning: the ExternalSecrets stay
# not-Ready until the operator writes the OpenBao documents, and a not-Ready object must never gate a
# layer. No decryption: nothing in this tree is a secret.
#
# Nothing CONSUMES these Secrets yet. The Relay and Router wiring are the components
# kubernetes/components/relay-router-connection and llm-router-relay-keys-trust, included by later
# operator PRs (scripts/tests/test_relay_router_connection.py and test_relay_v060_activation_gate.py
# hold that gate).
#
# dependsOn external-secrets so the ESO CRDs exist, and cert-manager-config so ClusterIssuer ailab-ca
# exists for the two OpenBao-CA Certificates. Namespaces relay and llm-router come from `apps`; a
# missing one is an apply error retried every retryInterval.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: relay-router-credentials
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: external-secrets
    - name: cert-manager-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/relay-router-connection/credentials
  prune: true
  wait: false
