# Operator-owned prerequisites of the Workbricks cell c1 (requests OR-4..OR-6 in the cell's
# operator-requests.md): its namespaces, quotas, PriorityClass and the TokenReview binding. Everything
# cluster-scoped the cell needs lives in this CP-unwritable repo; the cell's own charts contain no
# cluster-scoped objects, and its own Flux unit (OR-11, not yet created) may write only inside its
# namespaces.
#
# The edge pieces are separate units: workbricks-c1-gateway (GatewayClass + Envoy Gateway's cluster
# RBAC, which need the platform's Gateway API CRDs) and envoy-gateway-crds-upstream. Nothing here needs any
# CRD, so a fresh rebuild applies these prerequisites at once, whatever state the edge is in.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: workbricks-c1-operator
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/infrastructure/workbricks-c1-operator
  # prune:true for the quotas, bindings and class; the namespaces opt out
  # (kustomize.toolkit.fluxcd.io/prune: disabled), see namespaces.yaml.
  prune: true
  wait: true
