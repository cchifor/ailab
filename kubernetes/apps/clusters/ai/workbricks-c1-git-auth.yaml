# Decrypts + applies the read-only SSH deploy key Secret (workbricks-c1-deploy-key in flux-system)
# that the `workbricks-c1` GitRepository uses to clone the PRIVATE cchifor/workbricks repo over
# in-cluster Gitea SSH. Same shape as platform-git-auth.yaml / cloudlab-git-auth.yaml.
# The key is a Gitea DEPLOY key on cchifor/workbricks, read-only (id 72, registered 2026-10-22,
# title "ailab-flux-workbricks-c1 (read-only)", SHA256:vVx9amr3Oqg0i+x+emIhrieOhahlycjHXuiLWwCs1N8);
# rotating it = a new deploy key there + re-encrypt the Secret here + delete the old key there.
# No explicit dependsOn: the GitRepository retries each interval and clones once the Secret exists.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: workbricks-c1-git-auth
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/workbricks-c1-bootstrap
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
