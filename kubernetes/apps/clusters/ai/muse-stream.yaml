apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: muse-stream
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@gitea-ssh.gitea.svc.cluster.local:2222/cchifor/muse-stream.git
  ref: { branch: main }
  secretRef: { name: muse-stream-deploy-key }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: muse-stream
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 10m
  sourceRef: { kind: GitRepository, name: muse-stream }
  path: ./deploy/kubernetes/overlays/ailab
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef: { name: sops-age }
