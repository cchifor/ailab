apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trueswarm-admin-observer
  namespace: flux-system
rules:
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - gitrepositories
  resourceNames:
  - trueswarm-admin
  verbs:
  - get
- apiGroups:
  - kustomize.toolkit.fluxcd.io
  resources:
  - kustomizations
  resourceNames:
  - trueswarm-admin-foundation
  - trueswarm-admin-git-auth
  - trueswarm-admin
  - trueswarm-admin-executor-auth
  - trueswarm-admin-security
  - trueswarm-admin-migration
  - trueswarm-admin-qualification
  - trueswarm-admin-live-checks
  - trueswarm-platform-migration
  - trueswarm-platform-owner-rotation
  verbs:
  - get
- apiGroups:
  - batch
  resources:
  - jobs
  resourceNames:
  - trueswarm-admin-git-bootstrap
  - trueswarm-admin-executor-bootstrap
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trueswarm-admin-observer
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trueswarm-admin-observer
subjects:
- kind: ServiceAccount
  name: platform-dw4
  namespace: platform-access
