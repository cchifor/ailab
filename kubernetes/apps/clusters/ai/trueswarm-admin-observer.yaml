# Project-scoped observer grant (ADR 0028, amendment 2026-09-29): read-only Flux status for the
# Trueswarm deployment, for the dev-worker slot(s) whose agent works on it. `get` by resourceNames
# only: no list/watch (resourceNames cannot restrict list), no Secrets, no other Flux object. The
# in-namespace half of this grant (trueswarm, trueswarm-admin, trueswarm-recovery and the VAP
# ClusterRoleBinding) lives in the cchifor/trueswarm-admin repo's deploy/*/observer.yaml and must
# name the SAME slots. Runbook: docs/runbooks/dev-worker-platform-access.md (Project-scoped grants).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trueswarm-admin-observer
  namespace: flux-system
rules:
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - gitrepositories
  resourceNames:
  - trueswarm-admin
  verbs:
  - get
- apiGroups:
  - kustomize.toolkit.fluxcd.io
  resources:
  - kustomizations
  resourceNames:
  - trueswarm-admin-foundation
  - trueswarm-admin-git-auth
  - trueswarm-admin
  - trueswarm-admin-executor-auth
  - trueswarm-admin-security
  - trueswarm-admin-migration
  - trueswarm-admin-qualification
  - trueswarm-admin-live-checks
  - trueswarm-admin-monitoring
  - trueswarm-platform-migration
  - trueswarm-platform-owner-rotation
  verbs:
  - get
- apiGroups:
  - batch
  resources:
  - jobs
  resourceNames:
  - trueswarm-admin-git-bootstrap
  - trueswarm-admin-executor-bootstrap
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trueswarm-admin-observer
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trueswarm-admin-observer
subjects:
- kind: ServiceAccount
  name: platform-dw4
  namespace: platform-access
- kind: ServiceAccount
  name: platform-dw2
  namespace: platform-access
