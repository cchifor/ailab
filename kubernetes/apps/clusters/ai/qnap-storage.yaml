apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qnap-storage
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  # Applies the QNAP backend + StorageClass only after `infrastructure` (the qnap-trident
  # HelmRelease) is ready, so the trident.qnap.io CRD exists before the TridentBackendConfig.
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/qnap-storage
  prune: true
  wait: true
  # StorageClass is immutable except for allowVolumeExpansion, so an edit to storageclass.yaml
  # (e.g. adding mountOptions) fails a plain server-side apply forever. force lets Flux delete and
  # recreate it. Safe for this path: deleting a StorageClass does not touch already-bound PVs or
  # PVCs, and reclaimPolicy here is Retain — the only exposure is that a NEW PVC naming the class
  # during the brief recreate window would stay Pending until it reappears.
  force: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
