# Decrypts + applies the read-only SSH deploy key Secret (workbricks-deploy-key in
# flux-system) that the stable `workbricks` GitRepository uses to clone the PRIVATE
# cchifor/workbricks repo over SSH. The Secret lives in a dedicated path
# (kubernetes/apps/workbricks-bootstrap) OUTSIDE clusters/ai, because the
# bootstrap-generated flux-system Kustomization that sweeps clusters/ai has no
# decryption and would otherwise apply the ciphertext verbatim.
#
# The encrypted Secret must contain a `known_hosts` entry for git.chifor.me.
# No explicit dependsOn: the `workbricks` GitRepository simply retries each interval
# and starts cloning successfully once this Kustomization has applied the Secret.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: workbricks-git-auth
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/workbricks-bootstrap
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
