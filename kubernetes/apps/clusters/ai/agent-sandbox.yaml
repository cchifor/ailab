apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-sandbox
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Own path/Kustomization (estate pattern — no shared-aggregator edits). Vendors the pinned
  # kubernetes-sigs/agent-sandbox v1.0.0 release (CRDs + controller); first hand-applied during
  # the test-env-pool spike 2 (2026-09-01), adopted here via SSA. The testpool tree depends on
  # these CRDs.
  path: ./kubernetes/apps/infrastructure/agent-sandbox
  prune: true
  wait: true
