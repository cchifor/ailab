# This manifest was generated by flux. DO NOT EDIT.
#
# ...except deliberately, which has now happened twice. It was repointed to the in-cluster Gitea for
# the ADR 0017 forge cutover, and repointed again here to the GitHub push-mirror (W5 of the USB
# failure-domain plan).
#
# WHY FLUX READS FROM GITHUB AND NOT FROM THE FORGE IT SERVES.
# On 2026-09-08 a USB stall on the QNAP took Gitea down for ~4.5 h. While it was down, Flux's ONLY
# source of truth was inside the thing that had failed: the cluster could not reconcile the change
# that would repair the forge, because fetching that change required the forge. That is a bootstrap
# loop, and no amount of alerting fixes it.
#
# GitHub already carries a byte-identical push-mirror of this repository (ADR 0017), and it is
# outside the failure domain entirely — different host, different network, different power. Pointing
# the cluster's own bootstrap source at it means a dead forge is an inconvenience rather than an
# outage that cannot be repaired from inside.
#
# APPLICATION repositories stay on Gitea. This is only the cluster's bootstrap source.
#
# NO secretRef, ON PURPOSE. cchifor/ailab is public on GitHub, so this needs no credential — and a
# source with no credential CANNOT be used to write. The plan asks for read-only GitHub credentials;
# having none at all is the strongest form of that. It also matches how `qnap-csi` already fetches
# https://github.com/qnap-dev/QNAP-CSI-PlugIn: unauthenticated, and Ready. (The former
# `flux-gitea-auth` secret is left in place for the rollback below.)
#
# GITEA REMAINS THE SOLE WRITER. Nothing pushes to GitHub except Gitea's mirror, whose lag is
# ~4 seconds (measured: merge at 12:42:41Z, mirrored 12:42:45Z). During a real recovery, where
# someone might commit straight to GitHub, PAUSE OR REVOKE the mirror FIRST — otherwise the next
# mirror push overwrites the recovery commit — then bring Gitea onto the repaired history before
# re-enabling it.
#
# PRUNE HAZARD. The flux-system Kustomization prunes, so a mirror lagging far behind Gitea could
# delete resources that only exist in newer commits. Confirm GitHub's HEAD matches Gitea's before
# and after changing this. At the time of the switch both were e004c90b.
#
# ROLLBACK: patch the live GitRepository back to
#   url: http://gitea-http.gitea.svc.cluster.local:3000/cchifor/ailab.git
#   secretRef: { name: flux-gitea-auth }
# and revert this file, in that order — a live patch alone is reverted by the next reconcile.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  url: https://github.com/cchifor/ailab.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/apps/clusters/ai
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
