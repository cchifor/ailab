# Per-tenant reconciler for the CP-written cchifor/agentforge-tenants repo. This definition lives in
# the CP-UNWRITABLE cchifor/ailab repo — so even a fully compromised CP cannot redirect the
# reconciler (change sourceRef), broaden its identity (serviceAccountName), or turn off the admission
# gate. Two hard limits on this path:
#   1. serviceAccountName -> a DEDICATED minimal-RBAC SA (agentforge-tenants-reconciler, flux-system),
#      NOT cluster-admin: it can create only the enumerated namespaced GVKs a tenant workspace needs
#      (see kubernetes/apps/agentforge-tenants-bootstrap/reconciler-rbac.yaml) — no ClusterRole/-Binding.
#   2. a ValidatingAdmissionPolicy (kubernetes/apps/apps/agentforge/admission/) rejects anything this
#      SA applies that is outside the tenant GVK/field allowlist (no cluster RBAC, no wildcard verbs,
#      no privileged pods outside sandbox ns, no Flux source/SA objects).
# wait:false so tenant churn/breakage can NEVER wedge the apps layer; prune:true so a removed
# workspace dir GCs its objects; decryption:sops for per-workspace SOPS tokens (P1 static bearer).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentforge-tenants
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: apps # the agentforge CP (ns + Deployment) exists before its tenants reconcile
  sourceRef:
    kind: GitRepository
    name: agentforge-tenants
  path: ./tenants
  prune: true
  wait: false
  serviceAccountName: agentforge-tenants-reconciler
  # Add the OpenBao CA reference the CP renderer does not emit (agentforge-platform#80). A NAMESPACED
  # SecretStore resolves caProvider IN ITS OWN namespace, and OpenBao serves a cert from the private
  # ailab-ca ClusterIssuer, so without this ESO cannot complete TLS and the tenant's credential Secret
  # never syncs. The CA Secret itself (openbao-tls) stays operator-provided per tenant ns via a
  # cert-manager Certificate — this only adds the reference to it.
  #
  # Patching here rather than overriding the object in a second Kustomization is the POINT. Two
  # Kustomizations declaring the same SecretStore is what caused the 2026-08-02 incident: Flux SSA
  # shares the `kustomize-controller` field manager and does NOT skip an object owned by another
  # Kustomization, so the render stripped caProvider on its 5m interval while the operator copy
  # restored it on its 10m one — observed live, with ESO going SecretSyncedError in between. A patch
  # makes the RENDER itself complete, leaving exactly one writer.
  #
  # Targets every tenant SecretStore, not just platform-dev: every CP-provisioned workspace needs the
  # CA for the same reason. Remove this patch once agentforge-platform#80 ships and the renderer emits
  # caProvider itself — until then `op: add` also overwrites it harmlessly if the renderer starts to.
  patches:
    - target:
        group: external-secrets.io
        kind: SecretStore
      patch: |
        - op: add
          path: /spec/provider/vault/caProvider
          value:
            type: Secret
            name: openbao-tls
            key: ca.crt
  decryption:
    provider: sops
    secretRef:
      name: sops-age
