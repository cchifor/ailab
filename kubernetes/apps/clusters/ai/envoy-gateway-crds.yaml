# Envoy Gateway's own CRDs (gateway.envoyproxy.io, 8 kinds, all v1alpha1), for the Workbricks cell's
# Envoy Gateway controller (Workbricks OR-7). CRDs are cluster-scoped, so the operator installs them
# and the cell's chart runs with crds.enabled=false.
#
# FROM UPSTREAM'S TAGGED SOURCE, NOT A HELM RELEASE. The CRDs-only chart (gateway-crds-helm) cannot
# be a HelmRelease here: Helm stores the chart AND the rendered manifest in one release Secret, and
# with about 2.5 MB of CRDs that Secret exceeds the 1 MiB object limit ("data: Too long", measured
# 2026-10-21; nothing was applied). Vendoring the YAML would put 2.5 MB in a diff no reviewer reads.
# So this pulls the plain generated files at the release tag, sparse-checked-out to the one
# directory (artifact ~330 KB), and server-side-applies them (no last-applied annotation, so the
# 1.4 MB envoyproxies CRD is fine). The directory holds ONLY the Envoy Gateway kinds: the Gateway API
# CRDs (gatewayapi-crds.yaml, one level up) belong to the platform's Traefik and are not in it.
# Content checked 2026-10-21: the 8 files at v1.9.2 (commit f9f92a11) are semantically identical to
# the release asset envoy-gateway-crds.yaml.
#
# VERSION = the cell's controller minor. Envoy Gateway supports a minor for 6 months (v1.9: until
# 2027-02-14); bump this tag and the cell's controller together. Pinned by TAG, never by commit: a
# ref.commit makes source-controller do a full clone, and a 287 MB one once crash-looped it and
# stalled every Flux unit for 45 minutes.
#
# PRUNE IS DISABLED ON THE CRDs (patch below): deleting this unit, or a CRD vanishing from a future
# tag, must not delete a CRD, which would cascade-delete every EnvoyProxy and policy object in the
# cell. Removing one is an explicit `kubectl delete crd`. A strategic-merge patch, so a future CRD
# without an annotations map still gets it.
#
# TRUST BOUNDARY: this applies whatever upstream's directory holds at a tag, and a tag can be moved.
# So the unit does NOT run as kustomize-controller's own (cluster-admin) identity: it impersonates
# envoy-gateway-crds-applier, which may only get/list/watch/create/patch/update
# CustomResourceDefinitions. Anything else a re-pointed tag or a compromised upstream added
# (Deployments, RBAC, webhooks) fails closed with Forbidden (measured 2026-10-21 with a probe of this
# exact ClusterRole: the 8 CRDs applied, a Deployment and a ClusterRoleBinding were refused). The
# expected revision is v1.9.2@sha1:f9f92a112a4033abed5c8d43a5f7e37da257403c; Flux records the
# resolved one in the GitRepository's status.artifact.revision. Residual: a moved tag can still
# change the CRDs themselves (schema, conversion settings).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/envoyproxy/gateway
  ref:
    tag: v1.9.2
  sparseCheckout:
    - charts/gateway-helm/charts/crds/crds/generated
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: envoy-gateway-crds-applier
  namespace: flux-system
automountServiceAccountToken: false # only kustomize-controller impersonates it, via TokenRequest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: envoy-gateway-crds-applier
rules:
  # No delete: the CRDs are prune-disabled, so the unit never needs it.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: envoy-gateway-crds-applier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: envoy-gateway-crds-applier
subjects:
  - kind: ServiceAccount
    name: envoy-gateway-crds-applier
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  # NOT the old name `envoy-gateway-crds`: that unit's inventory holds the failed HelmRelease, and
  # this unit's CRD-only identity could not prune it. Removing the old Kustomization from git lets
  # Flux delete it, and its own garbage collection (no impersonation) removes the HelmRelease.
  name: envoy-gateway-crds-upstream
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: envoy-gateway
  path: ./charts/gateway-helm/charts/crds/crds/generated
  prune: true
  wait: true
  serviceAccountName: envoy-gateway-crds-applier
  patches:
    - target:
        kind: CustomResourceDefinition
      patch: |
        apiVersion: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        metadata:
          name: any # replaced by each target's name
          annotations:
            kustomize.toolkit.fluxcd.io/prune: disabled
