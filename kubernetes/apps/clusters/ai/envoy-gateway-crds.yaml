# Envoy Gateway's own CRDs (gateway.envoyproxy.io, 8 kinds, all v1alpha1), for the Workbricks cell's
# Envoy Gateway controller (Workbricks OR-7). CRDs are cluster-scoped, so the operator installs them
# and the cell's chart runs with crds.enabled=false.
#
# FROM UPSTREAM'S TAGGED SOURCE, NOT A HELM RELEASE. The CRDs-only chart (gateway-crds-helm) cannot
# be a HelmRelease here: Helm stores the chart AND the rendered manifest in one release Secret, and
# with about 2.5 MB of CRDs that Secret exceeds the 1 MiB object limit ("data: Too long", measured
# 2026-10-21; nothing was applied). Vendoring the YAML would put 2.5 MB in a diff no reviewer reads.
# So this pulls the plain generated files at the release tag, sparse-checked-out to the one
# directory (artifact ~330 KB), and server-side-applies them (no last-applied annotation, so the
# 1.4 MB envoyproxies CRD is fine). The directory holds ONLY the Envoy Gateway kinds: the Gateway API
# CRDs (gatewayapi-crds.yaml, one level up) belong to the platform's Traefik and are not in it.
# Content checked 2026-10-21: the 8 files at v1.9.2 (commit f9f92a11) are semantically identical to
# the release asset envoy-gateway-crds.yaml.
#
# VERSION = the cell's controller minor. Envoy Gateway supports a minor for 6 months (v1.9: until
# 2027-02-14); bump this tag and the cell's controller together. Pinned by TAG, never by commit: a
# ref.commit makes source-controller do a full clone, and a 287 MB one once crash-looped it and
# stalled every Flux unit for 45 minutes.
#
# PRUNE IS DISABLED ON THE CRDs (patch below): deleting this unit, or a CRD vanishing from a future
# tag, must not delete a CRD, which would cascade-delete every EnvoyProxy and policy object in the
# cell. Removing one is an explicit `kubectl delete crd`.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/envoyproxy/gateway
  ref:
    tag: v1.9.2
  sparseCheckout:
    - charts/gateway-helm/charts/crds/crds/generated
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-crds
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: envoy-gateway
  path: ./charts/gateway-helm/charts/crds/crds/generated
  prune: true
  wait: true
  patches:
    - target:
        kind: CustomResourceDefinition
      patch: |
        - op: add
          path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
          value: disabled
