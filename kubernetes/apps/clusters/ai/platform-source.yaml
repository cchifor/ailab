# Strive platform repo — source for the platform deployment.
# The platform's deploy/ tree (Flux components + gitops DAG + Helm umbrella) is
# reconciled from here by the platform Kustomization (platform.yaml).
#
# cchifor/platform is PRIVATE, so this clones over SSH with a read-only deploy
# key. The key Secret (platform-deploy-key, flux-system) is SOPS-encrypted under
# kubernetes/apps/platform-bootstrap and applied by the platform-git-auth
# Kustomization. Pin ref.branch to a tag/sha for immutable deploys once stabilized.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 10m
  ref:
    branch: main
  secretRef:
    name: platform-deploy-key
  url: ssh://git@github.com/cchifor/platform
  # Ship only what the cluster consumes (2026-10-06, cp1 etcd fsync). The whole repo is a 49 MB
  # artifact / 144 MB unpacked, and kustomize-controller unpacks it into its /tmp emptyDir for EACH
  # of the 17 Kustomizations on this source every 10m — ~2.4 GB of writes per 10m on the node-local
  # disk of whichever CP hosts Flux (talos-cp1), the same disk as etcd's WAL. Those bursts (10-17 MB/s
  # from kustomize-controller) lined up with cp1's WAL fsync spikes. Kept: deploy/ (every Kustomization
  # path and both HelmRelease charts, ./deploy/helm and ./deploy/components/hatchet/chart, whose
  # _helpers.tpl symlinks stay inside deploy/) and tests/load/ (deploy/components/load's
  # configMapGenerator reads ../../../tests/load/*). Verified before merge: all 17 Kustomization
  # paths build byte-identical, and both charts render identically, from a deploy/+tests/load/ tree
  # vs the full tree; the artifact drops to ~0.6 MB / 2 MB unpacked. A new Kustomization or chart
  # that reads OUTSIDE these paths must be added here (gitignore syntax: re-include a nested dir by
  # re-including its parent, then excluding the parent's other children).
  # spec.ignore REPLACES source-controller's default exclusion list, so its non-VCS defaults are
  # restated last (later rules win): a binary later committed under deploy/ stays out of the artifact.
  # None match under deploy/ or tests/load/ today, so this changes nothing in the current artifact.
  ignore: |
    /*
    !/deploy/
    !/tests/
    /tests/*
    !/tests/load/
    *.jpg
    *.jpeg
    *.gif
    *.png
    *.wmv
    *.flv
    *.tar.gz
    *.zip
    **/.goreleaser.yml
    **/.sops.yaml
    **/.flux.yaml
