apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: trueswarm-admin
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@gitea-ssh.gitea.svc.cluster.local:2222/cchifor/trueswarm-admin.git
  ref:
    branch: main
  secretRef:
    name: trueswarm-admin-deploy-key
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trueswarm-admin-git-auth
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 15s
  timeout: 15m
  path: ./kubernetes/apps/trueswarm-admin-bootstrap
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn: []
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trueswarm-admin-foundation
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 15s
  timeout: 5m
  path: ./deploy/foundation
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: trueswarm-admin
  dependsOn:
  - name: trueswarm-admin-git-auth
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
  - apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    name: trueswarm-admin-pg
    namespace: trueswarm-admin
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trueswarm-admin-executor-auth
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 15s
  timeout: 15m
  path: ./kubernetes/apps/trueswarm-admin-executor-bootstrap
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
  - name: trueswarm-admin-foundation
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trueswarm-admin-security
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 15s
  timeout: 5m
  path: ./deploy/security
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: trueswarm-admin
  dependsOn:
  - name: trueswarm-admin-git-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trueswarm-admin-migration
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 15s
  timeout: 5m
  path: ./deploy/ailab-migration
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: trueswarm-admin
  dependsOn:
  - name: trueswarm-admin-foundation
  - name: trueswarm-admin-security
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trueswarm-admin
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 15s
  timeout: 10m
  path: ./deploy/ailab
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: trueswarm-admin
  dependsOn:
  - name: trueswarm-admin-migration
  - name: trueswarm-admin-executor-auth
  - name: trueswarm-admin-security
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
