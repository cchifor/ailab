# Credential delivery for the independent Relay worker budget ledger: an ESO SecretStore and one
# ExternalSecret in each consumer namespace (relay, llm-router), rendering the DSN, the public CA
# and the external recovery witness from OpenBao (docs/runbooks/relay-worker-budget-authority.md).
#
# DEDICATED Kustomization, wait:false, the strive-pg-harness reasoning: the ExternalSecrets stay
# not-Ready until the operator writes the OpenBao documents during the ceremony (runbook steps 5-6),
# and a not-Ready object must never gate a layer. No decryption: nothing in this tree is a secret.
#
# Nothing CONSUMES these Secrets yet. The Relay and Router wiring are the components
# kubernetes/components/relay-worker-budget-client and llm-router-worker-budget-reader, included by
# a later operator PR once the documents exist (scripts/tests/test_relay_budget_authority_activation.py
# holds that gate).
#
# dependsOn external-secrets so the ESO CRDs exist. Namespaces relay and llm-router come from `apps`;
# a missing one is an apply error retried every retryInterval, not a reason to freeze this tree
# behind that whole layer (the platform-access reasoning).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: relay-budget-credentials
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/relay-budget-authority/credentials
  prune: true
  wait: false
