apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: trueswarm
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@gitea-ssh.gitea.svc.cluster.local:2222/cchifor/trueswarm.git
  ref:
    branch: main
  secretRef:
    name: trueswarm-deploy-key
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trueswarm
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: trueswarm
  dependsOn:
  - name: trueswarm-git-auth
  path: ./deploy/kubernetes/overlays/ailab
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
