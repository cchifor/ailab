apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentforge-tenant-platform-dev
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  # OPERATOR-owned tenant-ns halves for the CP-created tenant-zero/platform-dev v1.1 subscription
  # workspace (the ESO credential path + the openbao-tls CA). Its OWN path/Kustomization (mirrors
  # agentforge-workers) so it can't collide with the apps layer, the agentforge-sandbox tree, or the
  # CP-owned `agentforge-tenants` Kustomization that renders platform-dev's ns/orchestrator/Deployment.
  # dependsOn:
  #   * external-secrets — installs the external-secrets.io/v1 CRDs (SecretStore/ExternalSecret).
  #   * infrastructure   — cert-manager (the openbao-ca Certificate) + Cilium CRDs.
  #   * agentforge-sandbox — provides the static NFS PVs (platform-dev-staging-pv.yaml /
  #     platform-dev-workspace-pvc.yaml); ordering only.
  #
  # ⚠ `agentforge-tenants` was REMOVED from dependsOn on 2026-08-02, and the reasoning that put it
  # here was wrong. The old comment claimed that because agentforge-tenants is `wait: false` it
  # "reports Ready immediately … can never health-gate/wedge this tree". `wait: false` only skips the
  # HEALTH check of applied workloads — a Kustomization whose APPLY fails still reports
  # Ready=False ReconciliationFailed, and Flux gates every dependent on that. That turned a
  # sequencing hint into a hard circular deadlock: a bad object in the tenant render wedges
  # agentforge-tenants, which blocks THIS tree, which is the only thing that can prune the operator
  # object causing the wedge. Observed live on 2026-08-02 with the dual-declared staging PVC.
  # An operator tree whose whole job is to correct/patch the render must never depend on the render.
  # Cost of removal: on a cold bootstrap this tree's objects fail to apply until the CP creates the
  # tenant namespace, surfacing as transient Ready=False retry churn. That is acceptable because
  # NOTHING dependsOn this Kustomization — not because wait:false hides it. wait:false only skips the
  # health check of applied workloads; it does not make a failed apply look Ready.
  dependsOn:
    - name: infrastructure
    - name: external-secrets
    - name: agentforge-sandbox
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/infrastructure/agentforge-tenant-platform-dev
  prune: true
  # wait:false so the ExternalSecret staying NotReady can never wedge this or any dependent Flux
  # Kustomization; the SA/SecretStore/Certificate still apply immediately. NOTE this only covers
  # HEALTH — an apply/dry-run failure here would still surface as Ready=False (see the dependsOn note).
  wait: false
  # decryption (SOPS) retained for symmetry with the sibling operator trees — currently no SOPS Secret
  # here (creds are ESO-synced from OpenBao, not SOPS).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
