# AI-LXC model catalog — the human source of truth for which node serves which model(s) and whether a
# model is PINNED (always resident) or MANAGED (idle-unloaded on demand via llama-swap).
#
# This file is documentation + a deploy checklist, NOT auto-applied: the appliance is provisioned by
# `scripts/lxc-exec.py <host> <ctid> --env ... bash provision.sh`. Each entry maps to a provision command
# in docs/runbooks/ai-model-swap.md. Keep the max_input_tokens in kubernetes/apps/apps/ai/litellm.yaml in
# sync with `ctx`.
#
# Topology (2026-08-14):
#   node2 ONLY    : qwen3.6-35b-a3b, and MANAGED (llama-swap, ttl 1800) since 2026-09-07 -- see below.
#                   The old "PINNED on BOTH node1+node2 -> LiteLLM load-balances .44+.45" topology is
#                   GONE twice over: node1's copy was disabled 2026-08-15 (its llama-server.service no
#                   longer exists at all), and .44 was removed from the `llm` Endpoints on 2026-09-07.
#   node1 :8082   : qwen3.8-27b ON-DEMAND via its own llama-swap instance (the dense quality tier),
#                   in the slot gemma-4 used to hold. Runs its own llama.cpp build (b10430) alongside
#                   the daily driver's b9672 in the same CT. NOT pinned — it costs 31.4 GiB of host
#                   RAM once loaded (post carve->GTT), which node1 cannot hold permanently. See the
#                   per-instance build + memory notes on that entry.
#   node3         : no managed model in this file. llama-swap served ONLY qwen3.5-122b on demand
#                   until 2026-09-08, when it moved to the cloudlab estate (cloud3) where it is
#                   fully VRAM-resident; gpt-oss-120b had been RETIRED on 2026-07-08.
#                   NOTHING ROUTES here any more: the four gates in llm-service.yaml passed on
#                   2026-09-08 and the retained llm-qwen35 Service was deleted. Removing this entry
#                   does NOT by itself stop the running unit — it is intent, read only when
#                   provision.sh is deliberately re-run — so node3's llama-swap is still serving
#                   .46:8080 as of this commit and is stopped as a manual step alongside the merge.
#                   Reclaim status of /models-local (the copies of record stay on the QNAP at
#                   /models/, so both are re-stageable):
#                     * gpt-oss-120b, 60 GiB  — DELETED 2026-09-08, after verifying all three
#                       shards byte-for-byte against NFS. Took the volume from 88% to 49% full.
#                     * qwen3.5-122b, 72 GiB  — STILL STAGED. Goes with the manual unit stop.
# This replaced the earlier "gpt-oss pinned on node2" layout, which over-subscribed node2 (59 GiB model
# + 2 runners + 2 dev-workers -> OOM). qwen3.6 (~24 GiB) frees ~35 GiB on node2 for its runners/workers.
#
# Why node3 is SINGLE-MODEL (2026-07-08): qwen3.5-122b (~71 GiB) and gpt-oss-120b (~59 GiB) cannot
# co-reside in node3's 96 GiB iGPU LXC, so llama-swap could hold only one at a time. With interactive
# traffic hitting qwen3.5-122b and the deepagent platform hitting gpt-oss, the two demand streams
# interleaved and forced a full evict+cold-reload on nearly every crossover (measured ~55-82s PER
# request, 4/4). Serving a single heavyweight ends the thrash. gpt-oss's LiteLLM model_name is shimmed
# to the pinned qwen3.6 (kubernetes/apps/apps/ai/litellm.yaml) so callers still work. To bring gpt-oss
# back you must give up qwen3.5-122b (they cannot share node3) — do NOT re-add it here as a 2nd model.
#
# ttl semantics (llama-swap): 0 = pinned (load once, never idle-unload); >0 = idle seconds before unload
# (returning GTT to the host). swap:false => direct llama-server.service (no llama-swap). Managed models
# are STAGED on local NVMe (/models-local — an out-of-band `pct set` mount) so cold reload is ~2-4 GB/s
# (~30-60s) vs ~300 MB/s over NFS; `gguf` = local copy, `stage_from` = NFS source (provision.sh rsyncs it).

models:
  # ---- Daily driver: PINNED on node1 AND node2 (coding + image/video vision; the always-warm chat path) ----
  qwen3.6-35b-a3b:
    nodes: [ai-node2]             # ctid 5002/.45 (local NVMe). node1/ctid 5001 dropped 2026-08-15.
    alias: qwen3.6-35b-a3b
    gguf: /models/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf         # node1 serves from NFS
    gguf_node2: /models-local/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf  # node2 serves from local NVMe
    stage_from: /models/qwen3.6-35b-a3b   # node2 stages the GGUF + mmproj to /models-local once
    mmproj: /models/qwen3.6-35b-a3b/mmproj-F16.gguf   # node1 (NFS); node2 uses /models-local/.../mmproj-F16.gguf
    ctx: 262144
    parallel: 2               # 2 concurrent slots/node (per-slot n_ctx = ctx/parallel = 131072) for interactive
                              # concurrency; keep litellm max_input_tokens (114688 = 131072 - 16K headroom) in sync
    cache_type: q8_0          # K + V
    swap: true                # MANAGED via llama-swap since 2026-09-07 (was: pinned llama-server)
    ttl: 1800                 # idle-unload after 30 min, matching node1's qwen3.8 and node3's 122b
    # WHY THIS STOPPED BEING PINNED (2026-09-07). Measured GTT per node while dev-workers were thrashing:
    #     ai-node1  17 MiB     (llama-swap, idle-unloaded)
    #     ai-node2  24766 MiB  (this model, pinned, always resident)
    #     ai-node3  17 MiB     (llama-swap, idle-unloaded)
    # node2 was the ONLY node holding a model resident and the ONLY node whose dev-workers were
    # floor-pinned: 118/124 GiB used, above PVE's 80% auto-balloon threshold, so dw2 and dw5 could
    # never inflate. dw5 had swapped 140 GB with 39.6M major faults. The 24.2 GiB held here was the
    # difference. Meanwhile the model was IDLE -- its only remaining consumer is litellm-local (the
    # agentforge workers; the main proxy retired qwen3.6 in #524/#525) and llama-server logged
    # "all slots are idle" with ~no requests in 24h. Pinning 24 GiB for an idle model is what the
    # runbook's own time-share rule forbids: a node serves EITHER its heavyweight OR its two workers.
    # Cost accepted: the first request after an idle period pays a cold load from local NVMe
    # (~30-60s; that is why this model is staged to /models-local rather than served over NFS).
    # KEEP parallel: 2 -- litellm max_input_tokens 114688 is derived from ctx/parallel, so changing
    # one without the other silently breaks context limits.
    # Sampling + reasoning flags are provision.sh DEFAULTS (not per-model here), applied to both nodes on
    # re-provision (2026-07-10 web research): Qwen3.6-35B-A3B "general thinking" profile — temp 1.0, top-p
    # 0.95, top-k 20, min-p 0, presence-penalty 1.5, repeat-penalty 1.0 (llama.cpp generic defaults temp
    # 0.8/top-k 40/min-p 0.05 hurt Qwen3 quality; top-k/min-p/repeat can't be forwarded by OWUI/LiteLLM so
    # they MUST be server-side). Plus --reasoning-format deepseek (split <think> -> reasoning_content for
    # OWUI's Thinking panel) and --flash-attn on (pinned; q8_0 KV needs it). For a coding/precise instance
    # pass TEMP=0.6 PRESENCE_PENALTY=0.0. Both nodes provisioned with REASONING_BUDGET=3000 — a GENEROUS
    # runaway-thinking backstop (forces answer after 3000 reasoning tokens). NOTE: the sampling fix above is
    # what actually TAMED the over-reasoning (a trivial prompt that pre-fix wrote ~6000 think-tokens/110s now
    # writes ~250; even a 5-part hard prompt stays ~1930, well under 3000) — the budget rarely triggers and
    # exists only to bound a future pathological loop. Raise/clear REASONING_BUDGET if a hard task gets clipped.

  # ---- Quality tier: ON-DEMAND (llama-swap) as a SECOND instance on node1 :8082 (ctid 5001 / .44) ----
  # UN-RETIRED 2026-09-12, at a FULL WINDOW, and renamed `qwen3.8-27b-ailab`.
  #
  # IT WAS NEVER ACTUALLY GONE. The 2026-08-25 retirement (commit 1acd59cc) removed the k8s/LiteLLM
  # routing and said the unit and config dir "are removed on the host by the retire step". They were
  # not: `llama-swap-qwen38.service` has been active and listening on 0.0.0.0:8082 continuously since
  # 2026-08-18, idle-unloaded by its own ttl. Only the routing was gone, so the memory it was retired
  # to release was never actually released either. This entry stops the file disagreeing with the host.
  #
  # THE RETIREMENT WAS ARGUED AGAINST A NUMBER THAT WAS ALREADY STALE. 1acd59cc cites "31.4 GiB on a
  # node measured at 24.9 GiB free". That 31.4 GiB is the Q6_K @ ctx 262144 figure from 6c17046c.
  # b25953b1 had already cut the quant to UD-Q4_K_XL ten days earlier ("32115 -> 27288 MiB loaded",
  # docs/runbooks/ai-model-swap.md), and an unrecorded re-provision on 2026-08-18 had dropped ctx to
  # 65536. The real cost is ~2/3 of the number that retired it.
  #
  # SIZING, derived from GGUF metadata and checked against two measured GTT anchors (Q6_K 32,115 MiB
  # and UD-Q4_K_XL 27,288 MiB, both at ctx 262144; residuals agree within 100 MiB):
  #   16 full-attention layers (block_count 65, 1 nextn_predict layer, full_attention_interval 4)
  #   x 4 KV heads x (256 + 256) x 1.0625 B (q8_0) = 34,816 B/token
  #   fixed  = weights 16.69 + mmproj 0.86 + compute ~0.65      = 18.20 GiB
  #   ctx 131072 KV                                              =  4.25 GiB
  #                                                        total = 22.45 GiB
  # ai-node1 measured 34 GiB available right after ci-runner-8 was destroyed (was 24.99), so this
  # fits with ~11 GiB of headroom instead of the -1.67 GiB it would have had before. That runner's
  # retirement is what pays for this; see kubernetes/infra/runners/variables.tf.
  #
  # parallel: 2, NOT 1, and the reason is routing rather than throughput. `ctx` is TOTAL KV shared
  # across slots, so per-slot n_ctx = 131072/2 = 65536 and litellm max_input_tokens = 65536 - 16K
  # headroom = 49152. The second slot costs only another copy of the recurrent state (bounded by the
  # ~0.65 GiB measured residual), and it exists because LiteLLM 1.91.0 does not propagate a client
  # disconnect: on --parallel 1 an abandoned request kept decoding 7+ minutes with no client attached
  # and only a systemctl restart freed the slot (measured 2026-08-15, litellm.yaml carries the full
  # note). Two slots means one orphan cannot wedge the route. It REDUCES the odds, it does not
  # eliminate them -- two concurrent orphans still block both.
  #
  # SPEC DECODE IS CONFIGURED AND HAS NEVER RUN. The live unit has carried
  # `--spec-type draft-mtp --spec-draft-n-max 2 --spec-draft-type-k/-v q8_0` since 2026-08-18 and the
  # journal shows not one model load since -- 158,359 lines, all health polls. The checkpoint has an
  # MTP head (`qwen35.nextn_predict_layers` in the GGUF header) and build b10456 accepts the flag, so
  # it should work; upstream measures ~1.81x on a 27B dense Q4 on this exact silicon. It is carried
  # through here via EXTRA_ARGS because provision.sh has no SPEC_* knob. UNMEASURED on this estate:
  # the 11.49 tok/s figure in the runbook predates these flags and describes a different config.
  # Benchmark it before quoting a number.
  qwen3.8-27b:
    nodes: [ai-node1]             # ctid 5001 / .44, second instance on :8082
    instance: qwen38              # INSTANCE=qwen38 -> its own unit + /etc/llama-swap-qwen38/
    port: 8082                    # the daily driver's :8080 is untouched (it does not exist on node1)
    alias: qwen3.8-27b-ailab      # -ailab distinguishes this on-prem route from the -cloud ones
    build: b10456                 # per-instance build, installed alongside; supports --spec-type
    gguf: /models/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_XL.gguf   # NFS; NOT Q6_K -- see the runbook
    mmproj: /models/qwen3.8-27b/mmproj-F16.gguf             # vision; node1 DOES pass it, unlike node2
    ctx: 131072               # TOTAL KV across slots; per-slot = ctx/parallel = 65536
    parallel: 2               # keep litellm max_input_tokens (49152 = 65536 - 16K) in sync
    cache_type: q8_0          # K + V
    swap: true                # llama-swap, so it idle-unloads rather than holding 22.45 GiB
    ttl: 1800                 # idle-unload after 30 min -- REQUIRED, this node cannot hold it pinned
    # PRESENCE_PENALTY=0.0 is REQUIRED (provision.sh defaults to 1.5, Qwen3.8's INSTRUCT profile;
    # this runs in thinking mode, whose card specifies 0.0). REASONING_BUDGET=16384 matches the live
    # unit, not the runbook's stale 3000.
  # ---- node3 llama-swap SINGLE-MODEL — qwen3.5-122b on demand (ctid 5003 / .46) ----
  # Deploy via a single-MODEL provision call (SWAP=true, no MODELS_JSON) — see docs/runbooks/ai-model-swap.md.
  # qwen3.5-122b REMOVED 2026-09-08 — moved to the cloudlab estate (cloud3, llama-swap on
  # 192.168.0.26). node3's iGPU LXC could not hold it, so MoE experts spilled to host RAM and it
  # measured 16.6 tok/s; on cloud3 the 72 GiB of Q4_K_M weights fit entirely in 96 GiB of VRAM
  # across four RTX 3090s and it measures 60.6-66.2 tok/s. ~4x, from residency alone.
  #
  # ai-node3 therefore has NO managed model. The LXC (ai-llm-3, vmid 5003, .46) is kept, empty.
  # The "node3 is SINGLE-MODEL" constraint in the header above no longer binds anything: it existed
  # because qwen3.5-122b (~71 GiB) and gpt-oss-120b (~59 GiB) could not co-reside. That slot is now
  # free, so gpt-oss-120b COULD return here — a capacity decision, not a correctness one, and
  # deliberately not taken in this change.
