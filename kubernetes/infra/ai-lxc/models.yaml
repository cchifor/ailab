# AI-LXC model catalog — the human source of truth for which node serves which model(s) and whether a
# model is PINNED (always resident) or MANAGED (idle-unloaded on demand via llama-swap).
#
# This file is documentation + a deploy checklist, NOT auto-applied: the appliance is provisioned by
# `scripts/lxc-exec.py <host> <ctid> --env ... bash provision.sh`. Each entry maps to a provision command
# in docs/runbooks/ai-model-swap.md. Keep the max_input_tokens in kubernetes/apps/apps/ai/litellm.yaml in
# sync with `ctx`.
#
# Topology (2026-08-14):
#   node1 + node2 : qwen3.6-35b-a3b PINNED on BOTH (the daily driver) -> redundancy + LiteLLM
#                   load-balancing across the two `llm` Service endpoints (.44 + .45).
#   node1 :8082   : qwen3.8-27b ON-DEMAND via its own llama-swap instance (the dense quality tier),
#                   in the slot gemma-4 used to hold. Runs its own llama.cpp build (b10430) alongside
#                   the daily driver's b9672 in the same CT. NOT pinned — it costs 31.4 GiB of host
#                   RAM once loaded (post carve->GTT), which node1 cannot hold permanently. See the
#                   per-instance build + memory notes on that entry.
#   node3         : llama-swap serves ONLY qwen3.5-122b on demand (loads on first request, idle-unloads
#                   after ttl). gpt-oss-120b was RETIRED from node3 on 2026-07-08 — see below.
# This replaced the earlier "gpt-oss pinned on node2" layout, which over-subscribed node2 (59 GiB model
# + 2 runners + 2 dev-workers -> OOM). qwen3.6 (~24 GiB) frees ~35 GiB on node2 for its runners/workers.
#
# Why node3 is SINGLE-MODEL (2026-07-08): qwen3.5-122b (~71 GiB) and gpt-oss-120b (~59 GiB) cannot
# co-reside in node3's 96 GiB iGPU LXC, so llama-swap could hold only one at a time. With interactive
# traffic hitting qwen3.5-122b and the deepagent platform hitting gpt-oss, the two demand streams
# interleaved and forced a full evict+cold-reload on nearly every crossover (measured ~55-82s PER
# request, 4/4). Serving a single heavyweight ends the thrash. gpt-oss's LiteLLM model_name is shimmed
# to the pinned qwen3.6 (kubernetes/apps/apps/ai/litellm.yaml) so callers still work. To bring gpt-oss
# back you must give up qwen3.5-122b (they cannot share node3) — do NOT re-add it here as a 2nd model.
#
# ttl semantics (llama-swap): 0 = pinned (load once, never idle-unload); >0 = idle seconds before unload
# (returning GTT to the host). swap:false => direct llama-server.service (no llama-swap). Managed models
# are STAGED on local NVMe (/models-local — an out-of-band `pct set` mount) so cold reload is ~2-4 GB/s
# (~30-60s) vs ~300 MB/s over NFS; `gguf` = local copy, `stage_from` = NFS source (provision.sh rsyncs it).

models:
  # ---- Daily driver: PINNED on node1 AND node2 (coding + image/video vision; the always-warm chat path) ----
  qwen3.6-35b-a3b:
    nodes: [ai-node1, ai-node2]   # ctid 5001/.44 (NFS) + ctid 5002/.45 (local NVMe); both direct/pinned
    alias: qwen3.6-35b-a3b
    gguf: /models/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf         # node1 serves from NFS
    gguf_node2: /models-local/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf  # node2 serves from local NVMe
    stage_from: /models/qwen3.6-35b-a3b   # node2 stages the GGUF + mmproj to /models-local once
    mmproj: /models/qwen3.6-35b-a3b/mmproj-F16.gguf   # node1 (NFS); node2 uses /models-local/.../mmproj-F16.gguf
    ctx: 262144
    parallel: 2               # 2 concurrent slots/node (per-slot n_ctx = ctx/parallel = 131072) for interactive
                              # concurrency; keep litellm max_input_tokens (114688 = 131072 - 16K headroom) in sync
    cache_type: q8_0          # K + V
    swap: false               # PINNED (direct llama-server.service) on both nodes
    ttl: 0
    # Sampling + reasoning flags are provision.sh DEFAULTS (not per-model here), applied to both nodes on
    # re-provision (2026-07-10 web research): Qwen3.6-35B-A3B "general thinking" profile — temp 1.0, top-p
    # 0.95, top-k 20, min-p 0, presence-penalty 1.5, repeat-penalty 1.0 (llama.cpp generic defaults temp
    # 0.8/top-k 40/min-p 0.05 hurt Qwen3 quality; top-k/min-p/repeat can't be forwarded by OWUI/LiteLLM so
    # they MUST be server-side). Plus --reasoning-format deepseek (split <think> -> reasoning_content for
    # OWUI's Thinking panel) and --flash-attn on (pinned; q8_0 KV needs it). For a coding/precise instance
    # pass TEMP=0.6 PRESENCE_PENALTY=0.0. Both nodes provisioned with REASONING_BUDGET=3000 — a GENEROUS
    # runaway-thinking backstop (forces answer after 3000 reasoning tokens). NOTE: the sampling fix above is
    # what actually TAMED the over-reasoning (a trivial prompt that pre-fix wrote ~6000 think-tokens/110s now
    # writes ~250; even a 5-part hard prompt stays ~1930, well under 3000) — the budget rarely triggers and
    # exists only to bound a future pathological loop. Raise/clear REASONING_BUDGET if a hard task gets clipped.

  # ---- Quality tier: ON-DEMAND (llama-swap) as a SECOND instance on node1 :8082 (ctid 5001 / .44) ----
  # 27B DENSE (not MoE): every token reads all 27B params, so decode is a MEASURED 9.3 tok/s vs
  # qwen3.6's ~50 on the same iGPU (prefill ~58 tok/s). Inherent to a dense model on bandwidth-bound
  # hardware — this is the "think hard" model, not a daily driver.
  # Architecture: hybrid 16 x (3 x (Gated DeltaNet -> FFN) -> 1 x (Gated Attention -> FFN)), 64 layers.
  # Only the 16 full-attention layers carry a growing KV cache, so the 256K window is cheap.
  #
  # WHY ON-DEMAND AND NOT PINNED (measured 2026-08-14 — do not "promote" this to pinned):
  # node1 has been through the carve->GTT conversion, so its VRAM carve is only 512 MiB and model
  # weights land in GTT, which IS charged to host RAM. Loading this model moves node1's GTT
  # 24.2 -> 55.6 GiB, i.e. it costs 31.4 GiB of HOST RAM. node1 has only ~25-35 GiB available with
  # the daily driver resident (it varies with dev-worker ballooning), so pinning it drove the host to
  # 3 GiB available with swap 100% FULL — the pre-OOM state that OOM-killed cp2+cp3 and dropped etcd
  # below quorum on 2026-07-08. On-demand costs ZERO at steady state and ~12 GiB headroom while
  # loaded, and the model idle-unloads after ttl. Cold start is only ~74 s (a 22.9 GB read over NFS),
  # vs the 122B's 4-5 min, so the on-demand tax is small.
  # BUILD: needs llama.cpp b10430 — the daily driver's b9672 predates this arch. provision.sh installs
  # a build PER INSTANCE ($BIN = /opt/llama.cpp/llama-$LLAMA_BUILD), so b9672 and b10430 coexist in the
  # CT and re-provisioning this instance never touches the one qwen3.6 is serving. Likewise the
  # llama-swap unit + config dir are per-instance (llama-swap-qwen38.service,
  # /etc/llama-swap-qwen38/), so this swap instance and the pinned :8080 unit coexist in ONE container.
  qwen3.8-27b:
    node: ai-node1              # ctid 5001 / .44, port 8082 (INSTANCE=qwen38 => llama-swap-qwen38.service)
    alias: qwen3.8-27b
    llama_build: b10430         # NOT the b9672 default — this arch needs it
    port: 8082
    gguf: /models/qwen3.8-27b/Qwen3.8-27B-Q6_K.gguf   # served from NFS (node1 has no /models-local mount)
    mmproj: /models/qwen3.8-27b/mmproj-F16.gguf       # native vision-language: image + video (verified)
    ctx: 262144               # native n_ctx_train, no YaRN needed
    parallel: 1               # ONE slot at full decode speed. A 2nd slot would halve an already-slow
                              # dense decode; keep litellm max_input_tokens (245760 = 262144 - 16K
                              # reasoning/output headroom) in sync.
    cache_type: q8_0          # K + V (needs flash-attn, engaged by --flash-attn auto)
    swap: true                # MANAGED on node1's own llama-swap instance (see the memory note above)
    ttl: 1800                 # 30 min idle before unload, matching the 122B's convention
    # Sampling: Qwen3.8's card gives a DIFFERENT thinking profile than Qwen3.6 — presence_penalty 0.0,
    # not the provision.sh default of 1.5 (1.5 is Qwen3.8's INSTRUCT/non-thinking profile). Provision
    # with PRESENCE_PENALTY=0.0; temp 1.0 / top-p 0.95 / top-k 20 / min-p 0.0 / repeat 1.0 match the
    # defaults already. REASONING_BUDGET=3000 kept as the runaway-thinking backstop (estate convention).

  # ---- node3 llama-swap SINGLE-MODEL — qwen3.5-122b on demand (ctid 5003 / .46) ----
  # Deploy via a single-MODEL provision call (SWAP=true, no MODELS_JSON) — see docs/runbooks/ai-model-swap.md.
  qwen3.5-122b:
    node: ai-node3
    alias: qwen3.5-122b
    gguf: /models-local/qwen3.5-122b-a10b/Qwen3.5-122B-A10B-Q4_K_M-00001-of-00003.gguf
    stage_from: /models/qwen3.5-122b-a10b
    ctx: 32768                # a SINGLE 32K-token window (was 16384 total / 8192 per slot). The interactive
                              # "waits 45s-4min between messages" was NOT slot contention — it was Open WebUI's
                              # title/tags/follow-up task calls (re-enabled in OWUI's DB despite env, the
                              # PersistentConfig gotcha) hitting 122b after every message, filling both slots
                              # and EVICTING the prefix cache. Fixed at the source (open-webui.yaml:
                              # ENABLE_PERSISTENT_CONFIG=false + TASK_MODEL_EXTERNAL=qwen3.6). With the extra
                              # calls gone, a single deep-reasoning user needs ONE slot, so we spend the KV on a
                              # BIGGER window instead of a 2nd slot: max context + best prefix reuse across turns.
    parallel: 1               # single slot => the full 32K window serves each request (best for max context +
                              # sequential reasoning). Tradeoff: if you fire a 2nd chat while a long 122b answer
                              # is still generating it queues (rare for single-user). q8_0 KV for 32K adds only
                              # ~2 GiB GTT (weights ~70 GiB dominate); node3 host stays within its ~18 GiB free.
    cache_type: q8_0          # q8_0 K/V (needs flash-attn, which --flash-attn auto engages). At ctx 16384 this
                              # keeps KV GTT ~= the original f16-@-8192 footprint; near-lossless.
    extra: "--no-mmap"
    swap: true                # MANAGED on node3's llama-swap (sole model; loads on request, idle-unloads)
    ttl: 1800                 # 30 min idle (raised from 900 to keep a Q&A session warm)

  # gpt-oss-120b: RETIRED from node3 on 2026-07-08 to end the two-heavyweight swap-thrash (see the
  # "Why node3 is SINGLE-MODEL" note above). The GGUF stays staged on node3's /models-local for a fast
  # bring-back, but it is intentionally NOT registered here or in llama-swap: node3 cannot serve both.
