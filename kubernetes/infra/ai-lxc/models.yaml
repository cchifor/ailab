# AI-LXC model catalog — the human source of truth for which node serves which model(s) and whether a
# model is PINNED (always resident) or MANAGED (idle-unloaded on demand via llama-swap).
#
# This file is documentation + a deploy checklist, NOT auto-applied: the appliance is provisioned by
# `scripts/lxc-exec.py <host> <ctid> --env ... bash provision.sh`. Each entry maps to a provision command
# in docs/runbooks/ai-model-swap.md. Keep the max_input_tokens in kubernetes/apps/apps/ai/litellm.yaml in
# sync with `ctx`.
#
# Topology (2026-09-16):
#   node1         : NO managed model. It held qwen3.8-27b on :8082 until 2026-09-16; the instance was
#                   retired because node1 is the thinnest node in the estate (7-day-minimum
#                   MemAvailable 4.73 GiB) and also carries a Talos control plane, three CI runners
#                   and two dev-workers. A LAZY load arrives all at once, so the weekly floor is the
#                   number that matters, not the current value.
#   node2 :8082   : qwen3.8-27b MANAGED (llama-swap, ttl 1800), ctid 5002 / .45. Replaced
#                   qwen3.6-35b-a3b, which was removed the same day -- node2 cannot hold both
#                   (22.38 + 22.45 = 44.83 GiB). Net memory change ~-0.07 GiB.
#   node3 :8082   : qwen3.8-27b MANAGED (llama-swap, ttl 1800), ctid 5003 / .46. Paid for by retiring
#                   ci-runner-7 (10.40 GiB measured), which took node3's weekly floor 18.15 -> ~28.6.
#                   Before that, NO node in the estate could absorb a 22.45 GiB lazy load at its floor.
#
# The two instances share ONE LiteLLM model_name (qwen3.8-27b-ailab) as two deployments, routed by
# least-busy. Note least-busy ties break FIRST-IN-DICT, so under purely SEQUENTIAL traffic the second
# deployment is rarely selected: treat it as HA + concurrency headroom, not load-spreading.
#
# node3 previously served ONLY qwen3.5-122b on demand, until 2026-09-08 when it moved to the cloudlab
# estate (cloud3) where it is fully VRAM-resident. Reclaim status of node3's /models-local (the copies
# of record stay on the QNAP at /models/, so both are re-stageable):
#   * gpt-oss-120b, 60 GiB  — DELETED 2026-09-08, after verifying all three shards byte-for-byte
#     against NFS. Took the volume from 88% to 49% full.
#   * qwen3.5-122b, 72 GiB  — STILL STAGED.
# Removing an entry here does NOT by itself stop a running unit — this file is intent, read only when
# provision.sh is deliberately re-run — so a retirement is always paired with a manual unit stop.
#
# Why node3 is SINGLE-MODEL (2026-07-08): qwen3.5-122b (~71 GiB) and gpt-oss-120b (~59 GiB) cannot
# co-reside in node3's 96 GiB iGPU LXC, so llama-swap could hold only one at a time. With interactive
# traffic hitting qwen3.5-122b and the deepagent platform hitting gpt-oss, the two demand streams
# interleaved and forced a full evict+cold-reload on nearly every crossover (measured ~55-82s PER
# request, 4/4). Serving a single heavyweight ends the thrash. gpt-oss's LiteLLM model_name was shimmed
# to qwen3.6, which was REMOVED 2026-09-16 -- check kubernetes/apps/apps/ai/litellm.yaml for where that
# alias points now before assuming a gpt-oss caller still works. node3 now serves qwen3.8-27b, so the
# single-model constraint binds again: bringing gpt-oss back means giving that up.
#
# ttl semantics (llama-swap): 0 = pinned (load once, never idle-unload); >0 = idle seconds before unload
# (returning GTT to the host). swap:false => direct llama-server.service (no llama-swap). Managed models
# are STAGED on local NVMe (/models-local — an out-of-band `pct set` mount) so cold reload is ~2-4 GB/s
# (~30-60s) vs ~300 MB/s over NFS; `gguf` = local copy, `stage_from` = NFS source (provision.sh rsyncs it).

models:
  # ---- On-prem quality tier: qwen3.8-27b, MANAGED on node2 + node3 (dense, vision-capable) ----
  # qwen3.6-35b-a3b REMOVED 2026-09-16. It served node2 (.45:8080) and was the estate's only
  # always-on terminal fallback, holding a measured 22.38 GiB of iGPU GTT. Retired for three
  # reasons: (1) node2 is the only node that could host a qwen3.8-27b instance, and it cannot
  # hold both (22.38 + 22.45 = 44.83 GiB); (2) its LiteLLM route declared max_input_tokens
  # 114688 while the live process served `-c 32768 --parallel 4` = 8192 per slot -- a 14x
  # over-declaration on the route every overnight failover landed on; (3) it ran a DIRECT
  # llama-server.service with provision.sh's bare defaults, no --mmproj and no KV quant, so
  # this file's `swap: true / ttl 1800 / ctx 262144 / parallel 2 / mmproj` entry was false on
  # every axis. Consumers move to qwen3.8-27b-ailab; see kubernetes/apps/apps/ai/litellm.yaml
  # and litellm-local.yaml.
  #
  # ---- the entry below is qwen3.8-27b, unrelated to the tombstone above ----
  # UN-RETIRED 2026-09-12, at a FULL WINDOW, and renamed `qwen3.8-27b-ailab`.
  #
  # IT WAS NEVER ACTUALLY GONE. The 2026-08-25 retirement (commit 1acd59cc) removed the k8s/LiteLLM
  # routing and said the unit and config dir "are removed on the host by the retire step". They were
  # not: `llama-swap-qwen38.service` has been active and listening on 0.0.0.0:8082 continuously since
  # 2026-08-18, idle-unloaded by its own ttl. Only the routing was gone, so the memory it was retired
  # to release was never actually released either. This entry stops the file disagreeing with the host.
  #
  # THE RETIREMENT WAS ARGUED AGAINST A NUMBER THAT WAS ALREADY STALE. 1acd59cc cites "31.4 GiB on a
  # node measured at 24.9 GiB free". That 31.4 GiB is the Q6_K @ ctx 262144 figure from 6c17046c.
  # b25953b1 had already cut the quant to UD-Q4_K_XL ten days earlier ("32115 -> 27288 MiB loaded",
  # docs/runbooks/ai-model-swap.md), and an unrecorded re-provision on 2026-08-18 had dropped ctx to
  # 65536. The real cost is ~2/3 of the number that retired it.
  #
  # SIZING, derived from GGUF metadata and checked against two measured GTT anchors (Q6_K 32,115 MiB
  # and UD-Q4_K_XL 27,288 MiB, both at ctx 262144; residuals agree within 100 MiB):
  #   16 full-attention layers (block_count 65, 1 nextn_predict layer, full_attention_interval 4)
  #   x 4 KV heads x (256 + 256) x 1.0625 B (q8_0) = 34,816 B/token
  #   fixed  = weights 16.69 + mmproj 0.86 + compute ~0.65      = 18.20 GiB
  #   ctx 131072 KV                                              =  4.25 GiB
  #                                                        total = 22.45 GiB
  # SUPERSEDED 2026-09-16 on placement, not on arithmetic. The 22.45 GiB total above is CORRECT --
  # independently confirmed by measuring a real load/unload on node1 (MemAvailable 24.99 -> 4.73 on
  # load, rebounding to 47.45 on unload; unload delta 22.46 GiB, agreeing to within 10 MiB).
  # What was wrong was the node1 headroom claim: the "34 GiB available" was a TRANSIENT measured
  # seconds after ci-runner-8 was destroyed. node1's quiet-day floor is 22.7-23.8 GiB and its
  # 7-day minimum is 4.73, so the load did NOT fit with ~11 GiB spare -- it fit only at the instant
  # it was measured. This is why the instance moved to node2 + node3; see the header topology.
  #
  # parallel: 2, NOT 1, and the reason is routing rather than throughput. `ctx` is TOTAL KV shared
  # across slots, so per-slot n_ctx = 131072/2 = 65536 and litellm max_input_tokens = 65536 - 16K
  # headroom = 49152. The second slot costs only another copy of the recurrent state (bounded by the
  # ~0.65 GiB measured residual), and it exists because LiteLLM 1.91.0 does not propagate a client
  # disconnect: on --parallel 1 an abandoned request kept decoding 7+ minutes with no client attached
  # and only a systemctl restart freed the slot (measured 2026-08-15, litellm.yaml carries the full
  # note). Two slots means one orphan cannot wedge the route. It REDUCES the odds, it does not
  # eliminate them -- two concurrent orphans still block both.
  #
  # SPEC DECODE IS CONFIGURED AND HAS NEVER RUN. The live unit has carried
  # `--spec-type draft-mtp --spec-draft-n-max 2 --spec-draft-type-k/-v q8_0` since 2026-08-18 and the
  # journal shows not one model load since -- 158,359 lines, all health polls. The checkpoint has an
  # MTP head (`qwen35.nextn_predict_layers` in the GGUF header) and build b10456 accepts the flag, so
  # it should work; upstream measures ~1.81x on a 27B dense Q4 on this exact silicon. It is carried
  # through here via EXTRA_ARGS because provision.sh has no SPEC_* knob. UNMEASURED on this estate:
  # the 11.49 tok/s figure in the runbook predates these flags and describes a different config.
  # Benchmark it before quoting a number.
  # TWO INSTANCES since 2026-09-16, on node2 and node3. node1 LOSES its instance.
  #
  # WHY NOT node1. A lazy load arrives ALL AT ONCE, so the test is each node's WORST case, not its
  # current value. Measured 7-day-minimum MemAvailable: node1 4.73, node2 11.70, node3 18.15 GiB
  # against this model's 22.45. node1 is the thinnest node in the estate and also carries a Talos
  # control plane; a lazy load there at a bad moment lands in a 4.73 GiB hole. The "34 GiB available"
  # figure the previous revision relied on was a TRANSIENT measured seconds after ci-runner-8 was
  # destroyed -- node1's quiet-day floor is 22.7-23.8 GiB and its weekly floor is 4.73.
  #
  # WHAT PAID FOR EACH HOME:
  #   node2 -- retiring qwen3.6-35b-a3b, which held a measured 22.38 GiB of iGPU GTT (Strix Halo
  #            carves GTT from system RAM). Net swap: 22.38 out, 22.45 in, -0.07 GiB. node2 keeps the
  #            resource profile it had, with a newer model and an honest context declaration.
  #   node3 -- retiring ci-runner-7 (measured 10.40 GiB RSS), taking node3's weekly floor from
  #            18.15 to ~28.6 GiB: a 22.45 GiB load clears with +6.1 GiB margin. See
  #            kubernetes/infra/runners/variables.tf.
  #
  # BOTH STAY LAZY (ttl 1800). Pinning either (ttl 0) costs 22.45 GiB permanently and NO node in the
  # estate can hold that at its weekly floor without displacing something. llama-swap keeps :8082
  # listening either way, so the ENDPOINT is always-on and a failover always lands somewhere; the
  # only cost is a cold load, bounded by healthCheckTimeout 900 and litellm request_timeout 900.
  qwen3.8-27b:
    nodes: [ai-node2, ai-node3]   # ctid 5002 / .45 and ctid 5003 / .46, both on :8082
    instance: qwen38              # INSTANCE=qwen38 -> its own unit + /etc/llama-swap-qwen38/
    port: 8082                    # node2's daily driver :8080 is retired with qwen3.6; node3 has none
    alias: qwen3.8-27b-ailab      # -ailab distinguishes this on-prem route from the -cloud ones
    build: b10456                 # per-instance build, installed alongside; supports --spec-type.
    # ROLLED BACK from b10573 on 2026-09-16, and this COSTS THE WebP DECODE PATH -- read on before
    # bumping it again. b10573 is the build that gained WebP (PR #27520, merged 2026-08-21) via an
    # ffmpeg subprocess; b10456 has none, VERIFIED on the boxes (libmtmd.so in b9672/b10430/b10456
    # contains ZERO "webp" strings, b10573's contains two). So on THIS route an agent that renders an
    # image and reads it back as WebP still gets `Failed to load image or audio file`. The
    # qwen3.8-flash-next-cloud route is UNAFFECTED: cloud3 runs its own newer build and got ffmpeg
    # installed the same day. ensure_ffmpeg in provision.sh is deliberately KEPT -- it is correct, it
    # is idempotent, and it means a future re-bump needs a one-line change here and nothing else.
    #
    # WHY THE ROLLBACK. A b10573 load on node3 WEDGED THE iGPU. The estate's UMA carve is 512 MiB of
    # VRAM on all three nodes (measured: mem_info_vram_total 536870912 on node1, node2 and node3
    # alike) and that budget holds the page tables for the GTT mapping, not the weights. The stuck
    # process sat at 487 MiB of VRAM having mapped only 20.63 GiB of GTT, then blocked forever in
    # drm_suballoc_new -- waiting on a fence that could never arrive, because every ring was already
    # drained (signaled == emitted on all of them, sdma0 included). amdgpu later confirmed it:
    # "device wedged, but recovered through reset".
    #
    # THE CONTROL. node1 served the SAME model on b10456 through the live route during the incident:
    # full load in 31 s, correct answer with reasoning_content intact, peaking at 392 MiB of VRAM for
    # a COMPLETE 23.58 GiB GTT mapping. More model, less VRAM. That is the whole case for this pin.
    #
    # WHAT IS AND IS NOT PROVEN. PROVEN: b10456 fits, with ~120 MiB of headroom under the 512 MiB
    # ceiling. NOT PROVEN: that b10573 is inherently heavier. Its 487 MiB was read mid-wedge, after
    # earlier failed attempts on that node, so fragmentation is not excluded. Do not write "b10573
    # uses more VRAM" into a runbook on this evidence -- the honest statement is that b10456 is
    # measured-good and b10573 is unproven and coincided with the failure. A clean A/B is cheap once
    # node3 is rebooted: provision each build in turn and read mem_info_vram_used at full load.
    #
    # THE REAL CEILING IS THE BIOS. 120 MiB of headroom on a 512 MiB carve is thin for any build.
    # Raising the UMA frame-buffer size in BIOS is the durable fix and would make the WebP bump safe
    # again; it needs physical/IPMI access and a reboot per node, so it is a maintenance-window
    # decision, not something to attempt from here.
    gguf: /models/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_XL.gguf   # NFS; NOT Q6_K -- see the runbook
    mmproj: /models/qwen3.8-27b/mmproj-F16.gguf             # vision; BOTH instances pass it
    ctx: 131072               # TOTAL KV across slots; per-slot = ctx/parallel = 65536
    parallel: 2               # keep litellm max_input_tokens (49152 = 65536 - 16K) in sync
    cache_type: q8_0          # K + V
    swap: true                # llama-swap, so it idle-unloads rather than holding 22.45 GiB
    ttl: 1800                 # idle-unload after 30 min -- LAZY BY DESIGN, see the block above
    # PRESENCE_PENALTY=0.0 is REQUIRED (provision.sh defaults to 1.5, Qwen3.8's INSTRUCT profile;
    # this runs in thinking mode, whose card specifies 0.0). REASONING_BUDGET=16384 matches the live
    # unit, not the runbook's stale 3000.
  # ---- node3 llama-swap SINGLE-MODEL — qwen3.5-122b on demand (ctid 5003 / .46) ----
  # Deploy via a single-MODEL provision call (SWAP=true, no MODELS_JSON) — see docs/runbooks/ai-model-swap.md.
  # qwen3.5-122b REMOVED 2026-09-08 — moved to the cloudlab estate (cloud3, llama-swap on
  # 192.168.0.26). node3's iGPU LXC could not hold it, so MoE experts spilled to host RAM and it
  # measured 16.6 tok/s; on cloud3 the 72 GiB of Q4_K_M weights fit entirely in 96 GiB of VRAM
  # across four RTX 3090s and it measures 60.6-66.2 tok/s. ~4x, from residency alone.
  #
  # ai-node3 therefore has NO managed model. The LXC (ai-llm-3, vmid 5003, .46) is kept, empty.
  # The "node3 is SINGLE-MODEL" constraint in the header above no longer binds anything: it existed
  # because qwen3.5-122b (~71 GiB) and gpt-oss-120b (~59 GiB) could not co-reside. That slot is now
  # free, so gpt-oss-120b COULD return here — a capacity decision, not a correctness one, and
  # deliberately not taken in this change.
