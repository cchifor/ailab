# Talos Image Factory schematic IDs that are NOT modelled as a talos_image_factory_schematic resource.
# Single source for every root module that needs them (yamldecode(file(...))), so the agent-nodes and
# env-pool pools cannot drift apart. The control-plane schematic is the resource in image.tf.
#
# Each value must equal what the nodes run: `talosctl get extensions` (the `schematic` entry), which
# is also what scripts/talos-upgrade-node.sh upgrades with. Changing a node's extensions = a new
# schematic here + a wrapper upgrade of that node, in the same change.

# qemu-guest-agent + iscsi-tools + util-linux-tools + kata-containers + gvisor.
# Runs on agent-node-3 (since AgentForge P2) and on the env pool (env-node-1).
