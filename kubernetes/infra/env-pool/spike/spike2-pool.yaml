# Spike 2: agent-sandbox lease-layer semantics on the proven env-pod shape.
# SandboxTemplate (two-container dind+control, golden-snapshot VCT) + WarmPool(1).
# Readiness authority = the control container: it opens TCP :9099 only after dockerd answers
# /_ping over the shared socket; probes are tcpSocket (no exec-through-kata-agent, and the dind
# container's cgroup is un-probeable once dockerd starts — finding F5).
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: env-std-spike
  namespace: testpool-spike
spec:
  podTemplate:
    metadata:
      labels:
        app: env-std-spike
    spec:
      runtimeClassName: kata-env-spike
      automountServiceAccountToken: false
      dnsPolicy: "None"
      dnsConfig:
        nameservers: ["1.1.1.1", "9.9.9.9"]
      terminationGracePeriodSeconds: 10
      containers:
        - name: dind
          image: docker.io/library/docker:28.3-dind
          securityContext:
            privileged: true
          command: ["sh", "-c"]
          args:
            - |
              set -x
              date +%s.%N > /work/t0-entrypoint
              apk add --no-cache e2fsprogs >/work/apk.log 2>&1 || { echo APK-FAIL; exit 3; }
              DEV=/dev/dockerblk
              mkdir -p /var/lib/docker
              if ! mount -o defaults,noatime "$DEV" /var/lib/docker 2>/work/mount1.err; then
                mkfs.ext4 -q -L dockerlib "$DEV"
                mount -o defaults,noatime "$DEV" /var/lib/docker
              fi
              date +%s.%N > /work/t0c-mounted
              dockerd-entrypoint.sh dockerd --host=unix:///run/dsock/docker.sock --registry-mirror=https://registry.chifor.me >/work/dockerd.log 2>&1 &
              export DOCKER_HOST=unix:///run/dsock/docker.sock
              i=0
              until docker version >/dev/null 2>&1; do
                i=$((i+1)); [ $i -gt 1200 ] && echo "DOCKERD NEVER READY" && tail -40 /work/dockerd.log && exit 1
                sleep 0.2
              done
              date +%s.%N > /work/t1-dockerd-ready
              docker info --format '{{.Driver}}' | grep -q overlay2 || { echo "FATAL: not overlay2"; exit 2; }
              echo ENV-DIND-OK
              sleep infinity
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "5", memory: 10Gi }
          volumeDevices:
            - name: dockerlib
              devicePath: /dev/dockerblk
          volumeMounts:
            - { name: shm, mountPath: /dev/shm }
            - { name: dsock, mountPath: /run/dsock }
            - { name: work, mountPath: /work }
        - name: control
          image: docker.io/library/docker:28.3-cli
          command: ["sh", "-c"]
          args:
            - |
              i=0
              until docker version >/dev/null 2>&1; do
                i=$((i+1)); [ $i -gt 2400 ] && echo CONTROL-GAVE-UP && exit 1
                sleep 0.2
              done
              date +%s.%N > /work/t2-control-ready
              ( while true; do nc -l -p 9099 -s 0.0.0.0 </dev/null >/dev/null 2>&1 || sleep 0.2; done ) &
              echo ENV-CONTROL-READY
              sleep infinity
          env:
            - name: DOCKER_HOST
              value: unix:///run/dsock/docker.sock
          startupProbe:
            tcpSocket: { port: 9099 }
            periodSeconds: 1
            failureThreshold: 300
          readinessProbe:
            tcpSocket: { port: 9099 }
            periodSeconds: 2
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          volumeMounts:
            - { name: dsock, mountPath: /run/dsock }
            - { name: work, mountPath: /work }
      volumes:
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
        - name: dsock
          emptyDir: {}
        - name: work
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: dockerlib
      spec:
        accessModes: ["ReadWriteOnce"]
        volumeMode: Block
        storageClassName: testpool-spike-iscsi
        dataSource:
          apiGroup: snapshot.storage.k8s.io
          kind: VolumeSnapshot
          name: golden-spike-v2
        resources:
          requests:
            storage: 40Gi
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: env-std-pool
  namespace: testpool-spike
spec:
  replicas: 1
  sandboxTemplateRef:
    name: env-std-spike
