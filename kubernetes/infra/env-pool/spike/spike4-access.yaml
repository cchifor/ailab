# Spike 4: standing per-worker namespace-scoped access (the plan's v1 credential design).
# Role grants exactly what tep needs; exec/attach/portforward carry BOTH create+get for the
# 1.31->1.37 SPDY/WebSocket RBAC-verb transition.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tep-worker-spike
  namespace: testpool-spike
---
apiVersion: v1
kind: Secret
metadata:
  name: tep-worker-spike-token
  namespace: testpool-spike
  annotations:
    kubernetes.io/service-account.name: tep-worker-spike
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tep-worker
  namespace: testpool-spike
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxwarmpools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach", "pods/portforward"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tep-worker
  namespace: testpool-spike
subjects:
  - kind: ServiceAccount
    name: tep-worker-spike
    namespace: testpool-spike
roleRef:
  kind: Role
  name: tep-worker
  apiGroup: rbac.authorization.k8s.io
