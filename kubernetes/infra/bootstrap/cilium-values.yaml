# Cilium values for Talos (kube-proxy-free via KubePrism on localhost:7445).
#
# LIVE: chart cilium/cilium 1.19.8 (Helm release kube-system/cilium, revision 5, upgraded 2026-10-09
# from 1.18.14). Keep this line equal to `helm -n kube-system list` and update it in the same change
# as every hop. Initial install: cilium-1.16.5 (Helm revision 1, 2026-06-14).
#
# Cilium is HAND-INSTALLED with Helm, not managed by Flux (no HelmRelease exists): bootstrap with
# these values, and upgrade one minor per hop (docs/runbooks/talos-upgrade.md, "Addons"):
#   helm --kube-context admin@ai -n kube-system upgrade cilium cilium/cilium --version <v> -f kubernetes/infra/bootstrap/cilium-values.yaml --set upgradeCompatibility=1.16
# upgradeCompatibility = the version INITIALLY INSTALLED in this cluster (1.16), per Cilium's upgrade
# guide. It keeps that install's datapath-affecting defaults, and it is NOT the previous minor. The
# 2026-10-09 hops passed the previous minor (1.16 -> 1.17 -> 1.18), so for chart 1.19.8 the live
# release has tls.secretSync on (enable-policy-secrets-sync plus an operator Role in cilium-secrets).
# That is the only rendered difference from 1.16 here, and it is unused: there is no Cilium
# Ingress/Gateway or TLS-interception policy (ingress classes are traefik and tailscale). The next hop
# with =1.16 turns it back off.
# upgradeCompatibility is deliberately NOT in this file: it is an upgrade-time setting, and a fresh
# install from this file must get the current defaults. Run the pre-flight check first.
ipam:
  mode: kubernetes
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445
securityContext:
  capabilities:
    ciliumAgent:
      [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
operator:
  replicas: 1
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
